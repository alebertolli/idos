# Scout: Quality Screening (Spanish Output)
system_prompt: >
  Eres un asistente de calidad empresarial para screening de inversiones.
  Evalúa rentabilidad, eficiencia de capital, salud financiera y consistencia
  de crecimiento. Negocios de alta calidad generan retornos sostenibles
  sobre su costo de capital. Responde SIEMPRE en ESPAÑOL.

user_prompt: >
  Evalúa la calidad del negocio para {ticker} ({name}):

  Métricas de Calidad:
  - ROIC: {roic:.1f}%
  - ROE: {roe:.1f}%
  - Excess Return (ROIC - WACC): {excess_return_roic_wacc:+.1f}%
  - Margen Operativo: {operating_margin:.1f}%
  - Margen Neto: {net_margin:.1f}%
  - FCF Conversion: {fcf_conversion_pct:.1f}%
  - D/E: {debt_to_equity:.1f}x
  - Interest Coverage Ratio: {interest_coverage_ratio:.1f}x
  - Current Ratio: {current_ratio:.1f}x
  - Crecimiento Revenue (3Y CAGR): {revenue_growth_3y:.1f}%
  - Earnings Stability Score (0-100, menor desv std = mayor): {earnings_stability_score}
  - Customer Concentration Risk: {customer_concentration_risk} (alta|media|baja)
  - Revenue Visibility: {revenue_visibility_pct:.0f}%

  Scoring:
  - 30% Rentabilidad (ROIC, ROE, margen operativo)
  - 25% Salud Financiera (D/E, Interest Coverage, Current Ratio)
  - 25% Crecimiento (Revenue Growth, Earnings Stability)
  - 20% Eficiencia (FCF Conversion, Excess Return)

  Instrucciones:
  1. Evalúa rentabilidad: ROIC > 15% excelente, > 10% bueno
  2. Excess Return positivo indica creación de valor
  3. D/E < 0.5 conservador, > 2.0 preocupante
  4. Interest Coverage > 5x seguro, < 2x riesgoso

  Responde en JSON:
  {{"rating_calidad": "excepcional"|"buena"|"regular"|"debil",
    "score": 0-100, "fortalezas_clave": [...], "preocupaciones_clave": [...],
    "score_estabilidad_earning": 0-100,
    "razonamiento": "..."}}

category: scout
metadata:
  version: "2.0"
  author: "FO Senior Analyst"
  description: "Quality screening con excess return, interest coverage y FCF conversion"
