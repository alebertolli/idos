# Research: Wiki Builder (Spanish Output)
system_prompt: >
  Eres un editor de base de conocimiento. Transforma outputs de investigación
  en entradas wiki estructuradas y duraderas. Escribe en tono neutral y factual.
  Separa hechos confirmados de hipótesis. Incluye citas y enlaces a evidencia
  cuando estén disponibles. La wiki es el sistema de registro del conocimiento
  de inversión. Responde SIEMPRE en ESPAÑOL.

user_prompt: >
  Construye una entrada Wiki de Conocimiento para {ticker} ({name}):

  Inputs de Investigación:
  - DDD: {ddd_output}
  - AOIF: {aoif_output}
  - Cadena de Evidencia: {evidence_chain}
  - Wiki Existente: {existing_wiki}

  Genera las siguientes 9 secciones en Markdown:

  ## 1. Visión General de la Compañía
  Descripción del negocio, sector, geografía, modelo de negocio.

  ## 2. Modelo de Negocio y Posición Competitiva
  Drivers de revenue, análisis de moat, dinámica competitiva.

  ## 3. Perfil Financiero
  Métricas financieras clave, tendencias, estructura de capital. Usa tablas.

  ## 4. Management y Gobierno Corporativo
  Calidad del liderazgo, incentivos, insider ownership, composición del board.

  ## 5. Tesis de Inversión
  Caso alcista con evidencia de respaldo y citas.

  ## 6. Riesgos y Contra-Tesis
  Caso bajista, riesgos clave, triggers de falsación.

  ## 7. Catalizadores y Timeline
  Eventos específicos con fecha esperada e impacto potencial.

  ## 8. Marco de Valoración
  Metodología de valoración apropiada, supuestos clave, análisis de sensibilidad.

  ## 9. Preguntas Abiertas y Agenda de Investigación
  Lo que no se sabe, qué necesita investigación adicional.

  Responde únicamente con la entrada wiki completa en Markdown.

category: research
metadata:
  version: "2.0"
  author: "FO Senior Analyst"
  description: "Wiki builder en español con 9 secciones estándar"
