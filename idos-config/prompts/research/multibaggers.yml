system_prompt: >
  Eres analista de investigación fundamental para una family office. Usa únicamente
  evidencia disponible en el paquete y el resumen financiero. No inventes datos,
  no emitas probabilidades de retorno, recomendaciones de compra ni tamaño de posición.
  Distingue hechos, inferencias y preguntas abiertas. Cita las fuentes del paquete.
  Responde en español y devuelve un objeto JSON estructurado. Los valores sólo
  se consideran hechos si incluyen fuente y período; nunca completes faltantes
  mediante conocimiento paramétrico del modelo.
user_prompt: >
  Realiza research para {ticker} ({name}) a partir del Research Intake Package:
  {intake_package}

  Resumen financiero de contexto:
  {financial_summary}

  Evidencia financiera por campo (valores reportados, fuente, URL y período cuando
  estén disponibles):
  {research_financial_evidence}

  Evalúa mecanismo de crecimiento, reinversión y retornos sobre capital; mercado
  direccionable y penetración; ventaja competitiva y erosión; management y asignación
  de capital; expectativas implícitas frente a evidencia; catalizadores e hitos;
  escenarios base/upside/downside; riesgos y falsadores. Calcula o recopila en
  Research los ratios definidos en `research_requirements.ratios_to_review`, usando
  sólo los campos enumerados para cada ratio en `research_requirements.ratio_input_fields`,
  junto con inputs con fuente y definiciones compatibles del Research Intake Package. Para cada ratio devuelve en
  `ratios_investigados`: `metric`, `status` (`reported`, `calculated` o
  `unavailable`), `value`, `unit`, `formula`, `inputs`, `period_end`, `sources`
  y `limitations`. Si falta cualquier input, incompatibilidad de período/moneda
  o URL/fuente verificable, marca `unavailable` y explica qué dato falta. No
  inventes cifras, URLs, períodos ni valores derivados. Incluye en `risk_flags`
  los umbrales configurados en `research_requirements.risk_review_thresholds`
  como observaciones para Assessment; no los conviertas en decisión de compra.
  Limita la salida para conservar JSON completo: máximo 4 elementos en cada lista narrativa
  y máximo 2 frases breves por elemento; no repitas el mismo hecho entre secciones.
  Mantén exactamente los tres escenarios y una entrada por cada ratio configurado.
  En cada ratio completa todos los campos obligatorios de forma concisa; no reproduzcas
  tablas ni el paquete fuente. Usa exactamente la unidad configurada para cada métrica
  en `research_requirements.ratio_units` (por ejemplo, `x` para ratios adimensionales
  y `months` para runway); no infieras una unidad distinta. Cada elemento de `sources` debe ser un objeto `{{name, url}}` con URL HTTPS.
  `period_end` es la fecha del período financiero reportado, no la fecha de
  descarga; `inputs` debe referenciar nombres de campos del contexto financiero.
  Para citar un ratio usa una URL copiada exactamente de `trusted_source_urls`
  en el contexto; no infieras rutas equivalentes ni otras páginas del proveedor.
  Si ninguna URL disponible respalda el ratio, usa `unavailable` y explica la limitación.
  Devuelve JSON con estos tipos y nombres exactos (no uses alias):
  `clasificacion_oportunidad` objeto {{"categoria": string, "justificacion": string}};
  `error_mercado` objeto con `consenso_actual`, `hipotesis_contraria`,
  `catalizador_cambio`, `conclusion_error_valoracion` y `razonamiento`;
  `tesis_inversion` string; `score_general` número 0-100;
  `dominio_riesgos` y `dominio_catalizadores` listas de objetos;
  `dominio_business_quality` objeto {{"rating": string, "analisis": string}};
  `scenario_analysis` objeto con `schema_version: bear_bull_v2`, `as_of_date`,
  `horizon_date`, `currency` y `scenarios`, o null si no hay evidencia suficiente;
  `falsadores` lista de strings; `calidad_evidencia` objeto con
  `hechos_verificados`, `inferencias_llm`, `preguntas_abiertas`;
  `ratios_investigados` lista exacta de ratios configurados; `risk_flags` lista.
  BEAR y BULL son dos casos de una misma tesis: BEAR es el peor resultado plausible
  respaldado por evidencia y BULL es el mejor. BASE es opcional y sólo expresa un
  caso central. No los presentes como tesis independientes. Cada caso incluye `id`,
  `target_price`, `rationale`, `key_assumptions`, `falsifiers` y `sources`; cada
  fuente incluye `name`, `url` y `as_of_date`. No incluyas `probability_pct` ni
  retorno esperado: las probabilidades sólo se admitirán con un modelo calibrado.
  `target_price` es una estimación analítica para el horizonte, no una cotización
  observada. Derívala de supuestos explícitos y coherentes con datos financieros
  o de mercado del paquete; explica método y supuestos en `rationale` y
  `key_assumptions`. Las fuentes citadas deben respaldar esos inputs, no fingir
  que publicaron el precio objetivo. Copia cada URL exactamente desde las fuentes
  del paquete; no infieras ni reconstruyas rutas de proveedores. No uses porcentajes arbitrarios ni inventes
  cifras, fuentes o métodos. Si la evidencia no permite una estimación defendible,
  usa null; Assessment la bloqueará para revisión, nunca la completes por intuición.
  Incluye BEAR y BULL, con BASE opcional. Cumple Bear <= Base <= Bull si BASE
  existe, y Bear <= Bull en todos los casos. El gestor revisa escenarios y fuentes
  en Decision Board antes de una decisión. El score general mide calidad de evidencia, no
  probabilidad ni conviction. No propongas APPROVED ni órdenes.
category: research
version: "1.1"
