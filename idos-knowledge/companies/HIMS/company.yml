business_model: Hims & Hers Health, Inc. operates as a consumer-first health and wellness
  platform that connects consumers to licensed healthcare professionals in the United
  States, the United Kingdom, Canada, Germany, the Republic of Ireland, France, Spain,
  and internationally. The company offers a range of curated prescription and non-prescription
  health and wellness products and services available to purchase on its websites
  and mobile application directly by customers. It also provides personalized health
  and wellness products; over-the-counter drug and device products, cosmetics, and
  supplement products primarily focusing on general wellness, skincare, sexual health
  and wellness, and hair care under the Hims & Hers brand name; and laboratory testing
  services to measure a set of biomarkers. Additionally, it offers medical consultation,
  post-consultation support services, and delivery of laboratory testing results services.
  Further, the company provides treatments and products for various chronic conditions
  related to hormone health, weight loss, dermatology, and mental health. The company
  offers its products through retail partnerships, in stores, and online. Hims & Hers
  Health, Inc. is based in San Francisco, California.
industry: Drug Manufacturers - Specialty & Generic
name: Hims & Hers Health, Inc.
sector: Healthcare
