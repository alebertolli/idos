business_model: Ambev S.A., through its subsidiaries, engages in the production, distribution,
  and sale of beer, draft beer, soft drinks, malt and food, and other beverages in
  Brazil, Central America and Caribbean, Latin America South, and Canada. The company
  offers beer, ready-to-drink cocktails and spritzers, soft drinks, water, teas, and
  isotonic drinks under the Brahma, Skol, Antarctica, Original, Quilmes, Andes Origen,
  Patricia, Paceha, Huari, Pilsen, Presidente, Balboa, Guaraná Antarctica, and Beats
  brands. It sells its products to distributors, supermarkets, and retailers within
  a broad distribution network. The company was founded in 1853 and is headquartered
  in São Paulo, Brazil. Ambev S.A. operates as a subsidiary of Interbrew International
  B.V.
industry: Beverages - Brewers
name: Ambev S.A.
sector: Consumer Defensive
