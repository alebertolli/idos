business_model: Newmont Corporation operates as a gold producer. It also explores
  for copper, silver, lead, zinc, and other metals. It has operations and/or assets
  in the United States, Papua New Guinea, Australia, Ghana, Suriname, Argentina, Dominican
  Republic, Chile, Peru, Ecuador, Mexico, and Canada. The company was founded in 1916
  and is headquartered in Denver, Colorado.
industry: Gold
name: Newmont Corporation
sector: Basic Materials
