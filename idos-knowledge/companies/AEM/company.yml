business_model: Agnico Eagle Mines Limited, a gold mining company, engages in the
  exploration, development, and production of precious metals. It explores for gold,
  silver, copper, and zinc. The company's mines are located in Canada, Australia,
  Finland, and Mexico; and with exploration and development activities in Canada,
  Australia, Europe, Latin America, and the United States. Agnico Eagle Mines Limited
  was incorporated in 1953 and is headquartered in Toronto, Canada.
industry: Gold
name: Agnico Eagle Mines Limited
sector: Basic Materials
