business_model: Airbnb, Inc., together with its subsidiaries, operates a platform
  for stays, experiences, and services worldwide. The company's marketplace connects
  hosts and guests online or through mobile devices to book spaces, experiences, and
  services. It also offers gift cards. The company was formerly known as AirBed &
  Breakfast, Inc. and changed its name to Airbnb, Inc. in November 2010. Airbnb, Inc.
  was founded in 2007 and is headquartered in San Francisco, California.
industry: Travel Services
name: Airbnb, Inc.
sector: Consumer Cyclical
