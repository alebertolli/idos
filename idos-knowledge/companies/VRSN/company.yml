business_model: VeriSign, Inc., together with its subsidiaries, provides internet
  infrastructure and domain name registry services that enable internet navigation
  for various recognized domain names worldwide. The company provides root zone maintainer
  services operating two of thirteen internet root servers; and registration services
  and authoritative resolution for the .com and .net domains, which support global
  e-commerce. It also operates directory for .name and .cc; and back-end systems for
  .edu domain names. The company was incorporated in 1995 and is headquartered in
  Reston, Virginia.
industry: Software - Infrastructure
name: VeriSign, Inc.
sector: Technology
