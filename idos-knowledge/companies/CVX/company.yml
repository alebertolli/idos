business_model: Chevron Corporation, through its subsidiaries, engages in the integrated
  energy and chemicals operations. It operates through Upstream and Downstream segments.
  The Upstream segment engages in the exploration for, development, production, and
  transportation of crude oil and natural gas; processing, liquefaction, transportation,
  and regasification of liquefied natural gas; transportation of crude oil through
  pipelines; transportation, storage, and marketing of natural gas; carbon capture
  and storage; and operation of a gas-to-liquids plant. The Downstream segment refines
  crude oil into petroleum products; markets crude oil, refined products, and lubricants;
  manufactures and markets renewable fuels; transports crude oil and refined products
  through pipeline, marine vessel, motor equipment, and rail car; and manufactures
  and markets commodity petrochemicals, plastics for industrial uses, and fuel and
  lubricant additives. The company operates in North America, South America, Europe,
  Africa, Asia, and Australia. The company was formerly known as ChevronTexaco Corporation
  and changed its name to Chevron Corporation in May 2005. Chevron Corporation was
  founded in 1879 and is headquartered in Houston, Texas.
