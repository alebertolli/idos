business_model: The fund generally will invest at least 80% of its assets in the component
  securities of its underlying index and in investments that have economic characteristics
  that are substantially identical to the component securities of its underlying index.
  The index is designed to measure equity market performance in the global emerging
  markets. The underlying index includes large- and mid-capitalization companies and
  may change over time.
name: iShares MSCI Emerging Markets ETF
