business_model: 'The fund generally invests substantially all, but at least 95%, of
  its total assets in the securities comprising the index. The index includes companies
  that have been identified as Financial companies by the Global Industry Classification
  Standard, including securities of companies from the following industries: financial
  services; insurance; banks; capital markets; mortgage real estate investment trusts;
  and consumer finance. The fund is non-diversified.'
name: State Street Financial Select Sector SPDR ETF
