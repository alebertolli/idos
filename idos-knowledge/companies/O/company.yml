business_model: Realty Income Corporation, an S&P 500 company, is real estate partner
  to the world's leading companies. They serve their clients as a full-service real
  estate capital provider. As of March 31, 2026, they have a portfolio of over 15,500
  properties in all 50 U.S. states, the U.K., and eight other countries in Europe.
  They are known as (The Monthly Dividend Company) and have a mission to invest in
  people and places to deliver dependable monthly dividends that increase over time.
  Since founding, they have declared 673 consecutive monthly dividends and are a member
  of the S&P 500 Dividend Aristocrats index for having increased dividend for over
  31 consecutive years. The firm was founded and incorporated in 1969 in Maryland
  and is based in San Diego, California.
industry: REIT - Retail
sector: Real Estate
