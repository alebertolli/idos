business_model: Philip Morris International Inc. operates as a tobacco company. The
  company offers cigarettes and smoke-free products, including heat-not-burn, e-vapor,
  and oral nicotine products under the IQOS, VEEV, and ZYN brands; and consumer accessories,
  such as lighters and matches. It also offers wellness products. The company was
  incorporated in 1987 and is headquartered in Stamford, Connecticut.
industry: Tobacco
name: Philip Morris International Inc.
sector: Consumer Defensive
