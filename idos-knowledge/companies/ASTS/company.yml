business_model: AST SpaceMobile, Inc., together with its subsidiaries, designs and
  develops the constellation of BlueBird satellites in the United States. The company
  provides a cellular broadband network in space to be accessible directly by smartphones
  for commercial use and other applications, as well as for government use. Its SpaceMobile
  service provides cellular broadband services to end-users who are out of terrestrial
  cellular coverage. The company was founded in 2017 and is headquartered in Midland,
  Texas.
industry: Communication Equipment
name: AST SpaceMobile, Inc.
sector: Technology
