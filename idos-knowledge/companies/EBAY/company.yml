business_model: eBay Inc., together with its subsidiaries, operates marketplace platforms
  that connect buyers and sellers in the United States, the United Kingdom, China,
  Germany, and internationally. Its marketplace platform includes its online marketplace
  at ebay.com, off-platform businesses, and the eBay suite of mobile apps. The company's
  platforms enable users to list, sell, buy, and pay various products. The company
  was founded in 1995 and is headquartered in San Jose, California.
industry: Internet Retail
name: eBay Inc.
sector: Consumer Cyclical
