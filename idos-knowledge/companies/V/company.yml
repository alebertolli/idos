business_model: Visa Inc. operates as a payment technology company in the United States
  and internationally. The company operates VisaNet, a transaction processing network
  that enables authorization, clearing, and settlement of payment transactions. It
  also offers credit, debit, and prepaid card products; tap to pay, tokenization,
  and click to pay services; Visa Direct, a platform which facilitates money movement,
  enabling clients to collect, hold, convert, and send funds across its network; and
  issuing solutions, such as airport lounge access, dining reservations, shopping
  experiences, event tickets, and seller offers. In addition, the company provides
  acceptance solutions, an omnichannel payment integration with e-commerce platforms;
  risk detection and prevention solutions; and advisory and other services comprising
  consulting practice, proprietary analytics models, data scientists and economists,
  marketing services, and managed services. It provides its services under the Visa,
  Visa Electron, V PAY, Interlink, and PLUS brands. The company serves consumers,
  sellers, financial institutions, and government entities. Visa Inc. was founded
  in 1958 and is headquartered in San Francisco, California.
industry: Credit Services
name: Visa Inc.
