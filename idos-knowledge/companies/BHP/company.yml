business_model: BHP Group Limited operates as a resources company in Australia, Europe,
  China, Japan, India, South Korea, rest of Asia, North America, South America, and
  internationally. The company operates through Copper, Iron Ore, and Coal segments.
  It also engages in the mining of copper, uranium, gold, zinc, lead, molybdenum,
  silver, iron ore, cobalt, and metallurgical and energy coal. In addition, the company
  is involved in the mining, smelting, and refining of nickel, as well as potash development
  activities. Further, it provides towing, freight, marketing and trading, marketing
  support, finance, administrative, and other services. BHP Group Limited was founded
  in 1851 and is headquartered in Melbourne, Australia.
industry: Other Industrial Metals & Mining
name: BHP Group Limited
sector: Basic Materials
