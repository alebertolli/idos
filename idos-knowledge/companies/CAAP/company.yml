business_model: Corporación América Airports S.A., through its subsidiaries, acquires,
  develops, and operates airport concessions. It operates 52 airports in Latin America,
  Europe, and Eurasia. The company was formerly known as A.C.I. Airports International
  S.à r.l. and changed its name to Corporación América Airports S.A. in September
  2017. The company was founded in 1998 and is based in Luxembourg, Luxembourg. Corporación
  América Airports S.A. operates as a subsidiary of A.C.I. Airports S.à r.l.
industry: Airports & Air Services
name: Corporación América Airports S.A.
sector: Industrials
