business_model: Golar LNG Limited designs, converts, owns, and operates marine infrastructure
  for the liquefaction of natural gas. The company operates in two segments, FLNG,
  and Corporate and Other. It engages in the regasification, storage, and liquefied
  natural gas (LNG) carrier transportation operations; operation of floating liquefaction
  natural gas (FLNG) vessels or projects; transportation of LNG carriers; and vessel
  management activities. The company was founded in 1946 and is headquartered in Hamilton,
  Bermuda.
industry: Oil & Gas Midstream
name: Golar LNG Limited
sector: Energy
