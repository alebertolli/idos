business_model: Twilio Inc., together with its subsidiaries, provides customer engagement
  platform solutions in the United States and internationally. The company provides
  various application programming interfaces and software solutions for communications
  between customers and end users, including messaging, voice, email, video interactions,
  digital engagement centers, marketing campaigns, and user authentication and identity
  solutions. It also offers software products to build direct and personalized relationships
  with their end users, such as Segment, a platform that provides tools to harness
  the power of contextual data by unifying real-time information collected throughout
  each customer's journey into a unique profile. Twilio Inc. was incorporated in 2008
  and is headquartered in San Francisco, California.
industry: Software - Infrastructure
name: Twilio Inc.
sector: Technology
