business_model: Taiwan Semiconductor Manufacturing Company Limited, together with
  its subsidiaries, manufactures, packages, tests, and sells integrated circuits and
  other semiconductor devices in Taiwan, China, Europe, the Middle East, Africa, Japan,
  the United States, and internationally. It provides various wafer fabrication processes,
  such as processes to manufacture complementary metal- oxide-semiconductor (CMOS)
  logic, mixed-signal, radio frequency, embedded memory, bipolar CMOS mixed-signal,
  and others. The company also involved in providing customer and engineering support
  services; manufacturing of masks; investment in technology start-up companies; research,
  designing, developing, manufacturing, packaging, testing, and sale of color filters;
  and investment activities. Its products are used in high performance computing,
  smartphones, Internet of things, automotive, and digital consumer electronics. Taiwan
  Semiconductor Manufacturing Company Limited was incorporated in 1987 and is headquartered
  in Hsinchu City, Taiwan.
industry: Semiconductors
name: Taiwan Semiconductor Manufacturing Company Limited
sector: Technology
