business_model: Ross Stores, Inc., together with its subsidiaries, operates off-price
  retail apparel and home fashion stores under the Ross Dress for Less and dd's DISCOUNTS
  brands in the United States. The company offers designer apparel, accessories, footwear,
  and home-fashioned products for the entire family. It sells its products to middle
  income households and households with lower to more moderate incomes. Ross Stores,
  Inc. was incorporated in 1957 and is headquartered in Dublin, California.
industry: Apparel Retail
name: Ross Stores, Inc.
sector: Consumer Cyclical
