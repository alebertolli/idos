  existing_wiki: '## 1. Visión General de la Compañía


    Corporación América Airports S.A. (CAAP) adquiere, desarrolla y opera aeropuertos
    mediante concesiones. La actividad combina servicios aeroportuarios y cargos asociados
    a pasajeros y aerolíneas con servicios comerciales y concesiones dentro de los
    aeropuertos. Sus principales clientes son aerolíneas y pasajeros.


    La compañía opera en el sector aeroportuario, una industria intensiva en capital
    y regulada. Su modelo está expuesto al tráfico aéreo, el turismo y la actividad
    económica, así como a las monedas y a las condiciones regulatorias de los países
    donde mantiene concesiones. Los materiales disponibles describen una cartera internacional,
    pero no especifican países, aeropuertos ni la duración de las concesiones.


    La wiki existente describe a CAAP como operadora de aeropuertos a través de subsidiarias
    y señala como compañías del mismo sector a [[ASR]]. Esa referencia aparece duplicada
    en el material original; no se aportan comparaciones operativas o financieras
    con dicha compañía.


    ## 2. Modelo de Negocio y Posición Competitiva


    CAAP obtiene o mantiene concesiones, financia y ejecuta inversiones aeroportuarias,
    y opera terminales e infraestructura. Los ingresos dependen principalmente del
    tráfico de pasajeros y de la actividad de las aerolíneas, además de los servicios
    comerciales y las concesiones aeroportuarias.


    Las concesiones pueden crear barreras de entrada debido a la escasez de ubicaciones
    viables, los requisitos de inversión y la regulación. Sin embargo, la evidencia
    aportada permite describir ese moat como **estrecho**, no como una ventaja competitiva
    duradera demostrada. La actividad también exige capital y está sujeta a condiciones
    específicas de cada concesión.


    La evaluación AOIF califica la posición competitiva como líder, pero no incluye
    datos sobre cuota de mercado, aeropuertos concretos o comparaciones con pares
    que permitan verificar esa conclusión. La dinámica sectorial depende del tráfico
    aéreo, el turismo, la actividad económica y la capacidad operativa.


    ## 3. Perfil Financiero


    Las métricas siguientes proceden de las observaciones incluidas en DDD y AOIF.
    Los materiales no identifican de forma completa la fuente, el periodo comparable
    o la moneda de todas las métricas; por tanto, no deben interpretarse como una
    serie financiera reconciliada.


    | Métrica | Observación | Periodo o referencia | Limitaciones |

    |---|---:|---|---|

    | Crecimiento de ingresos | 15,01% | TTM terminado el 2026-06-30 (DDD) | No se
    aporta metodología ni base de comparación. |

    | Crecimiento de ingresos | 16,65% | Periodo no especificado (AOIF) | No se indica
    si coincide con el periodo de DDD. |

    | Margen operativo | 23,06% | Periodo no especificado (AOIF) | Sin serie histórica
    o conciliación. |

    | ROIC | 18,24% | Periodo no especificado (AOIF) | No se especifican fórmula,
    periodo ni comparabilidad. |

    | FCF TTM | 457.070.000 | TTM; moneda del proveedor no especificada (DDD) | No
    se aportan flujo operativo, capex ni cálculo del FCF. |

    | FCF yield | 0 | Periodo no especificado (AOIF) | No se explica la metodología;
    no es posible reconciliarlo con el FCF TTM informado por DDD. |

    | EV/EBITDA | 5,39x | Periodo no especificado (AOIF) | No se proporcionan componentes
    ni fecha de cálculo. |

    | P/E | 12,21x | Periodo no especificado (AOIF) | No se especifican fecha ni base
    de beneficios. |


    AOIF describe la tendencia financiera como estable, pero no aporta series temporales
    que permitan comprobarla. DDD califica la salud financiera como adecuada, aunque
    faltan los datos necesarios para evaluar la deuda y la liquidez. **No hay información
    verificable en los materiales sobre deuda bruta o neta, caja, vencimientos, covenants,
    liquidez o cobertura de intereses.** Tampoco se puede distinguir el capex de mantenimiento
    del capex de expansión.


    ## 4. Management y Gobierno Corporativo


    Los materiales identifican a CAAP como subsidiaria de A.C.I. Airports S.à r.l.
    No aportan evidencia verificable sobre la trayectoria del equipo directivo, resultados
    de asignación de capital, propiedad accionaria de insiders, incentivos, composición
    del consejo o prácticas de gobierno corporativo.


    AOIF califica la calidad del management como regular, la asignación de capital
    como neutral y el alineamiento de insiders como moderado. Estas evaluaciones no
    vienen acompañadas de datos que permitan corroborarlas. La calidad del liderazgo
    y el alineamiento deben considerarse, por tanto, **no concluyentes**.


    ## 5. Tesis de Inversión


    **Tesis:** CAAP puede beneficiarse de la operación de aeropuertos bajo concesión,
    un modelo que combina activos de larga duración y posibles barreras de entrada
    con oportunidades de crecimiento asociadas al tráfico y a la actividad comercial
    aeroportuaria. La tesis depende de que ese crecimiento se traduzca de manera sostenible
    en caja y de que las obligaciones de concesión y las necesidades de inversión
    permitan retornos adecuados a través del ciclo.


    **Evidencia y puntos favorables reportados:**


    - AOIF informa crecimiento de ingresos de 16,65%, margen operativo de 23,06% y
    ROIC de 18,24%, aunque sin fechas o metodología suficientes para evaluar comparabilidad.

    - DDD informa crecimiento de ingresos TTM de 15,01% al 2026-06-30 y FCF TTM de
    457.070.000 en la moneda del proveedor, que no está especificada.

    - El negocio de concesiones puede ofrecer barreras de entrada por la escasez de
    ubicaciones viables, la inversión requerida y la regulación.

    - AOIF caracteriza la posición competitiva como líder, pero la información disponible
    no incluye respaldo comparativo independiente.


    La calificación general de calidad del negocio es **regular** y la oportunidad
    se clasifica como **cíclica**. Los indicadores citados son observaciones aisladas;
    no demuestran por sí solos la sostenibilidad de los retornos ni la conversión
    recurrente de beneficios en caja.


    ## 6. Riesgos y Contra-Tesis


    **Caso bajista:** el mercado podría estar valorando la compañía de forma razonable
    frente a riesgos que no se pueden cuantificar con los datos disponibles. Una caída
    del tráfico, condiciones desfavorables de concesión, necesidades elevadas de inversión
    o exposición cambiaria podrían limitar la generación de caja y los retornos. La
    falta de información sobre deuda, capex y concesiones impide medir la capacidad
    de resistencia ante esos escenarios.


    | Riesgo | Impacto | Probabilidad informada | Implicación |

    |---|---|---|---|

    | Cambios regulatorios, renegociación o términos desfavorables de concesión, incluidos
    límites tarifarios u obligaciones | Alto | Media | Pueden reducir ingresos, retornos
    o flexibilidad operativa. |

    | Recesión, menor demanda de viajes, interrupciones operativas o dificultades
    de aerolíneas | Alto | Media | Pueden reducir tráfico y actividad comercial aeroportuaria.
    |

    | Exposición a tipos de cambio | No cuantificado | No especificada | Puede afectar
    resultados y caja; faltan datos por moneda y país. |

    | Inversión y capex | No cuantificado | No especificada | La falta de desglose
    entre mantenimiento y expansión dificulta estimar el FCF sostenible. |

    | Endeudamiento y liquidez | No evaluable | No especificada | No se informan deuda,
    caja, vencimientos, covenants ni cobertura de intereses. |


    **Triggers de falsación o deterioro de la tesis:**


    - Caídas persistentes del tráfico o de los ingresos, sin recuperación compatible
    con la economía de las concesiones.

    - Deterioro de la conversión de resultados en caja, una vez disponibles series
    verificables de flujo operativo y capex.

    - Cambios, renegociaciones o límites regulatorios que reduzcan sustancialmente
    los retornos de las concesiones.

    - Evidencia de que la deuda, los vencimientos o las obligaciones de inversión
    restringen la liquidez o la capacidad de financiar operaciones.


    ## 7. Catalizadores y Timeline


    No se proporcionan eventos corporativos concretos ni fechas confirmadas de anuncios
    futuros. Los siguientes son catalizadores condicionales, no eventos programados:


    | Catalizador | Horizonte | Fecha esperada | Impacto potencial | Confianza |

    |---|---|---|---|---|

    | Resultados futuros que confirmen crecimiento de tráfico e ingresos y conversión
    sostenible a caja, con divulgación suficiente | Medio plazo | No especificada
    | Medio | Baja; probabilidad indicada: 45% |

    | Mayor reconocimiento del valor si se demuestra que el crecimiento y la generación
    de caja son sostenibles y que las concesiones mantienen retornos atractivos |
    Largo plazo | No especificada | Medio | Baja; probabilidad indicada: 35% |


    Las probabilidades son estimaciones de los materiales de investigación y no deben
    interpretarse como frecuencias históricas o garantías.


    ## 8. Marco de Valoración


    No es posible determinar un valor intrínseco con la información disponible. AOIF
    informa EV/EBITDA de 5,39x y P/E de 12,21x, pero faltan la fecha de cálculo, la
    base financiera y comparables que permitan contextualizar esos múltiplos. AOIF
    califica el margen de seguridad como insuficiente y el valor intrínseco como no
    determinable.


    DDD informa una cotización de **USD 22,88 al 2026-11-19** y un rango de precios
    objetivo observado de **USD 27,40–36,00 al 2026-11-20**. El análisis señala que
    esos objetivos no constituyen una valoración independiente. La opinión de valoración
    registrada es **justo**, mientras que la conclusión sobre un posible error de
    valoración es **incierto**.


    Como referencia de escenarios, DDD propone los siguientes precios objetivo a un
    horizonte de doce meses, hasta el 2027-11-20:


    | Escenario | Precio objetivo | Interpretación |

    |---|---:|---|

    | Bajista | USD 27,40 | Ancla basada en el extremo inferior del rango observado
    de objetivos; no es una valoración independiente. |

    | Alcista | USD 36,00 | Ancla basada en el extremo superior del rango observado
    de objetivos; no es un precio garantizado ni un valor intrínseco. |


    La diferencia entre la cotización observada y esos objetivos no basta para establecer
    infravaloración. Para construir una valoración propia se requieren, como mínimo,
    flujos de caja por periodo, capex de mantenimiento y expansión, deuda neta, monedas,
    vencimientos y supuestos por concesión. La sensibilidad debería centrarse en tráfico,
    tarifas y condiciones de concesión, márgenes, inversión, tipo de cambio y coste
    de capital, pero los datos aportados no permiten cuantificarla.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. **Deuda y liquidez:** ¿Cuáles son la deuda bruta y neta, la caja, los vencimientos,
    los covenants, la liquidez disponible y la cobertura de intereses? ¿En qué fecha
    y moneda se expresan?

    2. **Flujo de caja:** ¿Cómo se calcula el FCF TTM de 457.070.000 informado por
    DDD? ¿Cuál fue el flujo de caja operativo y qué periodo y moneda corresponden
    a la cifra?

    3. **Capex:** ¿Cuánto corresponde a mantenimiento y cuánto a expansión? ¿Qué obligaciones
    de inversión existen bajo cada concesión?

    4. **Concesiones:** ¿En qué países y aeropuertos opera CAAP, cuáles son las condiciones
    tarifarias y regulatorias, y cuáles son la duración, las obligaciones y los mecanismos
    de renovación o renegociación?

    5. **Ingresos y tráfico:** ¿Qué proporción de ingresos proviene de cargos aeroportuarios
    y de servicios comerciales? ¿Cómo evolucionan pasajeros, carga, ingresos por pasajero
    y tarifas por aeropuerto?

    6. **Comparabilidad financiera:** ¿A qué periodos corresponden el crecimiento
    de ingresos de 16,65%, el margen operativo de 23,06%, el ROIC de 18,24%, EV/EBITDA
    de 5,39x y P/E de 12,21x? ¿Cómo se reconcilian con las cifras de DDD?

    7. **Exposición cambiaria:** ¿Qué monedas generan ingresos, gastos y deuda? ¿Qué
    mecanismos de cobertura o indexación existen?

    8. **Management y gobierno:** ¿Cuál es la composición del consejo, la propiedad
    de insiders, la estructura de incentivos y el historial de asignación de capital?

    9. **Sostenibilidad y riesgos operativos:** ¿Qué exposición cuantificada existe
    a emisiones, consumo energético, ruido, uso de suelo, seguridad y continuidad
    operativa?

    10. **Comparación sectorial:** ¿Cómo se comparan las concesiones, los márgenes,
    el endeudamiento y la valoración de CAAP con [[ASR]] y otros operadores aeroportuarios
    relevantes?


