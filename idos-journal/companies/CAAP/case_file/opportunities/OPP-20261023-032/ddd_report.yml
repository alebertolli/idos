  concesionaria aeroportuaria, pero la evidencia entregada no permite verificar la
  calidad y duración del moat, el apalancamiento, la asignación de capital ni la valoración.
  Las observaciones financieras incluyen FCF TTM de USD 457,07 millones, margen operativo
  TTM de 24,24% y crecimiento de ingresos TTM de 15,01%, todos con fuente única seleccionada.
  La cotización de USD 22,88 queda por debajo de los objetivos consensuados, pero
  estos no validan valor intrínseco. Conclusión: oportunidad cíclica de valoración
  incierta, que requiere diligencia adicional sobre concesiones, deuda, capex, exposición
  cambiaria y riesgos regulatorios.'
