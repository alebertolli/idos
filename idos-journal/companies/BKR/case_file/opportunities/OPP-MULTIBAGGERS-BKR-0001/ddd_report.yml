    con un rango de USD 51 a USD 85, observado el 2026-11-20. El paquete no aporta
    metodología, horizonte, estimaciones subyacentes ni fuente con URL verificable
    para esos objetivos; no deben interpretarse como catalizadores ni como evidencia
    independiente de valor razonable.


    ## 8. Marco de Valoración


    No es posible estimar un valor intrínseco con rigor a partir de la información
    disponible. AOIF indica que faltan precio y fecha de referencia consistentes para
    sus múltiplos, acciones diluidas, deuda neta, FCF normalizado y supuestos de crecimiento
    y coste de capital. La conclusión de margen de seguridad en AOIF es “insuficiente”.


    **Metodologías apropiadas para investigación posterior:**


    - **Flujo de caja descontado:** usar FCF normalizado por ciclo y proyecciones
    explícitas de crecimiento, márgenes, impuestos, capex y capital de trabajo; descontar
    con un coste de capital justificado.

    - **Múltiplos relativos:** contrastar PER y EV/EBITDA con compañías comparables
    y con la propia historia de BKR, asegurando consistencia en fecha, período, deuda
    neta y tratamiento de partidas no recurrentes.

    - **Análisis por segmentos:** si se obtienen datos desglosados, valorar por separado
    las actividades de energía y las industriales, evitando suponer que tienen iguales
    márgenes, crecimiento o exposición cíclica.


    El paquete AOIF reporta PER de 16,13 y EV/EBITDA de 11,99 sin fecha ni fuente
    identificadas; sirven como referencias no verificadas y no como base suficiente
    para una conclusión de valoración. El FCF yield informado como 0 tampoco es interpretable
    sin aclarar su cálculo y sus inputs.


    **Sensibilidades que deberían modelarse, sin asignar valores con los datos actuales:**


    | Variable | Escenario desfavorable | Escenario central | Escenario favorable
    |

    |---|---|---|---|

    | Actividad e inversión de clientes | Menor inversión por caída de precios o actividad
    | Demanda coherente con una evolución cíclica normalizada | Mayor inversión y
    utilización de la base instalada |

    | FCF y conversión de caja | FCF inferior al nivel TTM reportado o conversión
    débil | FCF normalizado sustentado por resultados y capex comprobables | Mayor
    generación de caja recurrente |

    | Márgenes | Compresión por competencia o mezcla desfavorable | Márgenes estables
    | Mejora comprobada y sostenible |

    | Coste de capital y deuda neta | Mayor coste de capital o apalancamiento superior
    al esperado | Supuestos respaldados por datos verificados | Menor riesgo financiero
    debidamente sustentado |


    No se asignan precios objetivo ni probabilidades: faltan inputs verificables para
    hacerlo.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué segmentos impulsan el crecimiento y qué ingresos, márgenes, ROIC y necesidades
    de capital tiene cada uno?

    2. ¿Qué proporción de ventas y beneficios procede de equipos iniciales, servicios
    posventa, software y soluciones industriales?

    3. ¿Cuáles son la evolución histórica de ingresos, márgenes, flujo de caja operativo,
    capex y FCF sobre períodos comparables y mediante fuentes verificables?

    4. ¿El FCF de USD 3.228 mil millones para el TTM terminado el 2026-09-30 es comparable
    con los USD 2.537 mil millones de FY 2025? ¿Qué partidas y cambios de capital
    de trabajo explican la diferencia?

    5. ¿Qué explica la variación informada de deuda total entre FY 2025 y 2026-09-30,
    y cuál es la deuda neta pertinente para la valoración?

    6. ¿Por qué la cobertura de intereses figura como cero? Se necesitan la definición
    del ratio y los gastos por intereses para validar e interpretar el dato.

    7. ¿Cuál es el mercado direccionable, la penetración de BKR, su cuota frente a
    competidores y el riesgo de erosión de su posición?

    8. ¿La base instalada genera ingresos posventa recurrentes y costes de cambio
    medibles?

    9. ¿Cuál es la tendencia de acciones diluidas y qué efecto tienen remuneración
    en acciones, recompras o emisiones?

    10. ¿Qué evidencia respalda las evaluaciones AOIF de posición competitiva líder,
    moat estrecho, calidad de management regular, asignación de capital neutral y
    alineamiento de insiders débil?

    11. ¿Cuál es la fecha, fuente y metodología de los múltiplos, el FCF yield y los
    objetivos de analistas?

    12. ¿Qué supuestos de crecimiento, márgenes, FCF normalizado y coste de capital
    permitirían establecer escenarios de valoración defendibles?

    13. ¿Qué fechas de resultados o hitos corporativos permiten actualizar la tesis
    y verificar los falsadores?


    **Estado de la investigación:** investigación requerida. Los paquetes contienen
    indicios financieros y una descripción del negocio, pero no evidencia suficiente
    para validar la persistencia de la generación de caja, cuantificar retornos por
    segmento o determinar un error de valoración.


