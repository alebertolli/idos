    FCF yield de 0% de AOIF? ¿Qué periodos y definiciones utiliza cada dato?

    3. ¿Cuáles son los ingresos, márgenes y flujos de caja por segmento, región y
    tipo de cliente?

    4. ¿Qué series históricas comparables sustentan el crecimiento de ingresos, el
    margen operativo y el ROIC suministrados?

    5. ¿Qué planes concretos existen para diversificar hacia energías renovables y
    tecnologías industriales, y qué inversión, ingresos o rentabilidad se esperan?

    6. ¿Qué resultados verificables ha producido el plan de reducción de costes y
    cuáles son sus objetivos y plazos?

    7. ¿Qué datos permiten evaluar remuneración ejecutiva, propiedad accionarial de
    insiders, desempeño de la dirección y composición del consejo?

    8. ¿Cuáles son la fecha, las fuentes y los supuestos detrás del precio actual,
    el consenso de analistas y los múltiplos citados?

    9. ¿Qué información de emisiones y cadena de suministro permite medir los riesgos
    ESG y de transición energética?

    10. ¿Cómo se compara la posición competitiva de BKR con [[E]] y [[TS]] en líneas
    de producto, márgenes, cuota de mercado y exposición a ciclos?


