  existing_wiki: '## 1. Visión General de la Compañía


    Baker Hughes Company (BKR) es un proveedor global de tecnologías, equipos y servicios
    para operaciones de energía e industria. Su actividad incluye soluciones para
    exploración, perforación, completación, producción e intervención de pozos, además
    de tecnologías industriales. El negocio combina la venta e integración de equipos
    con servicios prestados durante la operación de los activos de los clientes. [AOIF,
    evaluación del negocio; fecha de referencia del análisis: 2026-11-21]


    Entre sus clientes figuran compañías de petróleo y gas, incluidas compañías nacionales,
    independientes y estatales. El material de investigación no ofrece un desglose
    geográfico ni cifras de ingresos por región o segmento. [AOIF, evaluación del
    negocio]


    BKR participa en una cadena de valor compartida con empresas como [[HAL]] y [[SLB]],
    proveedoras de servicios y equipos petroleros. Sus resultados también pueden verse
    influidos por las decisiones de inversión de productores como [[BP]], [[COP]],
    [[CVX]], [[E]], [[EQNR]], [[OXY]], [[PBR]], [[SHEL]] y [[TTE]].


    ## 2. Modelo de Negocio y Posición Competitiva


    **Actividades y productos descritos en la investigación:**


    - Equipos y servicios para exploración, perforación, completación, producción,
    intervención y abandono de pozos.

    - Brocas, fluidos, sistemas de levantamiento artificial, químicos y servicios
    de medición y wireline.

    - Integración de tecnologías y equipos en proyectos y operaciones de clientes,
    con servicios asociados durante la vida operativa de los activos. [AOIF, evaluación
    del negocio]


    **Drivers de ingresos identificados:**


    - Actividad de perforación y completación, y utilización de equipos.

    - Inversión de clientes de petróleo y gas, incluidas compañías nacionales e independientes.
    [AOIF, evaluación del negocio]


    El análisis AOIF describe a BKR como un **líder competitivo**, con un **moat estrecho**.
    La amplitud tecnológica, la experiencia operativa, la base instalada y la necesidad
    de fiabilidad y soporte en activos pueden favorecer la retención de clientes.
    Sin embargo, la evaluación también caracteriza la industria como competitiva y
    cíclica, con presión potencial sobre precios y márgenes.


    La exposición a la actividad de inversión de clientes vincula a BKR con ciclos
    compartidos por [[HAL]] y [[SLB]]. La investigación disponible no incluye cuotas
    de mercado, comparaciones de costes ni datos segmentados que permitan medir la
    ventaja competitiva frente a esos pares.


    ## 3. Perfil Financiero


    Las cifras siguientes proceden de los análisis suministrados. No se aportaron
    estados financieros completos ni URLs verificables para todos los indicadores,
    por lo que no deben interpretarse como una serie homogénea sin reconciliación.


    | Métrica | Dato reportado | Fecha o período | Fuente y limitación |

    |---|---:|---|---|

    | Ingresos: crecimiento | 3,71% | Período no especificado en el input | AOIF;
    no se proporciona período de comparación |

    | Margen operativo | 12,2% | Período no especificado en el input | AOIF |

    | ROIC | 12,12% | Período no especificado en el input | AOIF |

    | Margen bruto TTM | 23,7% | TTM al 2026-09-30 | DDD; no se incluye aquí una URL
    admitida para validar el dato |

    | Flujo de caja libre (FCF) TTM | USD 3.228 millones | TTM al 2026-09-30 | DDD;
    comparabilidad con períodos FY no confirmada |

    | Current ratio | 1,24 | 2026-09-30 | DDD cita [Stock Analysis](https://stockanalysis.com/stocks/BKR/statistics/);
    el indicador supera el umbral de alerta configurado de 0,5 |

    | Deuda total | USD 18.264 millones | 2026-09-30 | DDD; requiere reconciliación
    con la serie histórica |

    | Deuda total | USD 6.702 millones | 2025-12-31 | DDD; el paquete no explica el
    cambio frente a 2026-09-30 |

    | PER | 15,94 | Período y fecha de referencia no especificados | AOIF; no se aportan
    supuestos ni fuente verificable |

    | EV/EBITDA | 11,8 | Período y fecha de referencia no especificados | AOIF |

    | FCF yield | 0% | Período y metodología no especificados | AOIF; dato que debe
    verificarse, dada la cifra de FCF TTM reportada por DDD |


    **Lectura y limitaciones:** DDD describe el FCF como positivo y el margen bruto
    TTM como 23,7% al 2026-09-30. AOIF califica la tendencia financiera aportada como
    estable, pero señala que no dispone de cifras de FCF ni de conversión de beneficios
    en caja para su evaluación. Por tanto, la generación de caja observada en un período
    no demuestra por sí sola que sea persistente.


    La diferencia reportada entre deuda total al 2025-12-31 y al 2026-09-30 es material
    y no está explicada en los inputs. No se debe inferir su causa ni su impacto económico
    hasta reconciliar definiciones, perímetros y períodos. Tampoco hay datos comparables
    suficientes para calcular de forma verificable el crecimiento de ingresos a tres
    años o el crecimiento del FCF.


    ## 4. Management y Gobierno Corporativo


    AOIF califica la calidad del management como **buena**, la asignación de capital
    como **neutral** y el alineamiento de insiders como **débil**. No se aportan detalles
    que permitan respaldar estas valoraciones con un historial de ejecución, datos
    de remuneración, propiedad de insiders, recompras o decisiones de dividendos.


    La investigación no incluye información sobre composición del board, independencia
    de sus miembros, comités, sucesión ejecutiva ni derechos de los accionistas. Estas
    áreas requieren verificación antes de formular una conclusión más firme sobre
    gobierno corporativo.


    ## 5. Tesis de Inversión


    **Caso alcista, sujeto a verificación:**


    - BKR combina equipos, tecnologías y servicios para operaciones energéticas; la
    amplitud de su oferta y su base instalada podrían respaldar relaciones duraderas
    con clientes. [AOIF, evaluación del negocio]

    - Los indicadores facilitados por AOIF —ROIC de 12,12% y margen operativo de 12,2%—
    son compatibles con una operación rentable en el período al que correspondan,
    aunque este no está especificado.

    - DDD reporta FCF TTM de USD 3.228 millones al 2026-09-30 y margen bruto TTM de
    23,7%. Si las cifras son comparables y sostenibles, constituirían evidencia favorable
    de generación de caja y rentabilidad bruta; los inputs no prueban su persistencia.

    - La investigación recoge un consenso observado de analistas de USD 69,75, frente
    a una cotización de USD 45,48 al 2026-11-20. Esta diferencia es una referencia
    de mercado, no una demostración de infravaloración: no se facilitan los supuestos,
    la distribución temporal ni la metodología de las estimaciones. [DDD, datos al
    2026-11-20]


    La tesis depende de confirmar la calidad y comparabilidad de los datos financieros,
    la evolución del FCF, la estructura de deuda y la contribución de cada segmento.


    ## 6. Riesgos y Contra-Tesis


    **Riesgos identificados:**


    - **Ciclicidad y exposición energética:** una caída o postergación de la inversión
    de clientes en exploración, producción y servicios petroleros podría reducir la
    actividad. AOIF califica el impacto potencial como alto y la probabilidad como
    media.

    - **Competencia:** la presión sobre precios puede afectar márgenes y retención
    de clientes. AOIF estima impacto y probabilidad medios.

    - **Deuda y calidad de los datos de balance:** DDD reporta deuda total de USD
    6.702 millones al 2025-12-31 y USD 18.264 millones al 2026-09-30, sin reconciliación
    en el material recibido.

    - **Dependencia de la inversión de clientes:** el paquete no desglosa ingresos
    ni exposición geográfica o por tipo de actividad, por lo que no permite medir
    concentración o sensibilidad a los ciclos.

    - **Calidad de la evidencia:** varias métricas no tienen período, fuente verificable
    o definición explícita; además, el FCF yield de 0% reportado por AOIF no está
    reconciliado con el FCF TTM positivo comunicado por DDD.


    **Contra-tesis:** la cotización podría reflejar riesgos de negocio o de balance
    que el paquete no permite evaluar suficientemente. El consenso observado no sustituye
    una valoración independiente ni acredita que el precio de mercado sea incorrecto.


    **Falsadores y pruebas necesarias:**


    - Una verificación que demuestre que el FCF TTM no es comparable con los datos
    FY reduciría la relevancia de utilizarlo como evidencia de tendencia.

    - Una reconciliación de deuda que contradiga las cifras o los períodos reportados
    invalidaría las inferencias basadas en esa serie.

    - Evidencia de deterioro sostenido en FCF, márgenes o retornos sobre capital debilitaría
    la tesis de calidad y generación de caja.

    - Una caída o aplazamiento significativo de la inversión de clientes presionaría
    la actividad, en línea con el riesgo macro señalado por AOIF.


    ## 7. Catalizadores y Timeline


    El material no identifica catalizadores corporativos fechados ni publica una agenda
    de eventos con fecha esperada. No se asignan fechas futuras no sustentadas por
    los inputs.


    | Catalizador de seguimiento | Fecha disponible | Relevancia potencial |

    |---|---|---|

    | Evolución del FCF | Dato TTM disponible al 2026-09-30; próxima fecha no indicada
    | Permitiría evaluar si la generación de caja reportada es recurrente y comparable
    con períodos FY |

    | Evolución de ingresos y márgenes | Referencia TTM al 2026-09-30; próxima fecha
    no indicada | Ayudaría a medir el efecto de actividad, precios y mezcla de negocio
    |

    | Reconciliación de deuda total | Cambio reportado entre 2025-12-31 y 2026-09-30
    | Necesaria para comprender la evolución del balance y la estructura de capital
    |

    | Datos por segmento y exposición geográfica | Sin fecha indicada | Permitirían
    evaluar concentración, crecimiento y sensibilidad a distintos mercados |


    Los resultados futuros y las comunicaciones corporativas podrían aportar evidencia
    sobre estos temas, pero los inputs no especifican fechas de publicación.


    ## 8. Marco de Valoración


    La valoración intrínseca **no es estimable con rigor** a partir de la información
    suministrada. Faltan una fecha y precio de referencia comunes para todas las métricas,
    FCF comparable, deuda neta reconciliada, necesidades de reinversión, crecimiento
    por segmento y supuestos explícitos de proyección.


    **Métricas disponibles, con limitaciones:**


    - AOIF informa PER de 15,94 y EV/EBITDA de 11,8, pero no especifica período, fecha
    de referencia ni fuente.

    - AOIF informa FCF yield de 0%; la metodología y la compatibilidad con el FCF
    TTM de USD 3.228 millones reportado por DDD no están explicadas.

    - DDD registra consenso observado de USD 69,75, rango de USD 51–85, y cotización
    de USD 45,48 al 2026-11-20. El rango de consenso no equivale a un valor intrínseco.


    El análisis de escenarios de DDD, fechado el 2026-11-21, utiliza USD 51 como escenario
    bajista y USD 85 como escenario alcista. Ambos valores se describen como anclas
    del extremo bajo y alto del consenso, respectivamente; **no son objetivos de valoración
    independiente** ni escenarios basados en proyecciones financieras desarrolladas.


    Para una valoración futura, sería necesario reconciliar el balance y modelar ingresos,
    márgenes, impuestos, inversión, capital circulante y FCF por segmento. La sensibilidad
    debería contemplar, como mínimo, distintos niveles de actividad de clientes, márgenes,
    reinversión y coste de capital. Los inputs actuales no permiten asignar valores
    fiables a esos supuestos ni calcular un margen de seguridad.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué explica el aumento reportado de deuda total desde USD 6.702 millones al
    2025-12-31 hasta USD 18.264 millones al 2026-09-30? ¿Son comparables ambas cifras
    en definición y perímetro?

    2. ¿Cuál es la serie comparable de ingresos, márgenes, ROIC y FCF por año y por
    segmento?

    3. ¿El FCF TTM al 2026-09-30 es comparable con el historial FY 2022–2025? ¿Qué
    partidas explican su evolución y qué parte es recurrente?

    4. ¿Cómo se reconcilia el FCF yield de 0% de AOIF con el FCF TTM positivo reportado
    por DDD?

    5. ¿Qué retornos obtiene BKR sobre el capital incremental y cuáles son sus necesidades
    de reinversión y capital circulante?

    6. ¿Qué proporción de ingresos y beneficios procede de cada segmento, región y
    tipo de cliente?

    7. ¿Cuál es la sensibilidad del negocio a la actividad de perforación, los presupuestos
    de productores y los cambios en los precios de energía?

    8. ¿Qué historial de ejecución, remuneración y asignación de capital sustenta
    las valoraciones de AOIF sobre management, insiders y calidad del liderazgo?

    9. ¿Cuál es la composición del board, su independencia y la estructura de supervisión?

    10. ¿Qué supuestos sustentan el consenso observado de USD 69,75 y su rango de
    USD 51–85? ¿Cómo se comparan con escenarios propios basados en FCF y balance?

    11. ¿Hay datos comparables de acciones diluidas o en circulación que permitan
    evaluar la dilución? DDD indica que no pudo evaluarla con los períodos disponibles.


    **Estado general de la investigación:** investigación requerida. El paquete respalda
    una descripción del negocio y aporta indicadores financieros puntuales, pero no
    permite confirmar la persistencia del FCF, explicar la variación de deuda ni estimar
    con rigor el valor intrínseco.


