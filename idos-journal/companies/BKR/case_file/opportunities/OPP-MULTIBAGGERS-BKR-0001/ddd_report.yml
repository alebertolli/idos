    companies. The company's Industrial & Energy Technology segment offers gas technology
    equipment, such as drivers, driven equipment, and turnkey solutions for the mechanical
    and electric-drive, compression, and power-generation applications; aftermarket
    support and uptime gas technology services; non-destructive testing technologies,
    software, and services; pre-commissioning and maintenance services; flow control
    and safety solutions; mechanical and electromechanical gear transmission systems;
    Cordant, a software solution to optimize assets, processes, and energy use; Bently
    Nevada, a sensing and protection hardware for rack-based vibrating monitoring
    equipment and sensors; and climate technology solutions. It serves industrial,
    upstream, midstream, downstream, onshore, offshore, and small-to-large scale customers.
    The company was formerly known as Baker Hughes, a GE company and changed its name
    to Baker Hughes Company in October 2019. The company was incorporated in 2016
    and is based in Houston, Texas.
