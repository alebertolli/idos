  en Libros (P/TBV < 0.7x) a pesar de un ROIC/ROTE resiliente y una sólida posición
  de capital (CET1 ratio ~13.5-14.0%). El plan estratégico presentado a inicios de
  2024 marca un punto de inflexión operativo. La tesis se basa en el incremento del
  TBV per cápita impulsado por recompras agresivas de acciones a cotizaciones reducidas,
  ahorros de costes de £2B y un amortiguador estructural en su margen de interés neto.
