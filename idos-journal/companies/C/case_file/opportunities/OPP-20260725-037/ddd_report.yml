  conclusion_error_valoracion: SI
  consenso_actual: El mercado descuenta que Citigroup continuará siendo un laggard
    estructural dentro de los G-SIBs estadounidenses, lastrado por problemas históricos
    de control interno, multas regulatorias, ejecución lenta en la desinversión de
    Banamex y costes de transformación elevados. El precio actual refleja un RoTCE
    permanentemente por debajo de su coste de capital y una incapacidad de cerrar
    la brecha de valoración frente a sus pares.
  hipotesis_contraria: El mercado subestima el impacto acumulativo de la simplificación
    organizativa y la salida de bancas minoristas de menor retorno. La división de
    Services (Treasury and Trade Solutions) posee un foso competitivo (Moat) crítico
    en banca transaccional global que genera retornos de doble dígito alto y flujos
    recurrentes. A medida que disminuyan los costes de reestructuración y se resuelvan
    las deficiencias regulatorias, recomprar acciones masivamente por debajo del Valor
    Contable Tangible (TBV) generará una revalorización acelerada por acción.
  razonamiento: Existe un descalce claro entre la percepción del mercado sobre una
    burocracia ineficiente e inmodificable y la realidad de una reestructuración operativa
    drástica en curso, donde los activos clave de flujo de caja (Services) cotizan
    implícitamente a múltiplos desproporcionadamente bajos dentro de la entidad consolidada.
