resumen_ejecutivo: Citigroup representa una oportunidad clásica de Turnaround de gran
  capitalización. A pesar de años de rendimiento inferior y fricciones regulatorias,
  el banco posee franquicias globales dominantes insustituibles, especialmente en
  Treasury and Trade Solutions (TTS) e Investment Banking internacional. Bajo la dirección
  de Jane Fraser, la compañía está eliminando capas gerenciales, desinvirtiendo activos
  no estratégicos y recomprando acciones con un descuento atractivo sobre el valor
  contable tangible. Con un balance bien capitalizado (CET1 adecuado) y un plan claro
  de reducción de costes, el perfil riesgo/beneficio es altamente favorable para un
  inversor a medio/largo plazo.
