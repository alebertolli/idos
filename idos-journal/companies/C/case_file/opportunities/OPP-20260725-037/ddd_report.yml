dominio_esg_supply_chain:
  analisis: El principal riesgo de gobernanza (G) proviene del historial de deficiencias
    en controles internos de datos y gestión de riesgos que resultaron en las Consent
    Orders de la Fed y la OCC. En el ámbito social y ambiental (E&S), Citigroup enfrenta
    escrutinio habitual por exposición a financiación de energía tradicional, aunque
    mantiene compromisos firmes de transición climática.
  rating: medio_riesgo
dominio_financial_health:
  analisis: La posición de balance es sólida, manteniendo un ratio de capital CET1
    por encima de los requerimientos regulatorios mínimos de la Reserva Federal (superando
    holgadamente el 13%). La liquidez y la estructura de depósitos de clientes corporativos
    e institucionales aportan estabilidad. Aunque los costes de reestructuración pesan
    temporalmente sobre las ganancias, la generación interna de capital se mantiene
    sana.
  rating: fuerte
dominio_growth:
  analisis: El crecimiento de ingresos no provendrá de una expansión masiva de activos,
    sino de la venta cruzada en banca de inversión y tesorería corporativa global,
    así como de la captura de volumen de banca privada en Wealth. La estrategia prioriza
    la rentabilidad y la eficiencia sobre el crecimiento del volumen de activos.
  rating: moderado
dominio_management:
  analisis: 'La CEO Jane Fraser ha tomado decisiones difíciles que administraciones
    anteriores evitaron, incluyendo la eliminación del modelo matricial complejo y
    el despido de capas directivas redundantes. El enfoque en asignación de capital
    es riguroso: desinvertir en retail internacional no rentable y reasignar recursos
    a Services y Wealth. La alineación incentiva la mejora de la eficiencia operativa
    y la superación de las Consent Orders regulatorias.'
  rating: bueno
dominio_riesgos:
- impacto: alto
  probabilidad: media
  riesgo: Fallo o demora prolongada en la remediación de las Consent Orders regulatorias,
    resultando en sanciones adicionales o restricciones de crecimiento por parte de
