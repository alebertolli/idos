calidad_evidencia:
  hechos_verificados:
  - Jane Fraser asumió como CEO en 2021 e inició la salida de 14 mercados minoristas
    internacionales.
  - Citigroup cotiza históricamente con un descuento sustancial frente a su Valor
    Contable Tangible (TBV).
  - Existen Consent Orders activas por parte de la Reserva Federal y la OCC referentes
    a gestión de riesgos y controles internos de datos.
  - El segmento Services (Treasury and Trade Solutions) es un líder global en servicios
    de liquidación y tesorería corporativa.
  inferencias_llm:
  - La simplificación de la estructura corporativa reducirá los costes fijos lo suficiente
    como para permitir al banco alcanzar un RoTCE del 11-12% en el horizonte 2026.
  - Las recompras masivas de acciones por debajo de TBV serán el principal motor de
    crecimiento del beneficio por acción (EPS) en los próximos 24-36 meses.
  preguntas_abiertas:
  - ¿Cuál es el calendario exacto y la valoración final realizable para la salida
    a bolsa/separación de Banamex?
  - ¿Cuánto capital adicional requerirán las inversiones en infraestructura de TI
    y datos para satisfacer completamente los requerimientos regulatorios de la Fed
    y OCC?
clasificacion_oportunidad:
  categoria: turnaround
  categorias_descartadas: Deep Value (aunque cotiza con un descuento sustancial respecto
    al valor contable tangible, atribuir el descuento solo a valoración ignora el
    catalizador operativo de transformación en marcha); Value Trap (descartado porque
    la directiva está tomando acciones agresivas de desinversión y reducción de costes
    en lugar de mantener el statu quo); Compounder (carece del historial sostenido
    de creación de valor y ROIC/RoTCE elevado que caracteriza a JPMorgan o Bank of
    America).
  justificacion: Citigroup se encuentra inmerso en un proceso profundo de reestructuración
    estratégica liderado por su CEO Jane Fraser. El plan incluye la simplificación
    de su estructura organizativa, la salida/venta de 14 bancas minoristas internacionales
    (como Banamex) y la remediación de las órdenes de consentimiento regulatorias
    (Consent Orders de la Fed/OCC). El objetivo central es transformar un conglomerado
    ineficiente en una institución enfocada en negocios de alto retorno (Services/TTS
    y Wealth) para elevar el RoTCE hacia el 11-12%.
dominio_business_quality:
  analisis: Citigroup posee una red transaccional global única presente en más de
    90 países, indispensable para corporaciones multinacionales (división Services/TTS).
    Este segmento constituye un verdadero foso competitivo (Moat) por altos costes
    de cambio y efectos de red. Sin embargo, la calidad del negocio consolidado históricamente
    se ha visto diluida por franquicias minoristas internacionales de bajo margen
    e ineficiencias operativas estructurales que actualmente se están eliminando.
  rating: buena
