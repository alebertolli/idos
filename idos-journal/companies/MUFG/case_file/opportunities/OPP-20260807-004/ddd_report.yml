    information processing and technology; SR and IR support; investment trust and
    real estate asset management; investment advising; real estate brokering; credit
    solution business; credit and prepaid cards; loan guarantees; agency services
    for credit purchases; and servicer activities. The company was formerly known
    as Mitsubishi Tokyo Financial Group Inc. and changed its name to Mitsubishi UFJ
    Financial Group, Inc. in October 2005. Mitsubishi UFJ Financial Group, Inc. was
