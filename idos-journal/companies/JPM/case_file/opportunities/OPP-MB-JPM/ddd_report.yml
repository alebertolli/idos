    ## 8. Marco de Valoración


    El paquete no permite estimar de forma robusta el valor intrínseco ni validar
    un error de valoración. AOIF reporta un PER de 13,04, pero no especifica fecha,
    beneficio utilizado ni metodología. El mismo análisis marca EV/EBITDA y FCF yield
