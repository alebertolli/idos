  evidencia financiera disponible registra FCF TTM de 1.160 millones de USD, margen
  operativo TTM de 34,88% y crecimiento de ingresos TTM de 117,26%, todos reportados
  por una sola fuente y sin información suficiente para evaluar sostenibilidad o causas.
  La cotización observada está por debajo del rango de objetivos aportado, pero no
  se puede concluir que la acción esté infravalorada sin un análisis de activos, costos,
  deuda y sensibilidad a los metales. La tesis merece seguimiento, con especial atención
  a persistencia de caja y riesgo de reversión del ciclo.
