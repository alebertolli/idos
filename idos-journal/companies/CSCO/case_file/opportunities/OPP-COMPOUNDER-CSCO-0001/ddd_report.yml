  con moat defensivo, generación de caja libre de 12.8 B USD y márgenes operativos
  superiores al 27%. El precio cotiza a 104.87 USD, 20% bajo el objetivo medio de
  analistas (130.5 USD). El mercado parece penalizar a la compañía por percepciones
  de desaceleración de crecimiento y competencia en seguridad, pese a oportunidades
  de expansión en IA y SASE. Se identifica un posible error de valoración que justifica
  una posición larga con objetivo bull de 160 USD y un escenario bear de 100 USD.
