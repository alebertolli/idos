    ## 8. Marco de Valoración


    El valor intrínseco no es determinable con los datos proporcionados. AOIF informa
    múltiplos de **PER 23,48x** y **EV/EBITDA 16,01x**, pero señala que faltan datos
    necesarios para construir una valoración, entre ellos una base validada de precio
    y fecha, deuda neta y supuestos suficientes sobre flujos de caja. El FCF yield
    informado es cero y requiere validar definición, fuente y período antes de emplearlo.


    Un marco apropiado para profundizar la valoración sería:


    1. **Valoración por flujos de caja:** estimar ingresos, márgenes, impuestos, inversión
    y capital de trabajo por segmento, y contrastar la conversión a FCF.

    2. **Valoración relativa:** comparar múltiplos con compañías y segmentos realmente
    comparables, ajustando por mezcla de negocios, crecimiento, rentabilidad y ciclo.

    3. **Suma de partes:** evaluar por separado los negocios industriales, de infraestructura,
    transporte, tecnología médica y servicios financieros si se consiguen datos segmentados
    comparables.

    4. **Análisis de escenarios:** construir escenarios de crecimiento, márgenes y
    reinversión, con sensibilidad a la demanda industrial y a la ejecución de proyectos.


    No hay un margen de seguridad verificable. AOIF lo califica como **insuficiente**,
    pero la base de esa conclusión no puede reconstruirse con los datos disponibles.
