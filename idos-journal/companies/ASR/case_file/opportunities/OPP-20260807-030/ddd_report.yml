prompt_inputs:
  business_model: Grupo Aeroportuario del Sureste, S. A. B. de C. V., together with
    its subsidiaries, holds concessions to operate, maintain, and develop airports
    in the southeast region of Mexico. The company operates through Cancún, Aerostar,
    Airplan, Mérida, Villahermosa, Holding & Services, and Other segments. It operates
    the airports in Cozumel, Huatulco, Mérida, Minatitlán, Oaxaca, Tapachula, Veracruz,
    and Villahermosa; and offers aeronautical services, such as passenger, aircraft
    landing and parking, passenger walkways, and airport security. The company also
    provides non-aeronautical services, such as leasing of space at its airports to
    retailers, restaurants, airlines, and other commercial tenants; luggage check-in,
    sorting and handling, aircraft servicing and cleaning, cargo handling, aircraft
    catering services, and assistance with passenger boarding and deplaning; and open-air
    parking lots for commercial vehicle operators, including taxi, bus and other ground
    transport operators; and other commercial activities. In addition, the company
    operates various airports in Colombia, including the Enrique Olaya Herrera Airport
    in Medellín, the José María Córdova International Airport in Rionegro, the Los
    Garzones Airport in Montería, the Antonio Roldán Betancourt Airport in Carepa,
    the El Caraño Airport in Quibdó, and the Las Brujas Airport in Corozal; and holds
    a lease to operate, maintain, and develop the Luis Muñoz Marín International Airport
    in San Juan, Puerto Rico. Grupo Aeroportuario del Sureste, S. A. B. de C. V. was
    founded in 1996 and is headquartered in Mexico City, Mexico.
