resumen_ejecutivo: Mastercard (MA) presenta uno de los modelos de negocio más rentables
  e inexpugnables del mercado global, operando como un peaje infraestructural de los
  pagos mundiales. Con un ROIC del 95.2% y un margen operativo del 59.5%, se beneficia
  de un efecto de red de dos lados masivo. Aunque enfrenta riesgos de regulación de
  tarifas de intercambio y competencia de pagos directo de cuenta a cuenta (A2A),
  su diversificación hacia servicios de valor añadido (ciberseguridad, prevención
  de fraude, analítica) y pagos transfronterizos (Mastercard Move) protege su perfil
  de crecimiento compuesto superior al 10-12% anual a largo plazo.
score_general: 88
tesis_inversion: Mastercard representa una inversión core dentro de una cartera de
  Family Office centrada en la preservación y crecimiento de capital a largo plazo.
  Su modelo de negocio ligero en activos, apalancamiento operativo del 60%, ROIC estelar
  y capacidad de fijación de precios actúan como un escudo resistente a la inflación.
  Aunque la valoración cotiza en rangos exigentes y existen vientos regulatorios en
  contra, la calidad del activo y la expansión hacia servicios de valor añadido justifican
  una posición ponderada de alta convicción con un horizonte temporal de >5 años.
