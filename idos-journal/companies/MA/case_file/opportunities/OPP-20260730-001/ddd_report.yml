  consenso_actual: El mercado descuenta un crecimiento continuo de ingresos del 11-13%
    anual impulsado por la conversión global de efectivo a digital, el aumento de
    volúmenes transfronterizos y la expansión de servicios de valor añadido (VAS).
    Los múltiplos actuales (P/E ~30-33x) implican una baja probabilidad de disrupción
