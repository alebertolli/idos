dominio_business_quality:
  analisis: 'Mastercard posee un moat basado en efectos de red de dos lados (tarjetahabientes
    y comercios) e intensos costes de cambio para instituciones financieras emisoras.
    Operar un peaje sobre el comercio global le otorga un apalancamiento operativo
    masivo: procesar transacciones adicionales no requiere capex significativo, lo
    que se traduce en un margen operativo del 59.5% y ROIC excepcional del 95.2%.'
  rating: excepcional
