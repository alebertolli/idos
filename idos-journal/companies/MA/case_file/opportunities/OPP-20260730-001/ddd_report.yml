    compuestos a largo plazo impulsado por la digitalización del efectivo y el crecimiento
    de servicios de valor añadido.
dominio_business_quality:
  analisis: El moat de Mastercard es masivo y duradero, fundamentado en efectos de
    red de dos lados (consumidores, comercios e instituciones financieras). Los costes
    de cambio para las entidades emisoras y adquirentes son prohibitivos. Su modelo
    asset-light le permite escalar volúmenes con un coste marginal cercano a cero.
  rating: excepcional
