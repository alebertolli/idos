  escalables y rentables del mundo financiero. Operando como un peaje global en el
  consumo en efectivo a digital, la compañía se beneficia de potentes efectos de red
  globales, márgenes operativos del 59.5% y un ROIC del 95.2%. Aunque los riesgos
  regulatorios y las redes de pago instantáneo locales representan vientos en contra
