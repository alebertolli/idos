dominio_esg_supply_chain:
  analisis: Al ser una red de tecnología de pagos intangible, no existe dependencia
    significativa de cadenas de suministro físicas ni materias primas. Los principales
    riesgos en esta categoría se centran en la ciberseguridad, protección de privacidad
    de datos de consumo y cumplimiento de normativas de prevención de blanqueo de
    capitales (AML) y sanciones internacionales.
  rating: bajo_riesgo
dominio_financial_health:
  analisis: Aunque la plantilla de datos inicial marca D/E y FCF como 0 por inconsistencia
    de reporte, la realidad financiera de Mastercard muestra un balance impecable
    con calificación crediticia de grado de inversión alto (A+/A1), sólido flujo de
    caja libre operativo que convierte más del 80-90% del Ebitda en caja, y una cobertura
    de intereses sumamente holgada dada su capacidad de generación de efectivo recursivo.
  rating: fuerte
dominio_growth:
  analisis: 'Los motores de crecimiento incluyen: 1) Crecimiento secular del consumo
    digital en mercados emergentes donde el efectivo todavía domina; 2) Servicios
    de Valor Añadido (VAS) que crecen por encima de la media de la red; 3) Pagos B2B
    e interempresariales mediante Tarjetas Virtuales y Mastercard Move (pagos transfronterizos
    P2P/B2C). La visibilidad de ingresos es muy alta debido al volumen recurrente
    de transacciones globales.'
  rating: fuerte
dominio_management:
  analisis: Liderada por Michael Miebach (CEO desde 2021, veterano de la firma), la
    directiva ha ejecutado impecablemente la estrategia de diversificación más allá
    de las tarjetas bancarias tradicionales, impulsando servicios de valor añadido
    (VAS) y soluciones B2B. La asignación de capital prioriza el reinversión orgánica,
    fusiones/adquisiciones tácticas en ciberseguridad y datos, y un firme retorno
    al accionista mediante recompra constante de acciones y dividendos crecientes.
  rating: excepcional
