calidad_evidencia:
  hechos_verificados:
  - Ingresos TTM de $33.94B con un crecimiento del 12.5%.
  - Margen operativo del 59.5% y ROIC del 95.2%.
  - Estructura de duopolio global en redes de pago abiertas junto a Visa.
  inferencias_llm:
  - El crecimiento continuo en servicios de valor añadido mitigaría el impacto de
    posibles reducciones regulatorias en las tarifas de intercambio.
  - Las redes A2A (Account-to-Account) afectarán principalmente el débito de bajo
    valor pero tendrán un impacto limitado en el crédito y compras transfronterizas
    donde la protección al consumidor y los programas de recompensas son clave.
  preguntas_abiertas:
  - ¿Cuál será el texto final y el grado de apoyo bipartidista de la legislación regulatoria
    de tarjetas en el Congreso de EE.UU.?
  - ¿En qué medida el crecimiento de sistemas tipo Pix en mercados emergentes limitará
    la expansión futura de la red de débito de Mastercard?
clasificacion_oportunidad:
  categoria: compounder
  categorias_descartadas: Se descarta 'quality_at_fair_price' porque Mastercard suele
    cotizar con prima histórica estructural debido a su alto retorno sobre el capital
    y foso defensivo; se descarta 'turnaround' y 'deep_value' debido a la ausencia
    de deterioro operativo o infravaloración patrimonial; y se descarta 'hype' ya
    que sus valoraciones están sustentadas por flujos de caja reales e imponentes.
  justificacion: Mastercard es un 'compounder' de libro con una posición competitiva
    casi inexpugnable (duopolio con Visa), márgenes operativos cercanos al 60%, ROIC
    superior al 90% y una capacidad demostrada para recomponer capital a alta tasa
    mediante crecimiento secular en pagos digitales y recompra de acciones.
dominio_business_quality:
  analisis: Su foso económico (Moat) se basa en un efecto de red insuperable y elevados
    costes de sustitución para instituciones financieras y comercios. Mastercard no
    asume riesgo de crédito (operando puramente la red de procesamiento y transmisión
    de datos), lo que le permite mantener requerimientos de capital (CapEx) extremadamente
    bajos y apalancamiento operativo masivo. Su margen operativo récord (59.5%) demuestra
    su poder de fijación de precios y eficiencia.
  rating: excepcional
