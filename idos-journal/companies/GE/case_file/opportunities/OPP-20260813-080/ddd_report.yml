  business_model: General Electric Company, doing business as GE Aerospace, designs
    and produces commercial and defense aircraft engines, integrated engine components,
    electric power, and aircraft systems. The company operates through two segments,
    Commercial Engines & Services, and Defense & Propulsion Technologies. The Commercial
    Engines & Services segment designs, develops, manufactures, maintenance, repair,
    and overhaul (MRO) services of jet engines and sale of spare parts for commercial
    airframes, business aviation, and aeroderivative applications. The Defense & Propulsion
    Technologies designs, develops, manufactures, and services jet engines and avionics
    and power systems for governments, militaries, and commercial airframers, as well
