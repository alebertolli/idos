    components and systems, such as small turboprop engines, aeroengine mechanical
    transmissions, turbines, combustors and controls, additive manufacturing, propeller
    systems, ignition systems, sensors and engine accessories for fixed wing and rotorcraft
    applications for commercial and military end users under the Avio Aero, Unison,
    Dowty Propellers, and Colibrium Additive brands. The company operates in the United
    States, Europe, Asia, the Americas, the Middle East, and Africa. General Electric
    Company was incorporated in 1892 and is based in Evendale, Ohio.
