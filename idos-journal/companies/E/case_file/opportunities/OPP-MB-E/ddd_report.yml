    | Bajo del consenso / objetivo del escenario bajista | 49,30 USD |

    | Media del consenso / objetivo del escenario base | 57,02 USD |

    | Alto del consenso | 61,00 USD |

    | Precio citado en el input DDD | 60,78 USD |


    El escenario bajista supone una caída anual del petróleo del 20% y una reducción
    de dos puntos porcentuales en los márgenes brutos. El escenario base supone precios
    del petróleo estables y márgenes brutos alrededor del 22%. Las fuentes de los
    objetivos de escenario aparecen como nulas en el input; por ello, los valores
    deben considerarse referencias suministradas, no estimaciones independientes validadas.


    **Metodología apropiada para una evaluación posterior:**


    - Valorar la compañía con flujos de caja normalizados a través del ciclo de materias
    primas, incorporando inversión de capital, deuda y escenarios de precios.

    - Contrastar la valoración con múltiplos de empresas integradas del sector, como
    [[BP]], [[SHEL]], [[TTE]], [[XOM]] y [[CVX]], usando datos homogéneos y fechados.

    - Examinar la sensibilidad a precios del petróleo y el gas, márgenes, inversión,
    deuda neta y cobertura de intereses.


    El AOIF considera insuficiente el margen de seguridad y señala que no puede estimar
    un valor intrínseco independiente fiable sin precio de mercado comparable, acciones
    diluidas, deuda neta validada, flujos normalizados y supuestos explícitos de ciclo.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. **Deuda y liquidez:** ¿Cuál es el plan de reducción de deuda de Eni, qué activos
    podrían venderse y qué calendario u objetivos existen?

    2. **Cobertura de intereses:** ¿Cómo se calcula el dato de 0x, a qué período corresponde
    y es consistente con los estados financieros aplicables?

    3. **FCF:** ¿Cuál fue el flujo de caja operativo, la inversión de capital y el
    FCF por período? ¿Cómo se define el crecimiento TTM de 20,53%?

    4. **FCF yield:** ¿Por qué figura como 0 y cuál es el cálculo correcto con precio,
    capitalización y FCF comparables?

    5. **Transición energética:** ¿Cómo podrían afectar los cambios de demanda, inversiones
    y mezcla de productos a los flujos de caja futuros?

    6. **Segmentos y geografía:** ¿Qué proporción de ingresos, producción, EBITDA
    y activos corresponde a cada segmento y jurisdicción?

    7. **Métricas financieras:** ¿A qué períodos y monedas corresponden el crecimiento
    de ingresos de 20,29%, el margen operativo de 8,46%, el ROIC de 7,33%, el PER
    de 10,93 y el EV/EBITDA de 6,79?

    8. **Valoración:** ¿Cuál es la fecha y metodología del precio de 60,78 USD y del
    consenso de 49,30–61,00 USD? ¿Qué supuestos sustentan cada estimación?

    9. **Gobierno corporativo:** ¿Cuáles son la propiedad accionaria de directivos,
    las políticas de remuneración, la composición e independencia del consejo y los
    resultados de inversiones recientes?

    10. **Calendario de catalizadores:** ¿Existen anuncios o fechas confirmadas para
    ventas de activos, reducción de deuda o mejoras operativas?


    **Calidad de evidencia:** el input DDD informa 12 hechos verificados y 5 inferencias
