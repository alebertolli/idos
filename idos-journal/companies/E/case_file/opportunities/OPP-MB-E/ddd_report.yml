    | EV/EBITDA | 6,79 | Fecha y período del EBITDA no especificados |

    | FCF yield | 0 | Dato señalado como pendiente de validación; no debe interpretarse
    como una medición confirmada |

    | Crecimiento del FCF | 20,53% | TTM; fuente: [Stock Analysis, estadísticas de
    E](https://stockanalysis.com/stocks/E/statistics/), 2026-10-30 |

    | Deuda neta | 19.760 M EUR | Fuente indicada: [Stock Analysis, estadísticas de
    E](https://stockanalysis.com/stocks/E/statistics/), 2026-10-30 |

    | Cobertura de intereses | 0x | Fuente indicada: [Stock Analysis, estadísticas
    de E](https://stockanalysis.com/stocks/E/statistics/); señalada por debajo del
    umbral de 2,0x |

    | CAGR de ingresos a 3 años | No disponible | Falta el dato de ingresos FY 2023;
    cálculo no posible con los inputs |


    El análisis AOIF describe la tendencia financiera como «estable», pero advierte
    que no se proporcionan períodos, monedas ni fuentes para varias métricas. También
    indica que faltan datos por período de flujo de caja operativo, inversión de capital
    y FCF para verificar la conversión de caja. Por ello, el crecimiento del FCF comunicado
    y el FCF yield de 0 no bastan para establecer la calidad o sostenibilidad de la
    generación de caja.


    La deuda neta y la cobertura de intereses requieren validación antes de extraer
    conclusiones firmes sobre liquidez o solvencia. En particular, una cobertura de
    intereses de 0x sería una señal de riesgo relevante si la definición y el dato
    se confirmaran.


    ## 4. Management y Gobierno Corporativo


    El análisis AOIF califica la calidad del management como **buena**, la asignación
    de capital como **neutral** y el alineamiento de insiders como **moderado**. Sin
    embargo, los inputs no incluyen datos específicos sobre remuneración, participación
    accionaria de directivos, propiedad de insiders, composición del consejo ni rendimiento
    de inversiones recientes.


    En consecuencia, estas valoraciones deben considerarse apreciaciones preliminares,
    no conclusiones verificadas sobre gobierno corporativo. No hay información suficiente
    para evaluar la independencia del consejo, la estructura de incentivos o la disciplina
    de asignación de capital.


    ## 5. Tesis de Inversión


    **Caso potencialmente favorable:**


    - El modelo integrado cubre varias etapas de la cadena energética y puede ofrecer
    exposición diversificada dentro del sector.

    - El análisis AOIF describe a Eni como un competidor de escala y señala como posibles
    ventajas sus activos, infraestructura, experiencia técnica y relaciones comerciales.
    La amplitud del moat se califica como estrecha.

    - El input DDD reporta un crecimiento del FCF de **20,53% TTM**, con fuente atribuida
