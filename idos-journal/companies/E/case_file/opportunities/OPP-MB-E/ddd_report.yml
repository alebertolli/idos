    No hay fechas específicas de eventos corporativos o publicaciones asociadas a
    estos catalizadores. El principal punto de seguimiento es comprobar si una mejora
    de márgenes y caja coincide con un crecimiento observable de Global Gas & LNG.


    ## 8. Marco de Valoración


    La valoración adecuada debería considerar la naturaleza cíclica y la integración
    del negocio. Con la información disponible, conviene tratar los múltiplos informados
    como referencias, no como una valoración independiente: el PER de 10,93x y el
    EV/EBITDA de 6,79x no permiten concluir infravaloración sin conocer fecha, definiciones,
    ciclo de beneficios y comparables.


    **Marco de análisis recomendado para completar la evaluación:**


    - Normalizar precios de hidrocarburos y márgenes a través del ciclo, en vez de
    extrapolar un solo periodo.

    - Evaluar generación de caja por segmento y comprobar el puente entre flujo operativo,
    inversión y FCF.

    - Contrastar EV/EBITDA y PER con comparables del sector, como [[BP]] y [[CVX]],
    y con compañías de perfiles de actividad pertinentes, como [[COP]], [[BKR]] y
    [[TS]], asegurando periodos y definiciones comparables.

    - Incorporar deuda neta, liquidez, vencimientos y coste de financiación antes
    de estimar el valor del capital.

    - Evaluar por separado los supuestos de producción, márgenes de refino y contribución
    de gas y LNG, si se obtienen datos segmentados.


    **Referencias de precio disponibles:** el escenario DDD usa como ancla de analistas
    un rango de 49,30–61,00 USD para el horizonte 20-11-2027, con fecha de análisis
