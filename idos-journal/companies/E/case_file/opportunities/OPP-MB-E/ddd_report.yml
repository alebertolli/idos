  existing_wiki: '## 1. Visión General de la Compañía


    Eni S.p.A. (ticker **E**) es una compañía energética integrada. Su cadena de valor
    comprende exploración y producción de hidrocarburos, suministro y comercialización
    de gas y LNG, refinación, fabricación de productos derivados y venta de energía.
    Sus productos incluyen crudo, condensados, gas natural, LNG y electricidad; atiende
    a consumidores residenciales, pequeñas empresas y clientes industriales y comerciales.


    La compañía opera en una industria intensiva en capital y expuesta a los ciclos
    de precios de petróleo y gas, la demanda global y factores geopolíticos. La información
    disponible describe actividades internacionales, pero no ofrece un desglose geográfico
    de ingresos o activos.


    Compañías del mismo sector o con riesgos y dinámicas comparables: [[BKR]], [[BP]],
    [[COP]], [[CVX]] y [[TS]].


    ## 2. Modelo de Negocio y Posición Competitiva


    **Fuentes de ingresos y drivers:** producción de petróleo y gas; comercialización
    de gas y LNG; refinación y venta de productos derivados; y venta de energía. Los
    resultados dependen, entre otros factores, de los precios de hidrocarburos, los
    márgenes de refinación y comercialización, la demanda y las condiciones operativas.


    La integración vertical puede permitir que distintos segmentos compensen parcialmente
    la volatilidad entre actividades, pero la evidencia disponible no demuestra que
    esta protección constituya un moat duradero.


    **Evaluación competitiva:** el análisis AOIF caracteriza a Eni como líder y atribuye
    su posición a la escala, la integración vertical, la experiencia técnica en exploración
    y producción y las relaciones necesarias para acceder a recursos. Califica el
    moat como **estrecho**. Estas valoraciones no están acompañadas por métricas comparativas
    de cuota de mercado, costes o rentabilidad frente a competidores.


    La industria es cíclica y requiere capital significativo. Entre los factores competitivos
    relevantes están la oferta de productores, la demanda global, los márgenes de
    refino y la capacidad de desarrollar y operar activos.


    ## 3. Perfil Financiero


    Las cifras siguientes proceden de los inputs de investigación. No se aportaron
    series comparables ni información suficiente para verificar periodos, definiciones
    o reconciliación con estados financieros primarios.


    | Métrica | Valor informado | Observación |

    |---|---:|---|

    | Crecimiento de ingresos | 20,29 % | Periodo y base de comparación no especificados.
    |

    | Margen operativo | 8,46 % | Definición y periodo no especificados. |

    | ROIC | 7,33 % | No se aportó serie histórica comparable. |

    | PER | 10,93x | Múltiplo informado; fecha y metodología no detalladas. |

    | EV/EBITDA | 6,79x | Múltiplo informado; fecha y metodología no detalladas. |

    | FCF yield | 0 % | No se especifica la metodología; no debe interpretarse como
    una conversión verificada. |

    | FCF TTM | 5.990 millones | Informado al 30-09-2026 en moneda del proveedor,
    que no está identificada ni reconciliada. |

    | Tendencia financiera | Estable | Evaluación del análisis AOIF sin serie temporal
    comparable. |


    **Estructura de capital:** no se proporcionan deuda neta, vencimientos, coste
    de financiación, liquidez ni cobertura de intereses. Por tanto, la capacidad de
    servicio de deuda y el perfil de vencimientos no pueden evaluarse con los datos
    disponibles.


    El análisis AOIF indica que no se proporcionan datos suficientes de flujo de caja
    operativo e inversión para verificar la conversión a FCF. La cifra de FCF TTM
    recogida por DDD tampoco resuelve esa limitación debido a la moneda y metodología
    no identificadas.


    ## 4. Management y Gobierno Corporativo


    El análisis AOIF califica la calidad del management como **buena**, el alineamiento
    de insiders como **moderado** y la asignación de capital como **neutral**. También
    señala que la diversificación y el desarrollo de negocios de menor intensidad
    de carbono reflejan adaptación estratégica, aunque no ofrece evidencia cuantitativa
    sobre su rentabilidad o ejecución.


    No se aportan datos verificables sobre decisiones específicas de asignación de
    capital, retornos de proyectos, remuneración, propiedad accionaria de insiders,
    composición del consejo o mecanismos de gobierno corporativo. La evaluación de
    liderazgo debe considerarse preliminar hasta contar con fuentes primarias y métricas
    de desempeño.


    ## 5. Tesis de Inversión


    La tesis de inversión es principalmente **cíclica**. Depende de que la integración
    de Eni y sus actividades de gas y LNG amortigüen parcialmente la volatilidad de
    los hidrocarburos, y de que la compañía mantenga o mejore márgenes y flujo de
    caja. La integración es una posible fuente de resiliencia, no una garantía de
    estabilidad ni evidencia concluyente de un moat duradero.


    **Elementos favorables observados en los análisis:**


    - Eni combina exploración y producción con actividades de gas, LNG, refinación
    y comercialización.

    - El análisis AOIF la clasifica como líder competitiva y estima un moat estrecho,
    atribuido a escala, integración y experiencia técnica.

    - Gas y LNG, nuevas inversiones energéticas y el desarrollo de activos podrían
    apoyar crecimiento o diversificación, aunque no se aportaron datos segmentados
    que permitan comprobar su contribución.

    - El AOIF reporta crecimiento de ingresos de 20,29 %, margen operativo de 8,46
    % y ROIC de 7,33 %; faltan periodos y series comparables para evaluar persistencia
    o calidad del crecimiento.


    **Lectura de valoración disponible:** al 20-11-2026, la opinión registrada es
    que la valoración parece **justa**, pero la conclusión es incierta. La cotización
    informada es de 60,785 USD al 30-10-2026 y el consenso medio observado es de 57,02
    USD al 20-11-2026. El precio indicado supera el consenso medio y se encuentra
    cerca del extremo alto del rango de objetivos observado; esto, por sí solo, no
    demuestra error de valoración ni infravaloración.


    ## 6. Riesgos y Contra-Tesis


    | Riesgo | Probabilidad informada | Impacto informado | Implicación potencial
    |

    |---|---|---|---|

    | Caída o volatilidad de los precios del petróleo y el gas | Alta | Alto | Menores
    ingresos, márgenes y generación de caja; posible presión sobre valoración. |

    | Compresión de márgenes de refino y comercialización | No especificada | Alto
    | Menor contribución de segmentos que podrían compensar parcialmente la volatilidad
    de producción. |

    | Riesgo geopolítico, contractual y operativo en países productores | Media en
    la evaluación AOIF; sin probabilidad independiente en DDD | Alto | Interrupciones,
    restricciones o cambios en las condiciones de producción y transporte. |

    | Exposición ambiental y regulatoria de los hidrocarburos | No especificada |
    No especificado | Riesgos sectoriales inferidos; no se aportó evaluación específica
    de exposición o costes para Eni. |

    | Endeudamiento y financiación | No evaluable | No evaluable | Faltan deuda neta,
    vencimientos, coste de financiación, liquidez y cobertura de intereses. |


    **Contra-tesis:** la integración puede no ser suficiente para proteger los resultados
    de una caída de precios o márgenes; además, los beneficios potenciales de gas
    y LNG no están demostrados con datos segmentados. La información financiera y
    de valoración es incompleta, por lo que los múltiplos disponibles no establecen
    por sí solos que la acción esté barata.


    **Triggers de falsación de la tesis:**


    - Deterioro sostenido de márgenes y FCF que no se compense entre segmentos.

    - Evidencia de que el negocio de gas y LNG no aporta el crecimiento o la resiliencia
    esperados.

    - Interrupciones geopolíticas u operativas con efectos materiales y persistentes
    sobre producción, transporte o caja.

    - Deterioro financiero que se refleje en menor liquidez, mayor coste de financiación
    o menor capacidad de cubrir obligaciones. La comprobación requiere obtener las
    métricas de deuda ausentes.


    La integridad de tesis figura como activa y sin flags en el input DDD; esto indica
    que no se aportó evidencia de una vulneración, no que los riesgos hayan sido descartados.


    ## 7. Catalizadores y Timeline


    Los catalizadores se registran con horizonte **medio**, impacto **medio** y probabilidad
    estimada del **40 %** cada uno. Son hipótesis de seguimiento, no eventos fechados
    con evidencia confirmada.


    | Catalizador | Horizonte esperado | Impacto | Probabilidad | Estado y limitaciones
