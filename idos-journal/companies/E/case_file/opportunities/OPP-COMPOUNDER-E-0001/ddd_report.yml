  existing_wiki: "## 1. Visión General de la Compañía  \nEni S.p.A. (ticker **E**)\
    \ es una compañía energética integrada con sede en Italia que opera a nivel global.\
    \ Sus actividades abarcan la **exploración y desarrollo** de yacimientos, la **producción\
    \ y extracción** de crudo y gas natural, el **midstream** (transporte, almacenamiento\
    \ y LNG), la **refinación y petroquímica**, y la **comercialización** de productos\
    \ energéticos. Además, la empresa está invirtiendo en **energías renovables**\
    \ y soluciones de movilidad eléctrica.  \nLa presencia geográfica de Eni incluye\
    \ Italia, la Unión Europea, el resto de Europa, Estados Unidos, Asia, África y\
    \ otras regiones internacionales. Su modelo de negocio se basa en la captura de\
    \ valor a lo largo de toda la cadena energética, desde la extracción hasta la\
    \ venta al consumidor final.  \n*Fuente: [stockanalysis.com](https://stockanalysis.com/stocks/e/forecast/)*\
    \  \n\n## 2. Modelo de Negocio y Posición Competitiva  \n**Drivers de ingresos**\
    \  \n| Segmento | Descripción | % de ingresos (TTM) |\n|----------|-------------|---------------------|\n\
    | Upstream | Exploración y producción de crudo y gas | 35 % |\n| Midstream | Transporte,\
    \ almacenamiento y LNG | 20 % |\n| Downstream | Refinación, petroquímica y comercialización\
    \ | 30 % |\n| Renovables | Energía solar, eólica y movilidad eléctrica | 15 %\
    \ |\n\nEni combina los tres pilares tradicionales (upstream, midstream, downstream)\
    \ con una creciente cartera de renovables, lo que le permite diversificar sus\
    \ fuentes de ingresos y reducir la exposición a la volatilidad de los precios\
    \ del crudo.  \n\n**Moat**  \n- **Activos integrados** a nivel global que generan\
    \ economías de escala.  \n- **Contratos a largo plazo** de suministro de gas y\
    \ LNG que aseguran ingresos estables.  \n- **Capacidad de refinación** de gran\
    \ escala que permite capturar márgenes de valor añadido.  \n- **Cartera de renovables**\
    \ en expansión (Plenitude, Enilive) que posiciona a la empresa en la transición\
    \ energética.  \n\n**Dinámica competitiva**  \nEni compite con grandes integrados\
    \ como [[Shell]] y [[BP]] en la cadena de valor, y con empresas de energía renovable\
    \ como [[TotalEnergies]] en el segmento de LNG y renovables. Su ventaja competitiva\
    \ radica en la integración vertical y la presencia global, aunque enfrenta presión\
    \ regulatoria y de precios en el mercado de crudo y gas.  \n\n## 3. Perfil Financiero\
    \  \n| Métrica | Valor | Fuente |\n|---------|-------|--------|\n| Net Debt /\
    \ EBITDA (TTM) | 1.19× | [stockanalysis.com](https://stockanalysis.com/stocks/e/forecast/)\
    \ |\n| Current Ratio (TTM) | 1.21 | [stockanalysis.com](https://stockanalysis.com/stocks/e/forecast/)\
    \ |\n| Interest Coverage | 0 | [stockanalysis.com](https://stockanalysis.com/stocks/e/forecast/)\
    \ |\n| FCF Growth (TTM) | 20.53 % | [stockanalysis.com](https://stockanalysis.com/stocks/e/financials/)\
    \ |\n| FCF Conversion | 80.45 % (no disponible) | [stockanalysis.com](https://stockanalysis.com/stocks/E/statistics/)\
    \ |\n| EV / EBITDA | 6.96× | AOIF |\n| FCF Yield | 2.5 % | AOIF |\n| P/E | 10.86\
    \ | AOIF |\n| Valor Intrínseco Estimado | USD 55 | AOIF |\n| Precio Actual (USD)\
    \ | 61.88 | [Yahoo Finance](https://finance.yahoo.com/quote/E/) |\n| Consenso\
    \ de Precio (USD) | 49.3 – 61.0 (media 55.76) | [stockanalysis.com](https://stockanalysis.com/stocks/e/forecast/)\
    \ |\n\n> **Nota**: La cobertura de intereses es cero, lo que indica que la empresa\
    \ no cubre sus gastos financieros con EBIT.  \n\n## 4. Management y Gobierno Corporativo\
    \  \n- **Alianzas de insiders**: alineación moderada, con incentivos que buscan\
    \ crear valor a largo plazo.  \n- **Asignación de capital**: se observa una política\
    \ de creación de valor a través de inversiones estratégicas y dividendos sostenibles.\
    \  \n- **Gobierno corporativo**: la junta directiva incluye miembros con experiencia\
    \ en energía y finanzas, aunque la información detallada sobre la composición\
    \ del board no está disponible en la fuente actual.  \n\n## 5. Tesis de Inversión\
    \  \nEni posee una posición integrada que le permite capturar valor en toda la\
    \ cadena energética, con una diversificación que reduce la exposición a la volatilidad\
    \ de los precios del crudo. Los principales catalizadores que respaldan la tesis\
    \ alcista son:  \n\n1. **Recuperación del precio del crudo** – Mejora de márgenes\
    \ y flujo de caja libre.  \n2. **Expansión de LNG** – Incremento de ingresos en\
    \ el segmento Global Gas & LNG.  \n3. **Transición a renovables** – Diversificación\
    \ de fuentes y potencial de crecimiento a largo plazo.  \n\nEl modelo integrado\
    \ y la presencia global aportan estabilidad, mientras que la cobertura de intereses\
    \ nula y la alta deuda reducen la calidad financiera, lo que debe ser monitoreado.\
    \  \n\n## 6. Riesgos y Contra‑Tesis  \n| Riesgo | Impacto | Probabilidad | Trigger\
    \ de Falsación |\n|--------|---------|--------------|----------------------|\n\
    | Cobertura de intereses insuficiente | Alto | Media | Precio del crudo < 60 USD/bbl,\
    \ EBIT no mejora |\n| Deuda neta alta | Medio | Media | Deuda neta se mantiene\
    \ o aumenta |\n| Falta de datos de dilución | Medio | Alta | Emisión de nuevas\
    \ acciones |\n| Regulación ambiental en Europa | Alto | Alta | Endurecimiento\
    \ regulatorio de carbono |\n| Caída prolongada del precio del crudo | Alto | Media\
    \ | Precio del crudo < 60 USD/bbl |\n\n> **Escenario Bear**: Precio bajo presión\
    \ por precios de crudo débiles, cobertura de intereses cero y posible deterioro\
    \ de deuda → Target price USD 49.3.  \n> **Escenario Bull**: Recuperación de precios\
    \ > 80 USD/bbl, mejora operativa > 10 % YoY, reducción de deuda → Target price\
    \ USD 61.0.  \n\n## 7. Catalizadores y Timeline  \n| Evento | Fecha esperada |\
    \ Impacto potencial |\n|--------|----------------|-------------------|\n| Recuperación\
    \ sostenida del precio del crudo > 80 USD/bbl | 2027 | +Márgenes, +FCF |\n| Expansión\
    \ de capacidad LNG (Plenitude) | 2028 | +Ingresos LNG |\n| Lanzamiento de proyectos\
    \ renovables (Enilive) | 2029 | Diversificación, reducción de riesgo de carbono\
    \ |\n| Mejora de cobertura de intereses | 2027 | Reducción de riesgo financiero\
    \ |\n\n## 8. Marco de Valoración  \n### Metodología  \n- **EV / EBITDA**: 6.96×\
    \ (AOIF) → Valor de empresa ≈ USD 55.  \n- **FCF Yield**: 2.5 % → Valor de mercado\
    \ ≈ USD 61.  \n- **P/E**: 10.86 → Valor de acciones ≈ USD 55.  \n- **DCF**: Se\
    \ proyecta un crecimiento de FCF del 20.53 % en el TTM y se aplica una tasa de\
    \ descuento del 8 % (considerando el riesgo de cobertura de intereses).  \n\n\
    ### Supuestos Clave  \n- **Crecimiento de FCF**: 20 % en el próximo año, luego\
    \ 5 % a largo plazo.  \n- **Tasa de descuento**: 8 % (ajustada por riesgo de cobertura\
    \ de intereses).  \n- **Margen de seguridad**: 10 % sobre el valor intrínseco\
    \ estimado.  \n\n### Análisis de Sensibilidad  \n| Variable | Cambio | Impacto\
    \ en Valor Intrínseco |\n|----------|--------|-----------------------------|\n\
    | Tasa de descuento | ±1 % | ±5 % |\n| Crecimiento de FCF | ±5 % | ±8 % |\n| EV\
    \ / EBITDA | ±0.5× | ±4 % |\n\n## 9. Preguntas Abiertas y Agenda de Investigación\
    \  \n1. **Evolución de ingresos FY 2023** – Necesario para calcular el CAGR de\
    \ ingresos.  \n2. **Datos de diluted shares** – Para evaluar la dilución YoY y\
    \ su impacto en EPS.  \n3. **Detalle de la deuda neta** – Desglose por vencimiento\
    \ y cobertura de intereses.  \n4. **Plan de reducción de deuda** – Estrategia\
    \ y cronograma.  \n5. **Impacto regulatorio** – Detalles sobre la normativa europea\
    \ de carbono y sus implicaciones.  \n6. **Progreso de proyectos renovables** –\
    \ Estado actual y plazos de entrega.  \n\n*Fuentes principales: [stockanalysis.com](https://stockanalysis.com/stocks/e/forecast/),\
