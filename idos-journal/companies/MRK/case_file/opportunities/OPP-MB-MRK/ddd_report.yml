    modificar las expectativas sobre renovación de cartera y crecimiento |


    El paquete no aporta fechas de eventos corporativos, decisiones regulatorias o
    resultados clínicos concretos. No se asigna un calendario más preciso sin evidencia.


    ## 8. Marco de Valoración


    La valoración requiere métodos compatibles con una farmacéutica diversificada
    y dependiente de carteras de productos y propiedad intelectual:


    1. **Flujo de caja descontado por escenarios:** proyectar ventas, márgenes, impuestos,
    inversión y FCF, incorporando escenarios de éxito o fracaso clínico, penetración
    de productos y erosión tras vencimientos de patentes.

    2. **Valoración por producto o cartera:** estimar flujos por marca y segmento
    cuando haya datos de ventas, exclusividad y mercado. Aplicar supuestos distintos
    a productos establecidos y a programas de desarrollo.

    3. **Comparables:** usar métricas como EV/EBITDA y PER solo después de validar
    período, definición, deuda, caja y comparabilidad con pares como [[ABBV]], [[AMGN]],
    [[AZN]], [[BMY]], [[GILD]], [[GSK]], [[JNJ]] y [[LLY]].


    El análisis AOIF registra PER de 138,14x, EV/EBITDA de 12,6x y FCF yield de 0,
    pero no especifica adecuadamente fecha y metodología de estas cifras. También
    clasifica el margen de seguridad como insuficiente. No son suficientes para inferir
    valor intrínseco.


    No puede estimarse rigurosamente un valor intrínseco con el material disponible:
    faltan precio por acción validado para la valoración, deuda y caja, flujos proyectados
    y supuestos explícitos de crecimiento y descuento. Tampoco hay evidencia para
    fijar sensibilidades cuantitativas. La sensibilidad debería centrarse, una vez
    obtenidos los datos, en crecimiento y márgenes, tasa de descuento, duración de
    flujos protegidos por patentes, penetración de nuevos productos y erosión comercial
    posterior a la exclusividad.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuáles son las ventas, el crecimiento, los márgenes y la penetración por producto,
    segmento y mercado?

    2. ¿Qué parte de los ingresos y del FCF depende de los principales productos,
    y cómo ha cambiado esa concentración?

    3. ¿Cuál es el calendario de patentes, la competencia esperada y la erosión estimada
    para las marcas principales, incluida Keytruda?

    4. ¿Qué productos y programas están destinados a sustituir ingresos expuestos
    a vencimientos de exclusividad, y con qué evidencia de adopción?

    5. ¿Qué explica la diferencia entre utilidad neta TTM de USD 2.453 millones y
    FCF TTM de USD 14.746 millones al 2026-09-30? ¿Qué parte es recurrente?

    6. ¿Cuál es la serie comparable de crecimiento de ingresos, FCF, márgenes y ROIC,
    con períodos, fuentes y metodologías explícitos?

    7. ¿Cuál es la deuda neta, la caja disponible y la estructura de capital actual?

    8. ¿Cuáles son la tenencia de insiders, los incentivos ejecutivos y la composición
    del consejo?

    9. ¿Cuál es el horizonte y qué supuestos sustentan el consenso de precio objetivo
    observado al 2026-11-20?

    10. ¿Cómo cambian las conclusiones de valoración bajo distintos supuestos de crecimiento,
    éxito clínico, duración de patentes y descuento?


    **Estado de la investigación:** evidencia insuficiente para validar una tesis
    de multibagger o un error de valoración. La recomendación del análisis AOIF queda
    como **PENDIENTE_DECISION_BOARD**.


