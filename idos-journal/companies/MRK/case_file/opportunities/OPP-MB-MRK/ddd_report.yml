  existing_wiki: '## 1. Visión General de la Compañía


    Merck & Co., Inc. (MRK) es una compañía farmacéutica y de salud animal que descubre,
    desarrolla, fabrica y comercializa medicamentos, vacunas y soluciones de gestión
    sanitaria. Su cadena de valor incluye investigación interna y alianzas, desarrollo
    preclínico y clínico, autorización regulatoria, fabricación y control de calidad,
    y comercialización.


    La actividad descrita comprende medicamentos y vacunas para salud humana, además
    de productos de salud animal. Entre las marcas humanas enumeradas en la investigación
    figuran Keytruda, Welireg, Winrevair, Januvia, Janumet, Gardasil, ProQuad, M-M-R
    II, Vaxneuvance y Capvaxive. Los clientes y canales mencionados incluyen hospitales,
    clínicas, profesionales sanitarios, distribuidores y farmacias.


    La información disponible no detalla el desglose de ingresos por geografía, segmento,
    producto o canal. MRK opera en un sector farmacéutico global caracterizado por
    regulación estricta, largos plazos de desarrollo, competencia basada en innovación
    y presión de pagadores sobre los precios. Empresas relacionadas del sector incluyen
    [[ABBV]], [[AMGN]], [[AZN]], [[BMY]], [[GILD]], [[GSK]], [[JNJ]] y [[LLY]].


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Fuentes de ingresos y drivers


    El modelo combina productos propios con ingresos derivados de alianzas estratégicas.
    Los principales drivers que deben seguirse son:


    - Ventas, crecimiento, penetración y precios por producto y mercado.

    - Lanzamientos, autorizaciones y adopción de nuevos productos.

    - Resultados de investigación y desarrollo y avance de ensayos clínicos.

    - Renovación de la cartera frente a vencimientos de patentes y pérdida de exclusividad.


    El material de investigación no aporta ventas ni cuotas de mercado por producto,
    por lo que no permite cuantificar la contribución de las marcas enumeradas ni
    la concentración real de los ingresos.


    ### Ventajas competitivas


    El análisis AOIF identifica como posibles fuentes de ventaja la propiedad intelectual,
    las marcas, la escala global, las capacidades de I+D, la experiencia regulatoria,
    las relaciones comerciales y una cartera diversificada. También clasifica el moat
    como amplio y la posición competitiva como líder. Estas son evaluaciones cualitativas
    del análisis proporcionado: el paquete no incluye métricas de cuota, retornos
    sobre capital por segmento ni comparaciones de productos que permitan verificarlas
    de forma independiente.


    La dinámica competitiva combina barreras elevadas de desarrollo y regulación con
    rivalidad por innovación, presión de precios y riesgo de sustitución al vencimiento
    de patentes. En este contexto, las trayectorias de MRK y de competidores como
    [[ABBV]], [[AMGN]], [[AZN]], [[BMY]], [[GILD]], [[GSK]], [[JNJ]] y [[LLY]] pueden
    verse afectadas por resultados clínicos, aprobaciones y cambios en la exclusividad
    de productos.


