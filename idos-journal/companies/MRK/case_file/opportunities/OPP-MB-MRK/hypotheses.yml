  priority: critical
  probability: 0.5
  rationale: La continuidad del crecimiento dependerá de que la demanda de los productos
    comercializados y las contribuciones de nuevos productos compensen la presión
    competitiva y los cambios en la mezcla de ventas. El contexto disponible confirma
    crecimiento entre FY 2022 y FY 2025, pero no aporta desgloses suficientes para
    atribuirlo a productos concretos ni demostrar su persistencia.
  review_trigger: Dejar de creerla cuando Merck publique resultados anuales de FY
