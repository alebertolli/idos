  priority: important
  probability: 0.5
  rationale: El contexto identifica como asuntos aún no verificados la concentración
    por producto, los vencimientos de exclusividad, la contribución del pipeline y
    la relación entre perspectivas de negocio y precio. Si los inversores exigen evidencia
    de reemplazo de ingresos antes de reconocer valor, esa incertidumbre puede traducirse
    en rendimiento relativo inferior. La brecha entre cotización y consenso, por sí
    sola, no demuestra infravaloración.
