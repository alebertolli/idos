prompt_inputs:
  business_model: 'Shell plc operates as an energy and petrochemical company in Europe,
    Asia, Oceania, Africa, the United States, and other parts of the Americas. It
    operates through the following segments: Integrated Gas, Upstream, Marketing,
    Chemicals and Products, and Renewables and Energy Solutions. The company explores
    for and extracts natural gas to produce liquefied natural gas or convert it into
    gas-to-liquids (GTL) fuels and other products; explores for and extracts crude
    oil, natural gas, and natural gas liquids; and operates marketing and transportation
    of oil, gas, and liquids, supported by the infrastructure required to deliver
    them to market or to process them within Shell''s chemical manufacturing plants
    and refineries. It is also involved in marketing, which includes mobility, lubricants,
    and sectors focused on decarbonization; operates a retail network, including electric
    vehicle charging, convenience retail, and the wholesale commercial fuels business
    for transport and industry; sells products for road transport and machinery in
    manufacturing, mining, power generation, agriculture, and construction; and provides
    low-carbon energy solutions, such as biofuels, to a broad range of commercial
    customers, including those in the aviation, marine, and agriculture sectors. In
    addition, the company offers chemicals and products, including chemicals manufacturing
    plants with their own marketing network, and refineries that turn crude oil and
    other feedstocks into a range of oil products, which are moved and marketed around
    the world for domestic, industrial, and transport use; and operates a pipeline
    business, trading, and optimization of crude oil, oil products, and petrochemicals.
    The company was formerly known as Royal Dutch Shell plc and changed its name to
    Shell plc in January 2022. Shell plc was founded in 1897 and is headquartered
    in London, United Kingdom.'
