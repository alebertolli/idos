  existing_wiki: '## 1. Visión General de la Compañía


    AstraZeneca PLC (AZN) es una compañía biofarmacéutica integrada que descubre,
    desarrolla, fabrica y comercializa medicamentos de prescripción. Opera en el sector
    farmacéutico y biotecnológico, donde los resultados clínicos, la regulación y
    la protección de la propiedad intelectual son determinantes para el éxito comercial.


    Su cartera incluye productos en oncología; cardiovascular, renal y metabolismo;
    y otras áreas terapéuticas. Entre los medicamentos mencionados en la información
    disponible figuran Tagrisso, Imfinzi, Lynparza, Calquence, Enhertu, Farxiga/Forxiga,
    Brilinta/Brilique, Crestor y Lokelma. Los clientes y usuarios institucionales
    incluyen médicos de atención primaria y especialistas, hospitales, sistemas sanitarios
    y otros proveedores de salud.


    La cadena de valor abarca investigación y descubrimiento —incluidas colaboraciones
    tecnológicas y científicas—, desarrollo preclínico y clínico, fabricación y comercialización.
    La información suministrada no desglosa ingresos por geografía ni describe la
    distribución regional de operaciones.


    **Contexto de inversión:** los análisis aportados clasifican AZN como *compounder*,
    pero reconocen que la evidencia financiera y de valoración disponible es incompleta
    y que la decisión final de inversión está pendiente de validación.


    **Compañías relacionadas:** [[ABBV]], [[ABT]] y [[AMGN]] pertenecen al mismo sector
    según la wiki existente. La información aportada no establece comparaciones cuantitativas
    directas entre estas compañías y AZN.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    - Crecimiento del volumen y adopción de medicamentos nuevos y de productos de
    la cartera en crecimiento.

    - Resultados clínicos favorables, aprobaciones regulatorias y ampliaciones de
    indicación.

    - Capacidad de desarrollar y comercializar nuevas terapias y de sostener la adopción
    de productos existentes.


    ### Ventajas competitivas y dinámica del sector


    La evaluación AOIF considera que AZN tiene un moat potencialmente amplio y una
    posición competitiva de liderazgo. Las fuentes posibles de ventaja descritas son
    la propiedad intelectual, la evidencia clínica, las capacidades regulatorias y
    la escala comercial. Estas características son ventajas potenciales: los datos
    suministrados no cuantifican su duración ni su contribución económica por producto.


    La industria combina altos costes y largos plazos de desarrollo con incertidumbre
    clínica y regulación. La cartera diversificada y las capacidades integradas pueden
    respaldar la competitividad, pero el éxito depende de resultados clínicos, aprobaciones
    y adopción comercial. La pérdida de exclusividad, la entrada de genéricos o biosimilares
    y la sustitución clínica pueden erosionar las ventas de productos relevantes.


    **Relación con pares:** [[ABBV]], [[ABT]] y [[AMGN]] son referencias sectoriales
    pertinentes para una comparación futura de carteras, crecimiento, rentabilidad,
    vencimientos de exclusividad y valoración. No se proporcionan métricas comparables
    en los datos disponibles.


    ## 3. Perfil Financiero


    Las métricas proceden de fuentes y observaciones descritas de manera incompleta.
    No deben interpretarse como una serie financiera homogénea ni como cifras confirmadas
    mediante fuentes primarias. El análisis DDD señala una observación de Stock Analysis
    con crecimiento de ingresos TTM al 30 de septiembre de 2026 y FCF TTM; el resto
    de los indicadores carece de fechas y definiciones detalladas en el material aportado.


    | Métrica | Valor aportado | Fecha o definición disponible | Observaciones |

    |---|---:|---|---|

    | Crecimiento de ingresos TTM | 7,32% | Al 30-09-2026; observación atribuida a
