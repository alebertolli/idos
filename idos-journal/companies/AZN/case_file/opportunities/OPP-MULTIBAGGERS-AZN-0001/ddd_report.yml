    | PER | 25,57 | Fecha y base no especificadas | Métrica suministrada por AOIF;
    no basta por sí sola para estimar valor intrínseco. |

    | EV/EBITDA | 14,29 | Fecha y base no especificadas | Requiere verificar periodo,
