prompt_inputs:
  business_model: América Móvil, S.A.B. de C.V. provides telecommunications services
    in Latin America and internationally. It offers wireless and fixed-line voice
    services, including airtime, local, domestic, and international long-distance
    services; and network interconnection services. The company provides data services,
    such as data centers, data administration, and hosting services to residential
    and corporate clients; value-added services, including internet access, messaging
    and other wireless entertainment, and corporate services; data transmission, email
    services, instant messaging, content streaming, and interactive applications;
    and wireless security services, mobile payment solutions, machine-to-machine services,
    mobile banking, virtual private network services, and video calls and personal
    communications services. In addition, it offers residential broadband services;
    IT solutions to small businesses and large corporations; and cable and satellite
    television subscriptions. Further, the company sells equipment, accessories, and
    computers; and offers software development, call center, entertainment content
    and news, telephone directories, advertising, cybersecurity services, and corporate
    IT solutions. Additionally, it provides video, audio, and other media content
    through the internet directly from the content provider to the end user. It sells
    its products and services under the Telcel, Telmex Infinitum, and A1 brand names
    through a network of retailers and service centers to retail customers; and through
    sales force to corporate customers. The company was incorporated in 2000 and is
    based in Mexico City, Mexico.
