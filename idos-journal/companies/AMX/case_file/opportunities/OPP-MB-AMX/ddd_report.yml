  existing_wiki: '## 1. Visión General de la Compañía


    América Móvil, S.A.B. de C.V. (AMX) es un operador integrado de telecomunicaciones
    que ofrece servicios móviles y fijos en América Latina y otros mercados internacionales.
    Su negocio incluye telefonía, datos móviles, acceso a internet y banda ancha residencial;
    el material de investigación también menciona televisión, servicios empresariales
    y servicios de valor agregado.


    La compañía invierte en espectro, redes, fibra, sistemas y plataformas, y monetiza
    esos activos mediante servicios recurrentes para consumidores, hogares y empresas.
    La información disponible no detalla la contribución de cada país, segmento o
    producto a los ingresos.


    **Alcance de la evidencia:** los datos de investigación combinan observaciones
    con fechas explícitas —por ejemplo, cifras TTM al 30 de septiembre de 2026 y cotización
    al 19 de noviembre de 2026— con indicadores financieros que no incluyen período
    ni fuente verificable. Estas últimas cifras se identifican como reportadas, pero
    no pueden tratarse como una serie histórica validada.


    ## 2. Modelo de Negocio y Posición Competitiva


    **Fuentes de ingresos y operaciones**

    - Servicios móviles y fijos de voz y datos.

    - Acceso a internet y banda ancha residencial.

    - Servicios de televisión, empresariales y de valor agregado, según el resumen
    del modelo de negocio.

    - Venta o distribución de equipos y contenidos, mencionada en la descripción de
    la cadena de valor.


    **Ventajas y límites competitivos**

    - El análisis AOIF identifica escala, cobertura, marcas, espectro e infraestructura
    como posibles ventajas, además de costos de cambio asociados a la continuidad
    del servicio y los paquetes convergentes.

    - Ese análisis califica la posición competitiva como “líder” y el moat como “estrecho”.
    Son conclusiones del análisis, no datos independientes demostrados por la evidencia
    disponible.

    - La industria se describe como madura e intensiva en capital: la demanda de conectividad
    y datos puede sostener el negocio, pero la presión de precios y la inversión continua
    en fibra, capacidad, espectro y tecnología pueden limitar la rentabilidad y la
    caja.

    - No se aportan datos comparables de cuota de mercado, clientes, penetración,
    churn, ingresos por usuario ni desempeño por país. Por ello, no es posible verificar
    la posición competitiva ni la evolución de sus ventajas.


    No se proporcionaron compañías comparables específicas en la lista de empresas
    del mismo sector. Por tanto, no se añaden wikilinks de competidores.


    ## 3. Perfil Financiero


    | Métrica | Valor reportado | Período / fecha | Fuente y limitaciones |

    |---|---:|---|---|

    | Crecimiento de ingresos | 4,04% | No especificado | Indicador incluido en AOIF;
    sin serie histórica ni fuente detallada. |

    | Margen operativo | 19,68% | No especificado | Indicador incluido en AOIF; período
    no especificado. |

    | ROIC | 11,68% | No especificado | Indicador incluido en AOIF; período, método
    y serie no especificados. |

    | Margen bruto | 60,86% | FY 2022 | DDD; no se proporcionó una URL de respaldo.
    |

    | Margen bruto | 62,73% | TTM al 2026-09-30 | DDD; no se proporcionó una URL de
    respaldo. |

    | Crecimiento de FCF | 12,72% | TTM al 2026-09-30 | DDD lo reporta, pero no aporta
    URL ni períodos comparables para verificar la serie. |

    | Razón corriente | 0,75 | 2026-09-30 | Reportada por Stock Analysis: [estadísticas
    de AMX](https://stockanalysis.com/stocks/AMX/statistics/). DDD indica que el umbral
    configurado de alerta es inferior a 0,5; la observación no constituye una decisión
    de inversión. |

    | PER | 15,47 | No especificado | AOIF; fecha, fuente y método no detallados.
    |

    | EV/EBITDA | 6,22 | No especificado | AOIF; fecha, fuente y método no detallados.
    |

    | FCF yield | 0 | No especificado | AOIF advierte que no está confirmado su significado;
    no debe interpretarse como una medida validada. |


    DDD señala que las cifras de deuda total y caja disponibles no están en escalas
    compatibles para calcular deuda neta/EBITDA. Tampoco se proporcionan datos suficientes
    para evaluar cobertura de intereses o convertir beneficios en flujo de caja libre.
    Los ratios de CAGR de ingresos a tres años y crecimiento de FCF se clasificaron
    como no disponibles por falta de fuentes autorizadas y series verificables.


    ## 4. Management y Gobierno Corporativo


    El análisis AOIF califica la calidad de la dirección como “regular”, la asignación
    de capital como “neutral” y el alineamiento de insiders como “fuerte”. También
    señala la existencia de un grupo controlador de larga trayectoria, lo que podría
    implicar alineamiento económico, pero también concentración de poder de decisión.
    Estas son valoraciones del análisis proporcionado y no están acompañadas de datos
    detallados sobre propiedad o incentivos.


    No se aportaron:

    - Porcentajes de propiedad de insiders o del grupo controlador.

    - Información sobre remuneración, objetivos de desempeño o transacciones con partes
    relacionadas.

    - Composición, independencia, experiencia o estructura de comités del consejo
    de administración.

    - Evidencia suficiente para evaluar el historial de asignación de capital.


    ## 5. Tesis de Inversión


    **Caso potencial a favor — hipótesis que requiere validación**

    - La escala, la infraestructura, la cobertura y las marcas podrían respaldar la
    continuidad de los servicios y la venta de paquetes convergentes. El análisis
    AOIF identifica estas características como ventajas, pero no proporciona métricas
    de cuota, retención o rentabilidad que permitan medirlas.

    - Los indicadores reportados por AOIF —crecimiento de ingresos de 4,04%, margen
    operativo de 19,68% y ROIC de 11,68%— podrían ser compatibles con un negocio rentable.
    Sin período, serie y fuente verificable, no bastan para determinar la sostenibilidad
    o la tendencia de esos resultados.

    - DDD reporta margen bruto de 62,73% para TTM al 30 de septiembre de 2026 y crecimiento
    de FCF de 12,72% para ese período. Sin series comparables y fuentes trazables,
    estos datos son señales provisionales, no evidencia suficiente de mejora duradera.


    **Conclusión actual:** la evidencia no valida una tesis de crecimiento de largo
    plazo, reinversión rentable o ventaja competitiva durable. Tampoco permite concluir
    que la cotización contenga un error de valoración. El caso de inversión queda
    pendiente de verificar crecimiento operativo, retornos sobre capital incremental,
    flujo de caja y deuda.


    ## 6. Riesgos y Contra-Tesis


    **Riesgos principales**

    - **Competencia y precios:** el análisis AOIF identifica competencia intensa y
    posible pérdida de clientes frente a operadores móviles, de fibra y proveedores
    convergentes. No se aportan datos para cuantificar estos efectos por país o segmento.

    - **Inversión intensiva en capital:** la necesidad recurrente de invertir en redes,
    espectro y tecnología podría limitar el flujo de caja libre.

    - **Deuda y servicio financiero:** DDD señala que las cifras proporcionadas no
    permiten calcular deuda neta/EBITDA de forma compatible. La razón corriente de
    0,75 al 30 de septiembre de 2026 es una observación por encima del umbral de alerta
    configurado en el paquete, pero no sustituye un análisis completo de liquidez
    y vencimientos.

    - **Regulación, competencia y divisas:** la exposición a varios mercados puede
    implicar riesgos regulatorios, competitivos y cambiarios. No se proporciona desglose
    por país ni estimación de sensibilidad.

    - **Riesgo de calidad de datos:** varias métricas carecen de período, fuente o
    serie comparable, lo que limita la confianza en cualquier conclusión financiera
    o de valoración.


    **Contra-tesis:** la compañía podría enfrentar presión de precios y altos requerimientos
    de capital sin que el crecimiento de ingresos se traduzca en una generación de
    caja suficiente. La evidencia disponible no permite confirmar ni descartar esa
    posibilidad.


    **Triggers de falsación de una tesis favorable**

    - Resultados futuros comparables muestran deterioro sostenido de ingresos, márgenes
    o flujo de caja frente a los datos históricos incluidos.

    - Datos verificados de deuda y gastos por intereses muestran una capacidad de
    servicio más débil de la que sugieren las cifras actualmente disponibles.

    - La investigación de seguimiento no confirma retornos atractivos sobre el capital
    incremental ni una conversión adecuada de beneficios en caja.


    ## 7. Catalizadores y Timeline


    | Catalizador | Fecha esperada | Impacto potencial | Estado de la evidencia |

    |---|---|---|---|

    | Actualización de resultados y métricas operativas | No especificada | Permitiría
    evaluar ingresos, clientes, penetración, cuota por país y segmento, márgenes y
    evolución de la caja. | DDD lo identifica como catalizador de información; no
    aporta una fecha de resultados. |

    | Evidencia comparable de márgenes y flujo de caja | No especificada | Ayudaría
    a determinar si los márgenes y el crecimiento de FCF reportados se sostienen y
    si reflejan reinversión rentable. | Requiere series y fuentes verificables; no
    se identifica un evento concreto. |

    | Información sobre inversión, competencia y regulación | No especificada | Podría
    aclarar el efecto de capex, presión competitiva y regulación en la rentabilidad
    y las perspectivas. | DDD no identifica un catalizador operativo fechado. |


    No se proporcionaron fechas de próximos anuncios, eventos corporativos ni estimaciones
    de impacto cuantificadas.


    ## 8. Marco de Valoración


    No hay base suficiente para estimar un valor intrínseco. AOIF reporta PER de 15,47
    y EV/EBITDA de 6,22, pero no especifica fecha, fuente, período de referencia ni
    datos de comparables. El FCF yield reportado como 0 no está definido ni validado.


    DDD reporta, al 19 de noviembre de 2026, una cotización de **USD 24,83** y un
    objetivo medio y mediano de analistas de **USD 29,50**, con un rango de **USD
    20,80 a USD 35,00**. El rango de objetivos no constituye por sí mismo una valoración
    intrínseca ni evidencia de un error de mercado. Las cifras financieras se presentan
    en MXN, mientras que la cotización y los objetivos están en USD; el paquete no
    aporta una conciliación de monedas, acciones o fechas.


    **Métodos que podrían evaluarse cuando haya datos suficientes**

    - Flujo de caja descontado, con flujo libre normalizado, capex de mantenimiento
    y expansión, capital de trabajo, deuda neta, acciones diluidas y costo de capital
    documentados.

    - Valoración por múltiplos de EV/EBITDA y PER, con períodos consistentes y comparables
    pertinentes.

    - Análisis de escenarios por país o segmento, si se obtiene información operativa
    desglosada.


    **Sensibilidades por investigar:** crecimiento de ingresos y márgenes; inversión
    de capital y conversión a FCF; retornos del capital incremental; deuda, intereses
    y vencimientos; costo de capital; y evolución de acciones diluidas. No se cuantifican
    escenarios porque faltan supuestos y series verificables.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cómo evolucionan ingresos, clientes, penetración, cuota de mercado, churn
    y ARPU por país y segmento?

    2. ¿Qué retornos obtiene AMX sobre el capital incremental y qué proporción del
    flujo de caja se reinvierte?

    3. ¿Cuál es el flujo de caja libre normalizado y cómo se desglosa el capex entre
