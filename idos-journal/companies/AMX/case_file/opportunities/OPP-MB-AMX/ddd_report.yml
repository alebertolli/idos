  existing_wiki: '## 1. Visión General de la Compañía


    América Móvil, S.A.B. de C.V. (AMX) es una compañía de telecomunicaciones con
    operaciones en México y otros mercados de América Latina, además de presencia
    internacional. Su modelo integrado combina servicios móviles y de línea fija,
    datos, contenido digital y soluciones de tecnologías de la información.


    La empresa participa en un sector intensivo en capital y sujeto a regulación.
    Según el análisis AOIF, controla una parte importante de su cadena de valor: adquiere
    espectro y despliega y mantiene infraestructura de red, además de ofrecer servicios
    y plataformas a clientes residenciales y empresariales. La evidencia suministrada
    identifica a Telcel y Telmex como marcas consolidadas de la compañía.


    **Base de evidencia:** análisis DDD y AOIF, con fecha de evaluación del 19 de
    noviembre de 2026. No se proporcionaron fuentes externas ni enlaces verificables.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    Los ingresos provienen principalmente de la prestación de servicios de telecomunicaciones,
    entre ellos:


    - Voz móvil, tanto de prepago como de pospago.

    - Voz de línea fija y larga distancia.

    - Servicios de datos y banda ancha.

    - Contenido digital y soluciones de TI, según la descripción del modelo de negocio
    AOIF.


    Los segmentos de clientes identificados incluyen consumidores residenciales y
    pequeñas y medianas empresas. El crecimiento de ingresos TTM reportado es de **4,04%**;
    el material de investigación lo interpreta como crecimiento moderado, aunque no
    incluye una serie histórica que permita evaluar su persistencia.


    ### Moat y posición competitiva


    El análisis AOIF clasifica la amplitud del moat como **amplia** y la posición
    competitiva como **líder**. Los factores señalados son:


    - Extensa infraestructura de red y acceso a espectro.

    - Marcas reconocidas, incluidas Telcel y Telmex.

    - Barreras de entrada relacionadas con la inversión de capital y las licencias
    de espectro.

    - Diversificación entre servicios y mercados.


    Estas características son evaluaciones del análisis AOIF; los datos aportados
    no incluyen comparaciones cuantitativas con competidores para verificarlas de
    forma independiente.


    ### Dinámica competitiva


    La investigación describe una industria con altas necesidades de inversión, presión
    regulatoria, consolidación y transición hacia servicios de datos. No se identificaron
    compañías comparables concretas en la lista de empresas de la misma industria
    proporcionada, por lo que no se añaden [[wikilinks]] a competidores.


    ## 3. Perfil Financiero


    Las métricas disponibles se presentan según el periodo o unidad indicados en el
    material de investigación. No se proporcionaron estados financieros ni fechas
    de publicación para corroborarlas.


    | Métrica | Valor reportado | Periodo / unidad | Observación |

    |---|---:|---|---|

    | Crecimiento de ingresos | 4,04% | TTM | Crecimiento moderado según DDD y AOIF.
    |

    | Margen operativo | 19,68% | Periodo no especificado | Métrica reportada por
    DDD y AOIF. |

    | FCF | 9,55 B MXN | TTM | La unidad informada es MXN; no se proporcionó desglose
    de cálculo. |

    | Conversión de FCF | 0,45 | Periodo no especificado | No se especifica la definición
    empleada. |

    | ROIC | 11,68% | Periodo no especificado | Sin serie histórica ni comparables.
    |

    | EV/EBITDA | 6,22 | Fecha de corte: 19 nov. 2026 | Métrica de valoración reportada
    por AOIF. |

    | PER | 15,47 | Fecha de corte: 19 nov. 2026 | Métrica de valoración reportada
    por AOIF. |

    | FCF yield | 3,5% | Fecha de corte: 19 nov. 2026 | Métrica de valoración reportada
    por AOIF. |

    | Deuda neta / deuda-EBITDA | No disponible | — | La evidencia no permite evaluar
    el apalancamiento. |


    El material califica la salud financiera como fuerte, principalmente por el FCF
    y el margen operativo. Sin embargo, también señala el apalancamiento como un riesgo
    relevante sin aportar saldo de deuda, vencimientos, coste medio ni ratio deuda/EBITDA.
    Por ello, la evaluación de la estructura de capital queda incompleta.


    ## 4. Management y Gobierno Corporativo


    El análisis DDD califica la gestión como buena y señala una política de inversión
    en infraestructura y expansión regional. AOIF clasifica la asignación de capital
    como creadora de valor y el alineamiento de insiders como fuerte.


    Estas valoraciones no vienen acompañadas de datos sobre rendimientos históricos
    de inversiones, remuneración, propiedad accionaria de insiders, composición del
    consejo, independencia de sus miembros o mecanismos de supervisión. En consecuencia,
    deben tratarse como apreciaciones de los análisis suministrados, no como hechos
    verificados de gobierno corporativo.


    ## 5. Tesis de Inversión


    ### Caso alcista


    La tesis favorable se apoya en los siguientes elementos reportados por DDD y AOIF:


    1. **Escala e infraestructura:** la compañía mantiene una posición de liderazgo
    y una red propia extensa, con acceso a espectro y marcas consolidadas.

    2. **Generación de caja:** se reporta un FCF TTM de **9,55 B MXN** y un margen
    operativo de **19,68%**.

    3. **Crecimiento positivo:** los ingresos TTM habrían crecido **4,04%**, con potencial
    de expansión asociado a datos y banda ancha según el análisis.

    4. **Posible mejora de riesgos:** una resolución favorable de asuntos regulatorios
    en México o un refinanciamiento a menor coste podrían mejorar la percepción del
    riesgo y la caja disponible.

    5. **Valoración:** DDD considera que la acción está infravalorada y señala un
    precio objetivo medio de analistas de **USD 29,5** (rango de **USD 20,8–35,0**).
    No se proporcionó la fuente de ese consenso ni el precio de mercado usado para
    calcular el descuento citado.


    La tesis depende, entre otros factores, de que la generación de caja sea sostenible
    y de que el apalancamiento no limite la capacidad de inversión o distribución
    de capital. Ambos puntos requieren verificación adicional.


    ## 6. Riesgos y Contra-Tesis


    ### Riesgos identificados


    | Riesgo | Impacto indicado | Probabilidad indicada | Consideración |

    |---|---|---|---|

    | Disputas y restricciones regulatorias en México y otros mercados latinoamericanos
    | Alto | Media | Podrían afectar la operación, los costes o la flexibilidad comercial.
    |

    | Apalancamiento y refinanciamiento | Alto | Media | No hay cifras de deuda para
    cuantificar la exposición ni el calendario de vencimientos. |

    | Exposición al tipo de cambio MXN-USD | Medio | Media | Puede introducir volatilidad
    en resultados o valoración, aunque el material no cuantifica su efecto. |


    ### Contra-tesis


    El mercado podría estar descontando riesgos regulatorios, cambiarios y financieros
    que la información disponible no permite descartar. En particular, la ausencia
    de datos de deuda impide comprobar si el FCF reportado es suficiente frente a
    intereses, vencimientos y necesidades de inversión. Asimismo, un crecimiento de
    ingresos de 4,04% no demuestra por sí solo una expansión acelerada o sostenible.


    ### Triggers de falsación


    El análisis DDD presenta los siguientes escenarios para el horizonte hasta el
    **19 de noviembre de 2027**:


    - **Escenario bajista — USD 20,8:** presupone persistencia de disputas regulatorias
    y presión de deuda sobre el flujo de caja. Sus falsadores indicados son una resolución
    favorable de conflictos regulatorios o una reducción significativa del apalancamiento.

    - **Escenario alcista — USD 35,0:** presupone un acuerdo regulatorio positivo,
    refinanciamiento a tasas inferiores al 5% y expansión de servicios de datos. Sus
    falsadores indicados son nuevas sanciones regulatorias o un aumento de la carga
    de deuda.


    Los precios objetivo son escenarios suministrados por la investigación, no estimaciones
    verificadas independientemente.


    ## 7. Catalizadores y Timeline


    La investigación no aporta fechas concretas para los eventos. El horizonte temporal
    de los catalizadores se describe como medio plazo; por tanto, la fecha esperada
    es indeterminada.


    | Catalizador | Fecha esperada | Impacto potencial | Probabilidad indicada | Evidencia
    / condición |

    |---|---|---|---:|---|

    | Resolución favorable de disputas regulatorias en México | Medio plazo; sin fecha
    concreta | Alto | 45% para el catalizador regulatorio descrito en DDD | Podría
    reducir multas o restricciones operativas. No se identificó un proceso o calendario
    específico. |

    | Refinanciamiento de deuda a tasas más bajas | Medio plazo; sin fecha concreta
    | Alto | 40% | El escenario alcista de DDD supone tasas inferiores al 5%, pero
    no se aportan ofertas, vencimientos ni condiciones de mercado. |

    | Expansión de servicios de datos | Sin fecha concreta | Potencialmente favorable
    | No especificada | Identificada como fuente potencial de crecimiento, sin objetivos
    cuantificados. |


    Las probabilidades son estimaciones del análisis DDD y no se acompañan de fuentes
    o metodología que permitan validarlas.


    ## 8. Marco de Valoración


    ### Métricas y referencias disponibles


    | Referencia | Valor | Interpretación y limitaciones |

    |---|---:|---|

    | Valor intrínseco estimado por AOIF | USD 28,0 | No se proporciona modelo, horizonte,
    tasa de descuento ni supuestos detallados. |

    | Consenso de analistas citado por DDD | Media: USD 29,5; rango: USD 20,8–35,0
    | No se proporciona la fuente ni la fecha de las estimaciones individuales. |

    | Escenario bajista DDD | USD 20,8 | Horizonte: 19 nov. 2027. |

    | Escenario alcista DDD | USD 35,0 | Horizonte: 19 nov. 2027. |

    | EV/EBITDA | 6,22 | Sin comparación con pares o rango histórico. |

    | PER | 15,47 | Sin detalle de beneficios normalizados. |

    | FCF yield | 3,5% | Debe reconciliarse con la cifra de FCF y el precio de mercado
    utilizados. |


    ### Metodología apropiada y supuestos


    Para evaluar AMX convendría combinar:


    - **Flujo de caja descontado**, con supuestos explícitos de crecimiento, márgenes,
    inversión en infraestructura, capital de trabajo, coste de capital y valor terminal.

    - **EV/EBITDA y PER comparables**, contrastados con pares y con el historial propio
    de la empresa, después de verificar deuda, caja y composición de los beneficios.

    - **Análisis de escenarios**, incorporando riesgos regulatorios, cambiarios, de
    refinanciamiento y de inversión de capital.


    La información disponible no incluye los supuestos necesarios para reconstruir
    el valor intrínseco ni para efectuar una sensibilidad cuantitativa. AOIF califica
    el margen de seguridad como **insuficiente**, pese a que DDD considera la acción
    infravalorada. Esta diferencia debe resolverse antes de concluir que existe una
    oportunidad con margen de seguridad adecuado.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es la deuda neta actual, el ratio deuda neta/EBITDA y el coste medio
    de la deuda?

    2. ¿Cuál es el calendario de vencimientos y qué proporción de la deuda está denominada
    en moneda extranjera o a tipo variable?

    3. ¿Cuál es el CAPEX proyectado para los próximos dos o tres años y cómo se financia?

    4. ¿Cómo se calcula el FCF TTM de **9,55 B MXN** y qué periodo exacto cubre?

    5. ¿Qué definiciones y periodos se utilizaron para margen operativo, conversión
    de FCF, ROIC, EV/EBITDA, PER y FCF yield?

    6. ¿Cuáles son los procesos regulatorios concretos en México y otros mercados,
    sus posibles sanciones y sus calendarios?

