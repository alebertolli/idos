resumen_ejecutivo: BP muestra una sólida generación de caja libre ($23.4 bn) y crecimiento
  de ingresos (26.4% TTM) pese a la transición energética. El precio cotiza a $43.22,
  notablemente bajo el objetivo medio de $55.89, lo que sugiere un posible descuento
  por riesgos de precios del crudo y ESG. El análisis de los siete dominios indica
  una empresa de calidad con buen moat, finanzas fuertes y gestión competente, aunque
  con riesgos estructurales vinculados a la transición y a la volatilidad del petróleo.
  Se identifica un catalizador de precios del crudo que podría revalorizar la acción,
  mientras que escenarios de bajo precio del crudo y mayores costos de transición
  representan riesgos a la baja.
