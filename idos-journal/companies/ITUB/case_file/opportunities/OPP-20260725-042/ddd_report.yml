prompt_inputs:
  business_model: 'Itaú Unibanco Holding S.A. provides various financial products
    and services to personal and corporate customers in Brazil and internationally.
    It operates through three segments: Retail Business, Wholesale Business and Activities
    with the Market + Corporation. The company offers current accounts; funds management;
    payments and collections; loans; credit and debit cards; investment and commercial
    banking services; real estate lending and financing services; economic, financial
    and brokerage advisory; and leasing and foreign exchange services. The company
    also provides non-life insurance products covering loss, damage, or liability
    for objects or people, as well as life insurance products covering death and personal
    accidents. It serves retail customers, account and non-account holders, individuals
    and legal entities, high income clients, microenterprises, and small companies,
    as well as middle-market companies and high net worth institutional clients. The
    company was formerly known as Itaú Unibanco Banco Múltiplo S.A. and changed its
    name to Itaú Unibanco Holding S.A. in April 2009. The company was incorporated
    in 1924 and is headquartered in São Paulo, Brazil. Itaú Unibanco Holding S.A.
    is a subsidiary of IUPAR - Itaú Unibanco Participações S.A.'
