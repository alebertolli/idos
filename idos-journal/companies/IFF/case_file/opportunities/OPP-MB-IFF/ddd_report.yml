prompt_inputs:
  business_model: International Flavors & Fragrances Inc., together with its subsidiaries,
    manufactures and markets food, beverage, health and biosciences, scent, and complementary
    adjacent products in the United States, and internationally. It operates in through
    Taste, Food Ingredients, Health & Biosciences, and Scent segments. The Taste segment
    offers savory products such as soups, sauces, meat, fish, poultry, snacks; beverages
    consists of juice drinks, carbonated or flavored beverages, spirits; sweets comprising,
    bakery products, candy, cereal, chewing gum; and dairy products, such as yogurt,
    ice cream, cheese, and other products, as well as spices and seasoning ingredients
    for meat, food service, convenience, alternative protein and culinary products.
    The Food Ingredients segment provides natural, artificial, and plant-based specialty
    food ingredients; natural antioxidants and anti-microbials used for natural food
    preservation and shelf-life extension for beverages, cosmetic and healthcare products,
    pet food and feed additives; and savory solutions, such as spices, marinades,
    and mixtures, and inclusion products comprising combining flavorings with fruit,
    vegetables and other natural ingredients, as well as soy and pea protein with
    value-added formulations, emulsifiers and sweeteners. The Health & Biosciences
    segment offers enzymes, food cultures, probiotics and specialty ingredients for
    food and non-food applications, as well as engages in health, food biosciences,
    home and personal care, animal nutrition and grain processing businesses. The
    Scent segment creates fragrance compounds, and fragrance ingredients. International
    Flavors & Fragrances Inc. was incorporated in 1909 and is headquartered in New
    York, New York.
