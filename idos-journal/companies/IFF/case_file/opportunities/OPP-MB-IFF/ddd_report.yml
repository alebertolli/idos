  existing_wiki: '## 1. Visión General de la Compañía


    International Flavors & Fragrances Inc. (IFF) es una empresa B2B que desarrolla,
    fabrica y comercializa sabores, ingredientes alimentarios, enzimas, cultivos,
    probióticos, fragancias y productos relacionados. Su actividad conecta materias
    primas y componentes naturales, sintéticos y biotecnológicos con formulaciones
    y tecnologías destinadas a fabricantes de alimentos, bebidas, productos de cuidado
    personal, hogar y salud. [AOIF, paso 1; fecha no especificada]


    La información disponible identifica cuatro áreas: Taste, Food Ingredients, Health
    & Biosciences y Scent. La demanda está vinculada, entre otros mercados, a alimentos,
    bebidas, cuidado personal y salud. No se proporciona un desglose geográfico verificable
    ni la contribución de cada segmento a ventas, beneficios o flujo de caja. [DDD,
    corte financiero indicado: 2026-09-30; AOIF, pasos 1 y 3; fechas no especificadas]


    **Estado de la evidencia:** la descripción del negocio y de sus líneas de actividad
    está presente en los materiales de investigación, pero no se adjuntaron fuentes
    primarias ni enlaces verificables.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Modelo y fuentes potenciales de ingresos


    IFF ofrece formulaciones e ingredientes a clientes empresariales. Los productos
    descritos incluyen:


    - Sabores para alimentos, bebidas, productos lácteos, confitería, panadería y
    snacks.

    - Ingredientes especializados, conservantes, antioxidantes, mezclas y proteínas
    de origen vegetal.

    - Enzimas, cultivos y probióticos.

    - Fragancias y productos relacionados para usos de cuidado personal, hogar y salud.
    [AOIF, paso 1; fecha no especificada]


    La amplitud de productos y segmentos podría diversificar las fuentes de demanda.
    Sin embargo, los materiales no permiten determinar qué parte del crecimiento es
    orgánica, recurrente o atribuible a cada segmento. Por ello, la diversificación
    no se considera evidencia suficiente de resiliencia o ventaja competitiva. [DDD,
    calidad de evidencia]


    ### Posición competitiva y moat


    El análisis de AOIF clasifica a IFF como líder y caracteriza su moat como estrecho.
    Entre las posibles fuentes de diferenciación señala el conocimiento de formulación,
    la propiedad intelectual, la experiencia regulatoria y la amplitud de cartera.
    Estas son hipótesis analíticas del material recibido; no se aportan datos verificables
    de participación de mercado, retención de clientes, precios, patentes o retornos
    incrementales que las confirmen. [AOIF, paso 3; fecha no especificada]


    La dinámica competitiva puede incluir presión sobre precios y pérdida de contratos
    o participación frente a proveedores alternativos. [AOIF, paso 5; fecha no especificada]


    Entre las compañías listadas en la misma industria o sector figuran [[DD]], [[DOW]]
    y [[ECL]]. La información disponible no establece que sean competidores directos
    de IFF ni permite comparar sus productos o cuotas de mercado.


    ## 3. Perfil Financiero


    | Métrica | Dato disponible | Período / fecha | Limitaciones |

    |---|---:|---|---|

    | Crecimiento de ingresos | 26,08% | No especificado | Sin cifras absolutas, período,
    definición ni conciliación entre crecimiento orgánico y adquirido. No es comparable
    de forma fiable con otras métricas del paquete. [AOIF, paso 2] |

    | Margen operativo | 8,13% | No especificado | No se aporta serie histórica ni
    definición de la métrica. [AOIF, paso 2] |

    | ROIC | 4,46% | No especificado | No se indican metodología, período ni comparación
    con el costo de capital. [AOIF, paso 2] |

    | Crecimiento del FCF | −57,83% | FY 2025 frente a FY 2024 | Valor reportado por
    la fuente; el paquete no incluye conciliación ni componentes del cambio. [DDD,
    ratio investigado; período finalizado el 2025-12-31] |

    | FCF TTM | Se indica una mejora, sin importe | TTM terminado el 2026-09-30 |
    La mejora no demuestra por sí sola una recuperación estructural. No se aporta
    conciliación comparable. [DDD, calidad de evidencia] |

    | Current ratio | 1,87x | 2026-09-30 | El indicador no cruza el umbral de 0,5x
    configurado en el análisis. [DDD, risk flags] |

    | Deuda neta / caja neta | Descripción ambigua: “negativa en caja neta” y de magnitud
    absoluta elevada | 2026-09-30 | No se proporcionan valores y unidades reconciliados;
    no es posible determinar con seguridad la posición financiera. [DDD, dominio de
    riesgos] |

    | Cobertura de intereses | 0 reportado | 2026-09-30 | No interpretable como cobertura
    económica sin validar definición, EBIT y gasto por intereses. [DDD, dominio de
    riesgos] |

    | CAGR de ingresos a 3 años | No disponible | Corte indicado: 2026-09-30 | La
    serie no contiene ingresos TTM comparables para los períodos requeridos. [DDD,
    ratios investigados] |

    | Dilución interanual | No disponible | No especificado | No se puede evaluar
    frente al umbral de 10%. [DDD, risk flags] |

    | FCF yield | 0 reportado | Sin fecha ni metodología | La fuente no aporta cifras
    subyacentes ni definición; no debe tratarse como medida validada. [AOIF, paso
    6] |


    AOIF califica la tendencia financiera como deteriorándose, pero también advierte
    que las métricas carecen de períodos y cifras absolutas comparables. El valor
    reportado de FCF para FY 2025 cayó 57,83% frente a FY 2024; la mejora del FCF
    TTM indicada posteriormente no basta para concluir que la tendencia cambió de
    forma sostenible. [AOIF, paso 2; DDD, ratios investigados y calidad de evidencia]


    **Estructura de capital:** no hay datos reconciliados de deuda, efectivo, vencimientos,
    gasto por intereses ni apalancamiento. La posición de caja/deuda y la capacidad
    de servicio de deuda requieren validación con estados financieros. [DDD, dominio
    de riesgos]


    ## 4. Management y Gobierno Corporativo


    La información recibida no incluye datos verificables sobre directivos, composición
    del consejo, independencia de sus integrantes, remuneración, objetivos de gestión,
    propiedad de insiders o historial de adquisiciones y desinversiones.


    AOIF califica el alineamiento de insiders como débil, la calidad de la gestión
    como regular y la asignación de capital como neutral. Estas evaluaciones son provisionales:
    el mismo análisis señala que no dispone de resultados de gestión, historial de
    operaciones de capital ni objetivos verificables. [AOIF, paso 4; fecha no especificada]


    **Conclusión:** evaluación inconclusa hasta revisar documentación corporativa
    y datos de propiedad e incentivos.


    ## 5. Tesis de Inversión


    ### Caso alcista — hipótesis por validar


    - IFF participa en varias categorías de ingredientes, sabores y fragancias para
    clientes empresariales; esta amplitud podría exponerla a distintas fuentes de
    demanda. La contribución y correlación entre segmentos no están cuantificadas.
    [AOIF, paso 1; DDD, calidad de evidencia]

    - El conocimiento de formulación, la propiedad intelectual, la experiencia regulatoria
    y la amplitud de cartera podrían respaldar diferenciación. El paquete no aporta
    evidencia suficiente para confirmar que se traduzcan en poder de precios o retornos
    superiores. [AOIF, paso 3]

    - La mejora señalada del FCF TTM al 2026-09-30 podría ser favorable si se confirma
    en períodos comparables y se explica por factores recurrentes. No constituye por
    sí sola evidencia de recuperación estructural. [DDD, calidad de evidencia]

    - El consenso de analistas citado fue de USD 98,24 al 2026-11-20, frente a una
    cotización observada de USD 93,02 al 2026-10-30. La diferencia entre ambas cifras
    no demuestra infravaloración ni constituye una valoración independiente. [DDD,
    error de mercado]


    **Síntesis:** IFF merece investigación adicional, pero el material no valida todavía
    una tesis de crecimiento rentable, una ventaja competitiva duradera ni un descuento
    frente al valor intrínseco.


    ## 6. Riesgos y Contra-Tesis


    ### Riesgos identificados


    - **Presión competitiva:** competencia en precios, pérdida de contratos o reducción
    de participación frente a proveedores alternativos. AOIF lo clasifica como riesgo
    de impacto alto y probabilidad media. [AOIF, paso 5]

    - **Materias primas e insumos:** volatilidad, escasez o encarecimiento de componentes
    naturales, sintéticos y biotecnológicos. AOIF lo clasifica como riesgo macro de
    impacto y probabilidad medios. [AOIF, pasos 1 y 5]

    - **Rentabilidad insuficiente:** el ROIC reportado de 4,46% y el margen operativo
    de 8,13% podrían indicar retornos limitados, pero no pueden compararse con el
    costo de capital ni con períodos anteriores debido a la falta de metodología y
    fechas. [AOIF, paso 2]

    - **FCF débil o volátil:** el FCF de FY 2025 cayó 57,83% interanual según el dato
    reportado; la mejora posterior del FCF TTM requiere confirmación y explicación.
    [DDD, ratio investigado y calidad de evidencia]

    - **Incertidumbre de deuda y cobertura:** las cifras de deuda neta y cobertura
    de intereses disponibles son ambiguas o no interpretables sin conciliación. [DDD,
    dominio de riesgos]

    - **Falta de transparencia comparable en el paquete:** sin resultados por segmento,
    márgenes, capital circulante y FCF conciliado, es difícil distinguir mejora operativa
    de cambios de período o partidas no recurrentes. [DDD, preguntas abiertas; AOIF,
    paso 2]


    ### Contra-tesis


    La mejora del FCF TTM podría no sostenerse, especialmente dado el descenso reportado
    para FY 2025. Además, la amplitud de cartera y las posibles capacidades de formulación
    no prueban por sí mismas crecimiento rentable ni un moat. [DDD, hipótesis contraria;
    AOIF, paso 3]


    ### Triggers de falsación


    - El FCF comparable vuelve a deteriorarse o permanece débil sin una explicación
    verificable basada en inversión o capital de trabajo. [DDD, falsadores]

    - Los resultados comparables muestran contracción persistente de ventas o márgenes
    en los segmentos relevantes. [DDD, falsadores]

    - La divulgación por segmento no muestra crecimiento rentable o retornos de capital
    adecuados una vez que se disponga de períodos y metodologías comparables. [DDD,
    preguntas abiertas]


    ## 7. Catalizadores y Timeline


    | Hito | Fecha esperada | Impacto potencial | Estado |

    |---|---|---|---|

    | Publicación de resultados con FCF y conciliación frente a períodos comparables
    | Sin fecha especificada en el paquete; pendiente de próximos resultados | Permitiría
    evaluar si la mejora del FCF TTM se sostiene y distinguir los efectos de operación,
