    customers through various sales channels, including e-commerce platforms, social
    commerce, and physical retail stores. The company operates in North America, Europe,
    the Middle East, Southeast Asia, and internationally. The company was formerly
    known as YY Inc. and changed its name to JOYY Inc. in December 2019. JOYY Inc.
    was founded in 2005 and is headquartered in Singapore.
