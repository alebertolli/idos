    | Media del consenso | 94,26 | [Stock Analysis](https://stockanalysis.com/stocks/joyy/forecast/);
    también se cita [Yahoo Finance](https://finance.yahoo.com/quote/JOYY/) |

    | Extremo alto del consenso | 125,00 | [Stock Analysis](https://stockanalysis.com/stocks/joyy/forecast/)
