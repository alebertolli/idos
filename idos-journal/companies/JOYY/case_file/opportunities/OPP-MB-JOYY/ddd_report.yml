  Live e imo. La tesis favorable requeriría que estas plataformas sostuvieran crecimiento
  y monetización con reinversión rentable; la evidencia suministrada no permite validar
  mercado direccionable, penetración, ventaja competitiva duradera ni retornos sobre
  capital. Los datos financieros muestran FCF positivo en FY 2021–2025, pero con descenso
  en FY 2025, ingresos inferiores a FY 2022 y un resultado neto FY 2025 muy superior
  al de los otros períodos mostrados, cuya sostenibilidad no se puede determinar aquí.
