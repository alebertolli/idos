    regulatorio y desaceleración de usuarios. |

    | Base | USD 94,26 | CAGR de ingresos de aproximadamente 1,2%, conversión de FCF
    de aproximadamente 74% y ausencia de eventos regulatorios mayores. | Referencia
    cercana a la media del consenso, no valoración independiente. |


