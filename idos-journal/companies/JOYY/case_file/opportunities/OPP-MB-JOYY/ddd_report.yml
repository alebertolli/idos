    de forma incompleta la hipótesis contraria sobre el precio actual, por lo que
    no es posible usarla como caso cuantitativo.


    **Sensibilidades a priorizar:** crecimiento de ingresos y usuarios; retención
    y monetización por usuario; margen y conversión de FCF; impacto de cambios regulatorios;
    y evolución de efectivo y deuda. Hasta contar con datos verificables para esas
    variables, el margen de seguridad se considera **insuficiente** en AOIF.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es la serie histórica de ingresos, márgenes operativos y FCF, y cómo
    se distribuye por segmento y producto?

    2. ¿Qué periodos y datos sostienen el CAGR de ingresos de aproximadamente 1,2%
    y la conversión de FCF de aproximadamente 74%?

    3. ¿Cuáles son los importes y fechas de efectivo, deuda, deuda neta y gastos por
    intereses? ¿Cómo se calcula la cobertura de intereses reportada en 0x?

