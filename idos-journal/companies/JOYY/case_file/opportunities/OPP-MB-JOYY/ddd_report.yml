    y la monetización por usuario en Bigo Live, Likee e imo?

    5. ¿Qué proporción de los ingresos y del FCF depende de China, y qué exposición
    regulatoria existe en cada mercado?

    6. ¿Qué evidencia de crecimiento fuera de Asia respalda la hipótesis de expansión
    internacional?

    7. ¿Qué datos permiten evaluar el posicionamiento de JOYY frente a competidores
    de redes sociales, video, mensajería y transmisiones en vivo?

    8. ¿Quiénes integran el consejo y el equipo directivo? ¿Cuál es su historial de
    ejecución, remuneración y participación accionaria?

    9. ¿Qué supuestos respaldan los objetivos de consenso de USD 74–125, y qué analistas
    o metodologías explican la dispersión?

    10. ¿Se han anunciado iniciativas concretas, con fechas y presupuesto, para aumentar
    publicidad o compras dentro de las aplicaciones?


    **Prioridad de seguimiento:** obtener estados financieros y datos operativos primarios,
    confirmar las métricas citadas y separar el desempeño por producto y geografía
    antes de actualizar la tesis o la valoración.


