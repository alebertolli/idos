prompt_inputs:
  business_model: Tenaris S.A., together with its subsidiaries, manufactures and supplies
    steel pipe products and related services for the energy industry and other industrial
    applications in North America, South America, Europe, the Middle East and Africa,
    and the Asia Pacific. It provides steel casings to sustain the walls of oil and
    gas wells during and after drilling; steel tubing for conducting crude oil and
    natural gas to the surface after drilling has been completed; steel line pipes
    to transport crude oil and natural gas from wells to refineries, storage tanks,
    and loading and distribution centers; and mechanical and structural pipes for
    the transportation of other forms of gas and liquids under high pressure. The
    company also offers cold-drawn pipes for use in boilers, superheaters, condensers,
    heat exchangers, automobile production, and other industrial applications; premium
    joints and couplings for use in high temperature or high pressure environments
    under the TenarisHydril brand name; coiled tubing is used for oil and gas drilling
    and well workovers and for subsea pipelines; sucker rods used in oil extraction
    activities, tubes used for plumbing and construction applications, and oilfield
    / hydraulic fracturing services; pipe coating services; and automotive components.
    In addition, it engages in the sale of energy and raw materials; development,
    management, and licensing of intellectual property; procurement and trading services;
    and financial operations, as well as markets steel products. Further, the company
    manufactures and markets connections; and welded and seamless steel pipes. Tenaris
    S.A. was incorporated in 2001 and is based in Luxembourg, Luxembourg. Tenaris
    S.A. operates as a subsidiary of Techint Holdings S.àr.l.
