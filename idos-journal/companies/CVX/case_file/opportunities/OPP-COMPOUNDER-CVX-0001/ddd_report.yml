resumen_ejecutivo: Chevron (CVX) es una empresa integrada de energía con fuerte generación
  de caja libre (34 B USD) y márgenes operativos saludables (18 %). Presenta crecimiento
  de ingresos del 34.8 % y está ligeramente subvaluada respecto al consenso de analistas.
  El principal riesgo percibido por el mercado son los precios del crudo y la transición
  energética, pero la empresa posee activos de LNG y proyectos de captura de carbono
  que pueden mitigar dichos riesgos. Se identifica una oportunidad de inversión basada
  en un posible ajuste al alza del múltiplo de valoración.
