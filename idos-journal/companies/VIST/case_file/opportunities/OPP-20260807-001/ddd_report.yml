resumen_ejecutivo: Vista Energy es el principal operador independiente de shale oil
  en Vaca Muerta (Argentina), liderado por Miguel Galuccio (ex-CEO de YPF). La compañía
  combina acreages de primer nivel geológico (Bajada del Palo Oeste y Este) con eficiencia
  de perforación comparable a los mejores operadores del Permian en EE.UU., manteniendo
  lifting costs de ~$4.5-5.0/boe. Aunque el FCF TTM ha sido reinvertido agresivamente
  en capex de crecimiento para alcanzar la meta de 100,000 boe/d hacia 2026-2027,
  la compañía entrará en una fase de masiva cosecha de caja libre conforme los oleoductos
  de evacuación entren en servicio. A un múltiplo EV/EBITDA de 5.2x y P/E de 9.3x,
  ofrece un margen de seguridad amplio para inversores tolerantes a la volatilidad
  política argentina.
