    por falta de deuda. ROIC 14.2% supera al WACC estimado cercano a 0%, indicando
    creación de valor. Sin embargo, el flujo de caja libre ajustado es cero, reflejando
    alta reinversión de capital para expansión; se espera que mejore al alcanzar los
    objetivos de producción.
