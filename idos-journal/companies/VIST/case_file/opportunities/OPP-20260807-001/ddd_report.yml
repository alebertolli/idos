dominio_esg_supply_chain:
  analisis: Riesgo ambiental inherente a la hidrofracturación (uso y tratamiento de
    agua, emisiones fugitivas de metano y venteo). Vista cuenta con un plan agresivo
    de reducción de emisiones de alcance 1 y 2, incluyendo proyectos de electrificación
    de equipos de perforación y soluciones basadas en la naturaleza (créditos de carbono
    propios). En la cadena de suministro, depende de un número limitado de contratistas
    de servicios petroleros (SLB, Halliburton, Tenaris) en un mercado argentino con
    fricciones de importación de repuestos.
  rating: medio_riesgo
dominio_financial_health:
  analisis: Balance extremadamente sólido para una E&P de crecimiento en mercados
    emergentes. La deuda neta sobre EBITDA se mantiene por debajo de 0.8x. El perfil
    de vencimientos está extendido, financiado en parte a través del mercado de capitales
    local argentino (a tasas reales negativas o muy bajas en USD linked) e internacional.
    El FCF reportado TTM es neutral/cero debido a que el 100% del flujo operativo
    se reinvierte en pozos y facilidades de procesamiento; el Capex de mantenimiento
    es una fracción menor del Capex total.
  rating: fuerte
dominio_growth:
  analisis: Crecimiento proyectado de producción de 55,000 boe/d a 100,000+ boe/d
    entre 2024 y 2026-2027. Este crecimiento está respaldado por más de 1,000 ubicaciones
    de pozos identificadas con inventario para más de 15 años a los ritmos actuales
    de perforación. El principal limitante histórico (cuello de botella de evacuación
    por oleoductos) se está disolviendo con las obras de infraestructura de Oldelval
    y OTEP.
  rating: fuerte
dominio_management:
  analisis: El equipo gestor está encabezado por Miguel Galuccio, un veterano de Schlumberger
    y artífice de la transformación inicial de YPF hacia el desarrollo no convencional
    de Vaca Muerta. La alineación con el accionista es elevada a través de programas
    de compensación en acciones e inversión personal directa. Han cumplido o superado
    sistemáticamente sus guías de perforación, reducción de costos y adición de reservas
    probadas (1P) desde la OPI en 2018.
  rating: excepcional
