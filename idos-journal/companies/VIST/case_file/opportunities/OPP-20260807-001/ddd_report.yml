dominio_business_quality:
  analisis: Su foso económico (moat) se basa en una ventaja de costos geológica y
    operativa. En Bajada del Palo Oeste ha perforado algunos de los pozos shale más
    productivos de América Latina, con longitudes laterales de más de 2,800 metros
    y alta densidad de fracturas. Su lifting cost de $4.5-5.0/boe la sitúa en el primer
    cuartil de la curva de costos global. No posee poder de fijación de precios (commodity
    taker), pero su estructura de costos le permite ser rentable con Brent a $45-50/bbl.
  rating: buena
