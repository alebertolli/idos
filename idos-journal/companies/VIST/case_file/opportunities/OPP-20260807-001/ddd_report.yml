tesis_inversion: 'Vista Energy representa una oportunidad única de adquirir un activo
  shale de bajo costo de nivel mundial a una fracción del múltiplo de sus comparables
  estadounidenses (que cotizan a 6-8x EV/EBITDA y P/E >12x). La combinación de: (1)
  un management de primer nivel con track record comprobado en Vaca Muerta, (2) lifting
  costs ultracompetitivos de ~$5/boe, (3) inventario de perforación de más de 10 años
  en ''sweet spots'', y (4) el desahogo de la capacidad de exportación vía oleoductos,
  convierte a VIST en una máquina de generación de EBITDA que transicionará hacia
  un masivo FCF Yield conforme la intensidad de capital disminuya y el volumen supere
  los 100k boe/d. El descuento soberano ofrece un margen de seguridad asimétrico para
  una Family Office con horizonte de medio a largo plazo.'
