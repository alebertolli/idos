dominio_esg_supply_chain:
  analisis: Riesgos ESG vinculados a la extracción de shale (uso de agua, gestión
    de residuos) y a la exposición a regulaciones ambientales en Argentina y México.
    La cadena de suministro depende de proveedores de equipos de perforación y servicios
    logísticos, con cierta concentración en pocos jugadores internacionales, lo que
    genera riesgo de interrupción. No se dispone de información pública detallada
    sobre políticas ESG de la compañía.
  rating: medio_riesgo
dominio_financial_health:
