resumen_ejecutivo: Vista Energy es una compañía de exploración y producción con activos
  estratégicos en Vaca Muerta, Argentina, y México. Presenta sólidos márgenes, alto
  ROIC y crecimiento de ingresos, respaldados por un balance prácticamente sin deuda.
  El mercado penaliza la exposición a riesgos macro de Argentina, pero la empresa
  está posicionada para superar esos obstáculos mediante la expansión de infraestructura
  y la normalización cambiaria, lo que crea una oportunidad de inversión tipo compounder
  con margen de upside considerable.
