prompt_inputs:
  business_model: 'Lockheed Martin Corporation, an aerospace and defense company,
    engages in the research, design, development, manufacture, integration, and sustainment
    of technology systems, products, and services in the United States, Europe, Asia,
    the Middle East, and internationally. The company operates through four segments:
    Aeronautics; Missiles and Fire Control (MFC); Rotary and Mission Systems (RMS);
    and Space. The Aeronautics segment offers combat and air mobility aircraft, unmanned
    air vehicles, and related technologies. The MFC segment provides air and missile
    defense systems; tactical missiles and precision strike weapon systems; logistics;
    fire control systems; mission operations support, readiness, engineering support,
    and integration services; and ground vehicles. The RMS segment offers military
    and commercial helicopters, surface ships, sea- and land-based missile defense
    systems, radar and laser systems, sea- and air-based mission and combat systems,
    command and control mission solutions, cyber solutions, simulation and training
    solutions, and services and support for surface ships. The Space segment provides
    satellites; space transportation systems; strategic, advanced strike, and defensive
    systems; and classified systems and services in support of national security systems.
    This segment also provides network-enabled situational awareness; and integrates
    space and ground global systems to help its customers gather, analyze, and securely
    distribute critical intelligence data. It primarily serves the U.S. government
    and international customers, as well as foreign military sales contracted through
    the U.S. government. The company was formerly known as The Lockheed Corporation
    and changed its name to Lockheed Martin Corporation in March 1995. Lockheed Martin
    Corporation was founded in 1912 and is based in Bethesda, Maryland.'
