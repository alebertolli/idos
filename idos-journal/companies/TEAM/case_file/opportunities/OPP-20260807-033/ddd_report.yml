    platform for professional development teams; Compass, a developer portal that
    provides a unified view of engineering components; Jira Product Discovery, a tool
    to capture, prioritize, and roadmap product ideas; Jira Align, an enterprise agility
    solution that connects business and technology teams to align strategy with execution;
    Focus, a strategy hub for leadership teams; and Talent, a workforce planning app.
    In addition, it provides Trello, an AI-powered personal productivity tool; and
    Guard, an app for detecting and responding to security threats. The company has
    a strategic collaboration with Mattermost, Inc. for the development of Mattermost
    Docs, a sovereign, self-hosted successor to Confluence for defense, intelligence,
    and critical infrastructure organizations. The company was founded in 2002 and
    is headquartered in Sydney, Australia.
