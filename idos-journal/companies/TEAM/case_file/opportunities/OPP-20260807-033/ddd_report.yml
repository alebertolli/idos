    platform for planning, tracking, and managing work; Confluence, a connected workspace
    to create, organize, and share team knowledge, documents, and collaboration content;
    Loom, an asynchronous video communication tool to record and share videos; Jira
    Service Management, an intuitive service management solution for IT, HR, and other
    teams; and Rovo, an AI offering that assists teams with its Search, Chat and Agent
