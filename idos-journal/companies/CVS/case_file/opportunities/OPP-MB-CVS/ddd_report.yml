    - **Horizonte de los escenarios:** 2027-11-20.

    - **Moneda:** USD.

    - **Sensibilidad clave:** la valoración depende de que la rentabilidad de los
    segmentos principales se estabilice y de que los resultados se conviertan en caja.
    Sin beneficios comparables, deuda neta y supuestos por segmento, no puede calcularse
    una sensibilidad cuantitativa robusta.

    - **Limitación:** AOIF no incluye escenarios válidos en su análisis; los escenarios
    de DDD deben entenderse como referencias derivadas de objetivos observados, no
    como una estimación independiente del valor.


    ## 9. Preguntas Abiertas y Agenda de Investigación


