  rationale: Una recuperación coordinada del operador integrado requiere que el segmento
    de seguros deje de absorber presión por costes médicos. La tesis disponible plantea
    esta mejora como posibilidad, pero no aporta datos suficientes para confirmar
    que ya esté ocurriendo; por ello, la hipótesis se somete a prueba mediante el
    ratio de beneficios médicos publicado por la compañía.
