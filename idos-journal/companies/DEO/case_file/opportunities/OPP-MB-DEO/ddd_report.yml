    señala que faltan precio y fecha de referencia, deuda neta verificada, acciones,
    proyecciones de flujos de caja y supuestos de descuento y crecimiento.


    **Referencias observadas en el paquete:**


    - Precio: **USD 93.44** al **2026-10-30**.

    - Consenso de analistas registrado al **2026-11-20**: objetivo medio y mediano
    de **USD 110.71**, con rango de **USD 83–133**.

    - Momentum de precio a 12 meses: **1.466%** al **2026-10-30**, según el análisis
