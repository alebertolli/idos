    ## 4. Management y Gobierno Corporativo


    AOIF evalúa la calidad del management como **buena**, la asignación de capital
    como **neutral** y el alineamiento de insiders como **débil**. Estas calificaciones
    son cualitativas y el paquete no incluye su metodología, nombres de ejecutivos,
