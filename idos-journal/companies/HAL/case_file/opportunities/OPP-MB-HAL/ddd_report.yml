    ## 8. Marco de Valoración


    No es posible estimar un valor intrínseco robusto con los datos disponibles. AOIF
    reporta un PER de 12,9x, EV/EBITDA de 7,88x y FCF yield de 0%, pero no especifica
    de forma suficiente la fecha de referencia, los períodos de los denominadores
    ni los supuestos necesarios para contrastar esos indicadores. AOIF considera insuficiente
    el margen de seguridad y señala que no puede estimarse de forma robusta un valor
    intrínseco.


    Un marco apropiado para una empresa cíclica de servicios petroleros combinaría:


    - **Valoración por múltiplos**, comparando EV/EBITDA y PER a través del ciclo
    y frente a empresas comparables como [[BKR]] y [[TS]].

    - **Flujo de caja descontado normalizado**, con escenarios de actividad, precios
    de servicios, márgenes, impuestos, capex y capital de trabajo que eviten extrapolar
    mecánicamente un punto alto o bajo del ciclo.

    - **Análisis de balance y capacidad de desapalancamiento**, incorporando deuda
    neta y FCF bajo distintos niveles de actividad.


    Antes de concluir si la cotización está barata o cara se necesitan precio y fecha
    de referencia coherentes con las métricas, EBITDA y FCF comparables, FCF normalizado,
    capex, costo de capital y supuestos explícitos de crecimiento y márgenes. DDD
    reporta un consenso de analistas de **USD 43,56**, con un rango de **USD 29–51**,
    frente a una cotización de **USD 36,17 al 2026-10-30**. No se aporta fecha objetivo
    ni metodología de valoración; el consenso es una referencia observada, no una
    valoración intrínseca.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. **Calidad y comparabilidad financiera:** ¿A qué períodos, definiciones y fuentes
    corresponden exactamente el crecimiento de ingresos de 1,53%, el margen operativo
    de 13,18% y el ROIC de 14,4%?

    2. **Causas del deterioro:** ¿Qué explica la caída del margen bruto frente a FY
    2024 y el crecimiento reportado de FCF de -14,62%?

    3. **Perspectiva operativa:** ¿Qué crecimiento, márgenes, capex y condiciones
    de mercado sustentan expectativas de recuperación?

    4. **Generación de caja:** ¿Cómo evolucionan flujo operativo, capex y FCF a lo
    largo de varios ejercicios? ¿Cuál es la conversión de beneficios en caja?

    5. **Apalancamiento:** ¿Cuáles son los inputs y definiciones del ratio deuda neta/EBITDA
    superior a 4x, y qué trayectoria de FCF permitiría reducirlo?

    6. **Posición competitiva:** ¿Cuál es la penetración de mercado, la posición por
    segmento y geografía, y la evolución de los retornos incrementales sobre capital?

    7. **Sensibilidad a clientes y regiones:** ¿Qué proporción de ingresos y resultados
    depende de tipos de clientes, geografías, proyectos o niveles específicos de actividad
    de E&P?

    8. **Management y gobierno:** ¿Cuáles son la propiedad de insiders, la estructura
    de incentivos y la composición e independencia del board?

    9. **Valoración:** ¿Qué fecha, período y supuestos respaldan PER, EV/EBITDA, FCF
    yield y el consenso de analistas?

    10. **Agenda de seguimiento:** validar series financieras comparables; revisar
    las próximas publicaciones cuando se anuncien; y contrastar la evolución de márgenes,
    FCF y deuda frente a los valores reportados al 2026-09-30. La decisión de inversión
    permanece **pendiente de evaluación**, según AOIF.


