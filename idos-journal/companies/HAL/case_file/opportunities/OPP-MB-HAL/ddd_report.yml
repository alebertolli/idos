  existing_wiki: '## 1. Visión General de la Compañía


    Halliburton Company (HAL) presta productos, servicios y soluciones digitales especializados
    a la industria energética, principalmente para las actividades de exploración
    y producción de petróleo y gas. Su oferta abarca distintas etapas del ciclo del
    pozo: evaluación del subsuelo y del yacimiento, diseño y perforación, cementación,
    completación y producción.


    La compañía opera mediante dos segmentos: **Completion and Production** y **Drilling
    and Evaluation**. Atiende a compañías petroleras nacionales e internacionales
    y a productores independientes. La información disponible describe una operación
    global, pero no aporta un desglose geográfico de ingresos o resultados.


    HAL pertenece al sector cíclico de servicios petroleros. Su actividad depende
    en gran medida de los presupuestos de exploración y producción (E&P) de sus clientes,
    así como del nivel de actividad de perforación y completación. Comparte exposición
    a riesgos sectoriales con [[BKR]] y [[TS]]; su demanda también está vinculada
    a los presupuestos de E&P de compañías como [[BP]], [[COP]], [[CVX]], [[E]] y
    [[EQNR]].


    ## 2. Modelo de Negocio y Posición Competitiva


    Halliburton vende servicios, equipos y soluciones digitales utilizados para construir,
    completar y producir pozos. Entre los productos y servicios identificados se encuentran:


    - Estimulación, control de arena y cementación.

    - Herramientas y sistemas de completación, incluidos sistemas inteligentes y de
    levantamiento artificial.

    - Servicios de evaluación del subsuelo, perforación y otras actividades asociadas
    al ciclo del pozo.


    **Drivers de ingresos y rentabilidad:** actividad de perforación y completación;
    presupuestos de E&P de los clientes; utilización de equipos y personal; precios
    de los servicios; y mezcla de trabajos por segmento, geografía y tipo de cliente.
    El paquete no cuantifica la contribución de cada driver.


    La evaluación disponible caracteriza a Halliburton como un proveedor líder con
    un **moat estrecho**. Las ventajas potenciales señaladas son la escala global,
    la experiencia técnica, el historial operativo, la capacidad de desplegar equipos
    y personal en campo y la amplitud de servicios a lo largo del ciclo del pozo.
    No se aportan datos para medir la participación de mercado, la retención de clientes
    o los retornos incrementales sobre el capital por segmento.


    La industria es intensiva en capital y tecnología y cuenta con grandes proveedores
    globales y especialistas. La posición competitiva puede cambiar con los ciclos
    de gasto de los clientes y la presión sobre precios y utilización. [[BKR]] y [[TS]]
    son referencias relevantes para comparar la posición de HAL dentro del sector.


    ## 3. Perfil Financiero


    Las métricas proporcionadas pertenecen a períodos y fuentes distintos. No se debe
    asumir que sean directamente comparables sin validar período, definición y metodología.


    | Métrica | Valor reportado | Período / fecha | Fuente y limitaciones |

    |---|---:|---|---|

    | Crecimiento de ingresos | 1,53% | Período no especificado | AOIF; no se aportó
    serie histórica comparable ni metodología. |

    | Margen operativo | 13,18% | Período no especificado | AOIF; requiere validación
    del período y la definición. |

    | ROIC | 14,4% | Período no especificado | AOIF; requiere validar fuente, período
    y comparabilidad. |

    | Margen bruto | 14,82% | TTM al 2026-09-30 | DDD; inferior al 18,75% reportado
    para FY 2024. |

    | Flujo de caja libre (FCF) | USD 1.600 millones | TTM al 2026-09-30 | DDD. |

    | Crecimiento de FCF | -14,62% | TTM al 2026-09-30 | Valor reportado; no se proporcionan
    los FCF de ambos períodos comparables para recalcularlo. |

    | Deuda neta | USD 6.355 millones | Al 2026-09-30 | DDD. |

    | Deuda neta / EBITDA | Superior a 4x | Cálculo con EBITDA TTM | DDD; no se proporcionan
    aquí los inputs detallados para revisar el cálculo. |

    | Current ratio | 2,02x | Al 2026-09-30 | StockAnalysis, según DDD; por encima
    del umbral de alerta de 0,5x utilizado en el análisis. |

    | PER | 12,9x | Período y fecha no especificados | AOIF; referencia indicativa,
    no valoración intrínseca. |

    | EV/EBITDA | 7,88x | Período y fecha no especificados | AOIF; referencia indicativa,
    sujeta a validar los inputs. |

    | FCF yield | 0% | Período y fecha no especificados | AOIF; no se aportan inputs
    para verificarlo. |


    La combinación de un FCF TTM reportado de USD 1.600 millones con crecimiento negativo
    y un margen bruto TTM inferior al de FY 2024 señala una tendencia que requiere
    seguimiento, pero no permite identificar por sí sola las causas. AOIF describe
    la calidad de la tendencia financiera como estable, aunque también señala que
    faltan series comparables y datos de conversión de caja.


    La deuda neta y el apalancamiento calculado son riesgos a vigilar. El current
    ratio reportado no activa el umbral de alerta indicado por DDD. No se proporcionó
    una serie comparable de acciones para evaluar dilución interanual.


    **Fuentes:** [StockAnalysis — estados financieros de HAL](https://stockanalysis.com/stocks/hal/financials/)
    y [StockAnalysis — estadísticas de HAL](https://stockanalysis.com/stocks/HAL/statistics/),
    según la cadena de evidencia de DDD; AOIF para las métricas financieras no acompañadas
    de referencias detalladas.


    ## 4. Management y Gobierno Corporativo


    La evaluación de AOIF califica la calidad del management como **buena** y la asignación
    de capital como **neutral**. También señala que la escala y la amplitud operativa
    respaldan una evaluación favorable, pero que los datos disponibles no permiten
    atribuir resultados financieros a decisiones concretas de gestión.


    El alineamiento de insiders se califica como **débil** en AOIF. No se aportan
    cifras de propiedad accionaria de insiders, transacciones, remuneración ejecutiva
    ni políticas de incentivos que permitan verificar esa evaluación. Tampoco hay
    información sobre composición, independencia, experiencia o comités del board.
    Por ello, no es posible formular una conclusión completa sobre gobierno corporativo.


    ## 5. Tesis de Inversión


    **Hipótesis de inversión a investigar:** Halliburton podría sostener o recuperar
    rentabilidad y generación de caja mediante su oferta de servicios de perforación,
    completación, evaluación y producción. Su escala global, amplitud de servicios
    y experiencia técnica podrían favorecer su posición competitiva cuando los clientes
    mantienen o aumentan sus presupuestos de E&P.


    Elementos de respaldo disponibles:


    - AOIF identifica a HAL como líder competitivo y atribuye sus ventajas potenciales
    a escala global, experiencia, historial operativo y capacidad de despliegue.

    - Los valores aportados por AOIF muestran rentabilidad operativa positiva: margen
    operativo de 13,18% y ROIC de 14,4%. Ambos requieren validación de período, fuente
    y comparabilidad.

    - El current ratio reportado fue 2,02x al 2026-09-30, por encima del umbral de
    alerta empleado en DDD.

    - La cotización reportada subió 34,76% durante los 12 meses terminados el 2026-10-30.
    Este dato describe el desempeño pasado, no demuestra por sí mismo una mejora fundamental
    ni una valoración atractiva.


    La tesis no está confirmada: el paquete también registra un margen bruto TTM inferior
    al de FY 2024 y una caída reportada del FCF TTM. La evidencia disponible no determina
    si la recuperación operativa ocurrirá ni qué condiciones de actividad, precios
    o márgenes la sustentarían.


    ## 6. Riesgos y Contra-Tesis


    **Caso bajista:** una reducción de las expectativas de petróleo y gas podría llevar
    a los clientes a recortar o aplazar presupuestos de E&P. Menor actividad puede
    presionar la utilización de equipos, los precios de servicios y los márgenes,
    debilitando el FCF. El apalancamiento limitaría la flexibilidad financiera si
    la generación de caja no alcanza para estabilizar o reducir la deuda.


    Riesgos principales:


    - **Ciclicidad y deterioro operativo:** el margen bruto TTM fue 14,82% al 2026-09-30,
    frente a 18,75% en FY 2024; el FCF TTM reportado fue USD 1.600 millones y su crecimiento
    reportado, -14,62%.

    - **Exposición a presupuestos de E&P:** AOIF califica como altos tanto el impacto
    como la probabilidad de una reducción de precios o expectativas de petróleo y
    gas que provoque recortes o aplazamientos de gasto.

    - **Apalancamiento:** deuda neta de USD 6.355 millones al 2026-09-30 y ratio deuda
    neta/EBITDA calculado superior a 4x.

    - **Presión competitiva:** competencia entre grandes proveedores globales y especialistas,
    con efectos potenciales sobre precios, utilización y márgenes.

    - **Riesgo de interpretación de valoración:** la diferencia entre la cotización
    y el consenso de analistas no demuestra por sí misma un error de valoración.


    **Falsadores de la tesis:**


    1. La información financiera posterior muestra que FCF y márgenes siguen deteriorándose
    respecto de los valores TTM reportados al 2026-09-30.

    2. Los datos posteriores confirman un aumento del apalancamiento o una generación
    de caja insuficiente para reducir deuda.


