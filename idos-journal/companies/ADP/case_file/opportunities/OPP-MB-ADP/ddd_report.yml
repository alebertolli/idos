    8. ¿Existen adquisiciones de fintech o pagos en evaluación o anunciadas? No hay
    evidencia concreta en los materiales.

    9. ¿Cómo se comparan la retención, los precios y el crecimiento de ADP con competidores
    relevantes? Los inputs no ofrecen una comparativa cuantitativa.

    10. ¿Qué participaciones poseen los insiders y cómo se estructura la remuneración
    ejecutiva?

    11. ¿Cómo está compuesto el consejo de administración y qué mecanismos supervisan
    ciberseguridad, datos y cumplimiento?

    12. ¿Cuál es la fecha y fuente de las referencias de consenso de 299,73 USD y
