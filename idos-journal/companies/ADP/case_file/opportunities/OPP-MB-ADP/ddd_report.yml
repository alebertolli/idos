  existing_wiki: '## 1. Visión General de la Compañía


    **Automatic Data Processing, Inc. (ADP)** ofrece soluciones de gestión del capital
    humano (HCM) basadas en la nube y servicios externalizados de nómina, recursos
    humanos y cumplimiento. Opera, según la información disponible, en los segmentos
    Employer Services y PEO.


    Su oferta descrita incluye:


    - **RUN Powered by ADP**, para nómina, recursos humanos y cumplimiento en pequeñas
    empresas.

    - **ADP Workforce Now**, una solución HCM dirigida a empresas medianas y grandes.


    El modelo combina plataformas de software con servicios de procesamiento y externalización.
    La información aportada no precisa la distribución geográfica de los ingresos
    ni ofrece una descripción verificable de la presencia de ADP por región.


    ## 2. Modelo de Negocio y Posición Competitiva


    ADP integra datos laborales, procesamiento de nómina y requisitos de cumplimiento
    en sus plataformas y servicios. Sus clientes abarcan pequeñas empresas que externalizan
    tareas de nómina y RR. HH., y empresas medianas y grandes que necesitan soluciones
    HCM integradas.


    **Drivers de ingresos potenciales**, de acuerdo con la descripción del negocio:


    - Adopción de soluciones de nómina y HCM.

    - Externalización de procesos de RR. HH. y cumplimiento.

    - Continuidad y expansión de las relaciones con clientes.

    - Venta de soluciones adecuadas a distintos tamaños de empresa.


    El análisis AOIF identifica como posibles ventajas competitivas la escala, la
    confianza necesaria para procesar nóminas con precisión, el conocimiento de requisitos
    regulatorios, los costos de cambio y la integración de datos. Ese análisis califica
    la amplitud del moat como “amplio” y la posición competitiva como “líder”; son
    evaluaciones del análisis aportado, no métricas verificadas en la cadena de evidencia
    disponible.


    ADP compite con proveedores de software HCM y nómina, empresas de externalización
    y soluciones desarrolladas internamente por clientes. En el conjunto de compañías
    relacionadas de esta wiki figuran [[ACN]], [[CRM]] y [[MSFT]], aunque la información
    aportada no establece comparaciones directas de productos o cuota de mercado entre
    ellas y ADP.


    ## 3. Perfil Financiero


    Las cifras siguientes proceden de los análisis aportados. Cuando se especifica
    una fuente y fecha, se conservan como referencias observadas; no se dispone de
    fuentes autorizadas para validar todos los campos ni de una serie histórica comparable.


    | Métrica | Valor reportado | Período / fecha | Fuente y limitaciones |

    |---|---:|---|---|

    | Ingresos TTM | USD 22.263 millones | Período terminado el 2026-09-30 | StockAnalysis,
    [estadísticas de ADP](https://stockanalysis.com/stocks/ADP/statistics/) |

    | FCF TTM | USD 5.247 millones | Período terminado el 2026-09-30 | StockAnalysis,
    [estadísticas de ADP](https://stockanalysis.com/stocks/ADP/statistics/) |

    | Margen bruto | 48,83 % | TTM al 2026-09; fecha según DDD | No se aporta una
    URL autorizada para validar el campo |

    | Crecimiento de ingresos | 6,5 % | Período no especificado | AOIF; no se indica
    fuente, fecha ni metodología |

    | Margen operativo | 26,74 % | Período no especificado | AOIF; no se indica fuente,
    fecha ni metodología |

    | ROIC | 62,49 % | Período no especificado | AOIF; no se indica fuente, fecha
    ni metodología |

    | Current ratio | 1,03 | 2026-09-30 | Campo reportado por DDD; sin URL autorizada
    de validación |

    | PER | 26,7 | Sin fecha de referencia especificada | AOIF; falta la base de cálculo
    y la fuente |

    | EV/EBITDA | 18,48 | Sin fecha de referencia especificada | AOIF; falta la base
    de cálculo y la fuente |

    | FCF yield | 0 | Sin fecha de referencia especificada | AOIF; no se explican
    definición ni inputs |


    El análisis DDD no pudo calcular un CAGR de ingresos a tres años ni el crecimiento
    de FCF: indicó que faltaban fuentes autorizadas para validar los cálculos y, en
    el caso del FCF, su comparabilidad entre períodos TTM y ejercicios fiscales. Tampoco
    se aportó una serie de acciones comparable para medir dilución. El análisis AOIF
    señala que no dispone de datos de flujo de caja operativo y FCF suficientes para
    calcular la conversión de FCF.


    **Estructura de capital:** no hay información validada sobre deuda, efectivo,
    apalancamiento neto o dilución. Por tanto, las cifras disponibles no permiten
    evaluar de forma completa la solvencia ni la evolución del capital por acción.


    ## 4. Management y Gobierno Corporativo


    El análisis AOIF califica la calidad del management como “buena”, la asignación
    de capital como “neutral” y el alineamiento de insiders como “moderado”. No se
    aportan nombres, métricas, fechas ni fuentes que permitan contrastar esas evaluaciones.


    La información disponible tampoco describe la composición del consejo, la estructura
    de incentivos, la remuneración ejecutiva ni la participación accionaria de insiders.
    Estos aspectos requieren investigación adicional antes de extraer conclusiones
    sobre gobierno corporativo o alineamiento de largo plazo.


    ## 5. Tesis de Inversión


    La tesis potencial es que ADP combina plataformas de HCM con servicios externalizados
    de nómina y RR. HH., en actividades que pueden requerir procesamiento fiable,
    integración de datos y conocimiento de cumplimiento. La escala, los costos de
    cambio y la complejidad operativa podrían favorecer la retención de clientes,
    pero la información aportada no incluye métricas de retención ni evidencia cuantitativa
    de dichas ventajas.


    Entre los datos observados que podrían respaldar la continuidad del negocio figuran
    ingresos TTM de **USD 22.263 millones** y FCF TTM de **USD 5.247 millones** para
    el período terminado el **2026-09-30**, según [StockAnalysis](https://stockanalysis.com/stocks/ADP/statistics/).
    Estas cifras son una referencia de escala y generación de caja para ese período;
    por sí solas no demuestran crecimiento sostenido, calidad de la conversión de
    caja, retornos sobre capital ni infravaloración.


    La clasificación DDD es “Investigación fundamental requerida”. El perfil “MULTIBAGGERS”
    y la puntuación de descubrimiento de 73,02 se presentan como criterios de priorización
    de investigación, no como recomendación de inversión ni como evidencia independiente
    de potencial de rendimiento.


    ## 6. Riesgos y Contra-Tesis


    **Riesgos identificados en los análisis aportados:**


    - **Interrupciones, errores de procesamiento o incidentes de ciberseguridad:**
    podrían afectar datos de empleados y pagos de nómina. AOIF los califica con impacto
    alto y probabilidad media.

    - **Competencia y presión de precios:** proveedores HCM y de nómina, productos
    integrados de menor costo o soluciones internas de clientes podrían limitar el
    crecimiento o afectar la retención. AOIF asigna impacto y probabilidad medios
    a este riesgo.

    - **Ventaja competitiva no cuantificada:** no se aportan datos de retención, expansión
    por cliente, cuota de mercado, penetración ni presión competitiva. No es posible
    medir la sostenibilidad del moat.

    - **Calidad incompleta de la evidencia financiera:** varias métricas carecen de
    fuente autorizada, período definido o serie comparable. No se puede validar la
    trayectoria de crecimiento, conversión de FCF, apalancamiento neto o dilución.


    **Contra-tesis:** una escala elevada y un FCF positivo no bastan para demostrar
    retornos atractivos sobre el capital, crecimiento futuro o una ventaja competitiva
    durable. La evidencia aportada tampoco permite determinar si el precio de mercado
    incorpora expectativas demasiado optimistas o pesimistas.


    **Triggers de falsación a vigilar:**


    - Deterioro persistente de ingresos o FCF frente a períodos históricos comparables.

    - Evidencia verificable de pérdida de clientes, presión de precios o sustitución
    de las plataformas.

    - Datos que muestren erosión de retención, menor expansión por cliente o deterioro
    de la posición competitiva.


    ## 7. Catalizadores y Timeline


    | Catalizador o evento | Fecha esperada | Impacto potencial | Evidencia disponible
    |

    |---|---|---|---|

    | Evolución de ingresos y FCF en períodos comparables | Sin fecha especificada;
    revisar con cada nueva publicación financiera | Puede aportar evidencia sobre
