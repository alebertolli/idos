  existing_wiki: '## 1. Visión General de la Compañía


    **Automatic Data Processing, Inc. (ADP)** ofrece soluciones de gestión del capital
    humano (HCM) y servicios externalizados de nómina, recursos humanos y cumplimiento.
    Sus plataformas en la nube combinan software con procesos y servicios relacionados
    con la administración de empleados, nómina y obligaciones regulatorias.


    - **Sector:** software y servicios de HCM, nómina y recursos humanos.

    - **Clientes:** pequeñas empresas y organizaciones medianas y grandes.

    - **Productos mencionados:** RUN Powered by ADP, orientado a pequeñas empresas,
    y ADP Workforce Now, para empresas medianas y grandes.

    - **Geografía:** el material de investigación describe operaciones y soluciones
    internacionales, pero no proporciona un desglose por región.

    - **Modelo de negocio:** ingresos recurrentes por suscripciones y servicios; el
    crecimiento depende, entre otros factores, de captar clientes y empleados procesados,
    retener cuentas y ampliar servicios.


    **Base de evidencia:** descripción del negocio y productos en AOIF; el extracto
    de la wiki existente también identifica a ADP como proveedor de soluciones HCM
    en la nube. Los materiales no incluyen una fecha específica para AOIF ni un desglose
    geográfico verificable.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de revenue


    1. Crecimiento de la base de clientes y del número de empleados procesados.

    2. Retención y expansión de suscripciones y servicios recurrentes.

    3. Adopción de soluciones integradas de nómina, RR. HH. y cumplimiento.

    4. Posible expansión del negocio PEO y de soluciones automatizadas; el crecimiento
    que estas áreas puedan aportar no está cuantificado en los materiales.


    ### Moat y posición competitiva


    AOIF caracteriza la posición competitiva de ADP como líder, con un moat amplio.
    Las ventajas señaladas incluyen escala, reputación y confianza, experiencia y
    datos sobre nómina y cumplimiento, y costes de cambio asociados a la integración
    de los procesos de nómina y RR. HH. La evaluación de DDD también atribuye el moat
    a escala, datos y cumplimiento regulatorio.


    Estas valoraciones son **análisis de los materiales de investigación**, no medidas
    independientes verificadas. No se proporcionan cifras de cuota de mercado, tasas
    de retención ni comparaciones detalladas con competidores.


    La demanda estructural de digitalización, automatización, analítica y cumplimiento
    podría sostener la industria. ADP puede compartir exposición sectorial a digitalización
    y servicios empresariales con compañías como [[ACN]], aunque los materiales no
    establecen que sea un competidor directo. Las compañías relacionadas en la lista
    sectorial de la wiki incluyen también [[ADBE]].


    ## 3. Perfil Financiero


    Las cifras siguientes proceden de los materiales suministrados y no se acompañan
    de estados financieros, periodo fiscal detallado ni referencias externas. Deben
    tratarse como **datos reportados por la investigación, pendientes de validación**.


    | Métrica | Valor informado | Contexto y limitaciones |

    |---|---:|---|

    | Crecimiento de ingresos | 6,5% TTM | Informado en DDD y AOIF; no se facilita
    una serie histórica comparable. |

    | Margen operativo | 26,7%–26,74% | Informado en DDD y AOIF; no se especifica
    el periodo contable exacto. |

    | ROIC | 62,49% | Informado en AOIF; no se detalla el método de cálculo. |

    | Flujo de caja libre (FCF) | 5.250 millones USD TTM | Cifra afirmada por DDD.
    AOIF advierte que no se proporcionó una serie verificable de FCF ni una tasa de
    conversión. Requiere conciliación con fuentes financieras primarias. |

    | PER | 26,73 | Informado en AOIF; faltan fecha, precio y definición de beneficios
    utilizados. |

    | EV/EBITDA | 18,43 | Informado en AOIF; faltan fecha y datos de cálculo. |

    | FCF yield | 0 | Informado en AOIF; no se proporciona metodología. No debe interpretarse
    como una medida validada. |


    AOIF describe la tendencia financiera como estable y el crecimiento como moderado.
    DDD califica la salud financiera como fuerte y señala que no identifica problemas
    de liquidez o endeudamiento, pero no aporta cifras de deuda, caja ni vencimientos.
    Por tanto, no es posible evaluar aquí de forma independiente la estructura de
    capital o la conversión de beneficios en caja.


    ## 4. Management y Gobierno Corporativo


    La evaluación de DDD califica la gestión como buena y señala capacidad para crecer
    orgánicamente y mediante adquisiciones. AOIF también considera buena la calidad
    del management y califica la asignación de capital como creadora de valor, pero
    indica que la evaluación es provisional y que faltan datos actuales específicos.


    | Aspecto | Evidencia disponible | Limitación |

    |---|---|---|

    | Calidad de gestión | Evaluada como buena por DDD y AOIF | No se identifican
    ejecutivos ni se aportan métricas históricas de cumplimiento de objetivos. |

    | Asignación de capital | AOIF la califica como creadora de valor | No se incluyen
    resultados detallados de adquisiciones, recompras, dividendos o inversiones. |

    | Alineamiento de insiders | Moderado según AOIF | No se proporcionan participaciones,
    transacciones ni planes de incentivos. |

    | Consejo de administración | Sin información en los materiales | No se aportan
    composición, independencia, competencias ni comités. |


    No hay evidencia suficiente para formular una conclusión sobre insider ownership,
    remuneración ejecutiva o calidad del gobierno corporativo más allá de las evaluaciones
    generales anteriores.


    ## 5. Tesis de Inversión


    **Tesis resumida:** ADP combina servicios recurrentes de nómina y HCM con escala,
    confianza de clientes y experiencia en cumplimiento. Si mantiene la retención
    y amplía sus soluciones, puede sostener un crecimiento moderado y una generación
    de caja atractiva. La investigación clasifica la oportunidad como **quality at
    fair price** y la opinión de valoración como **justa**.


    ### Argumentos a favor


    - **Ingresos recurrentes:** suscripciones y servicios vinculados a procesos de
    nómina y RR. HH. que los clientes deben mantener de manera continua. AOIF identifica
    la retención y expansión de suscripciones como drivers.

    - **Barreras de cambio potenciales:** la integración de datos y procesos, el conocimiento
    de reglas fiscales y la experiencia operativa pueden elevar el coste de migración.
    Este moat es una inferencia de DDD y AOIF, no está cuantificado mediante datos
    de retención.

    - **Escala y cumplimiento:** DDD y AOIF destacan escala, reputación, experiencia
    y complejidad regulatoria como ventajas competitivas.

    - **Perfil operativo reportado:** crecimiento de ingresos de 6,5% y margen operativo
    cercano a 27%, según los datos facilitados; ambos requieren validación.

    - **Opción de crecimiento por automatización:** una suite de IA para nómina podría
    mejorar eficiencia o permitir servicios de mayor valor. Es una hipótesis de catalizador
    con confianza media en DDD, no un resultado confirmado.


    DDD recomienda mantener la posición por el carácter recurrente del negocio, el
    moat y la generación de caja reportada. Esta conclusión depende de validar las
    métricas financieras y de que la valoración no incorpore ya expectativas excesivas.


    ## 6. Riesgos y Contra-Tesis


    ### Caso bajista y riesgos clave


    | Riesgo | Evaluación en los materiales | Posible efecto |

    |---|---|---|

    | Ciberseguridad, pérdida de datos o interrupción de servicios críticos | Impacto
    alto, probabilidad media según AOIF | Daño a clientes, costes de recuperación,
    sanciones y deterioro de la confianza. |

    | Cambios fiscales, laborales y de protección de datos | Impacto alto, probabilidad
    media según DDD y AOIF | Costes de adaptación, mayor complejidad operativa o incumplimientos.
    |

    | Competencia de fintechs y proveedores de nube | Impacto alto, probabilidad media
    según DDD | Presión en precios, retención y crecimiento. |

    | Desaceleración de adopción o expansión | Riesgo contemplado en el escenario
    bajista de DDD | Menor crecimiento de ingresos y menor justificación para múltiplos
    elevados. |

    | Ejecución de productos de IA | Catalizador no confirmado | Retrasos, baja adopción
    o falta de monetización limitarían el upside esperado. |


    ### Contra-tesis


    La recurrencia y el moat atribuidos a ADP podrían no traducirse en crecimiento
    superior: el crecimiento reportado es moderado, la tesis de IA no está demostrada
    y la valoración fue descrita como cercana a justa. Además, los materiales no documentan
    la tasa de retención ni una serie verificable de conversión de beneficios en FCF.


    ### Triggers de falsación


    - Deterioro persistente del crecimiento de ingresos frente al 6,5% reportado,
    una vez validada la serie histórica.

    - Descenso sostenido de márgenes o ROIC respecto de las cifras informadas.

    - Evidencia de pérdida de clientes, mayor presión de precios o debilitamiento
    de la retención.

    - Incidente material de ciberseguridad o interrupciones prolongadas.

    - Retraso de la suite de IA, adopción baja o ausencia de monetización observable.

    - Confirmación de que el FCF reportado no se sostiene o que la posición de deuda
    y liquidez es menos sólida de lo indicado.


    ## 7. Catalizadores y Timeline


    Los catalizadores de esta sección son **expectativas o hipótesis de DDD**, no
    anuncios corporativos confirmados. Las fechas calendario no están especificadas;
    los horizontes son los indicados por la investigación.


    | Catalizador | Horizonte indicado | Probabilidad / confianza informada | Impacto
    potencial | Estado de evidencia |

    |---|---|---|---|---|

    | Implementación y adopción de una nueva suite de IA para nómina | Medio plazo
    | 45%; confianza media | Alto, si mejora eficiencia o permite servicios de mayor
    valor | Hipótesis de DDD; no se proporciona fecha de lanzamiento confirmada ni
    plan de inversión de capital. |

    | Adquisición estratégica de una fintech de pagos | Corto plazo | 30%; confianza
    baja | Alto, si amplía la oferta de servicios | Posibilidad planteada por DDD;
    no se identifica objetivo, anuncio ni evidencia de una operación concreta. |


    DDD también identifica el lanzamiento exitoso de IA como posible cambio de percepción
    del mercado, con impacto alto y horizonte medio. No se especifican fechas más
    precisas ni hitos verificables.


    ## 8. Marco de Valoración


    AOIF informa un PER de 26,73 y un EV/EBITDA de 18,43, pero no facilita fecha de
    cotización, precio de referencia ni datos necesarios para reconstruir los múltiplos.
    AOIF considera insuficiente el margen de seguridad y no estima un valor intrínseco
    por falta de información verificable. DDD describe la valoración como justa.


    DDD incluye una referencia de consenso medio de **299,73 USD** frente a un precio
    actual de **301,58 USD**, pero no se proporciona fecha o fuente para esas cifras.
    La diferencia es pequeña y no basta por sí sola para determinar el valor razonable.


    ### Escenarios indicativos de DDD


    La tabla utiliza el análisis de escenarios con fecha de referencia **2026-11-19**
    y horizonte **2028-11-19**, tal como aparece en DDD. Son precios objetivo de escenarios,
    no estimaciones verificadas ni garantía de resultados.


    | Escenario | Precio objetivo | Supuesto central |

    |---|---:|---|

    | Bajista | 260 USD | Retraso de la adopción de IA, mayor competencia en precios
    y crecimiento de ingresos reducido al 3%. |

    | Alcista | 330 USD | Alta adopción de la suite de IA, crecimiento de ingresos
    del 9% anual y mejora de márgenes. |


    ### Sensibilidades y metodología


    La valoración debería contrastarse con métodos de múltiplos —PER y EV/EBITDA—
    y con un modelo de flujo de caja descontado una vez verificados FCF, deuda neta,
    acciones diluidas y supuestos de crecimiento. Las sensibilidades principales serían:


    - Crecimiento de ingresos y número de empleados procesados.

    - Retención y expansión de clientes.

    - Evolución del margen operativo y conversión a FCF.

    - Ritmo de adopción y monetización de IA.

    - Presión competitiva sobre precios.

    - Tasa de descuento y múltiplo terminal.


    Los materiales disponibles no permiten calcular una valoración intrínseca rigurosa
    ni un margen de seguridad fiable.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es la tasa de retención de clientes a tres años, y cómo varía por tamaño
    de cliente y producto?

    2. ¿Cuáles son los planes de inversión de capital de ADP en IA para los próximos
