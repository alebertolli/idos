    |


    No se proporcionan fechas de resultados, lanzamientos, cambios regulatorios ni
    hitos corporativos específicos.


    ## 8. Marco de Valoración


    ### Datos de referencia disponibles


    - **Precio actual informado:** 301,58 USD, sin fecha independiente en el dato
    de DDD; el análisis está fechado **19-11-2026**.

    - **Precio objetivo medio de analistas informado:** 299,73 USD, descrito como
    cercano al precio actual. La fuente y fecha exactas del consenso no están especificadas.

    - **P/E:** 26,73x y **EV/EBITDA:** 18,43x, según AOIF; faltan fecha, periodo y
    reconciliación de cifras.

    - **Margen de seguridad:** evaluado como insuficiente por AOIF.

    - **Valor intrínseco:** AOIF indica que no puede estimarse rigurosamente con los
    datos disponibles, por falta de FCF verificable, precio de referencia fechado
    y supuestos explícitos de descuento y crecimiento.


    ### Metodología apropiada


    Para un negocio de servicios y software con ingresos potencialmente recurrentes,
    conviene contrastar:


    1. **Flujo de caja descontado**, con supuestos explícitos sobre crecimiento, márgenes,
    conversión de caja, reinversión y tasa de descuento.

    2. **Múltiplos relativos**, como P/E y EV/EBITDA, comparados con pares realmente
    comparables y con la propia historia de ADP.

    3. **Rendimiento de FCF**, una vez verificados el FCF, la capitalización y el
    periodo de cálculo.


    No hay datos suficientes para construir una valoración independiente fiable ni
    para fijar un precio objetivo propio.


    ### Escenarios suministrados


    Escenarios DDD para el horizonte **19-11-2027**, con fecha de análisis **19-11-2026**:


    | Escenario | Precio objetivo | Supuestos clave |

    |---|---:|---|

    | Bajista | **250 USD** | CAGR de ingresos de 3 años cae a 4%; margen bruto desciende
    a 44%. |

    | Alcista | **345 USD** | CAGR de ingresos de 3 años se mantiene en torno a 6,8%;
    margen bruto sube a 51%, con expansión de PEO. |


    Estos objetivos son resultados de escenarios, no estimaciones verificadas. Los
    escenarios no incluyen las fuentes de los supuestos (`sources` aparece como nulo)
    y el CAGR usado no es verificable en el bloque de ratios de DDD.


    **Sensibilidad cualitativa:** la valoración depende especialmente de que ADP mantenga
    el crecimiento de ingresos y preserve o expanda márgenes. Un descenso del crecimiento
    hacia 4% y una caída del margen bruto apoyarían el escenario bajista; crecimiento
    cercano a 7% y margen bruto superior al 50% serían necesarios para respaldar el
    escenario alcista descrito.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. **Verificar los estados financieros:** obtener ingresos, margen bruto, margen
    operativo, flujo operativo y FCF por ejercicio y TTM, con periodos comparables.

    2. **Resolver la discrepancia sobre FCF:** comprobar la afirmación de DDD de que
    el FCF supera el ingreso neto frente a la ausencia de cifras de conversión de
    FCF señalada por AOIF.

    3. **Validar el crecimiento:** determinar el periodo exacto del crecimiento de
    ingresos de 6,5% de AOIF y reconstruir el CAGR de tres años; DDD declara que este
    último no está disponible por falta de referencias explícitas a los inputs.

    4. **Confirmar deuda y liquidez:** revisar deuda, caja, vencimientos, net debt/EBITDA
    y cobertura de intereses. Aclarar si el valor de cobertura de 0x es real o una
    limitación de datos.

    5. **Medir la dilución:** obtener la evolución de acciones básicas y diluidas
    y el efecto de compensación basada en acciones.

    6. **Examinar RUN y PEO:** recopilar crecimiento de clientes, retención, ingresos,
    márgenes y contribución al crecimiento consolidado.

    7. **Verificar el moat:** buscar métricas de retención, renovación, cuota de mercado
    y costes de cambio, además de comparar soluciones y competencia directa.

    8. **Investigar ciberseguridad:** revisar incidentes, gastos de seguridad, controles
    operativos y exposición a interrupciones.

    9. **Completar el análisis de management y gobierno:** identificar equipo directivo,
    consejo, propiedad de insiders, remuneración y asignación de capital.

    10. **Actualizar la valoración:** fechar el precio, verificar los múltiplos, identificar
    la fuente del consenso de 299,73 USD y modelar FCF con supuestos explícitos.

    11. **Revisar escenarios y falsadores:** confirmar si los umbrales de ingresos,
    márgenes y apalancamiento propuestos por DDD son coherentes con los estados financieros
    y con la evolución futura del negocio.


