    Al 2026-11-21, consenso medio de USD 301,19 y rango de USD 250–345; [StockAnalysis](https://stockanalysis.com/stocks/adp/forecast/)
    |

    | Cambios en retención, crecimiento orgánico o ingresos por segmento | Sin fecha
    especificada; requiere nuevas divulgaciones verificables | Ayudaría a evaluar
    expansión, demanda y fortaleza competitiva | Identificado como punto de monitoreo
    por AOIF; no se aportan métricas actuales |


    Las fechas de publicación de resultados, eventos de producto y revisiones de objetivos
    no están especificadas en los materiales de entrada.


    ## 8. Marco de Valoración


    La información disponible no permite calcular un valor intrínseco defendible.
    AOIF considera insuficiente el margen de seguridad, pero no aporta una estimación
    de valor ni los supuestos necesarios para replicarla. También indica que faltan
    precio y fecha de referencia, acciones diluidas, proyecciones de flujos de caja,
    tasa de descuento y supuestos de crecimiento.


    Una valoración futura debería considerar:


    1. **Flujos de caja descontados:** normalizar FCF y proyectar crecimiento, márgenes,
    reinversión y tasa de descuento con datos comparables y verificables.

    2. **Valoración relativa:** comparar múltiplos de beneficios, EV/EBITDA y FCF
    con pares pertinentes, verificando períodos y metodologías homogéneos.

    3. **Valor por acción:** incorporar acciones diluidas, deuda y efectivo para traducir
    el valor de la empresa a valor patrimonial por acción.

    4. **Sensibilidad:** evaluar escenarios de crecimiento, márgenes, retención, conversión
    de FCF y tasa de descuento. No hay inputs suficientes para cuantificar rangos
    de sensibilidad.


    Como referencias de mercado, DDD reporta un precio de **USD 305,16 al 2026-11-20**
    y un objetivo medio de analistas de **USD 301,19**, con rango de **USD 250–345
    al 2026-11-21**. Fuentes: [yfinance](https://finance.yahoo.com/quote/ADP/) y [StockAnalysis](https://stockanalysis.com/stocks/adp/forecast/).
    La diferencia entre cotización y consenso no demuestra por sí sola sobrevaloración
    ni infravaloración: el consenso no equivale a una valoración independiente.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    - ¿Cómo han evolucionado ingresos, FCF, márgenes y conversión de caja en períodos
    comparables y con fuentes verificables?

    - ¿Cuál es la trayectoria de ROIC y cómo se calcula el valor reportado de 62,49
    %?

    - ¿Qué niveles de retención, pérdida de clientes y expansión por cliente registra
    ADP, y cómo varían por segmento?

    - ¿Cuál es el tamaño de los mercados direccionables, la penetración de ADP y su
    evolución?

    - ¿Cómo se comparan sus soluciones, precios y resultados con los de competidores
    y alternativas internas de los clientes?

    - ¿Qué exposición existe a deuda, efectivo, apalancamiento neto y dilución?

    - ¿Qué proporción de los ingresos y resultados procede de cada segmento y geografía?

    - ¿Qué información verificable permite evaluar la calidad del liderazgo, la asignación
    de capital, los incentivos y el alineamiento de insiders?

    - ¿Qué supuestos de crecimiento, margen, reinversión y descuento sustentan una
    valoración propia?

    - ¿Cómo se traducen los riesgos de ciberseguridad, interrupciones y errores de
    nómina en controles, costos o pérdidas observables?


