dominio_business_quality:
  analisis: El foso competitivo (Moat) de ADP se basa en altisimos costes de cambio
    (switching costs) y efectos de red/escala. Cambiar de proveedor de nominas genera
    un alto riesgo operativo y de cumplimiento fiscal para cualquier empresa. Con
    productos adaptados a PYMEs (RUN) y grandes corporaciones (Workforce Now, Lyric),
    ADP procesa la nomina de 1 de cada 6 trabajadores en EE.UU. La durabilidad de
    su ventaja competitiva es de muy alto grado.
  rating: excepcional
