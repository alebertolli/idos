prompt_inputs:
  business_model: Automatic Data Processing, Inc. provides cloud-based human capital
    management (HCM) solutions worldwide. It operates in two segments, Employer Services
    and Professional Employer Organization (PEO). The Employer Services segment offers
    strategic, cloud-based platforms, and human resources (HR) outsourcing solutions.
    This segment's offerings include RUN Powered by ADP, a software platform for small
    business payroll, HR, and compliance; ADP Workforce Now, a HCM solution used across
    mid-sized and large businesses to manage employees; and ADP Lyric HCM, a solution
    for HR management, payroll, workforce management, talent, and data analytics.
    The PEO Services segment provides HR and employment administration outsourcing
    solutions under ADP TotalSource name to businesses through a co-employment model.
    The segment also provides guidance, user-friendly technology, comprehensive employee
    benefits, and a risk management, safety, and workers' compensation program. The
    company was founded in 1949 and is headquartered in Roseland, New Jersey.
