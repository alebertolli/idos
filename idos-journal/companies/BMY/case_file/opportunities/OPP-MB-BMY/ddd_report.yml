  existing_wiki: '## 1. Visión General de la Compañía


    **Bristol-Myers Squibb Company (BMY)** es una empresa biofarmacéutica integrada
    que descubre, desarrolla, licencia, fabrica y comercializa medicamentos de marca.
    Opera en el sector farmacéutico, con actividad en oncología, hematología e inmunología,
    entre otras áreas.


    Su cadena de valor comprende investigación y desarrollo propios y mediante colaboraciones,
    ensayos clínicos, obtención de autorizaciones regulatorias, fabricación y comercialización.
    Sus clientes y canales incluyen mayoristas, distribuidores farmacéuticos, farmacias
    especializadas y minoristas. La información disponible describe actividad comercial
    global, pero no aporta un desglose geográfico de ingresos.


    La cartera mencionada incluye Opdivo, Opdivo Qvantig, Yervoy, Reblozyl, Breyanzi,
    Opdualag, Abecma, Krazati, Augtyro y Revlimid en oncología y hematología, y Orencia,
    Zeposia y Sotyktu en inmunología. La lista no incluye datos de ventas ni contribución
    por producto.


    **Clasificación provisional:** *compounder castigado*. Esta etiqueta refleja una
    hipótesis de inversión, no una conclusión respaldada por una valoración intrínseca
    completa. La integridad de la tesis figura como activa, aunque la evidencia suministrada
    no permite determinar si la cotización descuenta en exceso los riesgos del negocio.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    Los ingresos dependen de la comercialización de medicamentos de marca protegidos
    por patentes o exclusividades, de la demanda de sus áreas terapéuticas y de la
    capacidad de desarrollar, aprobar y lanzar nuevos productos. La cartera de desarrollo
    también puede contribuir al crecimiento si sus activos obtienen resultados clínicos
    y regulatorios favorables.


    La información disponible no cuantifica los ingresos por producto, área terapéutica
    o región, ni permite comparar las ventas de productos nuevos con la erosión de
    los maduros.


    ### Moat y posición competitiva


    Las ventajas competitivas potenciales identificadas son:


    - Patentes y exclusividades regulatorias.

    - Evidencia clínica y experiencia en áreas terapéuticas especializadas.

    - Marcas, escala comercial y relaciones con distribuidores y otros canales.

    - Capacidad de investigación, desarrollo, fabricación y comercialización.


    La evaluación suministrada describe un **moat estrecho** y una posición competitiva
    de **liderazgo**. Estas valoraciones no vienen acompañadas de métricas comparativas
    de cuota de mercado, rentabilidad por producto o resultados clínicos frente a
    competidores. La protección por propiedad intelectual es temporal y puede dar
    paso a erosión competitiva tras la pérdida de exclusividad.


    Entre las compañías del mismo sector incluidas en la wiki están [[ABBV]], [[ABT]],
    [[AMGN]], [[AZN]] y [[BIIB]]. Los materiales disponibles no presentan una comparación
    directa entre estas empresas y BMY.


    ### Dinámica de la industria


    La industria requiere inversión significativa en investigación y desarrollo y
    está sujeta a regulación y ciclos de desarrollo prolongados. Los ensayos pueden
    fallar, las aprobaciones pueden retrasarse y los productos comerciales pueden
    perder exclusividad. Por ello, la continuidad del crecimiento depende, entre otros
    factores, de que la cartera de nuevos productos sustituya ingresos de medicamentos
    maduros.


    ## 3. Perfil Financiero


    Las cifras siguientes proceden de las observaciones suministradas. No se proporcionaron
    estados financieros, definiciones completas de las métricas ni metodología de
    cálculo; deben tratarse como datos reportados y no como una reconstrucción contable
