  ingresos y generación de caja mientras reinvierte en productos y compensa la erosión
  de productos existentes. La evidencia entregada confirma ingresos TTM de USD 50.033
  millones y FCF TTM de USD 9.286 millones al 2026-09-30, pero no permite atribuir
  crecimiento, reinversión o retornos sobre capital a productos concretos. La tendencia
  de margen bruto reportada —78,04% en FY 2022 y 70,5% TTM— y la caída del FCF TTM
  requieren explicación; no son por sí solas prueba de deterioro estructural.
