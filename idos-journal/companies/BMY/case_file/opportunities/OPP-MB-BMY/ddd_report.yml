    | Margen operativo | 32,36% | No especificado | No se aporta definición ni serie
    histórica |

    | ROIC | 23,6% | No especificado | No se aporta metodología de cálculo |

    | P/E | 12,96 | Fecha de referencia no especificada | No se especifica si es trailing
    o forward |

    | EV/EBITDA | 8,3 | Fecha de referencia no especificada | Sin datos para validar
    numerador o EBITDA |

    | FCF TTM | 9.290 millones | Período de referencia no especificado | Moneda informada
    por el proveedor; no se aporta reconciliación |

    | Precio observado | USD 58,54 | 2026-11-19 | Cotización reportada |

    | Objetivos de analistas | Rango observado de USD 40–80; media de USD 65,25 |
    2026-11-20 | Consenso reportado; no constituye valoración independiente |


    La tendencia de ingresos fue descrita como estable y el perfil de crecimiento
    como moderado. El análisis de salud financiera calificó la situación como adecuada.
    Sin datos de deuda, efectivo, vencimientos, cobertura de intereses, flujo de caja
    operativo y capex, no es posible evaluar de manera independiente el apalancamiento,
    la liquidez o la conversión de beneficios a caja.


    Se reportó un FCF TTM de 9.290 millones, pero el material no ofrece los componentes
    necesarios para comprobarlo. Tampoco permite establecer si ese flujo es normalizado
