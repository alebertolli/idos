    | Alto | Evaluación de confianza baja; no se identifican activos, hitos ni fechas
    |


    El análisis de escenarios usa como fecha de referencia el 2026-11-20 y un horizonte
    al 2027-11-20. Sus precios objetivo son referencias ancladas en el rango de objetivos
    observado, no valoraciones independientes:


    | Escenario | Precio objetivo | Interpretación reportada |

    |---|---:|---|

    | Bajista | USD 40 | Anclado al límite bajo del rango observado; no es valoración
    independiente |

    | Alcista | USD 80 | Anclado al límite alto del rango observado; requiere mejora
    de percepción y ejecución |


    ## 8. Marco de Valoración


    La valoración se reporta como **justa**, pero la conclusión es provisional: la
    información disponible no permite calcular un valor intrínseco con rigor. La evaluación
    del error de valoración también figura como **incierta**.


    ### Métricas disponibles


    - P/E reportado: 12,96.

    - EV/EBITDA reportado: 8,3.

    - Cotización observada: USD 58,54 al 2026-11-19.

    - Objetivo medio reportado: USD 65,25 al 2026-11-20.

    - Rango de objetivos reportado: USD 40–80.


    AOIF señala que el margen de seguridad es **insuficiente** y que no puede estimarse
    el valor intrínseco con rigor debido a la falta de precio y fecha de referencia
    para una valoración comparable, flujo de caja libre normalizado y otros supuestos.
    No se debe interpretar la diferencia entre cotización y objetivo medio como margen
    de seguridad.


    ### Metodología apropiada para una valoración futura


    Una valoración propia debería combinar:


    1. Un modelo de flujo de caja descontado con supuestos explícitos sobre ventas,
    márgenes, inversión y conversión a caja.

    2. Escenarios de ingresos por producto que incorporen fechas de expiración de
    patentes y exclusividades, erosión posterior y crecimiento de productos recientes.

    3. Un análisis de sensibilidad a la duración de la exclusividad, la velocidad
    de erosión, la probabilidad de éxito clínico y regulatorio y la tasa de descuento.

    4. Una comparación por múltiplos con compañías farmacéuticas pertinentes, incluida,
    cuando los datos estén disponibles, la comparación con [[ABBV]], [[ABT]], [[AMGN]],
    [[AZN]] y [[BIIB]].


    Los escenarios de USD 40 y USD 80 no sustituyen este análisis: son límites tomados
    del rango de objetivos observado.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuáles son los ingresos, márgenes y concentración de ventas por producto,
    área terapéutica y región?

    2. ¿Qué productos enfrentan vencimientos de patentes o exclusividades, en qué
    fechas y con qué impacto esperado en ingresos y beneficios?

    3. ¿Qué ventas y contribución económica aportan los productos recientes frente
    a los productos maduros?

    4. ¿Qué activos componen la cartera de desarrollo, cuáles son sus hitos clínicos
    y regulatorios, y qué probabilidades de éxito se utilizan?

    5. ¿Cómo se calcula el FCF TTM de 9.290 millones y qué cifras de flujo operativo
    y capex lo sustentan?

    6. ¿Cuál es la estructura de capital, incluida deuda, efectivo, vencimientos y
    cobertura de intereses?

    7. ¿Cuáles son las definiciones, fechas y metodologías de las cifras de margen
    operativo, ROIC, P/E y EV/EBITDA?

    8. ¿Quién integra la dirección ejecutiva y el board, y qué evidencia respalda
    las evaluaciones de alineamiento, calidad del management y asignación de capital?

    9. ¿Qué métricas de fabricación, calidad, cumplimiento regulatorio y continuidad
    de suministro permiten cuantificar los riesgos operativos?

    10. ¿Cómo se construyeron los objetivos de analistas y qué horizonte, supuestos
    y cobertura de analistas respaldan el rango reportado?


    **Base de evidencia:** síntesis de los inputs DDD y AOIF suministrados. DDD informa
    observaciones de mercado al 2026-11-19 y 2026-11-20, y crecimiento TTM al 2026-09-30;
    AOIF proporciona las métricas financieras y evaluaciones operativas sin fechas
    o metodologías completas para varias de ellas. No se aportaron enlaces ni citas
    a documentos primarios.


