prompt_inputs:
  business_model: Bristol-Myers Squibb Company discovers, develops, licenses, manufactures,
    markets, distributes, and sells biopharmaceutical products worldwide. The company
    offers products for oncology, hematology, immunology, cardiovascular, and neuroscience
    indications. Its products include Opdivo for anti-cancer indications; Opdivo Qvantig,
    a subcutaneous PD-1 inhibitor for solid tumors; Orencia for active rheumatoid
    arthritis and psoriatic arthritis; Yervoy for the treatment of unresectable or
    metastatic melanoma; Reblozyl to treat anemia; Breyanzi for the treatment of relapsed
    or refractory large B-cell lymphoma; Opdualag to treat unresectable or metastatic
    melanoma; and Camzyos for the treatment of symptomatic obstructive HCM. The company
    also offers Zeposia to treat relapsing forms of multiple sclerosis; Abecma for
    the treatment of patients with relapsed or refractory multiple myeloma; Sotyktu
    to treat moderate-to-severe plaque psoriasis; Krazati for the treatment of KRASG12C-mutated
    locally advanced or metastatic non-small cell lung cancer (NSCLC); and Cobenfy
    to treat schizophrenia. In addition, it offers Eliquis for the reduction of risk
    of stroke/systemic embolism and for the treatment of DVT/PE; Revlimid, an oral
    immunomodulatory drug for multiple myeloma; Pomalyst/Imnovid for multiple myeloma;
    Sprycel for Philadelphia chromosome-positive chronic myeloid leukemia; and Abraxane
    to treat breast cancer. Further, the company provides Augtyro for the treatment
    of locally advanced or metastatic ROS1-positive NSCLC, as well as NSCLC and pancreatic
    cancer. It sells its products to wholesalers, distributors, specialty pharmacies,
    retailers, hospitals, clinics, and government agencies. The company has a strategic
    collaboration with Arcus Biosciences, Inc. to develop a treatment regimen that
    delivers tumor control in kidney cancer. The company was formerly known as Bristol-Myers
    Company. The company was founded in 1887 and is headquartered in Princeton, New
    Jersey.
