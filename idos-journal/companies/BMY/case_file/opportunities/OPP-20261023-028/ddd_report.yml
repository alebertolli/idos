tesis_inversion: 'La tesis potencial es que el mercado penaliza demasiado a una farmacéutica
  establecida cuyos productos maduros enfrentan erosión, mientras que la amplitud
  terapéutica, la innovación y la generación de caja podrían sostener el valor a largo
  plazo. La tesis todavía requiere validación: la evidencia disponible no cuantifica
  exposición a vencimientos, crecimiento por producto, cartera clínica, deuda ni valor
  intrínseco. La cotización está por debajo del objetivo medio observado, pero ese
  hecho por sí solo no prueba infravaloración. La postura apropiada con estos datos
  es neutral y condicionada a diligencia adicional.'
