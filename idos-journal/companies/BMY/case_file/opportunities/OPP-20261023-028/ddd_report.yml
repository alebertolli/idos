  propios de la industria: expiración de exclusividades, competencia, resultados clínicos,
  regulación y necesidad de reponer productos. La evidencia financiera estructurada
  disponible aporta FCF TTM reportado de USD 9.290 millones y márgenes e ingresos
  de crecimiento seleccionados, pero no incluye un conjunto completo de balance, deuda,
  vencimientos, productos o métricas de valoración. La tesis de compounder castigado
  es provisional; el caso de inversión depende de demostrar que la generación de caja
  y la innovación pueden compensar la erosión de productos maduros. Con la información
  suministrada, la valoración es incierta y el error de mercado no queda probado.'
