  inferencias_llm:
  - La variabilidad histórica de beneficio neto y FCF hace insuficiente tratar el
    dato TTM como evidencia de una mejora estructural.
  - La integración por segmentos descrita no permite inferir por sí sola una ventaja
    competitiva o retornos incrementales atractivos.
  - La fuente reporta ingresos de 32,736,313 y margen bruto de 38.74% para TTM terminado
    el 2026-09-30; la unidad de los valores monetarios de la serie financiera se expresa
    como source_reported_amount.
  - La fuente reporta FCF de 5,372,752 y beneficio neto de 3,194,759 para TTM terminado
    el 2026-09-30, ambos en source_reported_amount.
  - La cotización fue USD 47.00 al 2026-10-30; el rango de objetivos de analistas
    reportado fue USD 48.70–84.00 al 2026-11-20.
  preguntas_abiertas:
  - ¿Qué parte del crecimiento de ingresos y FCF responde a volumen, precios, mezcla,
    tipo de cambio u otros factores, y qué parte es repetible?
  - ¿Cuáles son capex de mantenimiento y crecimiento, producción, reservas, costos
    unitarios y retornos sobre capital por segmento?
  - ¿Qué explican las diferencias entre revenue_ttm de statistics y revenue_history
    TTM, y entre los campos FCF de statistics y financials?
  - ¿Cuál es la moneda y escala exactas de los importes reportados, y cómo se reconcilian
    deuda, caja, intereses y EBITDA?
