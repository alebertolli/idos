  existing_wiki: '# GILD — Gilead Sciences, Inc.


    > **Estado de investigación:** incompleto. La información disponible respalda
    la escala y rentabilidad operativa reportadas, pero no basta para validar una
    tesis de crecimiento duradero ni para concluir que la acción esté infravalorada.
    Se distinguen los datos reportados de las inferencias y cuestiones pendientes.


    ## 1. Visión General de la Compañía


    Gilead Sciences, Inc. es una compañía biofarmacéutica integrada que descubre,
    desarrolla y comercializa medicamentos para necesidades médicas no cubiertas.
    Su cadena de valor abarca investigación y descubrimiento, desarrollo preclínico
    y clínico, ensayos y aprobación regulatoria, fabricación propia o mediante terceros
    y comercialización.


    La cartera descrita incluye productos para VIH y hepatitis, además de exposición
    a oncología y terapias celulares. Entre los productos citados en los datos disponibles
    figuran Biktarvy, Descovy, Genvoya, Odefsey, Sunlenca, Symtuza y Yeztugo para
    VIH, y Epclusa, Livdelzi y Vemlidy para hepatitis y enfermedades hepáticas. No
    se proporcionan ventas por producto, región ni área terapéutica.


    Los clientes y canales descritos incluyen mayoristas, distribuidores, farmacias,
    hospitales, clínicas y centros especializados. La información disponible no detalla
    el desglose geográfico de ingresos.


    Gilead compite dentro del sector biofarmacéutico, junto a compañías como [[ABBV]],
    [[AMGN]], [[AZN]], [[BIIB]] y [[BMY]]. Esas referencias describen pertenencia
    sectorial, no necesariamente competencia directa en todos los productos o áreas
    terapéuticas.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Fuentes de ingresos y drivers


    El negocio genera ingresos principalmente mediante la venta de medicamentos. La
    cartera descrita se concentra en VIH y hepatitis, con exposición adicional a oncología
    y terapias celulares. Sin datos de ingresos por producto o segmento, no es posible
    determinar qué productos impulsan el crecimiento, la rentabilidad o la generación
    de caja.


    ### Ventajas competitivas


    El análisis AOIF identifica como posibles fuentes de ventaja:


    - Patentes y exclusividad de producto.

    - Conocimiento clínico y experiencia regulatoria.

    - Escala comercial y relaciones con profesionales y sistemas sanitarios.

    - Capacidades de investigación y desarrollo (I+D).


    AOIF califica la amplitud del moat como “amplia” y la posición competitiva como
    “líder”. Estas son conclusiones del análisis, no hechos cuantificados en la evidencia
    incluida. La durabilidad de esas ventajas depende, entre otros factores, de la
    evolución de la cartera, la competencia y los vencimientos de exclusividad.


    ### Dinámica competitiva


    La industria es intensiva en I+D, capital y regulación; el desarrollo clínico
    tiene ciclos largos y resultados inciertos. La competencia puede provenir de grandes
    farmacéuticas y biotecnológicas, así como de alternativas genéricas o tratamientos
    competidores. No se aportan comparaciones por producto, datos de cuota de mercado
    ni fechas de vencimiento de patentes.


    ## 3. Perfil Financiero


    | Métrica | Valor reportado | Período / fecha | Fuente y limitaciones |

    |---|---:|---|---|

    | Margen bruto | 79.95% | TTM al 2026-09-30 | Stockanalysis.com, datos incluidos
