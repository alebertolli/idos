    AOIF; el paquete no incluye fechas |

    | Hitos clínicos y regulatorios de la cartera | No especificados | Podrían influir
    en la capacidad de renovar o ampliar fuentes de ingresos | AOIF identifica el
    riesgo clínico, pero no aporta activos, fechas ni probabilidades |


    ## 8. Marco de Valoración


    ### Metodología apropiada


    La evaluación debería combinar:


    1. **Flujo de caja descontado (DCF):** con proyecciones por producto o franquicia,
    vencimientos de exclusividad, erosión competitiva, reinversión, impuestos y coste
    de capital.

    2. **Valoración por productos y cartera (rNPV):** para activos en desarrollo,
    incorporando fases clínicas, probabilidades de éxito, plazos regulatorios y necesidades
    de financiación.

    3. **Múltiplos comparables:** EV/EBITDA y otros indicadores frente a compañías
    farmacéuticas y biotecnológicas pertinentes, con ajustes por mezcla de productos,
    crecimiento, riesgo de patentes y deuda. AOIF reporta EV/EBITDA de 15.53, pero
    no especifica en el paquete la fecha, definición ni inputs utilizados.


    ### Supuestos que faltan


    No se proporcionan estimaciones de ventas futuras, márgenes por producto, gastos
    de I+D, capex, vencimientos de patentes, coste de capital ni escenarios de erosión
    de ingresos. Tampoco hay inputs suficientes para calcular una sensibilidad fiable
    del valor.


    DDD recoge una cotización de USD 170.68 al 2026-10-30 y un precio objetivo de
    consenso de USD 175.92 al 2026-11-20 (rango USD 131–200). La cercanía entre ambas
    observaciones no prueba que la acción esté correctamente valorada ni que exista
    un margen de seguridad. AOIF califica el margen de seguridad como “insuficiente”.


    **Conclusión de valoración:** no se puede estimar un valor intrínseco ni una sensibilidad
    cuantitativa fiable con la información disponible.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué productos, regiones y clientes explican los ingresos y el FCF? ¿Cómo evolucionan
    sus ventas y márgenes?

    2. ¿Qué proporción de ingresos y beneficios depende de cada producto principal,
    especialmente de la franquicia de VIH?

    3. ¿Cuáles son los retornos sobre capital verificables, el coste de capital y
    el gasto de reinversión? ¿Qué período y metodología respaldan el ROIC de 36.82%
    y el margen operativo de 38.23% citados por AOIF?

    4. ¿Cómo se concilia la utilidad neta TTM negativa con el FCF TTM positivo? ¿Qué
    partidas explican la diferencia?

    5. ¿Cuál es la evolución del FCF en períodos comparables y qué explica la diferencia
    entre FY2025 y el TTM al 2026-09-30?

    6. ¿Cuáles son los vencimientos de patentes y exclusividades por producto, y qué
    exposición existe a genéricos, biosimilares u otros tratamientos competidores?

    7. ¿Cuál es el calendario de vencimientos de deuda, el coste de financiación y
    la liquidez disponible? ¿Por qué Stockanalysis.com reporta cobertura de intereses
    de cero?

    8. ¿Qué activos clínicos y regulatorios podrían reemplazar ingresos futuros? Se
    requieren fases, fechas, indicaciones, competencia y probabilidades de éxito.

    9. ¿Qué evidencia sustenta las evaluaciones de liderazgo, alineamiento de insiders
    y asignación de capital? ¿Cómo están compuestos el board y sus comités?

    10. ¿Qué período y método respaldan el crecimiento de ingresos de 6.54% reportado
    por AOIF?

    11. ¿Qué inputs sustentan EV/EBITDA de 15.53 y cómo cambia la valoración bajo
    escenarios de crecimiento, erosión de productos y reinversión?


    **Fuentes citadas en los datos de investigación:** Stockanalysis.com, financials
