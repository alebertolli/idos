    unidad no especificada en el paquete |

    | Utilidad neta | -3,862 | TTM al 2026-09-30 | Stockanalysis.com; unidad no especificada
    en el paquete |

    | Ingresos: crecimiento reportado | 6.54% | Período no precisado en AOIF | Valor
    proporcionado por AOIF; falta definición del período y detalle del cálculo |

    | Margen operativo | 38.23% | Período no precisado en AOIF | Valor proporcionado
    por AOIF; no se incluye referencia detallada al cálculo |

    | ROIC | 36.82% | Período no precisado en AOIF | Valor proporcionado por AOIF;
    no se especifican inputs ni método |

    | Crecimiento de FCF | -8.24% | FY2025 | Stockanalysis.com; tasa reportada por
    la fuente, no recalculada |

    | Deuda total | 26,231 | Al 2026-09-30 | Stockanalysis.com; unidad no especificada
    en el paquete |

    | Efectivo e inversiones | 7,952 | Al 2026-09-30 | Stockanalysis.com; unidad no
    especificada en el paquete |

    | Efectivo neto (métrica reportada) | -18,279 | Al 2026-09-30 | Stockanalysis.com;
    la convención del signo no se detalla |

    | Current ratio | 1.38x | Al 2026-09-30 | Stockanalysis.com; no cruza el umbral
