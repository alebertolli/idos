dominio_business_quality:
  analisis: El perfil suministrado describe una cartera de juegos en consolas, PC
    y móviles, junto con servicios, contenido adicional y franquicias deportivas.
    La combinación de propiedad intelectual, comunidades de jugadores y contenido
    recurrente puede generar costes de cambio y monetización continuada, pero esto
    es una inferencia del analista, no una medición directa de retención o poder de
    precios. La concentración potencial en franquicias de éxito, la competencia por
    tiempo de juego y la dependencia de plataformas de terceros limitan la certeza
    sobre la durabilidad del moat. No se aportan datos de cuota, usuarios activos,
    ingresos por franquicia o retención.
  rating: buena
