    gasoline, pharmacies, food courts, optical, hearing aids, and tire installation
    centers. In addition, it engages in e-commerce, business centers, travel, and
    other businesses. Further, the company operates e-commerce sites; and offers branded
    and private-label products in various categories. The company was formerly known
    as Costco Companies, Inc. and changed its name to Costco Wholesale Corporation
    in August 1999. Costco Wholesale Corporation was founded in 1976 and is based
    in Issaquah, Washington.
