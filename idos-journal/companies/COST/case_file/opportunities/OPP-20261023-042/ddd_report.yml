    ## 4. Management y Gobierno Corporativo


    La evaluación AOIF describe la calidad del management como **buena**, la asignación
    de capital como **creadora de valor** y el alineamiento de insiders como **moderado**.
    El análisis es cualitativo y se apoya en la continuidad del modelo de membresía
