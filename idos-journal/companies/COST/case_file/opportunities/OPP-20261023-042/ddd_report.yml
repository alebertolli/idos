resumen_ejecutivo: 'COST presenta un modelo de almacenes de membresía potencialmente
  resistente y escalable, con una lógica competitiva atractiva basada en valor y recurrencia.
  La evidencia financiera estructurada seleccionada informa FCF TTM de 9.380 millones
  de USD y margen operativo TTM de 3,8%, pero no basta para evaluar tendencias, balance,
  deuda o conversión de caja. El crecimiento de ingresos reportado por una fuente
