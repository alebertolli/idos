dominio_business_quality:
  analisis: El foso competitivo (Moat) de SPGI es insuperable. En Ratings, conforma
    junto a Moody's un duopolio con un ~80% de cuota global respaldado por mandatos
    regulatorios (NRSRO). En Indices, la marca S&P 500 posee efectos de red masivos
    donde el capital pasivo fluye de forma inelástica. En Energy y Market Intelligence,
    provee precios de referencia (benchmarks) integrados en los flujos de trabajo
    críticos de las instituciones. Su poder de fijación de precios es muy elevado.
  rating: excepcional
