resumen_ejecutivo: S&P Global Inc. (SPGI) representa uno de los monopolios/oligopolios
  comerciales más sólidos de los mercados de capitales globales. Con una combinación
  diversificada de ingresos recurrentes por suscripciones (Market Intelligence, Indices,
  Commodity Insights) e ingresos transaccionales de alto margen (Ratings), la empresa
  genera un flujo de caja operativo resiliente. Aunque los datos del perfil TTM provistos
  muestran temporalmente distorsiones en ROIC/FCF por ajustes contables tras la mega-fusión
  con IHS Markit, la rentabilidad real subyacente y la conversión de caja son sobresalientes.
  Con la transición reciente de CEO (Martina Cheung en nov 2024), la ejecución estratégica
  se centra en la integración analítica y la inteligencia artificial. A los precios
  actuales, SPGI se considera justamente valorada, ofreciendo retornos esperados acordes
  al crecimiento orgánico de sus beneficios sin expansión sustancial de múltiplos.
