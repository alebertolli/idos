  existing_wiki: '## 1. Visión General de la Compañía


    S&P Global Inc. ([[SPGI]]) es un proveedor global de información y propiedad intelectual
    que ofrece benchmarks, datos, análisis, calificaciones crediticias, índices y
    soluciones de workflow. Sus productos sirven a participantes de los mercados de
    capitales, empresas y profesionales financieros, además de clientes de energía
    y commodities y del sector automotriz.


    La compañía recopila y valida datos, desarrolla metodologías, benchmarks, calificaciones
    e índices, y los integra en productos analíticos y herramientas de trabajo. Monetiza
    estos activos mediante suscripciones, licencias y otros servicios. La investigación
    recibida describe cuatro segmentos, pero no proporciona sus nombres, ingresos
    o rentabilidad individuales.


    La exposición a mercados de capitales, energía y commodities y automoción diversifica
    las áreas de uso de sus productos. La evidencia disponible no cuantifica la distribución
    geográfica de ingresos.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    Los principales productos y fuentes de valor identificados son:


    - Datos, análisis, investigación y soluciones de workflow para profesionales financieros
    y corporativos.

    - Calificaciones crediticias, investigación y análisis.

    - Benchmarks e índices distribuidos mediante licencias y otros productos de información.

    - Soluciones relacionadas con energía, commodities y automoción.


    La demanda está vinculada a la actividad de los mercados de capitales, la emisión
    de deuda, la inversión y las necesidades de información y gestión de riesgos.
    No se proporcionan tasas de crecimiento, retención o penetración por segmento
    y mercado direccionable.


    ### Moat y competencia


    La investigación caracteriza la posición competitiva como líder y el moat como
    amplio. Los factores propuestos son la reputación e independencia, el reconocimiento
    de calificaciones e índices, las metodologías especializadas, la escala de datos
    y los costes de sustitución de ciertos productos integrados en workflows. Son
    caracterizaciones de la investigación recibida; no se aportan medidas independientes
    de retención, poder de precios o cuota de mercado que permitan verificarlas.


    La amplitud de productos y mercados podría facilitar oportunidades de reinversión,
    pero no demuestra por sí sola crecimiento futuro ni retornos incrementales. La
    información proporcionada no identifica competidores concretos de SPGI ni permite
    comparar sistemáticamente sus productos con los de otras compañías de la lista
    sectorial, como [[MELI]] o [[ASML]]; estas no se consideran aquí comparables directas.


    ## 3. Perfil Financiero


    Las cifras siguientes son las reportadas en los inputs de investigación. Sus períodos,
    definiciones y comparabilidad deben confirmarse antes de usarlas en un modelo
    financiero.


    | Métrica | Valor reportado | Período / referencia | Observación |

    |---|---:|---|---|

    | Crecimiento de ingresos | 18.85% | No especificado en el input AOIF | Definición
    y período no verificables con la evidencia disponible. |

    | Margen operativo | 44.09% | No especificado en el input AOIF | Dato aportado
    sin serie histórica ni definición. |

    | ROIC | 13.03% | No especificado en el input AOIF | No se aportan metodología,
    período ni componentes del cálculo. |

    | Margen bruto | 70.99% | TTM al 2026-09-30 | Fuente citada: [Stock Analysis,
    estados financieros](https://stockanalysis.com/stocks/spgi/financials/). |

    | Margen bruto | 66.43% | FY2022 | Fuente citada: [Stock Analysis, estados financieros](https://stockanalysis.com/stocks/spgi/financials/).
    |

    | Crecimiento de FCF | 3.84% | TTM al 2026-09-30 | La base comparativa exacta
    no está especificada. Fuente: [Stock Analysis, estados financieros](https://stockanalysis.com/stocks/spgi/financials/).
    |

    | Crecimiento de FCF | -1.96% | FY2025 | Dato reportado; no se incluye la serie
    que permitiría reconciliarlo con el dato TTM. |

    | Net cash | -USD 11,142 millones | 2026-09-30 | Dato reportado. La medida deuda/EBITDA
    no puede verificarse con los inputs disponibles. |

    | Current ratio | 0.74 | 2026-09-30 | Reportado por encima del umbral de alerta
    de 0.5 en el análisis recibido. |

    | Crecimiento de ingresos, CAGR 3 años | No disponible | Al 2026-09-30 | No se
    calculó: no había una observación de ingresos en 2023-09-30 comparable con TTM.
    |


    El margen bruto reportado aumentó entre FY2022 y el TTM al 2026-09-30. Esto es
    compatible con un negocio de información de alto margen, pero no identifica el
    origen ni la durabilidad de esa evolución. El FCF fue descrito como positivo en
    el TTM, aunque no se proporcionan cifras absolutas de flujo de caja operativo,
    capex o FCF para evaluar conversión de beneficios en caja.


    ## 4. Management y Gobierno Corporativo


    La evaluación AOIF califica la calidad del management como buena, la asignación
    de capital como neutral y el alineamiento de insiders como débil. No se aportan
    nombres de ejecutivos, remuneración, tenencia accionaria, composición del board,
    independencia de sus miembros ni historial detallado de decisiones de capital.


    Por tanto, estas valoraciones deben tratarse como evaluaciones preliminares, no
    como conclusiones verificadas. La investigación no permite evaluar si las decisiones
    entre inversión, adquisiciones, dividendos y recompras han creado retornos atractivos
    sobre el capital.


    ## 5. Tesis de Inversión


    ### Caso alcista — hipótesis por verificar


    - SPGI combina datos, analítica, calificaciones, índices y soluciones de workflow
    en varios mercados. La integración de esos productos podría favorecer relaciones
    duraderas con clientes y costes de sustitución, aunque la evidencia recibida no
    incluye métricas de retención o churn.

    - La reputación, la independencia, las metodologías especializadas y la escala
    de datos podrían respaldar una posición competitiva diferenciada. La investigación
    AOIF caracteriza el moat como amplio y la posición como líder, pero no aporta
    métricas comparativas para cuantificarlo.

    - El margen bruto reportado fue de 70.99% en TTM al 2026-09-30, frente a 66.43%
    en FY2022. La expansión podría ser consistente con escalabilidad o diferenciación,
    pero no demuestra por sí sola una ventaja competitiva durable.

    - El score de descubrimiento del paquete DDD fue 65.73. La clasificación fue “Research
    required”; el score es una señal de priorización para investigación, no una validación
    de la tesis ni de su valoración.


    La evidencia disponible no permite estimar con fiabilidad el crecimiento orgánico
    futuro, los retornos incrementales sobre el capital ni el valor intrínseco de
    la compañía.


    ## 6. Riesgos y Contra-Tesis


    ### Riesgos principales


    - **Regulatorio y litigios:** posibles cambios regulatorios o litigios relacionados
    con calificaciones, índices, datos y metodologías. La evaluación AOIF asignó impacto
    alto y probabilidad media.

    - **Confianza e independencia:** una percepción de conflictos de interés o una
    pérdida de confianza en la independencia y calidad de benchmarks o calificaciones
    podría perjudicar el negocio. AOIF asignó impacto alto y probabilidad baja.

    - **Variabilidad del FCF:** el crecimiento de FCF reportado fue -1.96% en FY2025
    y 3.84% en TTM al 2026-09-30. La trayectoria limita la extrapolación del crecimiento
    reciente.

    - **Exposición de balance:** se reportó net cash negativo por USD 11,142 millones
    al 2026-09-30. Los datos disponibles no permiten calcular y verificar deuda/EBITDA
    con una medida compatible.

    - **Dependencia de la actividad de los mercados:** la demanda de determinados
    productos está vinculada a la emisión de deuda, la inversión y la actividad de
    los mercados de capitales; la investigación no cuantifica la sensibilidad de ingresos
    a esos ciclos.

    - **Erosión competitiva:** no hay evidencia suficiente para evaluar cambios de
    precios, pérdida de clientes, sustitución de productos o durabilidad de los costes
    de cambio.


    ### Contra-tesis y falsadores


    La evidencia recibida no demuestra que el moat descrito sea duradero, que el crecimiento
    reciente sea sostenible ni que las referencias de mercado impliquen infravaloración.
    La tesis se debilitaría si se observa:


    1. Deterioro sostenido de ingresos, margen bruto o FCF frente a los períodos históricos
    reportados.

    2. Evidencia de erosión de precios, pérdida de clientes o sustitución de servicios.

    3. Caída de la confianza en la independencia o calidad de índices y calificaciones.

    4. Retornos sobre el capital inferiores a los necesarios para justificar la reinversión,
    cuando existan datos comparables para evaluarlos.


    ## 7. Catalizadores y Timeline


    | Catalizador / hito observable | Fecha esperada | Impacto potencial |

    |---|---|---|

    | Seguimiento de ingresos y FCF por segmento para evaluar la evolución de datos,
    analítica y workflows en mercados de capitales, energía y commodities y automoción
    | Sin fecha específica proporcionada; medir en períodos futuros | Podría confirmar
    o debilitar la hipótesis de diversificación y crecimiento. No se aportan previsiones.
    |

    | Confirmar si la expansión del margen bruto reportado se sostiene con datos comparables
    | Sin fecha específica proporcionada; próximo reporte comparable | Podría aportar
    evidencia sobre escalabilidad y estructura del negocio; no prueba por sí sola
    la existencia de un moat. |

    | Reconciliar la trayectoria del FCF, incluidos el dato FY2025 y el TTM al 2026-09-30
    | Sin fecha específica proporcionada | Ayudaría a evaluar volatilidad, conversión
    de beneficios en caja y capacidad de financiación. |


    No se proporciona un calendario de catalizadores corporativos ni estimaciones
    futuras de resultados que permitan señalar un evento concreto de revisión de expectativas.


    ## 8. Marco de Valoración


    La investigación AOIF reporta múltiplos de **PER 26.54** y **EV/EBITDA 16.76**,
    pero no especifica fecha de referencia, precio ni definición de las magnitudes
    utilizadas. Reporta también un **FCF yield de 0**, sin datos suficientes para
    verificar el cálculo. Estos valores no deben tratarse como múltiplos actuales
    comparables sin validar período, fuente y metodología.


    DDD reporta una cotización de **USD 466.55 al 2026-10-30** y un consenso de precio
    objetivo al **2026-11-20** con media de **USD 529.35** y rango de **USD 500 a
    USD 572**. Son referencias de mercado, no una estimación de valor intrínseco.
    La diferencia entre cotización y objetivos de analistas no demuestra un error
    de valoración.


    ### Enfoque apropiado


    Una valoración debería combinar:


    - Un análisis de flujo de caja descontado, una vez disponibles FCF normalizado
    y proyecciones por segmento.

    - Una comprobación mediante múltiplos comparables, con período y definiciones
    de EV, EBITDA y beneficios uniformes.

    - Un análisis de sensibilidad que incluya crecimiento de ingresos, márgenes, conversión
    a FCF, coste de capital y valor terminal.


    No hay datos suficientes para cuantificar escenarios o margen de seguridad. AOIF
    concluye que el margen de seguridad es insuficiente y que el valor intrínseco
    no puede estimarse con fiabilidad por falta de precio y fecha de referencia coherentes,
    previsiones de flujos de caja, coste de capital y datos verificables de FCF. La
    valoración permanece **no validada**.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuáles son el crecimiento orgánico, la retención de clientes, la penetración
    de mercado y la evolución de precios por segmento?

    2. ¿Cómo se distribuyen ingresos, márgenes y FCF entre los cuatro segmentos y
    los mercados atendidos?

    3. ¿Qué períodos y definiciones corresponden a las cifras reportadas de crecimiento
    de ingresos, margen operativo y ROIC?

    4. ¿Cuál es la serie histórica comparable de FCF, incluyendo flujo de caja operativo,
    capex y conversión de beneficios en caja?

    5. ¿Qué retornos sobre el capital obtiene SPGI por segmento, y cómo se asigna
    el capital entre inversión, adquisiciones, dividendos y recompras?

    6. ¿Cuál es la deuda neta reconciliada y qué ratio deuda/EBITDA resulta de una
    metodología verificable?

    7. ¿Qué evidencia cuantitativa existe sobre retención, costes de sustitución,
    poder de precios y cuota de mercado?

    8. ¿Qué exposición tienen ingresos y resultados a los ciclos de emisión de deuda,
    actividad de mercados y demanda de energía y commodities?

    9. ¿Qué composición tiene el board, cómo se estructuran los incentivos del management
    y qué evidencia sustenta la evaluación de alineamiento débil de insiders?

    10. ¿Qué precio y fecha corresponden a los múltiplos reportados, y cómo se calcula
    el FCF yield informado como cero?


