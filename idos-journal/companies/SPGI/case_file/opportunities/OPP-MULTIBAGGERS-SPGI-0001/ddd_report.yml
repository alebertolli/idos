  existing_wiki: '## 1. Visión General de la Compañía


    [[SPGI]] (S&P Global Inc.) es una compañía de información y propiedad intelectual
    enfocada en datos, análisis, calificaciones crediticias, precios de referencia,
    índices y soluciones de workflow. Atiende a instituciones financieras, inversores,
    gestores de activos y emisores corporativos y soberanos. La información disponible
    describe operaciones en mercados de capitales, energía y materias primas, y automoción,
    distribuidas en cuatro segmentos; no proporciona cifras comparables de ingresos
    por segmento ni un desglose geográfico.


    El modelo combina ingresos recurrentes por suscripciones y licencias con comisiones
    más sensibles al nivel de actividad de los mercados, en especial las vinculadas
    a emisiones de deuda y calificaciones. La cadena de valor comprende recopilar
    y validar datos, producir análisis y benchmarks e integrar esos activos en productos
    y plataformas.


    Compañías del sector financiero incluidas en la wiki: [[AEG]], [[AIG]], [[AXP]],
    [[BSBR]], [[BX]], [[C]], [[HSBC]], [[IBN]], [[ING]], [[ITUB]], [[JPM]], [[KB]],
    [[LYG]], [[MA]], [[MFG]], [[MUFG]], [[NMR]], [[SAN]], [[USB]] y [[V]]. La información
    disponible no identifica cuáles son competidores directos de SPGI ni permite comparaciones
    operativas entre estas compañías.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Fuentes de ingresos y drivers


    - Suscripciones, licencias y expansión de clientes en datos, análisis y soluciones
    de workflow.

    - Calificaciones, investigación y analítica; la demanda puede variar con el volumen
    de emisiones de deuda.

    - Índices, benchmarks y precios de referencia distribuidos mediante licencias
    y otros productos.


    ### Ventajas competitivas descritas


    El análisis AOIF caracteriza la posición competitiva como líder y el moat como
    amplio. Atribuye posibles ventajas a la reputación y confianza, el reconocimiento
    regulatorio de las calificaciones, la marca, los efectos de red en índices y benchmarks
    y los costes de cambio cuando los productos se integran en workflows de clientes.
    Estas caracterizaciones son evaluaciones del análisis recibido; no se aportan
    métricas independientes de cuota de mercado, retención o poder de precios para
    verificarlas.


    La industria puede beneficiarse de la complejidad creciente de los mercados y
    de la demanda de datos y herramientas de análisis. Sin embargo, algunos negocios,
    especialmente los relacionados con ratings, pueden ser cíclicos y depender de
    la actividad de emisiones.


    ## 3. Perfil Financiero


    Las métricas recibidas provienen de fuentes y metodologías distintas. No debe
    asumirse que sean directamente comparables ni que describan un mismo período,
    salvo donde se indique.


    | Métrica | Valor reportado | Período / fecha | Fuente y limitaciones |

    |---|---:|---|---|

    | Ingresos: crecimiento | 18,85% | No especificado en el input AOIF | El período
    y la metodología no están detallados; no se valida con una serie comparable. |

    | Margen operativo | 44,09% | No especificado en el input AOIF | Dato proporcionado
    en el análisis AOIF, sin período ni metodología adicionales. |

    | ROIC | 13,03% | No especificado en el input AOIF | Dato proporcionado en el
    análisis AOIF; faltan período y metodología para comparabilidad. |

    | Margen bruto | 66,43% | FY 2022 | StockAnalysis; el input advierte que los períodos
    disponibles no son todos equivalentes. |

    | Margen bruto | 70,99% | TTM terminado el 2026-09-30 | StockAnalysis; la diferencia
    frente a FY 2022 no demuestra por sí sola una tendencia sostenible. |

    | FCF | 5.675 millones | TTM terminado el 2026-09-30 | StockAnalysis; no se especifica
    aquí la convención monetaria ni se aporta serie histórica comparable. |

    | Crecimiento del FCF | 3,84% | TTM terminado el 2026-09-30 | StockAnalysis; la
    fuente y el paquete no detallan el período base ni la comparabilidad. |

    | Current ratio | 0,74x | 2026-09-30 | StockAnalysis; el valor reportado está
    por encima del umbral de alerta de 0,5x usado en el análisis. |

    | Cobertura de intereses | 0x | 2026-09-30 | StockAnalysis; debe verificarse:
    no se aportan gastos por intereses y el cero podría reflejar una limitación del
    dato. |

    | Acciones en circulación | Observación disponible | 2026-09-30 | StockAnalysis;
    no hay historial comparable para calcular dilución. |

    | Deuda neta / EBITDA | No validado | Datos del paquete | Los campos disponibles
    no tienen una escala monetaria compatible verificable. |


    No se aporta una serie comparable para calcular crecimiento anual compuesto de
    ingresos a tres años. Tampoco se proporcionan cifras suficientes de flujo de caja
    operativo, capex y FCF por período para evaluar la conversión de caja o su sostenibilidad.


    **Fuentes financieras:** [StockAnalysis: estados financieros](https://stockanalysis.com/stocks/spgi/financials/)
    y [StockAnalysis: estadísticas](https://stockanalysis.com/stocks/SPGI/statistics/).


    ## 4. Management y Gobierno Corporativo


    El análisis AOIF evalúa la calidad del management como buena, la asignación de
    capital como creadora de valor y el alineamiento de insiders como moderado. No
    se incluyen criterios, series de resultados ni evidencia detallada que permita
    validar esas valoraciones.


    No hay información sobre nombres y trayectoria de ejecutivos, remuneración e incentivos,
    participación accionaria de insiders, composición del consejo, independencia de
    sus miembros ni políticas de gobierno corporativo. Esos aspectos requieren investigación
    adicional antes de formar una conclusión independiente.


    ## 5. Tesis de Inversión


    La tesis a investigar es que SPGI pueda combinar productos de información y workflow
    de uso recurrente con activos de referencia —calificaciones, índices, benchmarks
    y precios— cuya reputación, integración en procesos de clientes y costes de cambio
    apoyen la retención y la monetización.


    Elementos que respaldan provisionalmente esa tesis:


    - El modelo incluye suscripciones y licencias, además de ingresos transaccionales
    relacionados con emisiones. La recurrencia potencial no está cuantificada con
    datos de retención, renovaciones o mezcla de ingresos.

    - El análisis AOIF identifica marca, confianza, reconocimiento regulatorio, efectos
    de red y costes de cambio como fuentes potenciales de ventaja competitiva; estas
    son evaluaciones cualitativas, no métricas verificadas en el paquete.

    - Se reporta un margen bruto TTM de 70,99% al 2026-09-30 y FCF de 5.675 millones
    para ese período. Son datos compatibles con una economía potencialmente atractiva,
    pero no prueban por sí solos recurrencia, ventaja competitiva ni retornos sostenibles
    sobre el capital.

    - AOIF reporta margen operativo de 44,09% y ROIC de 13,03%, aunque sin período
    ni metodología en el material recibido. Deben tratarse como referencias pendientes
    de validación.

    - La diversidad de productos y segmentos podría reducir la dependencia de una
    sola fuente de ingresos, pero no se aportan datos suficientes de contribución
    por segmento para confirmar ese efecto.


    La tesis no está validada como una oportunidad de inversión: faltan datos financieros
    comparables, métricas operativas por segmento y una valoración intrínseca defendible.


    ## 6. Riesgos y Contra-Tesis


    ### Riesgos principales


    - **Ciclicidad de emisiones:** una caída en las emisiones de deuda puede reducir
    la demanda de calificaciones y los ingresos asociados. El análisis AOIF califica
    el impacto y la probabilidad como medios.

    - **Riesgo regulatorio y litigios:** cambios regulatorios o litigios relativos
    a calificaciones, benchmarks, datos o conflictos de interés percibidos podrían
    afectar operaciones y reputación. AOIF califica el impacto como alto y la probabilidad
    como media.

    - **Sostenibilidad de márgenes y FCF:** el margen bruto reportado para FY 2022
    y el TTM no corresponde a períodos equivalentes. Se necesita evidencia adicional
    para concluir que la expansión es sostenible.

    - **Apalancamiento y liquidez:** la deuda neta relativa a EBITDA no queda validada
    por incompatibilidad de escala entre los campos disponibles. La cobertura de intereses
    reportada en cero también requiere verificación.

    - **Retención, precios y volúmenes:** no se aportan métricas para separar crecimiento
    por precio, volumen, renovaciones y expansión de clientes.

    - **Inversión y retornos:** no se cuantifican las necesidades de inversión en
    tecnología, producto y adquisiciones ni el ROIC incremental que producen.

    - **Deterioro financiero:** la ausencia de series comparables impide determinar
    si los datos disponibles reflejan una tendencia estable o un período particular.


    ### Falsadores a monitorear


    - Resultados posteriores que muestren un deterioro sostenido del margen bruto
    frente al 70,99% TTM reportado al 2026-09-30.

    - Una reducción persistente del FCF frente a los 5.675 millones reportados para
    el TTM terminado el 2026-09-30.

    - Evidencia de caída sostenida en renovaciones, retención, precios o volúmenes;
    el paquete no aporta una línea base cuantitativa para fijar umbrales.

    - Confirmación de que la deuda neta, los gastos por intereses o la cobertura de
    intereses representan un riesgo material mayor al que sugieren los datos disponibles.


