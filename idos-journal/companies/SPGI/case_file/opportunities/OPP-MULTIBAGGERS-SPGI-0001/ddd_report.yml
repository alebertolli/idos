    ## 8. Marco de Valoración


    No se puede establecer un valor intrínseco defendible con la información disponible.
    AOIF reporta PER de 26,15x, EV/EBITDA de 16,49x y FCF yield de 0%, pero no proporciona
    fecha, precio de referencia ni metodología verificable para esos múltiplos. El
    mismo análisis declara insuficiente el margen de seguridad y señala que faltan
    precio, FCF normalizado, crecimiento esperado, tasa de descuento y supuestos de
    valor terminal.


    El material DDD incluye referencias de mercado observadas —precio objetivo de
    consenso de USD 529,35, rango de USD 500–572 y cotización de USD 466,55 al 2026-10-30—.
    Son datos atribuidos al paquete, no una estimación independiente de valor intrínseco.
    El momentum de precio a 12 meses reportado como 1,2178% hasta esa fecha tampoco
    permite inferir expectativas fundamentales.


    Para una valoración posterior convendría:


    1. Construir un historial comparable de ingresos, márgenes, FCF, deuda y acciones
    en circulación.

    2. Separar crecimiento orgánico de adquisiciones y distinguir precio, volumen,
    renovaciones y expansión de suscripciones.

    3. Normalizar el FCF y estimar reinversión, incluyendo tecnología, producto y
    adquisiciones.

    4. Contrastar un modelo de flujo de caja descontado con múltiplos, usando supuestos
    explícitos de crecimiento, márgenes, tasa de descuento y valor terminal.

    5. Evaluar sensibilidad a una caída de emisiones, menor crecimiento de suscripciones,
    compresión de márgenes y mayores necesidades de inversión.


    No se validan ni una oportunidad de valoración ni un error de precio con la evidencia
    recibida.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es el crecimiento orgánico por segmento y cuánto corresponde a precios,
    volúmenes, adquisiciones y cambios de mezcla?

    2. ¿Cómo evolucionan renovaciones, retención, expansión de clientes y precios
    en datos, analytics y soluciones de workflow?

    3. ¿Qué proporción de los ingresos es recurrente frente a ingresos transaccionales
    sensibles a emisiones?

    4. ¿Qué segmentos explican los márgenes reportados y qué tan comparables son sus
    resultados entre períodos?

    5. ¿Cuáles son los gastos de inversión, capex y necesidades de inversión en tecnología,
    producto y adquisiciones?

    6. ¿Qué ROIC producen las inversiones incrementales y cómo se compara con el ROIC
    reportado de 13,03% por AOIF?

    7. ¿Cuáles son la deuda neta, el EBITDA y los gastos por intereses en unidades
    y fechas comparables? ¿Por qué StockAnalysis reporta cobertura de intereses de
    cero?

    8. ¿Cuál es la evolución histórica de acciones en circulación y la tasa de dilución?

    9. ¿Qué evidencia respalda las evaluaciones de liderazgo, asignación de capital,
    alineamiento de insiders y calidad del gobierno corporativo?

    10. ¿Qué metodología y período corresponden a las cifras AOIF de crecimiento de
    ingresos, margen operativo, ROIC y múltiplos?

    11. ¿Qué supuestos de crecimiento, márgenes, inversión, tasa de descuento y valor
    terminal justificarían el precio de mercado? La evidencia actual no permite responderlo.


    **Estado de investigación:** pendiente de validación financiera y de valoración.
    La evidencia disponible permite formular una hipótesis de calidad de negocio potencialmente
