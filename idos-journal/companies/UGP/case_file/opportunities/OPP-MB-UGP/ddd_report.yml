prompt_inputs:
  business_model: Ultrapar Participações S.A., through its subsidiaries, operates
    in the energy, mobility, and logistics infrastructure sectors in Brazil, the rest
    of Europe, the United States, Canada, other Latin American countries, Oceania,
    and internationally. It operates through Ultragaz, Ipiranga, Ultracargo, and Hidrovias
    segments. The company distributes and sells oil-related products, biofuels, gasoline,
    ethanol, diesel, fuel oil, kerosene, natural gas for vehicles, and additive fuels
    under the Ipimax brand to carriers, resellers, and retailers; operates service
    stations under the Ipiranga brand and convenience stores under the AmPm brand;
    and produces and sells lubricants under the ICONIC brand. It also engages in the
    distribution of bulk and bottled liquefied petroleum gas for the residential,
    condominium, trade, services, industrial, and agribusiness sectors; operation
    of a natural gas pipeline network; and provision of renewable electricity for
    businesses and households, as well as compressed natural gas and biomethane for
    corporate clients. In addition, the company operates liquid bulk storage terminals
    in logistics centers; waterway and multimodal infrastructure; and port operations.
    Further, the company offers logistics solutions for handling grains, ores, and
    fertilizers; automotive services through Jet Oil units; and loyalty programs under
    the Km de Vantagens (KMV) brand. It also exports its products and services. Ultrapar
    Participações S.A. was founded in 1937 and is headquartered in São Paulo, Brazil.
