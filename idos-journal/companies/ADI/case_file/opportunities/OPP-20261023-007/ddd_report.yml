  con un modelo de negocio basado en productos de alta barrera tecnológica y clientes
  diversificados. Presenta márgenes operativos de 35.7% y flujo de caja libre de 4.94 B
  USD, con crecimiento de ingresos del 33.6% TTM. El precio de mercado (380.84 USD)
  está por debajo del objetivo medio de los analistas (474.47 USD), indicando potencial
  de upside. Los principales riesgos son la exposición a la cadena de suministro y
  la posible desaceleración macro, mientras que los catalizadores incluyen la demanda
  de IA, automotriz y posibles adquisiciones estratégicas.
