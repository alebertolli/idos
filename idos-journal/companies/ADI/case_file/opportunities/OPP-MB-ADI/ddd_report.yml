    | Crecimiento de ingresos | 33,65% | TTM al 2026-08-01 | Una fuente seleccionada;
    periodo y comparabilidad pendientes de confirmar. |

    | Margen operativo | 35,67% | No especificado | Base de cálculo pendiente de validar.
