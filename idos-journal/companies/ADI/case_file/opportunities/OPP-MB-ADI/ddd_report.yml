    | Flujo de caja libre (FCF) | USD 4.940 millones | TTM terminado el 2026-08-01
    | Atribuido en el contexto a Stock Analysis; no se incluyó un enlace. |

    | PER | 41,96 | No especificado | La fecha y el tipo de beneficio empleado no
    se detallan. |

    | EV/EBITDA | 27,41 | No especificado | La fecha y la base de EBITDA no se detallan.
    |

    | FCF yield | 0% | No especificado | El propio análisis advierte que no se proporcionan
    cifras de flujo operativo, capex ni FCF para recalcularlo; por tanto, la cifra
