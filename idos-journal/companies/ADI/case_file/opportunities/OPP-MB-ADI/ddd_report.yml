    ## 8. Marco de Valoración


    La información disponible no permite establecer un valor intrínseco robusto. AOIF
    informa un PER de 31,56 y un EV/EBITDA de 19,97, pero no especifica con claridad
    la fecha de referencia ni los insumos completos. También reporta un FCF yield
