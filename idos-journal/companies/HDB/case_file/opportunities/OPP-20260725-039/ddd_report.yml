prompt_inputs:
  business_model: HDFC Bank Limited provides banking and financial products and services
    to individuals and businesses in India, Bahrain, Hong Kong, Singapore, and Dubai.
    The company operates through Treasury, Retail Banking, Wholesale Banking, Other
    Banking Business, Insurance Business, and Other segments. It offers savings, salary,
    current, rural, public provident fund, pension, and demat accounts; fixed and
    recurring deposits; and safe deposit lockers, as well as offshore accounts and
    deposits, and overdrafts against fixed deposits. The company also provides personal,
    home, car and pre owned car, marriage, two-wheeler, business, doctor, educational,
    gold, consumer, and rural loans; loans against properties, securities, mutual
    funds, and car; loans for professionals; government sponsored programs; and loans
    on credit card, as well as working capital, term loans, supply chain management,
    project finance, export finance, commercial vehicle / equipment finance, tractor
    finance, infrastructure, and agriculture finance. In addition, it offers credit,
    debit, prepaid, forex, and kisan gold cards; payment and collection, export, import,
    remittance, bank guarantee, letter of credit, trade, hedging, and merchant and
    cash management services; and insurance and investment products. Further, the
    company provides short term finance, bill discounting, structured finance, export
    credit, loan repayment, custodial, and documents collection services; online,
    mobile, and phone banking services; unified payment interface, immediate payment,
    national electronic funds transfer, and real time gross settlement services; channel
    financing, vendor financing, money market, derivatives, employee trusts, cash
    surplus corporates, tax payment, and bankers to rights/public issue services;
    and financial solutions for supply chain partners and agricultural customers.
    It operates branches and automated teller machines in various cities/towns. The
    company was incorporated in 1994 and is headquartered in Mumbai, India.
