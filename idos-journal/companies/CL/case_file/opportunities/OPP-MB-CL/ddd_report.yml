    \  \n- **Margen de seguridad**: *Insuficiente* (precio de mercado > valor intrínseco).\
    \  \n- **Sensibilidad**  \n  - Si el PER se ajusta a 30× (valor típico del sector),\
    \ el precio implícito sería ≈ 77 USD, generando margen de seguridad del ~22 %.\
    \  \n  - Si el FCF crece a una tasa anual del 5 % y se mantiene el margen bruto,\
    \ el DCF podría acercarse al valor intrínseco estimado, pero la falta de datos\
