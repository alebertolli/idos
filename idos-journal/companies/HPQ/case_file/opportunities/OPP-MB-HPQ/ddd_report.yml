    ## 8. Marco de Valoración


    No hay base suficiente para establecer un valor intrínseco con rigor: faltan un
    precio de referencia explícito para reconciliar los múltiplos, períodos comparables
    y estimaciones financieras detalladas. La evaluación de AOIF indica que el margen
    de seguridad es insuficiente y que el valor intrínseco no puede estimarse con
    la información disponible.


    **Metodología a considerar tras completar la evidencia:**


    - Valorar por flujos de caja descontados con supuestos explícitos de ingresos,
    márgenes, inversión, capital de trabajo y conversión a FCF.

    - Contrastar el resultado con múltiplos de compañías comparables, verificando
    que los períodos, definiciones y precios de referencia sean homogéneos.

    - Analizar por separado Personal Systems, Printing y Corporate Investments si
    se obtienen datos segmentados.

    - Incorporar sensibilidad a la evolución de ingresos y márgenes, dada la ciclicidad
    del negocio y la presión competitiva.


    **Referencias observadas, no objetivos propios:** el 2026-11-21 se reportó un
    consenso de analistas con objetivo medio de USD 27,55 y rango de USD 20,00–33,40.
    El análisis de escenarios usa USD 20,00 como ancla bajista y USD 33,40 como ancla
    alcista, correspondientes a los extremos de ese rango para un horizonte al 2027-11-21.
    No son estimaciones de valor intrínseco ni recomendaciones propias.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    - ¿Qué segmentos explican el crecimiento reciente y la evolución del margen? Obtener
