prompt_inputs:
  business_model: GSK plc, together with its subsidiaries, engages in the research,
    development, and manufacture of vaccines, specialty medicines, and general medicines
    to prevent and treat disease in the United Kingdom, the United States, and internationally.
    It operates through Commercial Operations and Total R&D segments. The company
    offers specialty medicines that include oncology, respiratory/immunology, inflammation,
    and inhaled medicines for HIV, respiratory eosinophildriven diseases, lupus and
    lupus nephritis, ovarian cancer, and endometrial cancer. It also provides vaccines
    for Shingles, Meningitis, RSV, Seasonal Influenza, Hepatitis, Diphtheria, Tetanus,
    Acellular Pertussis, Rotavirus, Pertussis, Polio, Haemophilus, Invasive Diseases,
    Pneumonia, Acute Otitis Media, Measles, Mumps, Rubella and Chickenpox, and Human
    Papilloma Virus. Additionally, the company offers general medicines for asthma,
    COPD, bacterial infection, benign prostatic hyperplasia, allergic rhinitis, and
    inflammatory skin conditions. It also focuses on the discovery, development, and
    commercialization of oral small molecule therapies for patients with unmet needs
    in oncology and inflammatory diseases. It has a collaboration agreement with CureVac
    to develop mRNA vaccines for infectious diseases; and strategic research collaboration
    with Engitix Ltd. to identify and validate novel therapeutic targets driving liver
    fibrosis regression. The company has a strategic alliance with AN2 Therapeutics,
    Inc. for the development of new therapies for TB. GSK plc was formerly known as
    GlaxoSmithKline plc and changed its name to GSK plc in May 2022. The company was
    founded in 1715 and is headquartered in London, United Kingdom.
