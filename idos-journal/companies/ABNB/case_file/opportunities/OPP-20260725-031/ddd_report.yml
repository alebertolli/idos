  global de alojamiento y experiencias. Con un modelo marketplace de activos ligeros,
  genera $12.65B en ingresos TTM (+11.7% interanual) y un margen operativo del 20.5%.
  Mantiene un balance muy sólido con bajo endeudamiento (D/E 0.3x) y una posición
  dominante en la mente del consumidor global. A pesar del escrutinio regulatorio
  continuo, la escala de la plataforma y sus efectos de red le otorgan un moat competitivo
  duradero. Se recomienda una asignación estratégica dentro de la categoría Quality
  at Fair Price.
