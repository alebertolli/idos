dominio_esg_supply_chain:
  analisis: 'El riesgo ESG principal radica en la vertiente Social y de Gobernanza
    Regulatoria (''S'' y ''G''): tensiones en ciudades turísticas masificadas sobre
    el acceso a la vivienda asequible, que generan presiones legislativas (bans o
    límites de días). No hay riesgos significativos de cadena de suministro física
    al ser un negocio 100% digital respaldado por infraestructura en la nube.'
  rating: medio_riesgo
dominio_financial_health:
  analisis: El balance presenta una estructura altamente solvente con una razón Deuda/Patrimonio
    de solo 0.3x. La dinamica de capital de trabajo es muy favorable, ya que la plataforma
    cobra las reservas por adelantado generando un flotante operativo significativo
    antes de liquidar a los anfitriones. Mantiene altos niveles de liquidez en caja
    e inversiones a corto plazo que cubren holgadamente sus vencimientos de deuda.
  rating: fuerte
dominio_growth:
  analisis: 'Los vectores de crecimiento incluyen: 1) Expansión internacional en mercados
    sub-penetrado como Japón, Corea del Sur, Brasil y Alemania; 2) Estancias de larga
    duración (más de 28 días) impulsadas por la flexibilidad laboral remota/híbrida;
    3) Opcionalidad de monetización a través de servicios para anfitriones, anuncios
    patrocinados y reanzamiento de ''Experiencias''.'
  rating: fuerte
dominio_management:
  analisis: Liderada por su cofundador Brian Chesky, la directiva ha demostrado una
    agilidad ejecutiva sobresaliente, reestructurando radicalmente la base de costes
    durante la crisis de 2020 para convertir a ABNB en una máquina hiper-rentable.
    La alineación con los accionistas a largo plazo es total debido a la sustancial
    participación patrimonial de los fundadores y su enfoque en el diseño de producto
    y la asignación disciplinada de capital mediante recompras de acciones.
  rating: excepcional
