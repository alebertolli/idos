  consenso_actual: El mercado asume que Airbnb ha entrado en una fase de madurez con
    crecimiento de ingresos estabilizado en el rango del 10-12%, presionado por crecientes
    regulaciones municipales (restricciones de alquiler de corta estancia en ciudades
    clave como Nueva York o normativas europeas) y saturación de la oferta de anfitriones
    en mercados maduros.
  hipotesis_contraria: El mercado subestima el poder de monetización adicional del
    ecosistema de Airbnb y la rigidez de la demanda. La compañía está pasando de ser
    un mero intermediario de alojamiento a una plataforma de servicios de estilo de
    vida y estancias prolongadas (>28 días). La introducción de anuncios patrocinados
    (sponsored listings), tarifas por servicios auxiliares para anfitriones y la expansión
    en Asia-Pacífico y Latinoamérica permiten una reasceleración del valor bruto de
