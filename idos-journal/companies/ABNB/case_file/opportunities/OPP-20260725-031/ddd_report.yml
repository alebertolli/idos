clasificacion_oportunidad:
  categoria: quality_at_fair_price
  categorias_descartadas: 'Descartadas: ''Compounder castigado'' (no sufre una penalización
    drástica en precio por colapso temporal de fundamentales), ''Hype'' (ya genera
    beneficios reales sostenidos y alto flujo de caja, lejos de ser especulativa)
    y ''Cíclica'' (aunque depende del consumo discrecional, su modelo de plataforma
    y ganancias de cuota estructural la distancian de una cíclica pura).'
  justificacion: Airbnb es un negocio de calidad excepcional respaldado por efectos
    de red bilaterales, una marca que se ha convertido en verbo global y un modelo
    de activo ultra-ligero con elevada generación orgánica de caja. Aunque el crecimiento
    se ha moderado tras la normalización post-pandemia (+11.7% TTM), la compañía mantiene
    márgenes operativos sólidos del 20.5% y un ROIC cercano al 16%. La valoración
    actual refleja adecuadamente sus perspectivas inmediatas sin otorgar plena prima
    de monopolio, ofreciendo una oportunidad de inversión en una franquicia superior
    a un precio razonable.
dominio_business_quality:
  analisis: Airbnb goza de uno de los moats basados en efectos de red de dos lados
    más potentes de la economía digital. La oferta exclusiva de anfitriones atrae
    a millones de huéspedes orgánicamente (más del 90% del tráfico es directo o no
    pagado), lo que a su vez atrae a más anfitriones. La marca es sinónimo de la categoría.
    Al no poseer bienes inmuebles, el modelo es altamente escalable y resistente a
    variaciones en costes de capital inmobiliario.
  rating: excepcional
