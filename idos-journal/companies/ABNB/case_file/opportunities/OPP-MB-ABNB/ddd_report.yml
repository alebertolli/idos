  existing_wiki: '## 1. Visión General de la Compañía


    Airbnb, Inc. opera una plataforma digital global que conecta a huéspedes con anfitriones.
    Facilita la búsqueda, reserva, pago y comunicación para estancias, y también ofrece
    experiencias. Su modelo es un marketplace de dos lados: los anfitriones publican
    alojamientos y los huéspedes buscan y reservan opciones de viaje y ocio. La compañía
    genera ingresos principalmente mediante las reservas realizadas en la plataforma.
    [AOIF, 2026-11-19]


    La actividad combina tecnología y servicios de intermediación en el sector de
    viajes y alojamiento. La información de investigación describe operaciones en
    mercados internacionales, pero no detalla países, concentración geográfica ni
    desglose de ingresos por región. [DDD, 2026-11-19; AOIF, 2026-11-19]


    ## 2. Modelo de Negocio y Posición Competitiva


    **Drivers de ingresos identificados**

    - Volumen y valor de las reservas, noches reservadas y tarifas medias. Son métricas
    que conviene seguir, aunque no se aportan cifras para ellas. [AOIF, 2026-11-19]

    - Oferta de alojamientos y actividad de anfitriones, junto con la demanda de huéspedes.

    - Expansión de la oferta de experiencias y servicios de viaje integrados. Su adopción
    podría ampliar la actividad de la plataforma, pero el input no cuantifica su contribución
    actual o futura. [DDD, 2026-11-19]


    **Moat y posición competitiva**

    - La investigación atribuye a Airbnb ventajas por su marca global, la escala de
    la oferta, la confianza y los efectos de red entre anfitriones y huéspedes. [DDD,
    2026-11-19; AOIF, 2026-11-19]

    - AOIF califica la amplitud del moat como **estrecha** y la posición competitiva
    como **líder**. La ventaja potencial de red no elimina la competencia ni las restricciones
    regulatorias.

    - La industria es competitiva y sensible al ciclo económico, al gasto discrecional
    y a cambios en las preferencias de viaje. Entre los competidores mencionados están
    [[Booking Holdings]], [[Expedia Group]] y plataformas locales. [DDD, 2026-11-19;
    AOIF, 2026-11-19]


    ## 3. Perfil Financiero


    Las cifras proceden de los outputs de investigación y no incluyen estados financieros,
    definiciones completas ni enlaces a documentación primaria. Los periodos y métricas
    no siempre son comparables entre sí; deben verificarse antes de utilizarlos en
    un modelo.


    | Métrica | Valor reportado | Contexto y fuente |

    |---|---:|---|

    | Crecimiento de ingresos | 13,64% TTM | DDD, 2026-11-19 |

    | Crecimiento de ingresos | 16,66% | AOIF, 2026-11-19; periodo no especificado
    |

    | Margen operativo | 20,81% | DDD, 2026-11-19 |

    | Margen operativo | 22,49% | AOIF, 2026-11-19; periodo no especificado |

    | Flujo de caja libre (FCF) | 4.860 M USD TTM | DDD, 2026-11-19 |

    | ROIC | 17,25% | AOIF, 2026-11-19 |

    | PER | 33,99 | AOIF, 2026-11-19 |

    | EV/EBITDA | 30,56 | AOIF, 2026-11-19 |

    | FCF yield | 0 | AOIF, 2026-11-19; metodología o significado no aclarados |


    DDD caracteriza la tendencia financiera como sólida, apoyándose en el FCF y el
    margen operativo. AOIF califica la tendencia como estable, pero señala que no
    dispone de cifras verificables de FCF ni de beneficio neto para evaluar la conversión
    de caja. La diferencia entre los datos de FCF de ambos inputs requiere conciliación.
    [DDD, 2026-11-19; AOIF, 2026-11-19]


    **Estructura de capital:** no se proporcionan cifras de deuda, efectivo, vencimientos
    ni cobertura de intereses. DDD describe el balance como sólido, pero también indica
    que no dispone de datos de deuda; por tanto, esa caracterización no puede confirmarse
    con la evidencia aportada. [DDD, 2026-11-19]


    ## 4. Management y Gobierno Corporativo


    Los inputs califican la calidad del management como buena. Atribuyen al equipo
    capacidad para escalar el negocio globalmente, mantener márgenes y lanzar nuevas
    líneas, aunque no aportan métricas que permitan comprobar esa evaluación de forma
    independiente. AOIF califica la asignación de capital como creadora de valor y
    el alineamiento de insiders como moderado. [DDD, 2026-11-19; AOIF, 2026-11-19]


    No se proporcionan datos sobre remuneración ejecutiva, propiedad accionaria de
    insiders, composición o independencia del board, comités, sucesión ni objetivos
    de compensación. DDD identifica expresamente la evaluación de la calidad del management
    sin datos de compensación como una inferencia, no como un hecho verificado. [DDD,
    2026-11-19]


    ## 5. Tesis de Inversión


    **Caso alcista**

    - Airbnb opera un marketplace digital escalable y relativamente ligero en activos,
    que conecta oferta y demanda de alojamiento. [AOIF, 2026-11-19]

    - Los inputs reportan crecimiento de ingresos de dos dígitos —13,64% TTM en DDD
    y 16,66% en AOIF, con periodos no conciliados— y márgenes operativos superiores
    al 20%. [DDD, 2026-11-19; AOIF, 2026-11-19]

    - DDD reporta FCF de 4.860 M USD TTM. Si la cifra se confirma, respalda la capacidad
    de generación de caja del modelo. [DDD, 2026-11-19]

    - La marca, la escala y los efectos de red pueden favorecer la retención de usuarios
    y la amplitud de la oferta, aunque la magnitud y persistencia de esa ventaja no
    están cuantificadas. [DDD, 2026-11-19; AOIF, 2026-11-19]

    - La expansión de experiencias y servicios podría añadir oportunidades de crecimiento.
    La adopción masiva es una posibilidad, no un resultado confirmado. [DDD, 2026-11-19]


    DDD clasifica la oportunidad como *compounder* y registra una puntuación general
    de 78. También considera que la acción está infravalorada; esa conclusión depende
    de datos de valoración que no están conciliados entre los inputs. No se presenta
    aquí como hecho verificado. [DDD, 2026-11-19]


    ## 6. Riesgos y Contra-Tesis


    **Riesgos principales**

    1. **Regulación de alquileres de corta duración:** restricciones municipales o
    nacionales podrían reducir la oferta disponible o elevar los costes de cumplimiento.
    DDD la considera de impacto alto y probabilidad media; AOIF, de impacto alto y
    probabilidad alta. La diferencia de evaluación refleja incertidumbre, no una probabilidad
    establecida. [DDD, 2026-11-19; AOIF, 2026-11-19]

    2. **Ciclo económico y gasto discrecional:** una desaceleración del turismo podría
    reducir reservas, tarifas o duración de las estancias. AOIF califica su impacto
    como alto y su probabilidad como media. [AOIF, 2026-11-19]

    3. **Competencia:** la intensificación competitiva de [[Booking Holdings]], [[Expedia
    Group]] y plataformas locales podría presionar el crecimiento o los márgenes.
    DDD la califica de impacto y probabilidad medios. [DDD, 2026-11-19]

    4. **Valoración y expectativas:** una desaceleración del crecimiento o una presión
    sobre los márgenes podría dejar la acción expuesta si las expectativas implícitas
    resultan demasiado elevadas. AOIF reporta PER de 33,99 y EV/EBITDA de 30,56, sin
    aportar fecha o metodología detallada. [AOIF, 2026-11-19]


    **Contra-tesis:** el mercado podría estar sobrestimando la capacidad de Airbnb
    para sostener crecimiento superior al 13% y márgenes operativos cercanos al 20%
    ante mayor competencia y regulación. Esta es una hipótesis planteada por DDD,
    no una conclusión demostrada. [DDD, 2026-11-19]


    **Triggers de falsación**

    - Crecimiento de ingresos inferior al 5% anual, supuesto del escenario bajista.

    - Restricciones regulatorias que limiten la oferta en al menos cinco mercados
    clave, supuesto del escenario bajista.

    - Deterioro persistente de las métricas de reservas, tarifas, margen operativo
    o FCF. El input los propone como variables a vigilar, pero no establece umbrales
    cuantitativos para todas ellas. [DDD, 2026-11-19; AOIF, 2026-11-19]


    ## 7. Catalizadores y Timeline


    Los horizontes son cualitativos; no se proporcionan fechas de calendario específicas.
    Las probabilidades son estimaciones de DDD, no probabilidades verificadas.


    | Catalizador | Horizonte estimado | Impacto potencial | Probabilidad estimada
    | Evidencia y condiciones |

    |---|---|---|---:|---|

    | Aprobación de marcos regulatorios favorables en EE. UU. y Europa | Medio plazo
    | Alto | 30% | Podría facilitar la expansión de alquileres de corta duración y
    experiencias. La adopción de dichos marcos no está confirmada. [DDD, 2026-11-19]
    |

    | Lanzamiento y adopción de experiencias y servicios de viaje integrados | Corto
    plazo | Medio | 45% | Catalizador identificado por DDD; no se aportan métricas
    de adopción ni fechas de lanzamiento específicas. [DDD, 2026-11-19] |


    El escenario alcista supone regulación favorable en EE. UU. y Europa, crecimiento
    de ingresos superior al 15% y márgenes operativos alrededor del nivel indicado
    en el análisis. Son supuestos del escenario, no una previsión confirmada. [DDD,
    2026-11-19]


    ## 8. Marco de Valoración


    La valoración debe contrastar la generación de caja a largo plazo con el crecimiento,
    los márgenes, las necesidades de inversión y los riesgos regulatorios. Un enfoque
    de flujo de caja descontado requeriría FCF verificable y supuestos explícitos
    de crecimiento, tasa de descuento y valor terminal. También pueden emplearse múltiplos
    comparables, teniendo en cuenta las diferencias entre modelos y exposición regulatoria.


    **Datos y escenarios aportados**


    | Referencia | Valor | Interpretación y limitaciones |

    |---|---:|---|

    | Precio citado por DDD | 182,15 USD | Fecha y fuente de cotización no especificadas
    en el input. [DDD, 2026-11-19] |

    | Objetivo medio de analistas citado por DDD | 205,44 USD | Fuente y horizonte
    no especificados; no equivale a valor intrínseco. [DDD, 2026-11-19] |

    | Escenario bajista a 19-11-2028 | 147 USD | Supone restricciones en al menos
    cinco mercados clave y crecimiento inferior al 5% anual. [DDD, 2026-11-19] |

    | Escenario alcista a 19-11-2028 | 245 USD | Supone regulación favorable y crecimiento
    superior al 15% anual. [DDD, 2026-11-19] |

    | Margen de seguridad | Insuficiente | Evaluación de AOIF; su estimación de valor
    intrínseco no es determinable con los datos aportados. [AOIF, 2026-11-19] |


    Los precios objetivo de los escenarios dependen de supuestos que no vienen acompañados
    de un modelo financiero ni de fuentes concretas. AOIF no aporta precio actual
    y considera que no se puede determinar el valor intrínseco con la información
    disponible. Por ello, la conclusión de DDD de que existe un descuento frente al
    consenso no queda plenamente reconciliada con AOIF. [DDD, 2026-11-19; AOIF, 2026-11-19]


    **Sensibilidad cualitativa:** el caso alcista depende de crecimiento superior
    al 15% y regulación favorable; el bajista, de crecimiento inferior al 5% y restricciones
    en mercados clave. La valoración sería especialmente sensible a la trayectoria
    de crecimiento, la resiliencia del margen operativo y el impacto regulatorio.
    No hay información suficiente para calcular sensibilidades numéricas adicionales.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    - ¿Cuál es la deuda bruta y neta, su calendario de vencimientos y la cobertura
    de intereses?

    - ¿Qué restricciones concretas están vigentes o propuestas en ciudades y países
    relevantes, incluidos Nueva York, Barcelona y Tokio? Los inputs plantean esta
    cuestión, pero no aportan datos regulatorios específicos. [DDD, 2026-11-19]

    - ¿Cómo se concilian las cifras de crecimiento de ingresos (13,64% TTM frente
    a 16,66%) y margen operativo (20,81% frente a 22,49%)? ¿Qué periodos y definiciones
    utiliza cada una?

    - ¿Se puede verificar el FCF TTM de 4.860 M USD y reconciliarlo con la observación
    de AOIF de que no dispone de cifras verificables de FCF?

    - ¿Cuáles son las tendencias de noches reservadas, valor bruto de reservas, tarifas
    medias, duración de estancias y retención de usuarios?

    - ¿Qué contribución tienen las experiencias y servicios a los ingresos y al margen,
    y qué evidencia existe sobre su adopción?

    - ¿Qué evidencia cuantitativa respalda la magnitud del moat y la afirmación de
    efectos de red? ¿Cómo se compara la dinámica competitiva frente a [[Booking Holdings]],
    [[Expedia Group]] y plataformas locales?

    - ¿Cuáles son la remuneración ejecutiva, la propiedad de insiders, la composición
    del board y los indicadores de alineamiento de incentivos?

    - ¿Cuál es la fecha, fuente y metodología de las cifras de precio, consenso de
    analistas y múltiplos de valoración citadas?

    - ¿Qué supuestos de crecimiento, márgenes, inversión y descuento producen los
    objetivos de 147 USD y 245 USD?


    **Estado de evidencia:** los outputs DDD y AOIF están fechados el 19-11-2026.
    No incluyen enlaces a fuentes primarias ni referencias documentales para las métricas;
    los datos cuantitativos y las valoraciones deben tratarse como reportes de investigación
    pendientes de verificación. Las afirmaciones sobre moat, calidad del management
    y catalizadores son evaluaciones o hipótesis, no hechos confirmados.'
