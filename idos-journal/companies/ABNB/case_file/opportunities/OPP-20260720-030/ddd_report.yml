clasificacion_oportunidad:
  categoria: quality_at_fair_price
  categorias_descartadas: Compounder castigado (descartado porque la cotización no
    refleja un castigo extremo por pánico temporal, sino una consolidación razonable)
    y Cíclica (descartado porque, aunque el turismo es cíclico, Airbnb está ganando
    cuota estructural sobre la hotelería tradicional y diversificándose hacia estancias
    de larga duración).
  justificacion: Airbnb es un activo con un 'moat' formidable sustentado en efectos
    de red bilaterales, reconocimiento de marca global masivo (se ha convertido en
    un verbo) y un modelo de negocio con pocos activos fijos (asset-light) que genera
    elevados márgenes de FCF. Tras la normalización del auge post-pandemia, la valoración
    cotiza a múltiplos razonables considerando su perfil de rentabilidad sobre el
    capital invertido y su liderazgo sectorial indiscutible.
dominio_business_quality:
  analisis: 'Airbnb ostenta una posición competitiva de liderazgo casi monopólico
    en el segmento de alojamientos alternativos fuera de cadena. Su foso competitivo
    se basa en: 1) Efectos de red bilaterales (más oferta atrae más demanda y viceversa
    a escala global); 2) Capital de marca inigualable (Airbnb es un sustantivo y verbo
    en la cultura popular, permitiendo tráfico directo masivo y bajo gasto en marketing
    pagado); y 3) Costes de cambio implícitos para anfitriones (reputación acumulada
    mediante reseñas y herramientas de gestión integradas). El modelo asset-light
    permite retornos sobre el capital de alta eficiencia.'
  rating: excepcional
