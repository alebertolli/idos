dominio_esg_supply_chain:
  analisis: El principal riesgo ESG es de carácter Social y Regulatorio (Gobernanza
    urbana). Las normativas locales destinadas a mitigar la escasez de vivienda y
    el encarecimiento de los alquileres residenciales (ej. Nueva York, Barcelona,
    Florencia) imponen restricciones al alquiler de corta estancia. No obstante, la
    red de Airbnb está muy diversificada geográficamente y la compañía está colaborando
    proactivamente con gobiernos para establecer marcos regulatorios claros y pagar
    impuestos turísticos locales.
  rating: medio_riesgo
dominio_financial_health:
  analisis: Balance extremadamente robusto. Aunque los datos provistos registran un
    D/E de 0.3x, la empresa mantiene una posición de caja y equivalentes e inversiones
    a corto plazo holgada que supera con creces la deuda financiera bruta. Generación
    de caja libre estructuralmente elevada favorecida por un capital de trabajo negativo
    (los huéspedes pagan por adelantado en el momento de la reserva, mientras que
    los anfitriones cobran tras el check-in), creando un float financiero sustancial.
    La cobertura de intereses es amplia y el perfil de vencimientos de deuda no presenta
    riesgos de refinanciación a corto o medio plazo.
  rating: fuerte
dominio_growth:
  analisis: 'Impulsores orgánicos sólidos: 1) Aumento del volumen de noches reservadas
    impulsado por mercados emergentes en expansión (América Latina, Asia-Pacífico);
    2) Crecimiento de estancias de larga duración (>28 días) apoyado por tendencias
    de trabajo remoto e híbrido; 3) Incremento del Take Rate mediante la introducción
    de publicidad para hosts (Sponsored Listings) y tarifas por servicios adicionales;
    y 4) Recuperación del negocio de ''Experiencias'' y nuevos verticales de servicios.'
  rating: fuerte
dominio_management:
  analisis: 'Liderada por su cofundador y CEO Brian Chesky (nota: el perfil de datos
    del prompt contenía omisiones automáticas de antigüedad/ownership). Chesky mantiene
