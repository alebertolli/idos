prompt_inputs:
  business_model: ASML Holding N.V. provides lithography solutions for the development,
    production, marketing, sales, upgrading, and servicing of advanced semiconductor
    equipment systems. The company offers lithography, metrology, and inspection systems.
    It also provides extreme ultraviolet lithography systems; and deep ultraviolet
    lithography systems comprising immersion and dry lithography systems solutions
    to manufacture various range of semiconductor nodes and technologies. In addition,
    the company offers metrology and inspection systems, including YieldStar optical
    metrology systems, a diffraction-based wafer metrology platform to assess the
    quality of patterns on the wafers; and HMI electron beam solutions to locate and
    analyze individual chip defects. Further, it provides computational lithography
    solutions, and lithography systems and control software solutions; and refurbishes
    and upgrades lithography systems, as well as offers customer support and related
    services. Additionally, the company offers hardware, software, and services to
    chipmakers to produce the patterns of integrated circuits. It operates in Japan,
    South Korea, Singapore, Taiwan, China, rest of Asia, the Netherlands, rest of
    Europe, the Middle East, Africa, and the United States. The company was formerly
    known as ASM Lithography Holding N.V. and changed its name to ASML Holding N.V.
    in 2001. ASML Holding N.V. was founded in 1984 and is headquartered in Veldhoven,
    the Netherlands.
