  analisis: Balance extremadamente sólido con apalancamiento conservador (D/E de 0.1x).
    Margen operativo cercano al 35% y ROIC excepcional del 66%. La conversión a FCF
    ajustado temporalmente fluctúa por variaciones en capital de trabajo y pagos anticipados
    de clientes, pero la generación subyacente de caja es masiva y respalda recompras
    de acciones y dividendos crecientes.
