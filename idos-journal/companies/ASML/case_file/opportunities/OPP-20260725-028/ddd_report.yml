  existing_wiki: "# ASML Holding N.V. (ASML)\n\n## 1. Visión General de la Compañía\n\
    ASML Holding N.V. (fundada en 1984 y con sede en Veldhoven, Países Bajos) es el\
    \ proveedor líder mundial de sistemas de fotolitografía para la industria de semiconductores.\
    \ La compañía diseña, fabrica y comercializa equipos de litografía de Ultravioleta\
    \ Extremo (EUV) y Ultravioleta Profundo (DUV), junto con soluciones de metrología,\
    \ inspección y software computacional. \n\nEl modelo de negocio combina la venta\
    \ de hardware de capital intensivo y alta complejidad con un flujo de ingresos\
    \ recurrentes de alto margen derivados del mantenimiento, soporte técnico, actualizaciones\
    \ de software/hardware y reacondicionamiento de equipos instalados en las fábricas\
    \ (*fabs*) de sus clientes a nivel global. Sus operaciones abarcan regiones clave\
    \ como Taiwán, Corea del Sur, China, Estados Unidos y Europa.\n\n## 2. Modelo\
    \ de Negocio y Posición Competitiva\n\n### Drivers de Ingresos\n* **Sistemas de\
    \ Litografía EUV y High-NA EUV:** Equipos de última generación necesarios para\
    \ la fabricación de nodos avanzados (<7nm y sub-2nm). La transición a High-NA\
    \ EUV (serie EXE:5000) incrementa el precio medio de venta (ASP) por unidad de\
    \ ~$180 millones a más de $350 millones de euros.\n* **Sistemas de Litografía\
    \ DUV:** Equipos de inmersión y secado utilizados para nodos maduros y capas menos\
    \ críticas en nodos avanzados.\n* **Gestión de Base Instalada y Servicios:** Mantenimiento\
    \ preventivo, suministro de repuestos, software de litografía computacional y\
    \ actualizaciones (*upgrades*) de rendimiento.\n* **Sistemas de Metrología e Inspección:**\
    \ Plataformas ópticas (YieldStar) y de haz de electrones (HMI) para el control\
    \ de rendimiento de los obleas (*wafers*).\n\n### Análisis de Foso Competitivo\
    \ (Moat)\nASML cuenta con un foso competitivo **amplio** y de categoría monopólica,\
    \ fundamentado en:\n* **Monopolio Tecnológico:** Mantiene una cuota de mercado\
    \ del 100% en sistemas EUV y superior al 80% en DUV avanzada. No existe ningún\
    \ competidor con capacidad comercial o técnica para reemplazar la litografía EUV\
    \ en el corto o mediano plazo.\n* **Ecosistema y Cadena de Suministro Exclusiva:**\
    \ Coinnovación e integración profunda con proveedores de componente único e irreplicables,\
    \ como Carl Zeiss (óptica de alta precisión) y TRUMPF (fuentes láser).\n* **Propiedad\
    \ Intelectual y Propiedad de I+D:** Red de miles de patentes y conocimiento acumulado\
    \ (*know-how*) tras décadas de inversión en I+D superior al 10% de sus ventas\
    \ anuales.\n* **Altos Costes de Cambio:** Procesos de fabricación de los clientes\
    \ altamente calibrados para las herramientas de ASML, imposibilitando la sustitución\
    \ sin incurrir en costes y retrasos operativos prohibitivos.\n\n### Dinámica Competitiva\
    \ y Clientes\nLos principales clientes de la compañía son un grupo altamente concentrado\
    \ de fabricantes de lógica/fundiciones como [[TSMC]], [[Intel]] y [[Samsung]],\
    \ así como productores de memoria DRAM y NAND como [[Micron]] y [[SK Hynix]].\n\
    \n## 3. Perfil Financiero\n\nASML presenta un balance con un nivel de apalancamiento\
    \ conservador y una rentabilidad sobre el capital invertido (ROIC) estructuralmente\
    \ elevada.\n\n### Métricas Financieras Clave\n\n| Métrica | Valor |\n| :--- |\
    \ :--- |\n| **Crecimiento de Ingresos (TTM)** | 25.04% |\n| **Margen Operativo**\
    \ | 35.42% |\n| **ROIC** | 65.98% |\n| **Deuda / Capital Propio (D/E)** | 0.09x\
    \ |\n| **PER** | 56.33x |\n| **EV / EBITDA** | 43.92x |\n| **Rendimiento FCF (FCF\
    \ Yield)** | 1.85% |\n\n### Tendencias de Capital y Flujo de Caja\nHistoricamente,\
    \ ASML ha mantenido una conversión de Beneficio Neto a FCF superior al 80%. Las\
    \ variaciones temporales en el FCF se explican por el capital de trabajo requerido\
    \ para el ensamblaje, envío e instalación de sistemas complejos como EUV y High-NA\
    \ EUV, los cuales requieren pagos anticipados y extensos ciclos de prueba en las\
    \ instalaciones del cliente.\n\n## 4. Management y Gobierno Corporativo\n\n* **Calidad\
    \ del Liderazgo:** Evaluada como excepcional. La directiva ha demostrado disciplina\
    \ operativa manteniendo la reinversión continua en I+D y la retribución al accionista\
    \ mediante recompras de acciones y dividendos crecientes.\n* **Transición de Liderazgo:**\
    \ En 2024 se concretó una transición en el cargo de CEO. Aunque el nuevo liderazgo\
    \ cuenta con 0 años de antigüedad en la posición principal, la ejecución estratégica\
    \ y la asignación de capital han mantenido la continuidad histórica.\n* **Alineamiento\
    \ de Incentivos:** Fuerte alineación interna con planes de compensación vinculados\
    \ al rendimiento operativo a largo plazo, retorno sobre capital y avance de la\
    \ hoja de ruta tecnológica.\n\n## 5. Tesis de Inversión\n\nLa tesis de inversión\
    \ sobre ASML se clasifica dentro de la categoría de **Compounder** de escala global.\n\
    \n### Hechos Confirmados\n1. Monopolio del 100% en litografía EUV, indispensable\
    \ para procesadores sub-7nm.\n2. Generación de retornos sobre el capital superiores\
    \ al 60% (ROIC del 65.98%) y margen operativo del 35.42%.\n3. Hoja de ruta tecnológica\
    \ con visibilidad de demanda respaldada por los clientes de lógica y memoria a\
    \ nivel mundial.\n\n### Hipótesis y Caso Alcista\n* **Crecimiento Secular por\
    \ IA y Superciclo de Capex:** La demanda inelástica de litografía de nueva generación\
    \ (High-NA EUV) para infraestructura de Inteligencia Artificial Generativa compensará\
    \ cualquier desaceleración cíclica en mercados finales tradicionales.\n* **Ineficiencia\
    \ Lucrativa por Geopolítica:** Las restricciones de exportación e incentivos estatales\
    \ (CHIPS Act en EE. UU. y Europa) obligan a empresas como [[TSMC]], [[Intel]]\
    \ y [[Samsung]] a construir fábricas duplicadas a nivel regional (EE. UU., Europa,\
    \ Taiwán). Esta duplicación de capacidad incrementa la intensidad de capital por\
    \ oblea y la demanda agregada de herramientas de ASML a largo plazo.\n\n## 6.\
    \ Riesgos y Contra-Tesis\n\n### Caso Bajista y Riesgos Clave\n* **Riesgo Geopolítico\
    \ y Regulatorio (Alta probabilidad, Impacto medio/alto):** Ampliación de las restricciones\
    \ de exportación impuestas por EE. UU. y los Países Bajos. Una prohibición total\
    \ sobre el mantenimiento y venta de repuestos para la base instalada DUV en China\
    \ afectaría de forma directa los ingresos de altos márgenes.\n* **Riesgo de Cadena\
    \ de Suministro (Baja probabilidad, Alto impacto):** Disrupción o daño catastrófico\
    \ en la infraestructura de proveedores únicos de alta especialización, como la\
    \ fábrica de componentes ópticos de Carl Zeiss.\n* **Adopción y Rendimiento Económico\
    \ de High-NA EUV (Probabilidad media, Impacto medio):** Retrasos técnicos o un\
    \ ROI insuficiente para los clientes que ralentice la adopción comercial de los\
    \ sistemas serie EXE en favor de técnicas de patrones múltiples (*multi-patterning*)\
    \ con EUV estándar.\n\n### Triggers de Falsación de la Tesis\n* Pérdida sostenida\
    \ en la entrada trimestral de pedidos (*Net Bookings*) no justificada por la ciclicidad\
    \ normal del sector.\n* Incapacidad para escalar los márgenes brutos de los nuevos\
    \ sistemas High-NA EUV por encima del 55%.\n* Cancelación estructural de proyectos\
    \ de construcción de nuevas *fabs* a nivel global.\n\n## 7. Catalizadores y Timeline\n\
    \n| Catalizador | Descripción | Probabilidad | Impacto | Horizonte |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| **Ramp-up Comercial de High-NA EUV** | Adopción\
    \ en masa e integración de sistemas EXE:5000 en nodos <2nm por [[TSMC]], [[Intel]]\
    \ y [[Samsung]]. | 80% | Alto | Medio plazo |\n| **Despliegue de la CHIPS Act**\
    \ | Comienzo de operaciones de mega-fábricas subsidiadas en EE. UU. y Europa,\
    \ impulsando pedidos adicionales. | 85% | Alto | Medio plazo |\n\n## 8. Marco\
    \ de Valoración\n\nASML cotiza a múltiplos elevados (PER ~56x, EV/EBITDA ~44x),\
    \ sustentados en su posición de monopolio y métricas financieras de alta calidad.\
    \ \n\n### Análisis de Escenarios (Precio Objetivo y Valor Intrínseco)\n\n* **Valor\
    \ Intrínseco Estimado:** €780 - €820 por acción.\n* **Valor Esperado Ponderado:**\
    \ €846 por acción.\n* **Recomendación:** Mantener (Margen de\n\n---\n\n## Related\
    \ Companies\n\n- **Same Sector**: [[ADBE|Adobe Inc.]]"
