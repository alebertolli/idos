    el crecimiento de la demanda de chips de IA, centros de datos, automoción y dispositivos
    conectados. La introducción de sistemas High-NA EUV incrementa sustancialmente
    el precio medio de venta (ASP) por unidad (de ~$180M a >$350M por máquina), sosteniendo
    la expansión del Top-Line.
  rating: fuerte
dominio_management:
