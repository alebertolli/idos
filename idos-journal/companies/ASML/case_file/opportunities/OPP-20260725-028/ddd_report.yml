resumen_ejecutivo: ASML representa la piedra angular de la infraestructura tecnológica
  global. Con un monopolio del 100% en litografía EUV y más del 80% en DUV avanzada,
  la compañía opera como un peaje obligatorio para cualquier avance en la industria
  de semiconductores. A pesar de los riesgos geopolíticos y controles de exportación
  a China, la transición tecnológica hacia nodos sub-2nm y el despliegue de High-NA
  EUV respaldan un crecimiento secular sostenido del EBITDA y FCF con altos retornos
  de capital.
score_general: 88
tesis_inversion: ASML es un monopolio tecnológico insustituible en la cadena de valor
  global de semiconductores. La valoración actual refleja su alta calidad, pero descuenta
  en exceso los riesgos geopolíticos de corto plazo en China. La expansión del margen
  bruto derivada de High-NA EUV y el crecimiento secular en capex de semiconductores
  ofrecen una rentabilidad ajustada al riesgo muy atractiva para un inversor con horizonte
  de largo plazo.
