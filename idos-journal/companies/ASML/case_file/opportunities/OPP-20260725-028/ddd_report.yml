    introduce un periodo de asentamiento con 0 años de antigüedad en el cargo principal,
    la ejecución estratégica y la continuidad en la asignación de capital permanecen
    intactas. Históricamente, la directiva ha demostrado una disciplina impecable
    reinvestiendo >10% de ventas en I+D y retornando el exceso de caja a los accionistas.
  rating: bueno
