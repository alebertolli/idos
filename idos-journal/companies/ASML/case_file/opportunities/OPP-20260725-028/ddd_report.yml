clasificacion_oportunidad:
  categoria: compounder
  categorias_descartadas: 'Descartadas: ''Deep Value'' o ''Value Trap'' (multiplos
    elevados sustentados en fundamentos únicos); ''Turnaround'' (no hay deterioro
    operativo estructural); ''Cíclica'' (aunque la industria de semiconductores tiene
    ciclos, ASML captura valor de forma secular por transición de nodos y servicios
    recurrentes).'
  justificacion: ASML posee un monopolio de facto en la tecnología de litografía ultravioleta
    extrema (EUV), esencial para la fabricación de semiconductores avanzados (<7nm).
    Su ROIC estructuralmente superior (>60%), retornos crecientes sobre capital invertido
    y ventajas competitivas casi insuperables (foso tecnológico, escala de I+D, red
    de proveedores integrados como Zeiss) la definen como una compounder de clase
    mundial a largo plazo.
dominio_business_quality:
  analisis: ASML posee el foso competitivo (Moat) más sólido del sector tecnológico.
    Su red de suministro exclusiva (p. ej., óptica Carl Zeiss, láseres Trumpf), sus
    décadas de inversión acumulada en I+D y miles de patentes crean barreras de entrada
    prácticamente insuperables. El modelo de negocio se beneficia de altas tarifas
    de mantenimiento y actualizaciones software/hardware con altos márgenes que generan
    ingresos recurrentes sobre una base instalada creciente.
  rating: excepcional
