  categoria: compounder
  categorias_descartadas: Se descartan 'turnaround' y 'distressed' dado el sólido
    perfil operativo, ausencia de estrés de solvencia y crecimiento positivo de ingresos
    (22.54% TTM). Se descarta 'hype' porque la compañía respalda su valoración con
    flujo de caja operativo y libre masivo (FCF TTM de 23.77B reportado). Se descarta
    'deep_value' debido a que no cotiza con descuento por liquidación ni sobre activos
    tangibles deprimidos. Se descarta 'compounder_castigado' porque, aunque cotiza
    por debajo de la media de consenso ($1,676.69 vs $2,148.07 USD), la cotización
    no refleja un deterioro estructural grave ni un castigo anómalo de mercado.
  justificacion: ASML ostenta un monopolio fáctico a nivel global en litografía ultravioleta
    extrema (EUV), una tecnología crítica e irremplazable para la manufactura de semiconductores
    en nodos de vanguardia (<7nm). Su perfil combina un retorno sobre el capital invertido
    superior, márgenes operativos elevados (38.55% TTM verificado) y crecimiento sostenido
    impulsado por tendencias seculares de cómputo avanzado, IA y digitalización.
