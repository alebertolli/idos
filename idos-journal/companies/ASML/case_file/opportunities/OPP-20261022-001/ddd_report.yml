resumen_ejecutivo: ASML es el único proveedor de litografía EUV a escala de producción,
  con una posición de monopolio técnico que le otorga un moat duradero. Sus finanzas
  muestran generación de flujo de caja libre de 23.75 B EUR y márgenes operativos
  de 38.5 %, respaldados por un crecimiento de ingresos del 22.5 % YoY. El precio
  de mercado (1,560 USD) está por debajo del rango de precios objetivo de los analistas,
  indicando una posible subvaloración. Los principales riesgos son geopolíticos y
  la dependencia de un número limitado de clientes, pero los catalizadores de demanda
  de EUV y la expansión a nodos más avanzados pueden impulsar una revaluación al alza.
