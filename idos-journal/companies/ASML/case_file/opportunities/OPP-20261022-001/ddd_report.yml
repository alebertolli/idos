resumen_ejecutivo: ASML es el proveedor dominante de equipos de litografía EUV, con
  una ventaja tecnológica que le otorga un moat excepcional. Sus métricas financieras
  (FCF ≈ 23.7 B EUR, margen operativo ≈ 38.5%, crecimiento de ingresos ≈ 22.5% TTM)
  indican una salud robusta. La gestión ha demostrado capacidad para ejecutar inversiones
  de capital de gran escala y mantener relaciones estratégicas con los principales
  fabricantes. Los principales impulsores de crecimiento son la expansión de la capacidad
