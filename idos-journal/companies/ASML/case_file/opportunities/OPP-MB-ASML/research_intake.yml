  ratio_definitions:
    revenue_cagr_3y_pct: (revenue_t / revenue_t-3)^(1/3) - 1
    fcf_growth_pct: (FCF_t / FCF_t-1) - 1; requiere FCF comparable y positivo en ambos
      períodos
    fcf_conversion_pct: FCF / net_income * 100; informar no significativo si net_income
      <= 0
    net_debt_ebitda: (total_debt - cash_and_equivalents) / EBITDA; equivalent to -net_cash/EBITDA
      when the source reports net_cash = cash - debt
    dilution_yoy_pct: (diluted_shares_t / diluted_shares_t-1) - 1
    share_count_cagr_3y_pct: (shares_t / shares_t-3)^(1/3) - 1
    current_ratio: current_assets / current_liabilities
    interest_coverage: EBIT / interest_expense; no sustituir EBIT por EBITDA
    fcf_runway_months: cash_and_equivalents / abs(monthly_FCF_burn); sólo si FCF es
      negativo
    gross_margin_pct: gross_profit / revenue * 100
  ratio_units:
    revenue_cagr_3y_pct: percent
    fcf_growth_pct: percent
