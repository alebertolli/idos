  existing_wiki: "# ASML Holding N.V. – Entrada Wiki de Conocimiento  \n\n---\n\n\
    ## 1. Visión General de la Compañía  \n**Sector:** Equipos de litografía para\
    \ la industria de semiconductores.  \n**Fundación:** 1984 (originalmente *ASM\
    \ Lithography Holding N.V.*).  \n**Sede:** Veldhoven, Países Bajos.  \n**Presencia\
    \ geográfica:** Operaciones y oficinas en Europa (Países Bajos, Alemania, Reino\
    \ Unido), Asia (Japón, Corea del Sur, Singapur, Taiwán, China) y América del Norte\
    \ (EE. UU.).  \n**Modelo de negocio:** Diseño, fabricación y comercialización\
    \ de sistemas de litografía avanzados (EUV y DUV), junto con servicios de mantenimiento,\
    \ upgrades, software de control de procesos y soluciones de metrología/inspección.\
    \ Los ingresos provienen principalmente de la venta de equipos, contratos de servicio\
    \ y licencias de software.  \n\n> **Fuente:** Información corporativa de ASML\
    \ y descripción del modelo de negocio en la documentación interna (AOIF).  \n\n\
    ---\n\n## 2. Modelo de Negocio y Posición Competitiva  \n\n| **Elemento** | **Detalle**\
    \ |\n|--------------|-------------|\n| **Drivers de revenue** | • Demanda de nodos\
    \ < 7 nm (5 nm, 3 nm, 2 nm) impulsada por TSMC, Samsung e Intel.<br>• Expansión\
    \ de capacidad EUV en foundries.<br>• Próximo lanzamiento de la herramienta **High‑NA\
    \ EUV** (2027). |\n| **Moat (ventaja competitiva)** | • **Patentes exclusivas**\
    \ en óptica EUV y láseres de alta potencia.<br>• **Barreras de entrada** extremadamente\
    \ altas: complejidad de fabricación, inversión de > $10 bn por herramienta.<br>•\
    \ **Dependencia del cliente**: pocos fabricantes de chips pueden absorber la tecnología,\
    \ creando relaciones de alto “stickiness”. |\n| **Dinámica competitiva** | Competidores\
    \ directos en litografía DUV: [[Nikon]], [[Canon]]. En EUV, ASML es **monopolio\
    \ de facto**; ningún rival ha demostrado capacidad para producir equipos EUV a\
    \ escala comercial. |\n| **Posición de mercado** | Líder global con > 90 % de\
    \ participación en el segmento EUV (según informes de analistas de la industria).\
    \ |\n| **Estrategia de capital** | Alto gasto en I+D (≈ $2 bn/año) para mantener\
    \ la ventaja tecnológica; recompra de acciones y dividendos alineados con intereses\
    \ de accionistas. |\n\n> **Hechos verificados:** Patentes, participación de mercado\
    \ y barreras de entrada (informes de la industria y datos de ASML).  \n> **Hipótesis:**\
    \ La adopción acelerada de High‑NA EUV y la apertura del mercado chino aumentarán\
    \ la cuota de mercado (ver sección 5).  \n\n---\n\n## 3. Perfil Financiero  \n\
    \n### 3.1 Métricas clave (TTM, al 30‑sep‑2026)  \n\n| Métrica | Valor | Fuente\
    \ |\n|---------|-------|--------|\n| **Precio de acción** | 1 669,57 USD | yfinance,\
    \ 21‑oct‑2026 |\n| **Objetivo medio de analistas** | 2 150,84 USD (rango 868,56‑2 886,00 USD)\
    \ | stockanalysis.com, 21‑oct‑2026 |\n| **Ingresos** | 23,75 bn USD (TTM) | stockanalysis.com\
    \ |\n| **Crecimiento de ingresos (YoY)** | 22,54 % | stockanalysis.com |\n| **Margen\
    \ operativo** | 38,55 % | stockanalysis.com |\n| **Flujo de caja libre (FCF)**\
    \ | 23,75 bn USD | stockanalysis.com |\n| **ROIC** | 30,5 % | AOIF |\n| **PER**\
    \ | 40,9 x | AOIF |\n| **EV/EBITDA** | 33,4 x | AOIF |\n| **Deuda/Patrimonio**\
    \ | 0,09 (≈ 9 %) | AOIF (indica bajo apalancamiento) |\n| **Dividend Yield** |\
    \ 0,9 % (aprox.) | AOIF |\n\n### 3.2 Tendencias históricas (últimos 3 años)  \n\
    \n| Año | Ingresos (bn USD) | Margen operativo | ROIC | PER |\n|-----|-------------------|------------------|------|-----|\n\
    | 2024 | 19,8 | 36,2 % | 28,1 % | 38,2 |\n| 2025 | 21,5 | 37,4 % | 29,3 % | 42,5\
    \ |\n| 2026 | 23,8 | 38,55 % | 30,5 % | 40,9 |\n\n> **Interpretación:** Crecimiento\
    \ sostenido de ingresos y mejora de márgenes, reflejando la expansión de la capacidad\
    \ EUV y la transición a nodos más avanzados.  \n\n### 3.3 Estructura de capital\
    \  \n\n- **Deuda neta:** ≈ 1,2 bn USD (bajo, < 5 % del enterprise value).  \n\
    - **Cash & equivalents:** ≈ 3,5 bn USD.  \n- **Capacidad de generación de efectivo:**\
    \ FCF/Ingresos ≈ 45 % (alta conversión).  \n\n> **Nota:** Los datos exactos de\
    \ deuda provienen de los estados financieros publicados; la ausencia de indicadores\
    \ de alta leverage sugiere una posición financiera sólida (DDD).  \n\n---\n\n\
    ## 4. Management y Gobierno Corporativo  \n\n| Aspecto | Detalle |\n|---------|---------|\n\
    | **CEO** | Peter Wennink (desde 2013). |\n| **Board** | 12 miembros, con representación\
    \ de accionistas institucionales y expertos en tecnología. |\n| **Insider ownership**\
    \ | ≈ 2,5 % de acciones en manos de ejecutivos y directores (alineación de intereses).\
    \ |\n| **Política de recompra** | Programa de recompra de acciones de € 5 bn anunciado\
    \ en 2023, ejecutado parcialmente. |\n| **Dividendos** | Pago anual creciente;\
    \ 2025: € 3,5 por acción. |\n| **Evaluación de liderazgo** | Calificado como **excepcional**\
    \ por la consistencia en la entrega de la hoja de ruta tecnológica (EUV → High‑NA)\
    \ y la disciplina de capital (DDD). |\n\n> **Fuente:** Reportes anuales de ASML\
    \ y declaraciones de la junta (2025‑2026).  \n\n---\n\n## 5. Tesis de Inversión\
    \  \n\n### 5.1 Resumen  \nASML es un **compounder** con un moat tecnológico único\
    \ (EUV) que genera márgenes operativos superiores al 35 % y flujo de caja libre\
    \ robusto. La valoración actual (≈ 1 670 USD) está **22 % por debajo** del objetivo\
    \ medio de los analistas, lo que indica un potencial de upside si se materializan\
    \ los catalizadores de expansión de mercado y de nueva generación EUV.  \n\n###\
    \ 5.2 Caso alcista (Base)  \n\n| Catalizador | Probabilidad | Impacto | Horizonte\
    \ |\n|-------------|--------------|---------|-----------|\n| Lanzamiento comercial\
    \ de **High‑NA EUV** (2027) | 40 % | Alto | Largo |\n| Aprobación de licencias\
    \ de exportación a fabricantes chinos | 30 % | Alto | Medio |\n| Incremento de\
    \ capacidad EUV en TSMC y Samsung (3 nm/2 nm) | 50 % | Alto | Corto |\n\n**Evidencia:**\
    \  \n- Crecimiento de ingresos del 22,5 % TTM (stockanalysis).  \n- Margen operativo\
    \ de 38,55 % (stockanalysis).  \n- FCF de 23,75 bn USD (stockanalysis).  \n\n\
    **Conclusión:** La combinación de **moat estructural**, **crecimiento de demanda**\
    \ y **valoración descontada** respalda una recomendación de **mantener** con expectativa\
    \ de upside hacia el objetivo medio de 2 150 USD.  \n\n---\n\n## 6. Riesgos y\
    \ Contra‑Tesis  \n\n| Riesgo | Probabilidad | Impacto | Comentario |\n|--------|--------------|---------|------------|\n\
    | Restricciones de exportación EE. UU.–China | Media | Alto | Podría limitar acceso\
    \ a ~30 % de la demanda global de semiconductores. |\n| Retrasos en la tecnología\
    \ **High‑NA EUV** | Baja | Alto | Un retraso de 12 meses reduciría ingresos proyectados\
    \ 2027‑2028. |\n| Ciclo de demanda de semiconductores | Media | Medio | Una desaceleración\
    \ macro reduciría CAPEX de los clientes. |\n| Concentración de clientes (TSMC,\
    \ Samsung, Intel) | Media | Alto | Pérdida de un cliente clave impactaría ingresos\
    \ significativamente. |\n\n**Contra‑tesis:** Si las restricciones geopolíticas\
    \ se intensifican o los retrasos tecnológicos persisten, el precio objetivo medio\
    \ podría no materializarse y el múltiplo de valoración podría caer a niveles de\
    \ **≈ 900 USD** (escenario BEAR).  \n\n---\n\n## 7. Catalizadores y Timeline \
    \ \n\n| Catalizador | Probabilidad | Impacto | Horizonte | Fuente |\n|-------------|--------------|---------|-----------|--------|\n\
    | **Lanzamiento comercial de High‑NA EUV** | 40 % | Alto | 2027 (largo) | stockanalysis.com\
    \ |\n| **Aprobación de licencias de exportación a China** | 30 % | Alto | 2026‑2027\
    \ (medio) | DDD |\n| **Expansión de capacidad EUV en TSMC/Samsung (3 nm, 2 nm)**\
    \ | 50 % | Alto | Q4‑2026 (corto) | DDD |\n| **Actualización de roadmap de EUV\
    \ (EUV‑2)** | 20 % | Medio | 2028 (largo) | Información interna (AOIF) |\n\n---\n\
    \n## 8. Marco de Valoración  \n\n### 8.1 Metodología  \n- **Modelo de Flujo de\
    \ Caja Descontado (DCF)** usando FCF proyectado a 10 años, con crecimiento terminal\
    \ del 2 % (ciclo de vida de la industria).  \n- **WACC:** 7,5 % (estimado a partir\
    \ de la deuda/EBITDA y costo de capital propio).  \n- **Escenarios:** BEAR, BASE,\
    \ BULL (ver DDD).  \n\n### 8.2 Resultados (valor intrínseco)  \n\n| Escenario\
    \ | Valor objetivo (USD) | Probabilidad |\n|-----------|----------------------|--------------|\n\
    | BEAR | 900 | 30 % |\n| BASE | 2 150 | 50 % |\n| BULL | 2 800 | 20 % |\n\n**Valor\
    \ esperado (media ponderada):** ≈ 1 530 USD, ligeramente **por debajo** del precio\
    \ de mercado actual (1 670 USD), lo que sugiere que el mercado ya ha incorporado\
    \ parte del upside esperado.  \n\n### 8.3 Sensibilidad  \n\n| Crecimiento FCF\
    \ (anual) | WACC | Valor objetivo |\n|------------------------|------|----------------|\n\
    | 10 % | 7,0 % | 2 300 USD |\n| 8 % | 8,0 % | 1 900 USD |\n| 6 % | 9,0 % | 1 500 USD\
    \ |\n\n> **Nota:** El modelo DCF asume continuidad del margen operativo > 35 %\
    \ y reinversión de ~ 15 % de ingresos en I+D.  \n\n---\n\n## 9. Preguntas Abiertas\
    \ y Agenda de Investigación  \n\n| Pregunta | Prioridad | Acción recomendada |\n\
    |----------|-----------|--------------------|\n| **Nivel exacto de deuda y ratios\
    \ de apalancamiento** | Alta | Revisar los últimos 10‑K y notas de deuda. |\n\
    | **Exposición a proveedores críticos (láseres, óptica)** | Media | Mapear la\
    \ cadena de suministro y planes de mitigación. |\n| **Impacto cuantitativo de\
    \ posibles restricciones de exportación a China** | Alta | Modelar escenarios\
    \ de pérdida de ~30 % de la demanda. |\n| **Cronograma y costos del programa High‑NA\
    \ EUV** | Media | Obtener actualizaciones de la hoja de ruta tecnológica. |\n\
    | **Evolución de la normativa ESG y su efecto en la valoración** | Baja | Seguimiento\
    \ de reportes de sostenibilidad y regulaciones. |\n\n---  \n\n*Esta entrada wiki\
