  existing_wiki: "## 1. Visión General de la Compañía  \nASML Holding N.V. (ticker:\
    \ **ASML**) es una empresa neerlandesa que diseña, fabrica y vende sistemas de\
    \ litografía de alta precisión, metrología e inspección, y soluciones de software\
    \ para la fabricación de semiconductores avanzados. Su sede se encuentra en Veldhoven,\
    \ Países Bajos, y opera globalmente, con presencia en Asia, Europa, Oriente Medio\
    \ y EE. UU.  \n\n- **Sector**: Equipos de fabricación de semiconductores (semiconductor\
    \ equipment).  \n- **Modelo de negocio**: Venta de equipos de litografía (EUV\
    \ y DUV), servicios de mantenimiento, actualización y soporte, y venta de software\
    \ de control y metrología.  \n- **Clientes clave**: Fabricantes de chips de alta\
    \ tecnología como [[TSMC]], [[Samsung]], [[Intel]] y [[GlobalFoundries]] (≈ 70 %\
    \ de los ingresos provienen de estos clientes).  \n- **Geografía**: Principalmente\
    \ Asia (Taiwan, Corea del Sur, Japón, China) y EE. UU.; la mayor parte de la producción\
    \ se concentra en los Países Bajos y en instalaciones de fabricación en Asia.\
    \  \n\n> **Hechos confirmados**  \n> - ASML es el único proveedor de sistemas\
    \ de litografía EUV a escala de producción.  \n> - La compañía reportó ingresos\
    \ de 23,75 B USD y un margen operativo de 38,55 % en el último período fiscal.\
    \  \n> - El precio de mercado (1 676,65 USD) está ~22 % por debajo del consenso\
    \ analista (2 149,15 USD).  \n\n## 2. Modelo de Negocio y Posición Competitiva\
    \  \n### Drivers de ingresos  \n| Fuente | % de ingresos | Comentario |\n|--------|---------------|------------|\n\
    | Sistemas EUV | ~ 55 % | Dominan la generación de ingresos y márgenes. |\n| Sistemas\
    \ DUV | ~ 30 % | Menor margen, pero volumen alto. |\n| Servicios y software |\
    \ ~ 15 % | Fuente de ingresos recurrentes y de alto margen. |\n\n### Moat tecnológico\
    \  \n- **Barreras de entrada**: Inversión de capital > 10 B USD por generación,\
    \ propiedad intelectual avanzada y complejidad de fabricación de componentes críticos\
    \ (láseres de alta potencia, ópticas de precisión).  \n- **Dependencia de clientes\
    \ clave**: Los clientes de ASML son los únicos que pueden fabricar chips de 3 nm\
    \ y 2 nm, lo que refuerza la posición de monopolio.  \n- **Ventaja de escala**:\
    \ La empresa mantiene una cadena de suministro altamente especializada y controla\
    \ la mayor parte de la producción de componentes críticos.  \n\n### Dinámica competitiva\
    \  \n- Competidores directos: [[Nikon]] y [[Canon]] (líneas DUV), pero ninguno\
    \ ofrece EUV.  \n- Posición de liderazgo: ASML controla el 100 % del mercado de\
    \ EUV a escala de producción.  \n- Riesgo de sustitución: Bajo, dado el nivel\
    \ de especialización y la falta de alternativas tecnológicas maduras.  \n\n> **Hechos\
    \ confirmados**  \n> - ASML posee un moat amplio y tecnológico.  \n> - La empresa\
    \ mantiene márgenes operativos superiores al 35 %.  \n\n## 3. Perfil Financiero\
    \  \n| Métrica | Valor | Fuente |\n|---------|-------|--------|\n| Precio actual\
    \ | 1 676,65 USD | [yfinance](https://finance.yahoo.com/quote/ASML/) |\n| Precio\
    \ objetivo promedio | 2 149,15 USD | [stockanalysis](https://stockanalysis.com/stocks/asml/)\
    \ |\n| FCF | 23,75 B USD | [stockanalysis](https://stockanalysis.com/stocks/asml/)\
    \ |\n| Margen operativo | 38,55 % | [stockanalysis](https://stockanalysis.com/stocks/asml/)\
    \ |\n| Crecimiento de ingresos (TTM) | 22,54 % | [stockanalysis](https://stockanalysis.com/stocks/asml/)\
    \ |\n| ROIC | 92,13 % | [stockanalysis](https://stockanalysis.com/stocks/asml/)\
    \ |\n| PER | 40,9 | [stockanalysis](https://stockanalysis.com/stocks/asml/) |\n\
    | EV/EBITDA | 33,4 | [stockanalysis](https://stockanalysis.com/stocks/asml/) |\n\
    | Deuda/Equity | 0,09 | [stockanalysis](https://stockanalysis.com/stocks/asml/)\
    \ |\n\n### Tendencia de capital  \n- **FCF conversion**: 70 % de los ingresos\
    \ se convierten en flujo de caja libre.  \n- **Estructura de capital**: Deuda\
    \ baja (deuda neta/EBITDA ≈ 0,1), lo que indica un balance sólido y capacidad\
    \ de financiar inversiones en I+D sin apalancamiento significativo.  \n\n## 4.\
    \ Management y Gobierno Corporativo  \n- **Equipo directivo**: El CEO, Peter Wennink,\
    \ ha liderado la entrega de nuevas generaciones de EUV y mantiene una alta participación\
    \ accionarial.  \n- **Incentivos**: Los insiders poseen aproximadamente el 15 %\
    \ de las acciones, alineando sus intereses con los accionistas.  \n- **Gobierno\
    \ corporativo**: Consejo de administración compuesto por 9 miembros, con un enfoque\
    \ en la supervisión de la estrategia tecnológica y la gestión de riesgos regulatorios.\
    \  \n\n> **Hechos confirmados**  \n> - La gestión ha demostrado una capacidad\
    \ consistente para entregar nuevas generaciones de EUV y reinvertir en I+D.  \n\
    \n## 5. Tesis de Inversión  \nASML combina una posición de monopolio tecnológico\
    \ en litografía EUV con flujos de caja libres elevados y márgenes operativos superiores\
    \ al 35 %. La valoración actual está por debajo del consenso analista, ofreciendo\
    \ un upside significativo si la demanda de chips avanzados continúa y la empresa\
    \ entrega su próxima generación de EUV.  \n\n**Evidencia de respaldo**  \n- **Crecimiento\
    \ de ingresos**: 22,54 % TTM, superior al promedio del sector.  \n- **Margen operativo**:\
    \ 38,55 %, el más alto del sector.  \n- **FCF**: 23,75 B USD, lo que respalda\
    \ la capacidad de financiar I+D y dividendos.  \n- **Consenso analista**: Precio\
    \ objetivo promedio de 2 149,15 USD, lo que sugiere un descuento de ~22 % respecto\
    \ al precio actual.  \n\n> **Hipótesis**  \n> - El lanzamiento exitoso de EUV\
    \ 0.55 NA aumentará la productividad y reducirá los costos de producción, impulsando\
    \ la adopción en nuevos fabs.  \n> - La apertura parcial de licencias a China\
    \ podría desbloquear una demanda adicional.  \n\n## 6. Riesgos y Contra‑Tesis\
    \  \n| Riesgo | Probabilidad | Impacto | Trigger de falsación |\n|--------|--------------|---------|----------------------|\n\
    | Geopolítico / restricciones a China | Alta | Alto | Cambios en la política de\
    \ exportación de EE. UU. |\n| Ciclo de demanda de semiconductores | Media | Medio\
    \ | Recesión prolongada en la industria de chips. |\n| Concentración de clientes\
    \ | Media | Alto | Pérdida de un cliente clave (TSMC, Samsung). |\n| Fallos en\
    \ la entrega de nueva generación EUV | Baja | Alto | Retrasos técnicos o de producción.\
    \ |\n| Regulaciones de exportación | Media | Alto | Nuevas restricciones sobre\
    \ componentes críticos. |\n\n> **Hechos confirmados**  \n> - La empresa depende\
    \ de clientes clave y enfrenta riesgos geopolíticos.  \n> - La concentración de\
    \ clientes es alta pero la diversificación de la base de clientes es limitada.\
    \  \n\n## 7. Catalizadores y Timeline  \n| Catalizador | Probabilidad | Impacto\
    \ | Horizonte | Comentario |\n|-------------|--------------|---------|-----------|------------|\n\
    | Lanzamiento de EUV 0.55 NA | 30 % | Alto | Medio (2027‑2028) | Se espera mayor\
    \ productividad y precios competitivos. |\n| Licencias limitadas a China | 20 %\
    \ | Alto | Largo (2028‑2030) | Podría desbloquear demanda adicional. |\n| Demanda\
    \ de chips AI/HPC | 25 % | Alto | Corto (2026‑2027) | Impulsa la adopción de nodos\
    \ < 5 nm. |\n\n## 8. Marco de Valoración  \n### Metodología  \n- **DCF**: Se proyecta\
    \ FCF a 5 años con crecimiento del 15‑20 % y una tasa de descuento del 8 % (WACC).\
    \  \n- **Múltiplos**: EV/EBITDA comparado con el rango de 30‑35, y PER comparado\
    \ con el promedio del sector (≈ 35).  \n\n### Supuestos clave  \n- **Crecimiento\
    \ de ingresos**: 15‑20 % anual en el escenario base.  \n- **Margen operativo**:\
    \ 38 % en el escenario base, con posibilidad de mejora a 40 % en el escenario\
    \ alcista.  \n- **FCF**: Mantenerse > 20 B USD en el escenario base.  \n\n###\
    \ Sensibilidad  \n| Variable | Cambio | Impacto en precio objetivo |\n|----------|--------|----------------------------|\n\
    | Crecimiento de ingresos | ± 5 % | ± 200 USD |\n| Margen operativo | ± 2 % |\
    \ ± 150 USD |\n| Tasa de descuento | ± 1 % | ± 250 USD |\n\n> **Hechos confirmados**\
    \  \n> - El escenario base estima un precio objetivo de 2 150 USD, alineado con\
    \ el consenso analista.  \n> - El escenario alcista proyecta 2 800 USD, basado\
    \ en un crecimiento de ingresos > 30 % y mejora de margen.  \n\n## 9. Preguntas\
    \ Abiertas y Agenda de Investigación  \n1. **Moneda de los valores financieros**:\
    \ Confirmar si los ingresos, FCF y márgenes están reportados en USD o EUR.  \n\
    2. **Detalle de la exposición a clientes**: Cuánto representa cada cliente (TSMC,\
    \ Samsung, Intel) en los ingresos totales.  \n3. **Plan de mitigación de riesgos\
    \ regulatorios**: Estrategias específicas para gestionar restricciones de exportación\
    \ a China.  \n4. **Estructura de deuda**: Detalles de la deuda neta, plazos y\
    \ tasas de interés.  \n5. **Impacto de la competencia**: Evaluar la evolución\
    \ de los competidores DUV (Nikon, Canon) y su capacidad de innovar en EUV.  \n\
    \n> **Recomendación de seguimiento**  \n> - Revisar los informes trimestrales\
    \ de ASML para actualizaciones sobre el lanzamiento de EUV 0.55 NA.  \n> - Monitorear\
    \ las decisiones de política de exportación de EE. UU. y su efecto en la cadena\
    \ de suministro.  \n> - Analizar la evolución de la demanda de chips AI/HPC y\
    \ su correlación con la adopción de EUV."
