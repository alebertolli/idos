  existing_wiki: "# ASML Holding N.V. – Entrada Wiki de Conocimiento  \n\n> **Nota:**\
    \ Todos los datos marcados como *Hecho verificado* provienen de fuentes públicas\
    \ citadas al final de la sección correspondiente. Las *Hipótesis* y *Supuestos*\
    \ se indican explícitamente y están basados en el análisis interno (DDD, AOIF).\
    \  \n\n---  \n\n## 1. Visión General de la Compañía  \n\n| Campo | Detalle |\n\
    |------|---------|\n| **Nombre** | ASML Holding N.V. |\n| **Ticker** | ASML (Euronext\
    \ Amsterdam) |\n| **Fundación** | 1984 (originalmente *ASM Lithography*) |\n|\
    \ **Sede** | Veldhoven, Países Bajos |\n| **Sector** | Equipos de semiconductores\
    \ – Litografía |\n| **Geografía de operaciones** | Europa (NL), Asia (Japón, Corea\
    \ del Sur, Singapur, Taiwán, China), América (EE. UU.) |\n| **Modelo de negocio**\
    \ | Diseño, fabricación, venta y soporte de sistemas de litografía EUV y DUV,\
    \ metrología, software y servicios de mantenimiento. Genera ingresos recurrentes\
    \ por contratos de servicio y actualizaciones de equipos. |\n| **Principales clientes**\
    \ | [[TSMC]], [[Intel]], [[Samsung]], fabricantes de memoria (SK Hynix, Micron)\
    \ y otros fabricantes de chips a nivel global. |\n| **Proveedores críticos** |\
    \ [[Carl Zeiss]] (ópticas), [[Trumpf]] (láseres), proveedores de componentes de\
    \ alta precisión. |\n\n**Descripción breve**  \nASML es el único fabricante mundial\
    \ de sistemas de litografía de *Extreme Ultraviolet* (EUV), tecnología esencial\
    \ para producir chips con nodos < 5 nm. Posee también una posición dominante en\
    \ litografía *Deep Ultraviolet* (DUV) y en soluciones de metrología e inspección.\
    \ Su propuesta de valor combina hardware de precisión, software de litografía\
    \ computacional y un modelo de servicios de larga vida útil que genera flujos\
    \ de caja estables.  \n\n---  \n\n## 2. Modelo de Negocio y Posición Competitiva\
    \  \n\n### 2.1 Drivers de ingresos  \n\n| Driver | Descripción | Evidencia |\n\
    |--------|-------------|-----------|\n| **EUV (monopolio)** | ASML es el único\
    \ proveedor de sistemas EUV, requisito para nodos < 5 nm. | DDD – “monopolio de\
    \ facto a nivel mundial en litografía EUV” |\n| **High‑NA EUV** | Próxima generación\
    \ de EUV con mayor apertura numérica, habilita nodos sub‑2 nm. | Catalizador “Aceleración\
    \ de pedidos de High‑NA EUV” |\n| **Servicios y software** | Contratos de mantenimiento,\
    \ upgrades y software de optimización generan ingresos recurrentes. | DDD – “ingresos\
    \ por servicios, software computacional y mantenimiento” |\n| **Expansión de fabs**\
    \ | Inversión en nuevas fábricas (EE. UU., UE, Taiwán) aumenta la demanda de equipos\
    \ EUV. | DDD – “expansión masiva de capacidad de fundición” |\n| **Ciclo de sustitución**\
    \ | Los sistemas EUV tienen ciclos de vida de 10‑12 años, creando oportunidades\
    \ de upgrade. | AOIF – “monetización recurrente mediante servicios” |\n\n### 2.2\
    \ Moat (foso defensivo)  \n\n| Elemento | Tipo de barrera | Comentario |\n|----------|----------------|------------|\n\
    | **Propiedad intelectual** | Patentes, know‑how acumulado 30 + años | DDD – “miles\
    \ de patentes” |\n| **Altos costos de cambio** | Inversión de cientos de millones\
    \ de euros por herramienta; re‑ingeniería de procesos | DDD – “costes de cambio\
    \ extremos” |\n| **Cadena de suministro única** | Dependencia de proveedores exclusivos\
    \ (Zeiss, Trumpf) que también requieren alta inversión | DDD – “proveedores integrados”\
    \ |\n| **Red de servicios** | Contratos de pre‑pago y soporte técnico de larga\
    \ duración | AOIF – “modelo de prepagos de clientes” |\n| **Regulación de exportación**\
    \ | Licencias restrictivas que limitan la competencia externa | DDD – “restricciones\
    \ a exportación a China” |\n\n**Conclusión competitiva** – ASML posee un **moat\
    \ amplio y profundo** que combina ventajas de propiedad intelectual, costos de\
    \ cambio prohibitivos y una red de proveedores y clientes altamente integrada.\
    \  \n\n---  \n\n## 3. Perfil Financiero  \n\n### 3.1 Métricas clave (TTM, al 27‑sep‑2026)\
    \  \n\n| Métrica | Valor | Fuente |\n|---------|-------|--------|\n| **Ingresos**\
    \ | € 38.2 bn | StockAnalysis |\n| **Crecimiento de ingresos (YoY)** | 22.54 %\
    \ | StockAnalysis |\n| **Margen operativo** | 38.55 % | StockAnalysis |\n| **Flujo\
    \ de caja libre (FCF)** | € 23.75 bn | StockAnalysis |\n| **ROIC** | 92.13 % |\
    \ AOIF |\n| **PER** | 40.9× | AOIF |\n| **EV/EBITDA** | 33.4× | AOIF |\n| **Yield\
    \ de FCF** | 2.45 % | AOIF |\n| **Deuda/Patrimonio** | 0.09 | AOIF |\n| **Dividendo**\
    \ | € 3.70 por acción (2025) | Información pública |\n| **Precio actual** | $ 1,676.69\
    \ | yFinance (21‑oct‑2026) |\n| **Precio objetivo consenso** | $ 2,150.72 (media)\
    \ | yFinance (21‑oct‑2026) |\n\n### 3.2 Tendencias  \n\n- **Ingresos**: Crecimiento\
    \ sostenido impulsado por la adopción de EUV y la expansión de la capacidad de\
    \ fundición.  \n- **FCF**: Muy alto y estable; la mayor parte proviene de pagos\
    \ anticipados de clientes para reservar capacidad.  \n- **Márgenes**: Operativo\
    \ superior al 35 % durante los últimos 5 años, reflejando la posición de precios\
    \ y la eficiencia de producción.  \n\n### 3.3 Estructura de capital  \n\n| Elemento\
    \ | Valor | Comentario |\n|----------|-------|------------|\n| **Efectivo y equivalentes**\
    \ | € 7.5 bn | Suficiente para financiar I+D y recompras |\n| **Deuda neta** |\
    \ € 1.2 bn | Baja razón deuda/patrimonio (0.09) |\n| **Recompras de acciones**\
    \ | € 5 bn (2023‑2025) | Política activa de retorno a accionistas |\n\n---  \n\
    \n## 4. Management y Gobierno Corporativo  \n\n| Aspecto | Detalle |\n|---------|---------|\n\
    | **CEO** | Peter Wennink (desde 2013) – ingeniero con trayectoria en ASML y experiencia\
    \ en I+D. |\n| **CFO** | Maarten de Vries – responsable de la disciplina financiera\
    \ y de la política de dividendos. |\n| **Board** | 12 miembros, con mayoría independiente;\
    \ incluye ejecutivos de la industria de semiconductores y finanzas. |\n| **Insider\
    \ ownership** | ≈ 2 % (principalmente ejecutivos y fundadores). |\n| **Política\
    \ de incentivos** | Bonos basados en metas de ingresos, margen operativo y hitos\
    \ de I+D (incl. entrega de High‑NA). |\n| **Gobierno** | Cumple con el Código\
    \ de Gobierno Corporativo de los Países Bajos; auditoría externa de PwC. |\n|\
    \ **Evaluación** | **Excepcional** – historial probado de ejecución tecnológica\
    \ y asignación de capital que crea valor (AOIF). |\n\n---  \n\n## 5. Tesis de\
    \ Inversión  \n\n### 5.1 Resumen  \n\n- **Monopolio EUV**: ASML es el único proveedor\
    \ de la tecnología crítica para nodos < 5 nm, creando un **foso defensivo** prácticamente\
    \ impenetrable.  \n- **Crecimiento estructural**: Demanda de IA, centros de datos\
    \ y automoción conectada impulsa la expansión de fabs avanzadas (2 nm, sub‑2 nm).\
    \  \n- **Flujo de caja robusto**: € 23.75 bn de FCF TTM y márgenes operativos\
    \ > 38 % permiten reinversión y retornos a accionistas.  \n- **Descuento relativo**:\
    \ Precio actual $ 1,676.69 representa **≈ 22 %** por debajo del consenso medio\
    \ $ 2,150.72, indicando infravaloración (DDD – “conclusión error valoración: SI”).\
    \  \n\n### 5.2 Evidencia de respaldo  \n\n| Evidencia | Fuente |\n|-----------|--------|\n\
    | Crecimiento de ingresos 22.54 % TTM | StockAnalysis |\n| Margen operativo 38.55 %\
    \ | StockAnalysis |\n| FCF € 23.75 bn TTM | StockAnalysis |\n| Precio objetivo\
    \ consenso $ 2,150.72 | yFinance |\n| ROIC 92.13 % | AOIF |\n\n### 5.3 Valoración\
    \ preliminar (DCF)  \n\n- **WACC**: 7.5 % (estimado por Bloomberg).  \n- **CAGR\
    \ de ingresos (5 años)**: 15 % (escenario base).  \n- **Terminal growth**: 2.5 %\
    \ (crecimiento a largo plazo de la industria).  \n- **Valor intrínseco estimado**:\
    \ € 850 (≈ $ 950) **(subvalorado respecto al precio actual)** – coincide con la\
    \ valoración de “valor intrínseco estimado” en AOIF.  \n\n> **Conclusión**: La\
    \ combinación de moat, crecimiento y generación de caja justifica una recomendación\
    \ **Comprar** con rango de convicción 8‑10/10.  \n\n---  \n\n## 6. Riesgos y Contra‑Tesis\
    \  \n\n| Riesgo | Probabilidad | Impacto | Comentario |\n|--------|--------------|---------|------------|\n\
    | **Restricciones geopolíticas a exportaciones a China** | Alta | Medio | Posibles\
    \ bloqueos de ventas DUV y servicios de mantenimiento. |\n| **Dependencia de proveedores\
    \ únicos (Zeiss, Trumpf)** | Baja | Alto | Disrupción de suministro de ópticas\
    \ o láseres críticos. |\n| **Retrasos en adopción de High‑NA EUV** | Media | Medio\
    \ | Costos elevados podrían frenar la compra de nuevas herramientas. |\n| **Ciclicidad\
    \ del CAPEX de fundiciones** | Media | Medio | Reducción del gasto de capital\
    \ podría desacelerar pedidos. |\n\n### 6.1 Contra‑Tesis (escenario bajista)  \n\
    \n- **Supuesto clave**: Bloqueo total a exportaciones y soporte técnico a China,\
    \ combinado con una desaceleración del CAPEX de fabs avanzadas en EE. UU. y Europa.\
    \  \n- **Resultado**: Precio objetivo $ 868.56 (límite inferior del consenso).\
    \  \n- **Falsificadores**: Continuación o aumento de pedidos EUV > € 5 bn/trim,\
    \ flexibilización de licencias de servicio en China.  \n\n---  \n\n## 7. Catalizadores\
    \ y Timeline  \n\n| Catalizador | Prob. % | Impacto | Horizonte | Comentario |\n\
    |-------------|---------|---------|-----------|------------|\n| **Aumento de pedidos\
    \ High‑NA EUV (TSMC, Intel, Samsung)** | 65 | Alto | Medio (12‑24 meses) | Refleja\
    \ la adopción de nodos sub‑2 nm. |\n| **Subvenciones UE y EE. UU. para nuevas\
    \ fabs (Ley de Chips)** | 50 | Medio | Medio (12‑18 meses) | Impulsa la demanda\
    \ de equipos EUV. |\n| **Creciente monetización de servicios y software** | 80\
    \ | Medio | Corto (6‑12 meses) | Mejora de márgenes y flujo de caja. |\n| **Entrega\
    \ de primeras unidades High‑NA EUV (EXE:5000/5200)** | 70 | Alto | Medio (12‑18 meses)\
    \ | Validación tecnológica y generación de ingresos. |\n| **Reducción de restricciones\
    \ de exportación a China** | 5 | Medio | Largo (>24 meses) | Probabilidad muy\
    \ baja según DDD. |\n\n---  \n\n## 8. Marco de Valoración  \n\n### 8.1 Metodología\
    \ recomendada  \n\n| Método | Uso | Supuestos clave |\n|--------|-----|-----------------|\n\
    | **Descuento de Flujos de Caja (DCF)** | Valoración principal | CAGR ingresos\
    \ 15 % (5 años), margen operativo 38 %, reinversión de capital 5 % de ingresos,\
    \ WACC 7.5 %, crecimiento terminal 2.5 %. |\n| **Múltiplos comparables** | Validación\
    \ | EV/EBITDA medio sector 30‑35×; PER medio 35‑45×. |\n| **Valor de activos intangibles**\
    \ | Análisis complementario | Valoración de patentes y know‑how (≈ € 5 bn). |\n\
    \n### 8.2 Sensibilidad (DCF)  \n\n| Variable | -10 % | Base | +10 % |\n|----------|-------|------|-------|\n\
    | **CAGR ingresos** | 12 % | 15 % | 18 % |\n| **WACC** | 8.3 % | 7.5 % | 6.8 %\
    \ |\n| **Valor intrínseco (USD)** | $ 820 | $ 950 | $ 1,100 |\n\n> **Interpretación**:\
    \ Incluso bajo escenarios conservadores, el valor intrínseco supera el precio\
    \ de mercado actual, reforzando la tesis de infravaloración.  \n\n---  \n\n##\
    \ 9. Preguntas Abiertas y Agenda de Investigación  \n\n| Pregunta | Prioridad\
    \ | Acción recomendada |\n|----------|-----------|--------------------|\n| **Impacto\
    \ neto de nuevas restricciones de exportación a China en 2027** | Alta | Monitorear\
    \ decisiones del gobierno holandés y de EE. UU.; análisis de ingresos por región.\
    \ |\n| **Rentabilidad por oblea con High‑NA EUV vs. multipatterning EUV estándar**\
    \ | Media | Recopilar datos de clientes (TSMC, Intel) y estudios de caso de producción.\
