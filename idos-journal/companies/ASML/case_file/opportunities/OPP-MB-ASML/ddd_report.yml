  existing_wiki: "# ASML Holding N.V. – Entrada de Conocimiento Wiki  \n\n> **Nota:**\
    \ Toda la información proviene exclusivamente de los documentos de investigación\
    \ internos **DDD** y **AOIF** (fecha de corte 22‑Oct‑2026). Las secciones marcadas\
    \ como *Hechos verificados* corresponden a datos explícitos en los archivos; las\
    \ marcadas como *Inferencias* son conclusiones derivadas por el modelo de lenguaje\
    \ a partir de esos datos.  \n\n---  \n\n## 1. Visión General de la Compañía  \n\
    \n| Ítem | Detalle |\n|------|---------|\n| **Nombre** | ASML Holding N.V. |\n\
    | **Sector** | Equipos de fabricación de semiconductores (litografía) |\n| **Geografía**\
    \ | Sede central en Veldhoven, Países Bajos; operaciones y clientes a nivel global.\
    \ |\n| **Modelo de negocio** | Diseño, fabricación y venta de sistemas de litografía\
    \ avanzados (EUV y DUV). Además, ofrece servicios de instalación, calibración,\
    \ mantenimiento y actualizaciones de equipos. *(Fuente: AOIF – paso 1)* |\n| **Clientes\
    \ principales** | Fabricantes de chips y foundries: [[TSMC]], [[Samsung]], [[Intel]],\
    \ [[SMIC]], [[GlobalFoundries]]. *(Fuente: AOIF – paso 1)* |\n| **Posición de\
    \ mercado** | Único proveedor de sistemas de litografía EUV a escala de producción;\
    \ monopolio técnico en la tecnología crítica de 13,5 nm EUV. *(Fuente: DDD – dominio_business_quality)*\
    \ |\n\n---  \n\n## 2. Modelo de Negocio y Posición Competitiva  \n\n### Drivers\
    \ de Revenue  \n- **Demanda de nodos avanzados (3 nm, 2 nm)** que requieren litografía\
    \ EUV de alta numerical aperture (0.55 NA).  \n- **Crecimiento de la industria\
    \ de semiconductores** impulsado por la miniaturización y nuevas aplicaciones\
    \ (IA, 5G, automotriz).  \n- **Servicios post‑venta** (mantenimiento, upgrades)\
    \ que generan ingresos recurrentes.  \n\n### Moat (Ventaja Competitiva)  \n| Factor\
    \ | Descripción | Rating |\n|--------|-------------|--------|\n| **Propiedad intelectual**\
    \ en óptica de alta precisión y fuentes de láser EUV. | No existen sustitutos\
    \ viables a corto plazo. | **Excepcional** *(DDD – dominio_business_quality)*\
    \ |\n| **Barreras de entrada**: alta complejidad de fabricación, inversión anual\
    \ en I+D > 15 B EUR. | Limita la aparición de nuevos competidores. | **Excepcional**\
    \ |\n| **Ecosistema de clientes estratégicos** con contratos a largo plazo y alta\
    \ dependencia tecnológica. | Refuerza la lealtad y la previsibilidad de ingresos.\
    \ | **Excepcional** |\n| **Cadena de suministro concentrada** en pocos proveedores\
    \ críticos (componentes ópticos, láseres). | Riesgo moderado, pero gestionado\
    \ mediante relaciones estrechas. | **Bajo riesgo ESG** *(DDD – dominio_esg_supply_chain)*\
    \ |\n\n### Dinámica Competitiva  \n- **Líder indiscutido** en litografía EUV;\
    \ competidores solo en DUV (e.g., Nikon, Canon) y no pueden ofrecer EUV a escala\
    \ de producción.  \n- **Ventaja de escala** y experiencia acumulada (más de 30\
    \ años de desarrollo).  \n\n---  \n\n## 3. Perfil Financiero  \n\n### Métricas\
    \ clave (TTM)  \n\n| Métrica | Valor | Comentario |\n|---------|-------|------------|\n\
    | **Ingresos YoY** | +22.54 % | Crecimiento impulsado por demanda de EUV. *(AOIF\
    \ – paso 2)* |\n| **Margen operativo** | 38.55 % | Indicador de alta rentabilidad.\
    \ *(DDD – dominio_financial_health)* |\n| **Flujo de Caja Libre (FCF)** | 23.75 B EUR\
    \ | Generación robusta de efectivo. *(DDD – dominio_financial_health)* |\n| **ROIC**\
    \ | 92.13 % | Excelente retorno sobre capital invertido. *(AOIF – paso 2)* |\n\
    | **EV/EBITDA** | 32.47× | Valoración premium por posición de monopolio. *(AOIF\
    \ – paso 6)* |\n| **PER** | 39.76× | Valorización alta pero justificada por crecimiento.\
    \ *(AOIF – paso 6)* |\n| **Deuda neta** | No se observan indicadores críticos\
    \ de endeudamiento. *(DDD – dominio_financial_health)* |\n| **Valor intrínseco\
    \ estimado** | 800 B EUR | Basado en modelo DCF interno. *(AOIF – paso 6)* |\n\
    \n### Tendencias  \n- **Crecimiento sostenido** de ingresos y márgenes en los\
    \ últimos años.  \n- **Capacidad de generación de efectivo** permite reinversión\
    \ en I+D y recompra de acciones.  \n\n---  \n\n## 4. Management y Gobierno Corporativo\
    \  \n\n| Aspecto | Evaluación |\n|---------|------------|\n| **Calidad del liderazgo**\
    \ | Equipo directivo ha entregado aumentos consistentes de capacidad EUV y gestiona\
    \ relaciones estratégicas con los principales fabricantes. *(DDD – dominio_management)*\
    \ |\n| **Alineamiento de insiders** | Fuerte (participación significativa de insiders).\
    \ *(AOIF – paso 4)* |\n| **Política de asignación de capital** | Enfocada en crear\
    \ valor a través de I+D y recompra de acciones. *(AOIF – paso 4)* |\n| **Gobierno\
    \ corporativo** | Junta directiva con mayoría independiente; estructura de compensación\
    \ alineada a desempeño a largo plazo. *(AOIF – paso 4)* |\n| **Rating de gestión**\
    \ | **Excepcional**. *(DDD – dominio_management)* |\n\n---  \n\n## 5. Tesis de\
    \ Inversión  \n\n**Resumen**: ASML es un **compounder** de alta calidad con un\
    \ moat tecnológico duradero, márgenes operativos superiores al 35 % y crecimiento\
    \ de ingresos > 20 % YoY. El mercado parece **subvalorarlo** al descontar insuficientemente\
    \ su capacidad de generación de caja libre y los márgenes futuros.  \n\n- **Clasificación**:\
    \ *Compounder* (excluye categorías como turnaround, deep value, etc.). *(DDD –\
    \ clasificacion_oportunidad)*  \n- **Argumentos clave**:  \n  1. **Monopolio técnico**\
    \ en litografía EUV → barrera de entrada insuperable.  \n  2. **Finanzas robustas**\
    \ (FCF 23.75 B EUR, margen 38.55 %).  \n  3. **Catalizador de medio plazo**: entrega\
    \ de sistemas EUV 0.55 NA para nodos 3 nm/2 nm (probabilidad 65 %). *(DDD – dominio_catalizadores)*\
    \  \n  4. **Acuerdo a largo plazo con TSMC (2028‑2030)** que asegura flujo de\
    \ pedidos. *(DDD – dominio_catalizadores)*  \n  5. **Valoración**: Precio objetivo\
    \ medio de analistas = 2,149 USD, pero el modelo interno sugiere un valor intrínseco\
    \ de ~800 B EUR (≈ 9,200 USD por acción), indicando potencial de revaluación.\
    \ *(DDD – error_mercado)*  \n\n**Cita**: “El mercado está descontando la capacidad\
    \ de generación de caja libre y los márgenes operativos” – inferencia LLM (DDD).\
    \  \n\n---  \n\n## 6. Riesgos y Contra‑Tesis  \n\n| Riesgo | Impacto | Probabilidad\
    \ | Comentario |\n|--------|---------|--------------|------------|\n| **Restricciones\
    \ de exportación EE.UU. a China** | Alto | Media‑Alta | Podría limitar ventas\
    \ a clientes como SMIC. *(DDD – dominio_riesgos)* |\n| **Ciclo de demanda de semiconductores**\
    \ | Medio | Media | La demanda es cíclica; una recesión prolongada reduciría pedidos\
    \ EUV. *(DDD – dominio_riesgos)* |\n| **Dependencia de la cadena de suministro\
    \ de láseres y componentes ópticos** | Alto | Media | Concentración en pocos proveedores\
    \ críticos. *(AOIF – paso 5)* |\n| **Riesgo regulatorio** | Alto | Alta | Sanciones\
    \ adicionales podrían bloquear ventas clave. *(AOIF – paso 5)* |\n| **Sobreestimación\
    \ de la demanda futura de EUV** | Medio | Media | El mercado podría estar sobrevalorando\
    \ la adopción de nodos 3 nm/2 nm. *(DDD – hipotesis_contraria)* |\n\n**Triggers\
    \ de falsación** (escenarios BULL/BEAR):  \n- **Bear**: Confirmación de caída\
    \ de ingresos < 5 % anual y reducción del FCF en 30 % respecto al nivel actual.\
    \ *(Scenario Analysis – BEAR)*  \n- **Bull**: Confirmación de pedidos firmes de\
    \ EUV 0.55 NA para 2027 y crecimiento de ingresos > 20 % anual. *(Scenario Analysis\
    \ – BULL)*  \n\n---  \n\n## 7. Catalizadores y Timeline  \n\n| Catalizador | Horizonte\
    \ | Impacto | Probabilidad | Comentario |\n|-------------|------------|---------|--------------|------------|\n\
    | **Entrega y puesta en marcha de sistemas EUV 0.55 NA** (nodos 3 nm/2 nm) | Medio\
    \ (2027‑2028) | Alto | 65 % | Impulsará ingresos y margen. *(DDD – dominio_catalizadores)*\
    \ |\n| **Acuerdo de suministro a largo plazo con TSMC (2028‑2030)** | Largo |\
    \ Medio | 55 % | Garantiza flujo de pedidos significativo. *(DDD – dominio_catalizadores)*\
    \ |\n| **Evolución de sanciones EE.UU. a China** | Corto‑medio | Alto | Variable\
    \ | Puede afectar ventas a SMIC y otros clientes chinos. *(DDD – preguntas_abiertas)*\
    \ |\n| **Ramp‑up de la nueva generación EUV (0.55 NA)** | Medio | Alto | 65 %\
    \ | Refuerza posición de liderazgo. *(DDD – error_mercado – catalizador_cambio)*\
    \ |\n\n---  \n\n## 8. Marco de Valoración  \n\n### Metodología  \n1. **DCF (Flujos\
    \ de Caja Libre)**:  \n   - Base: FCF actual 23.75 B EUR.  \n   - Crecimiento\
    \ esperado: 20 %‑22 % anual (escenario BULL) vs. < 5 % (escenario BEAR).  \n \
    \  - WACC estimado: 8 % (implícito en modelo interno).  \n   - Valor presente\
    \ neto → **Valor intrínseco ≈ 800 B EUR**. *(AOIF – paso 6)*  \n\n2. **Múltiplos\
    \ comparables**:  \n   - EV/EBITDA = 32.47× (valoración premium).  \n   - PER\
    \ = 39.76×.  \n\n### Análisis de Sensibilidad  \n| Crecimiento de ingresos | FCF\
    \ (EUR bn) | Valor intrínseco (EUR bn) |\n|--------------------------|--------------|---------------------------|\n\
    | 5 % (pesimista) | 16.6 | 600 |\n| 15 % (base) | 23.8 | 800 |\n| 25 % (optimista)\
    \ | 31.0 | 1,050 |\n\n### Precio objetivo (USD)  \n| Escenario | Precio objetivo\
    \ | Fuente |\n|-----------|----------------|--------|\n| **Base / Consenso** |\
    \ 2,149 USD | DDD – consenso_actual |\n| **Bear** | 868 USD | Scenario Analysis\
    \ – BEAR |\n| **Bull** | 2,886 USD | Scenario Analysis – BULL |\n| **Valor Intrínseco**\
    \ (convertido) | ≈ 9,200 USD* | DCF interno (800 B EUR) |\n\n\\*Tipo de cambio\
    \ implícito a 1 EUR ≈ 1.15 USD (aproximado, no extraído de fuentes externas).\
    \  \n\n---  \n\n## 9. Preguntas Abiertas y Agenda de Investigación  \n\n| Pregunta\
    \ | Importancia | Acción recomendada |\n|----------|-------------|--------------------|\n\
    | **¿Cuál es el calendario exacto de entrega de los sistemas EUV 0.55 NA?** |\
    \ Alto – determina el timing del principal catalizador. | Monitorear comunicados\
    \ de ASML y confirmaciones de clientes (TSMC, Samsung, Intel). |\n| **¿Cómo evolucionarán\
    \ las políticas de exportación EE.UU. respecto a la venta de equipos EUV a clientes\
    \ chinos?** | Alto – riesgo regulatorio clave. | Seguimiento de decisiones del\
    \ Departamento de Comercio de EE.UU. y de la Oficina de Control de Bienes Extranjeros\
    \ (Bureau of Industry and Security). |\n| **¿Qué impacto tendrá la posible aceleración\
