  existing_wiki: "# ASML Holding N.V. ([[ASML]])\n\n## 1. Visión General de la Compañía\n\
    **ASML Holding N.V.** es el proveedor líder mundial de sistemas de litografía\
    \ para la industria de semiconductores. La compañía diseña y fabrica los equipos\
    \ necesarios para imprimir patrones nanométricos en obleas de silicio, un proceso\
    \ crítico para la creación de chips.\n\n*   **Sector:** Equipamiento de Semiconductores\
    \ (WFE - Wafer Fabrication Equipment).\n*   **Geografía:** Sede en Veldhoven,\
    \ Países Bajos, con operaciones globales en Taiwán, Corea del Sur, Japón, China\
    \ y Estados Unidos.\n*   **Modelo de Negocio:** Venta de sistemas de capital intensivo\
    \ (Capex) complementada con un flujo de ingresos recurrentes derivado de servicios\
    \ de mantenimiento, actualizaciones de hardware (*upgrades*) y software de control.\n\
    \n## 2. Modelo de Negocio y Posición Competitiva\nASML opera un **monopolio fáctico**\
    \ en la tecnología de Litografía Ultravioleta Extrema (EUV), indispensable para\
    \ la fabricación de nodos de vanguardia (<7nm).\n\n### Drivers de Revenue\n1.\
    \  **Venta de Sistemas:** Ingresos por la entrega de máquinas EUV (estándar y\
    \ High-NA) y DUV (Inmersión y Dry).\n2.  **Gestión de Base Instalada:** Servicios\
    \ de soporte, mantenimiento preventivo y *refurbishment* de sistemas antiguos.\n\
    3.  **Metrología e Inspección:** Venta de sistemas como [[YieldStar]] y soluciones\
    \ de haz de electrones (HMI).\n\n### Análisis de Moat (Foso Defensivo)\nEl moat\
    \ de ASML se califica como **Excepcional/Amplio** basado en:\n*   **Barreras Tecnológicas:**\
    \ Más de dos décadas de I+D y propiedad intelectual exclusiva en fuentes de luz\
    \ láser y óptica de precisión.\n*   **Integración Vertical Crítica:** Dependencia\
    \ simbiótica con proveedores únicos, notablemente **Carl Zeiss SMT** para la óptica,\
    \ creando un cuello de botella técnico insuperable para nuevos entrantes.\n* \
    \  **Costes de Cambio:** Los procesos de fabricación de fundiciones como [[TSMC]],\
    \ [[Intel]] y [[Samsung]] están diseñados específicamente sobre la arquitectura\
    \ de ASML.\n\n## 3. Perfil Financiero\nLa compañía presenta un perfil de *compounder*\
    \ con alta eficiencia en la generación de caja y retornos sobre el capital.\n\n\
    | Métrica (TTM) | Valor | Tendencia / Calidad |\n| :--- | :--- | :--- |\n| **Margen\
    \ Operativo** | 38.55% | Sólido / Elevado |\n| **Crecimiento Revenue** | 22.54%\
    \ | Fuerte |\n| **ROIC** | 92.13% | Excepcional |\n| **FCF (Reportado)** | 23.77B\
    \ (Moneda Prov.) | Masivo |\n| **Conversión FCF** | 85.0% | Alta |\n| **PER**\
    \ | 42.68 | Premium |\n| **EV/EBITDA** | 34.26 | Premium |\n\n## 4. Management\
    \ y Gobierno Corporativo\nEl equipo directivo es evaluado como **Excepcional**.\n\
    *   **Visión Estratégica:** Éxito en la orquestación de la transición hacia EUV,\
    \ logrando que los clientes principales cofinanciaran el desarrollo tecnológico.\n\
    *   **Asignación de Capital:** Priorización disciplinada de la I+D de frontera\
    \ (High-NA y Hyper-NA), complementada con dividendos crecientes y recompras de\
    \ acciones.\n*   **Alineamiento:** Fuerte alineación de los *insiders* con la\
    \ creación de valor a largo plazo.\n\n## 5. Tesis de Inversión\n**Clasificación:**\
    \ Compounder.\n**Tesis:** ASML es la posición nodal indispensable de la infraestructura\
    \ tecnológica global. La valoración actual ($1,676.69 USD) refleja una prima de\
    \ riesgo excesiva por las tensiones geopolíticas con China, ignorando la **inelasticidad\
    \ de la demanda** de EUV impulsada por la carrera de IA y la transición a nodos\
    \ de 2nm y sub-2nm (A16).\n\n**Evidencia de Respaldo:**\n*   **Monopolio EUV:**\
    \ No existen competidores comerciales capaces de producir máquinas EUV.\n*   **Soporte\
    \ de IA:** La demanda de aceleradores para centros de datos requiere chips más\
    \ densos, lo que obliga a la adopción de High-NA.\n*   **Ingresos Recurrentes:**\
    \ El crecimiento del negocio de servicios amortigua la ciclicidad del gasto de\
    \ capital (Capex) de las fundiciones.\n\n## 6. Riesgos y Contra-Tesis\n### Riesgos\
    \ Clave\n*   **Geopolíticos (Probabilidad Alta / Impacto Medio):** Endurecimiento\
    \ de restricciones de exportación de sistemas DUV y repuestos hacia China continental\
    \ por presión de EE. UU.\n*   **Concentración de Suministro (Probabilidad Baja\
    \ / Impacto Alto):** Cualquier disrupción en **Carl Zeiss SMT** paralizaría la\
    \ producción global de litografía avanzada.\n*   **Técnicos (Probabilidad Media\
    \ / Impacto Medio):** Retrasos en el *ramp-up* de la serie EXE (High-NA) o costes\
    \ por oblea prohibitivos que ralenticen la adopción.\n\n### Triggers de Falsación\
    \ (Caso Bajista)\n*   Caída del ratio *book-to-bill* trimestral por debajo de\
    \ 1.0x de forma sostenida.\n*   Aparición de una tecnología de litografía alternativa\
    \ que no dependa de la arquitectura de ASML.\n*   Bloqueo total de servicios de\
    \ mantenimiento en China, eliminando el flujo recurrente en esa región.\n\n##\
    \ 7. Catalizadores y Timeline\n| Catalizador | Impacto | Horizonte | Probabilidad\
    \ |\n| :--- | :--- | :--- | :--- |\n| **Ramp-up High-NA EUV** (Serie EXE:5000/5200)\
    \ | Alto | Medio | 75% |\n| **Expansión Metrología/Software** (YieldStar) | Medio\
    \ | Corto | 70% |\n| **Aceleración de Nodos 2nm** en [[TSMC]] e [[Intel]] | Alto\
    \ | Medio | Alta |\n\n## 8. Marco de Valoración\n**Metodología:** Flujo de Caja\
    \ Descontado (DCF) y Análisis de Múltiplos Comparables.\n\n*   **Valor Intrínseco\
    \ Estimado:** $2,500 USD.\n*   **Precio Objetivo Consenso:** $2,148.07 USD (Rango:\
    \ $868.56 - $2,886.00).\n*   **Supuestos Clave:**\n    *   Mantenimiento de márgenes\
    \ brutos >50%.\n    *   Crecimiento sostenido del Capex en IA y computación avanzada.\n\
    \    *   Absorción de costes de High-NA por parte de los clientes.\n\n**Análisis\
    \ de Escenarios (Horizonte 2027):**\n*   **Bull ($2,886):** Plena monetización\
    \ de High-NA y expansión de márgenes brutos >55%.\n*   **Bear ($868):** Bloqueo\
    \ total de China + recesión global que postergue el Capex de fundiciones.\n\n\
    ## 9. Preguntas Abiertas y Agenda de Investigación\n1.  **Exposición a China:**\
    \ ¿Cuál es el desglose exacto del *backlog* residual hacia clientes chinos tras\
    \ las últimas restricciones?\n2.  **Economía de la Oblea:** ¿Cuál será el coste\
    \ unitario final por oblea procesada en High-NA comparado con el *multi-patterning*\
    \ de EUV estándar (0.33 NA)?\n3.  **Calendario 2027:** ¿Cuál es el cronograma\
    \ definitivo de reconocimiento de ingresos para los sistemas High-NA previstos\
    \ para el ejercicio fiscal 2027?"
