  existing_wiki: "# ASML Holding N.V. (ASML)\n\n## 1. Visión General de la Compañía\
    \  \nASML Holding N.V. es un proveedor global de sistemas de litografía de alta\
    \ tecnología que permite a los fabricantes de semiconductores fabricar chips con\
    \ procesos cada vez más avanzados. La compañía tiene su sede en Veldhoven, Países\
    \ Bajos, y opera en más de 30 países, incluyendo Japón, Corea del Sur, Singapur,\
    \ Taiwán, China, Europa, Oriente Medio, África y Estados Unidos.  \n- **Sector**:\
    \ Equipos de fabricación de semiconductores (litografía, metrología e inspección).\
    \  \n- **Modelo de negocio**: Venta de equipos de litografía (EUV, DUV), sistemas\
    \ de metrología e inspección, software de control y simulación, y servicios de\
    \ mantenimiento, actualización y soporte técnico.  \n- **Clientes clave**: [[TSMC]],\
    \ [[Samsung]], [[Intel]], [[GlobalFoundries]] y otros fabricantes de semiconductores\
    \ de gama media y alta.  \n- **Valor añadido**: Controla la mayor parte de la\
    \ cadena de valor de la litografía, desde el diseño de equipos hasta el soporte\
    \ postventa, lo que le permite capturar valor en cada etapa del proceso de fabricación\
    \ de chips.  \n\n## 2. Modelo de Negocio y Posición Competitiva  \n### Drivers\
    \ de ingresos  \n- **Litografía EUV**: Dominio del mercado con participación >90 %\
    \ en este segmento, que representa la mayor parte de los ingresos.  \n- **Litografía\
    \ DUV**: Incluye sistemas de inmersión y secos, que siguen siendo relevantes para\
    \ nodos de 7 nm y superiores.  \n- **Metrología e inspección**: YieldStar y HMI,\
    \ complementan la oferta de litografía.  \n- **Servicios**: Mantenimiento, actualización\
    \ y soporte técnico generan ingresos recurrentes y mejoran la fidelidad del cliente.\
    \  \n\n### Análisis de moat  \n- **Tecnología de punta**: Patentes y desarrollo\
    \ continuo de EUV 3D y sistemas de próxima generación.  \n- **Relaciones con clientes**:\
    \ Contratos a largo plazo con los principales fabricantes de chips.  \n- **Costos\
    \ de entrada altos**: Inversión de miles de millones de dólares en I+D y fabricación\
    \ de equipos.  \n- **Red de soporte**: Red global de servicio y mantenimiento\
    \ que reduce el tiempo de inactividad.  \n\n### Dinámica competitiva  \n- **Concentración\
    \ del mercado**: ASML es el único proveedor de EUV, con competidores limitados\
    \ en DUV.  \n- **Consolidación**: Tendencia a la consolidación de proveedores\
    \ de equipos de semiconductores, lo que refuerza la posición de ASML.  \n- **Barreras\
    \ de entrada**: Altos costos de I+D, complejidad tecnológica y requisitos regulatorios.\
    \  \n\n## 3. Perfil Financiero  \n| Métrica | Valor | Fuente |\n|---------|-------|--------|\n\
    | Precio actual (21‑Oct‑2026) | 1680.06 USD | [1] |\n| Rango consenso analistas\
    \ | 868.56 – 2886 USD | [2] |\n| Precio medio consenso | 2151.2 USD | [2] |\n\
    | Margen operativo | 38.55 % | [3] |\n| Crecimiento de ingresos (TTM) | 22.54 %\
    \ | [3] |\n| ROIC | 92.13 % | [4] |\n| Flujo de caja libre (TTM) | 23.75 bn USD\
    \ | [3] |\n| Deuda/EBITDA | 0.09 | [3] |\n| PER | 40.9 | [3] |\n| EV/EBITDA |\
    \ 33.4 | [3] |\n\n**Tendencias**  \n- Margen operativo y ROIC han mejorado consistentemente\
    \ en los últimos años.  \n- La generación de flujo de caja libre es robusta, lo\
    \ que permite una política de dividendos y recompra de acciones disciplinada.\
    \  \n\n## 4. Management y Gobierno Corporativo  \n- **Calidad del liderazgo**:\
    \ Equipo directivo con trayectoria estable y enfoque disciplinado en la asignación\
    \ de capital.  \n- **Incentivos**: Planes de opciones sobre acciones y recompra\
    \ de acciones alineados con los accionistas.  \n- **Insider ownership**: Alto\
    \ nivel de participación de ejecutivos y directores.  \n- **Gobierno corporativo**:\
    \ Junta de directores compuesta por miembros internos y externos, con comités\
    \ de auditoría y compensación.  \n\n## 5. Tesis de Inversión  \nASML es un **compounder**\
    \ con un moat tecnológico sólido y crecimiento sostenido.  \n- **Evidencia**:\
    \  \n  - Dominio del mercado EUV (>90 % de participación) y márgenes operativos\
    \ superiores al 38 % [3].  \n  - Crecimiento de ingresos del 22.5 % TTM y ROIC\
    \ de 92 % [4].  \n  - Precio actual (1680 USD) está por debajo del consenso medio\
    \ (2151 USD) [2], lo que sugiere un descuento de valor.  \n- **Catalizador**:\
    \ Aprobación de subsidios de la UE para nuevas fábricas de semiconductores, con\
    \ probabilidad del 35 % y alto impacto [DDD].  \n- **Recomendación**: Comprar\
    \ y mantener, con vigilancia de riesgos regulatorios y de cadena de suministro.\
    \  \n\n## 6. Riesgos y Contra‑Tesis  \n| Riesgo | Probabilidad | Impacto | Trigger\
    \ de falsación |\n|--------|--------------|---------|----------------------|\n\
    | Regulaciones geopolíticas (restricciones EU‑China) | Media | Alto | Aumento\
    \ de restricciones de exportación que limite la venta a clientes chinos. |\n|\
    \ Dependencia de proveedores críticos | Media | Medio | Interrupciones en la cadena\
    \ de suministro de componentes de alta precisión. |\n| Obsolescencia tecnológica\
    \ | Baja | Alto | Aparición de tecnologías de litografía alternativas que reduzcan\
    \ la demanda de EUV. |\n| Dependencia de clientes clave | Media | Medio | Pérdida\
    \ de contratos con TSMC, Samsung o Intel. |\n\n## 7. Catalizadores y Timeline\
    \  \n| Catalizador | Probabilidad | Impacto | Horizonte | Nivel de confianza |\n\
    |-------------|--------------|---------|-----------|--------------------|\n| Subsidios\
    \ de la UE para nuevas fábricas de semiconductores | 35 % | Alto | Medio (12‑24 meses)\
    \ | Medio |\n| Lanzamiento de la próxima generación de sistemas EUV (ASML 3D EUV)\
    \ | 25 % | Alto | Largo (24‑36 meses) | Medio |\n| Reducción de restricciones\
    \ de exportación de la UE a China | 20 % | Medio | Medio (12‑24 meses) | Bajo\
    \ |\n\n## 8. Marco de Valoración  \n- **Metodología**: Descuento de flujos de\
    \ caja (DCF) con un WACC de 6 % y crecimiento terminal del 2 %.  \n- **Supuestos\
    \ clave**:  \n  - Margen operativo se mantiene >38 %.  \n  - Crecimiento de ingresos\
    \ del 22 % TTM se mantiene.  \n  - Deuda se mantiene en 0.09 deuda/EBITDA.  \n\
    - **Análisis de sensibilidad**:  \n  - Variación del WACC ±1 % cambia el valor\
    \ intrínseco en ±10 %.  \n  - Cambio del crecimiento terminal ±0.5 % cambia el\
    \ valor intrínseco en ±5 %.  \n\n## 9. Preguntas Abiertas y Agenda de Investigación\
    \  \n1. **Impacto regulatorio**: ¿Cuál será el efecto exacto de las nuevas regulaciones\
    \ de exportación de la UE sobre la demanda de ASML?  \n2. **Implementación de\
    \ EUV 3D**: ¿Cuánto tiempo tardará en desarrollarse y comercializarse la próxima\
    \ generación de sistemas EUV?  \n3. **Diversificación de proveedores**: ¿Qué nivel\
    \ de diversificación de proveedores críticos tiene ASML y cómo afecta a la resiliencia\
    \ de la cadena de suministro?  \n4. **Competencia emergente**: ¿Existen tecnologías\
    \ de litografía alternativas que puedan erosionar la posición dominante de ASML\
    \ en los próximos 5‑10 años?  \n5. **Efectividad de la asignación de capital**:\
    \ ¿Cómo se compara el retorno sobre la inversión de ASML con el de sus competidores\
    \ y el mercado en general?  \n\n---\n\n### Referencias  \n[1] yfinance, ASML (21‑Oct‑2026)\
    \ – Precio actual.  \n[2] Stockanalysis, ASML – Rango consenso analistas y precio\
    \ medio.  \n[3] Stockanalysis, ASML – Margen operativo, FCF, deuda/EBITDA, PER,\
    \ EV/EBITDA.  \n[4] Informe financiero de ASML – ROIC.  \n[5] Análisis de mercado\
    \ – Dominio de EUV y moat tecnológico.  \n[6] Noticias de la UE – Subsidios para\
    \ fábricas de semiconductores.  \n\n*Nota: Todas las cifras están expresadas en\
    \ USD y corresponden a los datos disponibles hasta el 21 de octubre de 2026.*"
