clasificacion_oportunidad:
  categoria: compounder
  categorias_descartadas: Se descartó 'hype' porque ASML genera flujo de caja libre
    masivo comprobado (23.75B EUR TTM en stockanalysis) y alta rentabilidad operativa.
    Se descartó 'deep_value' o 'turnaround' porque la compañía no sufre deterioro
    operativo ni cotiza con descuento de activos. Se descartó 'ciclica' pura porque,
    aunque el gasto de capital de las fundiciones es cíclico, su posicionamiento de
    proveedor único y los ingresos recurrentes por servicios y actualizaciones dotan
    a la empresa de características de compounder estructural.
  justificacion: ASML posee un monopolio de facto a nivel mundial en litografía ultravioleta
    extrema (EUV), tecnología imprescindible para la fabricación de semiconductores
    de vanguardia (<5nm). Su modelo de negocio genera altos retornos sobre el capital,
    respaldado por décadas de I+D acumulada, propiedad intelectual exclusiva y una
    red de proveedores integrados (como Zeiss). Muestra un crecimiento estructural
    de ingresos (22.54% TTM reportado en stockanalysis) y un margen operativo del
    38.55%.
