resumen_ejecutivo: ASML es el proveedor dominante de equipos de litografía EUV, con
  una posición de monopolio de facto y barreras tecnológicas que limitan la competencia.
  Genera márgenes operativos superiores al 35% y flujo de caja libre de 23.8B USD,
  respaldado por un crecimiento de ingresos del 22.5% TTM. El precio de la acción
  (1669 USD) está significativamente por debajo del consenso medio (2150 USD), indicando
  un posible error de mercado. Los principales riesgos son geopolíticos y de ejecución
  tecnológica, mientras que los catalizadores clave incluyen la expansión de la capacidad
  EUV y la posible apertura del mercado chino. La valoración actual parece infravalorada,
  ofreciendo una oportunidad de inversión de tipo compounder.
