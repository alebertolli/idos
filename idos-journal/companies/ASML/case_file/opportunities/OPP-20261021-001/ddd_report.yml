dominio_business_quality:
  analisis: Monopolio comercial absoluto en litografía EUV y cuota de mercado dominante
    en DUV. Barreras de entrada casi infranqueables creadas por décadas de inversión
    en I+D, miles de patentes y una cadena de suministro simbiótica altamente especializada
    (e.g., espejos de Carl Zeiss, láseres de Trumpf). Costes de cambio extremos para
    los clientes (TSMC, Samsung, Intel), cuyos procesos de fabricación están completamente
    diseñados alrededor de las herramientas y software de ASML.
  rating: excepcional
