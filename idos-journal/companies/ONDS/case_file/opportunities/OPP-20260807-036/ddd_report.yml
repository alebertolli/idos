  business_model: Ondas Inc. provides private wireless, drone, and automated data
    solutions in the United States and internationally. It operates through the Ondas
    Networks and Ondas Autonomous Systems segments. The company offers Counter-UAS
    (CUAS) and site protection systems, including iron drone raider, a fully autonomous
    interceptor drone system for neutralizing small hostile drones; sentrycs CoRF,
    Cyber/RF-based CUAS platform for detection, identification, tracking, and mitigation
    of unauthorized drones; optimus system, fully autonomous drone platform for continuous
    security, surveillance, and mission-critical data collection; 4M defense, supporting
    missions related to demining and clearing land of unexploded ordnance; roboteam,
    UGVs and tactical ground robotics; apeiro motion, autonomy and mobility software
    for robotic platforms, enhancing navigation and operational effectiveness; and
    loitering munition systems, is a one way drone for a variety of missions including
    ISR defense and strike. It also offers FullMAX Software-Defined Radio Platform,
    a patented SDR platform for secure, private, wide-area broadband networks, enabling
    mission-critical communications; software and hardware maintenance agreements,
    extended software and hardware maintenance contracts, including ongoing support,
    security upgrades, and feature enhancements; licensing/royalties, licensing of
    FullMAX software and technology for integration into partner hardware and software
    platforms; and ancillary services, wireless network design, systems engineering,
    radio frequency planning, software configuration, product training, installation,
    onsite support, and engineering/product development. It serves rail, electric
    utilities, oil and gas, public safety, government, and other industrial applications.
    The company was formerly known as Ondas Holdings Inc. and changed its name to
    Ondas Inc. in January 2026. Ondas Inc. was incorporated in 2014 and is headquartered
    in West Palm Beach, Florida.
