prompt_inputs:
  business_model: Grupo Aeroportuario del Pacífico, S.A.B. de C.V., together with
    its subsidiaries, develops, operates, and manages airports in Mexico and Jamaica.
    The company operates twelve international airports in the Pacific and Central
    region of Mexico; and two international airports in Jamaica. It also offers aeronautical
    services, such as passenger, aircraft landing, parking charges, leasing of space
    to these airlines, airport security and passenger walkway, and airport bus; complementary
    services, including baggage handling, catering, aircraft maintenance and repair,
    and fuel; cargo handling; and ground transportation services. In addition, the
    company provides non-aeronautical services, such as redesigning and modernizing
    terminal spaces and developing new commercial projects; telephone and internet
    services; and ground handling services under the brand Primesky, as well as advertising
    services. Further, it engages in commercial activities comprising leasing space
    in terminals to airlines and other service providers; retail stores, such as souvenir
    and gift shops, fashion and footwear stores, pharmacies, jewelry, electronics,
    cosmetics, and others; and various food and beverage services, as well as leasing
    space and designated parking areas to car rental service companies, including
    service counters, reservation booths, and vehicle parking facilities; and leasing
    space to timeshare developers, financial service providers, communications, and
    to operators of duty-free stores. Additionally, the company operates parking facilities;
    VIP lounges; convenience stores; and vending machines. The company was incorporated
    in 1998 and is headquartered in Guadalajara, Mexico.
