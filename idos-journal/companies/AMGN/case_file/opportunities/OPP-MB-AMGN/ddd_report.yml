    ## 4. Management y Gobierno Corporativo


    AOIF asigna provisionalmente una evaluación de calidad “buena”, alineamiento de
    insiders “moderado” y asignación de capital “neutral”. Estas valoraciones no vienen
    acompañadas de métricas de desempeño del liderazgo, datos de remuneración, participación
    accionaria de insiders, composición del consejo o evaluación de adquisiciones.


    Por tanto, no es posible confirmar la calidad del liderazgo ni evaluar con fundamento
    la alineación entre dirección y accionistas. También falta información para analizar
    la independencia, experiencia y composición del board.


    **Agenda de verificación:** revisar remuneración e incentivos, tenencia accionaria
    de insiders, historial de asignación de capital, resultados de adquisiciones y
    composición del consejo.


    ## 5. Tesis de Inversión


    ### Caso alcista — hipótesis por investigar


    - Amgen cuenta con una cartera de terapias y una cadena integrada que abarca I+D,
    fabricación y comercialización.

    - Stock Analysis reporta ingresos TTM de USD 38.903 mil millones al 2026-09-30,
    frente a USD 36.751 mil millones en FY 2025. Esta observación es compatible con
    crecimiento, pero la diferencia entre TTM y año fiscal no identifica cuánto corresponde
    a crecimiento orgánico, adquisiciones, precios o mezcla.

    - El margen bruto reportado fue de 72,47% en TTM al 2026-09-30, frente a 70,78%
    en FY 2025. No hay descomposición que permita atribuir la diferencia a eficiencias,
    precios o mezcla.

    - **Hipótesis:** la propiedad intelectual, el conocimiento científico y la experiencia
    en fabricación de biológicos podrían respaldar la posición competitiva. Los inputs
    no incluyen evidencia suficiente para medir la durabilidad de esa posible ventaja.


    ### Evaluación actual


    La tesis a investigar es si la cartera de terapias puede sostener crecimiento
    y generación de caja suficientes para respaldar la valoración, pese al apalancamiento
    reportado. La evidencia recibida no valida una oportunidad de crecimiento compuesto
    ni una infravaloración. El impulso bursátil y las cifras financieras agregadas
    no sustituyen el análisis de productos, retornos sobre capital, exclusividades,
    pipeline y valoración intrínseca.


    ## 6. Riesgos y Contra-Tesis


    - **Deuda y flexibilidad financiera:** Stock Analysis reporta deuda total de USD
    54.007 mil millones y efectivo neto de –USD 40.817 mil millones al 2026-09-30.

    - **Presión sobre el flujo de caja:** el FCF reportado cayó 16,97% en TTM al 2026-09-30
    frente al período comparativo del proveedor. No se aporta desglose para explicar
    el descenso.

    - **Pérdida de exclusividad:** AOIF identifica como riesgo de impacto alto y probabilidad
    alta la pérdida de exclusividad de productos relevantes, con posible entrada de
    biosimilares o genéricos.

    - **Riesgo clínico, regulatorio y comercial:** resultados inferiores a lo esperado
    para productos nuevos o en desarrollo podrían limitar el crecimiento. AOIF lo
    califica como riesgo de impacto alto y probabilidad media.

    - **Concentración y erosión de productos:** no se dispone de datos de ventas por
    producto, cuotas de mercado, calendarios de exclusividad o sensibilidad a biosimilares;
    por ello, no es posible cuantificar este riesgo.

    - **Valoración:** AOIF informa cifras de PER de 25,46 y EV/EBITDA de 15,78, pero
    no especifica fecha ni definiciones. DDD indica que no hay valoración intrínseca
    reproducible ni evidencia suficiente para concluir que el mercado esté valorando
    mal a Amgen.

    - **Dilución:** no evaluable con la información disponible; falta una serie comparable
    de acciones diluidas.


    ### Falsadores de la tesis


    1. Una caída sostenida de ingresos o FCF demostrada mediante períodos comparables
    debilitaría la tesis de generación de caja.

    2. Evidencia verificable de pérdida de exclusividad, erosión de ventas o deterioro
    competitivo en productos principales debilitaría la tesis.

    3. La ausencia de crecimiento rentable o de retornos sobre capital sostenibles,
    una vez verificados con datos comparables, reduciría el respaldo a una tesis de
    crecimiento compuesto.


    ## 7. Catalizadores y Timeline


    No se proporcionan hitos clínicos, regulatorios o comerciales fechados que permitan
    identificar catalizadores específicos o asignarles un impacto estimado.


    | Evento o señal | Fecha esperada | Impacto potencial | Estado de evidencia |

    |---|---|---|---|

    | Crecimiento de ingresos reportado por Stock Analysis | TTM terminado el 2026-09-30
    | Puede motivar una revisión de expectativas si se confirma su composición y sostenibilidad
    | Dato agregado; no identifica motores |

    | Cambio en margen bruto reportado | TTM terminado el 2026-09-30 | Podría ser
    relevante para la rentabilidad si se confirma la causa y persistencia | Sin desglose
    de precio, volumen o mezcla |

    | Hitos de pipeline, autorizaciones o expansión de indicaciones | No disponible
    | No estimable | No se aportan productos, fechas ni hitos |

    | Exclusividades y entrada de biosimilares o genéricos | No disponible | Potencialmente
    relevante para ventas y márgenes | No se proporcionan calendarios ni estimaciones
    |


    ## 8. Marco de Valoración


    La valoración intrínseca no es estimable responsablemente con el material disponible.
    Faltan flujo de caja libre normalizado, deuda neta validada bajo una metodología
    explícita, crecimiento por producto, horizontes de exclusividad, inversión en
    I+D, supuestos de descuento y datos de capitalización comparables a una fecha
    concreta.


    **Metodología a investigar:**


    - Un modelo de flujo de caja descontado requiere FCF normalizado, crecimiento
    por producto y geografía, márgenes, inversión en I+D, efectos de exclusividad
    y tasa de descuento.

    - Un análisis por producto o área terapéutica permitiría modelar ventas, erosión
    por competencia y contribución del pipeline, pero esos datos no están incluidos.

    - Los múltiplos pueden servir como contraste, siempre que se validen fecha, definiciones
    y comparables. Las cifras de PER 25,46 y EV/EBITDA 15,78 proporcionadas por AOIF
    no son suficientes para concluir si AMGN está cara o barata.

    - El FCF yield reportado por AOIF como cero no es interpretable: el propio input
    señala que no dispone de precio de mercado y FCF atribuible a un período verificable.


    DDD registra un precio de USD 438,84 al 2026-11-20. El consenso de precio objetivo
    reportado al 2026-11-21 tiene media y mediana de USD 438,90, con un rango de USD
    230 a USD 550. La dispersión refleja opiniones distintas, no prueba qué valoración
    es correcta. DDD señala que no dispone de una valoración intrínseca reproducible
    ni valida que el mercado esté valorando mal a Amgen.


    **Sensibilidad:** no puede calcularse de forma responsable sin supuestos verificables
    para crecimiento, margen, FCF, duración de exclusividades y tasa de descuento.
    AOIF califica el margen de seguridad como “insuficiente”, pero la base de esa
    estimación no está documentada en el material recibido.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué productos, mercados y geografías explican el crecimiento reciente? ¿Cuál
    es la contribución de precio, volumen, mezcla y adquisiciones?

    2. ¿Cuál es el mercado direccionable y la penetración por producto e indicación?

    3. ¿Qué productos concentran ingresos y beneficios, y qué calendarios de exclusividad
    enfrentan?

    4. ¿Qué biosimilares o genéricos pueden competir con productos relevantes y cuándo
    podrían hacerlo?

    5. ¿Qué programas del pipeline tienen hitos clínicos o regulatorios próximos,
    y cuáles son sus probabilidades de éxito y mercados potenciales?

    6. ¿Cómo evolucionan ventas netas, precios, cuotas de mercado y márgenes de los
    principales productos?

    7. ¿Qué explica el descenso reportado del FCF y cuál es la generación de caja
    normalizada después de I+D y gastos de capital?

    8. ¿Cuál es la deuda neta según una definición reconciliable con los estados financieros
    y cómo se distribuyen vencimientos y costes de financiación?

    9. ¿Son reproducibles las cifras de ROIC, margen operativo, crecimiento de ingresos,
    PER y EV/EBITDA de AOIF? ¿Qué períodos y metodologías usan?

    10. ¿Cómo se comparan crecimiento, rentabilidad, exposición a exclusividades y
    valoración con compañías relevantes del sector, incluidas [[ABBV]], [[BIIB]],
    [[BMY]], [[GILD]], [[LLY]] y [[VRTX]]?

    11. ¿Qué muestran la remuneración, la participación accionaria de insiders, el
    historial de asignación de capital y la composición del consejo?

    12. ¿Qué supuestos explican el rango de objetivos de USD 230 a USD 550 y qué escenarios
    operativos los sostienen?


    **Estado de decisión:** investigación pendiente; evidencia insuficiente para validar
    una oportunidad de crecimiento compuesto o una tesis de infravaloración.


