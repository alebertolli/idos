  existing_wiki: '## 1. Visión General de la Compañía


    Amgen Inc. ([[AMGN]]) es una compañía biofarmacéutica integrada que investiga,
    desarrolla, fabrica y comercializa medicamentos biológicos y otros tratamientos
    especializados. Su cadena de valor comprende investigación y desarrollo, ensayos
    clínicos y autorizaciones regulatorias, fabricación y comercialización.


    Opera en el sector biofarmacéutico. El material disponible la describe como proveedora
    mundial de terapias humanas, pero no ofrece un desglose de ingresos por geografía.
    Entre los productos mencionados en los inputs figuran Enbrel, Otezla, Prolia,
    XGEVA y Repatha; no se proporcionan ventas ni contribución individual de estos
    productos.


    Las compañías relacionadas del sector incluyen [[ABBV]], [[ABT]], [[AZN]], [[BIIB]],
    [[BMY]], [[GILD]], [[GSK]], [[JNJ]], [[LLY]], [[MRK]], [[NVS]] y [[VRTX]]. La
    inclusión en esta lista indica relación sectorial, no una comparación de desempeño
    o competencia directa producto por producto.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Modelo y drivers de ingresos


    Los ingresos dependen de la demanda, el precio neto y la mezcla de productos,
    además de lanzamientos y expansión de indicaciones. La comercialización se dirige,
    entre otros, a profesionales médicos, clínicas y hospitales.


    La evidencia disponible no identifica qué productos, mercados o geografías explican
    el crecimiento reciente, ni permite estimar la penetración o el mercado direccionable
    de cada terapia.


    ### Ventaja competitiva y competencia


    **Inferencia pendiente de validar:** el modelo podría beneficiarse de propiedad
    intelectual, capacidades científicas, experiencia en desarrollo y fabricación
    de biológicos, y relaciones con profesionales de la salud. Estos factores pueden
    ser relevantes en una industria con ciclos largos de I+D y regulación estricta,
    pero el material no demuestra que constituyan una ventaja competitiva sostenible
    específica de Amgen.


    AOIF califica provisionalmente el moat como “amplio” y la posición competitiva
    como “líder”. DDD, en cambio, concluye que la calidad del negocio no es concluyente
    por falta de evidencia verificable. Para esta wiki, la calificación de AOIF se
    registra como hipótesis, no como hecho confirmado.


    La competencia debe analizarse por área terapéutica y producto. Entre las compañías
    del mismo sector que pueden ser relevantes para investigaciones comparativas están
    [[ABBV]], [[BIIB]], [[BMY]], [[GILD]], [[LLY]] y [[VRTX]], sin que los datos disponibles
    permitan atribuirles competencia directa en productos específicos.


    ## 3. Perfil Financiero


