    | Ingresos TTM | USD 38.903 millones | Al 30-09-2026 | StockAnalysis, según DDD;
    sin URL de respaldo en el paquete |

    | Margen bruto TTM | 72,47% | Al 30-09-2026 | StockAnalysis, según DDD; sin URL
    de respaldo en el paquete |

    | Flujo de caja libre (FCF) TTM | USD 9.581 millones | Al 30-09-2026 | StockAnalysis,
    según DDD; faltan componentes y serie comparable |

    | Variación del FCF TTM | −16,97% | Al 30-09-2026 | StockAnalysis, según DDD;
