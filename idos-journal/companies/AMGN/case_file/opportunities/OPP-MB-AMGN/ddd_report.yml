    y generación de caja |

    | Evolución de productos y contribución de lanzamientos | Sin fechas ni hitos
    aportados | El paquete no incluye desglose por producto ni calendario de lanzamientos
    | Aclarar la capacidad de compensar la erosión de productos maduros |

    | Objetivos de analistas | Observación al 19-11-2026 | Rango de USD 230–542; media
    de USD 435,77 | Referencia para seguir cambios de expectativas, no catalizador
    operativo ni valoración intrínseca |


    Al 19-11-2026, el precio observado fue USD 439,33 y la mediana de objetivos coincidía
    con la media reportada de USD 435,77. El paquete no incluye fechas de revisión
    ni supuestos operativos de los analistas; la dispersión de objetivos no permite
    determinar qué escenario es más probable.


    ## 8. Marco de Valoración


    Una valoración apropiada debería combinar un análisis de flujo de caja descontado
    con escenarios por producto y una comparación con compañías biofarmacéuticas relevantes,
    incluidas [[ABBV]] y [[ABT]] cuando existan datos comparables y verificables.
    El paquete no proporciona información suficiente para construir ninguna de esas
    valoraciones de forma defendible.


    ### Métricas y datos suministrados, con limitaciones


    | Indicador | Valor | Limitación |

    |---|---:|---|

    | PER | 25,48 | AOIF; sin fecha de mercado ni fuente verificable |

    | EV/EBITDA | 15,93 | AOIF; sin fecha de mercado ni fuente verificable |

    | FCF yield | 0 | AOIF; método de cálculo y datos de entrada no especificados
    |

    | Rango de objetivos de analistas | USD 230–542 | Observado al 19-11-2026; no
    sustituye una valoración intrínseca |

    | Objetivo medio de analistas | USD 435,77 | Observado al 19-11-2026; supuestos
    individuales no disponibles |

    | Precio observado | USD 439,33 | Observado al 19-11-2026 |


    El AOIF califica el margen de seguridad como «insuficiente». Dado que no se aportan
    precio y acciones diluidas con fuente verificable, deuda neta validada, proyecciones
    operativas ni supuestos de descuento, esa conclusión no puede recalcularse a partir
    del paquete. El precio observado ligeramente superior al objetivo medio tampoco
    demuestra por sí mismo sobrevaloración o infravaloración.


    ### Supuestos y sensibilidades que faltan


    Para una valoración defendible se requieren, como mínimo:


    - Proyecciones de ventas, márgenes y vida comercial por producto.

    - Supuestos de erosión por biosimilares y pérdida de exclusividad.

    - Inversión en I+D, capex y conversión a FCF.

    - Deuda neta, calendario de vencimientos y costo de financiación.

    - Tasa de descuento, crecimiento terminal y análisis de sensibilidad a cambios
    en esos parámetros.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué productos y candidatos explican el crecimiento? ¿Cuál es su mercado direccionable,
    penetración y calendario de hitos?

    2. ¿Qué parte de los ingresos depende de productos maduros expuestos a pérdida
    de exclusividad o competencia de biosimilares?

    3. ¿Cómo se desglosan ventas, crecimiento y márgenes por producto, área terapéutica
    y geografía?

    4. ¿Cuál es la causa de la caída reportada del FCF TTM de 16,97%, y cuánto corresponde
    a factores temporales frente a cambios estructurales?

    5. ¿Cuáles son los retornos incrementales de I+D, adquisiciones y capex?

    6. ¿Cómo se asigna el capital entre reducción de deuda, dividendos, recompras
    y reinversión?

    7. ¿Cuál es el calendario de vencimientos de deuda, su costo y la cobertura de
    intereses?

    8. ¿Se pueden obtener series históricas verificables de ingresos, márgenes, FCF,
    acciones diluidas y deuda neta?

    9. ¿Qué datos respaldan la remuneración, la propiedad de insiders, el alineamiento
    directivo y las calificaciones de gobierno corporativo?

    10. ¿Qué supuestos operativos explican la dispersión entre objetivos de analistas
    de USD 230 y USD 542 al 19-11-2026?

    11. ¿Qué fuentes primarias y autorizadas respaldan las métricas financieras, los
    múltiplos y los objetivos de analistas citados?


    **Estado de investigación:** pendiente de evidencia fundamental y de valoración
    verificable. Las cifras y calificaciones no acompañadas de enlaces o series comparables
    deben considerarse provisionales.


