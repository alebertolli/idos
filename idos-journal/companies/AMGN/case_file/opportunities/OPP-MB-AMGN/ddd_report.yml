  existing_wiki: '## 1. Visión General de la Compañía


    Amgen Inc. es una compañía biofarmacéutica integrada que descubre, desarrolla,
    fabrica y comercializa medicamentos para uso humano. Su cadena de valor abarca
    investigación y desarrollo, ensayos clínicos, obtención de autorizaciones regulatorias,
    fabricación biotecnológica y comercialización.


    Opera en la industria biofarmacéutica, caracterizada por largos ciclos de desarrollo,
    regulación estricta y altos costos y riesgos de I+D. El material de investigación
    describe un negocio de alcance mundial, aunque no aporta un desglose geográfico
    de ventas. Sus ingresos proceden principalmente de la venta de productos. Entre
    los productos mencionados en la información disponible figuran Enbrel y Otezla.


    Compañías del mismo sector indicadas en la wiki existente: [[ABBV]] y [[ABT]].
    [[ABBV]] también aparece duplicada en el listado original.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    - Demanda, precio y acceso a reembolso de los productos comercializados.

    - Crecimiento de productos y áreas terapéuticas recientes.

    - Aprobación y comercialización de nuevos medicamentos o indicaciones, aunque
    no se proporcionan hitos concretos.


    ### Ventajas competitivas y dinámica


    El análisis recibido atribuye a Amgen posibles ventajas derivadas de la propiedad
    intelectual, el conocimiento científico y regulatorio, la escala de fabricación
    biológica, las relaciones con proveedores sanitarios y la amplitud de su cartera.
    El AOIF califica el moat como «amplio» y la posición competitiva como «líder»,
    pero esos juicios no vienen acompañados de métricas comparativas ni evidencia
    independiente en el paquete de investigación.


    La industria presenta competencia en eficacia, seguridad, precio y acceso. La
    pérdida de exclusividad y la competencia de biosimilares pueden erosionar las
    ventas de productos maduros. La sostenibilidad de la posición competitiva depende,
    entre otros factores, de que la cartera y las nuevas indicaciones compensen la
    presión sobre productos establecidos.


    ## 3. Perfil Financiero


    Las cifras siguientes se transcriben de los resultados de investigación. El paquete
    no incluye enlaces autorizados para validar las métricas atribuidas a StockAnalysis;
    deben tratarse como datos reportados, no como ratios verificados independientemente.


