    **Fuentes:** Stock Analysis, [estadísticas de AMGN](https://stockanalysis.com/stocks/AMGN/statistics/),
    con los períodos indicados en el paquete de investigación. Las cifras de crecimiento
    de ingresos, margen operativo y ROIC proceden de AOIF, que no proporciona períodos,
    metodología ni referencias verificables en el material recibido.


    **Lectura:** los datos agregados son compatibles con una operación rentable, pero
    no bastan para establecer la calidad o sostenibilidad de la generación de caja.
    DDD considera no disponibles los cálculos de CAGR de ingresos a tres años y crecimiento
