clasificacion_oportunidad:
  categoria: quality_at_fair_price
  categorias_descartadas: Descartada 'Compounder castigado' porque la acción no sufre
    un descuento severo e injustificado por pánico de mercado. Descartada 'Value Trap'
    porque el pipeline en oncología, enfermedades raras y obesidad (MariTide), junto
    con los biosimilares, compensa el cliffs de patentes sin destruir valor a largo
    plazo. Descartada 'Hype' porque aunque MariTide genera entusiasmo, los fundamentos
    y la generación de caja actual soportan la valoración.
  justificacion: Amgen es un gigante biotecnológico maduro con flujo de caja predecible,
    alta rentabilidad sobre el capital (ROIC 19.1%) y márgenes operativos elevados
    (32.6%). Cotiza a valoraciones razonables (~13-15x P/E forward), reflejando un
    equilibrio entre la madurez/vencimiento de patentes de medicamentos clave (Enbrel,
    Prolia) y el crecimiento aportado por la adquisición de Horizon Therapeutics y
    la cartera de obesidad (MariTide).
dominio_business_quality:
  analisis: Amgen posee un moat sustancial basado en propiedad intelectual, economías
    de escala en fabricación de biológicos complejos y relaciones arraigadas con redes
    de distribución médica mundial. Su portafolio diversificado engloba oncología,
    inflamación, salud ósea, cardio-metabólico y enfermedades raras (Tepezza, Krystexxa).
    Aunque la pérdida de patentes afectará a Enbrel y Prolia en 2025-2026, la capacidad
    técnica de fabricación de biosimilares a gran escala actúa como un foso defensivo
    clave frente a competidores genéricos sin infraestructura biológica.
  rating: buena
