prompt_inputs:
  business_model: Amgen Inc. discovers, develops, manufactures, and delivers human
    therapeutics worldwide. The company's principal products include Enbrel for the
    treatment of rheumatoid arthritis, plaque psoriasis, and psoriatic arthritis;
    Otezla for the treatment of adult patients with plaque psoriasis, psoriatic arthritis,
    and oral ulcers associated with Behçet's disease; Prolia to treat postmenopausal
    women with osteoporosis; XGEVA for skeletal-related events prevention; Repatha,
    which reduces the risks of myocardial infarction, stroke, and coronary revascularization;
    Nplate for the treatment of patients with immune thrombocytopenia; KYPROLIS to
    treat patients with relapsed or refractory multiple myeloma; Aranesp to treat
    a lower-than-normal number of red blood cells and anemia; EVENITY for the treatment
    of osteoporosis in postmenopausal for women; Vectibix to treat patients with wild-type
    RAS metastatic colorectal cancer; BLINCYTO for the treatment of patients with
    acute lymphoblastic leukemia; TEPEZZA to treat thyroid eye disease; and KRYSTEXXA
    for the treatment of chronic refractory gout. It also markets other products,
    including PROLIA, REPATHA, OTEZLA, ENBREL, EVENITY, XGEVA, TEPEZZA, BLINCYTO,
    NPLATE, TEZSPIRE, KYPROLIS, ARANESP, KRYSTEXXA AND VECTIBIX, MVASI, PAVBLU, UPLIZNA,
    IMDELLTRA/IMDYLLTRA, AMJEVITA/AMGEVITA, TAVNEOS, NEULASTA, LUMAKRAS/LUMYKRAS,
    RAVICTI, PARSABIV, AIMOVIG, WEZLANA/WEZENLA, AND PROCYSBI. The company serves
    healthcare providers, including physicians or their clinics, dialysis centers,
    hospitals, and pharmacies. It distributes its products through pharmaceutical
    wholesale distributors. The company has collaboration agreements with AstraZeneca
    plc for the development and commercialization of TEZSPIRE; BEONE MEDICINES LTD.
    to develop and commercialize Aimovig; UCB for the development and commercialization
    of EVENITY; Kyowa Kirin Co., Ltd. for rocatinlimab development and commercialization;
    and BeiGene, Ltd. for oncology products expansion and development. The company
    was incorporated in 1980 and is headquartered in Thousand Oaks, California.
