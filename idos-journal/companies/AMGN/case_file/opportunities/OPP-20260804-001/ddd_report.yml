dominio_esg_supply_chain:
  analisis: Los riesgos ESG principales provienen de presiones políticas de fijación
    de precios de medicamentos en EE.UU. (Inflation Reduction Act - IRA), donde fármacos
    como Enbrel están sujetos a negociación de precios por Medicare. En la cadena
    de suministro, la biomanufactura requiere insumos especializados y facilidades
    con estrictos estándares regulatorios (FDA/EMA), aunque Amgen es pionero en tecnología
    de procesamiento continuo y flexibilidad geográfica.
  rating: medio_riesgo
dominio_financial_health:
  analisis: Con $37.2B en ingresos TTM y un margen operativo del 32.6%, la generación
    operativa de caja es sólida. El ROIC del 19.1% demuestra alta eficiencia en el
    capital empleado histórico. Tras la adquisición de Horizon Therapeutics por $27.8B,
    la deuda neta aumentó, pero el perfil de flujo de caja libre permite un rápido
    desapalancamiento (manteniendo un apalancamiento manejable y grado de inversión).
    La cobertura de intereses recuperará holgura a medida que se amortization los
    tramos de deuda de la adquisición.
  rating: fuerte
dominio_growth:
  analisis: El crecimiento de ingresos a corto plazo se sitúa en torno al 2-5% orgánico,
    complementado por la aceleración inorgánica de activos como Tepezza, Krystexxa
    y Tavneos. Los principales motores de crecimiento a medio/largo plazo son Repatha,
    Tezspire, Blincyto, Imdelltra y la franquicia de biosimilares (Wezlana, Pavblu).
    El verdadero potencial desproporcionado reside en el pipeline en obesidad (MariTide),
    que podría abrir un mercado direccionable de más de $100B.
  rating: moderado
dominio_management:
  analisis: Liderada por Robert A. Bradway (CEO desde 2012, aunque la ficha del prompt
    indique 0 años por error de captura), la directiva ha demostrado una ejecución
    disciplinada en M&A estratégico (adquisición de Horizon y Otezla) para contrarrestar
