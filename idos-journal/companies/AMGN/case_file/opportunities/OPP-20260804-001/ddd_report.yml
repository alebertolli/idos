resumen_ejecutivo: Amgen Inc. (AMGN) representa una oportunidad de inversión de alta
  calidad a precio justo ('Quality at Fair Price') para una Family Office que busque
  rentabilidad ponderada por riesgo, dividendos crecientes y protección contra la
  inflación en el sector salud. Aunque enfrenta presiones de patentes en activos heredados
  (Enbrel, Prolia), su plataforma madura de biosimilares, la reciente integración
  exitosa de Horizon Therapeutics (enfermedades raras) y el prometedor desarrollo
  del fármaco inyectable para la obesidad MariTide proporcionan visibilidad de ingresos
  sostenibles a largo plazo con un margen operativo holgado del 32.6%.
