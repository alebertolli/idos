  business_model: Infosys Limited provides consulting, technology, outsourcing, and
    digital services worldwide. The company offers insight services, such as applied
    and generative AI, sustainability services, and Infosys Topaz, an AI-first set
    of services, solutions, and platforms; blockchain, Internet of Things, and engineering
    services; cybersecurity and quality engineering services; and enterprise agile
    DevOps, API economy and microservices, application modernization, and digital
    process automation. It also provides digital supply chain, Microsoft business
    application services, Microsoft cloud business, Oracle, SAP, service experience
    transformation, Salesforce, energy transition, network transformation services,
    infrastructure services, global capability center, and Infosys Cobalt, a suite
    of services, solutions, and platforms. In addition, the company offers experience
    services, including digital marketing, digital commerce, digital interactions,
    digital workplace services, digital experience, metaverse, and Infosys Aster,
    a marketing suite; and EdgeVerve, Infosys Finacle, Infosys Live Enterprise Suite,
    Infosys Cortex, Infosys Meridian, Panaya, Infosys Equinox, Infosys Topaz Fabric,
    Infosys Wingspan, Infosys Helix, and Infosys Polycloud platforms. It serves aerospace
    and defense, agriculture, automotive, chemical manufacturing, communication services,
    consumer packaged goods, education, engineering procurement and construction,
    financial services, oil and gas, private equity, professional services, public
    sector, healthcare, high technology, industrial manufacturing, information services
    and publishing, insurance, life sciences, logistics and distribution, media, entertainment,
    mining, retail, semiconductor, travel and hospitality, utilities, and waste management
    industries. The company was formerly known as Infosys Technologies Limited and
    changed its name to Infosys Limited in June 2011. Infosys Limited was incorporated
    in 1981 and is headquartered in Bengaluru, India.
