  business_model: 'Howmet Aerospace Inc. provides advanced engineered solutions for
    the aerospace and transportation industries in the United States, Japan, France,
    Germany, the United Kingdom, Mexico, Italy, Canada, Poland, China, and internationally.
    It operates through four segments: Engine Products, Fastening Systems, Engineered
    Structures, and Forged Wheels. The Engine Products segment offers airfoils and
    seamless rolled rings primarily for aircraft engines and industrial gas turbines;
    and rotating and structural parts. The Fastening Systems segment produces aerospace
    fastening systems, as well as commercial transportation, industrial, and other
    fasteners; and latches, bearings, fluid fittings, and installation tools. The
    Engineered Structures segment provides titanium ingots and mill products, aluminum
    and nickel forgings, and machined components and assemblies for aerospace and
    defense applications; and titanium forgings, extrusions, and forming and machining
    services for airframe, wing, aero-engine, and landing gear components. The Forged
    Wheels segment offers forged aluminum wheels and related products for heavy-duty
    trucks and commercial transportation markets. The company was formerly known as
    Arconic Inc. Howmet Aerospace Inc. was founded in 1888 and is based in Pittsburgh,
    Pennsylvania.'
