prompt_inputs:
  business_model: Oracle Corporation offers products and services that build, run
    and support enterprise information technology frameworks worldwide. Its Oracle
    cloud software as a service offering includes various cloud software applications,
    including Oracle Fusion cloud enterprise resource planning ERP, Oracle Fusion
    cloud enterprise performance management EPM, Oracle Fusion cloud supply chain
    and manufacturing management SCM, Oracle Fusion cloud human capital management
    HCM, and NetSuite applications suite, Oracle Health applications, as well as Oracle
    Fusion Sales, Service, and Marketing. The company also offers cloud-based industry
    solutions for various industries; Oracle cloud license and on-premise license;
    and Oracle license support services. In addition, it provides cloud and license
    business' infrastructure technologies, such as the Oracle Database and MySQL Database;
    Java, a software development language; and middleware, including development tools
    and others. The company's cloud and license business' infrastructure technologies
    also comprise cloud-based compute, storage, and networking capabilities; and Oracle
    autonomous database, as well as AI, Internet-of-Things, machine learning, digital
    assistant, and blockchain. Further, it provides hardware products and other hardware-related
    software offerings, including Oracle engineered systems, enterprise servers, storage
    solutions, industry-specific hardware, virtualization software, operating systems,
    management software, and related hardware support services, and consulting and
    advanced customer services. It markets and sells its cloud, license, hardware,
    support, and services offerings directly to businesses in various industries,
    government agencies, and educational institutions, as well as through indirect
    channels. Oracle Corporation has a strategic alliance with Metron, Inc. The company
    was founded in 1977 and is headquartered in Austin, Texas.
