prompt_inputs:
  business_model: Eli Lilly and Company discovers, develops, manufactures, and markets
    human pharmaceutical products in the United States, Europe, China, Japan, and
    internationally. The company offers cardiometabolic health products, including
    Basaglar, Humalog, Humalog Mix 75/25, Humalog U-100, Humalog U-200, Humalog Mix
    50/50, insulin lispro, insulin lispro protamine, insulin lispro mix 75/25, Humulin,
    Humulin 70/30, Humulin N, Humulin R, Humulin U-500 for diabetes; Jardiance, Mounjaro,
    and Trulicity for type 2 diabetes; and Zepbound for obesity. It also provides
    oncology products, such as Cyramza for the second-line treatment of gastric cancer
    or gastro-esophageal junction adenocarcinoma; Erbitux for colorectal cancers and
    head and neck cancers; Inluriyo for breast cancer; Jaypirca for chronic lymphocytic
    leukemia or small lymphocytic lymphoma; Retevmo for the treatment of metastatic
    NSCLC; TYVYT for classic hodgkin's lymphoma; and Verzenio for breast cancer. In
    addition, the company offers immunology products, which include Ebglyss; Olumiant;
    Omvoh; and Taltz. Further, it provides Emgality for migraine prevention and episodic
    cluster headache; and Kisubla for symptomatic Alzheimer's disease. The company
    has collaborations with Boehringer Ingelheim Pharmaceuticals, Inc. for the Jardiance
    product family; and F. Hoffmann-La Roche Ltd and Genentech, Inc. for lebrikizumab,
    as well as license agreements with Almirall, S.A. for Ebglyss; and Chugai Pharmaceutical
    Co., Ltd for orforglipron; strategic collaboration with Ascidian Therapeutics
    for development of therapies for undisclosed monogenic kidney diseases; BioArctic
    AB (publ) for new treatment; QurCan Therapeutics Inc for development of PLNP-enabled
    genetic medicine therapeutics for the treatment of central nervous system and
    peripheral nervous system; and Abbisko Therapeutics for discovery and development
    of medicines across multiple targets. The company was founded in 1876 and is headquartered
    in Indianapolis, Indiana.
