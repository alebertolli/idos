    StockAnalysis en DDD | El AOIF también informa crecimiento de 10,01%, sin período
    ni metodología comparables. |

    | Margen operativo | 1,33% | AOIF; período no especificado | Confirma la relevancia
    de la presión de márgenes, pero requiere verificación y contexto temporal. |

    | ROIC | 20,5% | AOIF; período y metodología no especificados | Dato proporcionado,
    no verificado de manera independiente. |

    | FCF | USD 4.530 millones | TTM terminado el 2026-06-30; atribuido a StockAnalysis
    en DDD | Faltan desglose, conciliación con flujo operativo y capex y definición
    utilizada. |

    | FCF yield | 0% | AOIF; fecha y metodología no especificadas | Inconsistente
    o no conciliado con el FCF TTM informado en DDD; requiere investigación. |

    | P/E | 35,34 | AOIF; fecha de referencia no especificada | No constituye por
    sí solo una valoración completa. |

    | EV/EBITDA | 15,47 | AOIF; fecha de referencia no especificada | Requiere verificar
