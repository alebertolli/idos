    ## 8. Marco de Valoración


    ### Enfoques apropiados


    Para una distribuidora de gran volumen y bajo margen, la valoración debería contrastar
    más de un método:


    1. **Flujo de caja descontado:** utilizar flujos normalizados y reconciliados
    con estados financieros, separando capital de trabajo, capex y elementos no recurrentes.

    2. **Múltiplos relativos:** comparar PER y EV/EBITDA con compañías de distribución
    y servicios sanitarios que tengan modelos y riesgos comparables. Los datos disponibles
    no identifican un conjunto de comparables válido.

    3. **Análisis por segmento:** estimar crecimiento, márgenes, ROIC y reinversión
    por segmento, dado que la rentabilidad agregada podría ocultar diferencias importantes.


    ### Datos y supuestos que faltan


    No es posible estimar un valor intrínseco con rigor con la información suministrada.
    Faltan, entre otros, el precio y número de acciones diluidas correspondientes
    a la fecha de valoración, deuda neta, series verificables de FCF, beneficios normalizados
    y supuestos de crecimiento, márgenes, reinversión y tasa de descuento.


    AOIF reporta PER de 35,34, EV/EBITDA de 15,47 y FCF yield de 0, pero no especifica
    fechas ni metodologías suficientes para interpretar esos múltiplos. DDD informa
    un consenso de precio objetivo de USD 300,8, con rango de USD 260–330 al 2026-11-20,
    frente a una cotización reportada de USD 273,55499 al 2026-11-19. Estas cifras
    son observaciones de mercado y no sustituyen una valoración independiente.


    ### Sensibilidad a analizar


    Una vez verificada la base financiera, conviene medir la sensibilidad del valor
    a:


    - Crecimiento orgánico frente a adquisiciones y cambios de precios o volumen.

    - Estabilidad o erosión de márgenes brutos y operativos.

    - Capital de trabajo y conversión de beneficios en FCF.

    - ROIC, capex y necesidades de reinversión por segmento.

    - Coste de financiación, deuda neta y tasa de descuento.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué fuentes primarias confirman los ingresos, márgenes, ROIC, FCF y múltiplos
    reportados, y a qué períodos corresponden?

    2. ¿Cuánto del crecimiento de ingresos y FCF proviene de crecimiento orgánico,
    adquisiciones, precios, volumen y capital de trabajo?

    3. ¿Cuáles son el ROIC, los márgenes y las necesidades de reinversión por segmento?

    4. ¿Cómo se reconcilian el FCF positivo descrito por DDD y el FCF yield de cero
    reportado por AOIF?

    5. ¿Cuál es la serie histórica de flujo de caja operativo, capex y FCF, y qué
    explica su variabilidad anual?

    6. ¿Cuál es la deuda neta, el calendario de vencimientos, el gasto por intereses
    y la cobertura calculada con datos verificables?

    7. ¿Qué factores explican el current ratio de 0,88 y cómo evoluciona la liquidez?

    8. ¿Qué evidencia cuantitativa respalda las calificaciones de liderazgo competitivo,
    moat estrecho y calidad de management?

    9. ¿Cuál es la estructura actual de incentivos, participación de insiders, dilución
    y composición del consejo?

    10. ¿Qué litigios, acuerdos u obligaciones regulatorias están vigentes y qué posibles
    efectos financieros tienen?

    11. ¿Qué hipótesis de beneficios y valoración sustentan el consenso de precio
    objetivo de USD 300,8 y su rango de USD 260–330?

    12. ¿Qué pares de distribución sanitaria son adecuados para comparar múltiplos
    y rentabilidad, en lugar de usar sin ajustes compañías farmacéuticas como [[ABBV]],
    [[AMGN]] o [[BMY]]?


