    - P/E de **35,34** y EV/EBITDA de **15,47**, informados por AOIF, sin fecha de
    referencia completa.


    Estos objetivos de analistas y escenarios no deben interpretarse como valores
    intrínsecos ni como precios garantizados.


    ### Enfoque recomendado


    Una valoración rigurosa debería combinar:


    1. **Flujo de caja descontado**, con escenarios de margen, crecimiento, inversión
    y capital circulante.

    2. **Múltiplos comparables**, interpretados con cautela por la estructura de bajo
    margen del negocio.

    3. **Análisis por segmentos**, una vez disponibles ingresos, márgenes, retornos
    y flujos de caja comparables.


    ### Sensibilidades prioritarias


    La valoración dependerá especialmente de la evolución del margen operativo, el
    crecimiento rentable por volumen y mezcla, la conversión de beneficios en FCF
    y las necesidades de capital circulante. No hay suficiente información para asignar
    supuestos numéricos fiables a estas variables.


