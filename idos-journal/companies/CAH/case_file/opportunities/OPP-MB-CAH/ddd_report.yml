    ## 8. Marco de Valoración


    El análisis disponible califica la opinión de valoración como **justa**, pero
    la conclusión es provisional. AOIF señala que el valor intrínseco no puede estimarse
    con rigor con los datos disponibles y clasifica el margen de seguridad como insuficiente.


    ### Datos de referencia informados


    - Cotización: **USD 273,55** al **2026-11-19**, según DDD.

    - Consenso de analistas: **USD 300,80**, con rango de **USD 260–330**, según DDD.

    - Escenarios para el **2027-11-20**: escenario bajista de **USD 260** y alcista
