prompt_inputs:
  business_model: 'Cardinal Health, Inc. operates as a healthcare services and products
    company in the United States and internationally. It operates in two segments:
    Pharmaceutical and Specialty Solutions, and Global Medical Products and Distribution.
    The company offers customized solutions for hospitals, healthcare systems, pharmacies,
    ambulatory surgery centers, clinical laboratories, physician offices, and patients
    in the home. It distributes branded and generic pharmaceutical, specialty pharmaceutical,
    and over-the-counter healthcare and consumer products. The company also provides
    services to pharmaceutical manufacturers and healthcare providers for specialty
    pharmaceutical products; pharmacy management services to hospitals; operates pharmacies,
    including pharmacies in community health centers; and repackages generic pharmaceuticals
    and over-the-counter healthcare products. In addition, it manufactures, sources,
    and distributes Cardinal Health branded medical, surgical, and laboratory products
    and devices that include exam and surgical gloves; needles, syringe, and sharps
    disposals; compression, incontinence, nutritional delivery, and wound care products;
    single-use surgical drapes, gowns, and apparel products; fluid suction and collection
    systems; urology products; operating room supply products; and electrode product
    lines. Further, the company distributes a range of national brand products, including
    medical, surgical, and laboratory products; provides supply chain services and
    solutions to hospitals, ambulatory surgery centers, clinical laboratories, and
    other healthcare providers; and assembles and sells sterile and non-sterile procedure
    kits. Additionally, it manufactures, prepares, and delivers radiopharmaceuticals;
    and optimizes direct shipments through integrated technology solutions. The company
    was incorporated in 1979 and is headquartered in Dublin, Ohio.'
