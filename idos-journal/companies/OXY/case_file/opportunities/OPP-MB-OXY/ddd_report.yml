    ## 8. Marco de Valoración


    **Conclusión actual: valoración intrínseca no estimable de forma responsable con
    la información disponible.** La investigación DDD no valida la existencia de un
    error de valoración: los objetivos de analistas son referencias observadas, no
    una valoración intrínseca, y faltan inputs para una valoración propia.


    ### Metodología apropiada


    Para una compañía cíclica e intensiva en capital como OXY, el análisis debería
    combinar:


    1. **FCF normalizado a través del ciclo**, con escenarios de precios realizados,
    producción, costos, inversión de mantenimiento y desarrollo.

    2. **Valoración por segmentos o activos**, si se obtienen datos comparables de
    resultados, activos y obligaciones de cada negocio.

    3. **Múltiplos frente a pares**, por ejemplo EV/EBITDA y rendimiento de FCF, comparando
    definiciones, ciclo de materias primas y estructura de capital con [[COP]], [[CVX]],
    [[BP]] y otros productores.

    4. **Análisis de balance**, incorporando deuda neta validada, vencimientos, intereses
    y necesidades de capital.


    El P/E de 7,28x y EV/EBITDA de 4,22x reportados por AOIF no tienen fecha, definiciones
    ni beneficios normalizados asociados en el paquete; por tanto, no demuestran por
    sí solos que OXY esté infravalorada. El FCF yield reportado de 0% también requiere
    reconciliación con la cifra de FCF.


    ### Referencias de mercado aportadas


    Al 2026-11-20, el consenso de precio objetivo reportado es de **USD 71,11**, con
    un rango de **USD 60–83**. La cotización de referencia indicada es **USD 64**
    al 2026-10-30. Fuentes citadas en DDD: Stock Analysis y Yahoo Finance. Estos datos
    describen referencias de mercado, no una valoración intrínseca.


    DDD también reporta momentum de 12 meses de **55,3398%** hasta el 2026-10-30.
    El momentum no prueba infravaloración ni permite inferir las expectativas incorporadas
    en el precio.


    ### Sensibilidad pendiente


    No se construye una tabla de sensibilidad numérica porque faltan supuestos verificables
    sobre precios de materias primas, producción, costos, inversión, FCF normalizado,
    deuda neta, acciones diluidas y costo de capital. Una valoración futura debería
    mostrar al menos escenarios bajo, base y alto para precios y volúmenes, y sensibilizar
    el valor del capital a FCF normalizado y deuda.


