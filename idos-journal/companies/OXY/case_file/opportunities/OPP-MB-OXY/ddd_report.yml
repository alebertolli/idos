  existing_wiki: '# OXY — Occidental Petroleum Corporation


    > **Estado de la evidencia:** evaluación preliminar basada únicamente en los datos
    y fuentes incluidos en los inputs de investigación. Varias métricas carecen de
    período, definición o datos comparables; no deben interpretarse como cifras auditadas
    ni como una valoración concluyente.


    ## 1. Visión General de la Compañía


    Occidental Petroleum Corporation es una compañía integrada de petróleo y gas.
    Su cadena de valor abarca la adquisición de derechos y propiedades, exploración,
    desarrollo de yacimientos e infraestructura, producción y actividades de recolección,
    procesamiento, transporte, almacenamiento y comercialización de hidrocarburos.


    Los productos y mercados identificados en la investigación incluyen:


    - Petróleo y condensados, vendidos a refinadores y otros compradores.

    - Líquidos de gas natural (NGL).

    - Gas natural, vendido a empresas de servicios públicos y otros compradores.


    El negocio opera en una industria intensiva en capital y cíclica, expuesta a los
    precios de petróleo, gas y NGL, además de costos de servicios, productividad de
    los yacimientos y regulación. Los datos proporcionados no detallan la distribución
    geográfica de operaciones ni la contribución de cada región a ingresos y producción.


    Entre las compañías relacionadas del sector figuran [[BKR]], [[BP]], [[COP]],
    [[CVX]], [[E]], [[EQNR]], [[HAL]] y [[TS]].


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos y caja


    Los principales drivers económicos del modelo son:


    - Precios realizados de petróleo, condensados, NGL y gas.

    - Volúmenes de producción y productividad de los yacimientos.

    - Costos de exploración, desarrollo, operación y servicios.

    - Resultados de las actividades de midstream y comercialización.

    - Disciplina de capital, inversión de desarrollo y declive natural de los activos.


    La investigación describe ventajas potenciales asociadas con escala, experiencia
    operativa, acceso a activos y la integración de producción con transporte y comercialización.
    No obstante, el moat se clasifica como **estrecho**: esas ventajas pueden reducir
    costos y mejorar la comercialización, pero la evidencia disponible no demuestra
    que protejan a la compañía frente a ciclos prolongados de precios bajos o frente
    a competidores como [[COP]], [[CVX]], [[BP]] y [[E]].


    ### Dinámica competitiva


    La industria es cíclica e intensiva en capital. Los retornos dependen tanto de
    variables que la compañía puede gestionar —costos, selección de proyectos y disciplina
    de inversión— como de factores externos, especialmente los precios de las materias
    primas. La clasificación de posición competitiva aportada es “líder”, pero no
    se incluyen comparaciones de participación de mercado, costos unitarios, reservas
    o retornos frente a pares que permitan validarla.


    ## 3. Perfil Financiero


    Las cifras siguientes son las observaciones reportadas por los proveedores o los
    análisis suministrados. No se han recalculado cuando faltan definiciones o períodos
    comparables.


    | Métrica | Valor reportado | Período / referencia | Interpretación y limitaciones
    |

    |---|---:|---|---|

    | Crecimiento de ingresos | 34,74% | Período no especificado en AOIF | No es posible
    evaluar su comparabilidad ni atribuirlo a precios, volúmenes, adquisiciones u
    otros factores. |

    | CAGR de ingresos a 3 años | No disponible | TTM al 2026-09-30 como período final
    | La serie aportada no incluye la observación necesaria para t-3. Stock Analysis:
