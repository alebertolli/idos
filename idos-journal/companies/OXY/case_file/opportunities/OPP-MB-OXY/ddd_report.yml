    |

    | Margen operativo | 29,31% | Período no especificado en AOIF | La fuente y la
    definición del período no están detalladas en el paquete. |

    | ROIC | 10,38% | Período no especificado en AOIF | No se aportan serie histórica,
    definición ni costo de capital comparable. |

    | FCF | 5.575 | TTM al 2026-09-30, unidades del proveedor | Stock Analysis. Positivo;
    no es directamente comparable con un año fiscal completo. |

    | FCF | 3.825 | FY 2025, unidades del proveedor | Stock Analysis. El FCF TTM posterior
    supera esta cifra, pero los períodos no son comparables como años completos. |

    | Crecimiento de FCF | 9,36% | TTM al 2026-09-30 | Reportado por el proveedor;
    no se especifican fórmula ni período de comparación. |

    | Deuda neta reportada | -8.733 | 2026-09-30, unidades del proveedor | Stock Analysis.
    |

    | Deuda neta reportada | -21.383 | 2025-12-31, unidades del proveedor | Stock
