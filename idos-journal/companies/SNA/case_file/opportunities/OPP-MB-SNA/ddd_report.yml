    El precio objetivo de consenso no incluye horizonte temporal ni supuestos de valoración
    en la información recibida. No debe tratarse como estimación de valor intrínseco.
    El FCF yield de 0% también requiere aclarar numerador, denominador y fecha.


    ### Metodología apropiada


    Para una valoración fundamental sería conveniente triangular:


    1. **Flujo de caja descontado:** con FCF normalizado, crecimiento explícito, márgenes,
    reinversión, costo de capital y valor terminal.

    2. **Múltiplos de valoración:** PER y EV/EBITDA comparados con pares apropiados
    y con la propia historia, usando períodos y definiciones homogéneos.

    3. **Retornos sobre capital:** ROIC y retorno incremental, verificando metodología
    y relación con crecimiento y reinversión.


    No se puede estimar de forma responsable un valor intrínseco con los datos disponibles.
    Faltan, entre otros, deuda neta, acciones en circulación con fecha de referencia,
    FCF normalizado y supuestos verificables de crecimiento, márgenes y costo de capital.


    ### Sensibilidad y margen de seguridad


    La valoración dependería especialmente del crecimiento de ingresos, la sostenibilidad
    de los márgenes, la conversión de beneficios en caja y los retornos incrementales
    del capital. El paquete no ofrece rangos cuantitativos fiables para construir
    escenarios o una tabla de sensibilidad. La evaluación recibida considera **insuficiente**
    el margen de seguridad y no valida un error de valoración.


