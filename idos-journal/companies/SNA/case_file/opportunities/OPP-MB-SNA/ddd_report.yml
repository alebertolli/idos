  inferencias_llm:
  - La estabilidad del margen bruto observado es compatible con resiliencia operativa,
    pero no demuestra ventaja competitiva causal ni su persistencia.
  - El FCF TTM positivo permite evaluar conversión de caja en el período, pero no
    basta para inferir el retorno sobre capital o la tasa de reinversión.
  - StockAnalysis reporta ingresos TTM de 5,270 millones en unidades del proveedor,
    FCF TTM de 1,074.0 y margen bruto TTM de 51.87%, con período terminado el 2026-10-03.
  - StockAnalysis reporta efectivo e inversiones de 1,670.0 y deuda total de 1,308.0,
    ambos al 2026-10-03; las unidades reportadas no están explicitadas en el paquete.
  - Yfinance reporta momentum de precio a 12 meses de 5.9932%, drawdown de 15.1797%
    y volatilidad a 90 días de 16.7027%, al 2026-10-30.
  - El resumen financiero reporta cotización de USD 355.66 al 2026-10-30 y consenso
    de objetivos de USD 340 a USD 485 al 2026-11-20.
