    grinders. It also provides tool chests and roll cabinet stool storage products;
    facility-level tool control and asset management hardware and software; diagnostics,
    information, and management systems product comprising handheld and computer-based
    diagnostic products, service and repair information products, diagnostic software
    solutions, electronic parts catalogs, business management systems and services,
    point-of-sale systems, integrated systems for vehicle service shops, OEM purchasing
    facilitation services, and warranty management systems and analytics to help OEM
    dealerships manage and track performance. In addition, the company offers wheel
    alignment equipment, wheel balancers, tire changers, vehicle lifts, test lane
    equipment, collision repair equipment, vehicle air conditioning service equipment,
    brake service equipment, fluid exchange equipment, transmission troubleshooting
    equipment, safety testing equipment, battery chargers, and hoists; and training
    programs and after-sales support. It serves the vehicle service and repair, and
    industrial sectors through mobile van channel, company direct sales, distributors,
    and digital commerce. In addition, it distributes and services vehicle collision
    equipment in Australia. Snap-on Incorporated was incorporated in 1920 and is based
    in Kenosha, Wisconsin.
