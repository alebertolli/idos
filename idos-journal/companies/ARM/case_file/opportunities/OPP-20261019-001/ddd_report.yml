dominio_esg_supply_chain:
  analisis: Arm no posee fábricas propias, lo que reduce su exposición a riesgos medioambientales
    directos. Sus proveedores están diversificados en Asia y EE.UU. No se han detectado
    controversias ESG significativas. Sin embargo, la dependencia de la cadena de
    suministro de semiconductores en Taiwán y Corea del Sur representa un riesgo geopolítico
    moderado.
  rating: bajo_riesgo
dominio_financial_health:
  analisis: Balance con deuda/equity de 0.06, sin deuda significativa, ROIC de 14.2%
    y margen operativo de 17.3% (según datos internos). Genera flujo de caja operativo
    sólido, aunque el FCF ajustado es cercano a cero debido a inversiones en I+D y
    expansión de ventas. La posición de efectivo es suficiente para financiar el crecimiento
    sin dilución.
  rating: fuerte
dominio_growth:
  analisis: 'Los impulsores de crecimiento incluyen: (1) Licencias de IP para IA y
    NPU, (2) Expansión de la línea Neoverse en data‑center con mejoras de rendimiento
    del 30%, (3) Penetración en automoción y robótica, y (4) Creciente adopción de
    ARM en servidores x86‑alternatives. La visibilidad de ingresos a 3‑5 años es alta
    gracias a contratos de licencia a largo plazo.'
  rating: fuerte
dominio_management:
  analisis: El equipo directivo, liderado por el CEO recién nombrado, tiene experiencia
    en la industria de semiconductores y ha demostrado capacidad para ejecutar alianzas
    estratégicas (p.ej., con Microsoft y Amazon). La alineación de intereses es moderada
    (insider ownership bajo), pero la estructura de incentivos está vinculada a metas
    de ingresos por licencias, lo que alinea la creación de valor a largo plazo.
