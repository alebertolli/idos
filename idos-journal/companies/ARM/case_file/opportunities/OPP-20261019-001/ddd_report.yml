resumen_ejecutivo: Arm es líder mundial en licencias de IP de procesadores, con un
  moat basado en arquitectura de bajo consumo y ecosistema amplio. Presenta fuerte
  crecimiento de ingresos (22% YoY) y márgenes operativos modestos (7.6%). Su balance
  es sólido (DE 0.06) pero genera poco flujo de caja libre. El principal riesgo proviene
  de la regulación EE.UU.-China y la competencia emergente de RISC‑V. La valoración
  actual es alta, pero la exposición a IA, data‑center y automoción ofrece upside
  si se materializan los catalizadores de licencias y expansión geográfica.
