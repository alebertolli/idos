prompt_inputs:
  business_model: Arm Holdings plc researches, develops, licenses, and markets central
    processing unit (CPU) intellectual property (IP), graphics processing unit IP,
    systems IP, compute subsystems (CSS), and associated software, tools and related
    services. The company provides a product portfolio, including CPU IP, GPU and
    neural processing unit (NPU) accelerators, system IP such as interconnects, compute
    platform products including pre-integrated CSSs, and development tools and software.
    The company serves semiconductor companies, original equipment manufacturers (OEMs),
    cloud service providers (CSPs), and organizations developing chips for end markets
    such as smartphones, consumer electronics, industrial IoT, embedded systems, cloud
    data centers, networking, automotive, and robotics. It provides its products and
    services in the United States, China, Japan, Taiwan, Korea, and internationally.
    The company was founded in 1990 and is based in Cambridge, United Kingdom. Arm
    Holdings plc operates as a subsidiary of SoftBank Group Corp.
