resumen_ejecutivo: Arm Holdings es el líder mundial en licencias de arquitectura de
  procesadores, con un crecimiento de ingresos del 25% YoY, margen operativo del 17.3%
  y generación de flujo de caja libre de USD 1.51 B. El precio de la acción cotiza
  a USD 178.6, notablemente bajo respecto al consenso de precios objetivo (USD 272.4).
  El negocio muestra un moat tecnológico robusto, alta demanda en IA y dispositivos
  móviles, y una posición financiera sólida. El principal riesgo proviene de la exposición
  regulatoria y la concentración de clientes. La valoración actual sugiere un error
  de mercado que puede ser aprovechado.
