resumen_ejecutivo: American Express representa una de las franquicias financieras
  más sólidas a nivel global. Su modelo operativo integrado 'closed-loop' le otorga
  datos exclusivos de transacciones, una base de comerciantes leales y una base de
  tarjetahabientes premium. Con ingresos TTM de $68.8B (+11.7%) y un margen operativo
  del 20.4%, la compañía combina crecimiento de ingresos por comisiones con un perfil
  de riesgo crediticio superior a la banca tradicional. La tesis se fundamenta en
  su capacidad para atraer generaciones jóvenes a cuotas anuales elevadas y expandir
  sus servicios comerciales para PYMES.
score_general: 84
tesis_inversion: American Express es un activo 'Core Compounder' idóneo para una Family
  Office orientada al capital preservado con apreciación a largo plazo. Su fosa competitiva
  basada en marca y modelo cerrado genera ingresos de alta visibilidad por cuotas
  recurrentes. A una valoración cercana a 18x PER futuro, ofrece una rentabilidad
  ponderada por riesgo atractiva, respaldada por retornos de capital continuos vía
  recompras de acciones y dividendos.
