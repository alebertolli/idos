dominio_business_quality:
  analisis: AXP opera un modelo de red cerrada único (emisor, adquirente y red de
    pagos). Esto le permite capturar valor tanto del lado del comerciante (discount
    revenue) como del tarjetahabiente (cuotas anuales e intereses). Posee un potente
    efecto de red bilateral y una marca asociada a estatus social que permite incrementos
    periódicos en las cuotas anuales (p.ej. Platinum) sin pérdida apreciable de clientes.
  rating: excepcional
