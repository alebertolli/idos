dominio_esg_supply_chain:
  analisis: Riesgo operativo y de cadena de suministro muy bajo por tratarse de una
    red de servicios digitales y financieros. Los principales riesgos ESG residen
    en la ciberseguridad, privacidad de datos de clientes, cumplimiento de regulaciones
    contra el lavado de dinero (AML) y normativas de equidad en concesión de crédito.
  rating: bajo_riesgo
dominio_financial_health:
  analisis: Aunque las métricas tradicionales no financieras como FCF o D/E muestran
    0 o N/A debido a la contabilidad de instituciones bancarias/financieras, el balance
    de AXP está fuertemente capitalizado con ratios CET1 holgados dentro de los requerimientos
    regulatorios (FED). Mantiene acceso constante a mercados de fondeo, depósitos
    de clientes en expansión y reservas de crédito líquidas que cubren holgadamente
    las pérdidas estimadas por préstamos.
  rating: fuerte
dominio_growth:
  analisis: Los impulsores clave de crecimiento incluyen la expansión internacional
    de la red de comerciantes accepted-everywhere, el rejuvenecimiento de la base
    de clientes, el aumento de volumen de gasto en PYMES (Commercial Services) y la
    monetización continua mediante aumentos periódicos de las cuotas anuales de tarjetas.
    Los ingresos registran crecimientos sostenidos de doble dígito (TTM +11.7%).
  rating: fuerte
dominio_management:
  analisis: Bajo el liderazgo del CEO Stephen Squeri (en el cargo desde 2018, a pesar
    de las inconsistencias en las bases de datos públicas de corto plazo), la directiva
    ha ejecutado impecablemente la estrategia de captación de Millennials/Gen Z y
    la internacionalización. La asignación de capital prioriza el re-inversión orgánica
    en recompensas y marketing de alta conversión, recompras continuas de acciones
    y crecimiento constante del dividendo.
  rating: bueno
