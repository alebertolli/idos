clasificacion_oportunidad:
  categoria: compounder
  categorias_descartadas: Se descarta 'ciclica' porque, aunque tiene exposición al
    gasto discrecional y crédito al consumo, el modelo spend-centric centrado en clientes
    de alto poder adquisitivo amortigua severamente las recesiones en comparación
    con emisores de crédito puro. Se descarta 'quality_at_fair_price' o 'deep_value'
    porque sus métricas operativas y moat diferencial la posicionan inequívocamente
    como un Compounder de largo plazo.
  justificacion: American Express (AXP) es un negocio de alta calidad con un modelo
    de bucle cerrado ('closed-loop network') que combina la emisión de tarjetas y
    la red de adquirencia. Posee un 'moat' duradero sustentado en el poder de su marca,
    comisiones cobradas a comercios (discount rate) y cuotas anuales cobradas a titulares
    de tarjetas de alto poder adquisitivo. Mantiene retornos sobre el capital (ROE
    > 30%) sostenidos y un crecimiento de ingresos superior al 10%.
dominio_business_quality:
  analisis: El moat de AXP se basa en su red de bucle cerrado (closed-loop), que le
    otorga acceso directo tanto al consumidor como al comercio. Esto le permite obtener
    un 'discount rate' superior al de sus competidores, controlar la experiencia del
    cliente y recopilar datos detallados de transacciones. La retención de clientes
    es extraordinariamente alta gracias a los programas de recompensas premium y la
    percepción de estatus de la marca.
  rating: excepcional
