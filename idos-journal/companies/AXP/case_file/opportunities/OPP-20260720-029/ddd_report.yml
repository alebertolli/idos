resumen_ejecutivo: American Express representa una oportunidad Compounder de alta
  calidad. Su ecosistema de red cerrada le permite capturar valor tanto del lado del
  comerciante (Merchant Discount Revenue) como del tarjetahabiente (Card Fees y gasto
  directo). La exitosa renovación de sus tarjetas insignia (Platinum/Gold) enfocada
  en beneficios de estilo de vida ha atraído masivamente a generaciones jóvenes de
  ingresos elevados. Con un sólido retorno sobre capital, ratios de eficiencia operativa
  y un perfil de riesgo crediticio superior a la media del sector, la compañía está
  bien posicionada para generar retornos compuestos ajustados por riesgo atractivos
  para un horizonte de Family Office.
score_general: 85
tesis_inversion: La tesis de inversión en American Express se basa en su capacidad
  de funcionar como un 'Compounder' de alta calidad dentro del espacio de pagos. Su
  ventaja competitiva basada en un ecosistema premium y cerrado le permite mantener
  tasas de crecimiento de doble dígito en ingresos y BPA a largo plazo. La adquisición
  masiva de clientes jóvenes garantiza durabilidad temporal en sus flujos de caja.
  Para una Family Office, AXP representa una combinación de protección de capital,
  crecimiento compuesto del beneficio por acción y poder de fijación de precios resistente
  a la inflación.
