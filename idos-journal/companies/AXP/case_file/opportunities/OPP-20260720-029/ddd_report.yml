    comisiones por demora reguladas por la CFPB. La dependencia de cadena de suministro
    física es baja (logística de tarjetas e infraestructura tecnológica donde priman
    redundancias de ciberseguridad).
  rating: bajo_riesgo
dominio_financial_health:
  analisis: Aunque los datos provistos reflejan distorsiones típicas de agregadores
    de datos para empresas financieras (ROIC/WACC y D/E no estándar para bancos),
    AXP cuenta con un balance extremadamente sólido. Mantiene ratios de capital Tier
    1 holgados, una estructura de depósitos diversificada y las tasas de morosidad
    y cancelaciones netas (NCOs) más bajas entre los principales emisores de crédito
    de EE.UU.
  rating: fuerte
dominio_growth:
