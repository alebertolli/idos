    as an integrated payments company in the United States, Europe, the Middle East
    and Africa, the Asia Pacific, Australia, New Zealand, Latin America, Canada, the
    Caribbean, and internationally. It operates through four segments: U.S. Consumer
    Services, Commercial Services, International Card Services, and Global Merchant
    and Network Services. The company offers credit and charge cards and complementary
    products and services, including travel, dining, and lifestyle and expense management
    products and services; and banking and other payment and financing products and
    services, including deposits and non-card lending. It also provides merchant acquisition
    and processing, servicing and settlement, fraud prevention, and point-of-sale
    marketing and information products and services, as well as network services.
    The company offers its products and services to consumers, small businesses, mid-sized
    companies, and large corporations through mobile and online applications, affiliate
    marketing, customer referral programs, third-party service providers and business
    partners, in-house sales teams, direct mail, telephone, and direct response advertising.
    American Express Company was founded in 1850 and is headquartered in New York,
    New York.'
