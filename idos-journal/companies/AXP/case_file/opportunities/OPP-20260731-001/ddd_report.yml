clasificacion_oportunidad:
  categoria: quality_at_fair_price
  categorias_descartadas: Descartamos 'ciclica' porque aunque depende del gasto del
    consumidor, su enfoque en consumidores premium y corporativos le otorga resiliencia
    superior frente a un banco emisor tradicional; descartamos 'hype' por su rentabilidad
