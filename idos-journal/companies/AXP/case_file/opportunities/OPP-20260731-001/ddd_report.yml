    de alto nivel sin deterioro estructural.
  justificacion: American Express es un negocio de calidad excepcional respaldado
    por un foso competitivo (moat) basado en red cerrada ('closed-loop'), poder de
    fijación de precios en cuotas anuales y una base de clientes de alto poder adquisitivo.
    Cotiza a múltiplos razonables ajustados por su retorno sobre capital y crecimiento
    constante.
dominio_business_quality:
  analisis: Su foso competitivo se compone de una red integrada cerrada (emisor, adquirente
    y red de pagos en uno), lo que le permite capturar la totalidad de la tasa de
    descuento del comercio (Discount Rate) sin compartirla substancialmente con terceros.
    Posee un efecto red de dos lados reforzado por el estatus y prestigio de marca,
    otorgando un poder de precio diferencial para incrementar cuotas anuales sin perder
    usuarios.
  rating: excepcional
