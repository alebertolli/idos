  activo de alta calidad ('compounder') a un precio razonable. Con ingresos TTM de
  $70.91B (+11.9% interanual) y un margen operativo del 20.3%, AXP demuestra el valor
  defensivo y expansivo de su red integrada de pagos. La exitosa captación de segmentos
  más jóvenes (Gen Z/Millennials) asegura la renovación de su base cliente a largo
  plazo, mientras que su poder de fijación de precios en productos como Platinum y
  Gold sostiene márgenes de alta rentabilidad.
