    moneda y unidades no se especifican en el paquete. |

    | Ingresos reportados | 1.980.670 | FY 2026, finalizado el 31 de marzo | [Stock
    Analysis — financieros](https://stockanalysis.com/stocks/ibn/financials/). La
    moneda y unidades no se especifican en el paquete. |

    | Crecimiento de ingresos | 11,1 % | Periodo no especificado | Dato indicativo
