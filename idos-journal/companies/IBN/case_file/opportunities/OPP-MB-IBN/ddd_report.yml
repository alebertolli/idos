  existing_wiki: '## 1. Visión General de la Compañía


    ICICI Bank Limited (IBN) es un banco universal con sede en India que ofrece servicios
    bancarios y financieros a clientes minoristas y corporativos. Su actividad comprende
    banca minorista y mayorista, tesorería y actividades financieras relacionadas.
    La cadena de valor incluye captar depósitos y financiación mayorista, evaluar
    riesgos y originar préstamos, procesar pagos y transacciones, y distribuir productos
    financieros.


    Los clientes descritos incluyen particulares, hogares y pequeñas y medianas empresas.
    La información disponible también hace referencia a actividad corporativa. El
    negocio opera en un sector sujeto a regulación, riesgo de crédito y competencia
    de bancos públicos y privados, además de proveedores de servicios financieros
    digitales.


    El material disponible identifica a [[HSBC]], [[C]], [[BSBR]], [[AIG]], [[AXP]],
    [[AEG]] y [[BX]] como compañías del mismo sector o relacionadas; no establece
    que todas sean competidores directos de ICICI Bank.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Fuentes de ingresos


    - **Margen de intermediación:** diferencia entre los intereses cobrados por préstamos
    y los intereses pagados por depósitos.

    - **Comisiones y otros ingresos financieros:** procedentes de pagos, transacciones
    y distribución de productos.

    - **Tesorería y actividades financieras relacionadas.**


    Entre los productos señalados figuran cuentas de ahorro y corrientes, depósitos
    a plazo y certificados de depósito; préstamos personales, hipotecarios, automotrices,
    educativos, de oro y empresariales.


    ### Moat y competencia


    La evaluación AOIF describe ventajas potenciales derivadas de la marca, la escala,
    la base de clientes y depósitos, la distribución nacional, las relaciones corporativas
    y una oferta diversificada. También menciona infraestructura y capacidades de
    distribución. La amplitud del moat se calificó como **estrecha**, y la posición
    competitiva como **líder**, pero estas son valoraciones cualitativas del análisis
    proporcionado, no conclusiones verificadas con métricas comparativas.


    La banca india podría beneficiarse del crecimiento económico, la inclusión financiera
    y la adopción de pagos digitales. En sentido contrario, afronta competencia de
    bancos públicos y privados, presión de proveedores digitales y cambios en el coste
    de financiación. [[HSBC]], [[C]] y [[BSBR]] son referencias del sector en la wiki,
    pero el material no permite comparar sus cuotas de mercado, rentabilidad o posición
    competitiva con ICICI Bank.


    ## 3. Perfil Financiero


    | Métrica | Dato disponible | Periodo / fecha | Fuente y limitación |

    |---|---:|---|---|

    | Ingresos reportados | 1.169.021 | FY 2023, finalizado el 31 de marzo | [Stock
