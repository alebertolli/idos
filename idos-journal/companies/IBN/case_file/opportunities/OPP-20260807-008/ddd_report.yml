  business_model: ICICI Bank Limited, together with its subsidiaries, engages in the
    provision of various banking and financial services to corporate and retail customers
    in India and internationally. The company operates through Retail Banking, Wholesale
    Banking, Treasury, Other Banking, Life Insurance, General Insurance, and Others
    segments. The company offers asset management, securities brokerage, private equity,
    foreign exchange, agricultural and rural banking, equities underwriting, depositary
    share accounts, consumer durable goods financing, corporate salary and current
    account, savings and sovereign gold bonds, insurance policies, public offerings,
    investment, credit and protection, retail inward remittances, certificates of
    deposits, and payment and transaction banking products and services. It is also
    involved in the fee and commission-based activities; distribution of financial
    products; venture capital and real estate fund management business; treasury and
    rural banking operations; financial solutions; working capital financing; I-Process
    services, mutual funds, investment banking, and pension funds; and advisory activities.
    In addition, the company provides savings, salary, capital gains scheme, Hindu
    undivided family savings, real estate regulatory authority, government e-marketplace,
    current, trade, escrow, and foreign currency accounts. Further, it offers personal,
    home, car, education, gold, automobile, and commercial business loans, as well
    as loans against time deposits, securities, and property; and working capital
    loans, as well as credit, debit, prepaid, travel, forex, commercial, and corporate
    cards. Additionally, the company provides fixed income products; investment products;
    payments; general, accident, life, health, vehicle, and travel insurance products;
    cash management and merchant services; capital market and securities market services;
    and forex, derivatives, bullion, and bonds. The company was founded in 1955 and
    is headquartered in Mumbai, India.
