    |

    | Seguimiento de morosidad, provisiones y exposición hipotecaria | Continuo; sin
    fecha de evento | Podría aportar evidencia sobre calidad de activos y riesgo crediticio
    | Punto de monitoreo de AOIF; no se incluyen series |


    El paquete reporta un precio de USD 5,415 al 2026-10-26 y un objetivo de consenso
