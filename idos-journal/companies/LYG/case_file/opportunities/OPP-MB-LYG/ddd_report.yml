  existing_wiki: '## 1. Visión General de la Compañía


    **Lloyds Banking Group plc (LYG)** es un grupo bancario diversificado centrado
    en el Reino Unido. Ofrece servicios financieros a clientes particulares y empresas,
    con actividades que abarcan banca minorista y comercial, seguros, pensiones e
    inversiones. Entre sus productos se incluyen cuentas corrientes y de ahorro e
    hipotecas.


    El grupo capta depósitos y financiación mayorista, evalúa y gestiona riesgos crediticios
    y distribuye préstamos, cuentas, seguros y productos de inversión mediante sus
    marcas y canales de servicio. Su desempeño está expuesto a las condiciones económicas
    y financieras del Reino Unido.


    La información disponible no permite cuantificar la contribución de cada segmento
    ni identificar con precisión las marcas y canales de distribución relevantes.


    **Compañías del sector incluidas en la wiki:** [[HSBC]], [[ING]], [[JPM]], [[C]],
    [[IBN]], [[ITUB]], [[KB]], [[BSBR]], [[AIG]], [[AXP]], [[AEG]] y [[BX]]. La lista
    de entrada contenía duplicados de algunas compañías.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    - Ingresos derivados de depósitos, préstamos y otros servicios bancarios.

    - Banca minorista para hogares y clientes particulares, incluida la actividad
    hipotecaria.

    - Servicios bancarios para empresas, incluidas pequeñas y medianas empresas.

    - Actividades de seguros, pensiones e inversiones.


    No se proporcionan datos que permitan desglosar ingresos por producto, segmento
    o fuente, ni evaluar su sensibilidad a los tipos de interés.


    ### Moat y posición competitiva


    La evaluación de investigación describe ventajas potenciales basadas en una amplia
    base de clientes, marcas reconocidas, escala, relaciones de depósitos y distribución
    multicanal. La evaluación clasifica la amplitud del moat como **estrecha** y la
    posición competitiva como **líder**; ambas son valoraciones cualitativas del paquete
    de investigación, no mediciones verificadas con datos comparativos.


    La banca británica se caracteriza como madura, competitiva y fuertemente regulada.
    La digitalización puede afectar la distribución y la competencia. El desempeño
    del grupo también depende de los tipos de interés, el empleo, los precios inmobiliarios
    y la morosidad. No se aporta evidencia comparativa suficiente para medir ventajas
    de costes, cuota de mercado o retención de clientes frente a [[HSBC]], [[ING]]
    u otros pares.


    ## 3. Perfil Financiero


    Las cifras de esta sección proceden de inputs de investigación y no incluyen,
    en todos los casos, fecha, definición o serie histórica. No deben interpretarse
    como métricas comparables o validadas sin revisar sus fuentes y metodología.


    | Métrica | Valor reportado | Período / limitación |

    |---|---:|---|

    | Crecimiento de ingresos | 11,96% | Se facilitó sin período ni definición |

    | Margen operativo | 42,94% | Se facilitó sin período ni definición |

    | ROIC | 13,21% | Se facilitó sin período ni definición |

    | PER | 9,58 | Sin fecha ni definición; no permite concluir que haya descuento
    |

    | EV/EBITDA | 0 | Valor facilitado; utilidad y definición no aclaradas |

    | FCF yield | 0 | Valor facilitado; metodología no aclarada |

    | FCF | Negativo en FY2024, FY2025 y TTM | Reporte de Stock Analysis; la definición
    y composición no se aportan |

    | Current ratio | 0 al 2026-09-30 | Reporte de Stock Analysis sin componentes;
    no se asume que sea una medida adecuada para un banco |

    | Precio de la acción | USD 5,415 al 2026-10-26 | Dato reportado por el paquete;
    convención y fuente deben verificarse |


    La evaluación AOIF califica la tendencia financiera como **estable**, pero señala
    que faltan período, definición y serie histórica para contextualizar las cifras
    de crecimiento, margen y ROIC. La evaluación DDD no calcula el CAGR de ingresos
    por falta de referencias explícitas a los inputs utilizados. Tampoco calcula crecimiento
    del FCF: los valores históricos necesarios no se proporcionaron y la fórmula configurada
    requiere FCF comparable y positivo en ambos períodos.


    **Capital y estructura financiera:** no se aportan datos de capital regulatorio,
    acciones diluidas, endeudamiento comparable, valor contable tangible ni calidad
    de activos. El FCF convencional requiere especial cautela en un banco porque depósitos,
    préstamos y otros flujos financieros no son directamente comparables con los de
    una empresa industrial.


    ## 4. Management y Gobierno Corporativo


    La evaluación AOIF califica la calidad del management como **regular**, la asignación
    de capital como **neutral** y el alineamiento de insiders como **débil**. Estas
    valoraciones se presentan sin datos verificables sobre resultados frente a objetivos,
    remuneración, participación accionarial de directivos o decisiones recientes de
    capital.


    No se aportan nombres ni composición del board, historial de gobierno corporativo,
    política de incentivos o datos de propiedad de insiders. Por tanto, estas dimensiones
    no pueden evaluarse independientemente con la evidencia disponible.


    ## 5. Tesis de Inversión


    ### Caso alcista a investigar


    La tesis de investigación es si la franquicia bancaria minorista y comercial de
    Lloyds, junto con sus actividades de seguros, pensiones e inversiones en Reino
    Unido, puede sostener crecimiento rentable. La escala, la base de clientes, las
    relaciones de depósitos y la distribución multicanal podrían apoyar la competitividad,
    según la evaluación cualitativa de AOIF.


    Como referencias incompletas, AOIF reporta crecimiento de ingresos de 11,96%,
    margen operativo de 42,94% y ROIC de 13,21%, pero no especifica períodos ni definiciones.
    Por ello, no prueban por sí solos crecimiento orgánico, calidad de ingresos ni
    retornos sostenibles sobre el capital.


    El precio reportado avanzó 15,2128% en los 12 meses terminados el 2026-10-26,
    con un drawdown informado de 13,7739% en el período. Estas observaciones describen
    el comportamiento pasado de la acción y no establecen una relación con el valor
    intrínseco ni la rentabilidad futura.


    **Estado de la tesis:** requiere investigación adicional. El paquete clasifica
    la oportunidad como `RESEARCH_REQUIRED`; la recomendación AOIF queda como `PENDIENTE_DECISION_BOARD`.
    El score general DDD es 55 y no debe interpretarse como una decisión de inversión.


    ## 6. Riesgos y Contra-Tesis


    ### Riesgos principales


    - **Riesgo macroeconómico y crediticio:** un deterioro del empleo, la economía
    o la capacidad de pago de hogares y empresas podría aumentar los impagos y las
    pérdidas crediticias. AOIF lo califica de impacto alto y probabilidad media.

    - **Exposición inmobiliaria:** la actividad hipotecaria y la financiación vinculada
    a bienes raíces exponen al grupo a cambios en los precios inmobiliarios y el desempeño
    de prestatarios. AOIF califica este riesgo como de impacto alto y probabilidad
    media.

    - **Sensibilidad a tasas y entorno competitivo:** la banca británica se describe
    como sensible a los tipos de interés, la actividad económica y la morosidad, y
    expuesta a competencia y digitalización.

    - **Interpretación de flujos de caja:** Stock Analysis reporta FCF negativo en
    FY2024, FY2025 y TTM. Sin definiciones ni conciliación con flujos bancarios y
    capital regulatorio, no se puede concluir qué implica para la capacidad económica
    del grupo.

    - **Datos insuficientes de capital y activos:** no se aportan capital regulatorio,
    morosidad, provisiones, coste de riesgo ni series de acciones diluidas. Esto impide
    evaluar adecuadamente solvencia, calidad de activos y dilución.

    - **Riesgo de valoración:** el consenso de analistas y el precio observado no
    prueban que el mercado esté subestimando o sobrestimando la capacidad de generar
    retornos.


    ### Contra-tesis y falsadores


    La tesis de crecimiento rentable se debilitaría si una serie financiera comparable
    mostrara deterioro sostenido de ingresos o beneficio frente a las cifras históricas
    reportadas. También la debilitaría evidencia verificable de erosión competitiva,
    deterioro de calidad de activos o insuficiencia de capital. El paquete no aporta
    esos datos y, por tanto, ninguno de esos resultados puede confirmarse o descartarse.


    ## 7. Catalizadores y Timeline


    | Evento | Fecha esperada | Impacto potencial | Evidencia / limitación |

    |---|---|---|---|

    | Publicación de resultados comparables posteriores al 2026-09-30 | Sin fecha
