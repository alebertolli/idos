    ## 8. Marco de Valoración


    No es posible estimar el valor intrínseco con rigor a partir de la información
    disponible. El PER reportado de 9,58 carece de fecha y definición, y no basta
    por sí solo para concluir que la acción esté infravalorada. El rango de objetivos
    de analistas es una referencia de mercado, no una estimación independiente del
    valor.


    Para un banco, el análisis debería priorizar métricas y métodos compatibles con
    su estructura financiera, entre ellos:


    - Rentabilidad sobre patrimonio (ROE) y, si se dispone de una definición comparable,
    ROIC.

    - Valor contable tangible y múltiplos frente a pares y al historial de la compañía.

    - Beneficio normalizado, coste del capital y capacidad sostenible de distribución
    a accionistas.

    - Capital regulatorio, calidad de activos, provisiones y coste de riesgo.

    - Sensibilidad de ingresos y márgenes a distintos escenarios de tipos de interés.


    No se presentan supuestos cuantitativos ni análisis de sensibilidad porque faltan
    series de beneficio y capital, previsiones, métricas regulatorias y una fecha
    de valoración consistente. El margen de seguridad se considera **insuficiente**
    en la evaluación AOIF, que señala que el valor intrínseco no es estimable con
    los datos aportados.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuáles son el capital regulatorio y su evolución, la rentabilidad sobre el
    capital, el coste de riesgo, la morosidad y las provisiones en períodos comparables?

    2. ¿Cómo han evolucionado los ingresos, el margen de intereses, el beneficio y
    el balance con definiciones consistentes?

    3. ¿Cuál es la sensibilidad de ingresos y márgenes a cambios en los tipos de interés?

    4. ¿Cómo se distribuyen los ingresos y beneficios entre banca minorista, comercial,
    seguros, pensiones e inversiones?

    5. ¿Cuál es la exposición hipotecaria y cómo se comportan los prestatarios vulnerables
    ante cambios en empleo, ingresos y precios inmobiliarios?

    6. ¿Qué definición, unidad monetaria y composición utiliza la fuente para el FCF
    bancario, y cómo se reconcilia con flujos operativos y capital regulatorio?

    7. ¿Cuál es la serie comparable de acciones diluidas y existe evidencia de dilución
    relevante?

    8. ¿Cómo se comparan cuota de mercado, coste de financiación, escala, retención
    de clientes y distribución con bancos pares como [[HSBC]], [[ING]] y [[JPM]]?

    9. ¿Qué datos verificables respaldan las valoraciones de calidad del management,
    alineamiento de insiders y asignación de capital?

    10. ¿Cuál es una base consistente para valorar la compañía —incluidos fecha de
    precio, beneficio normalizado, valor contable tangible, coste del capital y previsiones—
    y qué escenarios de tipos y pérdidas crediticias deberían utilizarse?


