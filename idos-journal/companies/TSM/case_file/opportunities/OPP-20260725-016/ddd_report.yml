resumen_ejecutivo: 'TSMC es el pilar fundamental de la era de la Inteligencia Artificial.
  Su ventaja tecnológica y escala crean un moat casi impenetrable. Sin embargo, la
  inversión es una apuesta dual: la excelencia operativa de la empresa frente al riesgo
  sistémico de su ubicación geográfica. El análisis muestra un negocio con salud financiera
  impecable y crecimiento robusto, pero con una valoración que ya reconoce gran parte
  del riesgo geopolítico.'
