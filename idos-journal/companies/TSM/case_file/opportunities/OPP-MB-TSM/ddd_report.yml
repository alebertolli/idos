    | La comparación con FY 2023–FY 2025 se atribuye a StockAnalysis, pero no se incluye
    la serie completa. |

    | Actualización verificable de expectativas de demanda, márgenes e inversión |
    Sin fecha indicada | Podría modificar la lectura de crecimiento y de la brecha
    entre precio y consenso | DDD señala que el paquete no aporta guía de management.
    |

    | Cotización observada | 2026-10-30 | Referencia de mercado para seguimiento,
    no catalizador operativo | USD 406,13, según DDD. |

    | Consenso de precio objetivo reportado | 2026-11-20 | Referencia de expectativas
    de mercado; no prueba de valor intrínseco | USD 586,69; rango USD 440–1.000, según
    DDD. |


    No se incluyen fechas confirmadas para eventos corporativos específicos. Los catalizadores
    anteriores son hitos de verificación, no anuncios de eventos con calendario conocido.


    ## 8. Marco de Valoración


    La valoración intrínseca **no puede estimarse con rigor** a partir del paquete
    disponible. AOIF declara insuficientes los datos para estimarla; faltan precio
    y fecha de referencia comparables para sus múltiplos, previsiones de flujo de
    caja, inversión futura, costo de capital y supuestos de crecimiento.


    **Metodología apropiada para una investigación posterior:**


    1. **Flujo de caja descontado (DCF):** estimar ingresos, márgenes, impuestos,
    capex, capital de trabajo y FCF en distintos escenarios; descontarlos con un costo
    de capital explícito y justificar el valor terminal.

    2. **Valoración relativa:** comparar múltiplos con compañías pertinentes de la
    industria y la cadena de valor, teniendo en cuenta diferencias de modelo de negocio,
    crecimiento, capital requerido y exposición geopolítica. Compañías como [[ASML]],
    [[AMAT]], [[AMD]] y [[AVGO]] pueden servir como referencias sectoriales con cautela;
    no son comparables directos por el solo hecho de pertenecer al ecosistema.

    3. **Análisis de escenarios:** distinguir escenarios de demanda, utilización de
    capacidad, márgenes e inversión; no tratar los valores de consenso como sustituto
    de supuestos propios.


    **Sensibilidades que deben cuantificarse:** crecimiento de ingresos, margen bruto
    y operativo, conversión de beneficios a FCF, capex, utilización de capacidad,
    costo de capital y crecimiento terminal. Sin estos inputs no es posible estimar
    un rango de valor intrínseco ni un margen de seguridad.


    El consenso de USD 586,69 frente a la cotización de USD 406,13 es una brecha entre
    observaciones de mercado en fechas distintas —2026-11-20 y 2026-10-30—, no una
    comparación con valor intrínseco. DDD concluye que no se ha validado que el mercado
    esté equivocado. AOIF también califica el margen de seguridad como insuficiente,
    aunque no aporta detalle de cálculo verificable.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué mercado direccionable, penetración y demanda futura respaldan las expectativas
    de crecimiento de TSMC, y qué porción de los ingresos se relaciona con cada mercado
    final?

    2. ¿Cuál es la serie verificable de ingresos, márgenes y capex por período, y
    cómo se reconcilia con las cifras de crecimiento y rentabilidad reportadas por
    AOIF?

    3. ¿Cuáles son el capital invertido y los retornos sobre capital en períodos comparables?
    ¿Cómo se calculó el ROIC de 60,3% reportado por AOIF?

    4. ¿Cuál es el FCF histórico y proyectado, cómo se define el rendimiento de FCF
    de AOIF y cómo se reconcilia con el crecimiento de FCF de 65,96% reportado por
    DDD?

    5. ¿Cuál es el plan de inversión futura en capacidad, cómo se financia y qué retornos
    se esperan de esa inversión?

    6. ¿Qué datos respaldan la evaluación de moat amplio, posición líder, calidad
    de management y asignación de capital creadora de valor?

    7. ¿Cuál es la evolución histórica de acciones en circulación, compensación basada
    en acciones y dilución?

    8. ¿Quiénes son los principales ejecutivos y miembros del board, cómo se estructuran
    los incentivos y qué evidencia respalda la evaluación de alineamiento débil de
    insiders?

    9. ¿Qué supuestos y horizontes sustentan el consenso de precio objetivo de USD
    586,69 y su rango de USD 440–1.000?

    10. ¿Cómo afectarían escenarios de tensión geopolítica, restricciones de exportación
    o interrupción logística a operaciones, clientes y generación de caja?


