  existing_wiki: '## 1. Visión General de la Compañía


    Taiwan Semiconductor Manufacturing Company Limited (TSMC) es una fundición de
    semiconductores que fabrica, empaqueta, prueba y vende circuitos integrados diseñados
    principalmente por sus clientes. Su actividad combina I+D, construcción y operación
    de plantas, adquisición de equipos y materiales especializados, y procesamiento
    de obleas según las especificaciones de cada cliente.


    La empresa opera en el sector de semiconductores, una industria cíclica e intensiva
    en capital. Sus clientes y mercados finales incluyen empresas de computación de
    alto rendimiento y centros de datos, así como diseñadores de procesadores y chips
    para teléfonos inteligentes. La operación descrita se concentra en Taiwán, por
    lo que las tensiones geopolíticas en torno a la isla constituyen un riesgo relevante.


    Entre las compañías relacionadas por sector y cadena de valor están [[ASML]],
    [[AMAT]], [[AMD]], [[ARM]], [[AVGO]] y [[ADI]]. Estas relaciones reflejan exposición
    a la industria de semiconductores; no implican que todas sean competidores directos
    de TSMC.


    ## 2. Modelo de Negocio y Posición Competitiva


    **Modelo de negocio:** TSMC fabrica chips para clientes que, principalmente, diseñan
    sus propios productos. Los procesos descritos incluyen fabricación de obleas mediante
    CMOS y lógica avanzada, además de procesos de señal mixta, radiofrecuencia, memoria
    integrada y BiCMOS. La compañía también ofrece empaquetado y pruebas.


    **Drivers de ingresos potenciales:** demanda de computación de alto rendimiento,
    centros de datos e inteligencia artificial; teléfonos inteligentes; y, en términos
    más amplios, aplicaciones de automoción e IoT. La información recibida identifica
    estos mercados como motores de la industria, pero no aporta estimaciones de mercado
    direccionable, penetración ni demanda futura que permitan cuantificar su contribución
    al crecimiento de TSMC.


    **Ventajas competitivas descritas:** escala, conocimiento acumulado de fabricación,
    ejecución y rendimientos de producción, inversión de capital, capacidad tecnológica
    y confianza de los clientes. AOIF caracteriza la amplitud del moat como «amplio»
    y la posición competitiva como «líder». Estas son evaluaciones analíticas del
    paquete de investigación; no se acompañan de métricas comparables de cuota, rendimientos
    o costos que permitan verificarlas independientemente.


    **Dinámica competitiva:** la industria requiere inversión elevada y compite mediante
    capacidades tecnológicas y ejecución de fabricación. La demanda es cíclica, mientras
    que las inversiones en plantas y equipos comprometen capital por períodos prolongados.
    [[ASML]] y [[AMAT]] se relacionan con la cadena de suministro de equipos; [[AMD]],
    [[ARM]] y [[AVGO]] son compañías del ecosistema de diseño de semiconductores.
    No se aportan datos para comparar directamente sus capacidades con las de TSMC.


    ## 3. Perfil Financiero


    Las cifras siguientes proceden de los inputs de investigación. Cuando no se proporciona
    definición, período comparable o reconciliación, se señala expresamente.


    | Métrica | Valor reportado | Período / referencia | Observación |

    |---|---:|---|---|

    | Crecimiento de ingresos | 36,17% | No especificado en AOIF | Falta validar período,
    definición y fuente de cálculo. DDD señala crecimiento histórico entre FY 2022
    y FY 2025, sin aportar aquí la serie numérica. |

    | Margen operativo | 57,96% | No especificado en AOIF | Requiere validar período
    y fuente. |

    | ROIC | 60,3% | No especificado en AOIF | Requiere validar metodología, período
    y comparabilidad. |

    | Margen bruto TTM | 65,85% | 2026-09-30 | Reportado por DDD; supera los valores
    FY 2023–FY 2025 según la investigación, cuya serie completa no se incluye. |

    | Crecimiento del FCF | 65,96% | TTM, hasta 2026-09-30 | Valor reportado; la fuente
    no detalla la base exacta ni permite reconciliarlo con otra métrica de FCF. |

    | FCF / rendimiento de FCF | 0 | AOIF; período no especificado | No se proporcionan
    definición, cifras de flujo de caja operativo ni capex suficientes para evaluar
    la conversión. No debe interpretarse como una medición verificable del FCF generado.
    |

    | Current ratio | 2,58x | 2026-09-30 | Reportado por StockAnalysis; superior al
    umbral de alerta de 0,5x usado en el análisis. |

    | PER | 21,59x | AOIF; fecha no especificada | No se proporciona precio y fecha
    de referencia comparables. |

    | EV/EBITDA | 13,15x | AOIF; fecha no especificada | No se proporcionan inputs
    ni período suficientes para verificar el cálculo. |


    **Tendencia y calidad de la evidencia:** DDD observa crecimiento de ingresos entre
    FY 2022 y FY 2025 y una mejora reciente del margen bruto. También reporta inversión
    relevante en capacidad, pero no incluye una serie reconciliada de capex. AOIF
    califica la tendencia financiera como «mejorando», aunque los períodos y referencias
    de varias métricas no están especificados. Estas observaciones son compatibles
    con expansión, pero por sí solas no demuestran que el crecimiento o la mejora
    de márgenes sean sostenibles.


    **Estructura de capital y dilución:** no se aportan datos suficientes para evaluar
    la estructura de capital, los retornos sobre capital por períodos comparables
    o la dilución histórica. DDD indica que la dilución interanual no es evaluable
    por falta de historial comparable de acciones; esto no constituye evidencia de
    que se haya superado un umbral de dilución.


    **Fuentes financieras:** [StockAnalysis — Financials](https://stockanalysis.com/stocks/tsm/financials/)
    y [StockAnalysis — Statistics](https://stockanalysis.com/stocks/TSM/statistics/).
    DDD atribuye a estas fuentes los datos financieros y de mercado citados, pero
    no suministra en el paquete las series completas.


    ## 4. Management y Gobierno Corporativo


    AOIF califica la calidad del management como «buena» y la asignación de capital
    como creadora de valor. También califica el alineamiento de insiders como «débil».
    El paquete no incluye la metodología, los períodos ni los datos subyacentes de
    estas evaluaciones.


    No se suministran nombres o historial de los principales ejecutivos, composición
    del board, propiedad de insiders, remuneración, objetivos de incentivos ni historial
    detallado de asignación de capital. Por lo tanto, las valoraciones de calidad,
    asignación y alineamiento deben tratarse como evaluaciones pendientes de validar,
    no como conclusiones verificadas.


    ## 5. Tesis de Inversión


    ### Caso alcista


    - **Posición de fundición líder:** AOIF describe a TSMC como líder, con escala
    y capacidades avanzadas de fabricación. El moat propuesto se basa en experiencia
    de proceso, ejecución, rendimientos de producción, inversión intensiva en capital
    y confianza de los clientes.

    - **Exposición a mercados de crecimiento:** la base de clientes descrita incluye
    computación de alto rendimiento, centros de datos y teléfonos inteligentes. La
    industria también está expuesta a inteligencia artificial, automoción e IoT. El
    paquete no cuantifica cuánto de los ingresos de TSMC depende de cada mercado ni
    cuánto crecimiento podrían aportar.

    - **Indicios de expansión financiera:** DDD reporta crecimiento de ingresos entre
    FY 2022 y FY 2025 y un margen bruto TTM de 65,85% al 2026-09-30, superior a los
    valores FY 2023–FY 2025. Si estas tendencias se confirman en resultados futuros,
    podrían respaldar la tesis de expansión del negocio y mejora de rentabilidad.

    - **Liquidez corriente:** el current ratio reportado de 2,58x al 2026-09-30 supera
    el umbral de alerta configurado por DDD. Es una observación puntual y no sustituye
    el análisis de liquidez, deuda y necesidades de inversión.

    - **Valoración de mercado como referencia, no como valor intrínseco:** al 2026-10-30
    se reportó una cotización de USD 406,13; al 2026-11-20, un consenso de precio
    objetivo de USD 586,69, con rango de USD 440–1.000. La diferencia no demuestra
    por sí sola que la acción esté infravalorada: las fechas difieren y no se aportan
    horizonte, supuestos ni una valoración propia verificable.


    ### Estado de la tesis


    La evidencia disponible es compatible con un negocio de escala y con crecimiento
    e incremento reciente del margen bruto. Sin embargo, la tesis sigue **pendiente
    de validar**: faltan datos comparables de retornos sobre capital, conversión de
    FCF, inversión futura, sostenibilidad de márgenes y demanda final. DDD clasifica
    la oportunidad como investigación fundamental pendiente de validar; AOIF deja
    la recomendación pendiente de decisión del board.


    ## 6. Riesgos y Contra-Tesis


    - **Riesgo geopolítico — impacto alto, probabilidad media según AOIF:** tensiones
    en torno a Taiwán podrían interrumpir operaciones, suministro o transporte.

    - **Riesgo regulatorio y de exportación — impacto alto, probabilidad media según
    AOIF:** controles de exportación o cambios regulatorios podrían limitar el acceso
    a mercados, clientes o tecnología. Empresas expuestas a restricciones de la cadena
    de semiconductores, como [[ASML]], [[AMD]] y [[AVGO]], pueden compartir ciertos
    riesgos de industria, aunque el impacto específico en cada compañía no está establecido
    aquí.

    - **Ciclicidad e intensidad de capital:** una caída de demanda puede coincidir
    con una base elevada de costos e inversión. El paquete señala inversión relevante
    en capacidad, pero no aporta un presupuesto de capex ni proyecciones suficientes
    para medir el riesgo de exceso de capacidad.

    - **Sostenibilidad de crecimiento y márgenes no probada:** la concentración de
    la tesis en crecimiento y expansión de márgenes carece de evidencia sobre mercado
    direccionable, penetración, demanda futura y guía corporativa.

    - **FCF sin reconciliación:** DDD reporta crecimiento de FCF de 65,96%, mientras
    AOIF indica un rendimiento de FCF de 0; las definiciones, períodos y unidades
    no están conciliados. No es posible inferir de estos datos, por sí solos, la capacidad
    de conversión de beneficios a caja.

    - **Valoración no defendible con la información disponible:** los objetivos de
    consenso no son una estimación intrínseca comparable con la cotización sin horizonte
    ni supuestos confirmados.

    - **Dilución y retornos sobre capital pendientes:** no hay historial comparable
    suficiente de acciones ni datos de capital invertido y retornos por períodos equivalentes.


    **Triggers de falsación identificados:**


    1. Resultados futuros que contradigan la continuidad del crecimiento de ingresos
    observado entre FY 2022 y FY 2025.

    2. Caída persistente del margen bruto frente al 65,85% TTM reportado al 2026-09-30.


    ## 7. Catalizadores y Timeline


    | Catalizador / hito | Fecha esperada | Impacto potencial | Estado de la evidencia
    |

    |---|---|---|---|

    | Resultados futuros que permitan comprobar la continuidad del crecimiento de
    ingresos | Sin fecha indicada | Confirmar o debilitar el caso de expansión del
    negocio | DDD identifica el crecimiento histórico entre FY 2022 y FY 2025, pero
