dominio_esg_supply_chain:
  analisis: Al ser un negocio de plataforma tecnológica y red financiera, la dependencia
    de la cadena de suministro física es prácticamente nula. En el ámbito ESG, la
    gobernanza y la privacidad de datos/ciberseguridad son los focos principales.
    El riesgo reputacional por brechas de datos se gestiona con inversiones multimillonarias
    anuales en seguridad lógica. El mayor riesgo extra-financiero proviene del escrutinio
    regulatorio y político sobre las tarifas de intercambio (interchange fees).
  rating: bajo_riesgo
dominio_financial_health:
  analisis: El balance es extremadamente sólido con una ratio Deuda/Patrimonio de
    0.7x y una generación de flujo de caja libre altamente predecible y superior a
    los $20,000M anuales. La conversión de EBITDA a FCF supera habitualmente el 80%
    debido a las insignificantes necesidades de CAPEX intensivo (los gastos de capital
    representan <3% de las ventas).
  rating: fuerte
dominio_growth:
  analisis: 'El crecimiento futuro (+11.4% TTM) está respaldado por tres pilares estructurales:
    1) Transición continua de efectivo a digital en mercados emergentes (LATAM, CEMEA,
    SE Asia). 2) Nuevos Flujos de Pago (Visa Direct y B2B Commercial) que expanden
