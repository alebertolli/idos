  consenso_actual: 'El mercado descuenta que Visa seguirá creciendo a tasas de un
    dígito alto / doble dígito bajo impulsada por el consumo global y los servicios
    de valor añadido, pero le otorga un múltiplo limitado por temores estructurales:
