clasificacion_oportunidad:
  categoria: compounder
  categorias_descartadas: 'Compounder castigado: Aunque enfrenta escrutinio regulatorio
    continuo (como la demanda del DOJ), las acciones cotizan cerca de máximos históricos
    sin un descuento drástico. Quality at Fair Price: Podría calificar, pero su capacidad
    intrínseca de reinversión y expansión a nuevos flujos de pago la consolida como
    un Compounder puro de largo plazo.'
  justificacion: Visa es un monopolio duopólico maduro con un efecto de red de dos
    lados inexpugnable, márgenes operativos del 67%, ROIC del 54.3% y un crecimiento
    de ingresos constante superior al 10%. Es el ejemplo de libro de texto de un compounding
    machine de alta calidad.
dominio_business_quality:
  analisis: 'El moat de Visa se basa en un efecto de red de dos lados insuperable
    (miles de millones de tarjetas emitidas y decenas de millones de comercios adheridos
    a nivel global) operado a través de VisaNet. La ventaja de costes fijos es masiva:
    agregar una transacción adicional tiene un coste marginal cercano a cero, produciendo
    un margen operativo del 67%. Las barreras de entrada son astronómicas debido a
    la infraestructura tecnológica, los estándares de ciberseguridad, los acuerdos
    de patrocinio con instituciones financieras y la confianza de marca.'
