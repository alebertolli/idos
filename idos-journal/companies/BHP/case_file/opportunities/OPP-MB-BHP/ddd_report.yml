    | Crecimiento de ingresos a 3 años | No disponible | Hasta 30-jun-2026 | No calculable
    con evidencia verificable |

    | Crecimiento de FCF | No disponible | Hasta 30-jun-2026 | No calculable con evidencia
    verificable |


    El análisis AOIF califica la tendencia financiera como estable, pero no proporciona
    cifras de flujo de caja operativo, capex ni FCF suficientes para calcular la conversión
    a caja. El análisis DDD señala que ingresos y FCF habrían aumentado en FY 2026
    frente a FY 2025, pero faltan fuentes y desgloses que permitan confirmar el cambio
