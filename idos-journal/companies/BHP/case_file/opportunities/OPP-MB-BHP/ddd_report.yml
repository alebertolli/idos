    ## 8. Marco de Valoración


    ### Metodologías apropiadas


    - **Flujo de caja descontado (DCF) normalizado por ciclo:** requiere estimaciones
    verificables de producción, precios, costos, impuestos, capex de mantenimiento
    y crecimiento, capital de trabajo y tasa de descuento.

    - **Valoración por activos o segmentos:** puede ser útil para una minera diversificada,
    siempre que haya datos comparables de reservas, recursos, costos, vida útil y
    compromisos de capital por activo.

    - **Múltiplos comparables:** PER y EV/EBITDA pueden ofrecer referencias, pero
    requieren períodos consistentes, ajustes por ciclo y comparables pertinentes.


    ### Datos de valoración disponibles


    AOIF reporta PER de **18,5x**, EV/EBITDA de **6,47x** y FCF yield de **0%**, sin
    especificar fecha de referencia, período de beneficios, definición de FCF ni fuente.
    El valor intrínseco se considera no determinable en el propio análisis, entre
    otras razones por falta de precio y fecha de referencia, acciones diluidas y otros
    datos necesarios. La conclusión AOIF califica el margen de seguridad como insuficiente,
    pero no se proporciona el cálculo que sustenta esa evaluación.


    DDD presenta escenarios basados en el rango observado de objetivos de analistas:


    | Escenario | Precio objetivo | Interpretación del paquete |

    |---|---:|---|

    | Bajista | USD 67 | Extremo bajo del rango de objetivos observado |

    | Alcista | USD 96 | Extremo alto del rango de objetivos observado |


    Los escenarios están fechados **20-nov-2026**, en USD. Son referencias ancladas
    a objetivos de analistas, no valoraciones fundamentales independientes ni estimaciones
    verificadas de valor intrínseco. El paquete no facilita supuestos suficientes
    para construir una sensibilidad financiera robusta.


    ### Sensibilidades necesarias


    Una valoración futura debería mostrar cómo cambia el valor estimado ante variaciones
    en:


    1. Precios de cobre, mineral de hierro, carbón y otros productos.

    2. Volúmenes, costos unitarios y disponibilidad operativa.

    3. Capex de mantenimiento, expansión y compromisos por proyecto.

    4. Tipo de cambio, costo de capital y costo de deuda.

    5. Duración del ciclo y nivel de precios normalizado.


    ## 9. Preguntas Abiertas y Agenda de Investigación


