resumen_ejecutivo: 'BHP presenta exposición a negocios de recursos naturales y, por
  tanto, sensibilidad cíclica. La evidencia financiera disponible reporta FCF TTM
  de USD 11.52 mil millones y margen operativo TTM de 42.1%, pero no ofrece una serie
  histórica suficiente ni información completa de deuda, liquidez o valoración. La
  cotización de USD 68.955 queda por debajo del objetivo medio observado de USD 79.36,
  aunque dicho consenso es solo una referencia. La oportunidad es incierta: el descuento
  aparente puede reflejar riesgo de ciclo y no necesariamente una ineficiencia. Se
  requiere diligencia primaria sobre activos, costos, balance, asignación de capital,
  proyectos y riesgos operativos.'
