  descrito, pero la conclusión sobre valoración es incierta. La evidencia financiera
  estructurada aporta FCF TTM de 9.540 millones en la unidad reportada por el proveedor
  y margen operativo TTM de 34,85%, ambos al 2026-06-30 según stockanalysis.com; son
  observaciones de fuente única y no sustituyen una revisión de estados financieros
  primarios. La cotización y el consenso objetivo sugieren una brecha, pero no hay
  base para afirmar que sea una oportunidad de valor. Riesgos centrales por investigar:
  competencia por demanda y tráfico, regulación, sensibilidad de los viajes y sostenibilidad
  de la generación de caja.'
