resumen_ejecutivo: Biogen es una compañía biofarmacéutica con productos líderes en
  esclerosis múltiple y una creciente cartera en enfermedades raras. Genera fuerte
  flujo de caja libre y mantiene márgenes operativos robustos, aunque el crecimiento
  de ingresos es moderado (2.3% TTM). El consenso de analistas indica un upside moderado,
  pero la valoración parece no reflejar plenamente el potencial de sus próximos lanzamientos
  y biosimilares. El riesgo principal radica en la ejecución del pipeline y la competencia
  en el segmento de biosimilares.
