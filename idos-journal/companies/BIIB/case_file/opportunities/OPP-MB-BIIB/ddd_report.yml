    ## 8. Marco de Valoración


    La valoración de una biofarmacéutica debe considerar tanto la generación de caja
    de los productos comercializados como el valor ajustado por riesgo del pipeline.
    Una evaluación completa debería separar el negocio establecido, los biosimilares
    y los activos en desarrollo, y someter cada uno a escenarios de éxito clínico,
    aprobación, adopción y precios.


    **Puntos de referencia aportados**

    - DDD reporta un precio de referencia de **247 USD** y un precio objetivo promedio
    de analistas de **268.26 USD**, con rango de **175–350 USD**. No se adjuntaron
    fecha, enlaces ni metodología para verificar estas cifras.

    - AOIF estima un valor intrínseco de **180 USD**, con margen de seguridad “insuficiente”.

    - AOIF reporta EV/EBITDA de **13.07x**, P/E de **105.18x** y rendimiento de FCF
    de **0%**. No se aportan definiciones, cálculos ni datos subyacentes.

    - El escenario bajista de DDD es **175 USD** y el alcista **350 USD**, ambos con
    horizonte al 20 de noviembre de 2028.


    Estas referencias no son directamente comparables sin conocer sus fechas, supuestos
    y metodologías. En particular, el precio de 247 USD y los objetivos de analistas
    deben considerarse cifras del material recibido, no cotizaciones verificadas.
    La diferencia entre el valor intrínseco de 180 USD de AOIF y la opinión de “infravalorado”
    de DDD exige reconciliar las hipótesis sobre crecimiento, márgenes, riesgo regulatorio
    y valor del pipeline.


    **Sensibilidad cualitativa**

    - **Escenario favorable:** aprobación o resultados clínicos positivos, mayor adopción
    de productos nuevos y expansión de biosimilares.

    - **Escenario adverso:** retrasos o fracasos clínicos/regulatorios, baja adopción
    y mayor presión de precios.

    - **Variables que deben cuantificarse:** erosión de ingresos de productos establecidos,
    crecimiento y margen de biosimilares, gasto en I+D, flujo de caja libre normalizado,
    deuda neta y probabilidad de éxito de cada activo.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es la deuda neta de BIIB y cuál es su razón deuda neta/EBITDA? ¿Cómo
    se distribuyen los vencimientos?

    2. ¿Cuáles son los hitos y fechas esperadas exactas de SKYCLARYS y QALSODY, y
    cuál es el estado clínico o regulatorio de cada activo?

    3. ¿Qué productos y mercados explican el crecimiento de ingresos TTM del 2.3%,
