fundamentals:
  business_model: Harmony Gold Mining Company Limited engages in the exploration,
    extraction, and processing of mineral properties in South Africa, Papua New Guinea,
    and Australia. The company explores for gold, uranium, silver, and copper deposits.
    It has nine underground operations in the Witwatersrand Basin; the Kraaipan Greenstone
    Belt; and various surface source operations in South Africa. In addition, the
    company owns interests in the Hidden Valley, an open-pit gold and silver mine;
    and the Wafi-Golpu project located in Morobe Province in Papua New Guinea. Further,
    it holds interest in Eva Copper Project located in Queensland, Australia. Harmony
    Gold Mining Company Limited was incorporated in 1950 and is based in Randfontein,
    South Africa.
