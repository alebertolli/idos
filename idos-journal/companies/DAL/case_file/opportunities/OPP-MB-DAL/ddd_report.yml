    ## 4. Management y Gobierno Corporativo


    AOIF califica la calidad del management como **buena**, el alineamiento de insiders
    como **moderado** y la asignación de capital como **neutral**. El comentario del
    análisis relaciona la escala de la red y la diversificación hacia fidelización,
    mantenimiento y servicios complementarios con capacidad de gestión; no aporta
    evidencia reciente específica para comprobar esas valoraciones.


    No se proporcionan nombres de ejecutivos o consejeros, composición del board,
    participación accionaria de insiders, remuneración, incentivos, historial de asignación
    de capital ni fuentes verificables sobre gobierno corporativo. Estos aspectos
    requieren investigación adicional antes de extraer conclusiones.


    ## 5. Tesis de Inversión


    **Caso alcista — hipótesis sujeta a verificación:**


    - Delta cuenta con una red de rutas, hubs y conexiones que puede ofrecer ventajas
    de conveniencia y apoyar la demanda de clientes de ocio y corporativos.

    - El programa de fidelización, las alianzas y los servicios complementarios podrían
    diversificar la propuesta frente al transporte aéreo básico. El paquete no cuantifica
    cuánto aportan a los ingresos o a los márgenes.

    - Stock Analysis reporta ingresos de USD 71.8 mil millones TTM al 2026-09-30 y
    USD 63.364 mil millones en FY 2025. La diferencia es una observación entre períodos
    no equivalentes, no evidencia suficiente para establecer una tasa de crecimiento.

    - Stock Analysis reporta deuda total de USD 19.935 mil millones al 2026-09-30
    frente a USD 21.374 mil millones en FY 2025. Esto podría ser consistente con una
    reducción de deuda, pero las referencias de período y la comparabilidad deben
    comprobarse.

    - AOIF describe la calidad de la tendencia financiera como estable e incluye valores
    de crecimiento, margen operativo y ROIC; al no especificar períodos ni fuentes,
    estos datos no bastan para validar la calidad del crecimiento ni la reinversión.


    La tesis sigue siendo **no concluyente**: la escala de ingresos y la mención de
    FCF positivo no bastan para confirmar una oportunidad de crecimiento compuesto,
    la calidad del moat o retornos atractivos sobre el capital.


    ## 6. Riesgos y Contra-Tesis


    **Caso bajista y riesgos identificados:**


    - **Combustible y refinación:** AOIF considera de alto impacto y alta probabilidad
    el riesgo de aumentos del precio del combustible o deterioro de los márgenes de
    refinación.

    - **Demanda cíclica:** una recesión o caída de la demanda podría afectar viajes
    corporativos y de ocio, según el análisis AOIF.

    - **Competencia e intensidad de capital:** la competencia en precio y servicio,
    junto con la necesidad de financiar aeronaves e infraestructura, puede limitar
    la flexibilidad operativa.

    - **Liquidez corriente:** Stock Analysis reporta un current ratio de 0.4x al 2026-09-30,
    inferior al umbral de revisión de 0.5x señalado en DDD. Es una señal de revisión,
    no por sí sola una conclusión sobre solvencia.

    - **Deuda y cobertura:** se reportan deuda total de USD 19.935 mil millones y
    efectivo e inversiones de USD 3.787 mil millones al 2026-09-30. La cobertura de
    intereses reportada como 0 no está validada y requiere comprobar EBIT y gasto
    de intereses.

    - **Valoración no demostrada:** el amplio rango de objetivos de analistas y la
    falta de supuestos operativos verificables impiden concluir si la cotización incorpora
    expectativas excesivas o insuficientes.


    **Falsadores a monitorear:**


    1. Resultados comparables que muestren deterioro persistente de ingresos o FCF
    frente a los valores reportados al 2026-09-30.

    2. Aumento de deuda o deterioro de liquidez frente a las referencias reportadas
    al 2026-09-30.

    3. Evidencia futura de márgenes o retornos sobre capital insuficientes para sostener
    la tesis de ventajas de escala y red.

    4. Verificación de que la cobertura de intereses es débil una vez recalculada
    con datos de EBIT y gasto de intereses comparables.


    Los puntos 3 y 4 son criterios de seguimiento, no hechos confirmados sobre resultados
    futuros.


    ## 7. Catalizadores y Timeline


