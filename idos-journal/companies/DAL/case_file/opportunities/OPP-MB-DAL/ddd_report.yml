  existing_wiki: '## 1. Visión General de la Compañía


    **Delta Air Lines, Inc. (DAL)** es una aerolínea estadounidense que transporta
    pasajeros y carga en rutas nacionales e internacionales. Opera en una industria
    intensiva en capital y cíclica, expuesta a la demanda de viajes, los precios del
    combustible, los salarios y las condiciones económicas.


    La cadena de valor comprende la financiación y operación de aeronaves, la compra
    de combustible, la contratación de personal y la planificación de rutas, capacidad
    y precios. La compañía vende transporte aéreo y servicios relacionados a viajeros
    de ocio y corporativos, además de servicios de carga. La investigación describe
    segmentos denominados *Airline* y *Refinery*, pero no aporta cifras comparables
    por segmento.


    Entre las compañías identificadas en la misma industria o sector figuran [[ASR]],
    [[CAAP]], [[CAR]] y [[CAT]]. La información disponible no establece comparaciones
    operativas directas con ellas.


    ## 2. Modelo de Negocio y Posición Competitiva


    Las principales fuentes de ingresos descritas son el transporte de pasajeros y
    de carga. La red de hubs, los horarios, la flota, las alianzas, la conectividad
    internacional y el programa de fidelización pueden contribuir a la conveniencia
    para los clientes y a la diferenciación del servicio. La investigación también
    menciona ingresos complementarios relacionados con fidelización, mantenimiento
    y otros servicios, pero no cuantifica su contribución.


    La evaluación AOIF caracteriza la posición competitiva como **líder** y el moat
    como **estrecho**, atribuyéndolo a escala, marca, red y fidelización. Estas son
    evaluaciones del análisis recibido; no se acompañan de datos verificables sobre
    cuota de mercado, retornos de capital o costes de cambio.


    La industria presenta competencia en precio y servicio, y la capacidad no siempre
    puede ajustarse rápidamente. Los factores operativos señalados incluyen combustible,
    salarios, tipos de cambio y demanda. Entre los pares listados en la wiki existente
    se encuentran [[ASR]], [[CAAP]], [[CAR]] y [[CAT]].


