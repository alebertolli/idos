    ## 8. Marco de Valoración


    La valoración no puede estimarse con rigor a partir de la información disponible.
    AOIF indica que faltan precio y capitalización de referencia, deuda neta, FCF
    normalizado, previsiones y supuestos de valoración. Los múltiplos PER de 15.86x
    y EV/EBITDA de 9.27x carecen de fecha y fuente especificadas, y el FCF yield informado
    como 0 requiere aclarar período, definición y cálculo.


    **Metodología apropiada para una investigación posterior:**


    - Normalizar el FCF a través de períodos comparables, considerando la naturaleza
    cíclica del negocio.

    - Contrastar una valoración por flujo de caja con múltiplos de empresas comparables
    y con la evolución histórica de márgenes y deuda.

    - Separar los supuestos operativos —demanda, capacidad, precios, combustible,
    costes laborales y márgenes— de los supuestos financieros y de valoración.

    - Verificar períodos, definiciones y fuentes de cada múltiplo antes de utilizarlos.


    Los objetivos de analistas reportados el 2026-11-20 son referencias observadas,
    no valor intrínseco validado. El objetivo medio y mediano de USD 101.65 y el rango
    de USD 53–125 no especifican horizonte; la cotización de USD 78.95 corresponde
    al 2026-10-30. No se puede evaluar el margen de seguridad ni hacer una sensibilidad
    cuantitativa fiable sin previsiones y supuestos comparables.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es la cuota de mercado de Delta y cómo ha evolucionado frente a competidores,
    con períodos y fuentes comparables?

    2. ¿Qué tamaño tiene el mercado direccionable relevante, qué penetración presenta
    y qué retornos obtiene Delta sobre el capital invertido?

    3. ¿Qué parte de los ingresos y beneficios procede de pasajeros, carga, fidelización,
    mantenimiento y otros servicios complementarios?

