    ## 8. Marco de Valoración


    La información disponible no permite estimar rigurosamente el valor intrínseco
    ni establecer un margen de seguridad. AOIF reporta los siguientes múltiplos, pero
    el extracto no especifica su fecha o base exacta:


    | Métrica de valoración | Valor reportado | Limitación |

    |---|---:|---|

    | P/E | 20,97x | Sin fecha, base de beneficios ni supuestos de crecimiento documentados
    en los inputs. |

    | EV/EBITDA | 11,32x | Sin período de EBITDA ni conciliación de deuda neta documentados.
    |

    | FCF yield | 0% | AOIF señala que el valor no permite estimar el rendimiento:
    faltan datos y una base comparable. No debe interpretarse como una medición concluyente.
    |


    **Metodología apropiada para investigación posterior:** combinar una valoración
    por flujos de caja descontados con una comprobación relativa mediante múltiplos.
    En ambos casos se necesitan períodos comparables y supuestos explícitos. Las variables
    centrales serían crecimiento orgánico, volúmenes, inflación y mezcla, márgenes,
    conversión de beneficios en FCF, capex, capital incremental, deuda neta y tasa
    de descuento.


    **Sensibilidad pendiente:** evaluar escenarios de menor o mayor crecimiento orgánico,
    presión o expansión de márgenes y diferentes niveles de inversión en capital.
    No se calculan escenarios cuantitativos porque los inputs no incluyen series completas
    de FCF, deuda neta conciliada, supuestos de crecimiento ni tasa de descuento.


    DDD informa un precio de cierre de USD 82,90 al 2026-10-30 y un consenso de precio
    objetivo de USD 91,25 al 2026-11-20, con rango de USD 78 a USD 102. El propio
    análisis advierte que las fechas son distintas y que el rango de analistas es
    una referencia observada, no una estimación de valor intrínseco. La conclusión
    disponible es que **no se valida un error de valoración** y que AOIF considera
    insuficiente la evidencia para afirmar que existe un margen de seguridad adecuado.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. **ROIC y capital incremental:** ¿Cuál es el ROIC calculado sobre una definición
    consistente y cómo evoluciona? ¿Cuánto capital incremental exige el crecimiento?

    2. **Crecimiento orgánico:** ¿Qué parte del crecimiento proviene de volumen, precios,
    inflación, mezcla, adquisiciones u otros factores?

    3. **Segmentos y geografía:** ¿Cuál es la estructura oficial de segmentos y cómo
    se reconcilia la referencia a dos segmentos operativos con la mención de cuatro
    segmentos reportados?

    4. **Conversión de caja:** ¿Cuáles son el flujo de caja operativo, capex, beneficio
    neto y FCF en períodos comparables? ¿Qué explica la variabilidad entre FY 2024,
    FY 2025 y FY 2026?

    5. **Calidad del FCF TTM:** ¿Cómo se compara el TTM al 2026-09-26 con un TTM equivalente
    anterior y con los ejercicios fiscales completos?

    6. **Deuda y flexibilidad financiera:** ¿Cuál es la deuda neta conciliada, su
    calendario de vencimientos y el costo de financiación? ¿Cómo se calcula exactamente
    deuda neta/EBITDA?

    7. **Moat y competencia:** ¿Hay evidencia cuantitativa de ventajas de costo, retención
    de clientes, densidad de rutas o poder de negociación frente a distribuidores
    rivales?

    8. **Management y gobierno:** ¿Cuál es el historial del equipo directivo y del
    board, la política de remuneración, el nivel de propiedad de insiders y el historial
    de asignación de capital?

    9. **Valoración:** ¿Qué fechas y definiciones sustentan P/E de 20,97x y EV/EBITDA
    de 11,32x? ¿Qué supuestos harían que el valor estimado supere el precio de mercado
    con margen de seguridad?

    10. **Próximos hitos:** ¿Cuándo se publicarán los próximos resultados y qué métricas
    comparables permitirán comprobar crecimiento orgánico, márgenes, FCF y ROIC?


