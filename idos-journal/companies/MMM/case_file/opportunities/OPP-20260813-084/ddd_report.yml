  business_model: '3M Company provides diversified technology services in the America,
    the Asia Pacific, Europe, the Middle East, Africa, and internationally. It operates
    through three segments: Safety and Industrial, Transportation and Electronics,
    and Consumer. The Safety and Industrial segment provides industrial abrasives
    and finishing for metalworking applications; autobody repair solutions; industrial
    specialty products, such as personal hygiene products, masking, and packaging
    materials; electrical products and materials for construction and maintenance,
    power distribution, and electrical original equipment manufacturers; structural
    adhesives and tapes; respiratory, hearing, eye, and fall protection solutions;
    and natural and color-coated mineral granules for shingles. The Transportation
    and Electronics segment provides ceramic solutions; attachment and bonding, films,
    sound, and temperature management for transportation vehicles; format graphic
    films for advertising and fleet signage; reflective signage for highway and vehicle
    safety; light management films and electronics assembly solutions; chip packaging
    and interconnection solutions; semiconductor production materials; and data center
    solutions. The Consumer segment offers cleaning products for the home; consumer
    air quality products; picture hanging accessories; retail abrasives, paint accessories,
    and safety products; stationery and office products; automotive appearance products;
    and consumer bandages, tapes, braces, and supports. It serves automotive; commercial
    solutions; consumer markets; design and construction; electronics; energy; government;
    manufacturing; safety; transportation industries. The company offers its products
    through e-commerce and traditional wholesalers, retailers, jobbers, distributors,
    channel partner, and dealers, as well as directly to users. 3M Company was founded
    in 1902 and is headquartered in Saint Paul, Minnesota.'
