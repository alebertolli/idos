resumen_ejecutivo: Apple Inc. (AAPL) sigue siendo uno de los monopolios de facto de
  consumo más rentables de la historia moderna, con un ROIC de 101.6% y un margen
  operativo del 33.2%. No obstante, a 36.3x PER y 27.1x EV/EBITDA, la valoración descuenta
  un ciclo perfecto de adopción de IA en hardware e inmunidad regulatoria. Para una
  Family Office, AAPL califica como un activo 'core' de preservación y retención si
  ya se posee, pero no ofrece margen de seguridad suficiente para nuevas asignaciones
  de capital tácticas en este momento.
