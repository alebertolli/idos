dominio_esg_supply_chain:
  analisis: Punto más vulnerable de la tesis. Extrema concentración de manufactura
    y empaquetado en Taiwán (TSMC para Apple Silicon) y ensamblaje final en China
    continental (Foxconn, Luxshare). Aunque la diversificación a India y Vietnam avanza,
    cualquier escalada militar o bloqueo comercial en el estrecho de Taiwán paralizaría
    de forma inmediata e insustituible la producción de hardware de Apple.
  rating: alto_riesgo
dominio_financial_health:
  analisis: Balance sumamente robusto con generación de caja operativa colosal. Aunque
    la métrica de entrada muestra FCF Yield 0 (anomalía de reporte puntual), la conversión
