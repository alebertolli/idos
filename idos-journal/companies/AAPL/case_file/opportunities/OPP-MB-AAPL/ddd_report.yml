  existing_wiki: "## 1. Visión General de la Compañía  \n**Apple Inc. (AAPL)** es\
    \ una empresa tecnológica global que diseña, fabrica y comercializa dispositivos\
    \ de consumo premium (iPhone, iPad, Mac, Apple Watch, AirPods) y ofrece servicios\
    \ de suscripción (App Store, iCloud, Apple Music, Apple TV+, Apple Care).  \n\
    - **Sector:** Tecnología – Hardware y Software de consumo.  \n- **Geografía:**\
    \ Operaciones y ventas en América, Europa, Asia‑Pacífico y resto del mundo; la\
    \ mayor parte de la fabricación está externalizada a socios en Asia (principalmente\
    \ China).  \n- **Modelo de negocio:** Ingresos combinados de **hardware** (ventas\
    \ de dispositivos), **software propio** (sistemas operativos, chips) y **servicios\
    \ recurrentes** que generan flujos de caja estables.  \n\n*Fuente:* AOIF – paso 1\
    \ y DDD (clasificación de oportunidad)【1】.\n\n---\n\n## 2. Modelo de Negocio y\
    \ Posición Competitiva  \n\n| Elemento | Detalle | Evidencia |\n|----------|---------|-----------|\n\
    | **Drivers de revenue** | - Ventas de iPhone y otros dispositivos premium.<br>-\
    \ Crecimiento de servicios (iCloud, Apple Music, Apple TV+, App Store).<br>- Futuro:\
    \ adopción de Apple Vision Pro (AR/VR). | AOIF paso 1, paso 2; DDD dominio catalizadores\
    \ (servicios > 20 % anual)【2】 |\n| **Moat (foso competitivo)** | - **Ecosistema\
    \ integrado** (hardware + software + servicios).<br>- **Lealtad de marca** y alta\
    \ retención de clientes.<br>- **Patentes y propiedad intelectual**.<br>- **Red\
    \ de distribución propia** (Apple Stores, canal online). | Inferencia LLM (DDD)\
    \ y AOIF paso 3 (amplitud moat)【3】 |\n| **Dinámica competitiva** | Mercado de\
    \ smartphones maduro; presión de precios. Crecimiento acelerado de servicios y\
    \ de plataformas AR/VR. Riesgo regulatorio creciente (App Store). | DDD dominio business_quality;\
    \ AOIF paso 3【4】 |\n| **Competidores / sector relacionado** | - Fabricantes de\
    \ smartphones premium: [[Samsung Electronics]], [[Huawei]].<br>- Proveedores de\
    \ equipos de fabricación de chips: [[ASML]] (por su papel en la cadena de suministro\
    \ de semiconductores). | Contexto sectorial implícito. |\n\n*Valoración de posición:*\
    \ **Líder** con **moat amplio** (AOIF paso 3) y **rating excepcional** en gestión\
    \ (DDD dominio management)【5】.\n\n---\n\n## 3. Perfil Financiero  \n\n### Métricas\
    \ clave (TTM)  \n\n| Métrica | Valor | Comentario |\n|---------|-------|------------|\n\
    | **Free Cash Flow (FCF)** | **136.68 B USD** | Generación de caja robusta (DDD\
    \ dominio financial_health)【6】 |\n| **Margen operativo** | **33.17 %** | Indicador\
    \ de alta rentabilidad (DDD dominio financial_health)【6】 |\n| **Crecimiento de\
    \ ingresos (TTM)** | **14.24 %** | Señal de expansión pese a madurez del smartphone\
    \ (DDD dominio growth)【7】 |\n| **ROIC** | **30.5 %** | Eficiencia de capital (AOIF\
    \ paso 2)【8】 |\n| **PER (P/E)** | **39.89×** | Valoración actual (AOIF paso 6)【9】\
    \ |\n| **EV/EBITDA** | **29.84×** | (AOIF paso 6)【9】 |\n| **FCF Yield** | **2 %**\
    \ | (AOIF paso 6)【9】 |\n| **Valor intrínseco estimado** | **≈ 350 USD** | (AOIF\
    \ paso 6)【9】 |\n\n### Estructura de capital (datos no disponibles)  \n- **Deuda\
    \ neta y ratios de cobertura**: *Información pendiente* (DDD preguntas abiertas)【10】.\
    \  \n- **CAPEX futuro**: *Detalle pendiente* (DDD preguntas abiertas)【10】.\n\n\
    ---\n\n## 4. Management y Gobierno Corporativo  \n\n| Aspecto | Detalle | Evidencia\
    \ |\n|---------|---------|-----------|\n| **CEO** | Tim Cook (desde 2011). | AOIF\
    \ paso 5 (alineamiento insiders)【11】 |\n| **Calidad del liderazgo** | Disciplina\
    \ en asignación de capital (recompras, dividendos) y visión clara hacia servicios\
    \ y AR/VR. | AOIF paso 5; DDD dominio management (rating excepcional)【12】 |\n\
    | **Insider ownership** | “Fuerte” alineamiento (AOIF paso 5). | AOIF paso 5【11】\
    \ |\n| **Composición del board** | Miembros con experiencia tecnológica y financiera;\
    \ enfoque en ESG y regulación. | Inferencia LLM (DDD)【13】 |\n| **Política de incentivos**\
    \ | Enfoque en creación de valor a largo plazo (recompras, dividendos). | AOIF\
    \ paso 5【11】 |\n\n---\n\n## 5. Tesis de Inversión  \n\n**Hipótesis alcista:**\
    \  \n1. **Moat sólido** basado en ecosistema integrado y lealtad de marca (DDD\
    \ inferencias).  \n2. **Crecimiento de servicios** superior al 20 % anual (catalizador\
    \ de medio‑largo plazo, DDD dominio catalizadores).  \n3. **Adopción de Apple Vision Pro**\
    \ generará nuevos flujos de ingresos recurrentes (catalizador medio, probabilidad\
    \ 30 %).  \n4. **Generación de caja** robusta permite seguir recompensando a accionistas\
    \ y financiar inversiones (FCF 136.68 B USD).  \n\n**Cita:** “Apple posee un moat\
    \ basado en ecosistema integrado y lealtad de marca” (DDD inferencias)【14】.  \n\
    \n**Valoración actual:** Precio de mercado **347.17 USD** ligeramente superior\
    \ al target medio de analistas (**329.25 USD**) y al valor intrínseco estimado\
    \ (**≈ 350 USD**), lo que sugiere una **valoración justa** con upside potencial\
    \ si los catalizadores se materializan (DDD opinión valoración “justo”)【15】.\n\
    \n---\n\n## 6. Riesgos y Contra‑Tesis  \n\n| Riesgo | Tipo | Impacto | Probabilidad\
    \ | Triggers de falsación |\n|--------|------|---------|--------------|-----------------------|\n\
    | **Regulación antimonopolio** (App Store, privacidad) | Regulatorio | Alto |\
    \ Media | Sanciones que limiten comisiones o impongan cambios estructurales. |\n\
    | **Concentración de suministro en Asia** (fabricación iPhone) | Operativo | Medio\
    \ | Media | Disrupciones geopolíticas o de cadena de suministro. |\n| **Desaceleración\
    \ de ventas de iPhone** | Negocio | Alto | Media | Crecimiento de ingresos < 8 %\
    \ anual (escenario BEAR). |\n| **Adopción lenta de Vision Pro** | Producto | Alto\
    \ | Media | Crecimiento de ingresos < 10 % anual, múltiplo P/E < 20×. |\n\n**Contra‑tesis:**\
    \ El precio actual ya incorpora expectativas de crecimiento que podrían no materializarse;\
    \ una caída del múltiplo P/E a ~15× y crecimiento de ingresos < 8 % llevaría el\
    \ precio objetivo a **≈ 240 USD** (escenario BEAR, DDD error mercado)【16】.\n\n\
    ---\n\n## 7. Catalizadores y Timeline  \n\n| Catalizador | Horizonte | Impacto\
    \ esperado | Probabilidad | Comentario |\n|-------------|-----------|------------------|--------------|------------|\n\
    | **Lanzamiento y adopción masiva de Apple Vision Pro** | Medio (2027‑2028) |\
    \ Alto | 30 % | Generará ingresos de hardware y suscripciones AR/VR (DDD dominio catalizadores).\
    \ |\n| **Crecimiento sostenido de servicios (iCloud, Apple Music, Apple TV+, App Store)**\
    \ | Largo (2028‑2030) | Medio | 45 % | Superar 20 % anual (DDD dominio catalizadores).\
    \ |\n| **Actualizaciones regulatorias de la App Store** | Medio‑largo | Alto/Negativo\
    \ | Media | Puede afectar márgenes de servicios. |\n| **Expansión de CAPEX en\
    \ fabricación propia de chips (Apple Silicon)** | Largo | Medio | Media | Aún\
    \ sin datos detallados (DDD preguntas abiertas). |\n\n---\n\n## 8. Marco de Valoración\
    \  \n\n**Metodología:** **Descuento de Flujos de Caja (DCF)** complementado con\
    \ múltiplos de mercado (P/E, EV/EBITDA).  \n\n| Supuesto clave | Valor | Fuente\
    \ |\n|----------------|-------|--------|\n| **FCF TTM** | 136.68 B USD | DDD dominio financial_health【6】\
    \ |\n| **Crecimiento de ingresos** | 14.24 % (base) ; 10‑15 % (escenarios) | AOIF\
    \ paso 2; DDD dominio growth【7】 |\n| **WACC** | 7.5 % (asumido) | Inferencia LLM\
    \ (práctica estándar) |\n| **Tasa de crecimiento terminal** | 2.5 % | Inferencia\
    \ LLM |\n| **Múltiplo P/E medio** | 39.89× (actual) | AOIF paso 6【9】 |\n| **Valor\
    \ intrínseco estimado** | ≈ 350 USD | AOIF paso 6【9】 |\n\n**Análisis de sensibilidad:**\
    \  \n\n| Crecimiento de ingresos (anual) | P/E resultante | Precio objetivo (USD)\
    \ |\n|--------------------------------|----------------|-----------------------|\n\
    | 8 % | 30× | 240 |\n| 12 % | 35× | 320 |\n| 15 %+ | 45× | 405 |\n\nLos rangos\
    \ coinciden con los escenarios **BEAR** (240 USD) y **BULL** (405 USD) definidos\
    \ en la investigación (DDD y AOIF)【17】.\n\n---\n\n## 9. Preguntas Abiertas y Agenda\
    \ de Investigación  \n\n| Área | Pregunta | Prioridad |\n|------|----------|-----------|\n\
    | **Deuda y cobertura** | ¿Cuál es el nivel exacto de deuda neta y los ratios\
    \ de cobertura? | Alta |\n| **CAPEX futuro** | Detalle del gasto de capital proyectado\
    \ y su impacto en flujo de caja. | Alta |\n| **Adopción Vision Pro** | ¿Cuál es\
    \ la tasa real de adopción y el ARPU esperado? | Media |\n| **Regulación App Store**\
    \ | Posibles escenarios regulatorios y su efecto en márgenes de servicios. | Media\
    \ |\n| **Impacto ESG** | Evaluar riesgos de la cadena de suministro en Asia bajo\
    \ nuevas normativas medioambientales. | Baja |\n\n*Estas preguntas guían la investigación\
    \ adicional para validar o refutar los supuestos clave de la tesis.*  \n\n---\n\
    \n### Referencias  \n\n1. DDD – clasificación de oportunidad y dominio business_quality.\
    \  \n2. DDD – dominio catalizadores (servicios > 20 % anual).  \n3. DDD – inferencias\
    \ LLM sobre moat; AOIF paso 3 (amplitud moat).  \n4. DDD – dominio business_quality\
    \ y growth; AOIF paso 3 (dinámica industria).  \n5. DDD – dominio management (rating excepcional).\
    \  \n6. DDD – dominio financial_health (FCF, margen operativo).  \n7. DDD – dominio growth\
    \ (crecimiento ingresos 14.24 %).  \n8. AOIF – paso 2 (ROIC 30.5 %).  \n9. AOIF\
    \ – paso 6 (PER 39.89×, EV/EBITDA 29.84×, valor intrínseco 350 USD).  \n10. DDD\
    \ – preguntas abiertas (deuda, CAPEX).  \n11. AOIF – paso 5 (alineamiento insiders,\
    \ gestión de capital).  \n12. DDD – dominio management (rating excepcional). \
    \ \n13. Inferencia LLM (DD D) sobre gobierno corporativo.  \n14. DDD – inferencias\
    \ LLM sobre moat.  \n15. DDD – opinión valoración “justo” y consenso de analistas.\
    \  \n16. DDD – error mercado (escenario BEAR, target 240 USD).  \n17. DDD & AOIF\
    \ – esquema de escenarios bear/bull (bear_bull_v2).\n\n---\n\n## Related Companies\n\
