  business_model: Apple Inc. designs, manufactures, and markets smartphones, personal
    computers, tablets, wearables, and accessories worldwide. The company offers iPhone,
    a line of smartphones; Mac, a line of personal computers; iPad, a line of multi-purpose
    tablets; and wearables, home, and accessories comprising AirPods, Apple Vision
    Pro, Apple TV, Apple Watch, Beats products, and HomePod, as well as Apple branded
    and third-party accessories. It also provides AppleCare support and cloud services;
    and operates various platforms, including the App Store that allows customers
    to discover and download applications and digital content, such as books, music,
    video, games, and podcasts, as well as advertising services include third-party
    licensing arrangements and its own advertising platforms. In addition, the company
    offers various subscription-based services, such as Apple Arcade, a game subscription
    service; Apple Fitness+, a personalized fitness service; Apple Music, which offers
    users a curated listening experience with on-demand radio stations; Apple News+,
    a subscription news and magazine service; Apple TV, which offers original content
    and live sports; Apple Card, a co-branded credit card; and Apple Pay, a cashless
    payment service, as well as licenses its intellectual property. The company serves
    consumers, and small and mid-sized businesses; and the education, enterprise,
    and government markets. It distributes third-party applications for its products
    through the App Store. The company also sells its products through its retail
    and online stores, and direct sales force; and third-party cellular network carriers
    and resellers. The company was formerly known as Apple Computer, Inc. and changed
    its name to Apple Inc. in January 2007. Apple Inc. was founded in 1976 and is
    headquartered in Cupertino, California.
