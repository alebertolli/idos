  del 33 % y flujo de caja libre de 136.7 B USD, respaldado por un crecimiento de
  ingresos del 14 % TTM. El precio actual supera ligeramente el consenso medio, indicando
  una valoración razonable. El principal upside proviene de la adopción de Vision
  Pro y la expansión de servicios; el downside está ligado a una posible desaceleración
  de la demanda de hardware premium o a retrasos en AR/VR.
