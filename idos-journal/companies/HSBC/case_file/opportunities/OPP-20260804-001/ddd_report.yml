dominio_esg_supply_chain:
  analisis: 'El principal riesgo ESG radica en la gobernanza y cumplimiento normativo
    geopolítico: HSBC opera bajo un escrutinio constante tanto de reguladores occidentales
    como chinos. Adicionalmente, enfrenta compromisos complejos en la transición energética
    debido a su cartera de financiación a industrias intensivas en carbono en Asia.'
  rating: medio_riesgo
dominio_financial_health:
  analisis: Como Banco de Importancia Sistémica Global (G-SIB), HSBC mantiene una
    sólida ratio de capital CET1 (Common Equity Tier 1) holgadamente por encima de
    los requerimientos regulatorios (>14.5%). La liquidez es extremadamente alta gracias
    a su gigantesca base de depósitos minoristas y comerciales en Asia y Reino Unido.
  rating: fuerte
dominio_growth:
  analisis: El crecimiento de ingresos en la banca tradicional será moderado (+3%
    a +5%) por la moderación de tipos de interés. Las vías principales de expansión
    provienen del negocio de 'International Wealth & Premier Banking' en Hong Kong,
    Singapur y China continental, así como de la captura de cuota en el crédito corporativo
    transfronterizo.
  rating: moderado
dominio_management:
  analisis: Georges Elhedery asume el mando en 2024 con un mandato claro de simplificación
    y rigor en costes. La asignación reciente de capital ha sido acertada, vendiendo
    activos de bajo retorno (Canadá, Argentina, banca minorista en EE.UU. y Francia)
    para redistribuir el capital sobrante a los accionistas y concentrarse en banca
    corporativa y gestión de patrimonios en Asia.
  rating: bueno
