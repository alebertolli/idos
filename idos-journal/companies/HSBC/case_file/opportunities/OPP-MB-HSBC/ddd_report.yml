  - El crecimiento de ingresos entre FY 2022 y FY 2025 es una señal descriptiva, pero
    por sí sola no demuestra crecimiento rentable, retornos sobre capital atractivos
    ni potencial multibagger.
  - La ausencia de evidencia sobre moat, penetración y reinversión impide validar
    la sostenibilidad del mecanismo de crecimiento.
  - 'Ingresos reportados: 46358 en FY 2022 y 63224 en FY 2025; estados financieros
    de StockAnalysis, períodos terminados 2022-12-31 y 2025-12-31.'
  - 'Utilidad neta reportada: 26435 TTM al 2026-09-30; estados financieros de StockAnalysis.'
  - Precio USD 85.42 al 2026-10-30 y objetivos de analistas USD 90.00–112.05 observados
    el 2026-11-20; Yahoo Finance y StockAnalysis.
  preguntas_abiertas:
  - ¿Qué segmentos y geografías explican el crecimiento de ingresos y utilidad, y
    qué retornos sobre capital generan?
  - ¿Cómo se reconcilia el FCF reportado con los flujos de caja bancarios y qué parte
    refleja cambios de balance?
  - ¿Qué metas de capital, dividendos, recompras y prioridades de asignación ha comunicado
    la dirección?
