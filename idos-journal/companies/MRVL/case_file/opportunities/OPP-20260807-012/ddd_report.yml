  business_model: Marvell Technology, Inc., together with its subsidiaries, provides
    data infrastructure semiconductor solutions and spanning the data center core
    to network edge in the United States, Argentina, China, India, Israel, Japan,
    Singapore, South Korea, Taiwan, Vietnam, and internationally. The company develops
    and scales system-on-a-chip architectures, integrating analog, mixed-signal, and
    digital signal processing functionality. It offers a portfolio of ethernet solutions,
    including spanning controllers, network adapters, physical transceivers, and switches;
    single or multiple core processors; and custom application specific integrated
    circuits, interconnects, fibre channel adapters, and processors. The company also
    provides interconnect products, including pulse amplitude modulation, coherent
    and coherent-lite digital signal processors (DSPs), laser drivers, trans-impedance
    amplifiers, silicon photonics, co-packaged optics, linear pluggable optics chipsets,
    data center interconnect, active electrical cable DSPs and peripheral component
    interconnect express retimer solutions; fibre channel products comprising host
    bus adapters and controllers for server and storage system connectivity; storage
    controllers for hard disk drives and solid-state-drives; host system interfaces,
    including serial advanced technology attachment and serial attached SCSI, peripheral
    component interconnect express, compute express link switches, non-volatile memory
    express (NVMe), and NVMe over fabrics; and develops ultra accelerator linkTM switches
    and ethernet for scale-up networking switches. The company serves data centers,
    communications, and other markets. It offers its products through direct customers
    and distributors. Marvell Technology, Inc. was incorporated in 1995 and is headquartered
    in Wilmington, Delaware.
