  existing_wiki: '## 1. Visión General de la Compañía


    TotalEnergies SE ([[TTE]]) es una compañía energética integrada que opera en hidrocarburos,
    gas natural y LNG, combustibles, electricidad y energías renovables. Sus actividades
    incluyen exploración y producción de petróleo y gas, procesamiento y comercialización
    de LNG y gases, refinación y comercialización de combustibles, y generación, almacenamiento,
    trading y comercialización de electricidad. La cadena de valor descrita también
    incluye actividad de almacenamiento de carbono.


    La compañía participa en una industria global e intensiva en capital. Sus resultados
    están expuestos a los precios de la energía, la utilización de activos, los márgenes
    de los distintos segmentos y factores regulatorios y geopolíticos. El material
    disponible no detalla la distribución geográfica de activos, ingresos o inversiones.


    **Evidencia:** descripción del modelo de negocio y cadena de valor del análisis
    AOIF, sin fecha indicada; el análisis DDD también describe actividades en hidrocarburos,
    LNG, electricidad y renovables. No se añadieron datos externos.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    Los drivers identificados son:


    - Precios del petróleo, gas y LNG.

    - Volúmenes de producción y ventas.

    - Utilización de activos.

    - Márgenes de las actividades de procesamiento, refinación, comercialización y
    electricidad.


    La integración vertical puede conectar producción, procesamiento, trading y comercialización,
    aunque la evidencia disponible no cuantifica su contribución a los resultados
    ni su efecto en la resiliencia financiera.


    ### Moat y competencia


    El análisis AOIF califica la amplitud del moat como **estrecha** y la posición
    competitiva como **líder**. Atribuye posibles ventajas a la escala, integración
    vertical, cartera de activos, acceso a recursos y mercados, capacidades de trading
    e infraestructura. Estas ventajas son hipótesis cualitativas del análisis y no
    están respaldadas aquí por datos comparables de costes, cuota de mercado o retornos
    incrementales.


    La dinámica competitiva está condicionada por la intensidad de capital, los ciclos
    de materias primas, la geopolítica y la transición energética. Entre las compañías
    relacionadas del sector figuran [[BP]], [[CVX]], [[SHEL]], [[EQNR]], [[E]], [[PBR]],
    [[COP]] y [[OXY]]; también son relevantes, por actividades específicas, [[BKR]],
    [[HAL]], [[PSX]], [[SLB]] y [[TS]].


    ## 3. Perfil Financiero


    Las métricas siguientes provienen de los outputs suministrados. Salvo cuando se
    indica un período, no se proporcionó fecha, metodología completa ni conciliación.
