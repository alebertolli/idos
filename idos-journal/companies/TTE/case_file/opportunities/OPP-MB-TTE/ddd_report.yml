  hechos_verificados: []
  inferencias_llm:
  - El FCF TTM reportado supera el FY2025, pero la diferencia entre período TTM y
    ejercicio fiscal limita la interpretación como crecimiento comparable.
  - La combinación de deuda neta reportada y efectivo/inversiones no basta para inferir
    capacidad de servicio de deuda sin unidades y definiciones conciliadas.
  - StockAnalysis reportó ingresos TTM de 214,397, FCF de 23,822 y utilidad neta de
    22,417 al 2026-09-30; las series históricas están en importes reportados por el
    proveedor.
  - StockAnalysis reportó current ratio de 1.11 y EBITDA TTM de 48,620,000,000 al
    2026-09-30.
  - YFinance registró momentum de precio a 12 meses de 53.1652% y volatilidad a 90
    días de 24.4119% al 2026-10-30.
  - El resumen financiero registra cotización de 95.33 USD al 2026-10-30 y rango de
    objetivos de analistas de 91 a 119 USD al 2026-11-20.
  preguntas_abiertas:
  - ¿Qué explican los cambios de ingresos, margen y FCF, y cuánto corresponde a precios,
    volúmenes, mezcla o capital de trabajo?
  - ¿Cuáles son los retornos sobre capital invertido y la reinversión por segmento,
    incluidos LNG, electricidad y renovables?
  - ¿Qué período de inversión representa el consenso de precio objetivo y cuáles son
    sus supuestos operativos?
  - ¿Cuál es la serie comparable de acciones diluidas y cuál es la cobertura de intereses
    verificable?
