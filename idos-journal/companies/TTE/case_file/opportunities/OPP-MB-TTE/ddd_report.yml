    chemicals. This segment also includes the activities of oil supply, trading and
    marine shipping, as well as hydrogen activities. The Marketing & Services segment
    engages in the marketing activities in the field of petroleum products, as well
    as corresponding supply and logistics activities. The company was formerly known
    as TOTAL SE and changed its name to TotalEnergies SE in June 2021. TotalEnergies
    SE was incorporated in 1924 and is headquartered in Courbevoie, France.
