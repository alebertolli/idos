    ## 8. Marco de Valoración


    No es posible estimar responsablemente un valor intrínseco con la información
    disponible. El propio análisis AOIF lo señala y no proporciona una fecha de valoración,
    precio de referencia, deuda neta, acciones diluidas, previsiones de producción,
    precios, inversión ni supuestos detallados.


    Para una compañía integrada y expuesta al ciclo de hidrocarburos, una valoración
    debería contrastar métodos basados en flujo de caja y múltiplos comparables, usando
    supuestos explícitos y consistentes para los segmentos relevantes. Antes de hacerlo,
    sería necesario:


    - reconciliar los períodos y las unidades de ingresos, EBITDA, deuda, capex y
    FCF;

    - obtener previsiones de producción, precios realizados, costos y necesidades
    de inversión;

    - evaluar retornos de capital y economía de proyectos actuales y planificados;

    - verificar el número de acciones diluidas y el tratamiento de deuda neta;

    - definir escenarios de precios de hidrocarburos, ejecución operativa, inversión
    y política de distribución.


    El AOIF reporta EV/EBITDA de 2,9x, P/E de 4,45x y FCF yield de 0, pero el paquete
    no documenta sus fuentes, fechas ni inputs. Deben tratarse como cifras no verificadas,
    no como base suficiente para concluir que PBR está barata. El consenso de precio
    objetivo al 2026-11-20 —USD 22,83, rango USD 17,40–27,00— tampoco sustituye una
    valoración independiente. No hay base suficiente para calcular un margen de seguridad
    o un análisis de sensibilidad cuantitativo.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuáles son el ROIC, el costo de capital y los retornos económicos de los proyectos
    actuales y planificados, con períodos y monedas comparables?

    2. ¿Qué retornos generan los proyectos offshore y cómo se comparan con sus presupuestos,
    plazos y supuestos iniciales?

    3. ¿Cuáles son las reservas, los costos de extracción, la producción y la evolución
    de esos indicadores por activo o segmento?

    4. ¿Qué cuota de mercado, demanda direccionable y penetración tiene Petrobras
    por segmento y geografía?

    5. ¿Cuál es la serie de ingresos de FY 2023 y qué crecimiento resulta de compararla
    con un período equivalente?

    6. ¿Cuál es el importe de FCF y cómo se reconcilia con flujo de caja operativo,
    capex y ventas de activos? ¿Es comparable el crecimiento TTM reportado de 22,87%?

    7. ¿Cuál es la deuda neta/EBITDA con unidades y períodos consistentes? ¿Cómo se
    explica la cobertura de intereses reportada como 0x?

    8. ¿Cuál es la exposición cuantitativa de caja, márgenes y dividendos a distintos
    precios del petróleo y el gas?

    9. ¿Qué evidencia concreta respalda las evaluaciones AOIF sobre calidad del management,
    alineamiento de insiders y asignación de capital?

    10. ¿Qué estructura de gobierno, independencia del board e incentivos supervisa
    las decisiones de precios, inversión y distribución de capital?


    **Conclusión de investigación:** clasificación provisional de **investigación
    requerida; evidencia parcial**. La información disponible describe una empresa
    integrada con ventajas operativas potenciales y señales de generación de caja
    en el período reportado, pero no basta para validar la sostenibilidad de sus retornos,
    la asignación de capital ni una discrepancia de valoración.


