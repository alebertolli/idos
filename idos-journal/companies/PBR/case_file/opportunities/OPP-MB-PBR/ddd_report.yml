    drilling, refining, processing, trading, and transporting crude oil from producing
    onshore and offshore oil fields, and shale or other rocks, as well as oil products,
    natural gas, and other liquid hydrocarbons. In addition, the company engages in
    research, development, production, transportation, distribution, and trading of
    energy. Petróleo Brasileiro S.A. - Petrobras was incorporated in 1953 and is headquartered
    in Rio De Janeiro, Brazil.'
