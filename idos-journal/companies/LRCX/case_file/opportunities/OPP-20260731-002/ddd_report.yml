prompt_inputs:
  business_model: Lam Research Corporation designs, manufactures, markets, refurbishes,
    and services semiconductor processing equipment used in the fabrication of integrated
    circuits in the United States, China, Korea, Taiwan, Japan, Southeast Asia, and
    Europe. The company offers ALTUS systems to deposit conformal or selective films
    for tungsten or molybdenum metallization applications; SABRE electrochemical deposition
    products for copper interconnect transition that offers copper damascene manufacturing;
    SPEED gapfill high-density plasma chemical vapor deposition (CVD) products; Striker
    single-wafer atomic layer deposition products for dielectric film solutions; and
    VECTOR plasma-enhanced CVD products. It also provides Flex for dielectric etch
    applications; Vantex, a dielectric etch system that provides RF technology and
    repeatable wafer-to-wafer performance enabled by Equipment Intelligence solutions;
    Kiyo for conductor etch applications; Syndion for through-silicon via etch applications;
    and Versys metal products for metal etch processes. In addition, the company offers
    Coronus bevel clean products to enhance die yield; and Da Vinci, DV-Prime, EOS,
    and SP series products to address various wafer cleaning applications. Further,
    it provides Reliant deposition, etch, and clean products; and Sense.i platform
    products, as well as customer service, spares, and upgrades. Lam Research Corporation
    was incorporated in 1980 and is headquartered in Fremont, California.
