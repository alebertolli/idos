  business_model: 'UnitedHealth Group Incorporated operates as a health care company
    in the United States and internationally. It operates through four segments: Optum
    Health, Optum Insight, Optum Rx; and UnitedHealthcare. The Optum Health segment
    provides care delivery, care management, wellness and consumer engagement, and
    health financial services with patients, consumers, care delivery systems, providers,
    employers, payers, and public-sector entities. The Optum Insight segment offers
    software and information products, advisory consulting arrangements, and managed
    services outsourcing contracts to hospital systems, physicians, health plans,
    public entities, life sciences companies and other organizations. The Optum Rx
    segment provides pharmacy care services and programs, including retail network
    contracting, home delivery, specialty and community health pharmacy services,
    infusion, and purchasing and clinical capabilities, as well as develops programs
    in the areas of step therapy, formulary management, drug adherence, and disease
    and drug therapy management. The UnitedHealthcare segment offers consumer-oriented
    health benefit plans and services for national employers, public sector employers,
    mid-sized employers, small businesses, and individuals; Medicaid plans, including
    Temporary Assistance to Needy Families; Children''s Health Insurance Programs;
    Dual SNPs; Long-Term Services and Supports; Aged, Blind and Disabled; and other
    federal, state, and community health care programs. and health care benefits products
    and services to state programs caring for the economically disadvantaged, medically
    underserved, and those without the benefit of employer-funded health care coverage.
    UnitedHealth Group Incorporated was founded in 1974 and is based in Eden Prairie,
    Minnesota.'
