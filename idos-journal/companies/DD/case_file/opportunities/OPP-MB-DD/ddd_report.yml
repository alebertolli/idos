  existing_wiki: '## 1. Visión General de la Compañía


    **DuPont de Nemours, Inc. (NYSE: DD)** desarrolla y comercializa materiales especializados,
    componentes y soluciones tecnológicas. La información disponible describe actividades
    vinculadas con protección, dispositivos médicos, construcción, filtración y tratamiento
    de agua, y ciencias de la vida.


    Entre los productos mencionados están los materiales de protección **TYVEK**,
    las membranas **FILMTEC**, las resinas **AMBERLITE** y los módulos de ultrafiltración.
    Sus clientes incluyen fabricantes de dispositivos médicos, embalajes y prendas
    de protección, así como empresas industriales, energéticas, municipales y de ciencias
    de la vida. La investigación no especifica de manera suficiente la distribución
    geográfica de ingresos ni el peso de cada mercado final.


    El modelo de negocio consiste en investigar y desarrollar materiales y tecnologías,
    adquirir materias primas y componentes, fabricar productos especializados y venderlos
    a clientes industriales y comerciales. La tesis depende de que la diferenciación
    técnica y la reputación de producto sostengan la demanda y los márgenes; la evidencia
    aportada no basta para confirmar esa resiliencia.


    La información sectorial aportada también relaciona a DuPont con [[DOW]] y enumera
    compañías del sector o de industrias relacionadas como [[AEM]], [[B]], [[BHP]],
    [[CDE]] y [[CX]]. No se ha establecido que todas sean competidores directos.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    - Ventas de materiales de protección para aplicaciones médicas, prendas y envolventes
    de construcción.

    - Demanda de soluciones de filtración y separación de agua, incluidas membranas,
    resinas y módulos.

    - Actividad de clientes industriales, municipales, energéticos, de construcción
    y de ciencias de la vida.

    - Posible demanda de productos con requisitos técnicos, de confiabilidad o de
    cumplimiento normativo.


    No se proporcionan datos que separen el crecimiento orgánico de los efectos de
    adquisiciones, desinversiones, precios, volúmenes o cambios en el perímetro del
    negocio.


    ### Moat y competencia


    La evaluación AOIF caracteriza el moat como **estrecho** y la posición competitiva
    como **líder**, pero no aporta estudios de mercado ni cifras independientes que
    permitan validar esas calificaciones. Las posibles fuentes de ventaja identificadas
    son:


    - Especialización técnica, marcas y conocimiento de aplicación.

    - Certificaciones y requisitos de confiabilidad en ciertos usos.

    - Costos de cambio asociados a calificación de productos y continuidad operativa
    de clientes.


    La importancia y durabilidad de estas ventajas varían según producto y mercado.
    La competencia, la sustitución tecnológica y la pérdida de diferenciación podrían
    limitar precios y participación. [[DOW]] es una referencia sectorial pertinente,
    aunque la información disponible no permite una comparación directa de productos
    o resultados.


    ## 3. Perfil Financiero


    Las cifras siguientes reproducen los datos incluidos en los análisis de investigación.
    Salvo indicación expresa, **no se aportan periodo, metodología o verificación
    independiente suficientes**. Hay discrepancias entre los datos de crecimiento
    y rentabilidad, por lo que no deben combinarse como si formaran una serie homogénea.


    | Métrica | Dato suministrado | Periodo / fecha | Observaciones |

    |---|---:|---|---|

    | Crecimiento de ingresos | 4% | Al 2026-06-30, según Yfinance | El periodo de
    comparación no está especificado. |

    | Crecimiento de ingresos | 49,35% | Periodo no especificado, AOIF | Inconsistente
    con el 4%; requiere reconciliación. |

    | Margen operativo | 13,64% | Periodo no especificado, AOIF | Sin definición de
    base ni serie histórica. |

    | ROIC | 4,22% | Periodo no especificado, AOIF | Sin definición de cálculo ni
    comparación histórica. |

    | FCF | USD 856 millones | TTM terminado el 2026-06-30, según StockAnalysis |
    Dato aislado; no hay desglose de flujo operativo, capex o capital de trabajo.
    |

    | FCF yield | 0 | Periodo no especificado, AOIF | No se indica si significa cero,
    no disponible o una convención del modelo. |

    | PER | 357,72 | Periodo no especificado, AOIF | Sin verificación ni beneficios
    normalizados. |

    | EV/EBITDA | 12,9x | Periodo no especificado, AOIF | Sin fecha de referencia
    ni definición de EBITDA. |

    | Precio de la acción | USD 139,68 | 2026-10-30, DDD | Cotización aportada; no
    verificada independientemente. |

    | Deuda y liquidez | No disponibles | — | No se aportan deuda bruta o neta, vencimientos,
    coste de financiación ni liquidez. |


    La evaluación DDD califica la salud financiera como **adecuada**, pero señala
    que faltan datos para analizar apalancamiento, cobertura y evolución de caja.
    AOIF califica la tendencia financiera como **estable**, aunque tampoco aporta
    una serie temporal suficiente para comprobarla. La discrepancia entre crecimiento
    de ingresos de 4% y 49,35% es material y debe resolverse antes de extraer conclusiones
    sobre la tendencia.


    ## 4. Management y Gobierno Corporativo


    La información aportada califica la calidad del management como **regular**, la
    asignación de capital como **neutral** y el alineamiento de insiders como **débil**.
    Sin embargo, no incluye evidencia verificable sobre:


    - Historial de ejecución del equipo directivo ni resultados frente a objetivos.

    - Remuneración, métricas de incentivos o relación entre compensación y creación
    de valor.

    - Compras o ventas de acciones por insiders y nivel de propiedad accionaria.

    - Composición, independencia, competencias o renovaciones del board.

    - Decisiones de inversión, adquisiciones, desinversiones o retornos de capital.


    Por tanto, las calificaciones son preliminares y no permiten una evaluación independiente
    de la calidad del liderazgo o del gobierno corporativo.


    ## 5. Tesis de Inversión


    **Clasificación preliminar: calidad potencial a precio razonable (*quality at
    fair price*).** La tesis permanece provisional y no cuenta con evidencia suficiente
    para clasificar a DuPont como compounder.


    ### Caso alcista


    - El portafolio descrito incluye productos especializados para protección, filtración
    y tratamiento de agua, áreas donde desempeño, confiabilidad y soporte de aplicación
    podrían favorecer la diferenciación.

    - Marcas como TYVEK, FILMTEC y AMBERLITE podrían contribuir a la confianza del
    cliente y a costos de cambio, aunque no se aportan datos que cuantifiquen su efecto.

    - El FCF reportado por StockAnalysis fue de **USD 856 millones en los doce meses
    terminados el 2026-06-30**. Es un dato positivo aislado, no prueba de generación
    sostenible de caja.

    - Un crecimiento de ingresos sostenido y una conversión consistente de utilidades
    en flujo de caja podrían respaldar una revisión favorable de las expectativas
    de mercado.


    ### Evidencia y grado de confianza


    La información sobre productos y mercados proviene de la descripción del negocio
    en AOIF; las cifras financieras y la referencia de cotización proceden de los
    datos resumidos en DDD y AOIF. No se incluyen documentos primarios, series históricas
    completas ni resultados segmentados que permitan comprobar las afirmaciones. La
    investigación DDD califica la calidad del negocio como **regular** y sus catalizadores
    con confianza **baja**.


    ## 6. Riesgos y Contra-Tesis


    ### Caso bajista


    - **Ciclicidad:** la demanda podría verse afectada por ciclos industriales, construcción
    y gasto de clientes OEM.

    - **Competencia y sustitución:** rivales o nuevas tecnologías podrían reducir
    la diferenciación, presionar precios o desplazar productos.

    - **Calidad de la caja:** un FCF de un solo periodo no demuestra que la generación
    de caja sea recurrente; faltan datos de capital de trabajo, capex y flujo operativo.

    - **Riesgo de valoración:** comparar el precio con objetivos de analistas no determina
    el valor intrínseco. Las expectativas de crecimiento o valoración implícitas podrían
    no materializarse.

    - **Riesgo financiero no cuantificado:** faltan datos de deuda, vencimientos,
    coste de financiación, liquidez y cobertura.

    - **Riesgos ambientales y de cadena de suministro:** no hay evidencia primaria
    suficiente sobre emisiones, sustancias químicas, litigios, remediación ambiental,
    seguridad o concentración de proveedores.


    ### Triggers de falsación


    La tesis se debilitaría si se observara evidencia sostenida de:


    1. Contracción o estancamiento de ingresos, una vez reconciliadas las métricas
    de crecimiento discrepantes.

    2. Deterioro persistente de márgenes, ROIC o conversión de resultados en caja.

    3. Pérdida de participación o sustitución de productos en mercados relevantes.

    4. Mayor apalancamiento o menor capacidad para atender obligaciones, cuando se
    obtengan datos verificables.

    5. Evidencia de que las marcas, certificaciones o costos de cambio no sostienen
    una ventaja económica significativa.


    ## 7. Catalizadores y Timeline


    Los catalizadores son condicionales: no se identifican fechas de publicación concretas
    ni eventos corporativos confirmados.


    | Catalizador | Horizonte / fecha esperada | Impacto potencial | Probabilidad
    y confianza |

    |---|---|---|---|

    | Resultados que confirmen crecimiento de ingresos y generación de caja sostenibles
