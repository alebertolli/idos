    | PER | 357,72 | Dato AOIF sin periodo ni verificación; requiere revisar beneficios
    normalizados. |

    | EV/EBITDA | 12,9x | Dato AOIF sin fecha o base suficientemente especificadas.
    |


    El análisis DDD concluye que el posible error de valoración es **incierto**: la
    acción se encuentra por debajo del consenso y del objetivo bajo observados, pero
    esa diferencia no demuestra infravaloración. AOIF considera insuficiente el margen
    de seguridad y no estima un valor intrínseco con rigor.


    ### Sensibilidad cualitativa


    - **Escenario favorable:** crecimiento y FCF sostenibles, junto con evidencia
    de diferenciación; podría respaldar una revisión al alza de expectativas.

    - **Escenario desfavorable:** demanda cíclica, presión competitiva o menor generación
    de caja; podría invalidar las expectativas incorporadas en los objetivos.

    - Los valores de USD 145 y USD 190 son referencias de objetivos observados, no
    resultados de un modelo independiente ni pronósticos propios.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es la deuda bruta y neta, y cuáles son los vencimientos, el coste de
