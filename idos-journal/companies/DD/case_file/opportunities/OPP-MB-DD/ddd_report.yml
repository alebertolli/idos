    La investigación DDD marca ambos catalizadores como nuevos y señala que no había
    datos históricos en el JSON previo para evaluar su cumplimiento. No se deben tratar
    como eventos confirmados.


    ## 8. Marco de Valoración


    ### Enfoque recomendado


    No es posible estimar el valor intrínseco con rigor a partir de los datos disponibles.
    Antes de aplicar una valoración por flujo de caja descontado o múltiplos comparables,
    conviene:


    - Verificar precio y fecha de referencia, acciones diluidas y estructura de capital.

    - Normalizar ingresos, márgenes, impuestos, capex y capital de trabajo a lo largo
    de varios ejercicios.

    - Reconciliar el crecimiento de ingresos de 4% con el 49,35% reportado por AOIF.

    - Determinar si el FCF de USD 856 millones es representativo y calcular su rendimiento
    con una definición consistente.

    - Obtener deuda neta, vencimientos y coste de financiación.


    ### Referencias de mercado aportadas


    | Referencia | Valor | Interpretación y limitaciones |

    |---|---:|---|

    | Precio de la acción | USD 139,68 al 2026-10-30 | Dato suministrado en DDD; no
