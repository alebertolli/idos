prompt_inputs:
  business_model: DuPont de Nemours, Inc. provides technology-based materials and
    solutions in the United States, Canada, the Asia Pacific, Latin America, Europe,
    the Middle East, and Africa. It operates through two segments, Healthcare & Water
    Technologies and Diversified Industrials. The company offers specialty components
    for medical devices, packaging and garments, and protective suits under the brand
    TYVEK; provides water filtration and separation solutions, including elements,
    modules, and systems serving primarily industrial wastewater and energy markets,
    municipal and desalination applications, and life sciences and specialty sectors.
    It also offers AMBERLITE ion exchange resins, FILMTEC reverse osmosis and nanofiltration
    elements, and INGE and ITEGRATEC ultrafiltration modules. In addition, the company
    offers engineered products and integrated solutions for the non-residential, residential,
    and repair-and-remodel construction markets, includes TYVEK house wrap, STYROFOAM
    insulation, and CORIAN solid surface. Further, it engages in the design and production
    of engineered components, systems, and process solutions used in OEM and operational
    applications, such as automotive, aerospace, printing, and packaging. Additionally,
    the company offers Vespel shapes and parts, MOLYKOTE specialty lubricants, BETAFORCE
    and BETASEAL structural adhesives, and Cyrel flexographic printing plates. The
    company has a collaboration with Microsoft and NobleAI to expand access to advanced
    AI tools and resources, including machine learning that helps scientists and engineers
    innovate faster. The company was formerly known as DowDuPont Inc. and changed
    its name to DuPont de Nemours, Inc. in June 2019. DuPont de Nemours, Inc. was
    incorporated in 2015 and is headquartered in Wilmington, Delaware.
