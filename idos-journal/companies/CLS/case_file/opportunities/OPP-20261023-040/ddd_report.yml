resumen_ejecutivo: Celestica ofrece exposición a servicios de manufactura, ingeniería
  y cadena de suministro para mercados tecnológicos, pero la información disponible
  es demasiado limitada para verificar la durabilidad del moat, la calidad del balance
  o la sostenibilidad del crecimiento. Las observaciones financieras aportadas muestran
  FCF TTM de USD 545,4 millones al 2026-09-30 y crecimiento de ingresos TTM de 61,59%
  según StockAnalysis, con discrepancias de comparabilidad frente a datos de otro
  proveedor. La cotización de USD 245,15 es inferior al rango de objetivos de analistas
  de USD 340–535, sin que esa brecha pruebe infravaloración. Tesis activa, pero con
  convicción limitada y necesidad de diligencia adicional.
