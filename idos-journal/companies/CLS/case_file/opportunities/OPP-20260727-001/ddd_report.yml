    cotizando a múltiplos razonables considerando su perfil de crecimiento.
dominio_business_quality:
  analisis: El posicionamiento de Celestica ha mejorado sustancialmente. La división
    CCS se beneficia del súper-ciclo de inversión en IA y conectividad de red de alta
    velocidad (800G). Aunque el foso competitivo (moat) no es absoluto debido a la
    presencia de competidores globales como Foxconn, Jabil o Flextronics, la complejidad
    técnica de la integración de servidores y racks con enfriamiento líquido e interconexiones
    de alta densidad crea altos costes de cambio y relaciones estrechas de co-desarrollo
    con hyperscalers y diseñadores de semiconductores como AMD.
