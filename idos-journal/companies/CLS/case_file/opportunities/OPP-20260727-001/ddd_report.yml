  business_model: Celestica Inc., together with its subsidiaries, provides supply
    chain solutions in Asia, North America, and internationally. It operates through
    two segments, Advanced Technology Solutions, and Connectivity and Cloud Solutions.
    The company offers a range of product manufacturing and related supply chain services,
    including design and development, new product introduction, engineering services,
    component sourcing, electronics manufacturing and assembly, testing, mechanical
    assembly, systems integration, precision machining, logistics, asset management,
    product licensing, and after-market repair and return services. It also provides
    hardware platform solutions, which includes development of infrastructure platforms,
    and hardware and software design solutions and services, including open-source
    software that can be used as-is or customized for specific applications; and management
    of program, including design and supply chain, manufacturing, and after-market
    support, including IT asset disposition and asset management services. The company
    offers its products and services to original equipment manufacturers, and cloud-based
    and other service providers, including hyperscalers, and other companies in aerospace
    and defense, industrial, HealthTech, capital equipment, communications, and enterprise
    markets. The company has a strategic collaboration with Advanced Micro Devices,
    Inc. for the development of Helios, a rack-scale AI platform. The company was
    incorporated in 1994 and is headquartered in Toronto, Canada.
