  existing_wiki: '## 1. Visión General de la Compañía


    eBay Inc. opera mercados digitales que conectan compradores y vendedores. Su oferta
    incluye el marketplace de ebay.com y sus aplicaciones móviles. La plataforma facilita
    la publicación, búsqueda, descubrimiento, compra y venta de productos; los ingresos
    provienen principalmente de comisiones y tarifas asociadas a las transacciones.


    El paquete de investigación describe una base de vendedores individuales, pequeños
    comerciantes, vendedores profesionales y marcas. No aporta datos para caracterizar
    con precisión la distribución geográfica del negocio, por lo que su alcance geográfico
    no se cuantifica aquí.


    **Estado de la evidencia:** la descripción del modelo procede del análisis AOIF
    facilitado; no se adjunta una fuente primaria que la valide. Las métricas y conclusiones
    de esta entrada deben considerarse provisionales cuando se indique.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    - Comisiones y tarifas cobradas por facilitar transacciones en el marketplace.

    - Actividad y participación de compradores y vendedores.

    - Cantidad y atractivo de los productos disponibles, así como su descubrimiento
    en la plataforma.

    - El paquete no desglosa ingresos por producto, geografía, tarifas u otras líneas.


    ### Moat y competencia


    El análisis AOIF identifica como posibles ventajas competitivas los efectos de
    red entre compradores y vendedores, el reconocimiento de marca, la escala del
    catálogo y los datos de transacciones. También califica el moat como **estrecho**
    y la posición competitiva como **líder**, pero no proporciona métricas comparativas
    ni fuentes que permitan verificar esas valoraciones. Por tanto, son apreciaciones
    del análisis recibido, no hechos corroborados.


    La competencia del comercio electrónico evoluciona en búsqueda, publicidad, pagos
    y experiencia móvil. El paquete señala como riesgo la pérdida de relevancia o
    participación frente a otros marketplaces y canales directos, pero no aporta cuotas
    de mercado, evolución de usuarios ni comparaciones con competidores. Las compañías
    relacionadas en el wiki —[[ABNB]] y [[BKNG]], entre otras— son plataformas de
    sectores adyacentes, no comparables directos establecidos por la evidencia disponible.


    ## 3. Perfil Financiero


    Las métricas de AOIF carecen de período, fecha y fuente indicados. Los datos TTM
    sí incluyen período y una referencia a Stock Analysis, pero el paquete señala
    que `trusted_source_urls` está vacío; se presentan como cifras reportadas, pendientes
    de verificación independiente. No deben compararse directamente métricas TTM con
    ejercicios fiscales sin ajustar períodos.


    | Métrica | Valor reportado | Período / fecha | Fuente y limitaciones |

    |---|---:|---|---|

    | Ingresos | USD 12.394 millones | TTM terminado el 2026-09-30 | [Stock Analysis](https://stockanalysis.com/stocks/EBAY/statistics/);
    referencia no validada como fuente autorizada en el paquete |

    | Flujo de caja libre (FCF) | USD 2.412 millones | TTM terminado el 2026-09-30
    | [Stock Analysis](https://stockanalysis.com/stocks/EBAY/statistics/); faltan
    serie histórica y reconciliación |

    | Current ratio | 0,78x | 2026-09-30 | [Stock Analysis](https://stockanalysis.com/stocks/EBAY/statistics/);
    observación aislada, no permite concluir por sí sola sobre solvencia |

    | Crecimiento de ingresos | 15,68% | Período no especificado | AOIF; no se aportan
    fuente ni definición |

    | Margen operativo | 21,55% | Período no especificado | AOIF; no se aportan fuente
    ni definición |

    | ROIC | 24,68% | Período no especificado | AOIF; no se aportan fuente ni definición
    |

    | Crecimiento de ingresos a 3 años | No disponible | — | No hay inputs verificables
    para calcularlo |

    | Crecimiento de FCF | No disponible | — | Faltan serie comparable y fuente validada
    |

    | Acciones diluidas / dilución interanual | No disponible | — | No se aporta serie
    histórica |

    | Deuda y estructura de capital | No disponible | — | El paquete no incluye detalle
    suficiente |


    El análisis AOIF califica la tendencia financiera como “estable”, pero no especifica
    los períodos ni las series que sustentan esa conclusión. También informa EV/EBITDA
    de 18,56, PER de 26,42 y FCF yield de 0, sin fecha ni fuente; no son bases suficientes
    para concluir sobre valoración o conversión de caja.


    ## 4. Management y Gobierno Corporativo


    La evaluación recibida califica la calidad de la dirección como “buena”, la asignación
    de capital como “neutral” y el alineamiento de insiders como “moderado”. Sin embargo,
    reconoce que no cuenta con información sobre desempeño del equipo directivo, compensación
    ni propiedad accionarial.


    No se aportan nombres, composición, independencia, experiencia ni estructura del
    consejo de administración. En consecuencia, las valoraciones de gestión son preliminares
    y no verificables con la evidencia disponible.


    ## 5. Tesis de Inversión


    ### Caso alcista — hipótesis por comprobar


    - El marketplace puede beneficiarse de la interacción entre compradores y vendedores:
    más oferta puede mejorar la variedad del catálogo y la actividad de compradores
    puede atraer vendedores. El paquete describe estos efectos de red como una posible
    ventaja, pero no los cuantifica.

    - La escala del catálogo, la marca y los datos de transacciones podrían contribuir
    al descubrimiento de productos y a la retención de participantes. No se aportan
    indicadores de retención, actividad o satisfacción que confirmen esa hipótesis.

    - Como señal descriptiva, se reportan ingresos TTM de USD 12.394 millones y FCF
    TTM de USD 2.412 millones al 2026-09-30 ([Stock Analysis](https://stockanalysis.com/stocks/EBAY/statistics/)).
    Sin una serie histórica verificable y comparable, esos datos no demuestran una
    tendencia de crecimiento ni la sostenibilidad del FCF.

    - El AOIF reporta margen operativo de 21,55% y ROIC de 24,68%, pero no especifica
    período ni fuente; no se consideran evidencia suficiente para afirmar rentabilidad
    superior o persistente.


    **Síntesis:** existe una hipótesis de marketplace establecido con posibles efectos
    de red y generación de caja. La evidencia recibida no basta para determinar la
    fortaleza del moat, la trayectoria fundamental o el valor intrínseco.


    ## 6. Riesgos y Contra-Tesis


    ### Caso bajista


    - **Erosión competitiva:** pérdida de relevancia o participación ante otros marketplaces
    y canales directos.

    - **Debilitamiento de la actividad:** menor demanda, confianza o atractivo de
    la plataforma podría afectar a compradores y vendedores. El análisis AOIF asigna
    impacto alto y probabilidad media a estos riesgos, sin sustento cuantitativo adjunto.

    - **Sostenibilidad del FCF desconocida:** una cifra TTM aislada no permite identificar
    factores temporales, necesidades de inversión ni conversión de caja.

    - **Datos fundamentales incompletos:** no se puede confirmar crecimiento comparable
    de ingresos y FCF, evolución de acciones diluidas, penetración o cuota de mercado.

    - **Liquidez:** se reporta un current ratio de 0,78x al 2026-09-30, pero es una
    observación aislada y no permite por sí sola concluir que exista un problema de
    solvencia.

    - **Riesgo de sobreinterpretar objetivos de analistas:** el rango reportado es
    amplio y no equivale a una valoración intrínseca.


    ### Triggers de falsación o revisión de la tesis


    - Datos verificables que muestren deterioro sostenido de ingresos o FCF.

    - Evidencia de pérdida de usuarios o vendedores, erosión competitiva o debilitamiento
    de la economía del marketplace.

    - Una serie de acciones diluidas que revele dilución material; el paquete no permite
    evaluarla actualmente.


    ## 7. Catalizadores y Timeline


    | Catalizador o evento | Fecha esperada | Impacto potencial | Estado de la evidencia
    |

    |---|---|---|---|

    | Publicación de resultados que permita verificar ingresos, FCF y perspectivas
