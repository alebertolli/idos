  existing_wiki: "## 1. Visión General de la Compañía\n\neBay Inc. opera marketplaces\
    \ digitales que conectan compradores y vendedores. Su actividad principal es facilitar\
    \ la publicación, búsqueda y compraventa de productos mediante su sitio web y\
    \ aplicaciones móviles. Monetiza principalmente mediante comisiones por transacción\
    \ y servicios para vendedores, además de publicidad y otros servicios. [AOIF,\
    \ análisis recibido con fecha de referencia 2026-11-20]\n\nLa plataforma sirve\
    \ a vendedores particulares y pequeñas y medianas empresas. La investigación describe\
    \ una presencia internacional, aunque no aporta un desglose de ingresos por país\
    \ o región. Entre las geografías mencionadas figuran Estados Unidos, Reino Unido,\
    \ China y Alemania. [Wiki existente; AOIF, 2026-11-20]\n\n**Clasificación provisional:**\
    \ negocio de calidad buena, con crecimiento moderado y valoración considerada\
    \ justa en el análisis DDD. La recomendación final permanece pendiente de decisión.\
    \ [DDD; AOIF, 2026-11-20]\n\n## 2. Modelo de Negocio y Posición Competitiva\n\n\
    **Drivers de ingresos**\n- Actividad transaccional del marketplace y servicios\
    \ asociados a vendedores.\n- Publicidad y otros servicios.\n- Evolución de compradores\
    \ activos, actividad de vendedores y volumen bruto de mercancías (GMV), indicadores\
    \ que la investigación recomienda vigilar. [AOIF, 2026-11-20]\n\n**Moat y posición\
    \ competitiva**\n- La investigación identifica efectos de red entre compradores\
    \ y vendedores, reconocimiento de marca, escala y amplitud del catálogo.\n- La\
    \ diferenciación puede ser más relevante en productos usados, coleccionables y\
    \ artículos difíciles de encontrar.\n- AOIF califica el moat como **estrecho**\
    \ y la posición competitiva como **líder**. Estas son evaluaciones analíticas,\
    \ no hechos cuantificados por las fuentes proporcionadas. [AOIF, 2026-11-20]\n\
    - La industria es competitiva y depende de la experiencia de búsqueda, los precios,\
    \ la publicidad y la calidad del producto. La competencia incluye marketplaces\
    \ generalistas y especializados, así como canales directos. [AOIF, 2026-11-20]\n\
    \nLas compañías indicadas como pertenecientes a la misma industria o sector son\
    \ [[ABNB]], [[ANF]], [[AVY]], [[BKNG]], [[CCL]] y [[DECK]]. La información disponible\
    \ no establece que sean competidores directos de eBay.\n\n## 3. Perfil Financiero\n\
    \nLas métricas recibidas contienen diferencias entre análisis y no incluyen una\
    \ serie histórica que permita confirmar tendencias. Deben tratarse como cifras\
    \ reportadas por los inputs, no como una serie financiera reconciliada.\n\n| Métrica\
    \ | Dato proporcionado | Fuente y observación |\n|---|---:|---|\n| Crecimiento\
    \ de ingresos TTM | 13,7% | DDD; periodo TTM, fecha de referencia 2026-11-20 |\n\
    | Crecimiento de ingresos | 15,68% | AOIF; periodo no especificado en el input\
    \ |\n| Margen operativo | 19,2% | DDD; periodo TTM |\n| Margen operativo | 21,55%\
    \ | AOIF; periodo no especificado |\n| Flujo de caja libre | 2.410 M USD | DDD;\
    \ TTM |\n| ROIC | 24,68% | AOIF; periodo no especificado |\n| PER | 26,42 | AOIF;\
    \ precio y fecha de cálculo no especificados |\n| EV/EBITDA | 18,56 | AOIF; precio\
    \ y fecha de cálculo no especificados |\n| FCF yield | 0 | AOIF; metodología y\
    \ significado no aclarados |\n\nDDD describe la generación de flujo de caja libre\
    \ y el margen operativo como sólidos. AOIF indica que no puede calcular la conversión\
    \ de FCF con la información disponible. La cifra de FCF yield igual a cero no\
    \ permite concluir que el rendimiento económico sea literalmente cero: requiere\
    \ aclarar metodología y datos de cálculo. [DDD; AOIF, 2026-11-20]\n\n**Estructura\
    \ de capital:** no se proporcionan deuda, efectivo, deuda neta, vencimientos ni\
    \ ratios de liquidez. Por tanto, no es posible evaluar el apalancamiento o la\
    \ solvencia con los inputs disponibles. [DDD; AOIF, 2026-11-20]\n\n## 4. Management\
    \ y Gobierno Corporativo\n\nDDD califica la gestión como buena y señala que ha\
    \ mantenido el enfoque en el marketplace y promovido iniciativas para mejorar\
    \ la experiencia de usuario. AOIF también evalúa la calidad del management como\
    \ buena, pero considera neutral la asignación de capital y moderado el alineamiento\
    \ de insiders. [DDD; AOIF, 2026-11-20]\n\nEstas valoraciones son provisionales:\
    \ no se aportan historial detallado de ejecución, datos de remuneración, propiedad\
    \ accionaria de insiders, retornos de recompras o inversiones, ni composición\
    \ e independencia del board. No es posible confirmar la alineación entre dirección\
    \ y accionistas ni hacer una evaluación sustantiva del gobierno corporativo. [AOIF,\
    \ 2026-11-20]\n\n## 5. Tesis de Inversión\n\n**Caso alcista**\n- El marketplace\
    \ conecta dos grupos de usuarios y podría beneficiarse de efectos de red, reconocimiento\
    \ de marca y escala. AOIF describe estas ventajas como un moat estrecho, particularmente\
    \ relevante en productos usados, coleccionables y difíciles de encontrar. [AOIF,\
    \ 2026-11-20]\n- Los indicadores proporcionados muestran rentabilidad operativa\
    \ significativa: margen de 19,2% según DDD y de 21,55% según AOIF. DDD también\
    \ reporta 2.410 M USD de FCF TTM. Las diferencias entre cifras requieren reconciliación.\
    \ [DDD; AOIF, 2026-11-20]\n- El crecimiento de ingresos reportado se sitúa entre\
    \ 13,7% y 15,68%, aunque los periodos y metodologías no están suficientemente\
    \ definidos para compararlos directamente. [DDD; AOIF, 2026-11-20]\n- La adopción\
    \ de herramientas de IA podría mejorar la creación de listados, la búsqueda, la\
    \ personalización y la fijación de precios, con posibles beneficios para la experiencia\
    \ de compra y la retención de vendedores. Es un catalizador hipotético, no un\
    \ resultado confirmado. [DDD, escenario fechado 2026-11-20]\n- DDD considera la\
    \ acción razonablemente valorada y clasifica la oportunidad como *quality at fair\
    \ price*. La conclusión depende de la validez de las métricas y de que eBay sostenga\
    \ crecimiento y márgenes. [DDD, 2026-11-20]\n\n## 6. Riesgos y Contra-Tesis\n\n\
    **Caso bajista y riesgos**\n- **Competencia:** marketplaces generalistas y especializados\
    \ y canales directos pueden reducir crecimiento, cuota de mercado o capacidad\
    \ de monetización. AOIF lo califica como riesgo de impacto alto y probabilidad\
    \ alta. [AOIF, 2026-11-20]\n- **Experiencia y confianza:** deterioro de búsqueda,\
    \ conversión o confianza —incluidos fraude, falsificaciones y disputas entre usuarios—\
    \ podría debilitar la actividad de la plataforma. AOIF lo califica como riesgo\
    \ de impacto alto y probabilidad media. [AOIF, 2026-11-20]\n- **Entorno macroeconómico:**\
    \ una desaceleración que reduzca el gasto de los consumidores puede afectar la\
    \ actividad transaccional. DDD lo califica como riesgo de impacto medio y probabilidad\
    \ media. [DDD, 2026-11-20]\n- **Ejecución de IA y expansión geográfica:** los\
    \ beneficios previstos podrían no materializarse o llegar más tarde de lo esperado.\
    \ DDD asigna una probabilidad de 45% al catalizador de IA y de 35% a la expansión\
    \ en mercados emergentes, estimaciones analíticas no verificadas. [DDD, 2026-11-20]\n\
    - **Finanzas y valoración:** la falta de datos sobre deuda, liquidez y FCF normalizado\
    \ impide evaluar plenamente la resiliencia financiera y la relación entre precio\
    \ y valor intrínseco. [DDD; AOIF, 2026-11-20]\n\n**Triggers de falsación indicados\
    \ por los escenarios DDD**\n- Escenario bajista: crecimiento de ingresos inferior\
    \ al 5% anual y margen operativo por debajo del 15%.\n- Escenario alcista: crecimiento\
    \ de ingresos superior al 15% anual y margen operativo superior al 20%.\n- El\
    \ escenario alcista también se vería cuestionado por varios trimestres con crecimiento\
    \ inferior al 5% o margen estancado por debajo del 18%.\n- El escenario bajista\
    \ se vería cuestionado por resultados con crecimiento superior al 10% y margen\
    \ superior al 18%, o por avances significativos en IA.  \n[DDD, escenarios con\
    \ fecha de referencia 2026-11-20; horizonte 2027-11-20]\n\n## 7. Catalizadores\
    \ y Timeline\n\n| Catalizador | Horizonte indicado | Impacto y probabilidad estimada\
    \ | Estado de evidencia |\n|---|---|---|---|\n| Implementación de IA para optimizar\
    \ listados y precios, personalizar la experiencia y mejorar la retención de vendedores\
    \ | Medio; el análisis fija horizonte de escenarios a 2027-11-20 | Impacto alto;\
    \ probabilidad 45% | Hipótesis de DDD; no se proporciona calendario de implementación\
    \ ni hitos confirmados |\n| Expansión en mercados emergentes de Asia y Latinoamérica\
    \ | Largo plazo | Impacto medio; probabilidad 35% | Hipótesis de DDD; sin fechas\
    \ o planes detallados |\n| Evolución de ingresos, GMV, compradores activos, actividad\
    \ de vendedores, margen operativo y FCF | Seguimiento continuo; próximos reportes\
    \ no especificados | Puede confirmar o debilitar la tesis | Indicadores de monitoreo\
    \ propuestos por AOIF |\n\nNo se proporcionan fechas concretas para lanzamientos\
    \ de IA, resultados trimestrales u otras decisiones corporativas. Por ello, los\
    \ horizontes son orientativos y no constituyen un calendario confirmado. [DDD;\
    \ AOIF, 2026-11-20]\n\n## 8. Marco de Valoración\n\nLa valoración intrínseca **no\
    \ puede estimarse de forma responsable** con la información disponible: faltan\
    \ precio de referencia claramente fechado, deuda neta, FCF normalizado y supuestos\
    \ explícitos de crecimiento y descuento. AOIF señala expresamente estas limitaciones.\
    \ [AOIF, 2026-11-20]\n\n**Referencias disponibles, con limitaciones**\n- AOIF\
    \ informa PER de 26,42 y EV/EBITDA de 18,56, sin detallar fecha de cálculo ni\
    \ precio de referencia.\n- DDD menciona un precio de 121,33 USD y un objetivo\
    \ medio de analistas de 127,11 USD. La fecha de esas referencias no queda especificada\
    \ en el input; no deben tratarse como cotizaciones actuales verificadas.\n- Los\
    \ escenarios DDD fijan objetivos a 2027-11-20: **71 USD** en el caso bajista y\
    \ **153 USD** en el caso alcista. Son resultados de escenarios, no objetivos respaldados\
    \ por fuentes externas; los inputs no proporcionan fuentes para ellos. [DDD; AOIF,\
    \ fecha de referencia de análisis 2026-11-20]\n\n**Método apropiado para investigación\
    \ adicional**\n- Contrastar valoración por múltiplos con comparables pertinentes,\
    \ evitando asumir que las compañías sectoriales listadas son competidores directos.\n\
    - Elaborar un análisis de flujo de caja descontado con FCF normalizado, deuda\
    \ neta, crecimiento, márgenes e hipótesis de descuento verificadas.\n- Sensibilizar\
    \ el valor ante cambios en crecimiento de ingresos, margen operativo, conversión\
    \ de FCF y ritmo de ejecución de iniciativas de IA.\n\nDDD califica la valoración\
    \ como justa, pero también describe como incierto si el mercado subestima el potencial\
    \ de IA y de las categorías de segunda mano. Sin datos reconciliados y supuestos\
    \ de valoración transparentes, la conclusión debe considerarse provisional. [DDD;\
    \ AOIF, 2026-11-20]\n\n## 9. Preguntas Abiertas y Agenda de Investigación\n\n\
    1. ¿Cuál es la deuda bruta, el efectivo, la deuda neta y la liquidez disponible?\
    \ ¿Qué vencimientos y obligaciones relevantes existen?\n2. ¿Cuál es el FCF normalizado\
    \ y cómo se reconcilia el FCF TTM de 2.410 M USD con el FCF yield de cero reportado\
    \ por AOIF?\n3. ¿Qué periodos y definiciones explican las diferencias entre crecimiento\
    \ de ingresos de 13,7% y 15,68%, y entre márgenes operativos de 19,2% y 21,55%?\n\
    4. ¿Cómo han evolucionado históricamente ingresos, GMV, compradores activos, actividad\
    \ de vendedores, márgenes y conversión de FCF?\n5. ¿Qué productos de IA se están\
    \ implementando, con qué calendario, métricas de adopción y resultados observables?\n\
    6. ¿Qué mercados y categorías son prioritarios para la expansión geográfica? ¿Existe\
    \ evidencia de inversión, lanzamiento o tracción comercial en Asia y Latinoamérica?\n\
    7. ¿Qué datos respaldan la valoración de competencia alta y del moat estrecho?\
    \ ¿Cómo varían la retención y la monetización por categoría y tipo de vendedor?\n\
    8. ¿Qué mecanismos de prevención y resolución existen para fraude, falsificaciones\
    \ y disputas entre usuarios?\n9. ¿Cuál es la remuneración del equipo directivo,\
    \ su participación accionaria y el historial de asignación de capital?\n10. ¿Cuál\
    \ es la composición del board, su independencia y la experiencia relevante de\
    \ sus miembros?\n11. ¿Qué precio de referencia y fecha corresponden a las cifras\
