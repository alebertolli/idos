    | Datos de cuota, penetración y desempeño frente a competidores | No especificada
    | Podrían aclarar si la posición competitiva se mantiene o se erosiona | Pregunta
    abierta en DDD; sin datos |

    | FCF TTM reportado de USD 2.412 millones e ingresos TTM de USD 12.394 millones
    | Período terminado el 2026-09-30 | Punto de referencia para análisis posterior,
    no catalizador futuro por sí mismo | [Stock Analysis](https://stockanalysis.com/stocks/EBAY/statistics/);
    cifras pendientes de validación |


    No se especifican eventos corporativos futuros con fecha confirmada.


    ## 8. Marco de Valoración


    **Valor intrínseco:** no estimable responsablemente con los datos disponibles.
    Faltan fecha y precio de referencia verificables, previsiones, series históricas
    comparables y supuestos de reinversión y conversión de caja.


    ### Métodos apropiados para una investigación posterior


    - **Flujo de caja descontado (DCF):** requiere FCF normalizado, crecimiento, inversión,
    tasa de descuento y valor terminal.

    - **Múltiplos de mercado:** comparar PER y EV/EBITDA con empresas realmente comparables,
    usando fechas y definiciones homogéneas. Los múltiplos suministrados (PER 26,42
    y EV/EBITDA 18,56) no incluyen fuente ni fecha.

    - **Rendimiento de FCF:** calcularlo con capitalización bursátil o valor de empresa
    de una fecha común y FCF validado. El FCF yield reportado como 0 no incluye metodología
    y no es utilizable sin aclaración.


    El paquete DDD presenta objetivos de analistas observados el 2026-11-20: consenso
    de USD 127,11 y rango de USD 71 a USD 153. Los escenarios bear y bull usan USD
    71 y USD 153 como extremos de ese rango, respectivamente. Son **anclas de objetivos
    de analistas, no estimaciones propias de valor intrínseco**. La cotización de
    referencia no está indicada en la información recibida, por lo que no puede calcularse
    el potencial implícito.


    La conclusión sobre un posible error de valoración es **no validable** con la
    evidencia actual. La amplitud del rango de objetivos tampoco demuestra, por sí
    sola, que el mercado esté equivocado.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cómo han evolucionado, sobre una base comparable, los ingresos, el FCF y las
    acciones diluidas? ¿Qué factores explican los cambios?

    2. ¿Cuál es la cuota y penetración de eBay en sus mercados relevantes, y cómo
    varían frente a competidores y canales directos?

    3. ¿Cómo cambian compradores activos, vendedores activos, frecuencia de transacción,
    retención y valor medio de las transacciones?

    4. ¿Qué parte de los ingresos y del FCF reportados al 2026-09-30 es recurrente
    y qué parte puede obedecer a factores temporales?

    5. ¿Cuáles son la deuda, los vencimientos, los costes financieros y las necesidades
    de inversión?

    6. ¿Qué períodos y fuentes sustentan las cifras de crecimiento de ingresos, margen
    operativo y ROIC incluidas en AOIF?

    7. ¿Cómo se calculó el FCF yield de 0 y a qué fecha corresponden el PER y EV/EBITDA
    reportados?

    8. ¿Qué información verificable hay sobre desempeño directivo, compensación, propiedad
    de insiders y composición del consejo?

    9. ¿Cuál es la fecha del próximo reporte y qué indicadores operativos y financieros
    permitirían confirmar o refutar la tesis?


    **Estado de la oportunidad:** investigación requerida. El paquete combina cifras
    financieras reportadas y posibles ventajas de plataforma con vacíos importantes
    de verificación, comparabilidad y evidencia competitiva; no permite una conclusión
    fundamentada sobre valoración o decisión de inversión.


