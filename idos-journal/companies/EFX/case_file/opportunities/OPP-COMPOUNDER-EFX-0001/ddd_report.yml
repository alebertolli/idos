  categoria: quality_at_fair_price
  categorias_descartadas: 'Compounder: podría describir la calidad del negocio, pero
    no se aportan series verificables suficientes para sustentar su desempeño compuesto
    de largo plazo. Compounder castigado: no hay evidencia de un deterioro temporal
    ni de una discrepancia demostrada entre precio y valor. Turnaround: no se documenta
    un declive operativo con plan de recuperación. Deep Value: no hay evidencia de
    activos infravalorados o múltiplos bajos. Cíclica: el perfil descrito no acredita
    que el negocio esté intrínsecamente ligado al ciclo, aunque la actividad crediticia
    podría tener sensibilidad económica. Special Situation: no se aporta una operación
    corporativa o reestructuración. Distressed: no se aportan señales verificables
    de insolvencia. Hype: no hay evidencia de ausencia de beneficios que justifique
    esa clasificación. Value Trap: no hay evidencia suficiente de destrucción estructural
    de valor.'
  justificacion: La información disponible describe un negocio de datos y analítica
    con servicios de verificación y segmentos diversificados, rasgos compatibles con
    una franquicia de calidad. Sin embargo, la evidencia aportada no permite confirmar
    por sí sola la durabilidad del moat ni calcular una valoración intrínseca. La
    cotización observada y el consenso de analistas ofrecen referencias, no una demostración
    de infravaloración; por ello, la categoría más prudente es Quality at Fair Price.
