resumen_ejecutivo: Equifax parece, según el perfil suministrado, una compañía de datos,
  analítica y tecnología con actividades de verificación de identidad, empleo, ingresos
  y crédito. La evidencia financiera estructurada incluye FCF TTM de 1.100 millones
  al 2026-09-30, además de crecimiento de ingresos de 9,6% y margen operativo de 20,993%
  para un período que el proveedor no especifica. La cotización disponible es 184,43
  USD al 2026-10-30 y el consenso observado al 2026-11-20 tiene media y mediana de
  205 USD, con rango de 169 a 245 USD. Esas referencias no bastan para establecer
  valor intrínseco ni para concluir que el mercado comete un error. La tesis depende
  de la persistencia de la demanda, la protección de los activos de datos y la gestión
  de riesgos regulatorios, cibernéticos y de calidad de información; dichos puntos
  requieren verificación adicional.
