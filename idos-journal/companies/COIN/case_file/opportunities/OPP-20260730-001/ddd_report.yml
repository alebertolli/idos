dominio_business_quality:
  analisis: Coinbase cuenta con un 'moat' regulatorio y reputacional significativo
    en EE.UU., siendo el socio preferido de custodia para los emisores institucionales
    de ETF. Sus efectos de red se han intensificado con el lanzamiento de 'Base' (L2
    de Ethereum), creando un ecosistema donde desarrolladores e instituciones convergen.
    Sin embargo, el riesgo de compresión de tarifas en el segmento minorista de alta
    frecuencia limita la calificación a 'buena' en lugar de 'excepcional'.
  rating: buena
