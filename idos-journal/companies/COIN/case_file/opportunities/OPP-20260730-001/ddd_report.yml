dominio_business_quality:
  analisis: El moat de Coinbase se basa en la reputación de marca en EE.UU., el estricto
    cumplimiento normativo (cumplimiento SEC/FINRA), los efectos de red en liquidez
    institucional y la custodia segura de activos. La principal debilidad es el riesgo
    continuo de compresión de comisiones en el segmento minorista a medida que aumenta
    la competencia, aunque compensado por su expansión hacia servicios de infraestructura
    (Base, Staking, Custodia).
  rating: buena
