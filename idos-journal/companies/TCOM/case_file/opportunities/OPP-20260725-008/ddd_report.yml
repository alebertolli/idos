clasificacion_oportunidad:
  categoria: quality_at_fair_price
  categorias_descartadas: Se descartó 'ciclica' porque, aunque el sector viajes es
    discrecional, TCOM posee fosos competitivos estructurales que le permiten mantener
    altos márgenes operativos y rentabilidad operativa a lo largo del ciclo. Se descartó
