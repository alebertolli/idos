resumen_ejecutivo: Trip.com Group Limited es el líder indiscutible en la industria
  de agencias de viajes en línea (OTA) en China y un actor relevante globalmente.
  Con un margen operativo del 24.9% y una estructura financiera sólida (D/E de 0.2x),
  TCOM combina una fuerte generación de caja, efectos de red de dos lados (usuarios/proveedores)
  y la recuperación post-pandémica del viaje emisor internacional. A pesar del entorno
  macroeconómico retador en China, el poder de fijación de precios en el segmento
  premium y el crecimiento internacional ofrecen un margen de seguridad atractivo.
