    angustia, y se descartó 'compounder' puro debido a la exposición al riesgo país/regulatorio
    chino que exige cautela en la valoración.
  justificacion: Trip.com Group (TCOM) posee una posición cuasi-monopolística y red
    efectista sólida en el sector de agencias de viajes online (OTA) en China a través
    de Ctrip y Qunar, complementada con activos internacionales valiosos como Skyscanner
    y Trip.com. Genera un margen operativo del 24.9% y muestra un crecimiento de ingresos
    resiliente (+10.2%), cotizando a múltiplos razonables debido al descuento macroeconómico
    y geopolítico sobre activos chinos.
dominio_business_quality:
  analisis: TCOM opera un modelo de plataforma con un poderoso efecto de red en China.
    A través de Ctrip, Qunar, Skyscanner y Trip.com, controla el tráfico de viajes
    de negocios y turismo de alto poder adquisitivo. Su foso competitivo (Moat) se
    basa en altos costes de cambio para hoteles y aerolíneas dueños de inventario
    (que necesitan el volumen de TCOM) y liquidez de oferta. Sus márgenes operativos
    del 24.9% reflejan este poder de mercado, aunque enfrenta competencia en el segmento
    doméstico de bajo precio por parte de Meituan.
  rating: buena
