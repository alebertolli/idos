  priority: critical
  probability: 0.5
  rationale: Nucor opera en segmentos expuestos al ciclo del acero. Si mejoran la
    utilización de las plantas, los volúmenes y la diferencia entre los precios de
    venta y los costes de materias primas, el beneficio operativo debería recuperarse.
    La información proporcionada señala una mejora reciente del FCF TTM, pero no permite
    distinguir entre recuperación cíclica y estructural; por ello, la mejora debe
    comprobarse en resultados futuros.
