  business_model: Micron Technology, Inc. designs, develops, manufactures, and sells
    memory and storage products in the United States, Taiwan, Japan, Mainland China,
    Hong Kong, Europe, and internationally. It operates through the Cloud Memory Business
    Unit; Core Data Center Business Unit; Mobile and Client Business Unit; and Automotive
    and Embedded Business Unit segments. The company provides memory products, including
    dynamic random access memory components and modules, CXL-based memory, LPDDR components
    and modules, graphics memory, high-bandwidth memory, and data center memory products;
    multichip packages (MCP) comprising embedded multimedia card-based, universal
    flash storage-based, and NAND-based MCPs; and technology leadership products that
    include 1y DRAM and G9 NAND technologies. It also offers storage products, such
    as data center solid-state drives (SSD), client SSD storage, and auto and industrial
    SSD storage; managed NAND; NAND flash; NOR flash; and memory cards. In addition,
    the company provides design tools, including FBGA and part decoders; DRAM power
    calculators; NAND power calculators; simulation models; chipset compatibility
    guides; serial presence-detection tools; cross-reference tools; UFSparm; SSD firmware;
    software and drivers; storage executive software; and obsolete part catalogs.
    It markets its semiconductor memory and storage products under the Micron and
    Crucial brands. The company serves the data center, PC, graphics, networking,
    automotive, industrial, and consumer embedded markets, as well as the smartphone
    and other mobile-device markets. It sells its products through its direct sales
    force, independent sales representatives, distributors, and retailers; web-based
    customer direct sales channel; and channel and distribution partners. Micron Technology,
    Inc. was founded in 1978 and is headquartered in Boise, Idaho.
