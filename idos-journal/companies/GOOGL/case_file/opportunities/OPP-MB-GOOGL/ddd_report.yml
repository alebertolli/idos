    El indicador no cruza el umbral de alerta señalado en el paquete (<0,5). |

    | Crecimiento de ingresos | 22,21% | Período no identificado en el resumen AOIF
    | AOIF; no se proporcionaron fecha, metodología ni fuente verificable. |

    | Margen operativo | 33,32% | Período no identificado en el resumen AOIF | AOIF;
