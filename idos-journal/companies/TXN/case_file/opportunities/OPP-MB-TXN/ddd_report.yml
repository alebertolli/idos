  existing_wiki: '## 1. Visión General de la Compañía


    Texas Instruments Incorporated ([[TXN]]) diseña, fabrica y comercializa semiconductores.
    La información disponible identifica dos segmentos: **Analog** y **Embedded Processing**.
    Su oferta incluye semiconductores analógicos para gestión de energía y procesamiento
    de señales, además de microcontroladores, procesadores y productos de conectividad
    inalámbrica.


    El negocio combina diseño de productos con fabricación propia de obleas e inversión
    en capacidad de producción. Los mercados finales mencionados en la investigación
    incluyen los sectores industrial y automotriz. No se aportaron datos suficientes
    para describir la distribución geográfica de ingresos, fabricación o clientes.


    **Base de evidencia:** descripción del negocio en los análisis DDD y AOIF. Las
    métricas financieras y evaluaciones sin fuente o período explícitos se identifican
    como tales en las secciones correspondientes.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    Los factores de demanda señalados en la investigación son:


    - Volumen de producción de los clientes y contenido de semiconductores por equipo.

    - Demanda de los mercados industrial y automotriz.

    - Demanda de los productos analógicos y de procesamiento integrado de TXN.


    Estos factores pueden exponer los resultados a ciclos de producción e inventario
    de los clientes. La investigación no aporta datos cuantitativos sobre ventas por
    producto, segmento o mercado final.


    ### Moat y posición competitiva


    AOIF caracteriza la posición de TXN como líder y su moat como amplio, atribuyéndolo
    a la amplitud de su catálogo analógico, la experiencia de diseño y fabricación
    y la reputación de fiabilidad. Estas son **evaluaciones del análisis AOIF**, no
    conclusiones verificadas con métricas comparativas o fuentes independientes en
    el paquete recibido.


    La manufactura propia puede ofrecer control sobre fabricación y suministro. A
    la vez, requiere inversión de capital y utilización suficiente de las instalaciones
    para generar retornos adecuados. El sector se describe como cíclico, intensivo
    en capital y tecnología, y con competencia intensa.


    Entre las compañías relacionadas del sector figuran [[ADI]], [[AMAT]], [[AMD]],
    [[ARM]], [[ASML]] y [[AVGO]]. La información disponible no permite comparar cuantitativamente
    su posición frente a TXN.


    ## 3. Perfil Financiero


    ### Métricas reportadas


    | Métrica | Valor informado | Período / fecha | Fuente y limitaciones |

    |---|---:|---|---|

    | Ingresos | No se incluye cifra | TTM al 2026-09-30 | DDD cita Stock Analysis,
    [financials](https://stockanalysis.com/stocks/txn/financials/), pero el paquete
    no transcribe el valor |

    | Margen bruto | 60.24% | TTM al 2026-09-30 | Stock Analysis, [financials](https://stockanalysis.com/stocks/txn/financials/)
    |

    | Margen bruto | 68.76% | FY2022 | Stock Analysis, [financials](https://stockanalysis.com/stocks/txn/financials/)
    |

    | Flujo de caja libre (FCF) | 1,349 | FY2023 | Stock Analysis, [financials](https://stockanalysis.com/stocks/txn/financials/);
    unidad no especificada en el paquete |

    | FCF | 1,498 | FY2024 | Misma fuente; unidad no especificada |

    | FCF | 2,603 | FY2025 | Misma fuente; unidad no especificada |

    | Current ratio | 5.59 | 2026-09-30 | Stock Analysis, [statistics](https://stockanalysis.com/stocks/TXN/statistics/);
    no cruza el umbral de alerta configurado de 0.5 |

    | Crecimiento de ingresos | 20.27% | Período no indicado | Métrica aportada por
    AOIF; sin fuente ni período verificable |

    | Margen operativo | 41.09% | Período no indicado | Métrica aportada por AOIF;
    sin fuente ni período verificable |

    | ROIC | 30.07% | Período no indicado | Métrica aportada por AOIF; sin fuente
    ni período verificable |

    | PER | 34.19 | Período y precio de referencia no indicados | Métrica aportada
    por AOIF; faltan fuente y fecha |

    | EV/EBITDA | 23.0 | Período y fecha no indicados | Métrica aportada por AOIF;
    faltan fuente y fecha |

    | FCF yield | 0 | Período y método no indicados | Métrica aportada por AOIF; no
    puede interpretarse sin datos subyacentes |


    Las cifras de FCF muestran un aumento entre FY2023 y FY2025, pero la información
    disponible no establece si los valores son comparables en unidades, ni explica
    sus componentes. DDD también señala recuperación del FCF TTM al 2026-09-30, aunque
    no transcribe la cifra. Por tanto, no se puede cuantificar ni establecer la sostenibilidad
    de esa recuperación con el paquete recibido.


    El margen bruto TTM de 60.24% al 2026-09-30 es inferior al 68.76% de FY2022. La
    causa y la trayectoria entre esos períodos no están documentadas en la evidencia
    suministrada.


    ### Estructura de capital y calidad de datos


    No se aportan cifras de deuda, efectivo, vencimientos, acciones en circulación
    ni flujo de caja operativo e inversión de capital comparables. DDD informa que
    la dilución interanual no es evaluable por falta del dato comparable de acciones.
    Tampoco se calcula crecimiento de ingresos a tres años ni crecimiento de FCF:
    ambos ratios figuran como no disponibles porque no se identificaron referencias
    explícitas para sus insumos.


    ## 4. Management y Gobierno Corporativo


    AOIF califica la calidad del management como buena, la asignación de capital como
    neutral y el alineamiento de insiders como moderado. Estas valoraciones no vienen
    acompañadas de nombres, datos de propiedad accionaria, historial detallado de
    decisiones de capital ni referencias de evidencia en el material recibido.


    La estrategia de inversión en capacidad propia podría reforzar el control sobre
    fabricación y suministro, pero también eleva la necesidad de capital y la importancia
    de alcanzar una utilización y retornos suficientes. No se proporcionaron datos
    sobre compensación ejecutiva, incentivos, composición del consejo, independencia
    de sus integrantes o estructura de gobierno corporativo.


    **Conclusión:** la evaluación de liderazgo y gobierno permanece incompleta y debe
    tratarse como una valoración preliminar del análisis AOIF.


    ## 5. Tesis de Inversión


    ### Caso alcista: hipótesis por validar


    - TXN participa en los mercados de semiconductores analógicos y de procesamiento
    integrado, con productos destinados, entre otros, a aplicaciones industriales
    y automotrices.

    - La amplitud del catálogo, la experiencia de diseño y fabricación y la reputación
    de fiabilidad podrían sostener ventajas competitivas; esta caracterización proviene
    de AOIF y no está respaldada aquí por comparaciones cuantitativas.

    - La manufactura propia podría mejorar el control de suministro y capacidad. La
    tesis depende de que las inversiones fabriles generen retornos suficientes.

    - DDD informa una recuperación del FCF TTM al 2026-09-30 y margen bruto TTM de
    60.24%. La recuperación sería relevante para la tesis si se confirma en períodos
    posteriores, pero la evidencia disponible no demuestra su sostenibilidad.


    ### Observación de mercado, no valoración propia


    Al 2026-10-30 se reporta un precio de acción de **USD 300.84**. Al 2026-11-21,
    el consenso de precio objetivo observado fue **USD 338.79**. Son observaciones
    de mercado distintas y no constituyen una estimación propia de valor intrínseco.
    DDD concluye que no se puede validar un error de valoración con los datos disponibles.


    La clasificación de oportunidad indicada en DDD es **RESEARCH_REQUIRED**, con
    score general de 56. El paquete no permite convertir la hipótesis alcista en una
    conclusión de inversión.


    ## 6. Riesgos y Contra-Tesis


    ### Riesgos clave


    - **Ciclicidad:** una desaceleración industrial o automotriz, o la acumulación
    de inventario de clientes, podría afectar producción, ingresos y márgenes. AOIF
    califica el impacto como alto y la probabilidad como media; se trata de una evaluación,
    no de una probabilidad cuantificada.

    - **Inversión fabril y retornos:** inversiones elevadas en capacidad podrían no
    alcanzar suficiente utilización o rentabilidad. AOIF evalúa este riesgo con impacto
    alto y probabilidad media.

    - **Presión sobre el margen bruto:** el margen TTM de 60.24% al 2026-09-30 se
    sitúa por debajo del 68.76% de FY2022. El paquete no explica la variación ni demuestra
    estabilización.

    - **Volatilidad del FCF:** el FCF anual reportado varía de 1,349 en FY2023 a 1,498
    en FY2024 y 2,603 en FY2025. La unidad no está especificada y faltan detalles
    sobre inversión de capital y conversión a caja.

    - **Valoración no establecida:** las métricas de PER y EV/EBITDA aportadas por
    AOIF carecen de período y fuente verificables. No permiten concluir si la acción
    está cara o barata.


    ### Contra-tesis


    La recuperación de FCF y margen que DDD identifica podría no sostenerse. Asimismo,
    una posición competitiva descrita como fuerte no garantiza retornos atractivos
    si la competencia, la ciclicidad o las necesidades de capital reducen el rendimiento
    de las inversiones. La evidencia disponible no aporta TAM, penetración por producto
    ni retornos incrementales que permitan resolver estas cuestiones.


    ### Triggers de falsación


    DDD identifica los siguientes criterios de seguimiento:


    1. Reportes financieros comparables posteriores contradicen la recuperación del
    FCF TTM al 2026-09-30.

    2. El margen bruto continúa deteriorándose frente al 60.24% TTM informado, sin
    evidencia de estabilización.


    ## 7. Catalizadores y Timeline


    | Evento o catalizador | Fecha esperada | Impacto potencial | Evidencia y condición
    de seguimiento |

    |---|---|---|---|

    | Nuevos reportes financieros posteriores al TTM terminado el 2026-09-30 | Fecha
    no especificada | Alto para validar o debilitar la tesis de recuperación | Comparar
    ingresos, margen bruto y FCF con períodos equivalentes. DDD, Stock Analysis, [financials](https://stockanalysis.com/stocks/txn/financials/)
    |

    | Confirmación de la trayectoria del margen bruto | Fecha no especificada | Potencialmente
    positivo si se estabiliza o expande; negativo si sigue deteriorándose | Comparar
    con 60.24% TTM al 2026-09-30 y explicar los impulsores. DDD, misma fuente |

    | Evolución de demanda e inventarios industrial y automotriz | Fecha no especificada
    | Potencialmente relevante para volúmenes y utilización fabril | AOIF recomienda
    vigilar ingresos, márgenes, pedidos y cambios en inventarios de clientes |


    No se proporcionaron fechas de próximos resultados ni objetivos cuantificados
    para estos catalizadores; no se presupone un calendario concreto.


    ## 8. Marco de Valoración


    La valoración intrínseca **no es estimable de forma responsable** con la información
    disponible. AOIF indica que faltan precio y fecha de referencia para sus métricas
    y que no hay cifras comparables suficientes de flujo de caja operativo, inversión
    de capital y beneficio neto para verificar la conversión a FCF.


    ### Metodología apropiada para investigación adicional


    - **DCF basado en FCF normalizado:** requiere series comparables de ingresos,
    márgenes, impuestos, inversión de capital, capital de trabajo y FCF, además de
    supuestos explícitos de crecimiento y tasa de descuento.

    - **Valoración relativa:** PER y EV/EBITDA podrían utilizarse como referencias,
    pero solo con fecha, períodos, metodología y comparables definidos. Los valores
    de 34.19 y 23.0 aportados por AOIF no cumplen esas condiciones en el paquete actual.

    - **Retornos sobre capital:** evaluar ROIC y retornos incrementales frente al
    costo y calendario de las inversiones fabriles antes de asumir que la expansión
    de capacidad crea valor.


    ### Escenarios observados por DDD


    DDD presenta escenarios a un horizonte del **2027-11-21**, con fecha de análisis
    **2026-11-21**. Los precios son anclas del rango observado de objetivos de analistas,
    **no valoraciones intrínsecas propias ni resultados garantizados**.


    | Escenario | Precio objetivo | Interpretación |

    |---|---:|---|

    | Bear | USD 250 | Ancla del extremo bajo del rango de objetivos observado |

    | Bull | USD 422 | Ancla del extremo alto del rango de objetivos observado |


    La sensibilidad principal de la tesis está en la persistencia de la recuperación
    de FCF, la estabilización o expansión del margen bruto, la demanda industrial
    y automotriz y los retornos de la capacidad fabril.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es el TAM y la penetración por producto, segmento y mercado final, y
    qué evidencia respalda su evolución?

    2. ¿Qué retornos sobre capital e incrementales produce la reinversión, incluyendo
    el efecto de la inversión fabril?

    3. ¿Cuáles son las cifras comparables de ingresos, FCF, flujo operativo e inversión
    de capital para establecer la tendencia y la conversión a caja?

    4. ¿Qué explica el descenso del margen bruto desde 68.76% en FY2022 hasta 60.24%
    TTM al 2026-09-30?

    5. ¿Se confirma en reportes posteriores la recuperación de FCF TTM señalada por
    DDD?

    6. ¿Cómo evolucionan pedidos, producción e inventarios de clientes en los mercados
    industrial y automotriz?

    7. ¿Qué deuda, efectivo, vencimientos y evolución de acciones en circulación presenta
    la compañía?

    8. ¿Qué período, fuente y metodología corresponden a las cifras de crecimiento
    de ingresos de 20.27%, margen operativo de 41.09%, ROIC de 30.07%, PER de 34.19,
    EV/EBITDA de 23.0 y FCF yield de 0 reportadas por AOIF?

    9. ¿Qué datos respaldan las evaluaciones de calidad del management, alineamiento
    de insiders, asignación de capital, posición de liderazgo y amplitud del moat?

    10. ¿Cuál es el consenso de analistas por número de participantes y rango completo,
    y cómo se relaciona con estimaciones financieras comparables? Los valores disponibles
    —USD 300.84 al 2026-10-30 y consenso de USD 338.79 al 2026-11-21— no bastan para
    validar un error de valoración.


    [[TXN]] está clasificada como **RESEARCH_REQUIRED** hasta que estas lagunas de
    evidencia se resuelvan.


