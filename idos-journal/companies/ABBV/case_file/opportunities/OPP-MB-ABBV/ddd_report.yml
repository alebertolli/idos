  existing_wiki: '## Business


    AbbVie Inc., a research-based biopharmaceutical company, engages in the research
    and development, manufacturing, commercializing, and sale of medicines and therapies
    worldwide. The company offers Skyrizi to treat autoimmune diseases; Rinvoq to
    treat inflammatory diseases; Imbruvica for the treatment of adult patients with
    blood cancers; Venclexta to treat blood cancers; Elahere to treat various cancer;
    and Epkinly to treat lymphoma; and Emrelis for the treatment of lung cancer. It
    also provides facial injectables, plastics and regenerative medicine, body contouring,
    and skincare products; botox Cosmetic for the treatment of glabellar lines, crow''s
    feet, forehead lines, and platysma bands; Juvederm Collection to treat volume
    loss in the temples, undereye, cheeks, chin, lips and lower face; Vraylar to treat
    schizophrenia, bipolar disorder, and depressive disorder; Duodopa to treat Parkinson''s
    disease; Ubrelvy to treat migraine; Qulipta for episodic and chronic migraine;
    and Vyalev for the treatment of motor fluctuations, as well as Botox Therapeutic
    to treat chronic migraine, overactive bladder, spasticity, cervical dystonia,
    and other conditions. In addition, the company offers Ozurdex for visual impairment;
    Lumigan/Ganfort and Alphagan/Combigan for the reduction of elevated intraocular
    pressure in patients with open angle glaucoma or ocular hypertension; and other
    eye care products, including Refresh/Optive, Xen, Durysta, and Restasis. Further,
    it provides Mavyret to treat chronic hepatitis C virus genotype 1-6 infection;
    Creon, a pancreatic enzyme therapy; and Linzess/Constella to treat irritable bowel
    syndrome with constipation and chronic idiopathic constipation. The company was
    incorporated in 2012 and is headquartered in North Chicago, Illinois.


