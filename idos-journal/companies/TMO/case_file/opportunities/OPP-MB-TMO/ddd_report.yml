prompt_inputs:
  business_model: 'Thermo Fisher Scientific Inc. provides life sciences solutions,
    analytical instruments, specialty diagnostics, and laboratory products and biopharma
    services internationally. It operates through four segments: Life Sciences Solutions,
    Analytical Instruments, Specialty Diagnostics, and Laboratory Products and Biopharma
    Services. The Life Sciences Solutions segment includes reagents, instruments,
    and consumables for biological and medical research; discovery and production
    of drugs and vaccines; and diagnosis of infections and diseases. Its Analytical
    Instruments segment provides instruments, consumables, software, and services
    for pharmaceutical, biotechnology, academic, government, environmental, and other
    research and industrial markets, as well as clinical laboratories. The Specialty
    Diagnostics segment offers clinical diagnostics products, such as liquid ready-to-use
    and lyophilized immunodiagnostic reagent kits, calibrators, controls, protein
    detection assays, and instruments; immunodiagnostic offerings comprising developing,
    manufacturing, and marketing of complete blood-test systems for the clinical diagnosis
    and monitoring of allergy, asthma and autoimmune diseases; microbiology offerings,
    such as dehydrated and prepared culture media, collection and transport systems,
    instrumentation and consumables to detect pathogens in blood, diagnostic and rapid
    direct specimen tests, quality-control products, and associated products; transplant
    diagnostics products, including human leukocyte antigen typing and testing for
    the organ transplant market; and healthcare market channel offerings. Its Laboratory
    Products and Biopharma Services segment provides laboratory products, research
    and safety market channel, and pharma services and clinical research. Thermo Fisher
    Scientific Inc. was founded in 1956 and is headquartered in Waltham, Massachusetts.'
