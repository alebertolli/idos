  de semiconductores con un sólido moat tecnológico y exposición global. Presenta
  generación de caja libre robusta (5.6B USD), márgenes operativos superiores al 30%
  y crecimiento de ingresos del 7.8% en TTM. El precio cotiza 38% bajo el promedio
