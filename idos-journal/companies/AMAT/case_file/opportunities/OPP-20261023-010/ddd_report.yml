  de semiconductores con un fuerte moat tecnológico y exposición a tendencias de crecimiento
  estructural. Sus métricas financieras (FCF >5B USD, margen operativo >30%) son robustas
  y el precio de mercado está significativamente descontado respecto al consenso de
  analistas, indicando un posible error de valoración. Los principales riesgos son
  las tensiones geopolíticas EE.UU.-China y la ciclicidad del sector, pero catalizadores
  como la relajación de restricciones y el impulso de la demanda de IA podrían desbloquear
  valor.
