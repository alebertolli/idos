  de semiconductores con un moat basado en tecnología de materiales y relaciones de
  larga data con los principales fabricantes. Presenta finanzas robustas (FCF >5 B
  USD, margen operativo >30 %) y oportunidades de crecimiento vinculadas a la demanda
  de IA, centros de datos y avances en tecnología ALD. El precio de mercado está notablemente
  por debajo del consenso de analistas, lo que indica un posible error de mercado
  que puede ser explotado.
