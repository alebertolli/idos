    DDD informa un precio objetivo medio de analistas de 561,89 USD y un rango de
    358 a 900 USD, pero no incluye la fuente o fecha de esa recopilación en el material
    disponible. El mismo análisis afirma que existe un descuento aproximado del 38%
    frente al objetivo medio, pero el precio de referencia necesario para verificar
    ese cálculo no está especificado. Por ello, ese descuento no se considera validado
    en esta entrada.


    ### Escenarios recibidos


    Los siguientes objetivos son resultados del análisis DDD, no estimaciones verificadas
    independientemente:


    | Escenario a 18-11-2028 | Precio objetivo | Supuestos principales |

    |---|---:|---|

    | Bajista | 300 USD | Crecimiento del capex global inferior al 2% anual durante
    dos años, restricciones adicionales a China y presión sobre márgenes |

    | Alcista | 900 USD | Crecimiento del capex superior al 12% anual en 2025–2026
    y captura de más del 15% de mercado adicional en deposición avanzada |


    El escenario alcista utiliza supuestos para 2025–2026 pese a que la fecha de referencia
    del análisis es 18-11-2026. Esa inconsistencia temporal debe resolverse antes
    de emplear el escenario.


    ### Enfoque de valoración a desarrollar


    Conviene contrastar una valoración por flujo de caja descontado con múltiplos
    de empresas comparables, utilizando un ciclo normalizado. Las variables principales
    deberían incluir el crecimiento de ventas, los márgenes, la conversión a FCF,
    la intensidad de capital, la exposición a China y el ritmo de inversión de los
    clientes. La investigación disponible no contiene suficiente información para
    especificar supuestos numéricos adicionales ni para calcular una sensibilidad
    fiable.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es la estructura exacta de deuda de AMAT, sus vencimientos y su ratio
