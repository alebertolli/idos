    ## 8. Marco de Valoración


    La investigación AOIF informa PER de 27,71, EV/EBITDA de 23,02, rentabilidad del
    FCF de 2% y un valor intrínseco estimado de 750 USD. No especifica la fecha de
    los múltiplos, el método de valoración, el horizonte del valor intrínseco ni los
