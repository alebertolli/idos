    Global Services (AGS) segments. The Semiconductor Systems segment includes semiconductor
    capital equipment to enable materials engineering steps, including etch, rapid
    thermal processing, deposition, chemical mechanical planarization, metrology and
    inspection, wafer packaging, and ion implantation. The AGS segment offers integrated
    solutions to optimize equipment and fab performance and productivity comprising
    spares, upgrades, services, and 200 millimeter and other equipment and factory
    automation software for semiconductor and other products. It serves manufacturers
    of semiconductor wafers and chips, and other electronic devices. Applied Materials,
    Inc. was incorporated in 1967 and is headquartered in Santa Clara, California.
