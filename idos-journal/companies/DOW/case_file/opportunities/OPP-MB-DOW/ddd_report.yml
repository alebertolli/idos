  existing_wiki: '## 1. Visión General de la Compañía


    **Dow Inc. (DOW)** es una compañía global de ciencia de materiales que desarrolla
    y fabrica productos químicos y materiales para clientes industriales y comerciales.
    Su modelo parte de adquirir hidrocarburos, energía y otros insumos, procesarlos
    en instalaciones químicas integradas y vender los productos resultantes a distintos
    mercados finales.


    Entre los productos mencionados en la investigación figuran etileno, propileno,
    polietileno, aromáticos, elastómeros de poliolefina, EVA y caucho EPDM. Sus clientes
    incluyen fabricantes de envases y embalajes, y empresas de construcción e infraestructura.
    La investigación también describe segmentos de Packaging & Specialty Plastics
    e Industrial Intermediates & Infrastructure, pero no aporta una descripción completa
    y verificada de todos los segmentos ni un desglose geográfico de ingresos.


    La compañía opera en una industria global y cíclica, expuesta a los precios de
    materias primas y energía, a la oferta y demanda, y a la utilización de capacidad.
    La información disponible no permite cuantificar la contribución de cada región
    o mercado final.


    ## 2. Modelo de Negocio y Posición Competitiva


    Los ingresos dependen de la venta de materiales y productos químicos a clientes
    industriales. Los principales factores económicos identificados son:


    - Volúmenes vendidos y utilización de las plantas.

    - Precios de productos y capacidad de trasladar cambios de costos a los clientes.

    - Costos y disponibilidad de hidrocarburos, materias primas y energía.

    - Condiciones de demanda y oferta en los mercados finales.


    La investigación caracteriza a Dow como un **líder competitivo**, con un **moat
    estrecho**. La escala global, la integración de operaciones, la experiencia en
    procesos químicos y las relaciones con clientes podrían ofrecer ventajas operativas
    y comerciales. No se aportan datos comparativos suficientes para medir la duración
    o magnitud de esas ventajas frente a competidores.


    La ciclicidad de la industria puede limitar la estabilidad de márgenes y retornos:
    la debilidad de la demanda o el exceso de oferta pueden presionar precios, volúmenes
    y utilización; los aumentos de costos pueden reducir márgenes si el traspaso a
    precios es incompleto.


    Como referencias de compañías relacionadas dentro del universo sectorial existente
    en la wiki pueden consultarse [[DD]], [[IFF]] y [[ECL]]. La información aportada
    no establece comparaciones directas de cuota de mercado o costos entre estas compañías
    y Dow.


    ## 3. Perfil Financiero


    Las métricas de esta tabla provienen de los inputs de investigación. Cuando no
    se proporciona período, metodología o fuente primaria, se indica expresamente:
    no deben interpretarse como cifras plenamente comparables o verificadas de forma
    independiente.


    | Métrica | Valor reportado | Período o limitación |

    |---|---:|---|

    | Ingresos: crecimiento | 4,15% | El input AOIF no especifica período, fuente
    ni metodología |

    | Margen operativo | 4,29% | El input AOIF no especifica período ni definición
    |

    | ROIC | 5,65% | El input AOIF no especifica período ni metodología |

    | EV/EBITDA | 8,72x | El input AOIF no incluye fecha ni componentes de cálculo
    |

    | FCF yield | 0 | Período y definición no especificados; no es posible interpretarlo
