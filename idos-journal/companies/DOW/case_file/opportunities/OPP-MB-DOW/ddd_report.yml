    ## 8. Marco de Valoración


    La información disponible no permite estimar de forma independiente el valor intrínseco
    de Dow. AOIF califica el margen de seguridad como **insuficiente** y declara que
    no puede estimarlo de manera independiente por falta de precio de referencia,
