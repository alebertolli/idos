    bajista y USD 41 como escenario alcista. Ambos valores se describen como anclas
    tomadas de los extremos del consenso de analistas, no como resultados de un modelo
    financiero independiente.


    Para una valoración posterior sería necesario normalizar los beneficios y el FCF
    a través del ciclo, aclarar deuda neta y necesidades de inversión, y comprobar
    la sostenibilidad de márgenes y retornos. El múltiplo EV/EBITDA reportado de 8,72x
    carece de fecha y datos de cálculo; el FCF yield de 0 y el PER de 0 tampoco son
    interpretables sin conocer sus definiciones y períodos. No se reportan sensibilidades
    cuantitativas a precios de productos, insumos, volúmenes o márgenes.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es el importe exacto del FCF TTM al 2026-09-30 y cómo se reconcilia con
    el FCF anual negativo de FY 2024 y FY 2025?

    2. ¿Qué factores explican la pérdida neta TTM de USD 905 millones y cuánto depende
    de elementos cíclicos o no recurrentes?

    3. ¿Qué períodos, fuentes y definiciones respaldan el crecimiento de ingresos
    de 4,15%, el margen operativo de 4,29%, el ROIC de 5,65% y el EV/EBITDA de 8,72x?

    4. ¿Cuál es la deuda neta, el calendario de vencimientos y el costo efectivo de
    financiación? ¿Cómo se calcula el dato reportado de cobertura de intereses igual
    a 0?

    5. ¿Qué objetivos cuantificados ha establecido management para márgenes, FCF,
    retornos sobre capital, reinversión y asignación de capital?

    6. ¿Qué porcentaje de ingresos, beneficios y activos corresponde a cada segmento,
    región y mercado final?

    7. ¿Cómo se comparan la utilización de capacidad, los costos de producción y la
    evolución de márgenes de Dow con competidores relevantes, incluida [[DD]]?

    8. ¿Cuál es la metodología y fecha detrás del consenso de USD 34,39 y del rango
    de USD 29–41?

    9. ¿Cuál es el desglose de incentivos, propiedad de insiders y composición del
    board necesario para validar las evaluaciones de gobierno corporativo del input
    AOIF?


