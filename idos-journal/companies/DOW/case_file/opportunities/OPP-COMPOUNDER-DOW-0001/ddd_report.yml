    | **Composición del board** | No se dispone de detalle, pero la política de gobierno\
    \ sigue los estándares de la industria química. |\n\n---\n\n## 5. Tesis de Inversión\
    \  \n\n- **Clasificación:** *Multibagger* (potencial de alta revalorización)【DDD‑clasificacion_oportunidad】.\
    \  \n- **Justificación:**  \n  1. **Recuperación del margen bruto** por encima\
    \ del 12 % histórico (catalizador positivo)【DDD‑dominio_catalizadores】.  \n  2.\
