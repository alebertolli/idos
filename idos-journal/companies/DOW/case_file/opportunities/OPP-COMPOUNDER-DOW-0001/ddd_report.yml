  existing_wiki: "## 1. Visión General de la Compañía  \n**Dow Inc.** es un proveedor\
    \ global de productos químicos y materiales de alto desempeño que opera en tres\
    \ segmentos principales: **Packaging & Specialty Plastics**, **Industrial Intermediates\
    \ & Infrastructure** y **Performance Materials & Coatings**. Su cadena de valor\
    \ abarca la extracción de materias primas (petróleo y gas natural), producción\
    \ de olefinas, polimerización, transformación y formulación, y culmina con la\
    \ distribución a través de redes logísticas y ventas directas a fabricantes y\
    \ usuarios finales en América del Norte, Europa, Oriente Medio, África, India,\
    \ Asia‑Pacífico y Latinoamérica【AOIF‑paso1】.  \n\nEl negocio se orienta a industrias\
    \ de empaques, construcción, movilidad, consumo y agricultura, ofreciendo productos\
    \ como etileno, propileno y polietileno【AOIF‑paso1】.  \n\n---\n\n## 2. Modelo\
    \ de Negocio y Posición Competitiva  \n\n| Aspecto | Detalle |\n|---|---|\n| **Drivers\
    \ de revenue** | Demanda de materiales sostenibles, precios de materias primas,\
    \ ciclos de inversión en construcción y automotriz. |\n| **Moat** | Ventajas de\
    \ escala, integración vertical y cartera diversificada que generan barreras de\
    \ entrada y lealtad de clientes【AOIF‑paso3】. |\n| **Dinámica competitiva** | Industria\
    \ química con presión de precios de materias primas y regulaciones medioambientales\
    \ cada vez más estrictas; tendencia a la consolidación e innovación tecnológica【AOIF‑paso3】.\
    \ |\n| **Posición competitiva** | Líder de mercado en varios sub‑segmentos, con\
    \ “amplio” moat y posición de liderazgo reconocida【AOIF‑paso3】. |\n\n---\n\n##\
    \ 3. Perfil Financiero  \n\n### Métricas clave (2026‑09‑30)  \n\n| Métrica | Valor\
    \ | Comentario |\n|---|---|---|\n| **Crecimiento de ingresos (3‑a)** | *No disponible*\
    \ (falta de dato histórico)【DDD‑ratios_investigados】 | |\n| **Margen operativo**\
    \ | 4.29 %【AOIF‑paso2】 | Estable pero bajo presión. |\n| **ROIC** | 5.65 %【AOIF‑paso2】\
    \ | Moderado. |\n| **Conversión de FCF** | 0.58 (58 %)【AOIF‑paso2】 | Indica generación\
    \ de efectivo razonable pese a pérdidas netas. |\n| **Cobertura de intereses**\
    \ | 0 x (insuficiente)【DDD‑dominio_riesgos】 | Muy por debajo del umbral de 2.0 x\
    \ (alto riesgo). |\n| **Deuda neta / EBITDA** | 3.2 x (cerca del límite de 4.0 x)【DDD‑dominio_riesgos】\
    \ | Riesgo moderado. |\n| **Free‑cash‑flow yield** | 3.2 %【AOIF‑paso6】 | Adecuado\
    \ según criterio interno. |\n| **PER** | 12【AOIF‑paso6】 | Valoración relativa.\
