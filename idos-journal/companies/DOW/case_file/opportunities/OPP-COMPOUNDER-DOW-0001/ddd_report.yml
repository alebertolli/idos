    \ y PER. |\n| **Precio consenso (USD)** | Low 30.0 – Mean 34.76 – High 41.0【DDD‑consenso_actual】\
    \ | Fuente: *stockanalysis* y *yfinance* (26‑Oct‑2026). |\n\n### Estructura de\
