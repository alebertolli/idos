    si se revierte o no se traduce en resultados operativos. | Margen bruto reportado
    de 44,36% en FY2022 y 54,1% en FY2025. |

    | Publicación de resultados y datos segmentarios | Calendario no incluido en el
    paquete | Podría aclarar crecimiento, volúmenes, márgenes y generación de caja
    por segmento. | Se necesitan datos separados de SendTech y Presort Services. |


    El paquete no incluye fechas futuras de publicación de resultados ni una guía
    de la compañía. Por ello, el calendario de catalizadores queda pendiente de confirmación.


    ## 8. Marco de Valoración


    No es posible determinar un valor intrínseco fiable con los datos disponibles.
    AOIF reporta EV/EBITDA de 7,13x, P/E de 11,41x y FCF yield de 0, pero no especifica
    fecha, metodología ni inputs completos. Estos múltiplos no deben interpretarse
    como una valoración vigente o directamente comparable hasta verificar precio,
    capitalización, deuda neta, EBITDA, beneficio y flujo de caja correspondientes.


    ### Metodologías apropiadas para una evaluación posterior


    - **Flujo de caja descontado (DCF):** requeriría FCF normalizado, previsiones
    por segmento, necesidades de capital, coste de capital y valor terminal.

    - **Múltiplos comparables:** requeriría confirmar los múltiplos y seleccionar
    comparables adecuados, teniendo en cuenta diferencias de negocio y exposición
    al correo físico y a paquetes.

    - **Análisis por segmentos:** permitiría distinguir la evolución de SendTech y
    Presort Services, pero no hay información suficiente para hacerlo con el paquete
    actual.


    El análisis AOIF califica el margen de seguridad como **insuficiente** y señala
    que no puede determinarse un valor intrínseco fiable.


    Como referencias de mercado —no como valoraciones intrínsecas— el consenso de
    analistas reportado el **2026-11-21** tenía media y mediana de **USD 19,72**,
    con rango de **USD 18–22**. La cotización observada fue **USD 16,31** al **2026-10-30**.
    Las fechas son distintas y el horizonte de los objetivos no está especificado;
    por tanto, la diferencia entre estas referencias no demuestra por sí sola una
    infravaloración.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cómo evolucionan por separado los ingresos, volúmenes, retención, economía
    unitaria y retornos sobre capital de SendTech y Presort Services?

    2. ¿Cuál es el mercado direccionable y qué penetración tiene PBI en cada negocio?

    3. ¿Qué factores explican la caída de ingresos entre FY2022 y FY2025 y el aumento
    simultáneo del margen bruto?

    4. ¿Se mantiene el FCF en períodos futuros comparables? ¿Qué componentes explican
    el nivel reportado para el TTM terminado el 2026-09-30?

    5. ¿Cuál es la definición y el desglose de la cobertura de intereses reportada
    como 0x? ¿Cómo se distribuyen los vencimientos de deuda y cuál es el coste efectivo
    de financiación?

    6. ¿Cuál es el período y la metodología de las métricas AOIF de crecimiento de
    ingresos, margen operativo, ROIC, EV/EBITDA, P/E y FCF yield?

    7. ¿Qué métricas de retención, costes de cambio y rentabilidad respaldan la evaluación
    de moat estrecho y de posición competitiva retadora?

    8. ¿Cuál es el historial de ejecución del equipo directivo, el nivel de propiedad
    de insiders y la estructura del consejo?

    9. ¿Cuál es el calendario confirmado de resultados y qué guía proporciona la compañía
    para ingresos, márgenes, inversión y FCF?


    **Estado de decisión:** pendiente de investigación adicional; el material disponible
    no permite validar una tesis de multibagger ni establecer un valor intrínseco
    fiable.


