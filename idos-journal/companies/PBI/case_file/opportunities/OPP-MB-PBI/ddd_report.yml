    |---|---:|---|---|

    | Ingresos | 2.483 | FY2022 | Stock Analysis; la fuente citada es la página de
    estados financieros. |

    | Ingresos | 1.893 | FY2025 | Stock Analysis; la fuente citada es la página de
    estados financieros. |

    | Margen bruto | 44,36% | FY2022 | Stock Analysis; estados financieros. |

    | Margen bruto | 54,1% | FY2025 | Stock Analysis; estados financieros. |

