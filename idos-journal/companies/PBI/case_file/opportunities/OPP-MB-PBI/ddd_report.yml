    ### Enfoque recomendado y sensibilidad


    La valoración debería priorizar escenarios de flujo de caja y capacidad de servicio
    de deuda, complementados por múltiplos solo después de normalizar EBIT, EBITDA
    y FCF. Las variables de sensibilidad más importantes son:


    - Evolución de ingresos y márgenes operativos.

    - EBIT y cobertura de intereses.

    - FCF absoluto, inversión de capital y capital de trabajo.

    - Deuda neta, coste de financiación y calendario de vencimientos.


    No es posible calcular sensibilidades cuantitativas con los datos disponibles.
    El consenso no debe interpretarse como valor intrínseco ni como margen de seguridad.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. **Dilución:** ¿Cuál ha sido la tasa de dilución de acciones y cómo ha cambiado
    el número de acciones en circulación?

    2. **Cobertura de intereses:** ¿Cómo se calcula el valor de 0x y a qué periodo
    corresponde? ¿Qué EBIT, gasto por intereses y ajustes lo sustentan?

    3. **Plan de la gerencia:** ¿Qué medidas específicas propone la dirección para
    mejorar el EBIT y la cobertura de intereses?

    4. **Deuda:** ¿Cuál es la deuda neta actual, su coste, sus vencimientos y sus
    cláusulas financieras? ¿Supera el umbral de US$2.500 millones citado como falsador?

    5. **Liquidez:** ¿A qué fecha corresponde el current ratio de 0,7 y qué activos
    y pasivos corrientes incluye?

    6. **Calidad de caja:** ¿Cuál es el FCF absoluto y cómo se reconcilian su crecimiento
    TTM reportado de 121,49% y el FCF yield de 0?

    7. **Consistencia financiera:** ¿Qué periodos y definiciones explican la diferencia
    entre el margen operativo de 22,56% y la evaluación de cobertura de intereses
    insuficiente?

    8. **Ingresos y segmentos:** ¿Cómo evolucionan los ingresos y márgenes de SendTech
    y de clasificación de correo? ¿Qué parte está vinculada a USPS?

    9. **Ventaja competitiva:** ¿Hay evidencia cuantitativa de retención, costes de
    cambio, densidad de rutas o economías de escala?

    10. **Gobierno corporativo:** ¿Cuál es la propiedad de insiders, la estructura
    de incentivos y la composición del board?

    11. **Valoración:** ¿Qué datos financieros normalizados sustentan los múltiplos
    reportados y los objetivos de consenso?


