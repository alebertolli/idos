    El análisis AOIF también proporciona crecimiento de ingresos de **5,52%**, margen
    operativo de **21,97%** y ROIC de **6,6%**, pero no indica período, definición
    ni fuente para esas cifras. Por ello no deben tratarse como una serie financiera
    validada ni compararse directamente con las métricas anteriores.


    No se pudieron validar los ratios de CAGR de ingresos a tres años ni de crecimiento
