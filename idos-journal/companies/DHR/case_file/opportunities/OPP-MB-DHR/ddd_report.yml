  existing_wiki: '## 1. Visión General de la Compañía


    Danaher Corporation (DHR) desarrolla, fabrica y comercializa instrumentos, consumibles,
    reactivos, software y servicios para biotecnología, ciencias de la vida y diagnóstico
    clínico. Su oferta incluye soluciones para desarrollar y fabricar terapias, analizar
    muestras y automatizar flujos de trabajo de laboratorio.


    La compañía vende a empresas biofarmacéuticas y biotecnológicas, laboratorios
    académicos, gubernamentales y comerciales. Según la descripción disponible, distribuye
    globalmente y complementa la venta de equipos con consumibles, mantenimiento,
    soporte y servicios técnicos. No se aportan datos para cuantificar la distribución
    geográfica de ingresos.


    Las actividades se sitúan en los sectores de herramientas de ciencias de la vida,
    tecnología médica y diagnóstico. Entre las compañías relacionadas por sector o
    exposición a tendencias sanitarias se encuentran [[ABT]], [[ABBV]], [[AMGN]],
    [[AZN]], [[BIIB]], [[BMY]], [[CAH]] y [[CVS]]; no todas son competidoras directas
    de Danaher.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Fuentes de ingresos y propuesta de valor


    Danaher combina la venta de instrumentos y equipos con consumibles recurrentes,
    reactivos, software y servicios. La base instalada de instrumentos puede favorecer
    compras posteriores de consumibles y soporte, aunque la información disponible
    no cuantifica la proporción recurrente ni la retención de clientes.


    Los productos descritos incluyen soluciones de cultivo, filtración, purificación
    y llenado aséptico para la fabricación de terapias, así como instrumentos y consumibles
    para espectrometría de masas, citometría de flujo, genómica, automatización de
    laboratorio y análisis bioquímico.


    ### Ventajas competitivas potenciales


    El análisis AOIF caracteriza la posición competitiva como líder y la amplitud
    potencial del moat como amplia. Identifica como fuentes posibles de ventaja:


    - Marcas y reputación.

    - Base instalada de instrumentos.

    - Consumibles vinculados a los equipos y costes de cambio asociados a flujos de
    trabajo.

    - Relaciones de largo plazo con clientes.

    - Amplitud de productos, servicios y capacidades de soporte.


    Estas características son hipótesis cualitativas del análisis disponible, no una
    demostración cuantificada de poder de precios, retención, retornos sobre capital
    o ventaja sostenible.


    ### Dinámica competitiva e industrial


    La demanda puede beneficiarse de la investigación biomédica, el desarrollo y fabricación
    de terapias, las necesidades clínicas y la automatización de laboratorios. También
    puede ser cíclica: una reducción del gasto de clientes biotecnológicos o de la
    financiación para investigación podría afectar pedidos de instrumentos, consumibles
    y servicios. La sustitución tecnológica y la presión competitiva son riesgos relevantes.


    ## 3. Perfil Financiero


    Las cifras siguientes son las reportadas en los materiales de investigación. Las
    observaciones TTM y “Current” se refieren al **25 de septiembre de 2026** según
    el paquete DDD; no se proporcionan definiciones completas ni reconciliaciones
    de todas las métricas.


    | Métrica | Valor reportado | Periodo / referencia | Observaciones |

    |---|---:|---|---|

    | Ingresos | USD 26.643 mil millones | FY 2022 | Serie citada en el paquete DDD
    |

    | Ingresos | USD 23.890 mil millones | FY 2023 | La causa de la disminución no
    está establecida |

    | Ingresos | USD 24.568 mil millones | FY 2025 | Por debajo del dato reportado
    para FY 2022 |

    | Margen bruto | 59,36% | TTM al 25-09-2026 | Fuente: [Stock Analysis, estadísticas
    de DHR](https://stockanalysis.com/stocks/DHR/statistics/) |

    | Flujo de caja libre (FCF) | USD 5.260 millones | FY 2025 | Fuente: [Stock Analysis,
    estadísticas de DHR](https://stockanalysis.com/stocks/DHR/statistics/) |

    | Flujo de caja libre (FCF) | USD 5.727 millones | TTM al 25-09-2026 | La comparación
