    | Deuda total | USD 19.696 millones | FY 2025 | Fuente: [Stock Analysis, estadísticas
    de DHR](https://stockanalysis.com/stocks/DHR/statistics/) |

    | Deuda total | USD 27.782 millones | Current al 25-09-2026 | Aumento respecto
    a FY 2025; no se identifica su causa |

    | Current ratio | 1,63 | Al 25-09-2026 | El paquete indica que supera el umbral
    configurado de 0,5 |

    | Cobertura de intereses | 0 | Al 25-09-2026 | Dato reportado sin reconciliación;
