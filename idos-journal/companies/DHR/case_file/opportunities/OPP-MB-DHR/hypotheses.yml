    metric: Crecimiento orgánico de ingresos del ejercicio fiscal 2027
    prediction: En la publicación de resultados del ejercicio fiscal 2027, el crecimiento
      orgánico de ingresos será de al menos 4% frente al ejercicio fiscal 2026, según
      la definición de crecimiento orgánico comunicada por Danaher.
    unit: porcentaje interanual mínimo
  priority: critical
  probability: 0.5
  rationale: La compañía opera en biotecnología, ciencias de la vida y diagnóstico,
    pero la información disponible no valida la demanda subyacente ni la penetración
    de mercado. La hipótesis es que una recuperación de la demanda en sus mercados
    finales se traducirá en crecimiento orgánico; debe comprobarse con resultados
    reportados, no inferirse de los ingresos TTM de USD 25.608 millones.
  review_trigger: Dejar de creerla si Danaher reporta crecimiento orgánico inferior
