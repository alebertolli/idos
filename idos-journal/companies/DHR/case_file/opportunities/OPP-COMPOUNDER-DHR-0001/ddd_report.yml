resumen_ejecutivo: 'DHR parece reunir atributos de calidad y un modelo de negocio
  diversificado en áreas de herramientas para ciencias de la vida, biotecnología y
  diagnóstico, pero la información suministrada no basta para verificar la durabilidad
  del moat, la valoración relativa ni el perfil de deuda. La evidencia financiera
  disponible registra FCF TTM de USD 5.730 millones al 2026-09-25, un crecimiento
  de ingresos reportado por yfinance de 8,3% con período no especificado y margen
  operativo reportado de 21,132% también con período no especificado. No se debe interpretar
  ese crecimiento como orgánico ni anualizado. El consenso de analistas supera la
  cotización observada, aunque no prueba infravaloración. Conclusión: calidad potencialmente
  alta, valoración no demostrablemente atractiva y tesis dependiente de confirmar
  recuperación y crecimiento sostenible.'
