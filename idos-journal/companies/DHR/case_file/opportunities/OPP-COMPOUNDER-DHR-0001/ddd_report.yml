tesis_inversion: 'La tesis favorable es que una plataforma diversificada de herramientas,
  consumibles y servicios para ciencias de la vida, biotecnología y diagnóstico puede
  sostener demanda recurrente y generar caja a lo largo del tiempo. La evidencia aportada
  no permite demostrar cuánto de esa calidad ya está incluido en el precio ni verificar
  la normalización del crecimiento. La posición analítica es neutral: el precio está
  por debajo del consenso medio, pero dentro del rango observado y sin prueba independiente
  de infravaloración. La tesis se fortalecería con crecimiento orgánico segmentario
  y caja sostenibles; se debilitaría con contracción persistente de demanda, erosión
  de márgenes o evidencia de pérdida de relevancia competitiva.'
