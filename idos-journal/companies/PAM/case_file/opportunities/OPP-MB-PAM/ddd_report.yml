    9. ¿Qué medidas concretas de regulación, tarifas o concesiones podrían afectar
    los retornos y en qué plazos?

    10. ¿Cuáles son la participación de insiders, los incentivos de la dirección y
    la composición e independencia del directorio?

    11. ¿Qué supuestos sostienen el consenso y el rango de objetivos de analistas,
    y qué cobertura o dispersión tienen?

    12. ¿Existe una serie comparable de acciones en circulación para evaluar dilución?


