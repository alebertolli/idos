  business_model: NetEase, Inc. engages in online games, music streaming, online intelligent
    learning services, and internet content services businesses in China and internationally.
    The company operates through Games and Related Value-Added Services; Youdao; NetEase
    Cloud Music; and Innovative Businesses and Others segments. It develops and operates
    mobile and PC games; and offers games licensed from other developers. The company
    also provides live streaming service, and other related or ancillary value-added
    services related to games, such as the sale of game-themed merchandise. In addition,
    it offers digital content services with interactive learning features, including
    Youdao Lingshi and Youdao Literature; STEAM courses consisting computer coding
    courses and other STEAM courses; and adult courses, such as China University massive
    open online course. Further, the company provides Youdao Dictionary, an online
    language tool; Confucius, a large language model for the education sector; Hi
    Echo, an AI-driven virtual English-speaking tutor; Mr. P AI Tutor, a conversation-based
    tool; Youdao Desktop Translation, a desktop dictionary tool; U-Dictionary, an
    online dictionary and translation app; iRecord, an audio transcription tool; LectMate,
    an interpretation software for study-abroad lecture scenarios; iArch, an AI home
    design software; Baby Genius, an AI baby generator; and One Translate Translator,
    a translation tool for travelers. It also offers online marketing services consisting
    of performance-based advertising services, and global marketing and promotion
    services through banners, text links, videos, logos, buttons, and rich media.
    Additionally, the company develops and offers smart devices, including Youdao
    Dictionary Pen, Youdao Listening Pod, and Youdao Smart Learning Pad. NetEase,
    Inc. was formerly known as NetEase.com, Inc. and changed its name to NetEase,
    Inc. in March 2012. The company was founded in 1997 and is headquartered in Hangzhou,
    the People's Republic of China.
