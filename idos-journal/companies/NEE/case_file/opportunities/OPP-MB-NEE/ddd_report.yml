    | FCF yield | 0% | Fecha y metodología no especificadas | Valor reproducido por
    AOIF; el FCF TTM reportado por DDD es negativo. |


    **Fuente identificada para current ratio:** [StockAnalysis — NEE Statistics](https://stockanalysis.com/stocks/NEE/statistics/),
    período terminado el 30-09-2026.


    ### Lectura financiera


    El FCF TTM negativo, junto con el apalancamiento calculado, plantea una cuestión
    de financiación y asignación de capital. No se dispone de un desglose que permita
    distinguir qué parte del FCF negativo responde a inversión de crecimiento, mantenimiento
    u otros factores. Tampoco se aportan vencimientos de deuda, costo de financiación
    ni cobertura de intereses.


    Las métricas de crecimiento, margen y ROIC suministradas por AOIF carecen de período
    y metodología detallados. Por ello, no bastan para concluir que la inversión de
    capital se esté traduciendo en retornos atractivos.


    ## 4. Management y Gobierno Corporativo


    La evaluación AOIF califica la calidad del management como **buena** y la asignación
    de capital como **neutral**. Como contexto, señala la escala y diversificación
    de los activos, pero también el FCF TTM negativo y el endeudamiento elevado.


    El alineamiento de insiders se califica como **débil**. No se incluyen datos de
    propiedad accionarial de insiders, transacciones recientes, remuneración, incentivos
    de largo plazo ni composición del consejo de administración. Por tanto, esas valoraciones
    no pueden verificarse con el material disponible.


    **Conclusión provisional:** evaluación mixta y pendiente de validar con información
    detallada de gobierno corporativo, incentivos y resultados de inversión.


    ## 5. Tesis de Inversión


    ### Caso favorable


    La tesis favorable depende de que las inversiones de NEE en generación, almacenamiento
    y redes produzcan crecimiento rentable y una mejora de la generación de efectivo.


    Elementos que podrían respaldar esa tesis:


    - La combinación de una utility regulada en Florida y una plataforma de generación
    y almacenamiento diversifica las actividades de la compañía.

    - La franquicia de FPL y las redes locales pueden ofrecer barreras geográficas
    de entrada.

    - La transición hacia renovables y almacenamiento y la demanda de electricidad
    podrían sostener oportunidades de inversión.

    - Una mejora del FCF, acompañada de evidencia de retornos adecuados sobre el capital
    invertido, reduciría la preocupación por la financiación de la reinversión.


    Estos puntos describen condiciones que podrían favorecer la tesis; no demuestran
    que los proyectos actuales generen retornos suficientes.


    ### Estado de validación


    El paquete califica la calidad del negocio como mixta, con validación insuficiente.
    El FCF TTM negativo y el apalancamiento calculado son limitaciones centrales.
    No puede validarse un error de valoración con la evidencia disponible, y AOIF
    no determina un valor intrínseco riguroso.


    ## 6. Riesgos y Contra-Tesis


    | Riesgo | Evidencia disponible | Implicación |

    |---|---|---|

    | FCF negativo | -USD 18.011 millones TTM al 30-09-2026; -USD 12.121 millones
    en FY 2025 | Puede aumentar la necesidad de financiación; no se conoce el desglose
    entre inversión de crecimiento y otros usos. |

    | Apalancamiento | Deuda neta calculada de aproximadamente USD 108.353 millones
    y deuda neta/EBITDA de aproximadamente 8,09x al 30-09-2026 | Sensibilidad potencial
    a tasas de interés, refinanciación y costo de financiación. |

    | Retornos de inversión no demostrados | No se proporcionan retornos por proyecto
    ni desgloses de retorno sobre capital | El crecimiento de ingresos, por sí solo,
    no valida que la reinversión cree valor. |

    | Dilución no evaluada | No hay historia fechada comparable de acciones | No puede
    determinarse si se supera el umbral configurado de dilución interanual del 10%.
    |

    | Riesgo de valoración | No hay estimación intrínseca suficientemente sustentada
    | Los objetivos de analistas no sustituyen una valoración propia. |


    ### Contra-tesis


    La inversión intensiva podría no generar retornos suficientes o podría tardar
    en traducirse en efectivo, mientras el endeudamiento eleva la sensibilidad a las
    condiciones de financiación. En ese caso, la expansión de activos no necesariamente
    beneficiaría a los accionistas.


    ### Triggers de falsación


    - Persistencia del FCF negativo sin evidencia de retornos de inversión suficientes.

    - Empeoramiento del endeudamiento o de la cobertura de intereses.


    ## 7. Catalizadores y Timeline


    No se proporcionan fechas específicas de resultados, puesta en servicio de proyectos,
    decisiones regulatorias u otros eventos corporativos. Por ello, los catalizadores
    se presentan como hitos de seguimiento, no como eventos fechados.


    | Hito a observar | Fecha esperada | Impacto potencial |

    |---|---|---|

    | Publicación de resultados que explique la evolución y composición del FCF |
    Sin fecha indicada; revisar en próximos reportes | Una trayectoria de FCF menos
    negativa o positiva podría reducir la preocupación por la financiación de la reinversión.
    |

    | Evidencia de crecimiento rentable y retornos sobre capital o por proyecto |
    Sin fecha indicada; revisar conforme se divulguen resultados de proyectos | Permitiría
    evaluar si el crecimiento de activos crea valor y no solo aumenta la escala. |

    | Evolución del endeudamiento, costo de financiación, vencimientos y cobertura
    de intereses | Sin fecha indicada; seguimiento continuo en reportes financieros
    | Un deterioro elevaría el riesgo financiero; una mejora podría reducirlo. |


    Los objetivos de analistas incluidos en DDD son anclas observadas de escenarios,
    no estimaciones intrínsecas propias. Para el 20-11-2026, los extremos reportados
    fueron USD 56 y USD 117; DDD también reporta una cotización observada de USD 83,71
    al 30-10-2026. No se detallan fechas esperadas de convergencia ni metodología
    de valoración de esos objetivos.


    ## 8. Marco de Valoración


    ### Enfoques pertinentes


    Para una empresa eléctrica integrada y intensiva en capital, la valoración debería
    distinguir entre las actividades reguladas de FPL y los activos de generación,
    almacenamiento y ventas mayoristas de NEER. La investigación disponible no incluye
    la información necesaria para construir una valoración segmentada.


    Como marcos de trabajo, una investigación adicional podría considerar:


    - **Valoración de flujos de caja:** proyecciones por segmento, inversión de mantenimiento
    y crecimiento, financiación, impuestos y costo de capital.

    - **Valoración de activos y retornos:** evaluación de los retornos esperados de
    proyectos y de la base de activos regulada.

    - **Múltiplos comparables:** solo con períodos, definiciones y universos comparables
    claramente documentados.


    ### Información de valoración disponible


    AOIF reporta PER de 15,29x, EV/EBITDA de 21,2x y FCF yield de 0%, pero no especifica
    fecha ni metodología. DDD recoge una cotización de USD 83,71 al 30-10-2026 y un
    rango observado de objetivos de analistas de USD 56–117 al 20-11-2026. Esos objetivos
    representan referencias de consenso, no una valoración intrínseca validada.


    ### Sensibilidad y limitaciones


    No se puede realizar un análisis de sensibilidad cuantitativo fiable sin proyecciones,
    costo de capital, estructura de deuda detallada, retornos por proyecto y escenarios
    de regulación y financiación. La sensibilidad debería centrarse, como mínimo,
    en:


    - Retornos de los nuevos activos y ritmo de puesta en servicio.

    - Evolución del FCF y necesidades de financiación.

    - Tasas de interés, costo de deuda y refinanciación.

    - Tratamiento regulatorio y recuperación de inversiones de FPL.


    El valor intrínseco se considera **no determinable con rigor** a partir del paquete
    disponible; AOIF también califica el margen de seguridad como insuficiente.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué retornos sobre capital y retornos por proyecto obtiene NEE en sus inversiones
    de generación, almacenamiento y redes?

    2. ¿Qué explica el FCF negativo y qué proporción corresponde a inversión de crecimiento,
    mantenimiento u otros usos?

    3. ¿Cómo evolucionan la deuda, los vencimientos, el costo de financiación y la
    cobertura de intereses?

    4. ¿Qué parte del crecimiento y de los retornos procede de FPL frente a NEER?

    5. ¿Cuál es la metodología, el período y la base de cálculo de las métricas de
    crecimiento de ingresos, margen operativo y ROIC reportadas por AOIF?

    6. ¿Cómo se reconcilia el FCF yield de 0% reportado por AOIF con el FCF TTM negativo
    reportado por DDD?

    7. ¿Cuál ha sido la evolución comparable del número de acciones y de la dilución?

    8. ¿Qué incentivos, remuneración y propiedad accionarial tienen los directivos
    e integrantes del consejo?

    9. ¿Qué supuestos y metodología sustentan los objetivos de analistas de USD 56–117
    reportados al 20-11-2026?

    10. ¿Qué proyecciones de FCF y retornos permitirían construir una valoración por
    segmentos y un análisis de sensibilidad?


    **Prioridades de seguimiento:** evolución y explicación del FCF; retornos de las
    inversiones; deuda frente a EBITDA, costo y vencimientos de financiación; cobertura
    de intereses; y dilución accionarial.


