    | Crecimiento de ingresos | 9,61% | Período no especificado | Metodología y período
    no detallados en AOIF. |

    | Margen operativo | 30,03% | Período no especificado | Metodología no especificada.
    |

    | ROIC | 3,13% | Período no especificado | Metodología no especificada; requiere
    validar retornos por proyecto. |

    | FCF | -USD 18.011 millones | TTM terminado el 30-09-2026 | No se proporciona
    desglose que explique la cifra. |

    | FCF | -USD 12.121 millones | FY 2025 | La comparación de crecimiento de FCF
