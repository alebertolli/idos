clasificacion_oportunidad:
  categoria: compounder
  categorias_descartadas: Quality at Fair Price (descartado porque el crecimiento
    potencial fuera de FQ no está completamente reflejado en el múltiplo actual, dando
    espacio para compresión/expansión de retornos); Turnaround / Deep Value (descartado
    ya que el negocio jamás ha estado en declive ni destruyendo valor); Hype (descartado
    porque genera ingresos de $12.2B y FCF masivo recurrente).
  justificacion: Vertex Pharmaceuticals es el monopolio de facto en el tratamiento
    de la Fibrosis Quística (FQ), lo que le otorga un foso competitivo (moat) extremadamente
    ancho respaldado por patentes vigentes hasta finales de la década de 2030, márgenes
    operativos cercanos al 40% y un ROIC del 28.6%. La empresa está reinvirtiendo
    eficientemente sus flujos de caja masivos en una cartera diversificada de enfermedades
    graves (dolor agudo con VX-548, terapia génica CASGEVY con CRISPR y enfermedad
    renal APOL1), lo que garantiza la transición de un monoproducto FQ a una plataforma
    biotecnológica multiterapéutica.
dominio_business_quality:
  analisis: El foso competitivo (moat) de Vertex es uno de los más sólidos del sector
    farmacéutico. En FQ, trata a la gran mayoría de los pacientes elegibles a nivel
    mundial con terapias moduladoras de CFTR (Trikafta/Kaftrio). El desarrollo de
    su 'vanza triple' consolida aún más su posición frente a cualquier competidor
    potencial. El modelo de negocio ofrece una resiliencia extrema gracias a la naturaleza
    crónica de la enfermedad y una tasa de retención de pacientes cercana al 100%.
  rating: excepcional
