prompt_inputs:
  business_model: 'BlackBerry Limited provides intelligent software and services to
    enterprises and governments worldwide. The company operates through three segments:
    Secure Communications, QNX, and Licensing. The company offers BlackBerry Dynamics,
    a development platform and secure container for mobile applications; BlackBerry
    Workspaces a secure Enterprise File Sync and Share (EFSS) solution; BlackBerry
    Messenger (BBM) Enterprise, an enterprise-grade secure instant messaging solution
    for messaging, voice, and video; BlackBerry SecuSUITE, a multi-OS voice and text
    messaging solution; BlackBerry AtHoc, a secure networked critical event management
    solution; and BlackBerry unified endpoint management (UEM) solutions. It also
    provides BlackBerry Certicom, a patented elliptic curve cryptography, which provides
    device security, anti-counterfeiting, and product authentication solutions; BlackBerry
    Radar offers asset monitoring and telematics solutions for transportation and
    logistics; and BlackBerry Development Platform, an enterprise-grade toolset. In
    addition, the company offers enterprise consulting and engineering consulting
    services. Further, it is involved in patent licensing. The company was formerly
    known as Research In Motion Limited and changed its name to BlackBerry Limited
    in July 2013. BlackBerry Limited was incorporated in 1984 and is headquartered
    in Waterloo, Canada.'
