resumen_ejecutivo: BlackBerry Limited es un proveedor de software de seguridad y plataformas
  de gestión de dispositivos con exposición a sectores gubernamentales y automotrices.
  Presenta crecimiento de ingresos del 14% TTM, margen operativo del 16% y flujo de
  caja libre positivo de 92 MM USD. El precio de 8.40 USD está por debajo del consenso
  de analistas (media 9.87 USD). El principal riesgo es la competencia en ciberseguridad,
  pero existen catalizadores claros (contratos gubernamentales y adopción de QNX)
  que podrían impulsar la valoración.
