fundamentals:
  business_model: NVIDIA Corporation operates as a data center scale AI infrastructure
    company in the United States, Taiwan, China, Hong Kong, Europe, and internationally.
    It operates through Compute & Networking, and Graphics segments. The Compute &
    Networking segment provides data center accelerated computing and networking platforms
    and artificial intelligence solutions and software, and automotive platforms and
    autonomous and electric vehicle solutions, including software. The Graphics segment
    offers GeForce GPUs for gaming and PCs; Quadro/NVIDIA RTX GPUs for enterprise
    workstation graphics. The company's products are used in gaming, professional
    visualization, data center, and automotive markets. It sells its products to original
    equipment manufacturers, original device manufacturers, system integrators and
    distributors, independent software vendors, cloud service providers, add-in board
    manufacturers, distributors, automotive manufacturers and tier-1 automotive suppliers,
    and other ecosystem participants. NVIDIA Corporation was incorporated in 1993
    and is headquartered in Santa Clara, California.
