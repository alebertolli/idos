    | Recuperación de ingresos y mejora de cobertura de intereses | No especificada
    | Positivo para la solvencia y la valoración | Supuesto del escenario alcista;
    no es un evento confirmado. |


    ## 8. Marco de Valoración


    El valor intrínseco no puede estimarse de forma fiable con los datos recibidos.
    AOIF señala la falta de precio y capitalización de mercado verificables, deuda
    neta, acciones diluidas, beneficios normalizados y flujos de caja suficientes.
    El valor de EV/EBITDA informado en AOIF (2.056,59) tampoco puede utilizarse sin
    validar sus inputs y metodología.


    **Enfoques apropiados para una evaluación futura:**


    - **Flujo de caja descontado:** una vez reconstruidos los flujos operativos, capex,
    necesidades de financiación y deuda.

    - **Valoración por segmentos:** si se obtienen resultados separados y comparables
    para motocicletas, financiación, productos relacionados y LiveWire.

    - **Múltiplos de comparables:** con beneficios o EBITDA normalizados y empresas
    comparables justificadas; la información actual no permite establecer múltiplos
    fiables.


    DDD aporta un rango de consenso de analistas de **19 a 40 USD**, con media y mediana
    de **31,5 USD**. El material también menciona un precio actual de **31,22 USD**,
    pero no establece una fuente verificable para ese precio. Estas cifras son datos
    del análisis suministrado y no una valoración independiente.


