  existing_wiki: '## 1. Visión General de la Compañía


    Harley-Davidson, Inc. ([[HOG]]) diseña, fabrica y vende motocicletas en Estados
    Unidos y otros mercados internacionales. Su actividad también incluye productos
    y servicios relacionados, financiación a clientes y ventas mediante concesionarios
    independientes y canales digitales.


    La oferta descrita en los materiales incluye motocicletas de combustión —cruiser,
    trike, touring, standard, sportbike, adventure touring y dual sport—, así como
    motocicletas eléctricas y bicicletas eléctricas. Los clientes incluyen compradores
    de motocicletas nuevas y usadas, además de propietarios que adquieren repuestos,
    accesorios, ropa y servicios.


    La información disponible identifica tres segmentos, pero no proporciona sus nombres,
    ingresos ni contribución a resultados. Por ello, no es posible caracterizar aquí
    su composición financiera.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    - Volumen de motocicletas vendidas y mezcla de modelos y regiones.

    - Precio medio, promociones e incentivos al consumidor.

    - Demanda de repuestos, accesorios, ropa y servicios relacionados.

    - Actividad de financiación a clientes, cuya contribución no está cuantificada
    en los materiales disponibles.


    La cadena de valor abarca diseño e ingeniería, abastecimiento y fabricación, gestión
    de inventario y logística, y distribución mediante concesionarios y canales digitales.


    ### Moat y posición competitiva


    La marca, la identidad cultural, la comunidad de propietarios y la red de concesionarios
    podrían favorecer fidelidad, poder de precios y ventas complementarias. El análisis
    AOIF caracteriza la amplitud del moat como **estrecha** y la posición competitiva
    como líder, pero no aporta métricas que permitan verificar retención, cuota de
    mercado, precios relativos o rentabilidad incremental. Estas valoraciones deben
    considerarse indicativas, no hechos cuantitativamente confirmados.


    La compañía compite en una industria sensible al gasto discrecional, la disponibilidad
    de crédito, las preferencias demográficas y los cambios tecnológicos y regulatorios.
    La información disponible menciona competencia en precio, sin identificar competidores
    directos ni comparar sus resultados. Entre las compañías relacionadas por exposición
    a consumo discrecional, vehículos o productos de marca se encuentran [[HMC]],
    [[GM]] y [[RACE]]; la relación no implica equivalencia de negocio.


    ## 3. Perfil Financiero


    Los datos financieros cuantificados proceden de Stock Analysis, según las observaciones
    fechadas en los materiales de investigación. Los períodos fiscal anual y TTM no
    son directamente comparables como una serie anual uniforme.


    | Métrica | Valor | Período / fecha | Observación |

    |---|---:|---|---|

    | Ingresos | USD 5.836 millones | FY 2023 | Cifra reportada por Stock Analysis
    |

    | Ingresos | USD 3.982 millones | TTM al 2026-09-30 | No equivale a un ejercicio
    fiscal completo comparable |

    | Beneficio neto | USD 338,74 millones | FY 2025 | Cifra reportada por Stock Analysis
    |

    | Beneficio neto | -USD 131,96 millones | TTM al 2026-09-30 | Resultado neto negativo
    |

    | Crecimiento de FCF | -20,39% | TTM al 2026-09-30 | Tasa reportada por el proveedor;
    el paquete no detalla los períodos exactos de comparación |

    | Current ratio | 1,97x | 2026-09-30 | No cruza el umbral de riesgo de 0,5x indicado
    en el análisis |

    | Precio objetivo medio observado | USD 31,50 | Observado el 2026-11-21 | Fuentes
    citadas: Stock Analysis y Yahoo Finance |

    | Cotización | USD 31,22 | 2026-10-30 | Fecha de observación indicada en el análisis
    |


    El paquete también contiene valores de crecimiento de ingresos de **-14,64%**,
    margen operativo de **-4,26%**, ROIC de **-4,14%** y EV/EBITDA de **2.056,59**.
    AOIF advierte que no se especifican período, metodología ni fuente para esos valores;
    deben verificarse antes de utilizarlos en conclusiones o comparaciones.


    No se proporcionan datos suficientes para evaluar deuda neta, vencimientos, flujo
    de caja operativo, inversión de capital, conversión de beneficios en efectivo
    o dilución interanual. Stock Analysis no ofrecía en el paquete una cifra comparable
    de acciones para evaluar dilución.


    **Fuentes:** [Stock Analysis — Financials](https://stockanalysis.com/stocks/hog/financials/)
    (datos citados al 2026-09-30); [Stock Analysis — Statistics](https://stockanalysis.com/stocks/HOG/statistics/)
    (current ratio citado al 2026-09-30). El consenso y el precio objetivo se atribuyen
    también a Yahoo Finance, observados el 2026-11-21; no se proporcionó un enlace
    específico a esa observación.


    ## 4. Management y Gobierno Corporativo


    La evaluación AOIF califica la calidad del management como **regular**, la asignación
    de capital como **neutral** y el alineamiento de insiders como **moderado**. Sin
    embargo, los materiales no incluyen resultados detallados de iniciativas estratégicas,
    historial cuantificado de asignación de capital, remuneración ejecutiva, tenencia
    accionarial de insiders ni información sobre la composición del board.


    Estas valoraciones no pueden verificarse con la evidencia suministrada. No hay
    base suficiente para concluir si los incentivos directivos están alineados con
    la creación de valor por acción o si las decisiones de capital han generado retornos
    atractivos.


    ## 5. Tesis de Inversión


    ### Caso alcista, sujeto a confirmación


    - La marca Harley-Davidson, su comunidad de propietarios y su red de concesionarios
    podrían sostener fidelidad y ventas de productos complementarios.

    - Una recuperación de volumen, precios o mezcla de modelos podría contribuir a
    estabilizar ingresos y márgenes.

    - La expansión o recuperación de repuestos, accesorios, ropa, servicios y financiación
    podría diversificar la actividad respecto de la venta inicial de motocicletas.
    Los materiales no cuantifican esta contribución.

    - La cotización observada de USD 31,22 estaba cerca del precio objetivo medio
    de USD 31,50 citado en el paquete. Esa proximidad no valida por sí sola una oportunidad
    de valoración: faltan los supuestos del consenso y una valoración independiente.


    La tesis es **de investigación pendiente**, no una conclusión de crecimiento compuesto.
    La evidencia financiera disponible muestra ingresos TTM inferiores a los ingresos
    de FY 2023 y una pérdida neta TTM, pero las ventanas de tiempo no son plenamente
    comparables. No se dispone de información suficiente para confirmar que la compañía
    haya iniciado una recuperación.


    ## 6. Riesgos y Contra-Tesis


    ### Caso bajista y riesgos clave


    - **Deterioro financiero:** ingresos de USD 3.982 millones TTM al 2026-09-30 y
    pérdida neta de USD 131,96 millones en ese período, según Stock Analysis.

    - **Flujo de caja:** el FCF reportado cayó 20,39% en TTM. El paquete no presenta
    el desglose de sus impulsores ni los importes subyacentes.

    - **Demanda discrecional:** una reducción del gasto de los consumidores, cambios
    demográficos o variaciones en preferencias puede reducir la demanda de motocicletas.

    - **Concesionarios e inventario:** la dependencia de concesionarios, los niveles
    de inventario y el uso de incentivos pueden afectar el volumen y los precios.

    - **Crédito:** la industria depende de la confianza del consumidor y del acceso
    a financiación; el impacto específico sobre Harley-Davidson no está cuantificado.

    - **Competencia y transición tecnológica:** la competencia en precio, los cambios
    tecnológicos y los requisitos regulatorios pueden presionar la posición de la
    compañía.

    - **Incertidumbre de valoración:** el paquete no permite determinar si el mercado
    subestima o sobrestima el valor intrínseco. Faltan expectativas de consenso detalladas,
    comparables y supuestos verificables.


    ### Triggers de falsación


    La hipótesis de recuperación se debilitaría si:


    1. Los ingresos y márgenes continúan deteriorándose en períodos posteriores que
    sean comparables.

    2. La compañía no recupera un beneficio neto positivo ni estabiliza el FCF en
    períodos posteriores.

    3. Una recuperación de ventas depende de incentivos que erosionen precios o márgenes,
    una posibilidad que requiere comprobar con datos futuros.


    ## 7. Catalizadores y Timeline


    | Catalizador o hito a monitorear | Fecha esperada | Impacto potencial |

    |---|---|---|

    | Próximos resultados financieros comparables | No especificada en los materiales
    | La recuperación sostenida de ingresos, márgenes y beneficio neto podría respaldar
    una estabilización; nuevos deterioros reforzarían la contra-tesis |

    | Evolución del FCF frente a la caída reportada de 20,39% | Próxima actualización
    financiera; fecha no especificada | Una mejora sería una señal favorable, pero
    será necesario identificar si proviene de operaciones sostenibles, capital de
    trabajo u otros factores |

    | Ventas, precios, mezcla de modelos, inventario e incentivos por región | Seguimiento
    continuo; no hay fechas ni hitos corporativos identificados | Permitiría distinguir
    una recuperación de demanda de un aumento de ventas impulsado principalmente por
    descuentos |

    | Cambios en guía o anuncios corporativos | No disponibles en el paquete | Podrían
    modificar las expectativas si aportan objetivos cuantificados y verificables |


    No se proporcionan fechas de resultados, guía de la compañía ni un calendario
    de eventos específicos. Por tanto, los puntos anteriores son indicadores a vigilar,
    no catalizadores confirmados con fecha.


    ## 8. Marco de Valoración


    No es posible estimar responsablemente un valor intrínseco con la información
    disponible. El paquete carece de precio y capitalización fechados para construir
    una valoración completa, deuda neta, flujo de caja libre y resultados normalizados,
    así como supuestos de crecimiento y rentabilidad a largo plazo.


    ### Enfoques posibles para una investigación posterior


    - **DCF basado en flujo de caja libre:** apropiado solo después de normalizar
    resultados y separar capital de trabajo, inversión de mantenimiento y otros componentes
    del FCF.

    - **Múltiplos comparables:** requeriría seleccionar empresas realmente comparables,
    normalizar métricas y confirmar períodos y definiciones de EV/EBITDA y otros múltiplos.

    - **Escenarios de recuperación:** comparar casos de estabilización, recuperación
    y deterioro usando supuestos explícitos sobre volumen, precios, mezcla, márgenes
    y conversión a efectivo.


    ### Supuestos y sensibilidades que deben modelarse


    La valoración sería especialmente sensible a la trayectoria de ventas y márgenes,
    la intensidad de los incentivos, la recuperación del beneficio neto, la conversión
    de efectivo y la inversión de mantenimiento. AOIF etiqueta el margen de seguridad
    como **insuficiente**, pero la falta de inputs verificables impide reconstruir
    ese juicio.


    El precio objetivo medio observado de USD 31,50 frente a una cotización de USD
    31,22 (datos observados en las fechas citadas en la sección 3) indica proximidad
    entre ambas cifras, no una estimación independiente del valor intrínseco. No hay
    evidencia suficiente para afirmar un error de valoración del mercado.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué explica la caída de ingresos y margen bruto, y qué parte es temporal frente
    a estructural?

    2. ¿Cuáles son los ingresos, márgenes y beneficios por segmento, región y categoría
    de producto?

    3. ¿Qué retornos incrementales sobre capital obtiene la compañía? ¿Cuál es la
