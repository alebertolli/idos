  existing_wiki: '## 1. Visión General de la Compañía


    Harley-Davidson, Inc. ([[HOG]]) diseña, fabrica y vende motocicletas en Estados
    Unidos y otros mercados internacionales. También comercializa piezas, accesorios
    y ropa, y ofrece servicios financieros. Su distribución combina una red de concesionarios
    independientes con canales digitales.


    La empresa opera en motocicletas recreativas y premium, un segmento expuesto al
    gasto discrecional, los ciclos económicos, las preferencias de movilidad y los
    cambios demográficos. La información disponible no detalla los ingresos ni la
    rentabilidad por segmento o geografía.


    **Fecha de corte de la información suministrada:** 22 de noviembre de 2026. Las
    métricas financieras recibidas no incluyen siempre período, unidades o fuentes
    verificables; deben interpretarse con cautela.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    - Volumen de motocicletas vendidas y precio medio.

    - Mezcla de modelos y mercados geográficos.

    - Ventas de piezas, accesorios y ropa a propietarios de Harley-Davidson.

    - Actividad de financiación asociada al negocio.


    ### Moat y competencia


    La marca histórica, la comunidad de clientes, la red de concesionarios y el ecosistema
    de productos y servicios pueden contribuir a la diferenciación y la lealtad. La
    evaluación disponible califica la amplitud del moat como **estrecha**: no hay
    evidencia suficiente para confirmar la durabilidad de estas ventajas ni su capacidad
    de proteger márgenes.


    La compañía se describe como líder en su posición competitiva, pero esta clasificación
    no viene acompañada de datos de cuota de mercado. En motocicletas, compite con
    fabricantes como [[HMC]]; la información suministrada no contiene una comparación
    financiera o competitiva directa. Por exposición a demanda discrecional, también
    puede resultar útil comparar algunos riesgos con compañías de consumo como [[ANF]],
    aunque operan en actividades distintas.


    La electrificación puede modificar la dinámica competitiva. El material identifica
    a LiveWire como posible catalizador, pero no aporta datos verificables sobre ventas,
    cuota, rentabilidad o contribución a los resultados.


    ## 3. Perfil Financiero


