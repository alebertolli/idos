    5. ¿Cómo evolucionan las ventas minoristas frente a los envíos a concesionarios,
    los inventarios, los precios y los incentivos?

    6. ¿Qué proporción de la demanda depende de financiación y cómo cambian las aprobaciones,
    los impagos y la rentabilidad de esa actividad?

    7. ¿Qué deuda, vencimientos, obligaciones financieras y compromisos de capital
    tiene la compañía?

    8. ¿Cómo se sustentan y definen los valores de crecimiento de ingresos (-14,64%),
    margen operativo (-4,26%), ROIC (-4,14%) y EV/EBITDA (2.056,59) aportados por
    AOIF?

    9. ¿Qué muestran los datos comparables de acciones en circulación, remuneración
    ejecutiva, propiedad de insiders y composición del board?

    10. ¿Qué expectativas financieras sustentan el precio objetivo medio de USD 31,50,
    y con qué fechas, analistas y supuestos se calculó?

    11. ¿Qué evidencia cuantitativa confirma la fuerza de marca, la fidelidad, el
    poder de precios y la posición competitiva?

    12. ¿Existe guía corporativa o un calendario de hitos que permita evaluar de forma
    anticipada la recuperación?


