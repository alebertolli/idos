    **Fuentes consignadas en DDD:** [estadísticas de HOG en StockAnalysis](https://stockanalysis.com/stocks/HOG/statistics/)
    y [financieros de HOG en StockAnalysis](https://stockanalysis.com/stocks/hog/financials/),
    ambas con fecha de consulta indicada del 22-11-2026. El crecimiento del FCF TTM
    de -20,39% se atribuye a esta última fuente en el material recibido.


    El análisis disponible describe una tendencia financiera deteriorada y señala
    presión sobre ingresos, márgenes y retornos. AOIF indica que no hay datos suficientes
    de flujo de caja operativo, capex y FCF para evaluar la conversión de caja. Tampoco
    se proporcionan cifras verificables de deuda absoluta, vencimientos, liquidez
    o estructura de capital. Las estimaciones de apalancamiento extremo y cobertura
    nula requieren validación antes de usarse en una valoración.


    ## 4. Management y Gobierno Corporativo


    La información recibida califica la calidad de la gestión como **regular**, la
    asignación de capital como **neutral** y el alineamiento de insiders como **débil**.
    Estas valoraciones no vienen acompañadas de datos sobre resultados del equipo
    directivo, participación accionaria, remuneración, recompras, dividendos, adquisiciones
    o rendimientos de inversiones.


    No se proporcionan nombres ni antecedentes de ejecutivos, composición del consejo,
    independencia de sus integrantes, comités, estructura de incentivos ni tenencia
    accionaria de insiders. Por tanto, no es posible emitir una evaluación fundamentada
    del liderazgo o del gobierno corporativo.


    ## 5. Tesis de Inversión


    La tesis alcista depende de que Harley-Davidson logre estabilizar el negocio tradicional
    y mejorar la rentabilidad, apoyándose en sus activos de marca, distribución y
    relación con los clientes.


    **Elementos potencialmente favorables, sujetos a verificación:**


    - La marca, la comunidad de clientes y la red de concesionarios podrían sostener
    la diferenciación y las ventas de productos relacionados.

    - Un crecimiento rentable de LiveWire y su expansión internacional podrían abrir
    una fuente adicional de ingresos. El material lo identifica como catalizador,
    pero no aporta resultados que confirmen su escala o rentabilidad.

    - La reducción de costos y una recuperación del margen bruto podrían mejorar la
    rentabilidad operativa.

    - El escenario alcista de DDD supone crecimiento anual de ingresos del 5%, crecimiento
    anual del FCF del 10%, margen bruto de 25%, reducción de deuda y cobertura de
    intereses superior a 2x. Son **supuestos de escenario**, no hechos observados.


    La tesis perdería credibilidad si no se recuperan ingresos, márgenes y generación
    de caja, o si el endeudamiento impide financiar la operación y las prioridades
    estratégicas.


    ## 6. Riesgos y Contra-Tesis


    El caso bajista se apoya en la posibilidad de que la debilidad de ingresos y rentabilidad
    persista en un negocio cíclico y discrecional. DDD clasifica la oportunidad como
    **Desafiante** y la calidad del negocio como **Media**; estas son evaluaciones
    del análisis, no métricas reportadas por la compañía.


    ### Riesgos identificados


    - **Caída de ingresos y presión sobre márgenes:** señaladas como tendencias deterioradas
    en AOIF y DDD.

    - **Riesgo de deuda y servicio financiero:** cobertura de intereses de 0x y deuda
    neta/EBITDA de aproximadamente 467x según DDD. Dada la falta de inputs verificables,
    ambos valores requieren reconciliación antes de sacar conclusiones cuantitativas.

    - **Ciclicidad y demanda discrecional:** una debilidad macroeconómica podría reducir
    la demanda de motocicletas y productos relacionados.

    - **Ejecución en electrificación:** LiveWire podría no alcanzar escala, crecimiento
    rentable o expansión internacional.

    - **Volatilidad:** DDD informa volatilidad a 90 días de 37,6%.


    ### Contra-tesis y falsadores


    DDD plantea que el mercado podría subestimar la capacidad de recuperación de Harley-Davidson.
    Sin embargo, también observa que el deterioro financiero podría justificar una
    valoración más cercana al extremo bajo del rango de analistas suministrado.


    Los siguientes son **umbrales propuestos por los análisis**, no resultados confirmados:


    - DDD identifica como falsadores de la tesis general ingresos anuales superiores
    a 6.000 millones de USD y un margen bruto sostenido por encima del 30%.

    - El escenario bajista añade como falsadores ingresos anuales superiores a 5.000
    millones de USD y cobertura de intereses superior a 2x.

    - El escenario alcista quedaría cuestionado si el margen bruto se mantiene por
    debajo del 20% o la deuda neta supera 2.000 millones de USD.


    ## 7. Catalizadores y Timeline


    No se proporcionan fechas confirmadas para eventos corporativos concretos. Los
