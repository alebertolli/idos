prompt_inputs:
  business_model: 'SLB N.V. engages in the provision of technology for the energy
    industry worldwide. The company operates through four divisions: Digital & Integration,
    Reservoir Performance, Well Construction, and Production Systems. The company
    provides field development and hydrocarbon production, carbon management, and
    integration of adjacent energy systems; reservoir interpretation and data processing
    services for exploration data; and well construction and production improvement
    services and products. It also offers subsurface geology and fluids evaluation
    information; stimulation services to restore or enhance well productivity through
    hydraulic fracturing, matrix stimulation, and water treatment; and intervention
    services to oil and gas operators. In addition, the company offers mud logging,
    directional drilling, measurement-while-drilling, and logging-while-drilling services,
    as well as engineering support services; supplies drilling fluid systems; designs,
    manufactures, and markets roller cone and fixed cutter drill bits; bottom-hole-assembly
    and borehole enlargement technologies; well planning, well drilling, engineering,
    supervision, logistics, procurement, and contracting of third parties, as well
    as drilling rig management solutions; and drilling equipment and services, as
    well as land drilling rigs and related services. Further, it provides artificial
    lift; supplies packers, safety valves, sand control technology, and various intelligent
    systems; midstream production systems; valves, chokes, actuators, and surface
    trees; and OneSubsea, an integrated solutions, products, systems, and services,
    including wellheads, subsea trees, manifolds and flowline connectors, control
    systems, connectors, and services. SLB N.V. was formerly known as Schlumberger
    Limited and change its name to SLB N.V. in October 2025. The company was founded
    in 1926 and is based in Houston, Texas.'
