calidad_evidencia:
  hechos_verificados:
  - Revenue TTM en $94,000M con crecimiento del 11.2%.
  - Márgenes operativos negativos (-5.4%) y ROIC negativo (-12.7%).
  - Nombramiento de Kelly Ortberg como nuevo CEO en agosto de 2024.
  - Estructura duopólica global en aviación comercial de gran escala.
  inferencias_llm:
  - La ampliación de capital de late-2024 elimina el riesgo de quiebra inminente pero
    diluye al accionista actual a corto plazo.
  - La reintegración de Spirit AeroSystems reducirá gradualmente los defectos de fuselaje
    en un horizonte de 18-24 meses.
  - El valor intrínseco en un escenario de normalización de FCF ($6B-$8B/año hacia
    2027) respalda una apreciación del título >50% respecto a los niveles de estres.
  preguntas_abiertas:
  - ¿Cuál será el ritmo exacto de aprobación regulatoria por parte de la FAA para
    el incremento de tasas de producción del 737 MAX?
  - ¿Podrá la división de Defensa (BDS) detener la sangría de pérdidas en contratos
    a precio fijo antes de finales de 2025?
  - ¿Qué grado de tracción laboral y estabilidad sindical se mantendrá tras los acuerdos
    de resolución de huelga?
clasificacion_oportunidad:
  categoria: turnaround
  categorias_descartadas: Descartada 'Compounder castigado' porque el deterioro no
    es meramente temporal o de ciclo, sino una avería operativa e institucional profunda
    con quema masiva de caja y destrucción de balance. Descartada 'Distressed' porque
    el acceso al mercado de capitales (demostrado en la ampliación de capital de $21B+
    en finales de 2024) y el estatus de 'demasiado grande para caer' por seguridad
    nacional de EE. UU. reducen drásticamente la probabilidad de bancarrota inminente.
    Descartada 'Value Trap' porque la demanda estructural de aviación comercial es
    insaciable y el duopolio impide la entrada de competidores a escala a corto/medio
    plazo.
  justificacion: The Boeing Company se encuentra en medio de una profunda crisis operativa,
    de control de calidad y de balance, desencadenada por los problemas del 737 MAX,
    el incidente del conector de puerta de Alaska Airlines, la huelga del sindicato
    IAM y pérdidas continuadas en contratos de defensa a precio fijo. Sin embargo,
    mantiene una posición duopólica global indivisible junto a Airbus con un backlog
    superior a 500,000 millones de dólares y el nombramiento de un nuevo CEO operacional
    (Kelly Ortberg) para ejecutar una reestructuración cultural y productiva.
dominio_business_quality:
  analisis: Boeing ostenta un Moat amplio basado en barreras de entrada gigantescas
    (requisitos de capital, certificaciones regulatorias FAA/EASA, escala industrial
    y curva de aprendizaje de décadas). Comparte un duopolio global con Airbus en
    aviación comercial. La división Global Services (BGS) provee ingresos recurrentes
    con altos márgenes. No obstante, la calidad del negocio se ha visto erosionada
    por fallos graves de control de calidad, pérdida de confianza regulatoria y contratos
    de defensa de precio fijo que absorben capital.
  rating: buena
