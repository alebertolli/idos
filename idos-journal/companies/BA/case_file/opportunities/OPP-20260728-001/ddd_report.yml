dominio_esg_supply_chain:
  analisis: Riesgos ESG críticos vinculados a la gobernanza corporativa, seguridad
    de los productos y relaciones laborales. En la cadena de suministro, la dependencia
    de proveedores clave como Spirit AeroSystems (en proceso de re-adquisición), la
    escasez de componentes críticos (motores CFM/GE, fuselajes) y cuellos de botella
    en la entrega de titanio/materiales avanzados imponen cuellos de botella directos
    sobre la rampa de producción.
  rating: alto_riesgo
dominio_financial_health:
  analisis: El balance está fuertemente estresado. La deuda bruta roza los $57,000M-$58,000M
    producto de años de cash burn negativo (FCF ajustado en 0M a negativo en períodos
    recientes) y la acumulación de inventario no entregado. La cobertura de intereses
    (Interest Coverage) es de 0.0x debido al margen operativo negativo. Aunque la
    reciente emisión de capital de ~$21B mitiga el riesgo inminente de degradación
    a crédito basura y vencimientos de deuda a corto plazo, la posición de solvencia
    requiere años de retención de flujo de caja para desapalancarse.
  rating: debil
dominio_growth:
  analisis: 'Los impulsores de crecimiento a medio y largo plazo son sólidos, sustentados
    por megatendencias seculares: crecimiento del tráfico aéreo mundial (4-5% anual),
    necesidad de flotas más eficientes en consumo de combustible y un acumulado de
    pedidos (backlog) de más de 5,400 aviones comerciales (equivalente a más de medio
    billón de dólares). La visibilidad del revenue es extraordinariamente alta, sujeta
    únicamente a la capacidad física de fabricación e integración de la cadena de
    suministro.'
  rating: fuerte
dominio_management:
  analisis: 'El nombramiento del CEO Kelly Ortberg en agosto de 2024 marca un cambio
    decisivo de paradigma: un ingeniero con reputación probada en la industria aeroespacial
    (ex-Rockwell Collins) reemplazando la línea de ejecutivos enfocados en métricas
    financieras que deterioraron la calidad. El alineamiento histórico ha sido deficiente
    (0.0% insider ownership significativo en manos ejecutivas anteriores), pero la
    nueva hoja de ruta prioriza la seguridad operativa, resolución de conflictos laborales
    y simplificación de la estructura corporativa.'
  rating: bueno
