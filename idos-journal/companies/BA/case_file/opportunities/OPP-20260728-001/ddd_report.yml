tesis_inversion: Boeing representa una oportunidad asimétrica de Turnaround para inversores
  con un horizonte temporal de 3 a 5 años. El mercado cotiza la empresa basándose
  en su atribulado estado operativo presente y no en su capacidad de generación de
  caja normalizada. En una industria duopólica donde Airbus está vendida al máximo
  de su capacidad hasta finales de la década, las aerolíneas no pueden abandonar a
  Boeing. Con la recapitalización del balance completada y un CEO con sesgo operativo
  al mando, la convergencia hacia márgenes normalizados y la conversión del backlog
  en flujo de caja libre ofrecerá un re-rating significativo de los múltiplos de valoración.
