resumen_ejecutivo: Boeing representa una oportunidad clásica de Turnaround de gran
  envergadura. Aunque el balance está significativamente apalancado y los márgenes
  operativos son negativos (-5.4% TTM) producto de ineficiencias de producción y sobrecostos
  en contratos de defensa, la barrera de entrada al negocio comercial de aviones de
  pasillo único y ancho es impenetrable. La inyección de capital reciente alivia las
  presiones de liquidez inmediatas, permitiendo a la gerencia centrarse en resolver
  la cultura de calidad y la tasa de entregas. La tesis de inversión depende de la
  ejecución operativa y la normalización del FCF hacia 2026-2027.
