    ## 8. Marco de Valoración


    ### Datos observados y limitaciones


    El paquete informa los siguientes datos de mercado:


    - Cotización observada: **USD 521,91** al **2026-10-30**, fuente indicada: yfinance.

    - Consenso de precio objetivo: **USD 636,12**, con rango de **USD 440–870**, observado
    el **2026-11-20**. El paquete atribuye el dato a una fuente de consenso, pero
    el material recibido no incluye un enlace verificable.

    - AOIF informa **P/E de 25,36x**, **EV/EBITDA de 17,92x**, **FCF yield de 0%**
    y margen de seguridad «insuficiente». No se incluyen fecha de valoración ni bases
    y periodos de cálculo, así que estos múltiplos no deben tratarse como plenamente
    comparables o auditados.

    - La conclusión DDD es que el error de valoración no está validado. Una diferencia
    entre cotización y objetivos de analistas es una observación de mercado, no prueba
    de infravaloración.


    ### Metodología apropiada para la investigación


    Una valoración posterior debería contrastar:


    1. **Flujo de caja descontado (DCF):** construir FCF normalizado con flujo operativo,
    capex y capital de trabajo; proyectar ingresos, márgenes, inversión y conversión
    en caja.

    2. **Valoración relativa:** comparar múltiplos como P/E y EV/EBITDA con compañías
    pertinentes, por ejemplo [[AMZN]], [[GOOGL]], [[ORCL]] y [[CRM]], ajustando por
    crecimiento, márgenes y estructura de capital.

    3. **Análisis por segmentos:** valorar por separado nube, productividad y otros
    negocios cuando haya datos suficientes.


    ### Supuestos y sensibilidad pendientes


    No es posible calcular un valor intrínseco riguroso ni una tabla numérica de sensibilidad
    con la evidencia disponible. Faltan FCF normalizado, deuda neta, acciones diluidas,
    expectativas de crecimiento y márgenes, coste de capital y supuestos de valor
    terminal. El análisis debería mostrar sensibilidad, como mínimo, a crecimiento
    de ingresos, margen operativo, capex y tasa de descuento. Hasta contar con esos
    datos, no se valida ni la infravaloración ni un margen de seguridad suficiente.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué crecimiento y márgenes espera el mercado y qué supuestos sustentan las
    estimaciones y objetivos de analistas?

    2. ¿Cuáles son el crecimiento, los márgenes, el capital empleado y los retornos
    sobre capital por segmento?

    3. ¿Qué inversión en centros de datos, chips y energía se requiere para sostener
    el crecimiento de nube e IA, y qué retornos genera?

    4. ¿Cuál es la causa de la variación negativa del FCF TTM reportada al 2026-09-30?
    ¿Se explica por inversión, capital de trabajo, márgenes u otros factores?

    5. ¿Cómo evolucionan el flujo de caja operativo, el capex y la conversión de beneficio
    en caja en periodos comparables?

    6. ¿Qué evidencia cuantitativa respalda los costes de cambio, la retención y el
    poder de precios atribuidos al moat?

    7. ¿Cómo se compara la posición de Microsoft con [[AMZN]], [[GOOGL]], [[AAPL]],
    [[CRM]] y [[ORCL]] en nube, productividad e IA?

    8. ¿Qué deuda neta, vencimientos y número de acciones diluidas deben utilizarse
    en la valoración?

    9. ¿Qué respaldan las calificaciones de AOIF sobre calidad del management, asignación
    de capital y alineamiento de insiders? ¿Cuáles son los incentivos y la propiedad
    de insiders?

    10. ¿Cuál es la fecha, fórmula y periodo de referencia de las métricas de crecimiento
    de ingresos, margen operativo, ROIC y múltiplos indicados por AOIF?

    11. ¿Qué guía de la compañía y próximos hitos permiten evaluar crecimiento, márgenes
    e inversión? El paquete no incluye fechas de eventos concretos.

    12. ¿Puede construirse una valoración reproducible con escenarios y sensibilidad
    que determine si el precio incorpora supuestos razonables?


    **Estado de investigación:** pendiente de decisión. La evidencia disponible justifica
