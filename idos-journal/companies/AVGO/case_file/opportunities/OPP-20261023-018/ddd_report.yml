  de entrada con software de infraestructura de alto margen, generando flujos de caja
  libre robustos y crecimiento de ingresos superior al 40% TTM. El precio actual está
  significativamente por debajo del consenso de analistas, lo que indica un posible
  error de mercado. Los principales riesgos son la exposición cíclica del segmento
  de semiconductores y posibles tensiones geopolíticas, pero la diversificación hacia
  software amortigua estos efectos. Se recomienda considerar la posición como un compounder
  castigado con potencial de revaluación a medio plazo.
