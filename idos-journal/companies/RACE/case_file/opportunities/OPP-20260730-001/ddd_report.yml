  justificacion: 'Ferrari N.V. representa el prototipo ideal de Compounder: un negocio
    de lujo de alta gama disfrazado de automotriz, con un foso competitivo insuperable
    basado en la exclusividad de marca, poder de fijación de precios ilimitado, márgenes
    EBIT del ~29% y ROIC superior al 30%. Su cotización histórica refleja múltiplos
    elevados (P/E >40x) acordes a la calidad estructural del activo.'
dominio_business_quality:
  analisis: El foso competitivo (Moat) de Ferrari es extremadamente duradero, sostenido
    en el prestigio intangible de marca construido en la Fórmula 1, el patrimonio
    cultural italiano y la estrategia estricta de producción limitada ('vender siempre
    un coche menos de lo que pide el mercado'). La elasticidad-precio de la demanda
    es inelástica, permitiendo trasladar inflación e incrementar precios mediante
    programas de personalización. Su poder de negociación sobre clientes y proveedores
    es absoluto.
  rating: excepcional
