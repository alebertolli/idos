dominio_esg_supply_chain:
  analisis: El riesgo ESG clave se centra en la regulación medioambiental de emisiones
    de carbono (fase de eliminación de motores de combustión en la UE para 2035).
    Ferrari busca exenciones para e-fuels (combustibles sintéticos) mientras desarrolla
    su plataforma de electrificación. La cadena de suministro para componentes de
    rendimiento tradicional es interna/localizada en Maranello, pero la transición
    EV genera dependencia de materiales críticos de baterías e integradores de software.
  rating: medio_riesgo
dominio_financial_health:
  analisis: Balance altamente sólido con apalancamiento conservador (D/E de 0.7x),
    fuerte liquidez y generación contundente de flujo de caja libre operativo. La
    conversión de EBITDA a caja es elevada gracias a los anticipos y depósitos recibidos
    por parte de los clientes al realizar pedidos con años de antelación. La solvencia
    no presenta ningún riesgo ni a corto ni a largo plazo.
  rating: fuerte
dominio_growth:
  analisis: El crecimiento futuro no proviene de volúmenes masivos (crecimiento en
    entregas limitado al 2-4% anual para preservar la exclusividad), sino de la combinación
    de precio/mix. Los principales motores son las ediciones especiales ultralimitadas
    (Icona/Supercars con márgenes brutos superiores al 60%), los niveles crecientes
    de personalización Tailor Made y la expansión en mercados emergentes de ultra-ricos
    (HNWIs).
  rating: moderado
dominio_management:
  analisis: Dirigida por el CEO Benedetto Vigna (nombrado en 2021), procedente de
    la industria de semiconductores para liderar la transición tecnológica. La asignación
    de capital prioriza la inversión en I+D interno (e-building en Maranello), la
    retribución al accionista mediante dividendos crecientes y recompras oportunistas
    de acciones. El accionista de referencia, Exor (familia Agnelli), garantiza un
    enfoque estratégico de muy largo plazo y alineación de intereses.
  rating: bueno
