resumen_ejecutivo: Ferrari N.V. es uno de los activos de mayor calidad en el universo
  global de renta variable. No debe analizarse como una empresa automotriz, sino como
  una casa de lujo de ultra-alto nivel (comparable a Hermès). La compañía gestiona
  deliberadamente la escasez, manteniendo listas de espera superiores a 24 meses y
  una demanda que excede sustancialmente la capacidad de producción. A pesar de una
  salud financiera impecable y una rentabilidad sobre el capital invertido (ROIC)
  superior al 30%, la valoración actual exige una ejecución intachable en la transición
  EV. Para una Family Office, es un activo 'core' para preservar capital a muy largo
  plazo, aunque las compras agresivas deberían esperar a momentos de volatilidad del
  mercado.
