    frente a FY 2025?
  - ¿Cuáles son el ROIC, los retornos incrementales de reinversión y la penetración
    de los mercados direccionables?
  - ¿Qué horizonte corresponde a los objetivos de analistas y cuáles son los supuestos
    explícitos del consenso?
