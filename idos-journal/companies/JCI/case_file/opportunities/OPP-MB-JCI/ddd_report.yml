  existing_wiki: '## 1. Visión General de la Compañía


    Johnson Controls International plc ([[JCI]]) desarrolla, fabrica, instala, pone
    en marcha y mantiene sistemas y servicios para edificios. Sus productos y soluciones
    incluyen HVAC, controles y sistemas de gestión de edificios, además de actividades
    relacionadas con seguridad y protección contra incendios. La compañía combina
    ventas de equipos con instalación, integración, modernizaciones, mantenimiento
    y soluciones digitales.


    Su exposición incluye inmobiliario comercial y centros de datos. La información
    disponible describe una operación en varias regiones, pero no ofrece un desglose
    geográfico de ingresos. Los principales impulsores de demanda señalados son la
    construcción, la renovación y modernización de edificios, y la instalación o sustitución
    de equipos HVAC, controles y sistemas de seguridad.


    La evidencia financiera y de mercado aquí recogida procede de fuentes y fechas
    incluidas en los materiales de investigación; no se han añadido datos externos.
    La página existente de la wiki también describe a JCI como una empresa dedicada
    a ingeniería, fabricación, puesta en marcha y modernización de productos para
    edificios.


    ## 2. Modelo de Negocio y Posición Competitiva


    JCI participa en distintas etapas de la cadena de valor: desarrolla tecnología
    y productos, coordina proveedores y fabricación, vende mediante canales directos
    y socios, instala e integra sistemas y presta servicios técnicos. La base instalada
    puede generar oportunidades de mantenimiento, reemplazo y modernización, aunque
    los materiales no cuantifican la proporción de ingresos recurrentes.


    **Drivers de ingresos identificados:**


    - Demanda de construcción, renovación y modernización de edificios.

    - Instalación y reemplazo de equipos HVAC, controles y sistemas de seguridad contra
    incendios.

    - Integración y mantenimiento de sistemas para edificios.


    La evaluación AOIF caracteriza a JCI como líder en su posición competitiva y califica
    su moat como estrecho. Las posibles fuentes de ventaja mencionadas son la amplitud
    de la base instalada, la reputación y experiencia técnica, las relaciones de largo
    plazo, la integración de sistemas críticos y la red de servicio. Estas son hipótesis
    de ventaja competitiva, no una demostración cuantificada de poder de fijación
    de precios o retornos superiores.


    La industria se describe como fragmentada y competitiva, con rivales globales
    y especialistas en HVAC, automatización, seguridad y protección contra incendios.
    La competencia en precio y tecnología puede limitar márgenes. Entre las compañías
    de la wiki con exposición industrial o a ciclos de inversión y equipos figuran
    [[CAT]] y [[DE]]; la información disponible no establece que sean comparables
    directos en todas las líneas de negocio de JCI.


    ## 3. Perfil Financiero


    Las cifras de Stock Analysis están expresadas en las unidades reportadas por esa
    fuente; el material no especifica aquí su escala monetaria. Las cifras de FY 2023
    a FY 2026 corresponden a ejercicios fiscales según la fuente citada.


    | Métrica | Observación | Período / fecha | Fuente y limitación |

    |---|---:|---|---|

    | Ingresos | 22.331 en FY 2023; 25.666 en FY 2026 | FY 2023–FY 2026 | [Stock Analysis,
    estados financieros](https://stockanalysis.com/stocks/jci/financials/) |

    | Margen bruto | 34,95% en FY 2023; 37,07% en FY 2026 | FY 2023–FY 2026 | [Stock
    Analysis, estados financieros](https://stockanalysis.com/stocks/jci/financials/)
    |

    | FCF | 965 en FY 2025; 3.309 en FY 2026 | Cierres 2025-09-30 y 2026-09-30 | [Stock
    Analysis, estados financieros](https://stockanalysis.com/stocks/jci/financials/).
    Los materiales no explican qué componentes causaron el cambio. |

    | Ingreso neto | 3.291 en FY 2025; 2.853 en FY 2026 | FY 2025–FY 2026 | Reportado
    en el material DDD; la referencia específica de la serie no se detalla aparte
    del vínculo a estados financieros. |

    | Current ratio | 0,9x | 2026-09-30 | [Stock Analysis, estadísticas](https://stockanalysis.com/stocks/JCI/statistics/)
    |

    | Efectivo e inversiones | 618 | 2026-09-30 | [Stock Analysis, estadísticas](https://stockanalysis.com/stocks/JCI/statistics/)
    |

    | Cobertura de intereses | 0x según proveedor | 2026-09-30 | [Stock Analysis,
    estadísticas](https://stockanalysis.com/stocks/JCI/statistics/). La definición
    y el dato subyacente requieren verificación. |

    | Crecimiento de ingresos | 8,77% | Período y metodología no especificados en
    AOIF | Dato proporcionado por AOIF; no debe equipararse automáticamente a una
    tasa histórica comparable. |

    | Margen operativo | 15,02% | Período y metodología no especificados en AOIF |
    Dato proporcionado por AOIF; falta una serie histórica comparable. |

    | ROIC | 14,13% | Período y metodología no especificados en AOIF | Dato proporcionado
    por AOIF; requiere validar período, fuente y cálculo. |


    La evidencia reportada muestra crecimiento de ingresos y mejora del margen bruto
    entre FY 2023 y FY 2026. Sin embargo, no basta para confirmar que la tendencia
    sea orgánica, sostenible o acompañada de retornos atractivos sobre el capital.
    El fuerte aumento del FCF entre FY 2025 y FY 2026, frente a una caída del ingreso
    neto reportado, hace especialmente importante revisar la conciliación y recurrencia
    del flujo.


    AOIF proporciona múltiplos de P/E de 27,86x y EV/EBITDA de 20,32x, además de un
    FCF yield de 0. No se especifican fecha, período ni metodología de estos indicadores;
    por tanto, no son una base suficiente para una conclusión de valoración. El material
    DDD señala que no fue posible calcular de manera validada el crecimiento de ingresos
    compuesto a tres años ni el crecimiento del FCF.


    ## 4. Management y Gobierno Corporativo


    La evaluación AOIF califica la calidad del management como regular, la asignación
    de capital como neutral y el alineamiento de insiders como débil. El análisis
    indica que los materiales no contienen información suficiente sobre cumplimiento
    de objetivos, remuneración, propiedad accionaria de insiders, adquisiciones o
    decisiones de asignación de capital.


    No se proporcionan datos sobre composición, independencia, experiencia o estructura
    del board. Por ello, no es posible evaluar de forma fundamentada la supervisión
    corporativa ni los incentivos de largo plazo.


    ## 5. Tesis de Inversión


    **Caso alcista, sujeto a verificación:**


    - JCI combina venta de equipos con instalación, modernización y servicios técnicos
    para edificios. Una amplia base instalada y relaciones de servicio podrían sostener
    demanda de mantenimiento y reemplazo, pero no se aporta una cuantificación de
    esos ingresos.

    - Los ingresos reportados aumentaron de 22.331 en FY 2023 a 25.666 en FY 2026,
    y el margen bruto reportado pasó de 34,95% a 37,07%. La continuidad de estas tendencias
    sería favorable para la tesis operativa. Fuente: [Stock Analysis, estados financieros](https://stockanalysis.com/stocks/jci/financials/).

    - El FCF reportado aumentó de 965 en FY 2025 a 3.309 en FY 2026. Si una parte
    sustancial de la mejora resulta recurrente y se mantiene junto con crecimiento
    rentable, podría respaldar una evaluación más favorable de la generación de caja.
    Fuente: [Stock Analysis, estados financieros](https://stockanalysis.com/stocks/jci/financials/).

    - AOIF identifica HVAC, controles y gestión de edificios como productos centrales
    y señala posibles ventajas en integración de sistemas, experiencia técnica y red
    de servicio. La amplitud de la oferta es un atributo potencialmente favorable,
    pero no demuestra por sí sola un moat económico.


    **Estado de la oportunidad:** investigación requerida. La mejora de márgenes y
    FCF y el crecimiento reportado son señales a seguir, pero faltan pruebas suficientes
    sobre ROIC comparable, retornos incrementales de reinversión, penetración de mercados
    direccionables y valoración. El score general DDD de 63 es una salida del proceso
    de investigación, no una decisión de inversión.


    ## 6. Riesgos y Contra-Tesis


    **Caso bajista:** las tendencias reportadas podrían no traducirse en crecimiento
    rentable y recurrente. La demanda depende en parte de construcción, renovación
    e inversión de capital, mientras que la competencia en precio y tecnología podría
    presionar márgenes. Además, el aumento de FCF de FY 2026 podría deberse a factores
    no recurrentes: el material no permite establecerlo y el ingreso neto reportado
    descendió de 3.291 en FY 2025 a 2.853 en FY 2026.


    **Riesgos principales:**


    - **Ciclo económico y de inversión:** una debilidad de la construcción, renovación
    o inversión de capital podría reducir pedidos de equipos y proyectos. AOIF califica
    este riesgo como de impacto alto y probabilidad media.

    - **Competencia:** presión de competidores globales y especialistas en HVAC, automatización,
    seguridad y protección contra incendios. AOIF la califica como de impacto medio
    y probabilidad alta.

    - **Sostenibilidad del FCF:** se desconoce qué factores explican el aumento del
    flujo de caja entre FY 2025 y FY 2026.

    - **Liquidez y apalancamiento:** el current ratio reportado es 0,9x y el efectivo
    e inversiones reportados suman 618 al 2026-09-30. Los datos disponibles no permiten
    calcular net debt/EBITDA. La cobertura de intereses reportada como 0x debe verificarse
    antes de interpretarla como cobertura económica. Fuente: [Stock Analysis, estadísticas](https://stockanalysis.com/stocks/JCI/statistics/).

    - **Valoración:** no hay datos suficientes para estimar valor intrínseco o determinar
    qué expectativas incorpora el precio observado.


    **Triggers de falsación:**


    1. Resultados futuros que muestren contracción persistente de ingresos o margen
    bruto frente a la tendencia reportada entre FY 2023 y FY 2026.

    2. Evidencia de que el FCF de FY 2026 no es recurrente o de que la generación
    de efectivo se deteriora de forma sostenida.

    3. Deterioro sostenido de márgenes o conversión de pedidos en ingresos en un entorno
    de competencia intensa.


    ## 7. Catalizadores y Timeline


    | Catalizador o evento | Fecha esperada | Impacto potencial | Evidencia disponible
    |

    |---|---|---|---|

    | Próximos resultados y confirmación de la tendencia de ingresos | Sin fecha indicada
    | Confirmar o refutar la continuidad del crecimiento reportado entre FY 2023 y
    FY 2026 | [Stock Analysis, estados financieros](https://stockanalysis.com/stocks/jci/financials/)
    |

    | Sostenimiento del margen bruto | Próximos resultados; sin fecha indicada | Mantener
    el margen bruto de FY 2026 sería evidencia favorable para la mejora operativa;
    una reversión debilitaría la tesis | Margen bruto reportado: 34,95% en FY 2023
    y 37,07% en FY 2026. [Fuente](https://stockanalysis.com/stocks/jci/financials/)
    |

    | Validación de la recurrencia del FCF | Próximos resultados y divulgaciones financieras;
    sin fecha indicada | Una explicación de los factores del FCF de FY 2026 permitiría
    distinguir generación recurrente de efectos puntuales | FCF reportado: 965 en
    FY 2025 y 3.309 en FY 2026. [Fuente](https://stockanalysis.com/stocks/jci/financials/)
    |

    | Crecimiento orgánico, cartera de pedidos y conversión de pedidos en ingresos
    | Seguimiento continuo; sin fechas específicas | Aclarar la demanda subyacente
    y su conversión en ventas | Señalado como punto de monitoreo por AOIF; no se aportan
    cifras de pedidos. |


    No se proporciona un calendario de resultados u otros eventos con fechas confirmadas.
    Las fechas concretas deben verificarse en futuras actualizaciones de la evidencia.


    ## 8. Marco de Valoración


    **Conclusión actual:** indeterminada. El material DDD indica que no se puede establecer
    un error de valoración con la evidencia disponible. El precio observado fue de
    USD 149,03 al 2026-10-30 y el consenso de analistas se observó al 2026-11-20,
    pero no se aporta un rango verificable de objetivos, su horizonte ni una base
    suficiente para derivar expectativas implícitas. El precio y el consenso son observaciones
    de mercado, no estimaciones de valor intrínseco.


    **Metodologías a considerar cuando haya datos comparables:**


    - Flujo de caja descontado sobre FCF normalizado, con supuestos explícitos de
    crecimiento, márgenes, inversión, conversión de caja y tasa de descuento.

    - Múltiplos de empresas comparables o de transacciones, siempre que se definan
    comparables apropiados y se utilicen métricas y períodos consistentes.

    - Análisis por escenarios para reflejar diferencias en demanda de construcción
    y modernización, presión competitiva y recurrencia del FCF.


    AOIF informa P/E de 27,86x y EV/EBITDA de 20,32x, pero no proporciona fecha ni
    metodología; el FCF yield indicado como 0 tampoco tiene definición o período.
    Estas cifras no permiten concluir si la acción está barata o cara. El margen de
    seguridad fue calificado como insuficiente por AOIF, mientras que DDD mantiene
    la conclusión de valoración como indeterminada.


    **Sensibilidad que debe analizarse al completar los datos:**


    - FCF normalizado bajo escenarios de continuidad, reversión parcial o reversión
    sustancial del salto reportado en FY 2026.

    - Crecimiento de ingresos y márgenes, con especial atención a la exposición a
    construcción, renovación y modernización.

    - Tasa de descuento y crecimiento terminal.

    - Deuda neta, acciones diluidas y necesidades de inversión.


    Sin FCF normalizado, deuda neta, acciones diluidas, precio y fecha de valoración
    comparables, y supuestos explícitos, no corresponde presentar un valor intrínseco
    numérico.


    ## 9. Preguntas Abiertas y Agenda de Investigación


