  existing_wiki: '## 1. Visión General de la Compañía


    Johnson Controls International plc ([[JCI]]) desarrolla, fabrica, instala, pone
    en marcha, mantiene y moderniza sistemas y soluciones para edificios. Su oferta
    incluye climatización (HVAC), controles y gestión de edificios, refrigeración,
    seguridad y protección contra incendios.


    El modelo combina la venta de equipos y controles con proyectos de integración
    e instalación y servicios posventa. La información disponible identifica como
    clientes o mercados relevantes el inmobiliario comercial y los centros de datos.
    No aporta un desglose geográfico verificable ni datos suficientes para describir
    la distribución de ingresos por región.


    La evaluación de inversión sigue siendo preliminar: los materiales de investigación
    señalan señales financieras favorables, pero no permiten validar de manera suficiente
    la calidad de los retornos, la reinversión necesaria ni una valoración fundamental.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos identificados


    - Demanda de equipos y sistemas para edificios nuevos.

    - Renovación, modernización y mejora de edificios existentes.

    - Instalación, mantenimiento y puesta en marcha de sistemas.

    - Demanda potencial vinculada a eficiencia energética, automatización y gestión
    de edificios; su contribución efectiva al crecimiento no está cuantificada en
    la información disponible.


    La cadena de valor descrita comprende diseño y desarrollo de tecnología, aprovisionamiento
    de componentes y materiales, fabricación, venta directa o mediante canales, integración,
    instalación y servicios posteriores.


    ### Posición competitiva y moat


    La evaluación AOIF caracteriza la posición competitiva como **líder** y el moat
    como **estrecho**. Las ventajas propuestas —no demostradas como sostenibles— son
    una base instalada amplia, reputación, relaciones duraderas con clientes, conocimiento
    técnico, cobertura de servicio e integración de varias categorías de sistemas
    para edificios.


    La industria se describe como competitiva y fragmentada, con grandes proveedores
    globales y especialistas regionales. La demanda depende, entre otros factores,
    de la construcción, las renovaciones y el gasto de capital. Las fuentes no identifican
    comparables directos ni aportan datos de cuota de mercado; por ello, compañías
    como [[CAT]], [[SIEGY]] y [[MMM]] pueden servir como referencias industriales
    amplias, pero no se establecen aquí como competidores directos de JCI.


    ## 3. Perfil Financiero


    Las cifras siguientes se reproducen con las limitaciones de período, unidad o
    comparabilidad indicadas por las fuentes. Los importes de ingresos no incluyen
    unidad explícita en el material recibido.


    | Métrica | Valor reportado | Período / referencia | Observaciones |

    |---|---:|---|---|

    | Ingresos | 25,666 | FY 2026 | Según StockAnalysis; no se dispone de desglose
    de crecimiento orgánico, adquisiciones o divisa. |

    | Ingresos | 23,596 | FY 2025 | Según StockAnalysis. |

    | Crecimiento de ingresos | 8.77% | Período no especificado | AOIF; sin fuente
    ni serie histórica para verificarlo. |

    | Margen bruto | 37.07% | FY 2026 | Según StockAnalysis. |

    | Margen bruto | 34.95% | FY 2023 | Según StockAnalysis; la causa y persistencia
    de la mejora no están establecidas. |

    | Margen operativo | 15.02% | Período no especificado | AOIF; dato sin fuente
    ni período. |

    | ROIC | 14.13% | Período no especificado | AOIF; dato sin fuente ni metodología.
    |

    | Crecimiento de FCF | 242.9% | TTM terminado el 30-09-2026 | Porcentaje publicado
    por StockAnalysis; no se identifica el período comparativo utilizado. |

    | FCF / conversión de caja | No verificable | — | AOIF no proporciona CFO, capex
    ni una serie de FCF que permita comprobar conversión. |

    | Current ratio | 0.9x | 30-09-2026 | StockAnalysis; superior al umbral de alerta
    configurado de 0.5x, pero amerita revisar composición y vencimientos. |

    | Net cash, según proveedor | -10,036 | 30-09-2026 | StockAnalysis; unidad y compatibilidad
    con EBITDA no aclaradas. |

    | Interest coverage | 0 | Referencia no especificada | Dato reportado que requiere
    validación antes de interpretarse. |


    Fuentes: [StockAnalysis, estados financieros](https://stockanalysis.com/stocks/jci/financials/)
    y [StockAnalysis, estadísticas](https://stockanalysis.com/stocks/JCI/statistics/).


    La mejora del margen bruto y el crecimiento de ingresos reportado son favorables,
    pero no prueban una mejora comparable del margen operativo ni una conversión sostenible
    de beneficios en caja. La variación del FCF requiere comprobar el capital circulante,
    las inversiones y la comparabilidad entre períodos. No se proporcionó una serie
    suficiente para calcular el CAGR de ingresos a tres años.


    ## 4. Management y Gobierno Corporativo


    La evaluación AOIF califica provisionalmente la calidad de la dirección como **buena**,
    la asignación de capital como **neutral** y el alineamiento de insiders como **débil**.
    Estas valoraciones no están respaldadas en el material recibido por datos sobre
    resultados de la dirección, remuneración, propiedad accionarial, recompras, adquisiciones
    o retornos de capital.


    No se proporcionan nombres de ejecutivos, composición del consejo, independencia
    de sus miembros, estructura de comités ni datos de insider ownership. Por tanto,
    no es posible evaluar de forma independiente el gobierno corporativo ni atribuir
    a la dirección resultados financieros concretos.


    ## 5. Tesis de Inversión


    ### Caso alcista — hipótesis que debe validarse


    - **Oferta integrada para edificios:** JCI combina equipos, controles, instalación
    y servicios. Una base instalada y relaciones de servicio podrían favorecer ingresos
    posventa y modernizaciones, aunque las fuentes no cuantifican esta contribución.

    - **Crecimiento de ingresos reportado:** los ingresos fueron 25,666 en FY 2026
    frente a 23,596 en FY 2025, según [StockAnalysis](https://stockanalysis.com/stocks/jci/financials/).
    Falta separar crecimiento orgánico, adquisiciones y divisa.

    - **Mejora del margen bruto:** el margen bruto reportado aumentó de 34.95% en
    FY 2023 a 37.07% en FY 2026, según [StockAnalysis](https://stockanalysis.com/stocks/jci/financials/).
    No se conocen las causas ni si la mejora es recurrente.

    - **Posibles tendencias favorables:** eficiencia energética, automatización y
    modernización de edificios podrían apoyar la demanda. Esta conexión es una hipótesis
    de inversión, no una contribución futura demostrada por los datos disponibles.


    La tesis no demuestra todavía una ventaja competitiva duradera ni una rentabilidad
    sobre el capital sostenible. La calificación general de DDD fue **64**, con calidad
    de negocio evaluada como **mixta y con evidencia incompleta**; la oportunidad
    se clasificó como investigación requerida.


    ## 6. Riesgos y Contra-Tesis


    ### Riesgos principales


    - **Ciclo de construcción y gasto de capital:** una contracción podría reducir
    pedidos de equipos y proyectos. AOIF asigna impacto alto y probabilidad media.

    - **Competencia y ejecución:** presión de precios, descuentos o fallos en proyectos
    complejos podrían afectar los márgenes. AOIF asigna impacto alto y probabilidad
    media.

    - **Liquidez y vencimientos:** el current ratio reportado de 0.9x no cruza el
    umbral de alerta configurado, pero requiere revisar la composición del activo
    corriente y los vencimientos.

    - **Deuda y cobertura:** el dato de net cash de -10,036 no tiene unidades aclaradas
    y el interest coverage reportado como 0 requiere validación. No deben utilizarse
    como conclusión definitiva sobre solvencia.

    - **Calidad del crecimiento y de la caja:** no está cuantificado qué parte del
    crecimiento es orgánica ni se han reconciliado FCF, capital circulante y capex.

    - **Valoración:** el paquete no contiene una valoración fundamental propia defendible.
    Una acción con buen desempeño bursátil no es por ello necesariamente barata.


    ### Triggers de falsación


    - Ingresos comparables que dejen de crecer o una reversión sostenida de la mejora
    del margen bruto.

    - FCF recurrente materialmente inferior al FCF TTM publicado, una vez aclarados
    capital circulante e inversiones.

    - Evidencia de que la mejora de márgenes no se traduce en mejores retornos sobre
    capital o conversión de caja.

    - Deterioro de liquidez, apalancamiento o cobertura una vez validados los datos
    y sus unidades.


    ## 7. Catalizadores y Timeline


    No se proporcionan fechas confirmadas de próximos eventos corporativos. Los catalizadores
    siguientes son condiciones de seguimiento, no anuncios con calendario conocido.


    | Evento / catalizador | Fecha esperada | Impacto potencial | Qué verificar |

    |---|---|---|---|

    | Próxima publicación de resultados comparables | Sin fecha proporcionada | Confirmaría
    o debilitaría la tesis de crecimiento y mejora operativa | Crecimiento orgánico,
    adquisiciones, divisa, margen bruto y operativo. |

    | Evidencia de generación recurrente de FCF | En próximos resultados; fecha no
    especificada | Aclararía la calidad de beneficios y capacidad de financiar inversión
    o reducir deuda | CFO, capex, capital circulante y conciliación entre FCF TTM
    y períodos anteriores. |

    | Actualización de deuda y liquidez | Fecha no especificada | Reduciría la incertidumbre
    sobre vencimientos y cobertura | Unidades y composición del dato de net cash,
    deuda bruta, caja, vencimientos e interés. |


    ## 8. Marco de Valoración


    AOIF reporta PER de **27.84**, EV/EBITDA de **19.55** y FCF yield de **0**. El
    material no especifica para estas métricas la fecha de referencia, la fuente,
    los inputs ni —en el caso del FCF yield— el método de cálculo. Se consideran indicadores
    provisionales, no una valoración verificada.


    DDD informa de un consenso de precio objetivo de **USD 174.9** observado el **21-11-2026**,
    frente a una cotización de **USD 149.03** del **30-10-2026**. Las fechas de referencia
    son distintas; el consenso no constituye una estimación de valor intrínseco. La
    acción subió **30.28%** en los 12 meses terminados el **30-10-2026**, según yfinance:
    este dato describe el desempeño pasado y no demuestra infravaloración.


    No se estima un valor intrínseco con la información disponible. Un análisis responsable
    requeriría, como mínimo, series comparables de FCF normalizado, deuda y caja con
    unidades claras, crecimiento esperado, reinversión y supuestos de descuento. La
    sensibilidad debería mostrar cómo cambian los resultados ante distintos escenarios
    de crecimiento, margen, conversión de caja y coste de capital. Con los datos actuales
    no se valida un margen de seguridad ni un error de valoración.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué parte del crecimiento de ingresos es orgánica y cuál procede de adquisiciones,
    precios o divisas?

    2. ¿Qué retornos sobre capital y necesidades de reinversión tiene cada segmento?

    3. ¿Qué factores explican el aumento del margen bruto de 34.95% en FY 2023 a 37.07%
    en FY 2026, y cuánto es sostenible?

    4. ¿Cómo se reconcilia el crecimiento de FCF publicado de 242.9% con períodos
    comparables, capital circulante y capex?

    5. ¿Cuál es la conversión de beneficios en caja y cómo varía a través del ciclo?

    6. ¿Cuáles son la deuda bruta, la caja, sus unidades y los vencimientos? ¿Cómo
    se calculó el interest coverage reportado como 0?

    7. ¿Qué proporción de ingresos y beneficios procede de equipos, instalación, mantenimiento
    y modernizaciones?

    8. ¿Qué evidencia respalda la evaluación de moat, liderazgo competitivo y calidad
    de la dirección?

    9. ¿Qué estructura de incentivos, propiedad de insiders y composición del consejo
    presenta JCI?

    10. ¿Cuál es una valoración intrínseca razonable con FCF normalizado y supuestos
    explícitos?


    **Estado de investigación:** pendiente de validar crecimiento comparable, retornos
    sobre capital, conversión de caja, estructura de capital y valoración. AOIF deja
    la recomendación **pendiente de decisión del board**.


