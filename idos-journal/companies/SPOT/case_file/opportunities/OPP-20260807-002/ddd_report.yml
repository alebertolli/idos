    and audiobooks in select markets through subscription offerings primarily sold
    directly to end users and partners. The Ad-Supported segment provides limited
    on-demand online access to its catalog of music and online and offline access
    to its catalog of podcasts on computers, tablets, mobile devices, and other smart
    devices. The company also offers sales, distribution and marketing, contract research
    and development, and customer and other support services. Spotify Technology S.A.
    was incorporated in 2006 and is headquartered in Stockholm, Sweden.
