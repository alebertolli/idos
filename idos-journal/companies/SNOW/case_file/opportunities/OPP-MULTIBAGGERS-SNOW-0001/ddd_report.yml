  existing_wiki: '## 1. Visión General de la Compañía


    Snowflake Inc. ofrece una plataforma de datos en la nube para que organizaciones
    consoliden, almacenen, procesen, analicen y compartan datos. La oferta incluye
    capacidades de almacenamiento, cómputo, análisis y colaboración, además de productos
    y capacidades vinculados con su AI Data Cloud.


    La compañía desarrolla y opera software e infraestructura sobre nubes de terceros.
    Su modelo depende principalmente del consumo de procesamiento y almacenamiento,
    así como de la adopción de nuevos casos de uso y cargas de trabajo. Entre los
    segmentos de clientes mencionados en la investigación figuran servicios financieros,
    publicidad, medios y entretenimiento.


    Snowflake participa en los sectores de software empresarial, infraestructura de
    datos, computación en la nube y analítica. La investigación señala exposición
    a tendencias de migración a la nube, analítica e inteligencia artificial, pero
    no cuantifica el mercado direccionable ni la penetración actual de la compañía.


    ## 2. Modelo de Negocio y Posición Competitiva


    ### Drivers de ingresos


    - Consumo de procesamiento y almacenamiento por parte de los clientes.

    - Incorporación de nuevos casos de uso y cargas de trabajo.

    - Expansión de la actividad de clientes existentes y adopción de capacidades de
    datos y analítica.


    El modelo basado en consumo puede vincular los ingresos con el uso efectivo de
    la plataforma. Por ello, la optimización del gasto o una desaceleración de la
    actividad de los clientes puede afectar el crecimiento.


    ### Moat y posición competitiva


    La evaluación AOIF caracteriza la posición competitiva como líder y el moat como
    estrecho. Los posibles costos de cambio provienen de migraciones, integraciones,
    flujos de trabajo y habilidades específicas asociadas a la plataforma. La investigación
    también plantea efectos de red potenciales en el intercambio de datos, pero no
    aporta métricas que permitan confirmar su alcance o sostenibilidad.


    La industria es competitiva y evoluciona con rapidez. Los clientes pueden comparar
    ofertas y gestionar el gasto; los proveedores de nube y otras plataformas de datos
    pueden ejercer presión sobre precios, diferenciación y retención. Entre las compañías
    del sector incluidas en la wiki figuran [[CRM]], [[ACN]] y [[ADBE]], aunque los
    materiales disponibles no ofrecen una comparación competitiva detallada entre
    ellas y Snowflake.


    ## 3. Perfil Financiero


    Las cifras disponibles proceden de Stock Analysis según los datos de investigación
    proporcionados. La información no incluye una serie completa, definiciones reconciliadas
    ni referencias suficientes para validar todos los cálculos.


    | Métrica | Valor reportado | Periodo | Fuente / limitación |

    |---|---:|---|---|

    | Ingresos | USD 5.435bn | TTM al 2026-07-31 | Stock Analysis, citado en DDD |

    | Ingresos | USD 4.684bn | FY 2026 | Stock Analysis, citado en DDD |

    | Crecimiento de ingresos | 32,04% | Periodo no especificado en AOIF | No se identifica
    en el material la base de comparación |

    | FCF | USD 1.195bn | TTM al 2026-07-31 | Stock Analysis, citado en DDD |

    | Crecimiento del FCF | 59,09% | TTM al 2026-07-31 | Crecimiento reportado por
    la fuente; base exacta no detallada y no recalculada |

    | EBIT | -USD 1.22bn | TTM al 2026-07-31 | Stock Analysis, citado en DDD |

    | Utilidad neta | -USD 1.091bn | TTM al 2026-07-31 | Stock Analysis, citado en
    DDD |

    | Margen operativo | -22,43% | Periodo no especificado en AOIF | AOIF; periodo
    y definición no aclarados |

    | ROIC | -15,26% | Periodo no especificado en AOIF | AOIF; periodo y definición
    no aclarados |

    | Current ratio | 0,94x | Al 2026-07-31 | Stock Analysis, citado en DDD; por encima
    del umbral de alerta configurado de 0,5x |


    La investigación indica crecimiento de ingresos y FCF, pero la pérdida operativa
    y neta, junto con el ROIC negativo reportado, no permite concluir que ese crecimiento
    ya genere rentabilidad económica. La conversión de FCF no puede analizarse con
    los datos proporcionados porque no se incluyen cifras de flujo operativo y capex
    comparables. Tampoco hay información suficiente para evaluar deuda, caja, vencimientos
    o dilución histórica.


    ## 4. Management y Gobierno Corporativo


    La evaluación AOIF califica la calidad del management como buena, la asignación
    de capital como neutral y el alineamiento de insiders como moderado. Sin embargo,
    el material no aporta datos suficientes sobre trayectoria de ejecutivos, compensación,
    propiedad accionaria de insiders, recompras, adquisiciones, retornos de inversiones
    ni composición del board. Por tanto, esas calificaciones deben considerarse preliminares
    y no como una evaluación verificable de gobierno corporativo.


    ## 5. Tesis de Inversión


    **Caso alcista — hipótesis respaldada parcialmente por los datos disponibles:**


    - Snowflake ofrece una plataforma para consolidar, procesar, analizar y compartir
    datos; la investigación la vincula con tendencias de migración a la nube, analítica
    e IA.

    - Los ingresos reportados fueron de USD 5.435bn TTM al 2026-07-31, frente a USD
    4.684bn en FY 2026. El periodo de comparación no es perfectamente homogéneo, por
    lo que estas cifras no bastan para establecer por sí solas una tasa de crecimiento
    comparable.

    - El FCF reportado fue de USD 1.195bn TTM al 2026-07-31. Stock Analysis reportó
    crecimiento TTM de 59,09%, aunque la base de comparación no está detallada y no
    se recalculó.

    - Las integraciones, migraciones y flujos de trabajo podrían crear costos de cambio.
    El intercambio de datos también podría favorecer efectos de red, pero la evidencia
    disponible no cuantifica estos mecanismos.

    - La evaluación AOIF considera que Snowflake ocupa una posición competitiva de
    líder, aunque califica su moat como estrecho.


    **Límite de la tesis:** el crecimiento y el FCF positivo no demuestran por sí
    solos una ventaja competitiva durable ni rentabilidad económica. Los datos disponibles
    muestran EBIT, utilidad neta, margen operativo y ROIC negativos en los periodos
    reportados. La oportunidad requiere validar retención, consumo por cliente, márgenes
    y contribución de las cargas de trabajo de IA.


    ## 6. Riesgos y Contra-Tesis


    - **Rentabilidad contable negativa:** EBIT de -USD 1.22bn y utilidad neta de -USD
    1.091bn TTM al 2026-07-31. El crecimiento puede no traducirse en rentabilidad
    si persisten pérdidas y retornos sobre capital negativos.

    - **Competencia:** proveedores de nube y plataformas de datos pueden presionar
    precios, diferenciación y retención. AOIF clasifica este riesgo con impacto alto
    y probabilidad alta.

    - **Variabilidad del consumo:** optimización de gasto o desaceleración de clientes
    pueden reducir el uso de la plataforma y frenar ingresos. AOIF clasifica este
    riesgo con impacto alto y probabilidad alta.

    - **Ventaja competitiva no demostrada:** el moat se considera estrecho y las posibles
    ventajas de costos de cambio o efectos de red no están cuantificadas.

    - **Liquidez y estructura de capital:** el current ratio reportado fue 0,94x al
    2026-07-31. No cruza el umbral de alerta configurado de menos de 0,5x, pero faltan
    composición de activos corrientes, vencimientos y contexto de caja y deuda.

    - **Dilución:** no evaluable; falta una observación histórica comparable para
    calcular la variación interanual.

    - **Valoración:** no se puede validar una infravaloración o sobrevaloración con
    los objetivos de analistas disponibles; corresponden a fechas distintas de la
    cotización citada y no sustituyen una estimación de valor intrínseco.


    **Triggers de falsación**


    1. El crecimiento de ingresos se debilita materialmente en periodos posteriores
    frente a la trayectoria histórica comparable.

    2. El FCF deja de ser positivo o su crecimiento no se sostiene en periodos comparables.

    3. La retención, el consumo por cliente o la expansión de cargas de trabajo resultan
    insuficientes para compensar la optimización del gasto.

    4. Los márgenes y retornos sobre capital no muestran una trayectoria de mejora
    pese al crecimiento.


    ## 7. Catalizadores y Timeline


    | Catalizador o hito | Fecha esperada | Evidencia disponible | Impacto potencial
    |

    |---|---|---|---|

    | Próximos resultados financieros | Sin fecha indicada en el material | DDD recomienda
    comprobar la persistencia del crecimiento de ingresos y FCF en periodos futuros
    | Confirmar o debilitar la tesis de crecimiento; observar rentabilidad y evolución
    de la base accionaria |

    | Evolución del FCF | Periodos posteriores, sin fecha especificada | FCF reportado
    de USD 1.195bn TTM al 2026-07-31; crecimiento reportado de 59,09%, con base no
    detallada | Validar si el FCF positivo y su crecimiento son sostenibles y comparables
    |

    | Adopción de nuevos casos de uso, incluidas cargas de trabajo asociadas a IA
    | Sin fecha o hito específico | La investigación identifica adopción de nuevos
    casos de uso como driver, pero no cuantifica ingresos de IA | Podría ampliar el
    consumo; efecto no estimable con la información disponible |


    No se proporcionaron fechas de resultados, guía corporativa ni hitos comerciales
    específicos. Por tanto, estos catalizadores son puntos de seguimiento, no eventos
    calendarizados.


    ## 8. Marco de Valoración


    La investigación no permite estimar un valor intrínseco: faltan precio y capitalización
    actuales para una fecha común, caja y deuda, una serie financiera conciliada y
    supuestos explícitos de crecimiento, márgenes y reinversión. El margen de seguridad
    se clasifica como insuficiente.


    **Metodología apropiada para una investigación posterior:**


    - Construir un modelo de flujo de caja descontado con escenarios de crecimiento
    del consumo, ingresos, márgenes operativos, inversión y conversión a FCF.

    - Contrastar el resultado con métricas de valoración relativa frente a compañías
    pertinentes, ajustando por crecimiento, rentabilidad, consumo de capital y dilución.

    - Verificar primero la comparabilidad de periodos y las definiciones de ingresos,
    FCF, margen operativo y ROIC.


    **Supuestos y sensibilidad que deben investigarse, no asumirse como hechos:**


    | Variable | Sensibilidad relevante |

    |---|---|

    | Crecimiento de ingresos y consumo | Una desaceleración reduciría los flujos
    futuros; una expansión sostenida los aumentaría |

    | Márgenes operativos | La valoración depende de si las pérdidas actuales se reducen
    y en qué plazo |

    | Conversión a FCF | Debe reconciliarse con flujo operativo, capex y partidas
    no monetarias |

    | Retención y consumo por cliente | Determinan cuánto del crecimiento puede sostenerse
    en clientes existentes |

    | Dilución | Puede reducir el valor por acción aun cuando crezca el valor total
    del negocio |

    | Tasa de descuento y valor terminal | Deben fijarse explícitamente con datos
    y supuestos verificables |


    El consenso recopilado el 2026-11-20 tenía media y mediana de USD 431,53, con
    un rango de USD 280 a USD 540. La cotización incluida era USD 332,325 al 2026-10-26.
    Las fechas son distintas y la diferencia entre cotización y objetivos no demuestra
    por sí sola un error de valoración. Fuente consignada en DDD: consenso de analistas
    recopilado el 2026-11-20; cotización al 2026-10-26.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es el mercado direccionable cuantificado de Snowflake y qué penetración
    tiene actualmente?

    2. ¿Cómo evolucionan la retención, el consumo por cliente y la expansión de cargas
    de trabajo?

    3. ¿Qué proporción de los ingresos puede atribuirse a casos de uso de IA, y cómo
    se mide esa contribución?

    4. ¿Cuál es la concentración de clientes y cómo cambia con el tiempo?

    5. ¿Qué periodos y definiciones sustentan el crecimiento de ingresos de 32,04%,
    el margen operativo de -22,43% y el ROIC de -15,26% reportados por AOIF?

    6. ¿Cuál es la base exacta del crecimiento de FCF de 59,09% reportado para TTM
