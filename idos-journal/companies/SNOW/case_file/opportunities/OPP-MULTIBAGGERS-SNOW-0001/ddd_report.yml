  de datos y capacidades de IA. La evidencia financiera muestra crecimiento histórico
  de ingresos y FCF positivo, pero también pérdidas netas y EBIT negativos en el período
  TTM terminado el 2026-07-31; el paquete no permite verificar mercado direccionable,
  penetración, retornos sobre capital ni sostenibilidad de la ventaja competitiva.
ticker: SNOW
version: '3.0'
