    data applications, and share data and data products, as well as applies AI for
    solving business problems. It serves financial services, advertising, media and
    entertainment, retail and consumer goods, healthcare and life sciences, manufacturing,
    technology, telecom, travel and hospitality, and government and defense industries,
    as well as the public sector. the company has a collaboration with OpenAI, L.L.C.
    for the development of AI solutions for joint enterprise customers that deliver
    tangible return on investment. The company was formerly known as Snowflake Computing,
    Inc. and changed its name to Snowflake Inc. in April 2019. Snowflake Inc. was
    incorporated in 2012 and is based in Menlo Park, California.
