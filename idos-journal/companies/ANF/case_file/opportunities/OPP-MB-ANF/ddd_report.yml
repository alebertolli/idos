    ## 8. Marco de Valoración


    **Estado:** No se puede determinar el valor intrínseco con la información disponible.
    El propio análisis AOIF califica el margen de seguridad como **insuficiente**;
    esa clasificación debe tratarse como una evaluación del análisis recibido, no
    como un resultado reproducible con los datos entregados.


    **Metodologías apropiadas para investigar:**

    - Flujo de caja descontado, con ingresos, márgenes, impuestos, reinversión, capital
    de trabajo, capex y coste de capital explícitos.

    - Valoración por múltiplos comparables —por ejemplo, EV/EBITDA y PER— únicamente
    después de verificar períodos, definiciones, precio, acciones diluidas, deuda
    y caja.

    - Análisis de escenarios que refleje la ciclicidad de la demanda, la sensibilidad
    promocional, el riesgo de inventario y la evolución por marca y canal.


    Los múltiplos informados de PER 12,58 y EV/EBITDA 7,51 no bastan para concluir
    que la acción esté infravalorada o sobrevalorada. DDD clasifica la conclusión
    sobre error de valoración como **no validada**.


    **Sensibilidades que deberían evaluarse cuando haya datos:**

    - Crecimiento de ventas comparables y de ingresos.

    - Margen bruto y margen operativo.

    - Conversión de beneficios en FCF, capex y capital de trabajo.

    - Coste de capital y crecimiento terminal.

    - Deuda neta, intereses y número de acciones diluidas.


    No se calculan escenarios numéricos porque faltan inputs verificables y comparables.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué fuentes y períodos respaldan el crecimiento de ingresos del 4,73%, el
    margen operativo del 14,08% y el ROIC del 26,66%?

    2. ¿Cómo evolucionan las ventas comparables, el tráfico, la conversión y la frecuencia
    de compra por marca, región y canal?

    3. ¿Qué parte del margen bruto y del FCF procede de cada marca y canal?

    4. ¿Qué inversiones, capex y necesidades de capital de trabajo respaldan la reinversión
    y el crecimiento?

    5. ¿Cuál es la evolución comparable de deuda, caja, gasto por intereses, vencimientos
    y acciones diluidas?

    6. ¿Qué guía ha ofrecido la empresa y cómo se compara con los resultados posteriores?

    7. ¿Qué información respalda las evaluaciones de calidad del management, alineación
    de insiders y asignación de capital?

    8. ¿Cuál es la composición del consejo y cómo se estructuran la independencia
    y los incentivos ejecutivos?

    9. ¿Cómo se construyeron los múltiplos, el margen de seguridad y la rentabilidad
    del FCF informados por AOIF?

    10. ¿Qué competidores comparables son adecuados para analizar la posición de ANF
