prompt_inputs:
  business_model: Meta Platforms, Inc. engages in the development of products that
    enable people to connect and share with friends and family through mobile devices,
    personal computers, virtual reality (VR) headsets, and AI glasses in the United
    States, Canada, Europe, Asia-Pacific, and internationally. It operates through
    two segments, Family of Apps (FoA) and Reality Labs (RL). The FoA segment offers
    Facebook, which enables people to build community through feed, reels, stories,
    groups, marketplace, and other; Instagram that brings people closer through Instagram
    feed, stories, reels, live, and messaging; Messenger, a messaging application
    for people to connect with friends, family, communities, and businesses across
    platforms and devices through text, audio, and video calls; Meta AI, an assistant
    that's available across apps, as a stand-alone app, on AI glasses, and on the
    web; Threads, an application for text-based updates and public conversations;
    and WhatsApp, a messaging application that is used by people and businesses to
    communicate and transact. The RL segment provides virtual and augmented reality
    products, including consumer hardware, software, and content that help people
    feel connected, as well as Meta Quest devices that enable social experiences across
    gaming, fitness, entertainment, and more. The segment also includes wearables
    such as AI glasses like Ray Ban Meta and Oakley Meta glasses; and the Meta Ray
    Ban Display, which combines AI glasses with an integrated lens display and the
    Meta Neural Band, a wrist worn device using electromyography that lets people
    control their AI glasses through neuromuscular signals. Meta Platforms, Inc. has
    a collaboration with Microsoft Corporation, NVIDIA Corporation, Advanced Micro
    Devices, Inc., Broadcom Inc., and OpenAI, L.L.C. The company was formerly known
    as Facebook, Inc. and changed its name to Meta Platforms, Inc. in October 2021.
    The company was incorporated in 2004 and is headquartered in Menlo Park, California.
