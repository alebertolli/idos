  justificacion: Meta Platforms es un negocio excepcional con un foso competitivo
    (moat) masivo basado en efectos de red directos e indirectos (Family of Apps supera
    los 3.200 millones de usuarios activos diarios). Mantiene retornos sobre el capital
    invertido (ROIC) cercanos al 30% y márgenes operativos superiores al 40%. Cotiza
    a múltiplos que reflejan adecuadamente su calidad y crecimiento esperado (~24-26x
    P/E NTM), ofreciendo una excelente rentabilidad sobre capital ajustada por riesgo
    sin depender de un descuento profundo de valoración.
dominio_business_quality:
