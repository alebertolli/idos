  de tipo Compounder. Combina un monopolio/duopolio práctico en atención social con
  un crecimiento de ingresos revalorizado (>21%), excelente margen operativo (38.1%)
  y un ROIC del 25.4%. A pesar de las preocupaciones por el elevado Capex en IA y
