  business_model: DocuSign, Inc. provides electronic signature solution in the United
    States and internationally. The company offers AI-powered intelligent agreement
    management (IAM) platform to optimize the gain intelligence and automation across
    the entire agreement lifecycle; and provides e-signature solution that enables
    sending and signing of agreements on various devices; Contract Lifecycle Management
    (CLM), which automates workflows across the entire agreement process; and Document
    Generation streamlines the process of generating new, custom agreements. It also
    provides Identify, a signer-identification option for checking government-issued
    IDs; Standards-Based Signatures, which support signatures that involve digital
    certificates; Monitor that uses advanced analytics; Notary which enables notaries
    public to conduct remote online notarization transactions; and Web Forms. In addition,
    the company offers Real Estate for eSignature that provides a way for brokers
    and agents to manage the entire real estate transaction digitally. eSignature
    and CLM are Federal Risk and Authorization Management Program (FedRAMP), an authorized
    version of DocuSign eSignature for U.S. federal government agencies; and life
    sciences modules that support compliance with the electronic signature practices.
    The company sells its products through direct and partner-assisted sales, and
    digital self-service purchasing. DocuSign, Inc. was incorporated in 2003 and is
    headquartered in San Francisco, California.
