    La calidad de tendencia financiera se calificó como **estable**, aunque no se
    aportó una serie temporal suficiente para verificar la dirección de ingresos,
    márgenes o retornos. Tampoco se proporcionan cifras de flujo de caja operativo,
    FCF absoluto, deuda, caja o acciones diluidas históricas. Por ello, no es posible
    evaluar con rigor la conversión de beneficios a caja, el apalancamiento neto ni
