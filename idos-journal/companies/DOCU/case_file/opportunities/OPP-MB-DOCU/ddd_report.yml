    ## 8. Marco de Valoración


    El valor intrínseco no puede determinarse rigurosamente con los datos disponibles:
    faltan precio y fecha de cotización verificables para un cálculo completo, acciones
    diluidas, deuda y caja, una serie de FCF y supuestos explícitos de largo plazo.
    Los múltiplos reportados —PER de 50,55 y EV/EBITDA de 33,53— no incluyen la información
    necesaria para reproducirlos.


    **Consenso y escenarios aportados** —USD, al 21-11-2026; horizonte al 21-11-2027:


    | Escenario | Precio objetivo | Supuestos principales |

    |---|---:|---|

    | Bajista | 60,00 | Crecimiento de ingresos de 3% anual y margen bruto por debajo
    de 77%. |

    | Base | 73,93 | Crecimiento de ingresos cercano al 5% anual y margen bruto alrededor
    de 79,6%. |


    El rango de consenso informado es de **60 a 90 USD**, con media de **73,93 USD**.
    La cotización indicada es **81,92 USD**; supera la media del consenso en aproximadamente
    7,99 USD, o 10,8% respecto a la media. El análisis interpreta esta diferencia
    como indicio de posible sobrevaloración relativa al consenso, no como una estimación
    independiente de valor intrínseco. Fuente del consenso: datos de investigación
    aportados, con fecha 21-11-2026.


    **Sensibilidad:** el escenario base depende de que se sostenga un crecimiento
    cercano al 5% y el margen bruto se mantenga en torno a 79,6%. Un crecimiento próximo
    al 3% junto con margen inferior al 77% respalda el escenario bajista. No se proporcionó
    escenario alcista ni una sensibilidad cuantitativa para otras combinaciones de
    crecimiento y margen.


