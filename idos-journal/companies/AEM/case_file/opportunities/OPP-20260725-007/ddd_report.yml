resumen_ejecutivo: Agnico Eagle Mines Limited es uno de los mayores productores globales
  de oro, distinguido por su baja exposición a riesgos geopolíticos (más del 80% de
  su producción está en Canadá, Australia y Finlandia). Con un margen operativo TTM
  del 60.2% y un ROIC del 23.6%, AEM exhibe la mejor eficiencia operativa de su clase.
  Aunque el negocio es inherente al ciclo del oro, su perfil de costes competitivos
  y sólido balance le permiten sobresalir frente a competidores directos como Newmont
  o Barrick Gold.
