    zinc). Aunque posee características operativas de alta calidad (bajo riesgo jurisdiccional
    y excelente perfil de costes), la naturaleza cíclica del mercado de metales dicta
    sus ciclos de capital y rentabilidad.
dominio_business_quality:
  analisis: AEM cuenta con un moat geográfico y operativo. Su enfoque en minería subterránea
    y a cielo abierto en países con alta seguridad jurídica (Canadá, Australia, Finlandia)
    minimiza el riesgo de expropiación y cambios regulatorios abruptos, un problema
    severo para competidores en África o Latinoamérica. Además, la escala de minas
    clave como Detour Lake y Canadian Malartic le otorgan costes de sostenimiento
    (AISC) en el cuartil inferior de la industria.
