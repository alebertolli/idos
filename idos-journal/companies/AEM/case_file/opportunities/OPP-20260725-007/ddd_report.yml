resumen_ejecutivo: Agnico Eagle Mines Limited (AEM) es el productor senior de oro
  de mayor calidad operativa y menor riesgo político del mundo. Su cartera se ubica
  estratégicamente en regiones mineras de primer orden como el cinturón Abitibi en
  Canadá, Fosterville en Australia y Kittilä en Finlandia. La integración exitosa
  de Kirkland Lake y la consolidación de Canadian Malartic han generado sinergias
  operativas sustanciales y han consolidado un perfil de costes competitivos. Con
  márgenes operativos del 60% y un ROIC elevado para el sector (23.6%), AEM destaca
  como el vehículo preferido para obtener exposición a metales preciosos con un riesgo
  de ejecución e insolvencia mínimo.
