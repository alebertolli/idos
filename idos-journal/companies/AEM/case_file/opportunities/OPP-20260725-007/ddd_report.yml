resumen_ejecutivo: Agnico Eagle Mines Limited es la minera de oro sénior de menor
  riesgo relativo del mundo, con activos concentrados en jurisdicciones de nivel superior
  (Tier-1) como Canadá, Australia y Finlandia. Con un margen operativo cercano al
  60% y un ROIC elevado (~23.6%), AEM se beneficia de economías de escala significativas
  tras la fusión con Kirkland Lake y la adquisición de los activos canadienses de
  Yamana Gold. El perfil de deuda es saludable y el riesgo de expropiación o inestabilidad
  política es mínimo en comparación con sus pares globales (Newmont, Barrick). AEM
  representa la mejor opción de renta variable para obtener exposición apalancada
  al oro con protección a la baja.
