prompt_inputs:
  business_model: Banco Santander (Brasil) S.A., together with its subsidiaries, provides
    various banking products and services to individuals, small and medium enterprises,
    and corporate customers in Brazil and internationally. It operates in two segments,
    Commercial Banking and Global Wholesale Banking. The company offers payment and
    loyalty products, including credit and debit cards; payroll and real estate loans;
    home equity financing solutions; microfinance programs; consortiums; agribusiness
    products, such as credit, securities and other products; call center and digital
    solutions; nonperforming assets; and insurance products comprising life, personal
    accident, vehicle, property, and credit insurance, as well as insurance for travel
    and banking transactions. It also provides emergency solutions for homes, cars,
    motorcycles, pets, and telemedicine; consumer finance; and corporate and investment
    banking services, which include cash management, structured trade and working
    capital solutions, trade and lending, mergers and acquisitions, equity capital
    markets, investment grade and emerging markets debt, and structured finance, as
    well as sales markets, market making, energy trading, equities, research, and
    private debt mobilization and securitization. In addition, the company offers
    cash management solutions, such as collections, payments, instant payments, and
    payroll and custody services; advance program, a non-financial platform to support
    entrepreneurs regarding educational content, certified courses, events focused
    on management, innovation, internationalization, and team development; customer
    funding through deposits and other bank funding instruments; and various investments.
    It offers its products and services through branches, mini-branches, and automated
    teller machines; call centers; banking correspondents and third-party vendors;
    and online and mobile banking platforms. The company was founded in 1970 and is
    headquartered in São Paulo, Brazil.
