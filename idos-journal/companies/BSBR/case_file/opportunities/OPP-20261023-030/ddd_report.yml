resumen_ejecutivo: 'BSBR es una franquicia bancaria brasileña expuesta a factores
  cíclicos. La evidencia financiera suministrada es escasa y presenta una señal de
  crecimiento de ingresos no comparable entre proveedores; además, la métrica de FCF
  requiere cautela al aplicarse a un banco. La cotización está por debajo del rango
  de objetivos de analistas aportado, pero no se puede concluir que exista infravaloración
  fundamental. La tesis es condicional: el caso mejoraría si resultados comparables
  confirmaran crecimiento y resiliencia de márgenes y crédito; se deterioraría si
  aflorara debilidad persistente en ingresos o activos. Convicción limitada por falta
  de evidencia primaria y de estados financieros completos.'
