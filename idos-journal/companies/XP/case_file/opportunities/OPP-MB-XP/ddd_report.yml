    and other alternative strategies. In addition, the company offers securities brokerage
    services for institutional and retail investors; interdealer brokerage services
    for institutional traders; and commercial and investment banking products, such
    as loan operations and transactions in the foreign exchange markets and deposits,
    as well as develops and sells financial education courses and events online and
    in person to retail clients. It offers its sell products and services through
    its omni-channel distribution network and online portals. XP Inc. was founded
    in 2001 and is based in George Town, the Cayman Islands.
