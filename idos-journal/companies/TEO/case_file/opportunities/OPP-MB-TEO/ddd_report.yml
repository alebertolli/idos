    connectivity products, including virtual private network services, traditional
    internet protocol links, and other products; and programming and other cable television
    services. In addition, the company provides telephone services, including local,
    domestic, and international long-distance telephone services, as well as public
    telephone services; and other related supplementary services, such as call waiting,
    call forwarding, conference calls, caller ID, voice mail, itemized billing, and
    maintenance services. Further, it offers infrastructure, interconnection, datacenter,
    internet, value added, and international long-distance services; and data services,
    including data transmission, virtual private networks, symmetric internet access,
    national and international signal transport, and videoconferencing services; Personal
    Pay, a digital wallet service. The company also offers broadcasting, cable television,
    financial, cybersecurity, ICT services and audiovisual communication, content
    platform and related services; security solutions and services; closed-circuit
    and community closed-circuit television, as well as investment and consulting
    services. The company was formerly known as Cablevisión S.A. and changed its name
    to Telecom Argentina S.A. in January 2018. Telecom Argentina S.A. was founded
    in 1979 and is based in Buenos Aires, Argentina.
