resumen_ejecutivo: Mizuho Financial Group (MFG) representa una oportunidad de inversión
  cíclica y de valor sustancial respaldada por la normalización de la política monetaria
  japonesa tras décadas de deflación y tipos de interés cero/negativos. Con unos ingresos
  TTM de $27.67B (+29.8% YoY) y un margen operativo del 35.6%, el grupo está aprovechando
  tanto la expansión del margen neto de intermediación como la diversificación de
  ingresos por comisiones internacionales y bancas de inversión. Aunque los retornos
  históricos (ROIC del 11.4% aproximado a nivel consolidado de negocio financiero)
  estaban atados al entorno de tipos, las reformas gubernamentales de eficiencia de
  capital actúan como un potente viento de cola para cerrar el descuento sobre el
  valor contable tangible.
score_general: 74
tesis_inversion: La tesis de inversión en Mizuho Financial Group se basa en un cambio
  de paradigma de la macroeconomía japonesa. Tras décadas de deflación y NIRP, la
  normalización de tipos por parte del BoJ genera una expansión directa y de alto
  margen en el negocio de intermediación financiera. Al mismo tiempo, la presión de
  los reguladores japoneses y de la TSE está transformando la gobernanza del banco,
  impulsando la desinversión de activos improductivos para retornar capital a los
  accionistas. Mizuho cotiza con un descuento atractivo respecto a sus pares globales
  a pesar de mostrar un impulso de beneficios sólido (+29.8% ingresos TTM).
