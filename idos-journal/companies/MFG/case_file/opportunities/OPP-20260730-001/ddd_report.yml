clasificacion_oportunidad:
  categoria: ciclica
  categorias_descartadas: Descartado 'Deep Value' porque, aunque cotiza a múltiplos
    moderados sobre valor contable, su apreciación responde más a un cambio estructural
    del ciclo monetario que a activos puramente liquidados o infravalorados estáticamente.
    Descartado 'Compounder' ya que la rentabilidad histórica sobre el capital ha estado
    limitada por las tasas negativas en Japón y la rigidez de costes regulatorios/tecnológicos.
  justificacion: Mizuho Financial Group es un megabanco sistémico japonés cuyo rendimiento
    operativo y rentabilidad están intrínsecamente ligados a los ciclos macroeconómicos,
    las políticas de tipos de interés del Banco de Japón (BoJ) y el ciclo de crédito
    global. Tras más de una década de tipos de interés negativos y compresión de márgenes,
    se encuentra en un punto de inflexión cíclico positivo debido a la normalización
    monetaria en Japón.
dominio_business_quality:
  analisis: Mizuho posee un foso competitivo (Moat) moderado sostenido por su estatus
    de megabanco sistémico (G-SIB) en Japón, sólidas relaciones bancarias corporativas
    históricas y altas barreras de entrada en servicios financieros institucionales
    y de custodia. Sin embargo, su negocio de banca minorista doméstica enfrenta desafíos
    de eficiencia estructural y la competencia de neobancos en Japón. Su presencia
    diversificada en EE.UU. y Asia añade resiliencia a la franquicia.
  rating: buena
