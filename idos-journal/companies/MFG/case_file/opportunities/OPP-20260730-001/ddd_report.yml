  justificacion: Mizuho Financial Group (MFG) es uno de los tres mega-bancos oligopólicos
    de Japón. Su rentabilidad y generación de caja están fundamentalmente condicionadas
    por el ciclo macroeconómico de tipos de interés y la política monetaria del Banco
    de Japón (BoJ). Tras años de tipos negativos, la entidad atraviesa una fase expansiva
    del ciclo impulsada por la normalización monetaria japonesa.
dominio_business_quality:
  analisis: Mizuho posee un foso competitivo (Moat) moderado asentado en ventajas
    de escala regulatoria y costes de cambio (switching costs) elevados en la banca
    corporativa y minorista en Japón. Como uno de los tres 'mega-bancos' del país,
    custodia una fracción crítica del crédito corporativo e institucional japonés.
    Históricamente ha tenido una eficiencia operativa ligeramente inferior a MUFG
    y SMFG, pero la integración de sus unidades bancaria, fiduciaria y de valores
    le otorga alta resiliencia.
  rating: buena
