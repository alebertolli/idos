  existing_wiki: '## 1. Visión General de la Compañía


    Mizuho Financial Group, Inc. (MFG) es un grupo financiero universal japonés. Sus
    actividades abarcan banca, banca fiduciaria, valores y otros servicios financieros
    en Japón y mercados internacionales. Atiende a empresas japonesas e internacionales
    —incluidas grandes corporaciones y clientes de financiación especializada—, así
    como a gobiernos y entidades públicas.


    El grupo obtiene ingresos principalmente mediante intermediación bancaria, comisiones
    y asesoramiento, y servicios relacionados con los mercados financieros. La información
    disponible describe el negocio y sus principales actividades, pero no incluye
    datos suficientes para evaluar de forma integral su rentabilidad, capitalización
    o valoración.


    La compañía pertenece al sector financiero y comparte exposiciones a tipos de
    interés, riesgo de crédito y regulación con entidades como [[C]], [[HSBC]], [[JPM]],
    [[ING]] y [[KB]]. La lista de compañías del mismo sector de la wiki existente
    incluye también [[AEG]], [[AIG]], [[AXP]], [[BSBR]], [[BX]], [[IBN]], [[ITUB]],
    [[LYG]] y [[MA]]; la relevancia competitiva de cada una frente a Mizuho no está
    establecida por la evidencia disponible.


    ## 2. Modelo de Negocio y Posición Competitiva


    Mizuho obtiene depósitos y otras fuentes de financiación y asigna capital a préstamos,
    inversiones y operaciones. Sus productos incluyen préstamos corporativos, sindicados,
    de adquisición, inmobiliarios, de proyectos y financiación estructurada, además
    de financiación y asesoramiento para mercados de deuda, préstamos y capital. [[AOIF]]


    **Principales drivers de ingresos identificados:**


    - Volumen de préstamos y depósitos.

    - Diferencial entre el rendimiento de los activos y el coste de financiación.

    - Tipos de interés en Japón y en los mercados internacionales.

    - Comisiones y asesoramiento vinculados a la actividad bancaria y de mercados.


    **Posición competitiva y moat:** el análisis de investigación clasifica a Mizuho
    como líder, con un moat estrecho. Las ventajas potenciales señaladas son su escala
    en Japón y las relaciones corporativas de larga duración. No se proporcionan métricas
    de cuota de mercado, rentabilidad ajustada al riesgo ni evidencia comparativa
    que permita verificar estas valoraciones. [[AOIF]]


    La banca está expuesta a cambios de tipos de interés, demanda de crédito, regulación
    prudencial y competencia de otros bancos. Entre los riesgos comparables para instituciones
    financieras se encuentran los que afrontan [[C]], [[HSBC]], [[JPM]], [[ING]] y
    [[LYG]], aunque la magnitud relativa de cada exposición no está documentada aquí.


    ## 3. Perfil Financiero


    La evidencia suministrada no permite establecer una serie financiera plenamente
    comparable: faltan unidades monetarias explícitas para varias cifras y referencias
    verificables para algunos cálculos. El paquete DDD indica que ingresos y beneficio
    neto reportados aumentan entre FY 2023 y FY 2026, pero no proporciona en este
    contexto los valores ni las unidades correspondientes. Por ello, no se calcula
    crecimiento compuesto ni se presentan importes no verificables. [[DDD]]


    | Métrica o aspecto | Evidencia disponible | Limitación |

    |---|---|---|

    | Ingresos | Se informa de una tendencia ascendente entre FY 2023 y FY 2026. |
    No se incluyen valores, unidades ni desglose por segmento. |

    | Beneficio neto | Se informa de una tendencia ascendente entre FY 2023 y FY 2026.
    | No se incluyen valores, unidades ni datos de beneficio normalizado. |

    | Flujo de caja libre (FCF) | Se reporta positivo en FY 2023 y negativo en FY
    2025 y FY 2026. | No se proporcionan importes ni explicación de las diferencias;
    la interpretación del FCF requiere cautela para una entidad bancaria. |

    | FCF TTM | Se plantea una discrepancia entre cifras históricas y TTM. | No se
    especifican los valores comparables ni la causa de la diferencia. |

    | Tendencia de ingresos y beneficio | El paquete sugiere crecimiento entre FY
    2023 y FY 2026. | No se pudo calcular el CAGR de ingresos por falta de referencias
    explícitas a los datos de entrada. |

    | Crecimiento del FCF | No disponible. | Los períodos recientes reportados son
    negativos y no cumplen la condición de cálculo indicada. |

    | Current ratio | Reportado como 0 para TTM terminado el 2026-09-30. | No se valida
    si esta métrica es interpretable para un banco; no debe tratarse como indicador
    concluyente de liquidez. |

    | Dilución interanual | No disponible. | Falta una serie comparable de acciones
    diluidas o acciones en circulación. |

    | Capital y estructura financiera | No hay datos suficientes. | No se aportan
    métricas de capital regulatorio, apalancamiento o financiación. |

    | Márgenes y retornos | No evaluables con la información suministrada. | Faltan
    métricas como margen de intereses, ROE, ROA y sus series históricas. |


    **Lectura financiera:** la combinación reportada de beneficio neto positivo con
    FCF negativo en períodos recientes requiere investigación, pero no permite por
    sí sola concluir que exista deterioro económico: en una entidad financiera, la
    definición y utilidad del FCF pueden diferir de las de una empresa no financiera.
    [[DDD]] [[AOIF]]


    ## 4. Management y Gobierno Corporativo


    La evaluación disponible califica la calidad de la gestión como regular, la asignación
    de capital como neutral y el alineamiento de insiders como débil. Estas valoraciones
    se consideran preliminares: el material no incluye resultados de gestión, objetivos
    de rentabilidad, detalles de remuneración, operaciones de insiders ni evidencia
    suficiente para verificar la asignación de capital. [[AOIF]]


    No se proporcionan datos sobre composición, independencia, experiencia o diversidad
    del consejo de administración. Tampoco hay información que permita evaluar la
    estructura de incentivos, el historial de cumplimiento de objetivos o la propiedad
    accionarial de directivos e insiders.


    ## 5. Tesis de Inversión


    **Caso alcista provisional:** Mizuho combina banca, banca fiduciaria, valores
    y otros servicios financieros en varios mercados. La amplitud de productos y su
    base de clientes corporativos e institucionales podrían respaldar diversas fuentes
    de ingresos, mientras que las relaciones corporativas de larga duración y la escala
    en Japón son ventajas potenciales. [[AOIF]]


    El paquete DDD reporta crecimiento de ingresos y beneficio neto entre FY 2023
    y FY 2026. Si esa tendencia se confirma con estados financieros comparables y
    se acompaña de rentabilidad sostenible, capital adecuado y calidad crediticia
    estable, podría respaldar la continuidad del crecimiento. La evidencia disponible,
    sin embargo, no permite verificar la composición del crecimiento, sus márgenes
    ni su impacto sobre los retornos. [[DDD]]


    **Estado de la tesis:** investigación fundamental pendiente. La puntuación general
    de 43 incluida en DDD no viene acompañada de una metodología verificable en el
    material suministrado y no se interpreta como recomendación de inversión. La decisión
    se mantiene pendiente de evaluación adicional. [[DDD]] [[AOIF]]


    ## 6. Riesgos y Contra-Tesis


    **Riesgos identificados:**


    - **Tipos de interés:** cambios en los tipos pueden afectar el margen de intermediación,
    el valor de activos y pasivos y el comportamiento de clientes. El análisis asigna
    impacto alto y probabilidad media a este riesgo. [[AOIF]]

    - **Calidad crediticia:** un deterioro en carteras corporativas, inmobiliarias
    o de financiación estructurada podría afectar los resultados. El análisis asigna
    impacto alto y probabilidad media. [[AOIF]]

    - **Calidad y comparabilidad de datos:** faltan unidades monetarias explícitas
    para varias series y datos suficientes para validar tendencias, márgenes, retornos
    y estructura de capital. [[DDD]]

    - **FCF negativo reportado:** el FCF pasa de positivo en FY 2023 a negativo en
    FY 2025 y FY 2026. Se necesita conocer la definición utilizada y las causas; para
    un banco, la lectura de esta métrica requiere cautela. [[DDD]] [[AOIF]]

    - **Competencia y regulación:** la banca está expuesta a competencia de otros
    bancos y a requisitos prudenciales. El material no cuantifica la posición de Mizuho
    frente a sus pares. [[AOIF]]

    - **Valoración no establecida:** no se proporcionan los datos necesarios para
    calcular una estimación intrínseca o un margen de seguridad. [[AOIF]]


    **Contra-tesis:** el crecimiento reportado puede no traducirse en mejoras sostenibles
    de rentabilidad o creación de valor. Además, las referencias a objetivos de analistas
    no validan un error de valoración: no se indica el horizonte de esos objetivos
    ni se ofrece una estimación intrínseca. El paquete cita una cotización de USD
    9,66 al 2026-10-30 y un objetivo medio observado de USD 11,64, con rango no detallado
    aquí; son referencias observadas, no una conclusión de valor razonable. [[DDD]]


    **Falsadores propuestos:**


    - La tesis de crecimiento se debilitaría si futuras series comparables mostraran
    una reversión sostenida de ingresos o beneficios.

    - La tesis de reinversión y creación de valor se debilitaría si el FCF siguiera
    siendo negativo sin una explicación específica y verificable. [[DDD]]


    ## 7. Catalizadores y Timeline


    | Catalizador | Fecha esperada | Impacto potencial | Estado de evidencia |

    |---|---|---|---|

    | Confirmación de la continuidad del crecimiento de ingresos | Sin fecha indicada
    | Podría respaldar la tesis si se confirma junto con composición, márgenes y rentabilidad.
    | Hipótesis a validar; basada en la tendencia reportada entre FY 2023 y FY 2026.
    [[DDD]] |

    | Divulgación comparable de rentabilidad, capital y flujos de caja | Sin fecha
    indicada | Permitiría evaluar mejor la capacidad de reinversión y la calidad del
    crecimiento. | Necesidad de investigación; no se identifica un evento o fecha
    concreta. [[DDD]] |

    | Publicación de estados financieros y métricas bancarias detalladas | Sin fecha
    indicada | Permitiría analizar margen de intereses, ROE, ROA, capital y calidad
    crediticia. | Agenda de investigación derivada de la ausencia de datos. [[AOIF]]
    |


    No se proporcionan fechas de resultados, anuncios corporativos ni otros eventos
    específicos confirmados. Por tanto, los elementos anteriores son necesidades de
    seguimiento, no catalizadores fechados.


    ## 8. Marco de Valoración


    La valoración no puede establecerse con la información disponible. Faltan precio
    de mercado con fecha de referencia verificable para el análisis, beneficio por
    acción, patrimonio tangible, beneficio normalizado, métricas de capital y datos
    financieros suficientes para aplicar una metodología con supuestos fundamentados.
    [[AOIF]]


    Para una entidad bancaria como Mizuho, el análisis debería priorizar métricas
    y métodos compatibles con el sector, por ejemplo:


    - **Precio sobre valor contable tangible (P/TBV)** y comparación con pares, sujeto
    a disponer de patrimonio tangible por acción y datos comparables.

    - **Precio sobre beneficios (P/E)** sobre beneficios normalizados, una vez aclaradas
    las unidades, la evolución de beneficios y los posibles efectos no recurrentes.

    - **Valoración basada en rentabilidad sobre capital:** contraste entre ROE sostenible,
    coste del capital y valor contable.

    - **Análisis de escenarios:** sensibilidad a tipos de interés, coste de financiación,
    calidad crediticia, pérdidas por préstamos y niveles de capital.


    No se calculan múltiplos, valor intrínseco ni margen de seguridad. El precio observado
    de USD 9,66 al 2026-10-30 y el objetivo medio de analistas de USD 11,64 son referencias
    de mercado incluidas en DDD; sin horizonte definido y sin una valoración fundamental
    independiente, no bastan para concluir que la acción esté infravalorada. [[DDD]]


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es la moneda y cuáles son las unidades de cada serie financiera, y son
    comparables entre campos y períodos?

    2. ¿Qué explica la evolución del FCF reportado y la diferencia entre las cifras
    históricas y TTM? ¿Qué definición de FCF se utiliza para una entidad financiera?

    3. ¿Qué segmentos y productos impulsaron el crecimiento reportado de ingresos
    y beneficio entre FY 2023 y FY 2026?

    4. ¿Cómo evolucionaron el margen de intereses, las comisiones, el ROE, el ROA
    y los beneficios normalizados?

    5. ¿Cuáles son los niveles y tendencias de capital regulatorio, liquidez y financiación?

    6. ¿Cómo se compara la calidad crediticia de las carteras corporativas, inmobiliarias
    y de financiación estructurada con períodos anteriores?

    7. ¿Cuál es la exposición del balance a cambios de tipos de interés y qué sensibilidad
    tienen los ingresos y el valor económico de activos y pasivos?

    8. ¿Qué métricas verificables respaldan la caracterización de Mizuho como líder
    con un moat estrecho en Japón?

    9. ¿Qué objetivos de rentabilidad, remuneración e incentivos existen para la dirección?
    ¿Cómo se comparan con los resultados observados?

    10. ¿Cuál es la composición del consejo y qué información hay sobre independencia,
    experiencia e propiedad accionarial de insiders?

