clasificacion_oportunidad:
  categoria: compounder
  categorias_descartadas: Descartada 'hype' porque, a diferencia de empresas puramente
    especulativas de IA, Palantir genera flujo de caja libre masivo y beneficio neto
    GAAP positivo y recurrente. Descartada 'quality_at_fair_price' debido a que el
    múltiplo actual no representa un precio razonable sino una valoración de perfección.
    Descartada 'deep_value' o 'turnaround' por la ausencia de deterioro operativo
    o descuento sobre activos.
  justificacion: Palantir exhibe características de un Compounder de altísima calidad
    tecnológica, respaldado por un foso competitivo basado en altos costes de cambio
    (switching costs), un sistema operativo de datos integrado (Gotham, Foundry, AIP)
    y contratos gubernamentales y comerciales altamente recurrentes. No obstante,
    se negocia a una valoración extremadamente exigente (P/S > 40x y P/E > 100x),
    lo que refleja un perfil de Compounder con prima de valoración cara debido al
    impulso de la IA.
dominio_business_quality:
  analisis: El foso competitivo de Palantir es profundo y duradero. Se apoya en costes
    de cambio extremos (las ontologías de Foundry/Gotham quedan integradas en el núcleo
    operativo del cliente) y en un efecto de red de datos. La plataforma AIP actúa
    como capa de orquestación segura para LLMs en entornos soberanos y corporativos,
    consolidando su liderazgo en misiones críticas de defensa e inteligencia.
  rating: excepcional
