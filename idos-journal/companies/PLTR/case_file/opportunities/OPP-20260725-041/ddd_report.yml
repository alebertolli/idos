  business_model: Palantir Technologies Inc. builds and deploys software platforms
    for the intelligence community to assist in counterterrorism investigations and
    operations in the United States, the United Kingdom, and internationally. It provides
    Palantir Gotham integrates with other platforms for defense offerings which enables
    users to see, understand, and act in the modern battlespace; operations centers
    to the tactical edge; integrating data from domains and sensors in near real-time;
    and situational awareness and accelerating operational decision-making, as well
    as facilitates the hand-off between analysts and operational users, helping operators
    plan and execute real-world responses to threats that have been identified within
    the platform. The company also offers Palantir Foundry, a platform that helps
    organizations operate by creating a central operating system for their data; and
    allows individual users to integrate and analyze the data they need in one place.
    In addition, it provides Palantir Apollo, a software that delivers software and
    updates across the business, as well as enables customers to deploy their software
    virtually in any environment; and Palantir Artificial Intelligence Platform that
    provides unified access to open-source, self-hosted, and commercial large language
    models (LLMs) that can transform structured and unstructured data into LLM-understandable
    objects and can turn organizations' actions and processes into tools for humans
    and LLM-driven agents. The company also has a strategic partnership with Ondas
    Inc. to develop and deploy AI-enabled operational capabilities to scale stratospheric,
    aerial, and land-based ISR missions. The company has a strategic collaboration
    with NVIDIA to deliver an intelligent engine for running NVIDIA AI and Nemotron
    open models in sovereign environments. The company was incorporated in 2003 and
    is headquartered in Aventura, Florida.
