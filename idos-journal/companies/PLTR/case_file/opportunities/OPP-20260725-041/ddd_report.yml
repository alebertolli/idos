calidad_evidencia:
  hechos_verificados:
  - Palantir mantiene una posición financiera prístina con cero deuda financiera neta.
  - Lanzamiento y rápida adopción del modelo Artificial Intelligence Platform (AIP).
  - Alianzas estratégicas con actores clave como NVIDIA y Ondas Inc. para despliegues
    en entornos soberanos e ISR.
  inferencias_llm:
  - La estrategia de bootcamps continuará reduciendo el Coste de Adquisición de Cliente
