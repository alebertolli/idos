dominio_esg_supply_chain:
  analisis: Riesgos reputacionales y de escrutinio ético asociados al uso de su plataforma
    Gotham por agencias de inteligencia, inmigración y fuerzas armadas. La dependencia
    de infraestructura en la nube (AWS, Azure, Google Cloud) para despliegues no locales
    presenta una dependencia de proveedores tecnológicos menores pero relevante en
    términos de integración.
  rating: medio_riesgo
dominio_financial_health:
  analisis: Balance extremadamente sólido con ratio Deuda/Patrimonio (D/E) de 0.0x
    y ausencia de endeudamiento financiero significativo. Generación de caja operativa
    sostenida y flujo de caja libre GAAP positivo, respaldado por un perfil de liquidez
    robusto que permite financiar el crecimiento orgánico sin necesidad de dilución
    o apalancamiento.
  rating: fuerte
dominio_growth:
  analisis: Impulsado por el segmento comercial de EE.UU. a través del formato innovador
    de bootcamps de AIP, reduciendo el ciclo de venta tradicional. La demanda de soluciones
    de IA aplicadas a la defensa por tensiones geopolíticas globales asegura una visibilidad
    de ingresos gubernamentales a largo plazo con contratos plurianuales.
  rating: fuerte
dominio_management:
  analisis: El equipo fundador encabeza una visión de largo plazo centrada en la soberanía
    tecnológica occidental. Alexander Karp (CEO) y Peter Thiel mantienen el control
    efectivo mediante estructuras accionarias multiclase. Aunque la alineación estratégica
    y la ejecución del producto son sobresalientes, la compensación basada en acciones
    (SBC) ha sido históricamente elevada, si bien tiende a normalizarse conforme escala
    la facturación.
  rating: bueno
