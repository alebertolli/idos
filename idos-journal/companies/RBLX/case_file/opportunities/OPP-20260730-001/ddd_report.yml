  generado por usuarios (UGC) con un potente efecto de red y un crecimiento de ingresos
  del +29.6% TTM. Sin embargo, el perfil financiero actual muestra una severa falta
  de rentabilidad operativa (Margen Operativo -22.9%, ROIC -35.3%) provocada por elevados
  pagos a desarrolladores, costes de infraestructura y compensación basada en acciones
  (SBC). El análisis de segundo nivel revela que, si bien la tracción del ecosistema
  es fuerte, la monetización vía publicidad y la expansión demográfica deben compensar
  presiones crecientes de seguridad infantil y costes técnicos.
