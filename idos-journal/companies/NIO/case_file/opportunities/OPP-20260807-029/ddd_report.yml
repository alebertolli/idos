  business_model: NIO Inc. designs, develops, manufactures, and sells smart electric
    vehicles in China, Europe, and internationally. It offers five and six-seater
    electric SUVs, as well as smart electric sedans. The company also offers power
    solutions, including Power Home, a home charging solution; Power Swap, a battery-swapping
    service; Power Charger and Destination Charger; Power Mobile, a mobile charging
    service through charging vans; Power Map, an application that provides access
    to a network of public chargers and their real-time information; and One Click
    for power valet service. In addition, it provides repair, maintenance, car beauty,
    and inspection services through its service centers and authorized third-party
    service centers; vehicle transportation and delivery, pre-delivery inspections,
    guidance on vehicle features, assistance with vehicle registration, and insurance
    processing services; insurance, maintenance, repairs, accident rescue, car washing,
    chauffeur services, and valet parking services; and remote monitoring and real-time
    diagnostics services, as well as technical, warranty, and auto financing arrangements.
    Further, the company is involved in the provision of energy and service packages
    to its users; design and technology development activities; manufacture of electric
    powertrains, battery packs, and components; and sales and after-sales management
    activities. Additionally, it operates in app NIO Auto Mall where users can select
    from various accessories and value added services; and online auction platform.
    The company was formerly known as NextEV Inc. and changed its name to NIO Inc.
    in July 2017. NIO Inc. was incorporated in 2014 and is headquartered in Shanghai,
    China.
