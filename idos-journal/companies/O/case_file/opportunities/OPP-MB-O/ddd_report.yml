  existing_wiki: '## 1. Visión General de la Compañía


    Realty Income Corporation (ticker: O) es un REIT que adquiere, posee y arrienda
    principalmente propiedades comerciales. Su modelo se basa en obtener capital mediante
    deuda y emisión de acciones, adquirir inmuebles, celebrar contratos de arrendamiento
    con empresas y cobrar las rentas. También se describen soluciones de capital inmobiliario
    y financiación para empresas, aunque no se aportan datos sobre su contribución
    a los ingresos. [AOIF; sin fuente ni fecha verificables]


    La cartera reportada supera las 15.500 propiedades en Estados Unidos, Reino Unido
    y otros ocho países europeos, al 30 de junio de 2026. La información disponible
    no incluye el desglose por país, sector o arrendatario. [DDD; StockAnalysis, información
    financiera](https://stockanalysis.com/stocks/o/financials/)


    ## 2. Modelo de Negocio y Posición Competitiva


    **Drivers de ingresos identificados:**

    - Ocupación de la cartera y cobro de rentas.

    - Adquisición de propiedades y expansión de la cartera.


    La investigación describe contratos de arrendamiento de largo plazo, en su mayoría
    de tipo *net lease*. Estos contratos podrían dar visibilidad a los ingresos, pero
    el paquete no incluye datos de vencimientos, escaladores de rentas, ocupación,
    cobros o renovaciones con los que validar esa estabilidad. [AOIF; sin fuente ni
    fecha verificables]


    La escala, la diversificación geográfica y por inquilino, la experiencia en adquisiciones
    y la capacidad de acceder a mercados de capitales se plantean como posibles ventajas
    competitivas. AOIF califica la posición como líder y el moat como estrecho; ambas
    son evaluaciones del análisis suministrado, no conclusiones verificables con datos
    comparativos en el paquete. La escala y la diversificación podrían apoyar el crecimiento,
    pero no demuestran que las adquisiciones generen retornos superiores al coste
    de financiación.


    La economía del negocio depende de las condiciones de financiación, las tasas
    de interés, los precios inmobiliarios, la solvencia de los inquilinos y la demanda
    de espacios físicos. No se proporcionan comparables de competidores; por tanto,
    no se incluyen otras compañías como referencias sectoriales.


    ## 3. Perfil Financiero


    | Métrica | Observación | Periodo / calidad de evidencia |

    |---|---:|---|

    | Propiedades | Más de 15.500 | 30-06-2026; reportado en DDD |

    | Deuda total | 32.110,0 en unidades del proveedor | 30-09-2026; las unidades
    no están conciliadas con las de EBITDA |

    | Current ratio | 2,17x | 30-09-2026; StockAnalysis, [estadísticas](https://stockanalysis.com/stocks/O/statistics/)
    |

    | Interest coverage | 0 | 30-09-2026; dato reportado que debe verificarse antes
    de interpretarlo |

    | FCF TTM, estadísticas | -3.160.000.000 | 30-09-2026; StockAnalysis, [estadísticas](https://stockanalysis.com/stocks/O/statistics/)
    |

    | FCF TTM, serie financiera | 4.149,0 en unidades del proveedor | 30-09-2026;
    StockAnalysis, [información financiera](https://stockanalysis.com/stocks/o/financials/)
    |

    | FCF FY 2025, serie financiera | 3.995,0 en unidades del proveedor | FY 2025;
    StockAnalysis, [información financiera](https://stockanalysis.com/stocks/o/financials/)
    |

    | Crecimiento de ingresos | 10,71% | Cifra suministrada por AOIF; sin periodo
    ni fuente verificables |

    | Margen operativo | 46,78% | Cifra suministrada por AOIF; sin periodo ni fuente
    verificables |

    | ROIC | 3,68% | Cifra suministrada por AOIF; sin periodo ni fuente verificables
    |

    | EV/EBITDA | 15,9x | Cifra suministrada por AOIF; sin fuente ni fecha verificables
    |

    | PER | 40,14x | Cifra suministrada por AOIF; sin fuente ni fecha verificables
    |

    | FCF yield | 0% | Cifra suministrada por AOIF; sin fuente ni fecha verificables
    |


    No se pudo calcular el CAGR de ingresos a tres años: la serie disponible no proporciona
    una observación comparable de FY 2023. El crecimiento del FCF tampoco es utilizable
    hasta reconciliar las cifras incompatibles de FCF y sus unidades. En consecuencia,
    no se debe inferir de estos datos una tendencia fiable de cobertura del dividendo,
    generación de caja o capacidad de financiación.


    El paquete no permite calcular deuda neta/EBITDA: las unidades disponibles no
    son compatibles. Además, el interés cubierto reportado como cero necesita verificación
    de definición e inputs. Las cifras financieras convencionales deben interpretarse
    con cautela en un REIT; AOIF señala que el FCF puede ser poco representativo por
    las adquisiciones inmobiliarias, pero no aporta una conciliación alternativa con
    AFFO.


    ## 4. Management y Gobierno Corporativo


    AOIF califica la calidad del management como buena y la asignación de capital
    como neutral. Señala la escala de la cartera y la trayectoria de dividendos como
    indicios favorables de ejecución y acceso a capital, pero no proporciona evidencia
    verificable de resultados recientes ni métricas de retorno sobre adquisiciones.


    El alineamiento de insiders se califica como débil en AOIF, sin cifras de propiedad
    accionaria ni detalle de incentivos. No hay información sobre composición, independencia,
    experiencia o comités del board. Estas evaluaciones deben considerarse preliminares
    hasta contar con fuentes corporativas y datos verificables.


    ## 5. Tesis de Inversión


    **Caso alcista — hipótesis por validar:**


    - Una cartera de más de 15.500 propiedades en varios países podría aportar escala
    y diversificación. El dato está reportado al 30 de junio de 2026, pero no se incluyen
    desglose ni medidas de concentración. [DDD; StockAnalysis, [información financiera](https://stockanalysis.com/stocks/o/financials/)]

    - Los arrendamientos de largo plazo podrían favorecer la visibilidad de rentas,
    siempre que se mantengan la ocupación, el cobro y la solvencia de los inquilinos.
    AOIF describe el modelo, pero no aporta datos operativos para comprobar estos
    factores.

    - La compañía declara una misión centrada en dividendos mensuales que aumentan
    con el tiempo, según la tesis suministrada. El paquete no incluye historial detallado,
    AFFO por acción ni cobertura del dividendo para evaluar su sostenibilidad.

    - La expansión mediante adquisiciones podría contribuir al crecimiento si los
    retornos de los inmuebles superan el coste de capital. La investigación no proporciona
    retornos de adquisición ni una comparación con los costes de financiación.


    No se valida un error de valoración con la evidencia disponible. Los objetivos
    de analistas no sustituyen una valoración independiente basada en AFFO, activos,
    deuda y supuestos de crecimiento.


    ## 6. Riesgos y Contra-Tesis


    - **Financiación y tasas:** un aumento de tasas o de diferenciales de crédito
    podría encarecer refinanciaciones y reducir el atractivo relativo del dividendo.
    AOIF lo identifica como un riesgo de impacto alto y probabilidad media; es una
    evaluación cualitativa sin modelo de sensibilidad.

    - **Riesgo de inquilinos y activos:** deterioro financiero, impagos, vacancia
    o costes de re-arrendamiento podrían debilitar los ingresos. No hay datos de ocupación,
    morosidad, retención ni concentración para cuantificar este riesgo.

    - **Apalancamiento:** se reportan 32.110,0 de deuda total al 30 de septiembre
    de 2026, pero las unidades no permiten validar deuda neta/EBITDA. [DDD; StockAnalysis,
    [información financiera](https://stockanalysis.com/stocks/o/financials/)]

    - **FCF no conciliado:** las cifras reportadas para FCF TTM difieren entre la
    página de estadísticas y la serie financiera, por lo que no permiten extraer una
    conclusión fiable sobre financiación del crecimiento o cobertura del dividendo.
    [StockAnalysis, [estadísticas](https://stockanalysis.com/stocks/O/statistics/);
    [información financiera](https://stockanalysis.com/stocks/o/financials/)]

    - **Retornos de reinversión:** la escala de la cartera no demuestra por sí sola
    que las adquisiciones creen valor. Retornos persistentemente inferiores al coste
    de capital falsarían la hipótesis de creación de valor mediante reinversión.

    - **Evidencia operativa incompleta:** un deterioro sostenido en ocupación, cobro
    de rentas o renovaciones contradiría la hipótesis de ingresos inmobiliarios resilientes.


    ## 7. Catalizadores y Timeline


    | Catalizador | Fecha esperada | Impacto potencial | Estado de evidencia |

    |---|---|---|---|

    | Próximas actualizaciones financieras | Sin fecha indicada | Podrían aclarar
    evolución de ingresos, deuda, flujo de caja y capacidad para sostener la política
    de dividendos | DDD no proporciona calendario ni guía futura |

    | Evolución de la cartera | Sin fecha indicada | El crecimiento podría respaldar
    ingresos; su valor dependería de los retornos de adquisición y del coste de financiación
    | Cartera reportada superior a 15.500 propiedades al 30-06-2026 |

    | Aclaración de FCF y métricas de cobertura | Sin fecha indicada | Permitiría
    evaluar mejor financiación de inversiones y dividendos | Persiste una discrepancia
    entre fuentes |


    No hay en el paquete fechas específicas de resultados, hitos corporativos o adquisiciones
    futuras.


    ## 8. Marco de Valoración


    Para un REIT, el análisis debería centrarse en AFFO por acción, crecimiento orgánico
    de rentas, cobertura del dividendo, calidad y vencimientos de los arrendamientos,
    valor de los activos y estructura de deuda. El paquete no contiene los datos necesarios
    para construir una estimación independiente de valor intrínseco.


    Como referencias de mercado, DDD reporta una cotización de **USD 56,93 al 30 de
    octubre de 2026** y objetivos de analistas con media y mediana de **USD 63,77**,
    dentro de un rango de **USD 59–74**, al 20 de noviembre de 2026. Estas referencias
    no demuestran infravaloración; no se aportan los supuestos de los analistas para
    contrastarlos. [DDD; precios y consenso reportados en el paquete]


    **Supuestos y sensibilidad que deben investigarse antes de valorar:**

    - AFFO normalizado por acción y crecimiento sostenible.

    - Crecimiento orgánico de rentas, ocupación, renovaciones y retención de inquilinos.

    - Retornos de nuevas adquisiciones frente al coste de deuda y al coste de capital
    total.

    - Deuda neta, vencimientos, tipo fijo o variable y sensibilidad a tasas.

    - Valor de los activos y tasas de capitalización bajo distintos escenarios.


    Sin estos datos, el valor intrínseco y el margen de seguridad no son estimables
    con rigor. AOIF califica el margen de seguridad como insuficiente, pero también
    indica que sus múltiplos no tienen fuente ni fecha verificables.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuáles son las tendencias de ocupación, cobro de rentas, rentas comparables,
    renovaciones y retención de inquilinos?

    2. ¿Qué concentración existe por arrendatario, sector, país y vencimiento de contratos?

    3. ¿Qué retornos obtiene Realty Income en adquisiciones y cómo se comparan con
    el coste de financiación y de capital?

    4. ¿Cuál es la reconciliación correcta del FCF TTM entre las estadísticas y la
    serie financiera? ¿Qué unidades usa cada fuente?

    5. ¿Cuál es la cobertura del dividendo con AFFO por acción y cómo ha evolucionado?

    6. ¿Qué nivel de deuda neta, calendario de vencimientos y exposición a tasas tiene
    la compañía?

    7. ¿Qué periodos y fuentes respaldan las cifras de crecimiento de ingresos, margen
    operativo, ROIC y múltiplos proporcionadas por AOIF?

    8. ¿Qué evidencia respalda las evaluaciones de calidad del management, asignación
    de capital, alineamiento de insiders y composición del board?

    9. ¿Qué supuestos sustentan los objetivos de analistas reportados al 20 de noviembre
    de 2026?

