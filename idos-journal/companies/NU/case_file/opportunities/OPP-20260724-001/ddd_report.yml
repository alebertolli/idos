    solutions, including life, mobile, auto, home, and financial protection insurance
    policies; and beyond financial services solutions, including NuTravel, a travel
    portal; and NuCel, a mobile phone service. Nu Holdings Ltd. was founded in 2013
    and is headquartered in São Paulo, Brazil.
