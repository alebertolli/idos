  existing_wiki: '## 1. Visión General de la Compañía


    Newmont Corporation ([[NEM]]) es un productor minero integrado cuyo producto principal
    es el oro y que también tiene exposición a cobre y otros metales. Su cadena de
    valor abarca exploración y evaluación geológica, permisos y desarrollo de minas,
    extracción, procesamiento y venta de concentrados o metales. Entre sus clientes
    y contrapartes se incluyen refinadores, fundiciones, comerciantes y entidades
    financieras de metales. [Resumen financiero y análisis del negocio, 2026-11-20;
    AOIF, sin fecha indicada]


    La empresa opera en una industria intensiva en capital y cíclica. Sus resultados
    dependen de los precios de los metales, los volúmenes y leyes de mineral, la recuperación
    en planta, los costos y la ejecución de proyectos. El material disponible indica
    operaciones o activos en varias jurisdicciones, pero no identifica ni cuantifica
    la exposición por país u operación. [Resumen financiero, 2026-11-20; AOIF, sin
    fecha indicada]


    Compañías del sector con riesgos o dinámicas comparables incluyen [[AEM]], [[B]],
    [[BHP]], [[CDE]], [[FCX]] y [[HL]].


    ## 2. Modelo de Negocio y Posición Competitiva


    Los ingresos dependen principalmente del volumen de metales producido y vendido
    y de los precios realizados. La extracción y el procesamiento están expuestos
    a la calidad del yacimiento, las leyes del mineral, la recuperación, la disponibilidad
    de equipos y la continuidad operativa. También son relevantes los costos de energía,
    materiales, mano de obra y servicios. [AOIF, sin fecha indicada]


    El análisis AOIF caracteriza a Newmont como líder y atribuye ventajas potenciales
    a su escala, experiencia operativa, cartera de activos, conocimiento geológico
    y capacidad para financiar proyectos de larga duración. El mismo análisis califica
    el moat como **estrecho**: la escala no elimina la exposición a precios de commodities,
    costos, riesgos geológicos ni dificultades de ejecución. Estos juicios son evaluaciones
    del paquete de investigación, no verificaciones independientes. [AOIF, sin fecha
    indicada]


    La industria presenta barreras de oferta asociadas a los plazos de exploración,
    desarrollo y permisos. A la vez, es cíclica y sensible a cambios en los precios
    de oro y metales base. Las mismas dinámicas pueden afectar a compañías como [[AEM]],
    [[BHP]] y [[FCX]].


    ## 3. Perfil Financiero


    Las cifras siguientes proceden de las fuentes y evaluaciones incluidas en el material
    de investigación. Cuando no se especifican definición, unidad, período comparable
    o metodología, la métrica debe tratarse como reportada y pendiente de verificación.


    | Métrica | Valor reportado | Período / referencia | Estado y limitaciones |

    |---|---:|---|---|

    | Flujo de caja libre (FCF) | 10,074 | TTM al 2026-09-30 | Reportado por Stock
    Analysis; no se especifica aquí la unidad. |

    | FCF | 7,299 | FY 2025 | Reportado por Stock Analysis; no se especifica aquí
    la unidad. |

    | Crecimiento del FCF | 64.55% | TTM al 2026-09-30 | Reportado por Stock Analysis;
    el período comparativo no está identificado explícitamente, por lo que no se puede
