    | Margen bruto | 68.04% | TTM al 2026-09-30 | Reportado por Stock Analysis. |

    | Margen bruto | 63.24% | FY 2025 | Reportado por Stock Analysis. |

    | Crecimiento de ingresos | 23.73% | Período no especificado | Cifra de AOIF;
    requiere verificar período, fuente y definición. |

    | Margen operativo | 55.56% | Período no especificado | Cifra de AOIF; requiere
    verificar período, fuente y definición. |

    | ROIC | 29.38% | Período no especificado | Cifra de AOIF; requiere verificar
    período, fuente y definición. |

    | PER | 11.23 | Fecha y base no especificadas | Cifra de AOIF; no debe interpretarse
    como múltiplo actual sin validar fecha y cálculo. |

    | EV/EBITDA | 5.59 | Fecha y base no especificadas | Cifra de AOIF; no debe interpretarse
    como múltiplo actual sin validar fecha y cálculo. |

    | FCF yield | 0 | Fecha y método no especificados | Cifra de AOIF; no se aportan
