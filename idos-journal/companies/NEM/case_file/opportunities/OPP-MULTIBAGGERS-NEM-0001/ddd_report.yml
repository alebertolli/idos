    | Current ratio | 2.45 | 2026-09-30 | Reportado por Stock Analysis; no cruza el
    umbral de alerta inferior a 0.5 utilizado en el paquete. |

    | Deuda neta / EBITDA | No calculable | 2026-09-30 | Las bases de unidad disponibles
    no son compatibles o no están especificadas. |

    | Dilución interanual | No evaluable | Sin período comparable | Falta una serie
