  existing_wiki: '## 1. Visión General de la Compañía


    Newmont Corporation ([[NEM]]) es una minera internacional dedicada a explorar,
    desarrollar, extraer, procesar y vender metales, principalmente oro y también
    cobre. Su cadena de valor abarca desde la evaluación de recursos y la obtención
    de permisos hasta la operación de minas y la comercialización del producto.


    Sus clientes incluyen refinadores, fundiciones y participantes del mercado de
    metales. La compañía opera en una industria cíclica y de capital intensivo, en
    la que los resultados dependen tanto de los precios de los metales como del desempeño
    de los activos mineros.


    Entre las compañías relacionadas del sector figuran [[AEM]], [[BHP]], [[FCX]],
    [[SCCO]], [[HL]] y [[CDE]]. La exposición a metales y a operaciones mineras también
    conecta a NEM con otros productores como [[GGB]].


    ## 2. Modelo de Negocio y Posición Competitiva


    **Drivers de ingresos y rentabilidad**


    - Precio de venta del oro, el cobre y otros metales producidos.

    - Volumen de producción y mezcla de metales.

    - Ley del mineral, recuperación y eficiencia de procesamiento.

    - Costes de operación, inversión de capital y continuidad de las minas.

    - Permisos, desarrollo de proyectos y disponibilidad de recursos explotables.


    Los datos disponibles no permiten desglosar cuánto de la mejora financiera reciente
    se debe a precios, producción, mezcla o costes.


    **Posición competitiva y moat**


    El análisis AOIF caracteriza a Newmont como un líder competitivo y atribuye su
    ventaja a escala global, una cartera diversificada de minas y jurisdicciones,
    experiencia operativa y recursos minerales. La amplitud del moat se califica como
    **estrecha**: estos atributos pueden contribuir a la resiliencia y a la eficiencia,
    pero no eliminan la exposición a los precios de los metales, a la geología ni
    a los riesgos de ejecución.


    La dinámica competitiva está condicionada por la geología, los permisos y los
    largos plazos de desarrollo. Otros productores pertinentes para comparar posición,
    costes y exposición a metales incluyen [[AEM]], [[BHP]], [[FCX]] y [[SCCO]].


    ## 3. Perfil Financiero


    Las cifras de Stock Analysis corresponden al TTM terminado el **30 de septiembre
    de 2026**, salvo indicación distinta. La moneda se presenta como USD en los datos
    de escenario; la escala de las cifras financieras no está especificada en el material
    recibido.


    | Métrica | Valor | Periodo / referencia | Fuente y observaciones |

    |---|---:|---|---|

    | Ingresos | 26.606 | TTM al 30-09-2026 | Stock Analysis, citado en el paquete
    de investigación |

    | Margen bruto | 68,04% | TTM al 30-09-2026 | Stock Analysis |

    | Flujo de caja libre (FCF) | 10.074 | TTM al 30-09-2026 | Stock Analysis |

    | Caja e inversiones | 9.261 | Al 30-09-2026 | Stock Analysis |

    | FCF | 97 | FY 2023 | Stock Analysis, según el paquete |

    | FCF | 2.961 | FY 2024 | Stock Analysis, según el paquete |

    | FCF | 7.299 | FY 2025 | Stock Analysis, según el paquete |

    | Current ratio | 2,45 | Al 30-09-2026 | Stock Analysis, [estadísticas de NEM](https://stockanalysis.com/stocks/NEM/statistics/)
    |

    | Crecimiento de ingresos | 23,73% | Periodo no especificado | Métrica suministrada
    por AOIF; definición y fuente por verificar |

    | Margen operativo | 55,56% | Periodo no especificado | Métrica suministrada por
    AOIF; definición y fuente por verificar |

    | ROIC | 29,38% | Periodo no especificado | Métrica suministrada por AOIF; definición
    y fuente por verificar |

    | PER | 11,02 | Referencia no especificada | Métrica suministrada por AOIF; fecha
    y metodología por verificar |

    | EV/EBITDA | 5,36 | Referencia no especificada | Métrica suministrada por AOIF;
    fecha y metodología por verificar |


    **Lectura financiera:** los datos agregados son compatibles con una mejora marcada
    de ingresos, margen bruto y generación de caja. Sin embargo, la serie anual de
    FCF muestra variabilidad, y el TTM no debe compararse directamente con ejercicios
    fiscales completos como si fueran periodos equivalentes. No se proporcionan deuda
    total, deuda neta, capex ni flujo de caja operativo suficientes para evaluar en
    detalle la estructura de capital y la conversión de beneficios en caja.


    El paquete no permite calcular de forma fiable el crecimiento de ingresos a tres
    años ni el crecimiento comparable de FCF. Tampoco hay una serie comparable de
    acciones diluidas para evaluar dilución. El current ratio reportado no está por
    debajo del umbral de 0,5 utilizado en el análisis.


    ## 4. Management y Gobierno Corporativo


    El análisis AOIF califica la calidad de la dirección como **buena**, la asignación
    de capital como **neutral** y el alineamiento de insiders como **moderado**. Estas
    son valoraciones cualitativas del análisis suministrado; no se acompañan de métricas
    detalladas, historial de decisiones de inversión ni composición del consejo.


    No se aportan datos sobre remuneración ejecutiva, propiedad accionarial de insiders,
    composición o independencia del board, ni resultados específicos de la asignación
    de capital. La evaluación del gobierno corporativo queda, por tanto, incompleta
    y requiere verificación documental antes de extraer conclusiones firmes.


    ## 5. Tesis de Inversión


    **Caso alcista —tesis provisional**


    - Los datos agregados muestran una expansión financiera reciente: ingresos TTM
    de 26.606, margen bruto de 68,04% y FCF TTM de 10.074 al 30 de septiembre de 2026,
    según Stock Analysis.

    - Newmont combina exposición principal al oro con exposición al cobre y una cartera
    minera diversificada, lo que puede ampliar sus fuentes de producción frente a
    un productor concentrado en un solo activo o metal.

    - AOIF la describe como líder competitiva y destaca escala global, experiencia
    operativa y recursos minerales como fuentes potenciales de ventaja.

    - El precio de la acción registró una subida del 38,95% durante los 12 meses terminados
    el 26 de octubre de 2026. Este dato refleja impulso de mercado, pero no demuestra
    por sí mismo infravaloración ni sostenibilidad de resultados.

    - La serie de FCF reportada pasa de 97 en FY 2023 a 2.961 en FY 2024 y 7.299 en
    FY 2025; el FCF TTM fue 10.074 al 30 de septiembre de 2026. La mejora es significativa
    en los datos agregados, aunque sus causas y persistencia no están establecidas.


    **Estado de la tesis:** investigación requerida. La evidencia respalda una mejora
    financiera reciente, pero no permite determinar si deriva de condiciones favorables
    de precios, de mayor producción, de una mejor mezcla, de costes menores o de factores
    transitorios.


    ## 6. Riesgos y Contra-Tesis


    **Caso bajista**


    - **Ciclo de metales:** una caída del precio del oro u otros metales puede reducir
    ingresos y márgenes. AOIF califica este riesgo como de impacto alto y probabilidad
    media. Es un riesgo compartido con productores como [[AEM]], [[BHP]], [[FCX]]
    y [[SCCO]].

    - **Riesgo operativo:** interrupciones, accidentes, menores leyes del mineral
    o problemas de procesamiento pueden afectar producción y costes. AOIF lo clasifica
    como de impacto alto y probabilidad media.

    - **Sostenibilidad del FCF:** la variabilidad observada entre FY 2023, FY 2024
    y FY 2025 hace posible que la generación reciente de caja se revierta.

    - **Falta de atribución:** no hay datos operativos suficientes sobre producción,
    costes, reservas o precios realizados para explicar la expansión de ingresos y
    márgenes.

    - **Intensidad de capital:** los largos ciclos de desarrollo y las necesidades
    de reinversión pueden limitar la caja disponible, pero no se proporcionan cifras
    de capex o retornos por proyecto para cuantificarlo.

    - **Riesgo de mercado:** la acción tuvo volatilidad de 41,49% y un drawdown de
    19,15% durante el periodo de 12 meses terminado el 26 de octubre de 2026, según
    el paquete de investigación.


    **Falsadores de la tesis**


    1. Periodos posteriores muestran contracción persistente de ingresos, margen bruto
    o FCF frente al TTM terminado el 30 de septiembre de 2026.

    2. Datos verificables de producción, costes o reservas contradicen la interpretación
    de que la mejora financiera puede sostenerse.

    3. La evolución del balance o de las necesidades de reinversión reduce materialmente
    la caja disponible, una vez que se obtengan datos comparables de deuda, capex
    y flujo operativo.


    ## 7. Catalizadores y Timeline


    No se proporcionan fechas confirmadas para resultados, decisiones de proyectos
    u otros eventos corporativos. Los catalizadores siguientes son **hitos de seguimiento**,
    no eventos con calendario anunciado.


    | Horizonte / fecha | Hito a vigilar | Impacto potencial |

    |---|---|---|

    | Próximos resultados publicados; fecha no disponible | Confirmación de la evolución
    de ingresos y margen bruto frente al TTM al 30-09-2026 | Positivo si continúa
    la mejora; negativo si se observa contracción persistente |

    | Próximos resultados publicados; fecha no disponible | Actualización comparable
    de FCF, flujo operativo, capex, caja y deuda neta | Permitiría evaluar conversión
    de resultados en caja y resiliencia del balance |

    | Próximas divulgaciones operativas; fecha no disponible | Producción, ley del
    mineral, costes por onza, recuperación y desempeño por operación | Aclararía los
    impulsores de resultados y el riesgo de ejecución |

    | Próximas actualizaciones de activos; fecha no disponible | Reservas, vida de
    mina, permisos y avance de proyectos | Podría modificar la perspectiva de producción
    y reinversión a largo plazo |


    ## 8. Marco de Valoración


    La valoración apropiada para una minera debe considerar beneficios y flujos de
    caja normalizados a través del ciclo, junto con producción, costes unitarios,
    reservas, capex de mantenimiento y desarrollo, balance y sensibilidad a los precios
    de los metales. Con la evidencia disponible no puede estimarse con rigor un valor
    intrínseco: faltan, entre otros, deuda neta, flujo de caja normalizado, reinversión
    requerida y supuestos operativos verificables.


    El paquete AOIF reporta PER de 11,02, EV/EBITDA de 5,36 y FCF yield de 0, pero
    no especifica fecha de referencia ni metodología para estas métricas. Deben tratarse
    como cifras indicativas no verificadas, no como una conclusión de valoración.
    AOIF también califica el margen de seguridad como insuficiente y señala que el
    valor intrínseco no es estimable con los datos disponibles.


    Como referencia de mercado, el paquete DDD indica un precio de **USD 109,26 al
    26 de octubre de 2026** y un objetivo medio de analistas de **USD 134,57**. El
    análisis presenta escenarios de **USD 70** (bajista) y **USD 165** (alcista),
    anclados en extremos observados de objetivos de analistas; no son estimaciones
    independientes de valor intrínseco ni una valoración propia.


    | Escenario de referencia | Precio indicado | Interpretación |

    |---|---:|---|

    | Bajista | USD 70 | Ancla baja observada del rango de objetivos de analistas
    |

    | Central de referencia | USD 134,57 | Objetivo medio de analistas reportado en
    el paquete |

    | Alcista | USD 165 | Ancla alta observada del rango de objetivos de analistas
    |


    **Sensibilidades principales que requieren modelización:** precio del oro y del
    cobre, producción por activo, ley y recuperación, costes operativos, capex, reservas
    y deuda neta. Sin esos inputs no es posible cuantificar una sensibilidad de valor
    intrínseco ni concluir que exista un error de valoración.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué proporción de la mejora de ingresos y márgenes procede de precios de los
    metales, volúmenes, mezcla, costes u otros factores?

    2. ¿Cuáles son la producción, la ley del mineral, la recuperación y los costes
    unitarios por mina, y cómo han evolucionado?

    3. ¿Cuál es el flujo de caja operativo, el capex de mantenimiento y desarrollo,
    y la conversión de beneficios en FCF?

    4. ¿Cuál es la deuda total y neta, y cómo ha evolucionado junto con la caja e
    inversiones?

    5. ¿Qué reservas y recursos respaldan la producción futura y cuál es la vida económica
    de los activos?

    6. ¿Qué retornos obtienen los proyectos de desarrollo y qué necesidades de reinversión
    requieren?

    7. ¿Qué periodos, definiciones y fuentes sustentan las métricas de crecimiento
    de ingresos, margen operativo y ROIC reportadas por AOIF?

    8. ¿Cuál es la metodología y la fecha de referencia de PER, EV/EBITDA y FCF yield?

    9. ¿Cómo se determinan la remuneración ejecutiva y los incentivos, qué participación
    tienen los insiders y cuál es la composición del consejo?

    10. ¿Qué datos comparables permiten contrastar la posición de costes y la calidad
    de activos con [[AEM]], [[BHP]], [[FCX]] y [[SCCO]]?


