    **Fuentes:** Stock Analysis, [financials](https://stockanalysis.com/stocks/nem/financials/)
    y [statistics](https://stockanalysis.com/stocks/NEM/statistics/); observaciones
    financieras hasta el 2026-09-30 y FY 2025. Los datos de AOIF se entregaron sin
    fecha ni referencias explícitas para cada métrica.


    El FCF y el margen bruto reportados para el TTM terminado el 2026-09-30 son superiores
    a sus referencias FY 2025 indicadas en el paquete. Esto es compatible con una
    mayor generación de caja y margen en ese período, pero no permite atribuir el
    cambio a precios, producción, costos, adquisiciones u otros factores, ni demostrar
    que sea persistente. El paquete no proporciona cifras verificables de flujo de
    caja operativo, capex de sostenimiento y crecimiento o conversión de FCF.


    ## 4. Management y Gobierno Corporativo


    El análisis AOIF califica la calidad del management como **buena**, la asignación
    de capital como **neutral** y el alineamiento de insiders como **moderado**. No
    se incluyen nombres de directivos, evidencia sobre remuneraciones o incentivos,
    porcentaje de propiedad interna ni información sobre composición, independencia
    o experiencia del board. Estas valoraciones son, por tanto, conclusiones preliminares
    del análisis y requieren respaldo documental antes de utilizarlas como hechos
    confirmados. [AOIF, sin fecha indicada]


    ## 5. Tesis de Inversión


    **Caso alcista — hipótesis sujeta a verificación:**


    - Newmont combina producción de oro con exposición a otros metales y cuenta, según
    AOIF, con escala, experiencia operativa y una cartera de activos. Estas características
    podrían respaldar continuidad operativa y capacidad para desarrollar proyectos,
    aunque el paquete no cuantifica sus ventajas frente a competidores.

    - Stock Analysis reporta FCF de 10,074 en el TTM al 2026-09-30, frente a 7,299
    en FY 2025, y un margen bruto de 68.04% frente a 63.24%, respectivamente. Si las
    cifras son comparables y los resultados se sostienen, podrían indicar una mejora
    en la generación de caja y rentabilidad bruta en el período observado. [Stock
    Analysis, [financials](https://stockanalysis.com/stocks/nem/financials/)]

    - La industria tiene plazos largos de exploración, permisos y desarrollo, lo que
    puede restringir la respuesta de la oferta. El efecto potencial para Newmont depende
    de la calidad y rentabilidad de sus propios activos y no queda cuantificado en
    la evidencia disponible. [AOIF, sin fecha indicada]


    **Límite de la tesis:** el paquete no demuestra una ventaja competitiva duradera,
    una brecha entre expectativas del mercado y fundamentales, ni la persistencia
    de los resultados financieros reportados. La clasificación de oportunidad como
    “Investigación requerida” y el discovery score de 68.39 del Research Intake Package
    (2026-10-26) son señales de priorización investigativa, no evidencia de una oportunidad
    de inversión validada.


    ## 6. Riesgos y Contra-Tesis


    - **Precios de commodities:** una caída del oro o de los metales base reduciría
    ingresos, márgenes y el valor económico de las reservas. AOIF califica el impacto
    potencial como alto y la probabilidad como media. [AOIF, sin fecha indicada]

    - **Costos y operación:** aumentos en energía, materiales, mano de obra o servicios,
    o menor ley del mineral y problemas de recuperación, podrían deteriorar resultados.
    AOIF califica el impacto y la probabilidad como altos. [AOIF, sin fecha indicada]

    - **Ejecución y capital:** la exploración, el desarrollo, los permisos y la operación
    minera exigen inversión de largo plazo y están sujetos a riesgos de ejecución.
    El paquete no presenta planes de inversión ni retornos por proyecto.

    - **Riesgo geográfico:** existe exposición a varias jurisdicciones, pero no se
    cuantifican los riesgos específicos por país ni la contribución de cada operación.
    [Descripción del modelo de negocio, resumen financiero, 2026-11-20]

    - **Calidad de la evidencia financiera:** las métricas de crecimiento, ROIC y
    valoración incluidas por AOIF no vienen acompañadas de períodos, definiciones
    o fuentes específicas. Además, no es posible calcular deuda neta/EBITDA con las
    bases disponibles.

    - **Falta de validación de valoración:** el consenso de analistas reportado es
    USD 134.57, con un rango de USD 70–165; la cotización indicada fue USD 109.26
    al 2026-10-26. Son referencias observadas, no una estimación de valor intrínseco.
    [Resumen financiero, consenso observado el 2026-11-20; cotización al 2026-10-26]


    **Falsadores de la tesis que deben monitorearse:**


    1. FCF futuro persistentemente inferior a los 10,074 reportados para el TTM terminado
    el 2026-09-30, sin una explicación temporal verificable. [Stock Analysis, [financials](https://stockanalysis.com/stocks/nem/financials/)]

    2. Deterioro sostenido del margen bruto frente al 68.04% reportado para ese TTM.

    3. Evidencia de que el rendimiento de la cartera de activos no cubre los costos
    y necesidades de inversión, una vez que se obtengan datos comparables por operación.


    Los dos primeros son umbrales de seguimiento basados en observaciones reportadas,
    no pronósticos ni niveles intrínsecos.


    ## 7. Catalizadores y Timeline


    | Fecha / horizonte | Evento o indicador | Impacto potencial | Evidencia y limitaciones
    |

    |---|---|---|---|

    | TTM terminado el 2026-09-30 | FCF reportado de 10,074 y margen bruto de 68.04%
    | Positivo si se confirma la comparabilidad y la persistencia; negativo si los
    períodos posteriores muestran deterioro sostenido. | Datos históricos de Stock
    Analysis, [financials](https://stockanalysis.com/stocks/nem/financials/); no se
    proporcionan causas desglosadas. |

    | Próximos resultados, fecha no aportada | Actualización de FCF, márgenes, producción,
    costos y capex | Podría confirmar o debilitar la interpretación de mejora financiera.
    | El paquete no identifica una fecha de publicación ni cifras futuras. |

    | Próximas actualizaciones operativas, fecha no aportada | Evidencia de ejecución
    por activo, producción, costos y retornos de inversión | Podría mejorar la evaluación
    del negocio y de la asignación de capital, o revelar deterioro operativo. | No
    se aportan hitos corporativos concretos ni planes por activo. |


    El consenso observado y la cotización del 2026-10-26 no se consideran catalizadores:
    son referencias de mercado, no eventos futuros identificados. No hay base en el
    material para asignar fechas más específicas.


    ## 8. Marco de Valoración


    Una valoración de Newmont debería separar los activos y proyectos mineros y contrastar
    sus flujos de caja con distintos supuestos de precio de metales, producción, leyes,
    recuperación, costos operativos, impuestos, capex, permisos y vida de mina. También
    convendría contrastar el resultado con métricas de mercado como EV/EBITDA y FCF
    yield, usando fecha, unidades, deuda neta y acciones plenamente diluidas verificadas.


    El AOIF reporta PER de 11.23 y EV/EBITDA de 5.59, pero no identifica fecha, inputs
    ni metodología; también reporta FCF yield de 0 sin explicar su cálculo. Por ello,
    esas cifras no permiten concluir que la acción esté barata ni construir una estimación
    defendible de valor intrínseco. El AOIF califica el margen de seguridad como insuficiente
    y señala que el valor intrínseco no es determinable con precisión a partir de
    la información disponible.


    El consenso de USD 134.57 (rango USD 70–165) y la cotización de USD 109.26 al
    2026-10-26 deben tratarse únicamente como referencias observadas. La hipótesis
    de error de valoración **no está validada**: faltan datos verificables de producción,
    costos, precios realizados, deuda neta, acciones y método de valoración. [Resumen
    financiero, 2026-11-20; cotización al 2026-10-26]


    **Sensibilidad que debe evaluarse cuando se obtengan los datos:** escenarios de
    precios de oro y metales base; producción y leyes; costos energéticos y de insumos;
    capex; retrasos de desarrollo; y supuestos de vida de mina. El material actual
    no permite asignar valores o probabilidades a esos escenarios.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué proporción de los cambios en FCF y márgenes proviene de precios realizados,
    producción, costos, adquisiciones u otros factores?

    2. ¿Cuál es la producción, el costo por unidad, la ley del mineral, la recuperación
    y la contribución al flujo de caja de cada activo?

    3. ¿Cuáles son los planes de inversión y producción por mina o proyecto, y qué
    retornos se esperan para el capex de sostenimiento y de crecimiento?

