  clientes de varios sectores. No obstante, la información disponible es insuficiente
  para verificar la intensidad y durabilidad del moat, la calidad del balance, la
  asignación de capital o la valoración relativa. Los datos financieros aportados
  muestran FCF TTM de USD 1.870 millones hasta 2026-09-30, crecimiento de ingresos
  reportado de 12,7% y margen operativo reportado de 19,217% para el periodo que termina
