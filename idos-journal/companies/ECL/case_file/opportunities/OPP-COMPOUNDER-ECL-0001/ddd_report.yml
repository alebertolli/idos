prompt_inputs:
  business_model: 'Ecolab Inc. provides water, hygiene, and infection prevention solutions
    and services in the United States and internationally. The company operates through
    four segments: Global Water, Global Institutional & Specialty, Global Pest Elimination,
    and Global Life Sciences. The Global Water segment offers water treatment and
    process applications, and cleaning and sanitizing solutions to manufacturing,
    food and beverage processing, transportation, chemical, primary metals and mining,
    power generation, global refining, petrochemical, pulp and paper industries. The
    Global Institutional & Specialty segment provides cleaning and sanitizing products
    to the foodservice, healthcare, hospitality, lodging, government, education and
    retail industries. The Global Pest Elimination segment provides pest elimination
    services to detect, prevent, and eliminate pests comprising rodents and insects
    in full-service and quick-service restaurants, food and beverage processors, hotels,
    grocery operations, and other commercial segments, including education, life sciences,
    and healthcare. The Global Life Sciences segment provides cleaning and contamination
    control solutions to pharmaceutical and personal care manufacturers. It offers
    its products under the Ecolab, Kay, Purolite, and Bioquell brand names. The company
    sells its products through field sales and corporate account personnel, distributors,
    and dealers. Ecolab Inc. was founded in 1923 and is headquartered in Saint Paul,
    Minnesota.'
