    o divisas. |

    | Margen bruto TTM de 44,04%, frente a 40,39% en FY 2023 | 2026-09-30 y FY 2023
    | La expansión, si se confirma como sostenible, podría apoyar la rentabilidad.
    | No se identifican causas ni se demuestra su persistencia. |

    | Precio observado de USD 303,005 | 2026-10-30 | Referencia de mercado para un
    análisis posterior. | No constituye por sí solo un catalizador ni una valoración.
    |

    | Consenso de precio objetivo de USD 342,95, con rango de USD 310–385 | 2026-11-20
