    Fuente secundaria para las cifras señaladas: [StockAnalysis — ECL Statistics](https://stockanalysis.com/stocks/ECL/statistics/),
    citada en el paquete DDD. AOIF no especifica fuentes, fechas ni definiciones para
    crecimiento de ingresos, margen operativo, ROIC y métricas de valoración; deben
    verificarse antes de utilizarlas en un modelo.


    DDD indica que el FCF TTM positivo constata generación de caja reportada en ese
    período, pero por sí solo no establece su calidad, recurrencia ni conversión respecto
    del beneficio neto. No se puede calcular o validar con el material disponible
    el crecimiento de ingresos a tres años, el crecimiento de FCF, el apalancamiento
    neto ni la dilución.


    ## 4. Management y Gobierno Corporativo


    La evaluación AOIF califica la calidad del management como **buena**, la asignación
    de capital como **creadora de valor** y el alineamiento de insiders como **moderado**.
    Son calificaciones del análisis suministrado, sin evidencia detallada que permita
    comprobarlas.


    No se proporcionan nombres o trayectoria del equipo directivo, composición del
    board, propiedad accionaria de insiders, estructura de remuneración ni métricas
    de incentivos. Tampoco se aportan ejemplos cuantificados de retornos sobre adquisiciones,
    recompras, dividendos u otras decisiones de asignación de capital. La evaluación
    de gobierno corporativo queda, por tanto, incompleta.


    ## 5. Tesis de Inversión


    **Caso alcista — hipótesis respaldadas parcialmente por los datos disponibles**


    - **Necesidades operativas recurrentes:** Ecolab proporciona productos y servicios
    para tratamiento de agua, higiene, limpieza y prevención de contaminación. La
    recurrencia puede favorecer relaciones duraderas con clientes, aunque el paquete
    no presenta datos de retención o ingresos recurrentes.

    - **Integración de productos y servicio técnico:** La combinación de formulaciones,
    equipos y conocimiento aplicado en las instalaciones podría generar costes operativos
    de cambio y apoyar relaciones de largo plazo. Este mecanismo es una explicación
    propuesta por AOIF; no se cuantifica su efecto sobre precios, retención o rentabilidad.

    - **Evolución reciente de ingresos y margen bruto:** DDD reporta ingresos TTM
    de USD 17.372 millones al 2026-09-30 y un margen bruto TTM de 44,04%, frente a
    40,39% en FY 2023. Estos datos son compatibles con expansión reciente, pero no
    identifican sus motores ni demuestran que sea sostenible.

    - **Generación de caja:** El FCF TTM reportado fue positivo. Se desconoce su importe
    y la conversión de beneficios en caja, por lo que no basta para inferir capacidad
    de financiación o retorno al accionista.


    La tesis depende de confirmar el crecimiento orgánico por segmento, la persistencia
    de márgenes, la conversión a caja y la rentabilidad de la reinversión. La evidencia
    disponible no permite concluir que exista una oportunidad de valoración atractiva.


    ## 6. Riesgos y Contra-Tesis


    - **Costes de insumos y operación:** Un aumento de los costes de materias primas,
    energía, transporte o mano de obra podría reducir márgenes si no se traslada plenamente
    a precios. AOIF califica este riesgo como de impacto y probabilidad medios.

    - **Menor actividad de los clientes:** Una desaceleración de clientes industriales,
    comerciales o de hostelería podría afectar volúmenes y demanda de servicios. AOIF
    califica este riesgo como de impacto y probabilidad medios.

    - **Aumento de deuda reportada:** La deuda pasó de USD 8.998 millones al cierre
    de FY 2025 a USD 13.770 millones al 2026-09-30, según StockAnalysis citado en
    DDD. El paquete no explica la variación ni presenta su desglose, vencimientos
    o efecto sobre el coste financiero.

    - **Sostenibilidad de márgenes:** El aumento del margen bruto reportado no tiene
    una atribución causal en el material disponible. Un retroceso sostenido debilitaría
    la tesis de expansión operativa.

    - **Calidad del FCF y reinversión:** No se proporcionan datos suficientes de flujo
    de caja operativo, capex o conversión de beneficios para evaluar la recurrencia
    del FCF y las necesidades de reinversión.

    - **Valoración y expectativas:** AOIF reporta múltiplos elevados, pero no documenta
    fecha, precio de referencia ni metodología. Sin esas referencias no se puede juzgar
    la magnitud del riesgo de valoración.

    - **Competencia y retención:** No hay datos verificables sobre pérdida de clientes,
    participación de mercado, presión competitiva o evolución de precios.


    **Triggers de falsación**

    1. Datos comparables que muestren deterioro sostenido de ingresos o FCF frente
    a la historia reportada.

    2. Evidencia verificable de caída persistente de márgenes.

    3. Evidencia de pérdida de clientes o debilitamiento de la posición competitiva.

    4. Confirmación de que el crecimiento depende principalmente de factores no recurrentes,
    sin mejora orgánica subyacente.


    ## 7. Catalizadores y Timeline


    No se identifican eventos corporativos fechados en la evidencia suministrada.
    Las variaciones financieras siguientes son observaciones reportadas, no catalizadores
    anunciados:


