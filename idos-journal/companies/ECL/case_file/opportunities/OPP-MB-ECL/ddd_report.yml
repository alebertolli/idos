    ## 8. Marco de Valoración


    La valoración no puede considerarse validada con la evidencia disponible. DDD
    concluye que no se ha demostrado un error de valoración y que los datos son insuficientes
    para sostener una conclusión sobre retornos sobre capital, penetración de mercado
    o ventaja competitiva. AOIF indica que no es responsable estimar valor intrínseco
    sin precio y número de acciones de referencia, FCF normalizado, deuda neta y supuestos
    explícitos de crecimiento.


    ### Enfoques apropiados para la investigación


    1. **Flujo de caja descontado:** requiere normalizar el FCF, modelar crecimiento
    orgánico, márgenes, impuestos, capex y capital de trabajo, e incorporar deuda
    neta y un costo de capital sustentado.

    2. **Comparables de mercado:** PER y EV/EBITDA pueden servir como referencias
    si se confirman sus fechas, definiciones y fuentes, y se comparan empresas con
    modelos y perfiles económicos pertinentes.

    3. **Valoración por escenarios:** conviene contrastar escenarios de crecimiento,
    margen y conversión a caja, evitando tratar el consenso como valor intrínseco.


    ### Supuestos y sensibilidades pendientes


    | Variable | Información necesaria |

    |---|---|

    | Crecimiento | Crecimiento orgánico y separación entre volumen, precio y mezcla;
    no disponibles en el paquete. |

    | Márgenes | Evolución histórica y proyecciones por segmento; no disponibles.
    |

    | FCF normalizado | Flujo operativo, capex, capital de trabajo y efectos no recurrentes;
    no disponibles en series comparables. |

    | Reinversión y retornos | Capex de mantenimiento y crecimiento, necesidades de
    capital y evolución del ROIC; no disponibles por segmento. |

    | Estructura de capital | Efectivo, deuda neta, vencimientos y costo de deuda;
    información incompleta. |

    | Múltiplos | Confirmación de fecha, fuente y metodología para PER 41,11, EV/EBITDA
    22,74 y FCF yield 0. |

    | Sensibilidad | Efecto sobre el valor estimado de cambios en crecimiento, márgenes,
    tasa de descuento y conversión a caja; no cuantificable con los datos actuales.
    |


    El precio de USD 303,005 al 2026-10-30 y el consenso de precio objetivo reportado
    al 2026-11-21 deben mantenerse como observaciones de mercado independientes de
    una valoración propia. No se infiere margen de seguridad a partir de ellos.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es el crecimiento orgánico esperado por la dirección y cómo se divide
    entre volumen, precio y mezcla?

    2. ¿Cómo se comparan las expectativas de crecimiento y márgenes con el consenso,
    y qué supuestos las explican?

    3. ¿Cuáles son los nombres, ventas, márgenes y necesidades de inversión de los
    cuatro segmentos mencionados?

    4. ¿Cómo han evolucionado el ROIC y la reinversión por segmento? ¿Qué parte del
    retorno depende del crecimiento y cuál de la rentabilidad existente?

    5. ¿Cuáles son las series comparables de ingresos, margen operativo, FCF, flujo
    de caja operativo y capex?

    6. ¿Qué explica el dato de cobertura de intereses reportado como 0? ¿Cuál es el
    EBIT, el gasto por intereses, la deuda neta y el calendario de vencimientos?

    7. ¿Cuál es la definición y el período de referencia del crecimiento de ingresos
    de 9,33%, el margen operativo de 18,54% y el ROIC de 12,24%?

    8. ¿Qué significan exactamente el PER de 41,11, el EV/EBITDA de 22,74 y el FCF
    yield de 0 reportados por AOIF? ¿Cuáles son sus fechas y fuentes?

    9. ¿Qué datos verificables existen sobre retención de clientes, renovaciones,
    pérdidas de contratos, cuotas de mercado y capacidad de trasladar costos?

    10. ¿Cómo se comparan la propiedad de insiders, la remuneración ejecutiva y la
    composición del board con los intereses de los accionistas?

    11. ¿Cuál es una estimación de valor intrínseco basada en FCF normalizado, deuda
    neta, número de acciones y supuestos explícitos?

    12. ¿Qué fechas de resultados y otros hitos corporativos permitirán revisar las
    hipótesis de crecimiento, márgenes y generación de caja?


    **Estado de la investigación:** evidencia fundamental incompleta. La decisión
    de inversión queda pendiente de verificar series financieras, fuentes y supuestos
