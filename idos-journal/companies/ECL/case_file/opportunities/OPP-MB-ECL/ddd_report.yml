    |


    Fuentes financieras: [StockAnalysis — ECL Statistics](https://stockanalysis.com/stocks/ECL/statistics/),
    según DDD. Precio y objetivos corresponden a las observaciones indicadas en el
    paquete DDD; no se proporcionan enlaces adicionales.


    ## 8. Marco de Valoración


    **Estado: valoración no concluyente; investigación requerida.** El paquete DDD
    no valida un error de valoración. El precio observado y los objetivos de analistas
    son referencias de mercado, no una estimación intrínseca independiente. Faltan
    supuestos financieros, metodología y horizonte de escenario.


    AOIF reporta un PER de 41,11x y un EV/EBITDA de 22,74x, pero no aporta fecha,
    precio de referencia ni fuente verificable. También reporta FCF yield de 0 y margen
    de seguridad insuficiente; el propio análisis señala que no puede estimar el valor
    intrínseco con rigor debido a la falta de precio y fecha de referencia, serie
    de FCF, deuda neta, supuestos de crecimiento y tasa de descuento. Estas cifras
    no deben tratarse como una valoración validada.


    **Metodología apropiada para una evaluación futura**

    - Contrastar una valoración por flujo de caja descontado con múltiplos comparables,
    una vez verificados los estados financieros, deuda neta, acciones diluidas y fechas
    de referencia.

    - Proyectar ingresos y márgenes por segmento, distinguiendo crecimiento orgánico,
    precio, volumen, adquisiciones y divisas.

    - Modelar FCF a partir de flujo operativo, capex, capital de trabajo e impuestos;
    evaluar su conversión desde el beneficio y las necesidades de reinversión.

    - Incluir sensibilidad a crecimiento, márgenes, reinversión, tasa de descuento
    y nivel de deuda. No es posible especificar rangos numéricos defendibles con la
    evidencia actual.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es el crecimiento orgánico por segmento y qué parte corresponde a precio,
    volumen, adquisiciones y divisas?

    2. ¿Qué explicaciones sostienen la expansión reportada del margen bruto y cuánto
    depende de factores temporales?

    3. ¿Cuál es la serie comparable de flujo de caja operativo, capex y FCF? ¿Cómo
    se compara el FCF con el beneficio neto?

    4. ¿Cuál es el ROIC verificable por período, cómo evoluciona y qué reinversión
    requiere el negocio?

    5. ¿A qué se debe el aumento de deuda reportado entre FY 2025 y 2026-09-30? ¿Cuál
    es la deuda neta, el calendario de vencimientos y el coste financiero?

    6. ¿Cómo evolucionan retención de clientes, precios, volúmenes, participación
    de mercado y competencia por segmento?

    7. ¿Qué evidencia permite comprobar los costes de cambio, la amplitud del moat
    y la posición de liderazgo atribuidos a Ecolab?

    8. ¿Cuál es la dilución interanual de acciones y cómo se alinean la remuneración
    de ejecutivos y la propiedad de insiders con los accionistas?

    9. ¿Cuáles son la composición del board y las métricas de asignación de capital
    que sustentan las valoraciones de AOIF?

    10. ¿Qué fecha, fuente y metodología sustentan las métricas de valoración reportadas
    por AOIF y las estimaciones de analistas citadas en DDD?


    **Clasificación actual:** investigación requerida; evidencia insuficiente para
