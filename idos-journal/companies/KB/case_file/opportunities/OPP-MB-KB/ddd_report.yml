    3. ¿Cuáles son el ROE, ROA, margen neto de intereses, coste del riesgo y coste
    de capital por período?

    4. ¿Cómo evolucionan los préstamos morosos, las provisiones, la exposición inmobiliaria
    y el endeudamiento de los hogares?

    5. ¿Cuáles son el capital regulatorio y los requisitos aplicables, y cómo se comparan
    con la posición reportada por la compañía?

    6. ¿Cuál es el desglose de ingresos, beneficios y activos por segmento y geografía?

    7. ¿Cuál es la historia comparable de acciones diluidas y qué evidencia existe
    sobre recompras, dividendos o compensación basada en acciones?

    8. ¿Qué datos respaldan la posición competitiva de “líder” y las posibles ventajas
    de escala, marca y base de depósitos?

    9. ¿Qué evidencia permite evaluar resultados del management, gobierno corporativo,
    remuneración, propiedad de insiders y asignación de capital?

    10. ¿Cuáles son el próximo calendario de resultados y las fuentes primarias para
    validar las series financieras?

    11. ¿Qué supuestos y metodología sustentan el objetivo medio de analistas citado,
    y existe un rango bajo/alto válido?

    12. ¿Qué métricas específicas deberían sustituir al FCF, EBITDA y current ratio
    convencional para analizar adecuadamente esta entidad financiera?


