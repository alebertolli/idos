  inferencias_llm:
  - El crecimiento de ingresos y FCF, junto con margen bruto alto, es consistente
    con escalabilidad, pero no demuestra por sí solo retornos atractivos sobre capital.
  - La diferencia entre EBIT negativo y FCF positivo justifica investigar los componentes
    de caja y la conversión a rentabilidad.
