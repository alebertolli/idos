prompt_inputs:
  business_model: CrowdStrike Holdings, Inc. provides cybersecurity solutions in the
    United States and internationally. Its unified platform provides cloud-delivered
    protection of endpoints, cloud workloads, identity, and data through a software
    as a service (SaaS) subscription-based model. The company offers corporate endpoint
    and cloud workload security, managed security, security and vulnerability management,
    IT operations management, identity protection, threat intelligence, data protection,
    SaaS security posture management, and AI powered workflow automation, and securing
    generative AI workload services, as well as security orchestration, automation,
    and response; and security information and event management, and log management
    services. It primarily sells subscriptions to its Falcon platform and cloud modules.
    The company has a strategic alliance with Cognizant Technology Solutions Corporation
    to help enterprises secure artificial intelligence across its lifecycle, from
    the AI agents and models to the foundational infrastructure that supports the
    entire AI ecosystem. The company was incorporated in 2011 and is headquartered
    in Austin, Texas.
