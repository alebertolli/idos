resumen_ejecutivo: Astera Labs es un proveedor de soluciones de conectividad de alta
  velocidad para centros de datos, con un modelo de negocio que combina hardware y
  software (COSMOS). Presenta un crecimiento de ingresos explosivo, márgenes operativos
  sólidos y ROIC superior al costo de capital, pero su valoración es muy alta y está
  expuesta a riesgos de cadena de suministro y concentración de clientes. La ausencia
  de deuda y la fuerte rentabilidad son puntos positivos, mientras que la corta trayectoria
  del CEO y la falta de participación insider generan incertidumbre de gobierno. Los
  catalizadores clave son la obtención de contratos CXL, el lanzamiento de COSMOS 2.0
  y posibles adquisiciones de IP. La valoración actual parece ligeramente sobrevalorada
  frente a los fundamentos, aunque la alta expectativa de crecimiento mantiene una
  brecha con el consenso.
