    ethernet smart cable modules for cloud and AI infrastructure; CXL memory connectivity
    controllers; and smart fabric switches. The company serves hyperscalers and system
    original equipment manufacturers. Astera Labs, Inc. was incorporated in 2017 and
    is based in San Jose, California.
