resumen_ejecutivo: Astera Labs es un proveedor de semiconductores de conectividad
  de alta velocidad para infraestructura cloud y AI, con una plataforma integrada
  de hardware y software (COSMOS). Presenta un crecimiento de ingresos cercano al
  100% YoY, márgenes operativos superiores al 20% y un ROIC excepcional del 63% sin
  deuda. El precio de la acción cotiza a 289 USD, mientras que el consenso de analistas
  sitúa el objetivo alrededor de 390 USD, lo que sugiere una oportunidad de upside
  del 35%+. El principal riesgo proviene de la exposición geopolítica en Taiwán y
  la competencia en el mercado de conectividad de datos. Un contrato con un hyperscaler
  o el lanzamiento exitoso de la próxima generación de productos CXL podrían catalizar
  una revaluación significativa.
