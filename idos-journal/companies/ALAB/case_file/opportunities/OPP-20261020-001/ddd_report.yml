  de alta velocidad para infraestructura de nube y AI, con un modelo de negocio basado
  en hardware y software integrado (COSMOS). Presenta un crecimiento de ingresos casi
  del 100% YoY, márgenes operativos superiores al 20% y un ROIC del 63% sin deuda.
  El precio de mercado está 26% por debajo del objetivo promedio de los analistas,
