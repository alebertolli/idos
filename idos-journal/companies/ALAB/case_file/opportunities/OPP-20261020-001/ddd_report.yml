    \ Medio | Medio | AOIF |\n| Cambios regulatorios en exportación de tecnología\
    \ avanzada (EE. UU./Taiwán) | 10 % | Alto | Largo | AOIF |\n\n---\n\n## 8. Marco\
    \ de Valoración  \n\n### 8.1 Metodología  \n1. **Valoración por múltiplos** – EV/Revenue\
    \ implícito ≈ 8× (actual) vs. promedio sectorial ≈ 5×.  \n2. **DCF** – Flujo de\
