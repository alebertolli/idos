    \ | 20 % | 150 |\n| 30 % | 22 % | 210 |\n| 40 % | 25 % | 280 |\n\n> **Interpretación:**\
    \ Un crecimiento sostenido > 30 % y márgenes > 22 % llevarían la valoración a\
    \ rangos cercanos al consenso (≈ 390).  \n\n### 8.3 Comparación con peers  \n\n\
    | Compañía | EV/Revenue | ROIC | Comentario |\n|---|---|---|---|\n| [[Broadcom]]\
