  business_model: Astera Labs, Inc. designs, manufactures, and sells semiconductor-based
    connectivity solutions for cloud and AI infrastructure in Taiwan and the United
    States. It offers an intelligent connectivity platform, comprised of semiconductor-based,
    high-speed, mixed-signal connectivity products that integrate a matrix of microcontrollers
    and sensors, and COSMOS. The company provides COSMOS software suite, a connectivity
    system management and optimization software that enables management and optimization
    of resources for large fleets at cloud-scale via link, fleet, and RAS management
    capabilities. In addition, it offers PCIe/CXL smart DSP retimers and cable modules;
    ethernet smart cable modules for cloud and AI infrastructure; CXL memory connectivity
    controllers; and smart fabric switches. The company serves hyperscalers and system
    original equipment manufacturers. Astera Labs, Inc. was incorporated in 2017 and
    is based in San Jose, California.
