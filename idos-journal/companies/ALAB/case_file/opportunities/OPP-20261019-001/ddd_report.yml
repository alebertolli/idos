    \ no positiva; riesgo de necesidad de financiamiento |\n| **Cash & Equivalents**\
    \ | **Dato no disponible** | Información pendiente de investigación |\n| **Insider\
    \ ownership** | **Dato no disponible** | Información pendiente de investigación\
    \ |\n\n### 3.2 Tendencias  \n\n- **Ingresos:** Crecimiento > 100 % YoY impulsado\
