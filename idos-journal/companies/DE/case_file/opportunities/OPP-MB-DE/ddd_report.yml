  existing_wiki: "# DE — Deere & Company\n\n> **Estado de la tesis:** provisional\
    \ y activa; la evidencia disponible no confirma una invalidación.  \n> **Clasificación\
    \ principal:** compañía industrial cíclica.  \n> **Evaluación actual:** investigación\
    \ requerida. Los datos recibidos no bastan para validar una tesis de rentabilidad\
    \ o valoración atractiva.  \n> **Fecha de corte de los datos de mercado citados:**\
    \ 20 de noviembre de 2026, salvo que se indique otra fecha.\n\n## 1. Visión General\
    \ de la Compañía\n\nDeere & Company diseña, fabrica y distribuye maquinaria para\
    \ agricultura, césped, construcción y actividades forestales. Complementa la venta\
    \ de equipos con repuestos, servicio y financiación para clientes y distribuidores.\n\
    \nSu cadena de valor combina desarrollo de productos, coordinación de proveedores\
    \ y fabricación con una red de concesionarios que ofrece distribución, mantenimiento\
    \ y disponibilidad de repuestos. La actividad de financiación —Financial Services—\
    \ amplía el modelo más allá de la venta de equipos, pero también hace necesario\
    \ analizar por separado la estructura financiera de esa unidad y la del negocio\
    \ industrial.\n\n**Productos descritos en la investigación:**\n\n- Tractores,\
    \ cosechadoras y equipos de siembra, labranza y cuidado de cultivos.\n- Tractores\
    \ compactos y utilitarios, cortacéspedes y equipos para césped y campos de golf.\n\
    - Maquinaria para construcción e industria forestal.\n\nLa exposición económica\
    \ es cíclica. La demanda puede variar con los ingresos agrícolas, los precios\
    \ de los cultivos, las condiciones de crédito y la inversión en construcción e\
    \ infraestructura. Entre las compañías relacionadas del sector, [[CAT]] ofrece\
    \ un punto de comparación para analizar maquinaria pesada y exposición a los ciclos\
    \ de construcción; la información disponible no permite una comparación financiera\
    \ directa.\n\n## 2. Modelo de Negocio y Posición Competitiva\n\n### Drivers de\
    \ ingresos\n\nLos principales motores descritos en la investigación son:\n\n1.\
    \ **Venta de maquinaria:** demanda de equipos agrícolas, de césped, construcción\
    \ y forestales.\n2. **Repuestos y servicio:** actividad asociada al parque instalado\
    \ y a la relación continuada con clientes y concesionarios.\n3. **Servicios financieros:**\
    \ financiación y arrendamiento a clientes, además de financiación mayorista a\
    \ distribuidores.\n\nEl paquete no incluye desglose de ingresos, pedidos, precios,\
    \ inventarios ni márgenes por segmento. Por ello, no es posible determinar qué\
    \ productos o regiones impulsan actualmente el crecimiento, ni separar la contribución\
    \ del negocio financiero de la fabricación y distribución de equipos.\n\n### Ventajas\
    \ competitivas descritas\n\nLa evaluación AOIF atribuye a Deere posibles ventajas\
    \ derivadas de:\n\n- Marca y escala.\n- Red de concesionarios, servicio y disponibilidad\
    \ de repuestos.\n- Costes de cambio y relaciones duraderas con los clientes.\n\
    - Financiación vinculada a la compra de equipos.\n- Tecnología de agricultura\
    \ de precisión.\n\nEstas características podrían favorecer la retención de clientes\
    \ y la competitividad del ecosistema de productos y servicios. Sin embargo, son\
    \ valoraciones cualitativas del análisis AOIF; los datos recibidos no incluyen\
    \ medidas de retención, participación de mercado, precios relativos, retornos\
    \ sobre capital o desempeño por segmento que permitan comprobar su magnitud y\
    \ durabilidad. El análisis DDD clasifica la calidad del negocio como **indeterminada**\
    \ por falta de evidencia financiera y segmentada suficiente.\n\n### Dinámica competitiva\n\
    \nLa industria se describe como intensiva en capital y cíclica, influida por el\
    \ ciclo agrícola, las tasas de interés, las condiciones de crédito y la inversión\
    \ en construcción. La digitalización y la tecnología de precisión pueden modificar\
    \ la competencia, pero el paquete no ofrece datos para medir su impacto económico\
    \ o la posición relativa de Deere. [[CAT]] es una referencia pertinente para estudiar\
    \ la exposición a ciclos de maquinaria y construcción, sin que ello implique equivalencia\
    \ entre sus negocios.\n\n## 3. Perfil Financiero\n\nLas cifras disponibles proceden\
    \ de contextos y periodos distintos. Algunas no tienen fecha o fuente identificada\
    \ en el paquete; deben tratarse como datos pendientes de verificación y no como\
    \ una serie financiera comparable.\n\n| Métrica | Dato reportado | Periodo o fecha\
    \ | Fuente y limitación |\n|---|---:|---|---|\n| Flujo de caja libre (FCF) | USD\
    \ 3.229 millones | TTM terminado el 2 de agosto de 2026 | [Stock Analysis — Statistics](https://stockanalysis.com/stocks/DE/statistics/).\
    \ |\n| FCF | USD 4.429 millones | FY 2024 | Misma fuente. El dato FY no es directamente\
    \ comparable con el TTM sin confirmar definición y periodo comparable. |\n| Margen\
    \ bruto | 25,18% | TTM terminado el 2 de agosto de 2026 | [Stock Analysis — Statistics](https://stockanalysis.com/stocks/DE/statistics/).\
    \ |\n| Margen bruto | 29,50% | FY 2024 | Misma fuente. La comparación con TTM\
    \ requiere cautela por diferencias de periodo. |\n| Deuda total | USD 64.578 millones\
    \ | 2 de agosto de 2026 | [Stock Analysis — Statistics](https://stockanalysis.com/stocks/DE/statistics/).\
    \ No hay desglose suficiente para separar deuda asociada a Financial Services\
    \ y al negocio de equipos. |\n| Efectivo e inversiones | USD 6.940 millones |\
    \ 2 de agosto de 2026 | Misma fuente. |\n| Current ratio | 2,13x | 2 de agosto\
    \ de 2026 | Misma fuente; no sustituye un análisis de liquidez por segmento. |\n\
    | Crecimiento de ingresos | 8,31% | Periodo no especificado | Métrica del análisis\
    \ AOIF; sin fuente, fecha ni periodo de comparación aportados. |\n| Margen operativo\
    \ | 13,52% | Periodo no especificado | Métrica del análisis AOIF; sin fuente ni\
    \ periodo. |\n| ROIC | 5,69% | Periodo no especificado | Métrica del análisis\
    \ AOIF; sin fuente, definición ni periodo. |\n| P/E | 37,28x | Periodo no especificado\
    \ | Métrica del análisis AOIF; falta fecha y base de beneficios. |\n| EV/EBITDA\
    \ | 27,39x | Periodo no especificado | Métrica del análisis AOIF; falta fecha\
    \ y definición de EBITDA. |\n| FCF yield | 0 | Periodo no especificado | Métrica\
    \ del análisis AOIF sin fórmula ni contexto; no debe interpretarse como rendimiento\
    \ verificable. |\n\nDDD señala que el FCF TTM reportado de USD 3.229 millones\
    \ es inferior al FCF de USD 4.429 millones de FY 2024 y que el margen bruto TTM\
    \ reportado es inferior al de FY 2024. No obstante, los periodos no son equivalentes:\
    \ la comparación requiere datos de periodos homogéneos y una conciliación de definiciones.\n\
    \nEl paquete también presenta un avance de precio de **46,325%** entre el 31 de\
    \ octubre de 2025 y el 30 de octubre de 2026. DDD reporta una cotización de **USD\
    \ 671,60** al 30 de octubre de 2026. El objetivo medio de analistas indicado fue\
    \ de **USD 694,01**, observado el 20 de noviembre de 2026, con un rango de **USD\
    \ 500–813,18**. Son referencias de mercado, no una valoración intrínseca.\n\n\
    **Lectura financiera:** los datos disponibles plantean una posible contracción\
    \ de FCF y margen frente a las referencias de FY 2024, pero no permiten establecer\
    \ una tendencia comparable ni su causa. El análisis DDD califica el debilitamiento\
    \ financiero reciente y la estructura de deuda como riesgos que requieren investigación.\
    \ AOIF indica que no cuenta con cifras suficientes de flujo de caja operativo,\
    \ inversión de capital y FCF para evaluar la conversión de caja.\n\n## 4. Management\
    \ y Gobierno Corporativo\n\nEl análisis AOIF califica la calidad de la dirección\
    \ como **buena**, la asignación de capital como **creadora de valor** y el alineamiento\
    \ de insiders como **moderado**. Estas son evaluaciones cualitativas sin evidencia\
    \ detallada ni periodo asociado en los datos recibidos.\n\nNo se proporcionan\
    \ nombres de directivos, remuneración, tenencia accionaria de insiders, transacciones\
    \ internas, composición del consejo, independencia de sus miembros ni criterios\
    \ de supervisión. Por tanto, no es posible verificar esas calificaciones ni evaluar\
    \ de forma independiente los incentivos o el gobierno corporativo.\n\n**Agenda\
    \ de verificación:** revisar informes corporativos y documentación de gobierno\
    \ para identificar la composición del consejo, los incentivos de largo plazo,\
    \ las participaciones de insiders y las políticas de asignación de capital. No\
    \ se incorporan aquí datos externos.\n\n## 5. Tesis de Inversión\n\n### Caso alcista\
    \ — hipótesis por validar\n\n- **Ecosistema de producto y servicio:** la marca,\
    \ la red de concesionarios, el servicio y la disponibilidad de repuestos podrían\
    \ sostener relaciones de largo plazo y aportar ingresos asociados al parque instalado.\
    \ Esta ventaja está descrita en AOIF, pero no está cuantificada en los datos disponibles.\n\
    - **Escala y financiación integrada:** la combinación de maquinaria con financiación\
    \ puede facilitar las ventas y ampliar la relación con clientes y distribuidores.\
    \ Para valorar este atributo hace falta separar resultados, riesgos y capital\
    \ empleado de Financial Services.\n- **Exposición a una eventual recuperación\
    \ del ciclo:** una mejora de la demanda agrícola o de construcción podría favorecer\
    \ pedidos y utilización de capacidad. El paquete no incluye guía de dirección\
    \ ni datos de pedidos que permitan confirmar una recuperación.\n- **Potencial\
    \ de estabilización financiera:** una recuperación del FCF comparable y una estabilización\
    \ de márgenes serían señales relevantes para reforzar la tesis.\n\n### Estado\
    \ de la evidencia\n\nAOIF describe a Deere como líder competitivo y atribuye amplitud\
    \ a su moat. En cambio, DDD concluye que la calidad del negocio no se puede determinar\
    \ con la evidencia disponible, porque faltan datos segmentados y de capital empleado.\
    \ La tesis de liderazgo y la posible durabilidad de sus ventajas deben tratarse,\
    \ por tanto, como **hipótesis cualitativas**, no como hechos financieros demostrados.\n\
    \nDDD clasifica la oportunidad como **“investigación requerida”** y señala que\
    \ no se valida un error de valoración. Aunque se reportan una subida del precio\
    \ y objetivos de analistas, no se dispone de un método de valoración con supuestos\
    \ suficientes para concluir que la cotización descuenta incorrectamente el ciclo\
    \ o una recuperación futura.\n\n## 6. Riesgos y Contra-Tesis\n\n### Caso bajista\n\
    \n- **Deterioro del flujo de caja:** el FCF TTM reportado al 2 de agosto de 2026\
    \ fue inferior al dato de FY 2024 citado por la fuente. La comparación no es homogénea,\
    \ pero justifica comprobar si el deterioro persiste en periodos comparables.\n\
    - **Contracción de márgenes:** el margen bruto TTM reportado fue 25,18%, frente\
    \ a 29,50% para FY 2024. Hace falta determinar qué segmentos y factores explican\
    \ la diferencia.\n- **Ciclo agrícola adverso:** una caída de los ingresos agrícolas,\
    \ de los precios de los cultivos o de la inversión de los productores podría reducir\
    \ la demanda de maquinaria. AOIF considera que este riesgo tiene impacto alto\
    \ y probabilidad media.\n- **Menor actividad en construcción y silvicultura:**\
    \ el análisis AOIF identifica una posible caída cíclica de pedidos en equipos\
    \ de construcción y forestales, con impacto y probabilidad medios.\n- **Complejidad\
    \ financiera:** la deuda total reportada es elevada en términos absolutos, pero\
    \ el paquete no permite atribuirla entre Financial Services y el negocio de equipos.\
    \ Sin ese desglose no puede estimarse adecuadamente el apalancamiento operativo\
    \ ni el riesgo de financiación.\n- **Valoración no demostrada:** AOIF reporta\
    \ múltiplos de valoración elevados, pero sin fecha ni base de cálculo verificable.\
    \ No permiten por sí solos concluir sobrevaloración. El precio avanzó mientras\
    \ el paquete también registraba señales de debilidad en FCF y margen; no se sabe\
    \ si el mercado descuenta una recuperación.\n\n### Triggers de falsación o debilitamiento\
    \ de la tesis de recuperación\n\n1. Continuación del deterioro del FCF en datos\
    \ comparables posteriores al periodo terminado el 2 de agosto de 2026.\n2. Nueva\
    \ contracción de márgenes respecto del 25,18% TTM citado para ese periodo, una\
    \ vez comprobada la comparabilidad.\n3. Debilidad persistente de ingresos, pedidos\
    \ o precios en los segmentos principales frente a una eventual estabilización\
    \ del ciclo.\n4. Evidencia de que la deuda y las necesidades de financiación de\
    \ Financial Services limitan la flexibilidad financiera o la capacidad de inversión.\n\
    \nEl dato de current ratio de 2,13x supera el umbral de 0,5x señalado en DDD para\
    \ esa métrica. Es una observación aislada, no una conclusión general sobre liquidez,\
    \ calidad de activos o solvencia.\n\n## 7. Catalizadores y Timeline\n\nNo se proporcionan\
    \ fechas confirmadas de próximos resultados, eventos corporativos ni previsiones\
    \ de la dirección. Por ello, no es posible asignar un calendario específico.\n\
    \n| Catalizador a vigilar | Fecha esperada según el paquete | Impacto potencial\
    \ |\n|---|---|---|\n| Publicación de resultados comparables de ingresos, FCF y\
    \ márgenes | No especificada | Una estabilización o recuperación reforzaría la\
    \ hipótesis de normalización; un deterioro adicional la debilitaría. |\n| Datos\
    \ de demanda, precios, inventarios y pedidos por segmento | No especificada |\
    \ Ayudarían a distinguir cambios cíclicos de problemas específicos de producto\
    \ o ejecución. |\n| Guía de la dirección comparable por segmento | No disponible\
    \ | Permitiría evaluar expectativas de actividad, márgenes e inversión. |\n| Divulgación\
    \ del capital empleado, retornos y asignación de capital por negocio | No disponible\
    \ | Aclararía la rentabilidad del negocio de equipos frente a Financial Services\
    \ y la calidad de la reinversión. |\n\nLa evolución del FCF y la estabilización\
    \ de márgenes son los catalizadores destacados por DDD, pero el paquete no proporciona\
    \ una guía futura cuantificada.\n\n## 8. Marco de Valoración\n\nLa valoración\
    \ debe considerar que Deere combina un negocio industrial cíclico con una unidad\
    \ financiera. Conviene analizar ambos componentes por separado y normalizar los\
    \ resultados a través del ciclo antes de concluir sobre el valor de la empresa.\n\
    \n### Metodología apropiada\n\n- **Negocio de equipos:** valorar beneficios o\
    \ flujo de caja normalizados, con supuestos explícitos sobre volúmenes, precios,\
    \ márgenes, capital de trabajo e inversión.\n- **Financial Services:** analizar\
    \ por separado rentabilidad, financiación, pérdidas crediticias, necesidades de\
    \ capital y valor de sus activos y pasivos.\n- **Método agregado:** complementar\
    \ con un análisis de suma de partes o flujos de caja descontados, evitando mezclar\
    \ sin ajuste la deuda de la unidad financiera con la del negocio industrial.\n\
    \n### Limitaciones y supuestos pendientes\n\nNo hay información suficiente para\
    \ estimar un valor intrínseco riguroso: faltan proyecciones de flujo de caja,\
    \ tasa de descuento, supuestos normalizados para el ciclo, desglose segmentado\
    \ y datos completos de capital empleado. El propio AOIF indica que su estimación\
    \ de valor intrínseco no es rigurosa con la información disponible y clasifica\
    \ el margen de seguridad como insuficiente.\n\nLos múltiplos de P/E de 37,28x\
    \ y EV/EBITDA de 27,39x reportados por AOIF carecen de fecha, fuente y base financiera\
    \ identificada en el paquete. Deben verificarse antes de utilizarlos. El FCF yield\
    \ reportado como cero tampoco se considera interpretable sin definición y contexto.\n\
    \n### Sensibilidad que debe desarrollarse\n\nLa valoración debería probar, como\
    \ mínimo, escenarios de:\n\n- demanda y volúmenes agrícolas y de construcción;\n\
    - precios de equipos y márgenes brutos y operativos;\n- normalización o persistencia\
    \ de la contracción del FCF;\n- inversión necesaria, capital de trabajo y retornos\
    \ sobre capital;\n- coste y disponibilidad de financiación, además de pérdidas\
    \ crediticias en Financial Services.\n\nEl precio de USD 671,60 y los objetivos\
    \ de analistas citados sirven como referencias de mercado fechadas, pero no sustituyen\
    \ una valoración propia. Con la evidencia actual no se valida un error de valoración.\n\
    \n## 9. Preguntas Abiertas y Agenda de Investigación\n\n1. ¿Cómo evolucionan demanda,\
    \ precios, inventarios, pedidos y márgenes en cada segmento?\n2. ¿Qué guía comparable\
    \ ofrece la dirección para ingresos, márgenes, FCF e inversión?\n3. ¿El debilitamiento\
    \ reportado del FCF y del margen bruto continúa en periodos homogéneos o refleja\
    \ diferencias de periodo y mezcla de segmentos?\n4. ¿Cuáles son los retornos sobre\
    \ capital, necesidades de reinversión y criterios de asignación de capital del\
    \ negocio de equipos, separados de Financial Services?\n5. ¿Cómo se distribuyen\
    \ la deuda total, el efectivo y las obligaciones entre Financial Services y las\
    \ operaciones industriales?\n6. ¿Qué evidencia cuantitativa respalda la retención\
    \ de clientes, los costes de cambio, la ventaja de la red de concesionarios y\
    \ la economía de repuestos y servicios?\n7. ¿Qué exposición tienen los resultados\
    \ a precios de cultivos, ingresos de los productores, tasas de interés, condiciones\
    \ de crédito y actividad de construcción?\n8. ¿Cómo se calculan y a qué periodo\
    \ corresponden las métricas de crecimiento de ingresos, margen operativo, ROIC,\
    \ P/E y EV/EBITDA citadas por AOIF?\n9. ¿Qué información de gobierno corporativo\
    \ respalda las evaluaciones de calidad de management, alineamiento de insiders\
    \ y asignación de capital?\n\n**Estado de investigación:** mantener la tesis como\
    \ provisional. Priorizar datos financieros por segmento, comparabilidad temporal\
    \ del FCF y los márgenes, y separación de Financial Services antes de concluir\
    \ sobre calidad del negocio, estructura de capital o valoración.\n\n---\n\n##\
    \ Related Companies\n\n- **Same Sector**: [[ASR|Grupo Aeroportuario del Sureste,\
    \ S. A. B. de C. V.]], [[CAAP|Corporación América Airports S.A.]], [[CAR|Avis\
    \ Budget Group, Inc.]], [[CAT|Caterpillar Inc.]], [[DAL|Delta Air Lines, Inc.]]\n\
    - **Same Industry**: [[CAT|Caterpillar Inc.]]"
