    \ de analistas; no representan una valoración fundamental independiente.\n\nLa\
    \ conclusión del expediente sobre posible error de mercado es **incierta**. La\
    \ hipótesis contraria es que el mercado podría estar extrapolando una fase débil\
    \ del ciclo y subestimando la resiliencia del negocio, pero la evidencia disponible\
    \ no permite confirmar esa interpretación.\n\n### Supuestos y sensibilidad\n\n\
    La valoración es especialmente sensible a:\n\n1. La duración e intensidad del\
    \ ciclo agrícola y de construcción.\n2. Los niveles normalizados de pedidos, ventas\
    \ y márgenes.\n3. La generación de FCF a través del ciclo y su conversión desde\
    \ el flujo operativo.\n4. La deuda neta, la liquidez y la exposición de financiación\
    \ a clientes.\n5. La contribución incremental de tecnología, automatización, repuestos\
    \ y servicios.\n\nAOIF considera insuficiente el margen de seguridad y señala\
    \ que no se puede estimar el valor intrínseco con rigor con la información disponible.\n\
