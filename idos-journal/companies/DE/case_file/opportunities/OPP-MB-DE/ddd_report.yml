  existing_wiki: "# DE — Deere & Company\n\n> **Estado de la tesis:** provisional\
    \ y activa; la evidencia disponible no confirma una invalidación.  \n> **Clasificación\
    \ principal:** cíclica.  \n> **Valoración indicada por el expediente:** justa,\
    \ con margen de seguridad insuficiente según las métricas aportadas.  \n> **Fecha\
    \ de corte del análisis:** 2026-11-20. Las métricas y referencias de mercado que\
    \ siguen conservan las fechas y fuentes proporcionadas en los inputs.\n\n## 1.\
    \ Visión General de la Compañía\n\nDeere & Company diseña, fabrica y comercializa\
    \ maquinaria y soluciones tecnológicas destinadas principalmente a agricultura,\
    \ construcción y silvicultura. Sus clientes incluyen agricultores y empresas agropecuarias,\
    \ contratistas y empresas de construcción. La cadena de valor comprende diseño\
    \ e ingeniería, abastecimiento de componentes y materias primas, fabricación y\
    \ ensamblaje, y distribución mediante concesionarios.\n\nLa exposición a la demanda\
    \ de maquinaria hace que el negocio sea **cíclico**: los resultados pueden verse\
    \ afectados por las condiciones del crédito, los precios de los productos agrícolas,\
    \ la renovación de equipos y la actividad de construcción. El expediente no especifica\
    \ la distribución geográfica de ingresos ni aporta datos recientes por segmento.\n\
    \n## 2. Modelo de Negocio y Posición Competitiva\n\n### Fuentes de ingresos y\
    \ drivers\n\n- Venta de maquinaria y equipos agrícolas.\n- Venta de equipos para\
    \ construcción y silvicultura.\n- Posible contribución de repuestos, servicio\
    \ y tecnología asociada a los equipos; su peso e ingresos no están cuantificados\
    \ en la evidencia disponible.\n- La demanda depende, entre otros factores, del\
    \ ciclo de inversión de los clientes, el crédito, los precios agrícolas y la actividad\
    \ de construcción.\n\n### Moat y dinámica competitiva\n\nDeere es descrita como\
    \ un líder competitivo con un moat **estrecho**. La marca, la red de concesionarios,\
    \ la disponibilidad de repuestos y servicio, la base instalada y la integración\
    \ de tecnología con los equipos son fuentes plausibles de diferenciación. No obstante,\
    \ el expediente no cuantifica la contribución de estos factores a la retención\
    \ de clientes, los márgenes o el rendimiento sobre el capital.\n\nLa industria\
    \ se considera cíclica y competitiva. La maquinaria de precisión, la automatización\
    \ y los servicios posventa podrían reforzar la propuesta de valor, pero la evidencia\
    \ no confirma todavía su monetización ni su capacidad para reducir la sensibilidad\
    \ al ciclo.\n\nNo se identificaron compañías comparables concretas en la lista\
    \ proporcionada; por tanto, no se añaden [[wikilinks]] a competidores sin respaldo\
    \ en el expediente.\n\n## 3. Perfil Financiero\n\nLas cifras financieras se presentan\
    \ tal como aparecen en los inputs. No se proporcionan periodos comparables para\
    \ la mayoría de las métricas, por lo que no deben interpretarse como una serie\
    \ temporal ni como necesariamente homogéneas entre sí.\n\n| Métrica | Valor informado\
    \ | Fecha / fuente / limitación |\n|---|---:|---|\n| Crecimiento de revenue |\
    \ 8,31% | AOIF; periodo y metodología no especificados |\n| Margen operativo |\
    \ 13,52% | AOIF; periodo y metodología no especificados |\n| ROIC | 5,69% | AOIF;\
    \ periodo y metodología no especificados |\n| FCF | USD 3.230 millones | TTM terminado\
    \ el 2026-08-02; fuente indicada: stockanalysis.com |\n| FCF yield | 0 | AOIF;\
    \ unidad y metodología no aclaradas |\n| P/E | 37,28x | AOIF; fecha y metodología\
    \ no especificadas |\n| EV/EBITDA | 27,39x | AOIF; fecha y metodología no especificadas\
    \ |\n\n**Tendencia y calidad financiera:** AOIF califica la tendencia financiera\
    \ como estable, pero señala que no puede evaluarse rigurosamente la conversión\
    \ a FCF sin cifras comparables de flujo de caja operativo y flujo de caja libre.\
    \ DDD califica la salud financiera como adecuada, aunque el expediente no incluye\
    \ los datos necesarios para comprobar deuda, liquidez, vencimientos o cobertura\
    \ de intereses.\n\n| Elemento de estructura de capital | Información disponible\
    \ |\n|---|---|\n| Deuda y deuda neta | No aportadas |\n| Liquidez y vencimientos\
    \ | No aportados |\n| Cobertura de intereses | No aportada |\n| Financiación a\
    \ clientes y exposición asociada | No cuantificada |\n\n## 4. Management y Gobierno\
    \ Corporativo\n\nLa evaluación disponible es **regular**. AOIF califica la asignación\
    \ de capital como neutral y el alineamiento de insiders como débil. DDD señala\
    \ que faltan datos verificables sobre asignación de capital, remuneración, propiedad\
    \ accionaria y composición del consejo.\n\nNo se proporcionan nombres de directivos,\
    \ composición del board, métricas de incentivos ni cifras de propiedad de insiders.\
    \ Por ello, no es posible evaluar de forma independiente la calidad del liderazgo,\
    \ la rendición de cuentas o la alineación entre dirección y accionistas.\n\n##\
    \ 5. Tesis de Inversión\n\n### Caso alcista\n\n- Deere ocupa una posición competitiva\
    \ destacada en maquinaria agrícola y de construcción, según AOIF.\n- La marca,\
    \ la red de concesionarios, el servicio, los repuestos y la base instalada podrían\
    \ sostener diferenciación y relaciones duraderas con clientes.\n- La tecnología\
    \ de precisión, la automatización, los repuestos y los servicios podrían ampliar\
    \ la contribución de ingresos recurrentes o menos dependientes de la venta de\
    \ equipos. Se trata de una posibilidad estratégica pendiente de confirmación,\
    \ no de un resultado demostrado.\n- Una estabilización sostenida de pedidos, ventas\
    \ y márgenes podría indicar una mejora de la fase del ciclo. DDD asigna a este\
    \ posible catalizador una probabilidad del 45%, con confianza baja.\n\n### Evidencia\
    \ y límites\n\nAOIF informa un crecimiento de ingresos del 8,31%, un margen operativo\
    \ del 13,52% y un ROIC del 5,69%, aunque sin especificar periodos ni metodología.\
    \ DDD informa FCF TTM de USD 3.230 millones para el periodo terminado el 2026-08-02,\
    \ con fuente stockanalysis.com. Estas cifras no bastan para establecer una tendencia\
    \ normalizada a través del ciclo.\n\nLa tesis es, por tanto, una exposición cíclica\
    \ a un fabricante con ventajas competitivas potenciales, no una conclusión de\
    \ que la estabilidad de beneficios o la monetización tecnológica estén probadas.\n\
    \n## 6. Riesgos y Contra-Tesis\n\n### Caso bajista y riesgos clave\n\n| Riesgo\
    \ | Impacto | Probabilidad informada | Implicación |\n|---|---|---|---|\n| Contracción\
    \ cíclica de la demanda agrícola o de construcción | Alto | Media | Menores ventas\
    \ de equipos, utilización de capacidad y márgenes |\n| Volatilidad de ingresos\
    \ y caja a lo largo del ciclo | Alto | No especificada | Una observación financiera\
    \ aislada podría sobrestimar la generación sostenible |\n| Variaciones en materias\
    \ primas, costes de fabricación y disponibilidad de componentes | Medio | Media\
    \ | Presión sobre costes, producción y márgenes |\n| Endeudamiento, liquidez y\
    \ financiación a clientes insuficientemente documentados | No cuantificado | No\
    \ cuantificada | Impide evaluar con rigor la resiliencia financiera y los riesgos\
    \ de crédito |\n\nLa contra-tesis principal es que la demanda y la generación\
    \ de caja pueden deteriorarse con el ciclo, mientras que las métricas financieras\
    \ puntuales no reflejen la rentabilidad normalizada. También es posible que los\
    \ beneficios atribuidos a tecnología y servicios no lleguen a compensar la volatilidad\
    \ de la venta de equipos.\n\n### Triggers de falsación o deterioro de la tesis\n\
    \n- Evidencia de deterioro sostenido de pedidos, ventas o márgenes, en lugar de\
    \ estabilización.\n- Caída persistente de la demanda en agricultura o construcción\
    \ que afecte utilización de capacidad y generación de caja.\n- Datos que muestren\
    \ que tecnología, automatización, repuestos y servicios no logran una monetización\
    \ material.\n- Información financiera que revele debilidad relevante en liquidez,\
    \ cobertura de intereses o financiación a clientes.\n\nEl expediente no reporta\
    \ una vulneración confirmada de criterios de invalidación; la falta de datos no\
    \ debe confundirse con evidencia favorable.\n\n## 7. Catalizadores y Timeline\n\
    \n| Catalizador | Horizonte indicado | Probabilidad informada | Impacto / confianza\
    \ | Estado de la evidencia |\n|---|---|---:|---|---|\n| Resultados o actualización\
    \ corporativa que confirmen estabilización sostenida de pedidos, ventas y márgenes\
    \ | Medio plazo | 45% | Impacto medio; confianza baja | Hipótesis; no se aporta\
    \ fecha de evento |\n| Evidencia de mayor monetización de tecnología de precisión,\
    \ automatización, repuestos y servicios | Largo plazo | 35% | Impacto medio; confianza\
    \ baja | Posibilidad estratégica pendiente de confirmación |\n\nLas probabilidades\
    \ son estimaciones del análisis suministrado, no resultados observados. No se\
    \ indican fechas concretas para resultados, actualizaciones corporativas ni hitos\
    \ tecnológicos.\n\n## 8. Marco de Valoración\n\nLa valoración apropiada debería\
    \ considerar la naturaleza cíclica del negocio: beneficios y flujos de caja normalizados\
    \ a través del ciclo son más informativos que extrapolar un único periodo. También\
    \ conviene contrastar métodos basados en beneficios y flujo de caja con múltiplos\
    \ de mercado, una vez aclaradas las fechas y definiciones de las métricas.\n\n\
    ### Referencias disponibles\n\n- Opinión de valoración del expediente DDD: **justa**.\n\
    - P/E informado por AOIF: **37,28x**.\n- EV/EBITDA informado por AOIF: **27,39x**.\n\
    - FCF yield informado por AOIF: **0**, sin unidad ni metodología aclaradas; no\
    \ debe interpretarse como una medición validada.\n- DDD señala una cotización\
    \ disponible de **USD 671,60 al 2026-10-30** y un consenso de precio objetivo\
    \ observado al **2026-11-20 de USD 694**. El consenso es una referencia de analistas,\
    \ no una estimación independiente del valor intrínseco.\n- Análisis de escenarios\
    \ de DDD, horizonte al **2027-11-20**:\n  - **BEAR:** USD 500, anclado en el extremo\
    \ inferior del rango de objetivos observado por analistas.\n  - **BULL:** USD\
