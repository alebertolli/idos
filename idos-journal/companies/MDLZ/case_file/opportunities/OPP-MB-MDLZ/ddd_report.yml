    | Próximos reportes; fecha no proporcionada | Márgenes operativos y efecto de
    costos de insumos, empaques y transporte | Riesgos cualitativos identificados
    por AOIF | Evaluar presión de costos y capacidad de trasladarlos a precios |


    No se proporciona una fecha futura confirmada para estos hitos. Tampoco se identifican
    eventos corporativos fechados que puedan tratarse como catalizadores ciertos.


    ## 8. Marco de Valoración


    El valor intrínseco **no es estimable con la información disponible**. El análisis
    AOIF señala que faltan un precio de referencia fechado, FCF normalizado y supuestos
    de crecimiento y descuento. También indica margen de seguridad insuficiente.


    Los múltiplos reportados —P/E de 20,85x y EV/EBITDA de 14,52x— pueden servir como
    referencias relativas, pero no bastan por sí solos para concluir que la acción
    está barata o cara. La cifra de FCF yield reportada como cero carece de unidad,
    fecha e inputs suficientes para interpretarla.


    El análisis de escenarios DDD, fechado al 2026-11-21 y con horizonte al 2027-11-21,
    utiliza objetivos de analistas como anclas, no una valoración intrínseca propia:


    | Escenario | Precio objetivo | Interpretación del paquete |

    |---|---:|---|

    | Bajista | USD 56 | Extremo inferior del rango de objetivos de analistas observado
    |

    | Alcista | USD 77 | Extremo superior del rango de objetivos de analistas observado
    |


    El paquete no proporciona los modelos detrás de estos objetivos ni supuestos verificables
    de crecimiento, márgenes o valoración. Por ello, el rango debe entenderse como
    una referencia de expectativas publicadas, no como un rango de valor fundamental
    calculado de forma independiente.


    Una valoración futura debería analizar escenarios de crecimiento de ingresos,
    márgenes, conversión de FCF, reinversión, retornos sobre capital y evolución de
    acciones diluidas. La sensibilidad tendría que mostrar cómo cambian los resultados
    ante variaciones en estos supuestos y en la tasa de descuento. Ninguno de esos
    inputs está suficientemente documentado aquí.


