    ## 8. Marco de Valoración


    El material no permite estimar rigurosamente el valor intrínseco: faltan una referencia
    verificable de deuda neta, precio y número de acciones, metodología de las métricas
    y una conciliación del FCF. AOIF califica el margen de seguridad como **insuficiente**
    y no estima valor intrínseco. [AOIF, fecha no especificada]


    **Enfoques apropiados para una investigación posterior:**


    - **Valoración por escenarios de flujo de caja:** modelar producción, precios
    realizados, costos operativos, impuestos, capex y capital de trabajo bajo escenarios
    de ciclo.

    - **Valoración por activos o segmentos:** separar las actividades de hidrocarburos
    y renovables si se obtienen datos segmentados verificables.

    - **Múltiplos comparables:** usar PER y EV/EBITDA solo tras verificar período,
    precio de referencia, deuda neta y comparabilidad con pares como [[BP]], [[COP]]
    y [[CVX]].


