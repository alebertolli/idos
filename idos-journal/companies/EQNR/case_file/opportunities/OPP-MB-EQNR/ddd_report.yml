  existing_wiki: '## 1. Visión General de la Compañía


    **Equinor ASA (EQNR)** es una compañía energética integrada, con actividades de
    exploración, desarrollo y producción de petróleo y gas, además de procesamiento,
    transporte y comercialización. El perfil suministrado también menciona actividades
    en energías renovables, pero no aporta cifras sobre su escala o contribución financiera.
