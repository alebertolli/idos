    investing goals, as well as allows customers to understand the basics of investing
    before their first trade; and Crypto Learn and Earn, an educational module available
    to various crypto customers through Robinhood Learn to teach customers the basics
    related to cryptocurrency. Further, it provides Robinhood credit cards, cash card
    and spending accounts, and wallets. Robinhood Markets, Inc. was incorporated in
    2013 and is headquartered in Menlo Park, California.
