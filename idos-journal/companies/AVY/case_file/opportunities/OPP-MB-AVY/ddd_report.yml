    | Escenario bajista | USD 182 | Ancla al límite inferior del rango de objetivos
    observado; no es una valoración independiente. |

    | Escenario alcista | USD 230 | Ancla al límite superior del rango de objetivos
    observado; no es una valoración independiente. |


    DDD indica que el precio está por debajo de la media del consenso suministrado,
    pero dentro del rango observado y apenas por encima de su límite inferior. El
    rango completo y la composición del consenso no están disponibles, por lo que
    no se reproducen valores adicionales.


    La opinión de valoración de DDD es **justa**, mientras que AOIF considera **insuficiente**
    el margen de seguridad y señala que el valor intrínseco no puede determinarse
    independientemente con los datos disponibles. Las dos lecturas no son necesariamente
    contradictorias: una expresa una impresión relativa al consenso aportado y la
    otra destaca la falta de base para calcular valor intrínseco y margen de seguridad.


    **Sensibilidad pendiente**


    No es posible elaborar una sensibilidad cuantitativa sólida sin FCF normalizado,
    deuda neta, coste de capital, crecimiento terminal y supuestos de márgenes. Para
    actualizar la valoración, conviene probar escenarios de menor o mayor crecimiento
    orgánico, presión o recuperación de márgenes y distintas necesidades de inversión,
    contrastándolos con caja y deuda verificadas.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Qué muestran los informes anuales y trimestrales primarios sobre ingresos,
    crecimiento orgánico, volumen, precios y resultados por segmento?

    2. ¿Cuál es la moneda, definición y fuente del FCF de 1.040 millones reportado
    para el TTM terminado el 30-09-2026? ¿Cómo se reconcilia con flujo de caja operativo,
    capex y FCF yield?

    3. ¿Cuáles son la deuda bruta y neta, los vencimientos, la liquidez disponible,
    la cobertura de intereses y las necesidades de refinanciación?

    4. ¿Cómo han evolucionado históricamente el margen operativo y el ROIC? ¿Qué metodología
    y periodo sustentan las cifras de AOIF?

    5. ¿Qué proporción de ingresos y margen corresponde a soluciones de identificación
    digital? ¿Qué evidencia existe sobre adopción, rentabilidad y retención de clientes?

    6. ¿Qué exposición tiene AVY a papel, películas, adhesivos, resinas, energía y
    logística, y qué capacidad ha demostrado para trasladar cambios de costes?

    7. ¿Quiénes son los competidores directos por producto y geografía, y qué datos
    comparables permiten comprobar la posición de liderazgo y la amplitud del moat?

    8. ¿Cuáles son los incentivos de la dirección, la propiedad insider, la composición
    e independencia del consejo y el historial de asignación de capital?

    9. ¿Qué políticas y datos verificables existen sobre emisiones, residuos, uso
    de materiales, trazabilidad y auditorías laborales? La información actual no permite
    evaluar estos factores en detalle.

    10. ¿Cuál es el rango completo del consenso mencionado en DDD, qué analistas lo
    componen y a qué fecha corresponde?

    11. ¿Cuándo se publicarán los próximos resultados y qué métricas de crecimiento,
    margen y caja permitirían confirmar o debilitar la tesis?


    **Fuentes y fecha:** síntesis de los inputs DDD y AOIF suministrados; no se incluyeron
