resumen_ejecutivo: 'Salesforce parece conservar atributos de compounder: software
  empresarial, plataforma extensa y generación de caja relevante según la observación
  financiera aportada. Hay crecimiento positivo en la observación disponible, pero
  no es suficiente para establecer su trayectoria sostenible ni la calidad de ese
  crecimiento. La tesis de upside depende de que la IA produzca monetización incremental
  y no solo uso o sustitución de funcionalidades existentes. La cotización y el consenso
