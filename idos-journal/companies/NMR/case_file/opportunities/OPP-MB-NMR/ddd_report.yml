  existing_wiki: '## 1. Visión General de la Compañía


    Nomura Holdings, Inc. (NMR) es un grupo financiero global con actividades de gestión
    patrimonial, gestión de inversiones y banca mayorista (*Wholesale*). Atiende a
    clientes individuales, hogares, inversores institucionales y entidades gubernamentales.
    Su cadena de valor incluye captación y asesoría, diseño y gestión de productos
    financieros, distribución, intermediación, financiación y gestión de riesgos.


    Opera en una industria financiera global, intensamente competitiva y regulada,
    cuyas condiciones dependen, entre otros factores, de la actividad de los mercados
    y de la confianza de los clientes. El material disponible no detalla de forma
    suficiente la distribución geográfica de ingresos o activos para caracterizarla
    con mayor precisión.


    Compañías del mismo sector o con actividades financieras relacionadas incluyen
    [[C]], [[HSBC]], [[JPM]], [[MUFG]], [[MFG]], [[SAN]], [[IBN]], [[ING]], [[BX]]
    y [[AIG]]. La pertenencia a esta lista no implica que sus modelos de negocio sean
    directamente comparables con el de Nomura.


    ## 2. Modelo de Negocio y Posición Competitiva


    **Fuentes de ingresos y actividades**

    - **Gestión patrimonial:** asesoría de inversiones y servicios para clientes individuales
    y hogares.

    - **Gestión de inversiones:** fondos y soluciones de inversión para clientes institucionales
    y vehículos de inversión.

    - **Banca mayorista:** servicios financieros y actividades de mercado, intermediación
    y financiación. La información disponible no desglosa los ingresos por producto
    ni por segmento.


    Los ingresos pueden depender de comisiones y honorarios, así como de resultados
    asociados a la actividad de mercado. Por ello, el desempeño puede variar con las
    condiciones de negociación, las emisiones, las operaciones corporativas, las tasas
    de interés y la confianza de los clientes.


    **Posición competitiva y moat**

    - La escala, la marca, las relaciones con clientes institucionales y el acceso
    a mercados pueden constituir ventajas.

    - La evaluación de investigación califica el moat como **estrecho** y la posición
    competitiva como **retadora**: la intermediación y la banca de inversión son competitivas
    y sensibles a los ciclos de mercado.

    - No se proporcionan datos comparables de cuota de mercado, retención de clientes,
    rentabilidad por segmento ni retornos incrementales que permitan confirmar la
    durabilidad de esas ventajas.


    ## 3. Perfil Financiero


