    ## 8. Marco de Valoración


    No puede estimarse un valor intrínseco defendible con la información disponible.
    La valoración requiere datos financieros comparables, beneficios normalizados
    y una metodología apropiada para un grupo financiero.


    **Marco recomendado para la investigación**

    - Separar y valorar los segmentos de gestión patrimonial, gestión de inversiones
    y banca mayorista, siempre que se obtengan ingresos, beneficios y capital asignado
