  existing_wiki: '## 1. Visión General de la Compañía


    Nomura Holdings, Inc. (NMR) es un grupo financiero global que ofrece servicios
    de inversión, financiación y actividades relacionadas a clientes individuales,
    institucionales, empresariales y emisores. Su negocio abarca gestión patrimonial
    y de activos, intermediación y negociación de valores, financiación y banca de
    inversión. La información disponible describe operaciones internacionales, pero
    no especifica países, ingresos por geografía ni exposición regional.


    La compañía opera en el sector de servicios financieros. Sus actividades están
    expuestas al ciclo económico y a las condiciones de los mercados de capitales,
    incluidos los tipos de interés, la volatilidad y el volumen de negociación. Entre
    las empresas del sector y competidores comparables para investigación futura figuran
    [[JPM]], [[C]], [[HSBC]], [[MUFG]] y [[MFG]].


    **Alcance de la evidencia:** los materiales suministrados contienen datos financieros
    y valoraciones sin siempre indicar periodo, base contable o fuente verificable.
    Se señalan expresamente las limitaciones; no deben interpretarse cifras no documentadas
    como hechos financieros confirmados.


    ## 2. Modelo de Negocio y Posición Competitiva


    Nomura genera ingresos a través de tres áreas principales:


    - **Gestión patrimonial:** asesoramiento y servicios para clientes individuales
    y patrimoniales.

    - **Gestión de activos:** fondos, fideicomisos de inversión y soluciones para
    inversores institucionales.

    - **Wholesale:** negociación y distribución de valores de deuda y capital, financiación
    y servicios de banca de inversión para instituciones, empresas y emisores.


    La cadena de valor comprende captar y asesorar clientes, diseñar soluciones de
    inversión, gestionar activos y riesgos, facilitar transacciones y financiación,
    y distribuir valores. Depende de profesionales especializados, tecnología y datos,
    acceso a mercados y contrapartes, y controles de riesgo y cumplimiento.


    **Drivers de ingresos:** las comisiones y los activos gestionados impulsan los
    negocios patrimoniales y de gestión de activos; la actividad de los mercados,
    el volumen de operaciones y la ejecución de transacciones influyen en los negocios
    mayoristas. Las fuentes describen estos drivers, pero no aportan una descomposición
    cuantitativa de ingresos por segmento.


    **Posición competitiva y moat:** las ventajas potenciales incluyen marca, relaciones
    con clientes, presencia internacional, distribución, acceso a mercados y conocimiento
    especializado. La evaluación proporcionada caracteriza el moat como **estrecho**
    y la posición competitiva como **retadora**: la movilidad de clientes y profesionales,
    la competencia intensa y la ciclicidad limitan la durabilidad de esas ventajas.
    Entre los pares relevantes para comparación figuran [[JPM]], [[C]], [[HSBC]],
    [[MUFG]] y [[MFG]].


    La industria también afronta presiones por digitalización, plataformas de bajo
    coste, regulación y costes de cumplimiento. Estos factores pueden presionar precios
    y márgenes.


    ## 3. Perfil Financiero


    Las métricas siguientes proceden de los materiales de investigación y **no son
    plenamente verificables**: en general no se especifican periodo, fuente primaria,
    definiciones o base contable. Deben validarse antes de utilizarlas en una valoración.


    | Métrica | Valor reportado | Periodo / fuente indicada | Estado y limitaciones
    |

    |---|---:|---|---|

    | Crecimiento de ingresos | 21,55% | No especificados | AOIF lo presenta como
    cifra proporcionada; no acredita tendencia plurianual. |

    | Margen operativo | 25,07% | No especificados | Cifra reportada sin fuente, periodo
    ni definición. |

    | ROIC | 1,06% | No especificados | Cifra reportada sin fuente, periodo ni definición.
    |

    | PER | 10,05 | No especificados | Cifra proporcionada; requiere validar fecha
    y beneficios normalizados. |

    | FCF TTM | -7,54B USD | TTM; fuente no identificada en el material | DDD lo reporta
    como consumo de efectivo. Su interpretación es limitada para una entidad financiera.
    |

    | Current ratio | 1,53 | Periodo no indicado | Reportado por DDD; no se proporcionan
    los componentes ni la fuente. |

    | Cobertura de intereses | 0 | DDD menciona Stock Analysis al 2026-09-30 | Indicador
    señalado como inferior al umbral de 2,0. Faltan detalles de cálculo y contexto
    contable. |

    | Volatilidad a 90 días | 24,69% | Periodo no detallado | DDD la reporta como
    referencia de volatilidad histórica. |

    | Precio de la acción | 9,38 USD | Fecha no indicada | Dato de DDD; no se indica
    fuente o momento de observación. |

    | Consenso de precio objetivo | 10,64 USD | Fecha no indicada | Dato de DDD; no
    se indica cobertura, número de analistas ni metodología. |

    | Crecimiento de ingresos, CAGR a 3 años | 17,5% | Periodo descrito como tres
    años; DDD | Inferencia incluida en la clasificación de oportunidad, sin evidencia
    subyacente identificada. |


    DDD cita como fuente para datos financieros la página de [Stock Analysis](https://stockanalysis.com/stocks/nmr/financials/)
    y, para estadísticas, [Stock Analysis — NMR Statistics](https://stockanalysis.com/stocks/NMR/statistics/),
    ambas consultadas el **2026-11-20**. El material no vincula de manera explícita
    cada cifra con una línea concreta de esas páginas ni incluye extractos que permitan
    verificarla.


    La generación de efectivo requiere cautela analítica: AOIF señala que los flujos
    de caja y el capital de trabajo de una entidad financiera se ven afectados por
    activos y pasivos financieros propios del negocio. Considera más pertinente contrastar
    beneficios con generación de capital, dividendos y recompras. No se aportan cifras
    sobre capital regulatorio, deuda, liquidez regulatoria, dividendos o recompras
    que permitan evaluar la estructura de capital.


    El crecimiento de ingresos y la valoración de la tendencia financiera quedan sin
    validar. DDD marca como no disponibles el CAGR de ingresos calculable, el crecimiento
    de FCF y la conversión de FCF, por falta de referencias explícitas a los inputs
    o por las limitaciones de FCF negativo.


    ## 4. Management y Gobierno Corporativo


    La evaluación disponible califica la calidad del management como **regular**,
    la asignación de capital como **neutral** y el alineamiento de insiders como **débil**.
    Son evaluaciones prudentes y no conclusiones respaldadas por datos detallados:
    el material indica que faltan resultados plurianuales, información sobre remuneración
    frente a objetivos, historial de asignación de capital y participación accionarial
    de insiders.


    No se aportan datos sobre integrantes, independencia, experiencia o comités del
    consejo de administración, ni sobre cambios en el liderazgo. Por tanto, no es
    posible valorar la composición del board ni los mecanismos de supervisión corporativa.


    ## 5. Tesis de Inversión


    **Caso alcista — hipótesis, no hecho confirmado:**


    - La combinación de gestión patrimonial, gestión de activos y negocios mayoristas
    diversifica las fuentes potenciales de ingresos.

    - Un entorno de mercado favorable podría elevar la actividad y las tarifas de
    banca de inversión y negociación.

    - Una mayor captación de activos gestionados podría impulsar los ingresos por
    comisiones y mejorar el margen de los negocios patrimoniales y de gestión de activos.

    - Mejoras de eficiencia podrían convertir ingresos en una generación de efectivo
    más sostenible.

    - La marca, las relaciones con clientes, la distribución y el acceso a mercados
    podrían respaldar la competitividad, aunque el material considera estrecho el
    moat.

    - DDD reporta un precio de 9,38 USD frente a un consenso de 10,64 USD. Esa diferencia
    no demuestra por sí sola infravaloración: faltan fecha, composición del consenso
    y supuestos de valoración.


    La tesis general es que el crecimiento de ingresos podría traducirse en mejores
    beneficios y generación de capital si mejora la actividad de mercado y la eficiencia
    operativa. Sin evidencia de periodos comparables, beneficios normalizados o generación
    de capital, esta posibilidad permanece como hipótesis.


    ## 6. Riesgos y Contra-Tesis


    **Caso bajista — hipótesis de riesgo:** el crecimiento reportado podría no convertirse
    en rentabilidad sostenible. La compañía podría seguir consumiendo efectivo y tener
    una cobertura de intereses insuficiente, mientras que la volatilidad y la actividad
    de mercado afectan ingresos y resultados. La hipótesis contraria de DDD es que
    el mercado podría estar incorporando expectativas de mejora que todavía no se
    reflejan en la situación financiera reportada.


    | Riesgo | Evidencia o fundamento disponible | Posible efecto |

    |---|---|---|

    | FCF negativo | DDD reporta FCF TTM de -7,54B USD; no se aporta detalle de cálculo.
    | Presión sobre liquidez y capacidad de financiar distribuciones o inversión,
    aunque el FCF convencional requiere cautela en una entidad financiera. |

    | Cobertura de intereses reportada en cero | DDD cita un ratio de 0 e indica que
    está por debajo del umbral de 2,0. | Señal de riesgo financiero que debe verificarse
    con definiciones y estados financieros pertinentes. |

    | Ciclicidad de mercados | Los ingresos mayoristas dependen de actividad, volatilidad
    y ejecución de operaciones. | Caída de ingresos o pérdidas de negociación en mercados
    de deuda, acciones o divisas. |

    | Riesgo de posiciones y contrapartes | Identificado en AOIF como riesgo de alto
    impacto y probabilidad media. | Pérdidas y mayor presión sobre capital o liquidez.
    |

    | Riesgo regulatorio y de cumplimiento | Operaciones sujetas a regulación en las
    jurisdicciones donde opera. | Sanciones, costes adicionales o restricciones operativas.
    |

    | Competencia y presión sobre márgenes | Competencia de bancos globales, gestores
    y plataformas de bajo coste. | Compresión de precios, pérdida de clientes o menor
    rentabilidad. |

    | Volatilidad de la acción | DDD reporta volatilidad a 90 días de 24,69%. | Mayor
    variabilidad del precio; no equivale a una medida de riesgo fundamental. |


    **Falsadores de la tesis alcista señalados por DDD:**


    - Persistencia del flujo de caja libre negativo.

    - Deterioro adicional de la cobertura de intereses.

    - Caída sostenida de ingresos por condiciones macroeconómicas adversas.


    Estos indicadores deben interpretarse junto con métricas apropiadas para una entidad
    financiera, como beneficios normalizados, capital regulatorio, exposición a contrapartes
    y evolución de costes.


    ## 7. Catalizadores y Timeline


    No se proporcionan fechas esperadas ni un calendario de eventos. Los siguientes
    son catalizadores potenciales, no eventos confirmados:


    | Catalizador potencial | Fecha esperada | Impacto potencial | Evidencia / condición
    |

    |---|---|---|---|

    | Recuperación de tarifas y actividad de banca de inversión | No especificada
    | Positivo si aumenta la actividad y los ingresos mayoristas. | Requiere un entorno
    de mercado más favorable; no se aportan previsiones. |

    | Mejora de eficiencia operativa | No especificada | Positivo si reduce costes
    y mejora la conversión de ingresos en beneficios y capital. | No se detallan iniciativas
    anunciadas de reducción de costes. |

    | Expansión de gestión patrimonial y de activos | No especificada | Positivo si
    aumenta la captación de clientes y activos gestionados. | No se aportan datos
    de flujos, activos bajo gestión o márgenes por segmento. |

    | Mejora de generación de efectivo o cobertura de intereses | Sin fecha; condición
    de seguimiento | Podría reducir la percepción de riesgo y apoyar una reevaluación
    de la valoración. | DDD la identifica como condición que podría cambiar la percepción
    del mercado; no es un evento anunciado. |


    ## 8. Marco de Valoración


    La valoración no puede establecerse de forma robusta con los datos disponibles.
    AOIF registra un PER de 10,05, pero indica que debe contrastarse con la fecha,
    los beneficios normalizados, el capital regulatorio, la rentabilidad sostenible
    y la política de distribución. También clasifica el margen de seguridad como **insuficiente**
    y señala que el valor intrínseco no es estimable con la información suministrada.


    Para una entidad financiera, conviene dar prioridad a métodos y variables que
    reflejen beneficios y capital, en lugar de depender de métricas empresariales
    generales:


    - PER sobre beneficios normalizados, con ajuste por ciclo de mercado.

    - Relación entre precio y valor contable o capital, una vez verificados los datos
    correspondientes.

    - Retorno sobre capital y capacidad de generar capital regulatorio.

    - Dividendos y recompras frente a la capacidad de distribución y necesidades de
    capital.


    AOIF registra EV/EBITDA y FCF yield como cero, pero advierte que estas métricas
    no son especialmente informativas para el negocio y no deben interpretarse como
    estimaciones de valor.


    DDD informa un precio de 9,38 USD y un consenso de 10,64 USD, ambos sin fecha
    específica en el material. El descuento implícito frente al consenso no basta
    para concluir que NMR está infravalorada. DDD plantea, como hipótesis bajista,
    que el mercado podría estar sobrevalorando la conversión del crecimiento de ingresos
    en rentabilidad sostenible.


    **Sensibilidad cualitativa:**


    - **Escenario favorable:** mejora de actividad, tarifas y eficiencia; recuperación
    de la generación de capital y resultados normalizados.

    - **Escenario intermedio:** ingresos sensibles al ciclo, con avances limitados
    de eficiencia y rentabilidad.

    - **Escenario adverso:** caída de actividad, pérdidas de negociación o costes
    de riesgo elevados, junto con persistencia de los indicadores financieros desfavorables
    reportados.


    No hay datos suficientes para asignar probabilidades, estimar valores por escenario
    o calcular un precio objetivo propio.


    ## 9. Preguntas Abiertas y Agenda de Investigación


    1. ¿Cuál es el periodo, la fuente primaria y la definición de las cifras de crecimiento
    de ingresos, margen operativo, ROIC y PER reportadas por AOIF?

    2. ¿Qué estados financieros y componentes sustentan el FCF TTM de -7,54B USD y
    cómo debe interpretarse en el contexto de los flujos de una entidad financiera?

    3. ¿Cómo se calcula la cobertura de intereses reportada como cero y qué gastos
    o ingresos incluye?

    4. ¿Cuáles son las proyecciones de EBITDA para los próximos años? La pregunta
    figura en DDD, pero la métrica debe evaluarse teniendo en cuenta la naturaleza
    financiera del negocio.

    5. ¿Existe un plan anunciado de reestructuración de deuda? ¿Qué obligaciones,
    vencimientos y fuentes de financiación son pertinentes?

    6. ¿Qué iniciativas de reducción de costes se están implementando y cuáles son
    sus objetivos, plazos y costes de ejecución?

    7. ¿Cómo se distribuyen los ingresos, beneficios y activos entre Wealth Management,
    Investment Management y Wholesale?

    8. ¿Cuál es la evolución de activos bajo gestión, entradas y salidas de clientes,
    comisiones y márgenes por segmento?

    9. ¿Cuáles son el capital regulatorio, la calidad de activos, las exposiciones
    a contrapartes y las necesidades de capital?

    10. ¿Qué historial tienen las recompras, dividendos y otras decisiones de asignación
    de capital?

    11. ¿Qué participación accionarial poseen los insiders y cómo se vincula la remuneración
    ejecutiva con resultados de largo plazo?

    12. ¿Quiénes integran el consejo de administración y cuáles son su independencia,
    experiencia y funciones de supervisión?

    13. ¿Cuál es la fecha y composición del consenso de precio objetivo de 10,64 USD
    reportado por DDD?

    14. ¿Qué comparables de [[JPM]], [[C]], [[HSBC]], [[MUFG]] y [[MFG]] son adecuados
    una vez ajustados por segmento, geografía, capital y exposición a mercados?


