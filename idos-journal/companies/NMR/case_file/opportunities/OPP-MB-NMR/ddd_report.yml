    ambos periodos.


    ## 4. Management y Gobierno Corporativo


    La evaluación de AOIF califica la calidad del management como **regular**, la
    asignación de capital como **neutral** y el alineamiento de insiders como **débil**.
    Son valoraciones de investigación no corroboradas en el material aportado: no
    se incluyen resultados frente a objetivos, remuneración, propiedad de insiders
    ni ejemplos concretos de decisiones de asignación de capital.


    No hay información disponible sobre composición, independencia, experiencia o
    comités del consejo de administración. Por tanto, la calidad del liderazgo y la
    supervisión corporativa no pueden evaluarse de forma concluyente.


    ## 5. Tesis de Inversión


    **Tesis por investigar:** los negocios de gestión patrimonial, gestión de inversiones
    y banca mayorista podrían sostener crecimiento rentable si las relaciones con
    clientes, la escala y el acceso a mercados se traducen en ingresos recurrentes
    y retornos adecuados. La evidencia disponible no confirma todavía esa condición.


    Elementos que podrían respaldar el caso:

    - El resumen de StockAnalysis indica un aumento de ingresos en `revenue_history`
    entre FY 2023 y FY 2026. Sin cifras comparables por segmento, esto no demuestra
    crecimiento orgánico, recurrencia ni rentabilidad incremental. Fuente: [StockAnalysis,
    estados financieros de NMR](https://stockanalysis.com/stocks/nmr/financials/),
    ejercicios FY 2023–FY 2026.

    - El paquete reporta momentum positivo a 12 meses de 31,7416%. Es una señal de
    mercado, no evidencia de mejora fundamental.

    - El precio objetivo medio reportado por YFinance es USD 10,642, superior al precio
    de USD 9,38 observado el 2026-10-30. El consenso se observó el 2026-11-21; los
    extremos alto y bajo figuran como 0 y no son utilizables. No se aporta la metodología
    del consenso.


    **Clasificación actual:** investigación pendiente. La evidencia financiera disponible
    es insuficiente para validar crecimiento sostenible, retornos sobre capital o
    creación de valor. El score general del paquete DDD es 38, pero no se especifica
    una escala o metodología que permita interpretarlo como estimación autónoma de
    calidad o valor.


    ## 6. Riesgos y Contra-Tesis


    **Caso bajista:** el momentum de la acción podría no reflejar una mejora duradera
    de beneficios. La exposición a mercados puede producir volatilidad en ingresos
    y resultados, mientras que los datos disponibles no permiten verificar la conversión
    de beneficios en caja, el apalancamiento neto sobre EBITDA ni la dilución.


    | Riesgo | Evidencia o limitación | Posible consecuencia |

    |---|---|---|

    | Ciclo de mercado | La actividad de negociación, emisiones, asesoría y operaciones
    corporativas puede debilitarse en ciclos desfavorables. | Menores ingresos y beneficios
    en las actividades expuestas a mercados. |

    | Riesgo financiero y de mercado | AOIF identifica como riesgos las pérdidas por
    posiciones de mercado, crédito, contraparte o liquidez. | Pérdidas, mayor volatilidad
    o presión de liquidez. |

    | Flujo de caja libre negativo | StockAnalysis reporta FCF negativo en TTM y FY
    2023–FY 2026; no se identifica una causa verificable. | Dificultad para interpretar
    la generación de caja sin datos de inversión y necesidades propias del negocio.
    |

    | Inconsistencia de ingresos | `revenue_history` TTM y `revenue_ttm` difieren
    para el 2026-09-30. | Riesgo de análisis erróneo de crecimiento si no se aclaran
    periodos, escalas y definiciones. |

    | Dilución | La dilución interanual no está disponible. | No es posible evaluar
    el efecto de la evolución de acciones sobre el valor por acción. |

    | Valoración | No hay inputs suficientes para una valoración propia; los extremos
    del consenso son inválidos. | No puede determinarse si el precio incorpora expectativas
    excesivas o insuficientes. |


    **Falsadores de la tesis**

    - Resultados posteriores que muestren deterioro persistente de ingresos o beneficio
    neto frente a las series históricas disponibles.

    - Evidencia comparable de flujos de caja persistentemente negativos sin una explicación
    verificable de inversión o de necesidades propias del negocio.


