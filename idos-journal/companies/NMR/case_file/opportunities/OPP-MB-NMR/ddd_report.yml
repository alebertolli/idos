    series de ingresos.


    **Sensibilidad cualitativa**

    - Una recuperación sostenible de beneficios, con datos verificables de rentabilidad
    por segmento y generación de caja, podría respaldar una valoración mayor.

    - Una caída de la actividad de mercados, pérdidas financieras o deterioro persistente
    de beneficios podría reducirla.

    - No se presentan objetivos de precio propios ni escenarios cuantitativos porque
