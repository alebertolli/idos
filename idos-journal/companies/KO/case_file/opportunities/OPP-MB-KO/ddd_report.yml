    | ROIC | 20,62% | Período no especificado | AOIF; faltan definición, inputs y
    comparación histórica. |

    | Current ratio | 1,38 | 2026-10-02 | Fuente reportada: [Stock Analysis](https://stockanalysis.com/stocks/KO/statistics/).
    No cruza el umbral de alerta indicado (<0,5). |

    | Crecimiento del FCF | No disponible | TTM al 2026-10-02 frente a FY 2025 | No
    calculado: períodos no comparables y falta una observación homogénea. |

    | Conversión a FCF | No disponible | — | No se proporcionaron cifras suficientes
    de flujo operativo y capex para calcularla. |

    | CAGR de ingresos a 3 años | No disponible | Hasta 2025-12-31 | No calculado
