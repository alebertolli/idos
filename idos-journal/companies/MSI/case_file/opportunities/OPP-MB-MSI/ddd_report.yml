  - FCF reportado de 2,534 millones TTM y beneficio neto de 2,084 millones TTM al
    2026-10-03; fuente Stock Analysis, https://stockanalysis.com/stocks/msi/financials/.
  - Precio USD 491.53 al 2026-10-30; fuente Yahoo Finance, https://finance.yahoo.com/quote/MSI/.
