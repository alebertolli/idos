  business_model: Motorola Solutions, Inc. provides public safety, government, defense,
    and enterprise security solutions in the United States, the United Kingdom, Canada,
    and internationally. It operates in two segments, Products and Systems Integration,
    and Software and Services. The Products and Systems Integration segment offers
    a portfolio of infrastructure, devices, accessories, and the implementation and
    integration of systems, devices, software, and applications for government, including
    defense, public safety, and enterprise customers who operate private communications
    systems and video security solutions, as well as manage a mobile workforce. This
    segment also provides mission critical networks, and video security and access
    control technologies, including two-way portable and vehicle-mounted radios, video
    cameras, and accessories; communications network core and central processing software,
    base stations, consoles, and repeaters; and video analytics, network video management
    hardware and software, and access control solutions. The Software and Services
    segment offers public safety and enterprise command center, unified communications
    applications, mobile video equipment, and video software solutions; repair, technical
    support, and maintenance services; and monitoring, software updates, and cybersecurity
    services to government, public safety, and commercial communications networks.
    It serves hospitality; manufacturing; military and defence; police; air transportation;
    fire and rescue; stadium; emergency medical services; mining; oil and gas; transportation
    and logistics; utilities; education; retail; and healthcare industries. The company
    was formerly known as Motorola, Inc. and changed its name to Motorola Solutions,
    Inc. in January 2011. Motorola Solutions, Inc. was founded in 1928 and is headquartered
    in Chicago, Illinois.
