prompt_inputs:
  business_model: 'Phillips 66 operates as an integrated downstream energy provider
    in the United States, the United Kingdom, Germany, and internationally. It operates
    through five segments: Midstream, Chemicals, Refining, Marketing and Specialties
    (M&S), and Renewable Fuels. The Midstream segment provides crude oil and refined
    petroleum product transportation, terminaling, and storage services, as well as
    natural gas and natural gas liquids (NGL) gathering, processing, transportation,
    fractionation, storage and marketing services. It also exports liquefied petroleum
    gas. The Chemicals segment produces and markets ethylene and other olefin products;
    aromatics and styrenics products, such as benzene, cyclohexane, styrene, and polystyrene;
    various specialty chemical products, including organosulfur chemicals, solvents,
    catalysts, and chemicals used in drilling and mining; and petrochemicals and plastics.
    The Refining segment refines crude oil and other feedstocks into petroleum products,
    such as gasolines and distillates, including aviation fuels. The M&S segment purchases
    for resale and markets refined products, including gasolines, distillates, and
    aviation fuels. This segment also manufactures and markets specialty products,
    such as automotive, commercial, industrial, and specialty lubricants, as well
    as base oils. The Renewable Fuels segment processes renewable feedstocks into
    renewable products, as well as supplies sustainable aviation fuel. This segment
    also procures renewable feedstocks, manages certain regulatory credits, and markets
    renewable diesel, renewable jet fuel, and other renewable fuels. The company markets
    its products under the Phillips 66, Conoco and 76, JET, Kendall, Red Line, and
    other private label brands. Phillips 66 was founded in 1875 and is headquartered
    in Houston, Texas.'
