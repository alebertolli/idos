name: IDOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic pyyaml typer rich requests beautifulsoup4 lxml yfinance schedule python-telegram-bot aiofiles
      - name: Run tests
        run: |
          pip install -e idos-core
          python -m pytest idos-core/tests/ -v
