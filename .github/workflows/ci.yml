name: IDOS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e idos-core
          pip install pytest
      - name: Build and validate distributable
        run: |
          python -m pip wheel ./idos-core --no-deps --wheel-dir /tmp/idos-wheels
          python scripts/check_wheel_contents.py /tmp/idos-wheels/idos_core-*.whl
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest idos-core/tests/ -v 2>&1 | tee /tmp/ci_test_output.log
      - name: 🐛 Report failure as GitHub Issue
        if: failure()
        run: |
          export IDOS_ERROR_SUMMARY="$(tail -200 /tmp/ci_test_output.log 2>/dev/null || true)"
          python -m idos.workers.automation.gha_error_reporter
