name: IDOS CI

on:
  workflow_dispatch:
    inputs:
      openai_smoke:
        description: "One bounded real OpenAI request with synthetic data"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  openai-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.openai_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e idos-core
      - name: One real bounded request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IDOS_LLM_TIMEOUT: "30"
        run: python scripts/smoke_openai.py --output /tmp/openai-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openai-smoke-${{ github.run_id }}
          path: /tmp/openai-smoke.json
          if-no-files-found: error
  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.openai_smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e idos-core
          pip install pytest
      - name: Build and validate distributable
        run: |
          python -m pip wheel ./idos-core --no-deps --wheel-dir /tmp/idos-wheels
          python scripts/check_wheel_contents.py /tmp/idos-wheels/idos_core-*.whl
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest idos-core/tests/ -v 2>&1 | tee /tmp/ci_test_output.log
      - name: 🐛 Report failure as GitHub Issue
        if: failure()
        run: |
          export IDOS_ERROR_SUMMARY="$(tail -200 /tmp/ci_test_output.log 2>/dev/null || true)"
          python -m idos.workers.automation.gha_error_reporter
