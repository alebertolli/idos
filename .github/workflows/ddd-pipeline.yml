name: DDD Research Pipeline

on:
  workflow_run:
    workflows: ["Monthly Universe Pipeline"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker específico (vacío = todos)"
        required: false
        type: string
      force:
        description: "Reprocesar cualquier estado (ignora can_transition)"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [quarterly-results]
  schedule:
    - cron: "0 0 2 * *"  # 2do dia de cada mes (post universe)

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  IDOS_TELEGRAM_BOT_TOKEN: ${{ secrets.IDOS_TELEGRAM_BOT_TOKEN }}
  IDOS_TELEGRAM_CHAT_ID: ${{ secrets.IDOS_TELEGRAM_CHAT_ID }}
  IDOS_SMTP_HOST: ${{ secrets.IDOS_SMTP_HOST }}
  IDOS_SMTP_PORT: ${{ secrets.IDOS_SMTP_PORT }}
  IDOS_SMTP_USER: ${{ secrets.IDOS_SMTP_USER }}
  IDOS_SMTP_PASS: ${{ secrets.IDOS_SMTP_PASS }}
  IDOS_FROM_ADDR: ${{ secrets.IDOS_FROM_ADDR }}
  IDOS_TO_ADDR: ${{ secrets.IDOS_TO_ADDR }}

jobs:
  ddd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e idos-core

      - name: Set run context
        run: |
          TICKER="${{ github.event.inputs.ticker || github.event.client_payload.ticker || '' }}"
          echo "TICKER=$TICKER" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "FORCE=true" >> $GITHUB_ENV
            echo "EVENT_TYPE=${{ github.event.action }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "FORCE=${{ github.event.inputs.force || 'false' }}" >> $GITHUB_ENV
            echo "EVENT_TYPE=manual" >> $GITHUB_ENV
          else
            echo "FORCE=false" >> $GITHUB_ENV
            echo "EVENT_TYPE=monthly" >> $GITHUB_ENV
          fi
          echo "[CTX] trigger=${{ github.event_name }} ticker=$TICKER force=$FORCE event=$EVENT_TYPE"

      - name: STEP 2 - ResearchWorker (DDD + AOIF + Hypothesis)
        run: |
          python -c "
          import sys, os, yaml, json
          from pathlib import Path
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None

          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          journal = Path('idos-journal')
          ticker_filter = os.environ.get('TICKER', '')
          force = os.environ.get('FORCE', 'false').lower() == 'true'
          event_type = os.environ.get('EVENT_TYPE', 'monthly')

          if force and not ticker_filter:
              print('[DDD] Force mode requires a ticker, falling back to DISCOVERED only')
              force = False

          opportunities = []
          companies_dir = journal / 'companies'
          if companies_dir.exists():
              for d in sorted(companies_dir.iterdir()):
                  if not d.is_dir():
                      continue
                  ticker = d.name
                  if ticker_filter and ticker.upper() != ticker_filter.upper():
                      continue
                  opp_dir = d / 'case_file' / 'opportunities'
                  if not opp_dir.exists():
                      continue
                  for opp in sorted(opp_dir.iterdir()):
                      if not opp.is_dir():
                          continue
                      yf = opp / 'opportunity.yml'
                      if not yf.exists():
                          continue
                      try:
                          data = yaml.safe_load(yf.read_text(encoding='utf-8'))
                          if data:
                              if force or data.get('status') in ('DISCOVERED', 'WATCHLIST'):
                                  opportunities.append({
                                      'opp_id': data['id'],
                                      'ticker': data['ticker'].upper(),
                                      'score': data.get('conviction', {}).get('overall', 0),
                                      'current_status': data.get('status', 'UNKNOWN'),
                                  })
                      except Exception as e:
                          print(f'[DDD] Error reading {yf}: {e}')

          if not opportunities:
              if force and ticker_filter:
                  print(f'[DDD] Force mode for {ticker_filter} but no opportunity found, creating one on the fly')
                  from idos.data.sqlite import SQLiteStore
                  from idos.data.journal import JournalRepository
                  from datetime import datetime
                  from idos.timezone import AR_TZ
                  existing_opps = SQLiteStore('idos.db').list_opportunities()
                  seq = len(existing_opps) + 1
                  new_opp_id = f'OPP-{datetime.now(AR_TZ).strftime(\"%Y%m%d\")}-{seq:03d}'
                  now = datetime.now(AR_TZ).isoformat()
                  new_opp = {
                      'id': new_opp_id,
                      'ticker': ticker_filter.upper(),
                      'status': 'DISCOVERED',
                      'conviction': {'overall': 0},
                      'created_at': now,
                      'updated_at': now,
                  }
                  jr = JournalRepository(journal)
                  jr.save_opportunity(ticker_filter.upper(), new_opp)
                  SQLiteStore('idos.db').save_opportunity(new_opp)
                  opportunities.append({
                      'opp_id': new_opp_id,
                      'ticker': ticker_filter.upper(),
                      'score': 0,
                      'current_status': 'DISCOVERED',
                  })
                  print(f'[DDD] Created new opportunity {new_opp_id} for {ticker_filter.upper()}')
              else:
                  print('[DDD] No DISCOVERED opportunities to process')
                  Path('cache/ddd_results.json').write_text(json.dumps({'processed': [], 'assessments': [], 'errors': [], 'status': 'none', 'event_type': event_type, 'force': force}), encoding='utf-8')
                  exit(0)

          labels = 'FORCE' if force else 'DISCOVERED'
          print(f'[DDD] Found {len(opportunities)} {labels} opportunities')

          from idos.workers.ai.research_worker import ResearchWorker
          from idos.data.sqlite import SQLiteStore
          from idos.models.enums import OpportunityStatus

          processed = []
          errors = []

          for opp in opportunities:
              ticker = opp['ticker']
              opp_id = opp['opp_id']
              cur_status = opp['current_status']
              print(f'\n[STEP 2] {\"FORCE\" if force else \"NORMAL\"} {ticker} ({opp_id}) status={cur_status}...')

              try:
                  db = SQLiteStore('idos.db')
                  existing = db.get_opportunity(opp_id)
                  if not existing:
                      db.save_opportunity({
                          'id': opp_id,
                          'ticker': ticker,
                          'status': OpportunityStatus.DISCOVERED,
                          'conviction': {'overall': opp['score']},
                      })

                  from idos.ai.service import LLMService
                  _mp = Path('idos-config/models.yml')
                  _llm_svc = LLMService(str(_mp)) if _mp.exists() else LLMService()
                  worker = ResearchWorker({
                      'llm_service': _llm_svc,
                      'prompts_path': 'idos-config/prompts',
                  })
                  ctx = {
                      'ticker': ticker,
                      'opp_id': opp_id,
                      'base_path': os.environ.get('GITHUB_WORKSPACE', '.'),
                  }
                  if force:
                      ctx['force_reprocess'] = True
                      ctx['event_type'] = event_type
                  r = worker.execute(ctx)
                  if r.status == 'success':
                      output = r.output
                      status = output.get('status', 'completed')
                      print(f'[STEP 2] {ticker}: {status}')
                      processed.append({
                          'ticker': ticker, 'opp_id': opp_id,
                          'status': status, 'score': output.get('score', 0),
                          'classification': output.get('classification', ''),
                          'force': force,
                          'event_type': event_type,
                      })
                  else:
                      print(f'[STEP 2] {ticker}: FAILED - {r.error}')
                      errors.append({'ticker': ticker, 'error': r.error})

              except Exception as e:
                  print(f'[STEP 2] {ticker}: ERROR - {e}')
                  errors.append({'ticker': ticker, 'error': str(e)})

          results = {'processed': processed, 'assessments': [], 'errors': errors, 'total': len(opportunities), 'done': len(processed), 'event_type': event_type, 'force': force}
          Path('cache').mkdir(parents=True, exist_ok=True)
          Path('cache/ddd_results.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
          print(f'\n[STEP 2] Done: {len(processed)} processed, {len(errors)} errors')
          "

      - name: STEP 3-7 - Assessment Engines + Conviction + Rules + Board + Entry
        run: |
          python -c "
          import sys, os, json
          from pathlib import Path
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))

          force = os.environ.get('FORCE', 'false').lower() == 'true'

          results_file = 'cache/ddd_results.json'
          if not Path(results_file).exists():
              print('[STEP 3-7] No results file found')
              exit(0)

          results = json.loads(open(results_file, encoding='utf-8').read())
          processed = results.get('processed', [])
          if not processed:
              print('[STEP 3-7] No processed opportunities to assess')
              results['assessments'] = []
              open(results_file, 'w', encoding='utf-8').write(json.dumps(results, indent=2))
              exit(0)

          from idos.decision.assessment_pipeline import run_full_pipeline

          assessments = []
          errors = results.get('errors', [])

          for opp in processed:
              ticker = opp['ticker']
              opp_id = opp['opp_id']
              mode = 'FORCE' if opp.get('force') else 'NORMAL'
              print(f'\n[STEP 3-7] Running assessment pipeline for {ticker} ({opp_id}) [{mode}]...')

              try:
                  result = run_full_pipeline(opp_id, ticker, os.environ.get('GITHUB_WORKSPACE', '.'), force_reprocess=opp.get('force', False))
                  assessments.append(result)
                  print(f'[STEP 3-7] {ticker}: conviction={result.get(\"conviction_score\", \"?\")}, recommendation={result.get(\"recommendation\", \"?\")}')
              except Exception as e:
                  import traceback
                  traceback.print_exc()
                  print(f'[STEP 3-7] {ticker}: ERROR - {e}')
                  errors.append({'ticker': ticker, 'error': str(e)})

          results['assessments'] = assessments
          results['errors'] = errors
          Path('cache').mkdir(parents=True, exist_ok=True)
          open(results_file, 'w', encoding='utf-8').write(json.dumps(results, indent=2))
          print(f'\n[STEP 3-7] Done: {len(assessments)} assessed, {len(errors)} total errors')
          "

      - name: Generate Combined Digest
        run: |
          python -c "
          import sys, os, json
          from pathlib import Path
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))

          results_file = 'cache/ddd_results.json'
          if not Path(results_file).exists():
              print('[DIGEST] No results file found')
              exit(0)

          results = json.loads(open(results_file, encoding='utf-8').read())

          from idos.decision.assessment_pipeline import build_digest
          import yaml
          from datetime import datetime, timezone
          from idos.timezone import AR_TZ

          processed = results.get('processed', [])
          assessments = results.get('assessments', [])
          errors = results.get('errors', [])
          total = results.get('total', 0)

          # Use assessment results if available, else use processed
          items = assessments if assessments else processed
          now = datetime.now(AR_TZ)

          lines = []
          lines.append('# IDOS DDD Research Digest')
          lines.append(f'')
          lines.append(f'_Generado: {now.strftime(\"%Y-%m-%d %H:%M AR\")}_')
          lines.append(f'')
          lines.append('## Resumen')
          lines.append(f'')
          lines.append(f'- 🟢 **Oportunidades procesadas:** {len(processed)}')
          lines.append(f'- ✅ **Assessment completados:** {len(assessments)}')

          approved = sum(1 for a in assessments if isinstance(a, dict) and a.get('board_approved'))
          lines.append(f'- 🔖 **Approved:** {approved}')

          lines.append(f'- 🔴 **Errores:** {len(errors)}')
          lines.append(f'- 📊 **Total encontradas:** {total}')
          lines.append('')

          if processed:
              lines.append('### STEP 2 - Research (DDD + AOIF + Hypothesis)')
              lines.append('')
              for p in processed:
                  if not isinstance(p, dict):
                      continue
                  status = '✅' if p.get('status') == 'completed' else '⚠️'
                  ticker = p.get('ticker', '?')
                  opp_id = p.get('opp_id', '?')
                  lines.append(f'- {status} **{ticker}** ({opp_id}): score={p.get(\"score\", \"?\")}, class={p.get(\"classification\", \"?\")}')
              lines.append('')

          if assessments and isinstance(assessments, list):
              lines.append('### STEP 3-7 - Assessment Pipeline')
              lines.append('')
              for a in assessments:
                  if not isinstance(a, dict):
                      continue
                  ticker = a.get('ticker', '?')
                  opp_id = a.get('opp_id', '?')
                  conv = a.get('conviction_score', '?')
                  rec = a.get('recommendation', '?')
                  board_ok = a.get('board_approved', False)
                  dec_type = a.get('decision_type', '?')
                  ass = a.get('assessments', {})
                  scores = ' | '.join(f'{k.replace(\"AssessmentEngine\", \"\")}: {v}' for k, v in ass.items())

                  status_emoji = '✅' if board_ok else '⚠️'
                  link = f'https://github.com/alebertolli/idos/tree/main/idos-journal/companies/{ticker}/case_file/opportunities/{opp_id}'
                  lines.append(f'- {status_emoji} **{ticker}**')
                  lines.append(f'  - Opp: [{opp_id}]({link})')
                  lines.append(f'  - Conviction: {conv}/100 | Rec: {rec}' + (f' | Dec: {dec_type}' if board_ok else ''))
                  if scores:
                      lines.append(f'  - Scores: {scores}')
                  failed = a.get('rules_failed', [])
                  details = a.get('rules_details', {})
                  if failed:
                      lines.append(f'  - Rules BLOCKED:')
                      for rid in failed:
                          d = details.get(rid, '')
                          lines.append(f'    - 🚫 {rid}: {d}')
              lines.append('')

          if errors:
              lines.append('### Errores')
              lines.append('')
              for e in errors:
                  lines.append(f'- ❌ **{e.get(\"ticker\", \"?\")}**: {e.get(\"error\", \"?\")}')
              lines.append('')

          lines.append('---')
          lines.append('')
          lines.append(f'[Ver detalle en repositorio](https://github.com/alebertolli/idos/tree/main/idos-journal/companies)')

          digest = '\n'.join(lines)
          Path('cache').mkdir(parents=True, exist_ok=True)
          open('cache/weekly_digest.md', 'w', encoding='utf-8').write(digest)
          print(f'[DIGEST] Generated: {len(lines)} lines')
          "

      - name: Monthly Portfolio Report
        run: |
          python -c "
          import sys, os, json, calendar
          from pathlib import Path
          from datetime import date
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          today = date.today()
          last_day = calendar.monthrange(today.year, today.month)[1]
          days_left = last_day - today.day
          if days_left > 2:
              print(f'[REPORT] No es fin de mes ({today.day}/{last_day}, faltan {days_left} dias)')
              exit(0)
          bp = Path(os.environ.get('GITHUB_WORKSPACE', '.'))
          from idos.data.journal import JournalRepository
          from idos.config import load_config
          journal = JournalRepository(bp / 'idos-journal')
          cfg = load_config(bp / 'idos-config' / 'portfolio.yml') or {}
          from idos.workers.portfolio.paper_trader_worker import PaperTraderWorker
          pw = PaperTraderWorker(cfg)
          from idos.timezone import AR_TZ
          from datetime import datetime
          now = datetime.now(AR_TZ)
          pr = pw.execute({'action': 'report', 'report_date': now.isoformat(), 'base_path': str(bp)})
          print(f'[REPORT] Status: {pr.get(\"status\")}, Path: {pr.get(\"report_path\", \"\")}')
          "
      - name: Commit results
        run: |
          git config user.name "idos-bot"
          git config user.email "bot@idos.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: ddd research $(date +%Y-%m-%d)"
            git pull --rebase --autostash -X theirs
            git push
          fi

      - name: Send notifications
        if: success()
        run: |
          python -c "
          import os, json
          digest = open('cache/weekly_digest.md', encoding='utf-8').read()
          results = json.loads(open('cache/ddd_results.json', encoding='utf-8').read())
          
          processed = results.get('processed', [])
          assessments = results.get('assessments', [])
          errors = results.get('errors', [])
          total = results.get('total', 0)
          approved = sum(1 for a in assessments if isinstance(a, dict) and a.get('board_approved'))
          event_type = results.get('event_type', 'monthly')
          force = results.get('force', False)

          if event_type == 'quarterly-results':
              trigger_label = 'Quarterly Results'
          elif event_type == 'manual':
              ticker_label = os.environ.get('TICKER', '')
              trigger_label = f'Manual' + (f' ({ticker_label})' if ticker_label else '')
          else:
              trigger_label = 'Monthly'

          # Build Telegram message (short version)
          lines = []
          lines.append('*IDOS DDD Pipeline*')
          lines.append(f'Trigger: {trigger_label}')
          lines.append('')
          if total == 0:
              lines.append('No se encontraron oportunidades DISCOVERED para procesar')
          else:
              lines.append(f'📊 {total} oportunidades evaluadas')
              lines.append(f'✅ {len(processed)} research completados')
              lines.append(f'🔖 {approved} approved por el board')
              lines.append(f'🔴 {len(errors)} errores')
          lines.append('')
          if assessments and isinstance(assessments, list):
              lines.append('*Resultados:*')
              for a in assessments:
                  if not isinstance(a, dict):
                      continue
                  ticker = a.get('ticker', '?')
                  conv = a.get('conviction_score', '?')
                  rec = a.get('recommendation', '?')
                  dec = a.get('decision_type', '?') if a.get('board_approved') else '-'
                  lines.append(f'- {ticker}: conv={conv}/100, rec={rec}, dec={dec}')
                  failed = a.get('rules_failed', [])
                  details = a.get('rules_details', {})
                  if failed:
                      for rid in failed:
                          d = details.get(rid, '')
                          lines.append(f'  -> {rid}: {d}')
              lines.append('')
          lines.append('[Ver detalle completo en repositorio](https://github.com/alebertolli/idos/tree/main/idos-journal/companies)')
          telegram_msg = '\n'.join(lines)

          # Send Telegram
          token = os.environ.get('IDOS_TELEGRAM_BOT_TOKEN', '')
          chat = os.environ.get('IDOS_TELEGRAM_CHAT_ID', '')
          if token and chat:
              from idos.workers.notifications.telegram import TelegramNotifier
              t = TelegramNotifier({'bot_token': token, 'chat_id': chat})
              t.execute({'message': telegram_msg[:4000], 'parse_mode': 'Markdown'})
              print('[NOTIFY] Telegram sent')
          else:
              print('[NOTIFY] Telegram not configured')

          # Send Email
          smtp_host = os.environ.get('IDOS_SMTP_HOST', '')
          if smtp_host:
              try:
                  from idos.workers.notifications.email_notifier import EmailNotifier
                  body_lines = []
                  body_lines.append('IDOS DDD Pipeline Report')
                  body_lines.append('')
                  body_lines.append(f'Total opps: {total}')
                  body_lines.append(f'Research: {len(processed)}')
                  body_lines.append(f'Assessments: {len(assessments)}')
                  body_lines.append(f'Approved: {approved}')
                  body_lines.append(f'Errors: {len(errors)}')
                  body_lines.append('')
                  body_lines.append('Resultados:')
                  for a in (assessments if isinstance(assessments, list) else []):
                      if not isinstance(a, dict):
                          continue
                      t = a.get('ticker', '?')
                      cv = a.get('conviction_score', '?')
                      rc = a.get('recommendation', '?')
                      ba = 'OK' if a.get('board_approved', False) else 'PENDING'
                      body_lines.append(f'- {t}: conv={cv}/100 | rec={rc} | board={ba}')
                      failed = a.get('rules_failed', [])
                      details = a.get('rules_details', {})
                      if failed:
                          for rid in failed:
                              d = details.get(rid, '')
                              body_lines.append(f'    {rid}: {d}')
                      body_lines.append('')
                  body_lines.append('Ver detalle completo:')
                  body_lines.append('https://github.com/alebertolli/idos/tree/main/idos-journal/companies')
                  email_body = chr(10).join(body_lines)
                  e = EmailNotifier()
                  e.execute({'subject': 'IDOS DDD Pipeline Report', 'body': email_body})
                  print('[NOTIFY] Email sent')
              except Exception as email_err:
                  print(f'[NOTIFY] Email error: {email_err}')
          else:
              print('[NOTIFY] Email not configured')
          "

      - name: 🐛 Report failure as GitHub Issue
        if: failure()
        run: python -m idos.workers.automation.gha_error_reporter

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddd-results-${{ github.run_id }}
          path: |
            cache/ddd_results.json
            cache/weekly_digest.md
