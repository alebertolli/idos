name: DDD Research Pipeline

concurrency:
  group: ddd-research-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      allow_production_e2e:
        description: "Opt-in del workflow que llama para permitir una E2E acotada en main"
        required: false
        type: boolean
        default: false
      skip_portfolio_reevaluation:
        description: "Omitir sólo la revisión de cartera; mantener revalidación de tesis y convicción"
        required: false
        type: boolean
        default: true
      trigger_type:
        description: "Contexto del workflow que llama"
        required: false
        type: string
        default: manual
      ticker:
        description: "Símbolo(s) opcional(es) para limitar el análisis del workflow reusable"
        required: false
        type: string
        default: ""
      candidate_tickers:
        description: "Alcance opcional de 1-5 tickers operables para orquestación"
        required: false
        type: string
        default: ""
      strategy_id:
        description: "Limitar Research a una estrategia habilitada"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      allow_production_e2e:
        description: "Allow this bounded manual E2E to write results to main"
        required: false
        type: boolean
        default: false
      ticker:
        description: "Required for a bounded manual run; leave empty only for the hourly ramp seed/resume actions"
        required: false
        type: string
        default: ""
      seed_hourly_ramp:
        description: "Seed the eligible Research queue and start the one-per-hour capacity ramp"
        required: false
        type: boolean
        default: false
      resume_hourly_ramp:
        description: "Resume the paused hourly ramp from its last successful batch size"
        required: false
        type: boolean
        default: false
      strategy_id:
        description: "Optional enabled strategy filter, e.g. MULTIBAGGERS"
        required: false
        type: string
        default: ""
      force:
        description: "Reinvestigar solo oportunidades UNDER_RESEARCH; para nuevas SCREENED usar force=false"
        required: false
        type: boolean
        default: false
      review_buylist:
        description: "Re-investigar la oportunidad exacta de Buy List seleccionada (requiere force=true)"
        required: false
        type: boolean
        default: false
      assessment_only:
        description: "Re-evaluar Assessment determinista de un Research existente, sin volver a investigar"
        required: false
        type: boolean
        default: false
      event_type:
        description: "Evento para re-research configurado por estrategia (usa manual para flujo normal)"
        required: false
        type: choice
        options:
          - manual
          - quarterly_results
          - guidance_change
          - material_restatement
          - red_flag_change
          - material_financial_deterioration
          - thesis_change
        default: manual
      preview_only:
        description: "Solo mostrar candidatos elegibles; no llamar IA, assessment ni persistir cambios"
        required: false
        type: boolean
        default: false
      skip_portfolio_reevaluation:
        description: "Omitir sólo la revisión de cartera; mantener revalidación de tesis y convicción"
        required: false
        type: boolean
        default: false
      event_date:
        description: "Fecha del evento material (YYYY-MM-DD); obligatoria si event_type no es manual"
        required: false
        type: string
      event_source_name:
        description: "Nombre de la fuente de evidencia del evento"
        required: false
        type: string
      event_source_url:
        description: "URL HTTPS de la evidencia del evento"
        required: false
        type: string
      event_summary:
        description: "Resumen verificable del evento; Research debe contrastarlo con fuentes primarias"
        required: false
        type: string
  repository_dispatch:
    types:
      - quarterly-results
      - guidance-change
      - material-restatement
      - red-flag-change
      - material-financial-deterioration
      - thesis-change
  schedule:
    - cron: "0 3 2 * *"  # 00:00 Argentina del día 2 (03:00 UTC)
    - cron: "0 9 */30 * *"  # Cada 30 días, 06:00 Argentina (09:00 UTC)
    - cron: "0 * * * *"  # Reanuda Research pendiente y aumenta el lote de a 1 por hora hasta un fallo

env:
  TZ: America/Argentina/Buenos_Aires
  # GITHUB_TOKEN cannot dispatch a second workflow; use the repo's workflow-scoped PAT for CI handoff.
  GH_TOKEN: ${{ secrets.IDOS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  IDOS_TELEGRAM_BOT_TOKEN: ${{ secrets.IDOS_TELEGRAM_BOT_TOKEN }}
  IDOS_TELEGRAM_CHAT_ID: ${{ secrets.IDOS_TELEGRAM_CHAT_ID }}
  IDOS_SMTP_HOST: ${{ secrets.IDOS_SMTP_HOST }}
  IDOS_SMTP_PORT: ${{ secrets.IDOS_SMTP_PORT }}
  IDOS_SMTP_USER: ${{ secrets.IDOS_SMTP_USER }}
  IDOS_SMTP_PASS: ${{ secrets.IDOS_SMTP_PASS }}
  IDOS_FROM_ADDR: ${{ secrets.IDOS_FROM_ADDR }}
  IDOS_TO_ADDR: ${{ secrets.IDOS_TO_ADDR }}

jobs:
  ddd:
    if: vars.IDOS_DATA_RIGHTS_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Resume scheduled results branch
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_call' && inputs.trigger_type == 'monthly') || inputs.trigger_type == 'monthly' || (github.event_name == 'workflow_dispatch' && (inputs.seed_hourly_ramp || inputs.resume_hourly_ramp))
        run: |
          BRANCH="codex/ddd-research-results"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch -c "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi
          # The results branch may outlive code releases; execute the current main source with its persisted cache.
          git merge --no-edit origin/main

      - name: Validate manual production opt-in and input combinations
        env:
          IDOS_ALLOW_PRODUCTION_E2E: ${{ inputs.allow_production_e2e }}
        run: |
          python scripts/validate_production_dispatch.py
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.assessment_only }}" = "true" ]; then
            if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.review_buylist }}" = "true" ]; then
              echo "::error::assessment_only cannot be combined with force or review_buylist."
              exit 1
            fi
            if [ "${{ inputs.event_type || 'manual' }}" != "manual" ]; then
              echo "::error::assessment_only cannot be combined with a material event trigger."
              exit 1
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.preview_only }}" = "true" ] && [ "${{ inputs.assessment_only }}" = "true" ]; then
            echo "::error::preview_only and assessment_only are mutually exclusive."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e idos-core
      - name: Validate bounded manual candidate scope
        if: github.event_name == 'workflow_dispatch' && inputs.seed_hourly_ramp != true && inputs.resume_hourly_ramp != true
        env:
          IDOS_CANDIDATE_TICKERS: ${{ inputs.candidate_tickers || inputs.ticker || github.event.inputs.ticker || '' }}
          IDOS_MANUAL_SELECTION_LIMIT: "5"
          IDOS_TRIGGER_TYPE: ${{ inputs.trigger_type || github.event.inputs.trigger_type || 'manual' }}
        run: python scripts/validate_manual_candidate_scope.py

      - name: Set run context
        id: run-context
        run: |
          echo "DDD_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          TICKER="${{ inputs.candidate_tickers || inputs.ticker || github.event.inputs.ticker || github.event.client_payload.ticker || '' }}"
          echo "TICKER=$TICKER" >> $GITHUB_ENV
          echo "STRATEGY_ID=${{ inputs.strategy_id || github.event.inputs.strategy_id || '' }}" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.seed_hourly_ramp }}" = "true" ]; then
            echo "FORCE=false" >> $GITHUB_ENV
            echo "REVIEW_BUYLIST=false" >> $GITHUB_ENV
            echo "EVENT_TYPE=monthly" >> $GITHUB_ENV
            echo "DDD_HOURLY_RAMP=true" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.resume_hourly_ramp }}" = "true" ]; then
            echo "FORCE=false" >> $GITHUB_ENV
            echo "REVIEW_BUYLIST=false" >> $GITHUB_ENV
            echo "EVENT_TYPE=monthly" >> $GITHUB_ENV
            echo "RESUME_PENDING=true" >> $GITHUB_ENV
            echo "DDD_HOURLY_RAMP=true" >> $GITHUB_ENV
            echo "RESET_DDD_HOURLY_RAMP=true" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "FORCE=true" >> $GITHUB_ENV
            echo "REVIEW_BUYLIST=false" >> $GITHUB_ENV
            echo "EVENT_TYPE=${{ github.event.action }}" >> $GITHUB_ENV
            echo "DDD_HOURLY_RAMP=true" >> $GITHUB_ENV
          elif [ "${{ inputs.trigger_type }}" = "monthly" ]; then
            echo "FORCE=false" >> $GITHUB_ENV
            echo "REVIEW_BUYLIST=false" >> $GITHUB_ENV
            echo "EVENT_TYPE=monthly" >> $GITHUB_ENV
            echo "DDD_HOURLY_RAMP=true" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "FORCE=${{ inputs.force || github.event.inputs.force || 'false' }}" >> $GITHUB_ENV
            echo "REVIEW_BUYLIST=${{ inputs.review_buylist || github.event.inputs.review_buylist || 'false' }}" >> $GITHUB_ENV
            echo "ASSESSMENT_ONLY=${{ inputs.assessment_only || github.event.inputs.assessment_only || 'false' }}" >> $GITHUB_ENV
            echo "PREVIEW_ONLY=${{ inputs.preview_only || github.event.inputs.preview_only || 'false' }}" >> $GITHUB_ENV
            echo "EVENT_TYPE=${{ inputs.event_type || github.event.inputs.event_type || 'manual' }}" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 * * * *" ]; then
            echo "FORCE=false" >> $GITHUB_ENV
            echo "REVIEW_BUYLIST=false" >> $GITHUB_ENV
            echo "EVENT_TYPE=monthly" >> $GITHUB_ENV
            echo "RESUME_PENDING=true" >> $GITHUB_ENV
            echo "DDD_HOURLY_RAMP=true" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 9 */30 * *" ]; then
            echo "FORCE=true" >> $GITHUB_ENV
            echo "REVIEW_BUYLIST=false" >> $GITHUB_ENV
            echo "EVENT_TYPE=re-research-30d" >> $GITHUB_ENV
            echo "DDD_HOURLY_RAMP=true" >> $GITHUB_ENV
          else
            echo "FORCE=false" >> $GITHUB_ENV
            echo "REVIEW_BUYLIST=false" >> $GITHUB_ENV
            echo "EVENT_TYPE=monthly" >> $GITHUB_ENV
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then echo "DDD_HOURLY_RAMP=true" >> $GITHUB_ENV; fi
          fi
          echo "[CTX] trigger=${{ github.event_name }} ticker=$TICKER strategy=${{ inputs.strategy_id || github.event.inputs.strategy_id || 'all' }} force=$FORCE assessment_only=${{ github.event.inputs.assessment_only || 'false' }} preview_only=${{ github.event.inputs.preview_only || 'false' }} event=$EVENT_TYPE"

      - name: Preview candidates
        if: github.event.inputs.assessment_only != 'true' && github.event.schedule != '0 * * * *' && github.event.inputs.resume_hourly_ramp != 'true'
        run: python scripts/ddd_research.py --preview

      - name: STEP 2 - ResearchWorker (DDD + AOIF + Hypothesis)
        id: research
        if: github.event.inputs.assessment_only != 'true' && github.event.inputs.preview_only != 'true'
        run: python scripts/ddd_research.py

      - name: STEP 3-7 - Assessment Engines + Conviction + Rules + Board + Entry
        if: github.event.inputs.preview_only != 'true'
        env:
          REASSESS_EXISTING: ${{ inputs.assessment_only || false }}
        run: python scripts/ddd_assessment.py

      - name: STEP 8 - Monthly Re-Assessment (Thesis + Conviction + Portfolio)
        if: github.event.inputs.assessment_only != 'true' && github.event.inputs.preview_only != 'true' && github.event.schedule != '0 * * * *'
        env:
          SKIP_PORTFOLIO_REVIEW: ${{ inputs.skip_portfolio_reevaluation || github.event.inputs.skip_portfolio_reevaluation || false }}
        run: python scripts/ddd_monthly.py

      - name: Generate Combined Digest
        if: github.event.inputs.preview_only != 'true'
        run: python scripts/ddd_digest.py

      - name: Commit results
        id: publish-results
        if: always() && steps.run-context.outcome == 'success' && github.event.inputs.preview_only != 'true'
        run: |
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_call" ] || [ "${{ inputs.trigger_type }}" = "monthly" ] || [ "${{ inputs.seed_hourly_ramp }}" = "true" ] || [ "${{ inputs.resume_hourly_ramp }}" = "true" ]; then TARGET_BRANCH="codex/ddd-research-results"; fi
          if [ -z "$TARGET_BRANCH" ]; then
            echo "::error::No target branch resolved; refusing to publish DDD results"
            exit 1
          fi
          git config user.name "idos-bot"
          git config user.email "bot@idos.local"
          git add cache/ddd_results.json cache/ddd_preview.json cache/ddd_research_resume.json cache/ddd_research_capacity.json cache/weekly_digest.md cache/monthly_reassessment.json 2>/dev/null || true
          git add idos-journal/ 2>/dev/null || true
          git add idos-knowledge/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: ddd research $(date +%Y-%m-%d)"
          # Research writes transient caches beyond the committed deliverables.
          git stash push --include-untracked -m 'ddd transient outputs before results push'
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort
              echo "[ERROR] DDD could not rebase onto origin/$TARGET_BRANCH. Refusing to publish results."
              exit 1
            fi
          fi
          if ! git push origin "HEAD:$TARGET_BRANCH"; then
            echo "[ERROR] Push to origin/$TARGET_BRANCH failed. DDD results were not published."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify immediately on Research failure
        if: failure() && steps.research.outcome == 'failure'
        continue-on-error: true
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_ddd_failure.py

      - name: Open or update scheduled results PR and enable auto-merge
        if: always() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_call' && inputs.trigger_type == 'monthly') || inputs.trigger_type == 'monthly' || (github.event_name == 'workflow_dispatch' && (inputs.seed_hourly_ramp || inputs.resume_hourly_ramp))) && github.event.inputs.preview_only != 'true' && steps.publish-results.outputs.changed == 'true'
        run: |
          gh pr view codex/ddd-research-results --json number >/dev/null 2>&1 || \
            gh pr create --base main --head codex/ddd-research-results --title "chore: publish scheduled DDD results" --body "Publishes queued Research results and resumable work from the scheduled DDD pipeline."
          PREVIOUS_RUN_ID=$(gh run list --workflow ci.yml --branch codex/ddd-research-results --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          gh workflow run ci.yml --ref codex/ddd-research-results
          RUN_ID=""
          for attempt in {1..24}; do
            RUN_ID=$(gh run list --workflow ci.yml --branch codex/ddd-research-results --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$PREVIOUS_RUN_ID" ]; then break; fi
            RUN_ID=""
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then echo "::error::CI workflow_dispatch did not appear"; exit 1; fi
          gh run watch "$RUN_ID" --exit-status
          gh pr merge codex/ddd-research-results --auto --squash

      - name: Collect current DDD decision package
        id: collect-artifact
        if: always() && steps.run-context.outcome == 'success' && github.event.inputs.preview_only != 'true'
        run: |
          args=(--base-path . --tickers "$TICKER" --started-at "$DDD_RUN_STARTED_AT" --output-dir cache/ddd-artifact)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$TICKER" ]; then
            args+=(--require-output)
          fi
          python scripts/collect_ddd_artifacts.py "${args[@]}"

      - name: Upload artifact
        if: always() && steps.collect-artifact.outcome == 'success' && github.event.inputs.preview_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ddd-results-${{ github.run_id }}
          path: cache/ddd-artifact/
          if-no-files-found: error

      - name: Notify on downstream pipeline failure
        if: failure() && steps.research.outcome != 'failure' && steps.run-context.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_ddd_failure.py

      - name: Upload candidate preview
        if: github.event.inputs.preview_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ddd-preview-${{ github.run_id }}
          path: cache/ddd_preview.json
