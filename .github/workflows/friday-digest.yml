name: Friday Weekly Digest

on:
  schedule:
    - cron: "0 18 * * 5"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      IDOS_TELEGRAM_BOT_TOKEN: ${{ secrets.IDOS_TELEGRAM_BOT_TOKEN }}
      IDOS_TELEGRAM_CHAT_ID: ${{ secrets.IDOS_TELEGRAM_CHAT_ID }}
      IDOS_SMTP_HOST: ${{ secrets.IDOS_SMTP_HOST }}
      IDOS_SMTP_PORT: ${{ secrets.IDOS_SMTP_PORT }}
      IDOS_SMTP_USER: ${{ secrets.IDOS_SMTP_USER }}
      IDOS_SMTP_PASS: ${{ secrets.IDOS_SMTP_PASS }}
      IDOS_FROM_ADDR: ${{ secrets.IDOS_FROM_ADDR }}
      IDOS_TO_ADDR: ${{ secrets.IDOS_TO_ADDR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e idos-core
      - name: Run scout
        run: |
          python -c "
          import sys; sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          from idos.workers.data.scout_worker import ScoutWorker
          from pathlib import Path
          import os, json
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          w = ScoutWorker({'universe_path': 'idos-journal/portfolio/watchlist.yml', 'journal_path': 'idos-journal'})
          r = w.execute({'force_refresh': True})
          print(f'Scout status: {r.status}')
          results = [res for res in r.output.get('results', []) if res.get('scout_score', 0) >= 50]
          print(f'Passed scout: {len(results)} tickers')
          Path('cache').mkdir(parents=True, exist_ok=True)
          with open('cache/scout_results.json', 'w') as f:
              json.dump({'results': results, 'generated_at': r.output.get('generated_at', '')}, f)
          "
      - name: Generate digest
        run: |
          python -c "
          import sys; sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          from idos.workers.data.digest_worker import DigestWorker
          from pathlib import Path
          import os, json, yaml
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          scout_file = Path('cache/scout_results.json')
          scout_data = json.loads(scout_file.read_text()) if scout_file.exists() else {'results': []}
          positions = []
          pos_dir = Path('idos-journal/portfolio/positions')
          if pos_dir.exists():
              for f in pos_dir.glob('*.yml'):
                  data = yaml.safe_load(f.read_text())
                  if data:
                      positions.append(data)
          w = DigestWorker()
          r = w.execute({
              'scout_results': scout_data.get('results', []),
              'risk_alerts': [],
              'opportunities': [],
              'positions': positions,
          })
          Path('cache').mkdir(parents=True, exist_ok=True)
          with open('cache/weekly_digest.md', 'w') as f:
              f.write(r.output.get('digest', ''))
          print(f'Digest generated: {r.output.get(\"line_count\", 0)} lines')
          "
      - name: Commit results
        run: |
          git config user.name "idos-bot"
          git config user.email "bot@idos.local"
          git add idos-journal/portfolio/watchlist.yml idos-journal/portfolio/positions/ cache/weekly_digest.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly digest $(date +%Y-%m-%d)"
            git pull --rebase --autostash -X theirs
            git push
          fi
      - name: Send notifications
        run: |
          python -c "
          import os
          digest_text = open('cache/weekly_digest.md').read()
          # Telegram
          token = os.environ.get('IDOS_TELEGRAM_BOT_TOKEN')
          chat = os.environ.get('IDOS_TELEGRAM_CHAT_ID')
          if token and chat:
              from idos.workers.notifications.telegram import TelegramNotifier
              t = TelegramNotifier({'bot_token': token, 'chat_id': chat})
              t.execute({'message': digest_text[:4000]})
              print('Digest sent via Telegram')
          # Email
          smtp_host = os.environ.get('IDOS_SMTP_HOST')
          if smtp_host:
              from idos.workers.notifications.email_notifier import EmailNotifier
              e = EmailNotifier({
                  'smtp_host': smtp_host,
                  'smtp_port': os.environ.get('IDOS_SMTP_PORT', '587'),
                  'smtp_user': os.environ.get('IDOS_SMTP_USER'),
                  'smtp_pass': os.environ.get('IDOS_SMTP_PASS'),
                  'from_addr': os.environ.get('IDOS_FROM_ADDR'),
                  'to_addr': os.environ.get('IDOS_TO_ADDR'),
              })
              e.execute({'subject': 'IDOS Weekly Digest', 'body': digest_text})
              print('Digest sent via Email')
          "
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest-${{ github.run_id }}
          path: cache/weekly_digest.md
