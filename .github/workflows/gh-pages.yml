name: GitHub Pages — IDOS UI

on:
  workflow_run:
    workflows:
      - Daily Data Refresh
      - DDD Research Pipeline
      - Monthly Universe Pipeline
      - Monthly Rebalance
      - Friday Weekly Digest
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'idos-journal/**'
      - 'idos-knowledge/**'
      - 'idos-config/ui.yml'
      - 'idos-core/idos/site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e idos-core
      - name: Build static site
        run: |
          python -m idos.site.builder . 30
          ls -la site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4