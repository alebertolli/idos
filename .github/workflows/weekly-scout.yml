name: Weekly Scout

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      IDOS_TELEGRAM_BOT_TOKEN: ${{ secrets.IDOS_TELEGRAM_BOT_TOKEN }}
      IDOS_TELEGRAM_CHAT_ID: ${{ secrets.IDOS_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e idos-core
      - name: Run scout
        run: |
          python -c "
          import sys; sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          from idos.workers.data.scout_worker import ScoutWorker
          import os
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          w = ScoutWorker({'universe_path': 'idos-config/universe/watchlist.md', 'journal_path': 'idos-journal'})
          r = w.execute({'force_refresh': True})
          print(f'=== SCOUT COMPLETE ===')
          print(f'Status: {r.status}')
          print(f'Screened: {r.output.get(\"tickers_screened\", 0)}')
          print(f'Passed: {r.output.get(\"passed_count\", 0)}')
          if r.status == 'failed':
              print(f'Error: {r.error}')
          for res in r.output.get('results', []):
              print(f\"  {res['ticker']}: score={res['scout_score']} rank={res['rank']} reason={res['reason']}\")
          import json
          os.makedirs('cache', exist_ok=True)
          with open('cache/scout_results.json', 'w') as f:
              json.dump({'results': r.output.get('results', []), 'generated_at': str(os.environ.get('GITHUB_RUN_ID', ''))}, f)
          "
      - name: Save & commit results
        run: |
          python -c "
          import os, json
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          wl = 'idos-journal/portfolio/watchlist.yml'
          if os.path.exists(wl):
              print(f'{wl} exists ({os.path.getsize(wl)} bytes)')
          else:
              print(f'{wl} NOT FOUND — creating empty')
              os.makedirs('idos-journal/portfolio', exist_ok=True)
              with open(wl, 'w') as f:
                  json.dump({'entries': []}, f)
          import glob
          for f in sorted(glob.glob('idos-journal/**/*', recursive=True) + glob.glob('cache/*')):
              print(f'  {f} ({os.path.getsize(f)} bytes)' if os.path.isfile(f) else f'  {f}/')
          "
          git config user.name "idos-bot"
          git config user.email "bot@idos.local"
          mkdir -p cache
          touch cache/scout_results.json
          git add idos-journal/portfolio/watchlist.yml 2>&1 || echo "add watchlist failed: $?"
          git add cache/scout_results.json 2>&1 || echo "add cache failed: $?"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            git status --short -- idos-journal/ cache/
          else
            git status --short -- idos-journal/ cache/
            git commit -m "chore: weekly scout results $(date +%Y-%m-%d)"
            git push
          fi
      - name: Notify
        run: |
          python -c "
          import os, json
          from idos.workers.notifications.telegram import TelegramNotifier
          token = os.environ.get('IDOS_TELEGRAM_BOT_TOKEN')
          chat = os.environ.get('IDOS_TELEGRAM_CHAT_ID')
          if not token or not chat:
              print('Telegram not configured, skipping notification')
              exit(0)
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          results = []
          sr = 'cache/scout_results.json'
          if os.path.exists(sr):
              results = json.load(open(sr)).get('results', [])
          passed = [r for r in results if r.get('passed')]
          screened = len(results)
          passed_count = len(passed)
          top5 = passed[:5]
          lines = ['📡 *IDOS Weekly Scout*']
          lines.append(f'🟢 *Pasaron el screening:* {passed_count}/{screened}')
          lines.append('')
          if top5:
              lines.append('*Top resultados:*')
              for r in top5:
                  lines.append(f'  {r[\"ticker\"]}: {r.get(\"scout_score\", \"?\")} pts')
          lines.append('')
          lines.append('✅ Scout completado sin errores')
          t = TelegramNotifier({'bot_token': token, 'chat_id': chat})
          t.execute({'message': '\n'.join(lines)})
          print('Telegram notification sent')
          "
      - name: Notify on failure
        if: failure()
        run: |
          python -c "
          import os
          from idos.workers.notifications.telegram import TelegramNotifier
          token = os.environ.get('IDOS_TELEGRAM_BOT_TOKEN')
          chat = os.environ.get('IDOS_TELEGRAM_CHAT_ID')
          if token and chat:
              t = TelegramNotifier({'bot_token': token, 'chat_id': chat})
              t.execute({'message': '🚨 *IDOS Alert*: Weekly Scout workflow FAILED'})
              print('Failure alert sent')
          "
