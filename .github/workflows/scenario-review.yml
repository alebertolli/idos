name: Scenario Review

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Opportunity ticker
        required: true
        type: string
      opp_id:
        description: Opportunity id
        required: true
        type: string
      scenario_hash:
        description: SHA-256 shown with the current Bear/Base/Bull proposal
        required: true
        type: string
      decision:
        description: Manager decision
        required: true
        type: choice
        options:
          - approved
          - rejected
      note:
        description: Short rationale for the decision
        required: true
        type: string
      sources_verified:
        description: Confirm only after opening each source and checking it supports the scenario and date
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scenario-review-${{ inputs.ticker }}-${{ inputs.opp_id }}
  cancel-in-progress: false

jobs:
  record-manager-review:
    # Manager review runs on an isolated test branch; never mutate production/main.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scenario-review dependency
        run: python -m pip install PyYAML

      - name: Validate and record manager review
        working-directory: idos-core
        env:
          REVIEW_TICKER: ${{ inputs.ticker }}
          REVIEW_OPP_ID: ${{ inputs.opp_id }}
          REVIEW_SCENARIO_HASH: ${{ inputs.scenario_hash }}
          REVIEW_DECISION: ${{ inputs.decision }}
          REVIEW_NOTE: ${{ inputs.note }}
          REVIEW_SOURCES_VERIFIED: ${{ inputs.sources_verified }}
          REVIEWER: ${{ github.actor }}
        run: >-
          python scripts/review_scenario.py --base-path ..
          --ticker "$REVIEW_TICKER"
          --opp-id "$REVIEW_OPP_ID"
          --scenario-hash "$REVIEW_SCENARIO_HASH"
          --decision "$REVIEW_DECISION"
          --reviewer "$REVIEWER"
          --note "$REVIEW_NOTE"
          --sources-verified "$REVIEW_SOURCES_VERIFIED"

      - name: Commit review record on selected branch
        env:
          REVIEW_TICKER: ${{ inputs.ticker }}
          REVIEW_OPP_ID: ${{ inputs.opp_id }}
        run: |
          review_path="idos-journal/companies/${REVIEW_TICKER^^}/case_file/opportunities/${REVIEW_OPP_ID}/scenario_review.yml"
          git add -- "$review_path"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Record manager scenario review for ${REVIEW_TICKER}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
