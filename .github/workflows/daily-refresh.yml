name: Daily Data Refresh

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e idos-core
      - name: Refresh data
        run: |
          python -c "
          import sys; sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          from idos.workers.data.refresh_worker import DataRefreshWorker
          from idos.workers.data.cache import DataCache
          from pathlib import Path
          import os, json, yaml
          from datetime import datetime
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          wl_path = Path('idos-journal/portfolio/watchlist.yml')
          if wl_path.exists():
              wl_data = yaml.safe_load(wl_path.read_text(encoding='utf-8'))
              tickers = [e['ticker'] for e in wl_data.get('entries', []) if e.get('ticker')]
          else:
              tickers = []
          print(f'[REFRESH] Loading {len(tickers)} tickers from watchlist.yml')
          refresher = DataRefreshWorker({'universe_path': ''})
          r = refresher.execute({'tickers': tickers})
          print(f'[REFRESH] Processed: {r.output.get(\"tickers_processed\", 0)} tickers')
          errors = r.output.get('errors', [])
          if errors:
              for e in errors:
                  print(f'[REFRESH] Error: {e}')
          Path('cache').mkdir(parents=True, exist_ok=True)
          summary = {'refreshed_at': str(datetime.now()), 'tickers': tickers, 'errors': errors}
          with open('cache/last_refresh.json','w') as f: json.dump(summary, f, indent=2)
          "
      - name: Populate earnings calendar from yfinance cache
        run: |
          python -c "
          import sys, os, json
          from pathlib import Path
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          from idos.workers.data.earnings_calendar import populate_earnings
          result = populate_earnings()
          print(f'[EARNINGS-CALENDAR] {result[\"tickers_found\"]} tickers con earnings')
          if result['added']:
              print(f'[EARNINGS-CALENDAR] Nuevos: {\", \".join(result[\"added\"])}')
          if result['updated']:
              print(f'[EARNINGS-CALENDAR] Actualizados: {\", \".join(result[\"updated\"])}')
          if not result['added'] and not result['updated']:
              print('[EARNINGS-CALENDAR] Calendario actualizado, sin cambios')
          "
      - name: Check earnings dates
        run: |
          python -c "
          import os, json, yaml
          from pathlib import Path
          from datetime import datetime, date
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))

          earnings_file = Path('idos-config/events/earnings.yml')
          if not earnings_file.exists():
              print('[EARNINGS] No earnings config found at idos-config/events/earnings.yml')
              exit(0)

          data = yaml.safe_load(earnings_file.read_text(encoding='utf-8')) or {}
          tickers = data.get('tickers', {}) or {}
          today = date.today()
          triggered = []

          for ticker, info in tickers.items():
              earnings_date_str = info.get('earnings_date', '')
              triggered_at = info.get('triggered_at', '')
              if not earnings_date_str:
                  continue
              if info.get('alias_of'):
                  print(f'[EARNINGS] {ticker}: alias of {info[\"alias_of\"]}, skip (primary will trigger)')
                  continue
              earnings_date = datetime.strptime(earnings_date_str, '%Y-%m-%d').date()
              if triggered_at:
                  print(f'[EARNINGS] {ticker}: already triggered on {triggered_at}')
                  continue
              if today < earnings_date:
                  print(f'[EARNINGS] {ticker}: earnings on {earnings_date_str}, not yet')
                  continue
              print(f'[EARNINGS] {ticker}: ready to trigger (earnings_date={earnings_date_str})')
              info['triggered_at'] = today.isoformat()
              triggered.append(ticker)

          if triggered:
              earnings_file.write_text(yaml.dump(data, default_flow_style=False, allow_unicode=True), encoding='utf-8')
              Path('cache/earnings_trigger.json').write_text(json.dumps({'triggered': triggered}), encoding='utf-8')
              print('[EARNINGS] Marked as triggered: ' + ', '.join(triggered))
          else:
              print('[EARNINGS] No tickers to trigger today')
          "

      - name: Entry Monitor - Check Buy List
        run: |
          python -c "
          import sys, os, json
          from pathlib import Path
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          bp = Path(os.environ.get('GITHUB_WORKSPACE', '.'))
          buylist_path = bp / 'idos-journal' / 'portfolio' / 'buylist.yml'
          if not buylist_path.exists():
              print('[ENTRY] No Buy List found')
              exit(0)
          import yaml
          data = yaml.safe_load(buylist_path.read_text(encoding='utf-8')) or {}
          entries = [e for e in data.get('entries', []) if e.get('monitoring', True)]
          print(f'[ENTRY] Monitoreando {len(entries)} oportunidades en Buy List')
          for e in entries:
              ticker = e['ticker']
              opp_id = e.get('opp_id', '')
              if not opp_id:
                  print(f'[ENTRY] {ticker}: sin opp_id, skip')
                  continue
              from idos.workers.portfolio.entry_monitor_worker import EntryMonitorWorker
              from idos.workers.base import WorkerStatus
              from idos.ai.service import LLMService
              from pathlib import Path
              _mp = Path('idos-config/models.yml')
              _llm_svc = LLMService(str(_mp)) if _mp.exists() else LLMService()
              w = EntryMonitorWorker({'llm_service': _llm_svc})
              result = w.execute({'ticker': ticker, 'opp_id': opp_id, 'base_path': str(bp)})
              if result.status == WorkerStatus.FAILED and result.error:
                  print(f'[ENTRY] {ticker}: ERROR - {result.error}')
                  continue
              r = result.output if hasattr(result, 'output') else result
              if r.get('entry_executed'):
                  print(f'[ENTRY] {ticker}: CONDICIONES CUMPLIDAS - Ejecutando entrada!')
              elif r.get('status') == 'skipped':
                  print(f'[ENTRY] {ticker}: SKIP - {r.get(\"reason\", \"sin razón\")}')
              else:
                  reason = r.get('reason', 'esperando condiciones')
                  print(f'[ENTRY] {ticker}: {reason}')
                  pz = r.get('price_in_zone')
                  ms = r.get('margin_of_safety_pct')
                  tp = r.get('target_price')
                  wc = r.get('wyckoff_confirmed')
                  wp = r.get('wyckoff_phase')
                  ta = r.get('thesis_active')
                  pf = r.get('portfolio_fit')
                  print(f'  price_zone={pz} margin={ms}% target={tp}')
                  print(f'  wyckoff={wc} phase={wp}')
                  print(f'  thesis={ta} portfolio_fit={pf}')
          "
      - name: Paper Trader - Execute Entry
        run: |
          python -c "
          import sys, os, json
          from pathlib import Path
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          bp = Path(os.environ.get('GITHUB_WORKSPACE', '.'))
          import yaml
          buylist_path = bp / 'idos-journal' / 'portfolio' / 'buylist.yml'
          if not buylist_path.exists():
              exit(0)
          data = yaml.safe_load(buylist_path.read_text(encoding='utf-8')) or {}
          entries = [e for e in data.get('entries', []) if e.get('monitoring', True)]
          for e in entries:
              ticker = e['ticker']
              opp_id = e.get('opp_id', '')
              if not opp_id:
                  continue
              from idos.workers.portfolio.entry_monitor_worker import EntryMonitorWorker
              from idos.workers.base import WorkerStatus
              from idos.ai.service import LLMService
              _mp = Path('idos-config/models.yml')
              _llm_svc = LLMService(str(_mp)) if _mp.exists() else LLMService()
              w = EntryMonitorWorker({'llm_service': _llm_svc})
              result = w.execute({'ticker': ticker, 'opp_id': opp_id, 'base_path': str(bp)})
              r = result.output if hasattr(result, 'output') else result
              if not r.get('entry_executed') or r.get('status') == 'skipped':
                  continue
              from idos.workers.portfolio.paper_trader_worker import PaperTraderWorker
              from idos.data.journal import JournalRepository
              journal = JournalRepository(bp / 'idos-journal')
              opp_yaml = journal.load_opportunity(ticker, opp_id)
              intrinsic = opp_yaml.get('intrinsic_value', 0) if opp_yaml else 0
              conviction = opp_yaml.get('conviction', {}).get('overall', 50) if opp_yaml else 50
              from idos.config import load_config
              cfg = load_config(bp / 'idos-config' / 'portfolio.yml') or {}
              pw = PaperTraderWorker(cfg)
              pr = pw.execute({
                  'action': 'buy',
                  'ticker': ticker,
                  'opp_id': opp_id,
                  'price': r.get('current_price', 0),
                  'conviction': conviction,
                  'intrinsic_value': intrinsic,
                  'base_path': str(bp),
              })
              print(f'[PAPER] {ticker}: {pr.get(\"status\")} - {pr.get(\"reason\", \"\")}')
              if pr.get('status') == 'executed':
                  print(f'[PAPER] {ticker}: {pr.get(\"quantity\")} shares @ \${pr.get(\"price\",0):.2f} = \${pr.get(\"value\",0):.2f} SL=\${pr.get(\"stop_loss\",0):.2f}')
          "
      - name: Risk Monitor - Daily stop-loss check
        run: |
          python -c "
          import sys, os, json
          from pathlib import Path
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          from idos.workers.portfolio.rebalance_worker import RiskMonitorWorker
          w = RiskMonitorWorker()
          result = w.execute({'base_path': os.environ.get('GITHUB_WORKSPACE', '.')})
          r = result.output if hasattr(result, 'output') else result
          alerts = r.get('alerts', [])
          if alerts:
              print(f'[RISK] {len(alerts)} alertas generadas:')
              for a in alerts:
                  print(f'  [{a[\"severity\"]}] {a[\"ticker\"]}: {a[\"message\"]}')
          else:
              print(f'[RISK] {r.get(\"positions_checked\", 0)} posiciones revisadas, sin alertas')
          "
      - name: Paper Trader - Execute Exits
        run: |
          python -c "
          import sys, os, json
          from pathlib import Path
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          bp = Path(os.environ.get('GITHUB_WORKSPACE', '.'))
          from idos.data.journal import JournalRepository
          from idos.config import load_config
          journal = JournalRepository(bp / 'idos-journal')
          cfg = load_config(bp / 'idos-config' / 'portfolio.yml') or {}
          from idos.workers.portfolio.paper_trader_worker import PaperTraderWorker
          pw = PaperTraderWorker(cfg)
          pos_dir = journal.base / 'paper' / 'positions'
          if not pos_dir.exists():
              print('[PAPER] No paper positions to check')
              exit(0)
          prices = {}
          for pf in pos_dir.iterdir():
              if pf.suffix == '.yml':
                  import yaml
                  p = yaml.safe_load(pf.read_text(encoding='utf-8')) or {}
                  ticker = p.get('ticker', '')
                  if ticker:
                      from idos.data.sqlite import SQLiteStore
                      db = SQLiteStore(bp / 'idos.db')
                      ph = db.get_price_history(ticker, limit=1)
                      if ph:
                          prices[ticker] = ph[0]['close']
          if prices:
              pr = pw.execute({'action': 'check_stops', 'current_prices': prices, 'base_path': str(bp)})
              exits = pr.get('exits', [])
              for ex in exits:
                  print(f'[PAPER] STOP LOSS: {ex.get(\"ticker\")} P&L={ex.get(\"pnl_pct\",0):+.2f}%')
              if not exits:
                  print('[PAPER] No stop losses triggered')
          else:
              print('[PAPER] No prices available for stop check')
          "
      - name: Monthly Portfolio Report
        run: |
          python -c "
          import sys, os, json, calendar
          from pathlib import Path
          from datetime import date
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          today = date.today()
          last_day = calendar.monthrange(today.year, today.month)[1]
          days_left = last_day - today.day
          if days_left > 2:
              print(f'[REPORT] No es fin de mes ({today.day}/{last_day}, faltan {days_left} dias)')
              exit(0)
          bp = Path(os.environ.get('GITHUB_WORKSPACE', '.'))
          from idos.data.journal import JournalRepository
          from idos.config import load_config
          journal = JournalRepository(bp / 'idos-journal')
          cfg = load_config(bp / 'idos-config' / 'portfolio.yml') or {}
          from idos.workers.portfolio.paper_trader_worker import PaperTraderWorker
          pw = PaperTraderWorker(cfg)
          from idos.timezone import AR_TZ
          from datetime import datetime
          now = datetime.now(AR_TZ)
          pr = pw.execute({'action': 'report', 'report_date': now.isoformat(), 'base_path': str(bp)})
          print(f'[REPORT] Status: {pr.get(\"status\")}, Path: {pr.get(\"report_path\", \"\")}')
          "
      - name: Post-Mortem - Check exited opportunities
        run: |
          python -c "
          import sys, os, json
          from pathlib import Path
          sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          from idos.data.sqlite import SQLiteStore
          from idos.data.journal import JournalRepository
          from idos.models.enums import OpportunityStatus
          bp = Path(os.environ.get('GITHUB_WORKSPACE', '.'))
          sqlite = SQLiteStore(bp / 'idos.db')
          journal = JournalRepository(bp / 'idos-journal')

          exited = sqlite.list_opportunities(status=OpportunityStatus.EXITED.value)
          if not exited:
              print('[POSTMORTEM] No hay oportunidades EXITED pendientes')
              exit(0)

          print(f'[POSTMORTEM] {len(exited)} oportunidades EXITED encontradas')
          for opp in exited:
              ticker = opp['ticker']
              opp_id = opp['id']
              pm_dir = journal.opportunity_path(ticker, opp_id) / 'post_mortem'
              if pm_dir.exists() and list(pm_dir.iterdir()):
                  print(f'[POSTMORTEM] {ticker} ({opp_id}): post-mortem ya existe, skip')
                  continue
              print(f'[POSTMORTEM] {ticker} ({opp_id}): generando post-mortem...')
              from idos.ai.service import LLMService
              _mp = Path('idos-config/models.yml')
              _llm_svc = LLMService(str(_mp)) if _mp.exists() else LLMService()
              from idos.workers.learning.post_mortem_worker import PostMortemWorker
              w = PostMortemWorker({
                  'llm_service': _llm_svc,
                  'prompts_path': 'idos-config/prompts',
              })
              result = w.execute({
                  'ticker': ticker,
                  'opp_id': opp_id,
                  'base_path': str(bp),
                  'exit_reason': opp.get('exit_reason', 'unknown'),
              })
              r = result.output if hasattr(result, 'output') else result
              status = r.get('status', 'failed')
              print(f'[POSTMORTEM] {ticker} ({opp_id}): {status}' + (f' — {r.get(\"pm_id\", \"\")}' if status == 'completed' else ''))
          "
      - name: Dispatch quarterly-results events
        run: |
          if [ ! -f cache/earnings_trigger.json ]; then
            echo "[DISPATCH] No earnings to dispatch"
            exit 0
          fi
          TICKERS=$(python -c "import json; d=json.load(open('cache/earnings_trigger.json')); print(' '.join(d['triggered']))")
          for TICKER in $TICKERS; do
            echo "[DISPATCH] Dispatching quarterly-results for $TICKER"
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/dispatches \
              -d '{"event_type":"quarterly-results","client_payload":{"ticker":"'$TICKER'"}}'
            echo ""
          done

      - name: Commit cache
        run: |
          git config user.name "idos-bot"
          git config user.email "bot@idos.local"
          git add cache/last_refresh.json 2>/dev/null || true
          git add cache/*.json 2>/dev/null || true
          git add idos-config/events/earnings.yml 2>/dev/null || true
          git add idos-journal/paper/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily data refresh $(date +%Y-%m-%d)"
            git pull --rebase --autostash -X theirs
            git push
          fi
      - name: 🐛 Report failure as GitHub Issue
        if: failure()
        run: python -m idos.workers.automation.gha_error_reporter

      - name: Upload cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-refresh-${{ github.run_id }}
          path: |
            cache/last_refresh.json
            cache/*.json
