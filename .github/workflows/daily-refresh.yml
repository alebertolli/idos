name: Daily Data Refresh

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e idos-core
      - name: Refresh data
        run: |
          python -c "
          import sys; sys.stdout.reconfigure(line_buffering=True) if hasattr(sys.stdout, 'reconfigure') else None
          from idos.workers.data.refresh_worker import DataRefreshWorker
          from idos.workers.data.cache import DataCache
          from pathlib import Path
          import os, json, yaml
          from datetime import datetime
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))
          wl_path = Path('idos-journal/portfolio/watchlist.yml')
          if wl_path.exists():
              wl_data = yaml.safe_load(wl_path.read_text(encoding='utf-8'))
              tickers = [e['ticker'] for e in wl_data.get('entries', []) if e.get('ticker')]
          else:
              tickers = []
          print(f'[REFRESH] Loading {len(tickers)} tickers from watchlist.yml')
          refresher = DataRefreshWorker({'universe_path': ''})
          r = refresher.execute({'tickers': tickers})
          print(f'[REFRESH] Processed: {r.output.get(\"tickers_processed\", 0)} tickers')
          errors = r.output.get('errors', [])
          if errors:
              for e in errors:
                  print(f'[REFRESH] Error: {e}')
          Path('cache').mkdir(parents=True, exist_ok=True)
          summary = {'refreshed_at': str(datetime.now()), 'tickers': tickers, 'errors': errors}
          with open('cache/last_refresh.json','w') as f: json.dump(summary, f, indent=2)
          "
      - name: Check earnings dates
        run: |
          python -c "
          import os, json, yaml
          from pathlib import Path
          from datetime import datetime, date
          os.chdir(os.environ.get('GITHUB_WORKSPACE', '.'))

          earnings_file = Path('idos-config/events/earnings.yml')
          if not earnings_file.exists():
              print('[EARNINGS] No earnings config found at idos-config/events/earnings.yml')
              exit(0)

          data = yaml.safe_load(earnings_file.read_text(encoding='utf-8')) or {}
          tickers = data.get('tickers', {}) or {}
          today = date.today()
          triggered = []

          for ticker, info in tickers.items():
              earnings_date_str = info.get('earnings_date', '')
              triggered_at = info.get('triggered_at', '')
              if not earnings_date_str:
                  continue
              earnings_date = datetime.strptime(earnings_date_str, '%Y-%m-%d').date()
              if triggered_at:
                  print(f'[EARNINGS] {ticker}: already triggered on {triggered_at}')
                  continue
              if today < earnings_date:
                  print(f'[EARNINGS] {ticker}: earnings on {earnings_date_str}, not yet')
                  continue
              print(f'[EARNINGS] {ticker}: ready to trigger (earnings_date={earnings_date_str})')
              info['triggered_at'] = today.isoformat()
              triggered.append(ticker)

          if triggered:
              earnings_file.write_text(yaml.dump(data, default_flow_style=False, allow_unicode=True), encoding='utf-8')
              Path('cache/earnings_trigger.json').write_text(json.dumps({'triggered': triggered}), encoding='utf-8')
              print('[EARNINGS] Marked as triggered: ' + ', '.join(triggered))
          else:
              print('[EARNINGS] No tickers to trigger today')
          "

      - name: Dispatch quarterly-results events
        run: |
          if [ ! -f cache/earnings_trigger.json ]; then
            echo "[DISPATCH] No earnings to dispatch"
            exit 0
          fi
          TICKERS=$(python -c "import json; d=json.load(open('cache/earnings_trigger.json')); print(' '.join(d['triggered']))")
          for TICKER in $TICKERS; do
            echo "[DISPATCH] Dispatching quarterly-results for $TICKER"
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/dispatches \
              -d '{"event_type":"quarterly-results","client_payload":{"ticker":"'$TICKER'"}}'
            echo ""
          done

      - name: Commit cache
        run: |
          git config user.name "idos-bot"
          git config user.email "bot@idos.local"
          git add cache/last_refresh.json 2>/dev/null || true
          git add cache/*.json 2>/dev/null || true
          git add idos-config/events/earnings.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily data refresh $(date +%Y-%m-%d)"
            git push
          fi
      - name: Upload cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-refresh-${{ github.run_id }}
          path: |
            cache/last_refresh.json
            cache/*.json
